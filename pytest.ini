[pytest]
# Self-tests for the kit (this meta-repo only). Downstream repos get the kit's
# own pytest.ini via bootstrap; this file just points pytest at tests/.
# Deliberate pairing, not drift: THIS meta-suite auto-partitions every test
# into smoke/slow via tests/conftest.py's collection hook (opt-OUT tiering; a
# new test is in the commit bar unless its module is listed slow), while the
# SHIPPED project-trajectory/pytest.ini uses opt-IN @smoke marks with unmarked
# tests running in the full tier.
testpaths = tests
# --strict-markers turns a typo'd tier marker into an error, not a silent skip.
# The smoke/slow tiers are auto-applied by tests/conftest.py's collection hook
# (WI-122): the per-commit bar is `-m smoke`, the full suite is unfiltered
# (close + CI). WI-281 re-tiered smoke to a BUDGET — it must run <= 60 s wall
# (~7 s measured) so it stays a real smoke test; the slow set is now every
# subprocess/scaffold-heavy module (not only the "end-to-end" ones), declared in
# conftest.SLOW_MODULES and budgeted by docs/stack.ini [smoke-budget] +
# tests/test_smoke_budget.py.
addopts = --strict-markers
markers =
    smoke: per-commit bar (<= 60 s); auto-applied to every in-process test except the SLOW_MODULES set
    slow: subprocess/scaffold-heavy (hook/gate/scaffold/heavy-script runs); runs at close + CI, not per commit
    full: optional label for the unfiltered pre-merge suite (unmarked tests run there anyway)
    release: slow/hardware/manual-adjacent; reserved for parity with the shipped template tiers

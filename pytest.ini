[pytest]
# Self-tests for the kit (this meta-repo only). Downstream repos get the kit's
# own pytest.ini via bootstrap; this file just points pytest at tests/.
testpaths = tests
# --strict-markers turns a typo'd tier marker into an error, not a silent skip.
# The smoke/slow tiers are auto-applied by tests/conftest.py's collection hook
# (WI-122): the per-commit bar is `-m smoke` (every test except the heavy
# end-to-end SLOW_MODULES set), the full suite is unfiltered (close + CI).
addopts = --strict-markers
markers =
    smoke: per-commit bar; auto-applied to every test except the SLOW_MODULES end-to-end set
    slow: heavy end-to-end integration (full hook/gate/scaffold runs); runs at close + CI, not per commit
    full: optional label for the unfiltered pre-merge suite (unmarked tests run there anyway)
    release: slow/hardware/manual-adjacent; reserved for parity with the shipped template tiers

method = """The verdict record's two halves, each driven beside its opposite so neither reads as a rule with one answer. THE IDENTITY, pure over synthetic `git ls-tree -r` entries: a listing and the same listing plus a round file, a log fragment and a session log fold EQUAL, while a changed work blob and a changed docs/work/ spec each fold DIFFERENT - so the exclusion is proven to be an exclusion rather than a fold that ignores everything. THE ENCODING BOUNDARY, driven through git rather than asserted about it: a record path holding a non-ASCII character - the shape git QUOTES, asserted in the fixture so it cannot silently stop reproducing - leaves the identity unmoved, while an accented WORK path moves it; and raw listings with one blob renamed from invalid-UTF-8 path byte 200 to 201 - asserted to COLLIDE under replacement decoding - fold DIFFERENT through tree_identity, so parsing and the ASCII record-prefix boundary occur before any decode. THE TRAILER GRAMMAR: format/parse round-trip; the LAST trailer in a message governs, so a rework commit quoting the round it answers does not have the quotation read as its own attestation; and three malformed shapes - a verdict word outside the enum, a 40-hex tree, a missing round count - each fail to PARSE rather than parse to something. THE NAME PARSE: a round file with and without the relaxed tag, the pre-train flat layout, a session log, and the legacy hand-authored rollup answering None because it names no reviewed sha. THE GATE, on a two-branch git fixture with the trunk checked out: a logged reviewer round naming the current tree clears it with NO rollup present anywhere; the same file with a BUILD session log behind it does not (the implementer-authored round); a SECOND round file committed behind that ONE session log, whose NAME claims the other declared phase, is not a second reviewer - both files are asserted committed and the single log with them, the entries carry the LOG's phase, so at a declared policy of 2 REV
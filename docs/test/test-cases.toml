method = """The rollup as DERIVED state, driven on a scaffold carrying one review scope. Regeneration writes docs/reviews/rollup/<train>.md with a row per round file. --check is proven to have ALL its answers rather than one: an absent file reports stale, a freshly written one reports fresh, and a new round arriving in the scope reports stale again. THE EXTRA ARM IS DRIVEN AND NOT MERELY ENUMERATED, because it was the arm that was broken while it was uncovered: a rollup for a retired review scope reports stale, and then the regenerator the failure message names is run and asserted to REMOVE it and to leave --check fresh - a report whose own remedy cannot clear it is an unbreakable failure, so the assertion is on the clearing and not on the reporting. THE FLAT PRE-TRAIN LAYOUT IS DRIVEN, and it is the arm the directory enumeration silently skipped: a round file sitting directly under docs/reviews/ reports stale, regenerates into the reserved flat stem carrying its row, and reports fresh - where before it produced no target at all and so a passing --check over an empty rollup directory. The one name collision the reserved stem leaves - a train directory called by that same name - is asserted REFUSED on both the check and the write arm rather than resolved by a last write, and removing both scopes is asserted to PRUNE the flat rollup, so the refusal is proven clearable by the same remedy the module's other arms name. The rendered header is asserted to carry the sentence that keeps the artifact honest about its own standing - that the merge gate does not read this file - since the whole hazard of a checked-in summary is a reader taking it for the authority. The declaration side is held by the generated-artifact wiring guard, which fails any [generated] row with no freshness enforcer, and by the work-branch stand-down set, asserted whole rather than sampled. THE TRUNK WIRING IS DRIVEN, NOT READ BACK OFF THE TABLE THAT DECLARES IT, because none of the arms above can see it: on a scaffold whose only armed artifact family is docs/reviews/, the trunk step's own regen is RUN - the generator is never called directly on this arm, which is exactly what every other arm here does - and the rollup is asserted to appear under it carrying the round file's row, beside the executed per-step line naming the step. Deleting the `verdict-rollup` regen row leaves the trunk module valid with no occurrence of that step left in it, every arm above still passing and the whole of the trunk step's own suite still passing; this arm fails and names the step that stopped running. THE EXCLUSIVE WRITER IS ENFORCED AND NOT ONLY DECLARED, driven in the shape that broke it: in a LINKED worktree checked out on a claimed branch the direct write is asserted to exit 2 and to leave NO rollup file behind - the arm where the generator returned 0, wrote the directory, and the work-branch freshness stand-down then hid the write - while the two exemptions are driven beside it rather than assumed, `--check` answering stale on the same worktree unrefused, and `--trunk-step` writing the rollup there because the station's refresh runs the trunk step inside exactly that lane worktree. The single-checkout fixtures every other arm here uses are their own trunk and keep writing, which is why the refusal had to be driven through a real linked worktree to be driven at all. Also run test_an_undeclared_trunk_refuses_each_caller_naming_the_key for the rollup write arm."""

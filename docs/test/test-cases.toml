s drawn while the row is still in active/. The two peels are then driven COMPOSING, a station refresh stacked on the close, because a lane produces them in that order. The refusals, and every one of them is driven with the OTHER clauses satisfied, so each is the single thing that turns its commit away. A close carrying a HAND-WRITTEN subject is an ordinary work commit and does not peel; a commit with the PUBLIC mechanical prefix/suffix but a FORGED middle is refused because the attestor derives the actual active/ -> complete/ WI ids from the no-renames git diff and re-composes their exact canonical subject; a close carrying the machinery's own subject that also touched a path OUTSIDE docs/work/ does not peel either; and INSIDE docs/work/ is not enough, because only the move itself may create or destroy - a close that SMUGGLED a brand-new spec in beside the move, and a close that DESTROYED an already-terminal archived record beside it, are each refused, since peeling either would measure a spec's injection or a judged row's deletion at the parent where no reviewer ever saw it. A close whose pairs came out of a SECOND lane's active/ directory is refused by the one-source-branch requirement, driven with everything else valid - paths confined, deletions paired with their own additions, the subject exactly the one the writer composes for those ids - so nothing but that clause can be answering. THE BATCH SHAPE is driven too, because it is the only one on which the writer's id order and the order the attestor re-derives from the diff could disagree: a TWO-row close, seeded in deliberately NON-canonical order, is asserted to peel to the judged rev, and the shared ordering helper is asserted to reorder them and to compose a subject the reversed order does not, so the arm cannot pass on a tie. All the refusal arms are asserted to leave the gate refusing BY NAME on the round no longer naming the current tree, which is the fail-toward-MORE-review direction every unverified identity-moving step here takes. THE WRITER IS DRIVEN AGAINST THE VERIFIER, not only against fixtures the test file composes itself: a REAL close is landed through handback.close_adjudication and the commit it produces is asserted to peel back to exactly the rev the lane was on, so an ordering or a spelling that drifted on either side is a red rather than a silently un-peelable close on every adjudication lane. THE EMPTY CLOSE is driven where it is OBSERVABLE and its consequence is stated rather than assumed to match the others: a commit carrying the composed subject and a single parent that changed NOTHING - a real --allow-empty commit, since a zero-path diff is the one close shape a fixture cannot reach by writing files - is asserted refused AT mechanical_close_attestation, and deliberately NOT asserted at the gate, because measurement says the gate cannot see this refusal at all. Its refusal is OVER-DETERMINED and no clause owns it, which is stated rather than glossed: the one-source-branch requirement turns it away first, and with THAT deleted the empty diff derives no ids at all, whose composed subject (`adjudicate:  -> complete/ (mechanical close)`) cannot equal the one the commit carries - so the exact-subject comparison refuses it regardless, and there is deliberately no third non-emptiness clause, which could only ever fire where these two already had. The consequence is asserted beside the refusal because they are the honest pair: an empty commit preserves the identity by construction, so governing_rev's walk-through step reaches the real close underneath either way, and a test asserting a gate refusal here would be asserting a behaviour the module does not have and should not, since a commit that changed nothing has invalidated no verdict. THE TWO PEELS' REFUSAL ARMS are held by tests/test_integrate_station.py, cited beside this module because integrate re-exports these very functions (refresh_attestation, work_tip) and the station suite is where a refresh can be produced rather than hand-written: a genuine refresh attested to the sha it produced; a forged Bar-Green trailer in three shapes, the sharpest being a genuine refresh message copied verbatim onto another commit; an amend that keeps the message while the tree moves, revoking the attestation; the deliberately forged attestation recorded as a STATED limit rather than a defence; and the reset peel's data-loss half - an honest work commit merely QUOTING the trailer is never peeled away, and a genuine refresh above it peels back to exactly that commit. BOTH carriers are driven, not only the convenient one: that non-empty telemetry commit, and then the EMPTY commit agent_common.commit_telemetry writes when a Review-Verdict attestation must land on unchanged bookkeeping - obtained by CALLING that producer rather than by hand, so the two cannot drift apart, and asserted to really be zero-path, because that is the commit shape a walk classifying PATHS could not classify and so stopped at, burying the refresh under the very commit that recorded the approval. A WORK commit above the refresh does re-owe and does refuse, so the walk is proven to step through what cannot invalidate a verdict rather than through everything. BOTH ORDERS of refresh and round, because only one of them was covered and the other was broken: the round drawn AFTER the refresh - the order the shipped path actually produces, since a lane's refresh is spawned as soon as its worker is DONE and before the merge slot runs, so any slot refusal parks a branch with a refresh and no round - cites the POST-refresh sha, asserted in the fixture to be that sha and not the pre-refresh one, and is asserted to serve the lane at both readers and to carry the coordinator's attestation under the key the cross-check looks it up by, while a rework above it still re-owes. THE ATTESTATION'S CARRIER IS SCOPED TO ITS OWN PATHS, on BOTH arms and not only the one that carries a pathspec: with an unrelated work file staged and the bookkeeping unchanged, the commit agent_common.commit_telemetry writes for NAMED paths and the one it writes for NO paths at all - the call this suite itself makes, and the arm where a scope appended only when paths exist evaporates - are each asserted zero-path with the caller's index left exactly as found, so work cannot land under a bookkeeping label nor an attestation ride a commit that changed the tree. THE DIAL: the three values over a brief-and-drafts matrix, an unrecognized value falling to when-minting rather than to never, and an adjudication lane closing with a successor draft merging with no verdict artifact of any kind under both never and when-minting, while a spine draft still owes its round. THE DIAL AT THE SCHEDULER, the half a reader could otherwise only take on trust: a committing ADJUDICATE session is driven through the loop's own bookkeeping arm on a closed-lane repository at every dial value - including the `always` no repository fixture had reached - and the review queue it leaves is asserted together with the train-scoped diff range and the recorded judging family, which is what "exactly as a committing BUILD does" has to mean. Its INPUT is driven beside it: a branch carrying its spec in BOTH homes, the terminal copy drafting a spine successor and a stale active copy an ordinary one, is asserted to answer the scheduler and the merge gate the SAME way, with the shared precedence also driven pure on a two-path list and on the empty one. THE SHARED DEFINITION, in BOTH its dimensions. WHICH TREE: the C2 review-owed derivation answers owed after a rework and served after a fresh round, and record-only commits after the verdict re-owe nothing. HOW MANY PHASES: at a declared policy of 2 a lone logged REVIEW-A APPROVE is REFUSED by name and the gate clears only once a governing REVIEW-B joins it at the same identity; and the half-drawn round a killed run leaves - REVIEW-A served, the in-memory phase queue gone - is answered by both readers together, the derivation naming REVIEW-B and ONLY REVIEW-B while the gate refuses, then both agreeing once it lands, with the same fixture asserted SERVED at policy 1 so the answer is proven to come from the declared count. The phase span is driven pure at the values neither caller reaches - a negative policy, which a bare slice would answer by slicing from the END, and an over-dialled one - and the one class the two readers must disagree on is pinned: a drawn but UNPARSEABLE verdict is not re-drawn and does not clear the gate either. THE TIER IS THE WHOLE CITED SET'S, not the majority's: 9 of these citations sit in test_integrate_admission, test_integrate_station and test_handback, all three named in tests/conftest.py SLOW_MODULES and so deselected by `-m smoke`, so Full is the cheapest tier at which EVERY arm above actually runs and Smoke would have claimed commit-floor coverage for a set the commit floor only partly runs. Tier and the pytest marker remain independent declarations that no check compares (registry-machinery-reference §12.2); this cell is labelled on the side that under-claims."""

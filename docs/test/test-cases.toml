method = """The rule driven on real git repositories, because its before-state IS the commit at HEAD. A settled Impl-tier spine is committed as the baseline, then one edit at a time is applied and the finding set asserted whole. THE FIRING ARM: an edit that lowers the effective stage while its row carries the phase the settled spine already stood in is a finding naming the row, the drop and the cause; the SAME edit re-tagged into a NEW higher phase produces nothing, and re-tagged into an ALREADY-OPEN LOWER phase also produces nothing - both readings of a moved scope are asserted, not just the forward one. THE EXEMPTION IS DRIVEN AS A PAIR AND NOT AS A DESTINATION: the DevStg-LLReqs -> DevStg-Arch decrease is asserted silent, and a two-rung decrease that merely ENDS at Arch is asserted to FIRE - the arm that separates the permitted decomposition cycle from a scope regression wearing its destination. THE ATTRIBUTED SET IS DRIVEN BEYOND THE SPINE TIERS: a component-only edit and a boundary-only edit that each lower the reading are asserted to produce their findings, since a rule that walked only SR/LLR/TC would be silent on exactly the frame rows that drop every phase at once. The re-drafted-child arm is driven (a row moved back to Drafted inside the standing phase fires), and the counterpart is asserted too: a NEW Drafted row cannot lower the effective stage at all, so it is not a finding under any tag. DEGRADATION IS ASSERTED AND NOT ASSUMED: with no git repository the rule returns the empty list rather than raising or complaining. THE CLI TIER IS ASSERTED ON BOTH SIDES: `--phase-rule` prints WARN and exits 0 on a finding, and `--strict` promotes the same finding to FAIL and exit 1 - the warn-first posture the requirement states as part of the obligation. Finally the rule is driven against THIS repository's own tree and asserted clean, so the check that guards authoring is itself observed passing on the artifact it guards."""

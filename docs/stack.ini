# docs/stack.ini — the kit meta-repo's own product toolchain, declared once.
#
# The "product" this repo builds is the kit under project-trajectory/; its tests
# live in tests/ (they bootstrap a real scaffold and exercise every script). This
# is the meta-repo's SELF-adoption of the process it ships — IMPROVEMENT_PLAN.md
# Thread 47. scripts under project-trajectory/scripts/check.py read this file.

[paths]
src = project-trajectory/scripts
tests = tests

[product]
format = {py} -m ruff format --check {src} {tests}
lint = {py} -m ruff check {src} {tests}
# `-n auto` runs the suite across all cores via pytest-xdist (WI-075). Every test
# is isolated in tmp_path and the meta-tree readers are read-only, so the suite is
# xdist-safe; subprocess coverage (tests/conftest.augment_env) holds per-worker
# (measured combined total 90.8%, unchanged from serial). Measured 2026-07-22 on
# a 24-core box: ~250 s parallel for the full 1374-test suite (~200 s for the
# smoke tier); the coverage step runs several times longer. These are snapshots,
# not contracts — re-measure locally before budgeting against them (the prior
# ~65 s figure predated the v4 dispatch/integrate suite growth and misled
# session budgeting for weeks; repo-review 2026-07-21 M-24).
# The `smoke` tier stays as declared; the coverage args below still apply.
test = {py} -m pytest -q -n auto

[tiers]
smoke = -m smoke
full = -m "not release"
release =
all =

[smoke-budget]
# WI-281: the per-commit smoke bar ([tiers] smoke, run by the session-protocol
# commit bar) must stay a real smoke test — "is it basically alive?" — not a
# re-run of the full suite. WI-122's opt-out default had inverted: 1088/1378
# (79%) of tests ran per commit at ~6 min wall. The budget is SPLIT in two,
# because a wall-clock assert is machine-/core-count-dependent and flaky:
#   seconds   = the wall-clock target at `-n auto`. The CI wall-clock check
#               (scripts/check_smoke_budget.py) times the smoke step against it
#               and ENFORCES it (exit 1 on breach): the re-tiered tier is
#               startup-dominated, not core-bound (~7.5 s/24 cores, ~10.5 s/2), so
#               60 s keeps ~5x headroom even on a small runner. `--mode warn` is
#               the local default (report-only) for convenience.
#   max-tests = the DETERMINISTIC membership ceiling — always-on, machine-
#               independent — that tests/test_smoke_budget.py enforces and that
#               BITES if the tier grows back toward the full suite. This is the
#               shared floor when the per-lane seconds differ.
# Both are growth SENSORS with headroom, not exact freezes (new in-process unit
# tests SHOULD accrue — the WI-122 intent). Re-stamp together, reason in the log.
# Measured 2026-07-23 (3.11.9, 24 cores): re-tiered smoke = 349 tests / ~7.5 s wall.
seconds = 60
max-tests = 450

[coverage]
# Subprocess coverage IS wired (Thread 47 Phase 6). This suite exercises the kit
# scripts as SUBPROCESSES (bootstrap a temp scaffold, run the real command), which
# `--cov` would otherwise miss, so tests/conftest.run_py starts coverage in each
# child (COVERAGE_PROCESS_START + tests/_cov/augment_env) and .coveragerc's
# [paths] folds each temp-scaffold */scripts/ copy back onto the source tree, while
# its [report] omit drops the temp-dir test fixtures so the number is the PRODUCT's.
# Product coverage measures ~91% on the PINNED toolchain (requirements-dev.txt,
# WI-104: pytest-cov ~=7, uniform now the kit floor is 3.11 — WI-262). The floor is 85 — a real
# REGRESSION SENSOR, not a formality: WI-105 (the 2026-07-12b review's M9). The pin
# fixed the flaky combine race that had degraded the measurement to ~82% (children
# silently lost from the combine on the old-local pytest-cov 4.1.0), but an 80 floor
# would have passed that ~82% silently — "1.83 points of plumbing luck". At 85 a
# renewed silent subprocess-coverage loss (~91% -> ~82%) turns the gate RED instead,
# with ~6 points of headroom for legitimate variation on both pinned Pythons. NB: an
# UNPINNED toolchain still reads the degraded ~82% and now fails here — that red is
# the intended nudge to `sh scripts/dev-setup.sh --install` onto the pinned tools.
threshold = 85
# `--cov-report=json` (writes coverage.json at the repo root) feeds the
# [step:module-coverage] per-module floors below (WI-279 / repo-review 2026-07-22
# M-4): the global {coverage} floor stays the aggregate backstop, and the JSON
# gives the per-module comparator its numbers. coverage.json is gitignored.
args = --cov={src} --cov-report=term-missing --cov-report=json --cov-fail-under={coverage}

[step:dupes]
# Duplicate-code gate (WI-078; check.py extra_steps). Fails on any copy-paste
# block of >= --min-tokens significant tokens between a file-PAIR not recorded
# in the census docs/dupes-allow (the default --allowlist path). The census
# grandfathers the current F5 small-helper duplication + the known intra-file
# debris; new duplication between an unlisted pair turns the G3 gate RED. Runs
# at G3 with the other product-layer quality gates (format/lint/tests).
command = {py} project-trajectory/scripts/check_dupes.py --src {src}
gates = G3
layer = product

[step:module-coverage]
# Per-module coverage floors (WI-279; repo-review 2026-07-22 M-4). The global
# [coverage] threshold above is one aggregate number, so a heavily-tested
# generator can subsidize thin coverage in a security/process boundary
# (agent_session.py, subagent_gate.py, plan_runner.py) while the headline still
# passes. check_coverage.py compares the per-file percents in coverage.json (the
# [coverage] --cov-report=json above) against the honest per-module minimums in
# docs/coverage-floors, failing G3 on a breach; the global --cov-fail-under stays
# the backstop. Runs after tests+coverage (check.py orders extra steps after the
# test step), so the JSON exists. `--tier {tier} --skip-tiers smoke` makes the
# smoke tier SKIP without reading the report, and check.py run-scopes coverage.json
# (clears a stale copy before the plan), so a prior full-tier report can never be
# graded as a current pass at the smoke tier (repo-review 2026-07-22 REVIEW-A) —
# the two together are the belt-and-suspenders fix. Raise a floor (in docs/
# coverage-floors) only alongside the focused tests that earn it.
command = {py} project-trajectory/scripts/check_coverage.py --tier {tier} --skip-tiers smoke
gates = G3
layer = product
# Serialize AFTER tests+coverage (it reads that step's coverage.json): this
# repo's CI runs `check.py --jobs 0` (parallel), where an un-laned step would
# race the producer, find no JSON yet, and SKIP — silently NOT enforcing the
# floors. `lane` puts it in the tests+coverage lane so it runs once the JSON
# exists (a no-op at --jobs 1, which is already ordered).
lane = tests+coverage

[arch-map]
# Symbol map over project-trajectory/scripts (Phase 6 authors docs/architecture.md).
mode = symbols

[generated]
# The parallel-dispatch integrator's auto-resolution allowlist (WI-235): a
# composition conflict CONFINED to one of these generated artifacts is resolved
# by REGENERATING from the merged sources instead of parking. agent_dispatch.py
# reads THIS section (the integrate worktree's own copy); an ABSENT section falls
# back to the byte-identical built-in defaults, a MALFORMED row fails closed to
# park. Each row: <path> = <kind> [| <BEGIN> | <END>]; kinds are
# trajectory | okf | status | archmap; a "/"-terminated path is a prefix. The
# skills index is deliberately absent (its per-agent copies are hand-authored
# source that must park, not regenerate — WI-231).
PROJECT_STATE.html = trajectory
docs/okf/ = okf
docs/architecture.md = archmap | <!-- BEGIN GENERATED MODULE MAP --> | <!-- END GENERATED MODULE MAP -->
docs/status.md = status | <!-- BEGIN GENERATED STATUS --> | <!-- END GENERATED STATUS -->

[agent-loop]
# The unattended coordinator's dials, declared ONCE here (IF-068, WI-274 part B)
# instead of duplicated across the three agent-resume.{cmd,sh,command} launchers
# — a one-dial owner change now edits THIS file, not the same value three times.
# agent_loop reads these at boot with the precedence: a CLI flag
# (--jobs/--model/--model-map) > the AGENT_* env slot > this file > the built-in
# default. A blank/absent key falls through to the env slot or the default.
#   jobs      the dispatcher worker ceiling (an int, 1 = serial, or `auto`);
#             built-in default 2, held at 1 until the §14 migration audits pass.
#   model     the fallback {model} tier when managed routing is off (AGENT_MODEL).
#   model-map per-phase fallback map "PLAN=...,BUILD=..." (AGENT_MODEL_MAP).
# Values below track the owner dial 2026-07-22: SERIAL (jobs=1) + Opus at both
# strong and medium (the owner has no Fable access).
jobs = 1
model = opus
model-map = PLAN=opus,BUILD=opus,REVIEW-A=opus,REVIEW-B=opus,DESIGN-CHECK=opus,CRITIQUE=opus

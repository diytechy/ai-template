groups = 0
copies = 0
lines = 0
# fig: cmd="python project-trajectory/scripts/check_dupes_census.py --root ." rev="77d67c38 and this commit's tree (WI-448 slice 4): 6/6/76 -> 0/0/0". The python -c one-liner this marker used to name is retired; WI-507 made that exact walk a named script, which is the whole point of the 0->A->B rule the census itself measures.

[step:dupes-census]
# The standing WI-448 census (see [dupes-census] above): reports the current
# reading against the stamped baseline, WARN-ONLY forever — never exits
# nonzero, not even under --strict (D-7 stays in force; only the measurement
# is re-armed). Product layer, DevStg-Impl, beside the other quality sensors.
command = {py} project-trajectory/scripts/check_dupes_census.py --root .
from-stage = DevStg-Impl
layer = product

[step:complexity]
# The per-function cognitive-complexity + SLOC census (check_complexity.py,
# WI-537), ARMED here on the OI-68 ruling (1c/2a/3a, 2026-08-30): --mode enforce
# runs the exact-equality compare against docs/complexity-baseline in BOTH
# directions and exits nonzero on either — growth ("simplify, or take a reviewed
# baseline bump whose reason lands in the log") and improvement ("re-stamp
# downward in the same commit, so the ratchet only ever tightens"). The census
# covers project-trajectory/scripts/ AND tests/ (2a; DEFAULT_INCLUDE), the larger
# tree and the one no other armed sensor watches; the module-size line ratchet
# stays scripts-only. This is THIS repo's posture (3a); the kit ships report-only
# and arming is an opt-in an adopter adds once its own false-positive rate is
# known. No inline suppression pragma exists — the central baseline is the one
# escape hatch. Re-stamp with:
#   python project-trajectory/scripts/check_complexity.py --root . --restamp
# and review the DIFF, never the run. Seeded 2026-08-30 (WI-538) at the current
# census: 200 rows over threshold 15 (180 scripts, 20 tests) — a DEBT STATEMENT,
# not an approval, as the baseline's own header says. Product layer, DevStg-Impl,
# beside the other quality sensors.
command = {py} project-trajectory/scripts/check_complexity.py --root . --mode enforce
from-stage = DevStg-Impl
layer = product

[step:module-coverage]
# Per-module coverage floors (WI-279; repo-review 2026-07-22 M-4). The global
# [coverage] threshold above is one aggregate number, so a heavily-tested
# generator can subsidize thin coverage in a security/process boundary
# (agent_session.py, subagent_gate.py, plan_runner.py) while the headline still
# passes. check_coverage.py compares the per-file percents in coverage.json (the
# [coverage] --cov-report=json above) against the honest per-module minimums in
# docs/coverage-floors, failing DevStg-Impl on a breach; the global --cov-fail-under stays
# the backstop. Runs after tests+coverage (check.py orders extra steps after the
# test step), so the JSON exists. `--tier {tier} --skip-tiers smoke` makes the
# smoke tier SKIP without reading the report, and check.py run-scopes coverage.json
# (clears a stale copy before the plan), so a prior full-tier report can never be
# graded as a current pass at the smoke tier (repo-review 2026-07-22 REVIEW-A) —
# the two together are the belt-and-suspenders fix. Raise a floor (in docs/
# coverage-floors) only alongside the focused tests that earn it.
command = {py} project-trajectory/scripts/check_coverage.py --tier {tier} --skip-tiers smoke
from-stage = DevStg-Impl
layer = product
# Serialize AFTER tests+coverage (it reads that step's coverage.json): this
# repo's CI runs `check.py --jobs 0` (parallel), where an un-laned step would
# race the producer, find no JSON yet, and SKIP — silently NOT enforcing the
# floors. `lane` puts it in the tests+coverage lane so it runs once the JSON
# exists (a no-op at --jobs 1, which is already ordered).
lane = tests+coverage

[arch-map]
# The AST-inventory mode over [paths] src (WI-455: consumed by the derived
# architecture readers — check_trajectory, the dashboard, check_doc_refs;
# `files` declares "no Python source", keeping those layers dormant).
mode = symbols

[generated]
# The §5.2 declaration (concurrency-restructure): the COMPLETE set of
# generated/derived artifacts the TRUNK LANE owns — every artifact a work
# branch must never commit and is never freshness-gated on off-trunk
# (check.py `_TRUNK_FRESHNESS_STEPS` skips those gates there), and the
# bookkeeping surface integrate.py's RULING-6 audit permits in non-merge
# trunk commits. One duty since Phase 5: the retired parallel dispatcher's
# auto-resolve allowlist (WI-235) read this same section as its second duty,
# and died with the dispatcher.
#   Each row: <path> = <kind> [| <BEGIN> | <END>]; a "/"-terminated path is a
# prefix; a marker pair means only the marked region is generated. The kinds
# name the regenerator: trajectory/status (gen_trajectory.py), okf
# (gen_okf.py), stage (derive_stage.py), openitems
# (gen_open_items.py), approve (trace.py --approve), skillsindex
# (gen_skills_index.py), promptcatalog (gen_prompt_catalog.py — the shipped
# prompts' digests, the join key a session log's `prompt-sha` names), cli
# (gen_arch_map.py --cli-doc — the shipped scripts' argparse surface, the
# generated home the IF registry's thinned CLI contracts point at). Only the
# generated INDEX.csv is declared — the per-agent skill COPIES stay absent,
# being hand-authored source (WI-231).
#   `trunk_step.py --regen` re-derives the five DOCUMENT families (its
# REGEN_STEPS — okf, derived-stage, trajectory, status, open-items; the
# derived stage cache deliberately BEFORE the dashboards, whose input it
# is, so they record one tree). The
# remaining rows are NOT regenerable by a command: the linecounts baseline is
# measured-and-classified DATA re-stamped by hand with a reason (§5.3 — a stamp
# is a reviewed edit, never a blind regen; `docs/dupes-allow` was the other row
# of that class until WI-426 deleted the census outright, D-7);
# docs/ratify/ briefs and the skills INDEX are regenerated by their own
# tools at the moments their sources change. That asymmetry is why
# REGEN_STEPS is a hardcoded subset of this section rather than derived from
# it: the section declares OWNERSHIP (what a branch must not touch), the
# steps encode which owners have a safe mechanical regenerator.
#   THE `docs/ratify/` PREFIX ROW COVERS TWO SHAPES SINCE WI-503, and the
# prefix declaration does not need to (and does not) distinguish them: the one
# regenerated file `CURRENT.md` (`trace.py --approve modified --out
# docs/ratify/CURRENT.md`, freshness-gated by `approval-fresh`) and the N
# IMMUTABLE dated briefs it is minted into one at a time (`trace.py
# --mint-approval-brief SLUG`), each write-once and enforced by the separate
# `approval-immutable` step (staged-tree, not freshness — see check.py
# `approval_immutability`). staged-divergence still reads the whole prefix
# correctly: CURRENT.md is the only member that is ever "regenerated but
# unstaged", and a dated brief that shows up there at all is already the
# approval-immutable violation, caught by its own step.
PROJECT_STATE.html = trajectory
docs/okf/ = okf
docs/status.md = status | <!-- BEGIN GENERATED STATUS --> | <!-- END GENERATED STATUS -->
tests/test_module_size_ratchet.py = linecounts
docs/stage = stage
docs/open-items.html = openitems
docs/requirements/components.derived.toml = components
docs/cli-reference.md = cli | <!-- BEGIN GENERATED CLI REFERENCE --> | <!-- END GENERATED CLI REFERENCE -->
docs/interface-reference.md = interface-reference | <!-- BEGIN GENERATED INTERFACE REFERENCE --> | <!-- END GENERATED INTERFACE REFERENCE -->
docs/ratify/ = approve
project-trajectory/skills/INDEX.csv = skillsindex
project-trajectory/prompts/CATALOG.md = promptcatalog

[agent-loop]
# The session engine's dials, declared ONCE here (IF-068, WI-274 part B)
# instead of duplicated across the three agent-resume.{cmd,sh,command}
# launchers — a one-dial owner change edits THIS file. agent_loop reads these
# at boot with the precedence: a CLI flag (--model/--model-map) > the AGENT_*
# env slot > this file > the built-in default. A blank/absent key falls
# through. (The dispatcher-era `jobs` worker ceiling retired with the
# parallel dispatcher at concurrency-restructure Phase 5; a declared value is

# --- CI moment -> tier: the ONE home for "which bar runs when" ---------------
# The section's contract, the row shape and the reason it exists are stated
# once, in the shipped template (project-trajectory/stack.ini.template
# [ci-tiers]); only THIS repo's values live here. They deliberately differ from
# the shipped ones, and the divergence is a VALUE one, which the dogfood rule
# allows: .github/workflows/test.yml is UN-TIERED. Its `gate` job runs
# `check.py --jobs 0`, whose `--tier` defaults to `all`, on every trigger, and
# its `test` job runs the whole unfiltered suite beside it. That is affordable
# and right here for a reason that does not generalise: this repo's PRODUCT IS
# THE HARNESS, so its own suite is the thing under test and running less of it
# remotely buys a few minutes at the cost of the only independent environment
# the kit gets. There is no `tag` row because the meta-repo publishes no version
# tags. tests/test_ci_tier_declaration.py holds both workflows to their own
# table — so dropping this repo's CI to a cheaper tier is a reviewed edit here,
# exactly as raising the shipped one is.
[ci-tiers]
push = all | the per-commit bar (CI sees the pushed tip)
pull_request = all | a work-item / slice close

[coverage]
# Subprocess coverage IS wired (Thread 47 Phase 6). This suite exercises the kit
# scripts as SUBPROCESSES (bootstrap a temp scaffold, run the real command), which
# `--cov` would otherwise miss, so tests/conftest.run_py starts coverage in each
# child (COVERAGE_PROCESS_START + tests/_cov/augment_env) and .coveragerc's
# [paths] folds each temp-scaffold */scripts/ copy back onto the source tree, while
# its [report] omit drops the temp-dir test fixtures so the number is the PRODUCT's.
# Product coverage measures ~91% on the PINNED toolchain (requirements-dev.txt,
# WI-104: pytest-cov ~=7, uniform now the kit floor is 3.11 — WI-262). The floor is 85 — a real
# REGRESSION SENSOR, not a formality: WI-105 (the 2026-07-12b review's M9). The pin
# fixed the flaky combine race that had degraded the measurement to ~82% (children
# silently lost from the combine on the old-local pytest-cov 4.1.0), but an 80 floor
# would have passed that ~82% silently — "1.83 points of plumbing luck". At 85 a
# renewed silent subprocess-coverage loss (~91% -> ~82%) turns the gate RED instead,
# with ~6 points of headroom for legitimate variation on both pinned Pythons. NB: an
# UNPINNED toolchain still reads the degraded ~82% and now fails here — that red is
# the intended nudge to `sh scripts/dev-setup.sh --install` onto the pinned tools.
threshold = 85
# `--cov-report=json` (writes coverage.json at the repo root) feeds the
# [step:module-coverage] per-module floors below (WI-279 / repo-review 2026-07-22
# M-4): the global {coverage} floor stays the aggregate backstop, and the JSON
# gives the per-module comparator its numbers. coverage.json is gitignored.
args = --cov={src} --cov-report=term-missing --cov-report=json --cov-fail-under={coverage}

[step:doc-refs]
# Prose reference rot (WI-062 tiering, wired in by WI-308). check_docs.py proves
# a markdown LINK resolves; this closes what links cannot see — a backticked
# repo path or a `sym:module.name` reference that names something no longer
# there. Wired only NOW, and that order was the point: the check reported 561
# findings before WI-062 split UNTRACED (explained by a mechanical reason —
# kit-relative, a record surface, or declared in docs/declared-absences) from
# DANGLING (real rot), and 22 after. Wiring at 561, or even at 22, would have
# added a wall of warns to every gate run, which is exactly how a check earns
# the ignore that WI-062 had just undone. WI-308 triaged the 22 to ZERO first;
# --strict gates on dangling alone, and the untraced COUNT still prints on every
# run so a classification whose size you cannot see never becomes a suppression
# list. Product layer at DevStg-Impl, beside the other quality gates.
command = {py} project-trajectory/scripts/check_doc_refs.py --root . --strict
from-stage = DevStg-Impl
layer = product

[step:figures]
# Declared-figure provenance (WI-392, rung 1). A driven figure that opts in
# under the declared-figure convention (process-options.md "Signed
# measurements") must carry the command that produced it and the revision it
# was driven at, or a derivation from declared figures. check_figures.py
# checks PRESENCE, never truth — its honest claim is "declared figures carry
# provenance", not "all figures do" (the marker is opt-in because digit
# detection drowns in ids, dates and byte budgets). Warn-first by design;
# --strict gates at DevStg-Impl beside the other product-layer quality checks.
# Re-derivation (running the recorded command) is rung 2, deliberately not
# built — the module docstring and docs/enforcement-audit.md record the
# declined reasons so it is never implied as covered.
command = {py} project-trajectory/scripts/check_figures.py --root . --strict
from-stage = DevStg-Impl
layer = product


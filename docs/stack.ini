# docs/stack.ini — the kit meta-repo's own product toolchain, declared once.
#
# The "product" this repo builds is the kit under project-trajectory/; its tests
# live in tests/ (they bootstrap a real scaffold and exercise every script). This
# is the meta-repo's SELF-adoption of the process it ships — IMPROVEMENT_PLAN.md
# Thread 47. scripts under project-trajectory/scripts/check.py read this file.

[paths]
src = project-trajectory/scripts
tests = tests

[product]
format = {py} -m ruff format --check {src} {tests}
lint = {py} -m ruff check {src} {tests}
test = {py} -m pytest -q

[tiers]
smoke = -m smoke
full = -m "not release"
release =
all =

[coverage]
# PROVISIONAL — reconciled in Thread 47 Phase 6. This suite exercises the kit
# scripts as SUBPROCESSES (bootstrap a temp scaffold, run the real command), so
# `--cov=project-trajectory/scripts` UNDER-reports unless subprocess coverage is
# wired (COVERAGE_PROCESS_START). Until Phase 6 resolves that, check.py --tier
# full is NOT wired into this repo's CI (which runs `pytest -q` directly); the
# threshold below is the target, not yet enforced.
threshold = 80
args = --cov={src} --cov-report=term-missing --cov-fail-under={coverage}

[arch-map]
# Symbol map over project-trajectory/scripts (Phase 6 authors docs/architecture.md).
mode = symbols

# --- prompts ------------------------------------------------------------------
# One declaration per job plus the purpose-specific briefs: the four adjudicator
# templates and the dual-plan critic. The critic has two because the kit ships
# two critic templates — critique.md is the artifact critique loop (the `critic`
# job's default brief, the way adjudicate-disposition.md is the adjudicator's),
# and dual-plan-critic.template.md is the planning-phase hat. Declaring only one
# left the other unrenderable and invisible to `prompt_render check`.
# `template` is REPO-RELATIVE. THIS repo is the kit, so its own templates live
# under project-trajectory/prompts/ and the paths below say so; an adopted repo
# receives them at prompts/ and its converted config says THAT. The renderer
# resolves the declared path against the repo root and adds no special case for
# either layout, which is why the two instances differ here and only here.
# `prohibited_sources` is the load-bearing cell: a judging role may never see the
# judged party's own assessment (SR-156), which is the general form of a live
# defect where an adjudication brief opened with the defendant's verdict.

[prompts.planner]
template = "project-trajectory/prompts/dual-plan-planner.template.md"
required_slots = ["GOAL_BRIEF", "IF_REGISTRY", "SR_SURFACE"]
allowed_sources = ["registry", "owner-prompt", "rubric"]
prohibited_sources = ["self-assessment", "rival-plan"]
output_schema = "plan-v1"

[prompts.critic]
template = "project-trajectory/prompts/critique.md"
required_slots = ["BRIEF", "VERDICT"]
allowed_sources = ["rubric", "registry"]
prohibited_sources = ["self-assessment"]
output_schema = "critique-v1"

[prompts."dual-plan-critic"]
template = "project-trajectory/prompts/dual-plan-critic.template.md"
required_slots = ["COVERAGE_REPORT", "GOAL_BRIEF", "IF_REGISTRY", "PLAN", "RUBRIC", "SR_SURFACE"]
allowed_sources = ["registry", "owner-prompt", "rubric", "rival-plan"]
prohibited_sources = ["self-assessment"]
output_schema = "critique-v1"

[prompts.arbiter]
template = "project-trajectory/prompts/dual-plan-arbiter.template.md"
required_slots = ["COVERAGE_REPORT", "GOAL_BRIEF", "OWNER_PROMPT", "PLAN_A", "PLAN_B", "RUBRIC"]
allowed_sources = ["registry", "owner-prompt", "rubric", "rival-plan"]
prohibited_sources = ["self-assessment"]
output_schema = "arbitration-v1"

[prompts.implementer]
template = "project-trajectory/prompts/worker.md"
required_slots = ["BASE", "SPECREF", "SRS", "TITLE", "WI"]
allowed_sources = ["registry", "spec", "diff"]
prohibited_sources = ["self-assessment"]
output_schema = "worker-v1"

[prompts.reviewer]
template = "project-trajectory/prompts/reviewer.md"
required_slots = ["VERDICT"]
allowed_sources = ["registry", "diff", "harness"]
prohibited_sources = ["self-assessment"]
output_schema = "review-v1"

[prompts.adjudicator]
template = "project-trajectory/prompts/adjudicate-disposition.md"
required_slots = ["BRANCH_CHANGES", "BRANCH_COMMITS", "CLASSIFICATION", "DECLARED_OUTCOME", "DOWNSTREAM", "HARNESS_RESULT", "SCOPE_AT_CLAIM", "SCOPE_DIGEST", "WI_ID", "WI_TITLE"]
allowed_sources = ["registry", "spec", "ledger", "harness", "diff"]
prohibited_sources = ["self-assessment", "worker-rationale"]
output_schema = "disposition-v1"

[prompts."adjudicate-amendment"]

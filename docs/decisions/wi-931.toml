[decision.D-004]
decided = "P5's LLR-026 detail keeps one approved clause beyond the spec's literal fourth substitution: 'A failure to end the tree, or to show that it ended, raises the named tree-end error; an ordinary launch error still returns the session error.' The original sentence joined that clause to the tree-end error by a semicolon, so replacing the sentence whole dropped it. The substitution targets the claim that no ordinary handler converts the error; the launch-error obligation is still met (P4's census keeps the launch conversion), and TC-026's new Expected, the spec's own text, still asserts it, so without the clause the sitting would meet an expectation no requirement in the set states. The lane's retained GPT Terra session made the edit; the other five cells equal the spec's text, checked mechanically after joining its wrapped lines."
alternative = "The spec's literal text, leaving TC-026 expecting what no requirement states for the sitting to return."
reversal_cost = "Low: one clause in one cell, judged at the checkpoint sitting."
why_not_escalated = "A retention inside the spec's meaning, which the sitting judges as wording (as wi-930 D-002)."
review = ""


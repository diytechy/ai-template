high_risk = []

[decision.D-001]
decided = "WI-917 changed only the overnight launcher, its headless block and the coordinator-cycle skill's headless section, which the attended cycle does not run through. The machinery rule (revision 37: the next machinery lane lands only after the cycle has run through the last one's changed step) therefore holds no later attended landing behind it; its changed step is first exercised by the first headless run, which stays the owner's call."
alternative = "Hold every later landing until a headless leg has run, which the owner has not yet released."
reversal_cost = "Low: no later landing has relied on it yet."
why_not_escalated = "The rule's own text names the cycle's changed step; the attended cycle has none here."
review = ""

[decision.D-002]
decided = "WI-943's build is held until WI-942 lands. WI-943 soft-needs WI-942, and both change the merge slot's reading of an acted row (WI-942's lane_acted_set, WI-943's MEANING authorization beside it), so building WI-943 on WI-942's landing avoids a cross-lane rebase through the same functions. WI-943's plan, critique (APPROVE, 0 findings) and pass record are committed in its lane."
alternative = "Build both at once and resolve the overlap at WI-943's rebase."
reversal_cost = "Low: the lane is planned and passed; its build can start at any time."
why_not_escalated = "Landing order and lane scheduling are the coordinator's; the row's soft need names the order."
review = ""

[decision.D-003]
decided = "WI-925's and WI-926's second plan critiques (Codex Sol, medium, convergence stance) each returned CHANGES-REQUESTED with one MAJOR, at the plan cap. WI-925: the relink remap recognizes only an active-folder deletion paired with a closed work item's addition, not a standalone spec archived in the same staged delta, which deliverable 3 and D8 promise. WI-926: the new shipped kitlib module has no step registering it in the bootstrap manifest's MAPPING, so a fresh scaffold would receive importers without it (an existing scaffold test, test_the_common_package_ships_complete, asserts the package ships whole). By the skill's plan step 4 each goes to one dispute sitting, and only an accepted DISMISS lets a pass record be written; a FIX, SUCCESSOR or ESCALATE goes to the owner and the lane closes partial. Both sittings are left to the next session, which this session's context budget could not carry through to a verdict; each lane holds at its filed second critique with no build."
alternative = "Sit both now and close out mid-sitting, or ask the owner to rule the findings directly, which the plan cap's procedure reserves for after the sitting."
reversal_cost = "None: the lanes hold, unbuilt."
why_not_escalated = "The skill's plan step names the dispute sitting as the next step; nothing has yet reached the owner."
review = ""

[decision.D-004]
decided = "Owner direction, 2026-10-18 (attended, in session): orient the queue toward headless runs so the handoff's Overnight: stop line can be cleared and the rest of the queue continues overnight. The coordinator records it as a reorder and a gate. The gate rows: WI-918 (the merge slot reads an attended re-claim, without which a leg must hand every attended-claimed lane back) and one new row filed on trunk for the overnight launcher's follow-ups that status.md lists before the first headless run (bind trunk once per run, not re-read from the primary checkout before every leg; refuse a leg that rewinds archive/lanes, if the audit does not already; and, if the scope critique keeps them, one checked claim reader shared with the merge slot and a stated binding for a ref created and deleted inside one leg). Order: WI-927 and WI-943, already at their checkpoints, land first; the two gate rows are claimed in the next scoped unpause, built beside them, and land next, ahead of WI-925 and WI-926. When both gate rows have landed, the session that lands the second writes its handoff without the Overnight: stop line, and the owner starts the launcher. From then on the queue runs in headless legs under the coordinator-cycle skill's section 7, which supersedes the 2026-10-11 line that this program's coordination runs interactively; owner-held steps still go to the owner through each new handoff."
alternative = "Land all four in-flight lanes attended first, then the gate rows; it delays the first headless run by those lanes' remaining sessions."
reversal_cost = "Low: a queue order and a handoff line."
why_not_escalated = "The owner's own direction; the coordinator only orders the gate rows."
review = ""

[decision.D-005]
decided = "Filing calls for WI-946, the overnight launcher's follow-ups row that D-004 gates the first headless run on, from a Claude Opus drafter that read the code and reproduced each follow-up on scratch repositories. Owner, 2026-10-18 (attended, in session), asked one call at a time: C1, the one checked claim reader shared with the merge slot (the slot's copy reads a failed claim log as unclaimed): KEEP it in WI-946, over the coordinator's recommendation to split it into its own row, so WI-946 ships kit code and owes a RESYNC entry, the spine amendments its reader carries and a checkpoint sitting. C3: the run also stops when a leg leaves the primary checkout off the bound trunk, checked before every leg and last in every audit, beyond D-004's literal 'bind trunk once per run', because the next prompt, the Overnight: stop line, the progress check and the leg's working directory follow the checkout. C4: WI-918's spec is amended at its claim to name the launcher's lane audit and check-lane as callers of the lane-window reader, with a Done-when line that check-lane reads a re-claim as the merge slot does. C5: a leg that deletes archive/lanes is refused with one that rewinds or resets it, since the archive is append-only by recipe; WI-917's 'logged, not judged' rule stays for lane branches. The coordinator's own call, C2: the run binds trunk once through the kit's existing trunk reader and the launcher's own reader is deleted, so WI-925, which re-points that reader to the declared trunk name, needs no launcher edit. The stated binding for a ref created and deleted inside one leg, and for a merge's non-first-parent commits on trunk, stays in WI-946 as Trust text."
alternative = "C1: split the shared claim reader into its own row (the coordinator's recommendation), keeping WI-946 a this-repo-only change; the owner ruled to keep it. C2: keep the launcher's own trunk reader, read once per run, for WI-925 to re-point."
reversal_cost = "Medium for C1: a shipped reader and its spine amendments; low for the rest."
why_not_escalated = "C1, C3, C4 and C5 are the owner's rulings in session; C2 is an implementation choice that removes a second home."
review = ""

[decision.D-006]
decided = "Owner direction, 2026-10-18 (attended, in session, after the 2026-10-18g close-out), on the coordinator's recommendation: the next attended session lands WI-946, the second gate row of D-004, and closes out right after it, landing no other lane; its handoff drops Overnight: stop and the owner starts the overnight launcher. The owner's condition was that the headless legs can pick up the lanes already claimed attended, which the coordinator checked against the coordinator-cycle skill's section 7: the lane-mode rule asks for a re-claim only when an attended session takes over a lane a leg marked; a leg continuing an attended lane needs none, since its first loop-writer commit (a sitting's telemetry, say) opens the lane's trailer window, every leg commit carries the trailer, and the attended commits before the window stay exempt, so check-lane passes the lane at landing. Why stop at WI-946: the other open lanes are mid-cycle (WI-925 at stage 3, WI-926 before round 1, WI-798 owing its checkpoint rework, WI-902 to be re-cut), and the machinery rule lands the next machinery lane only after the cycle has run through WI-946's changed step, the launcher, which a headless run first exercises."
alternative = "Land every open lane attended before the first headless run; rejected, several sessions of work the legs exist for, and the machinery rule holds the next machinery lane behind a launcher run anyway. Or let the session advance other lanes without landing them; not chosen, to keep the hand-over point simple."
reversal_cost = "Low: a handoff line."
why_not_escalated = "The owner's own direction."
review = ""

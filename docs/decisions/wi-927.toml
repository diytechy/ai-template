high_risk = []

[decision.D-001]
decided = "The lane is cut at trunk's 6533a2331 (the claimed branch had no commits of its own, recipes section 2), claimed under the 2026-10-17e session's first scoped unpause (coordinator-2026-10-17 D-008). The row is claimed planmode single, so the lane planned first: a fresh Claude Opus planner wrote the plan; critique 1 (Codex Sol, medium) asked for changes with one MAJOR, the one revision answered it, and critique 2 in convergence stance approved it with no findings; the pass record binds it. This session rebased the lane onto trunk's c58293d54 (clean; pre-rebase tip 56d92994a, archived at landing). The plan makes each row one commit, so build round 1 runs in stages on one builder (Claude Opus at medium, the kit-builder agent): P1, P2 and P3, each verified and committed by the coordinator before the next; P4 is Terra's intent turn and P5 the landing's. The row changes coordinator_guard.py, the lease tool this session runs on, so the builder was told never to run the guard against this machine's lease or home and never to touch the real ~/.claude or the committed settings; every test points the guard at a temporary home and repository. The row changes the machinery the cycle runs on, so it lands alone. Review rounds run two full-lane reviewers in parallel, Codex Sol at medium (REVIEW-A) and Claude Opus at high (REVIEW-B, the ruling-7 stand-in; coordinator-2026-10-16 D-008)."
alternative = "Build all three rows in one round, against the plan's one-commit-per-row shape."
reversal_cost = "None: the lane is new."
why_not_escalated = "The skill's plan, build and staged-commit steps."
review = ""

[decision.D-002]
decided = "P1's builder folded the plan's 19 parametrized reading cases into one looping test, because with them the smoke tier collected 2717 against max-tests 2715. Overruled: the plan's parametrized form is restored, and no lane folds parametrized cases to stay under the ceiling, since that bends a check to green a step. The ceiling is re-stamped instead, as the recipes require of in-process growth: this lane carries the same re-stamp, byte for byte, that wi-916 D-004 made (2825, about 4% headroom over 2717, its note and fig line unchanged), so the two lanes merge cleanly whichever lands first. P2 and P3 keep the plan's parametrized tests too."
alternative = "Keep the loop, which hides 18 cases from the tier's membership count and departs from the binding plan."
reversal_cost = "One stack.ini hunk, identical to wi-916's."
why_not_escalated = "The recipes' re-stamp rule (section 6) and the standing rule never to sanction a check to green a step; the seconds budget is unchanged."
review = ""

[decision.D-003]
decided = "Stage P2, the one atomic producer and consumer swap, is built and committed by the coordinator. The builder reported one departure from the plan's text: the PowerShell dev-setup offer does not capture the guard's stderr, because Windows PowerShell cannot capture a native command's stderr while that command's question still shows at the console; its missing line says the reason is printed above, which is the guard's own stderr, and the two sh copies capture it as the plan says. Kept as built, for the reviewers to judge against the Done-when. coordinator_guard.py now reads 999 SLOC against the 1000 limit, so P3, which crosses it, moves install_hooks and consent_install whole into kitlib/guard_hooks.py, as the plan's rule states. Three readers of the old surface remain for P4 and P5 (the CLI reference, the IF-280 data cell, a comment in the bootstrap manifest). The builder ran five POSIX-only pseudo-terminal cases nowhere, since they skip on Windows; they are owed a POSIX run before the landing (WSL, recipes section 7)."
alternative = "Hold P2 until the PowerShell offer captures stderr, which the platform does not allow while the question is shown."
reversal_cost = "One commit."
why_not_escalated = "A platform constraint inside the plan's own surface, reported by the builder and left to the review rounds."
review = ""

[decision.D-004]
decided = "Stage P3, the lease take reading the hooks before the lock, is built and committed by the coordinator. coordinator_guard.py crossed the 1000-SLOC limit, so install_hooks and consent_install moved whole into kitlib/guard_hooks.py, as the plan's rule states; hooks_state moved with them, since both call it and leaving it behind would need a circular import or a wrapper, and LLR-322's code_symbol now lists it while LLR-300's drops it (traced). One departure from the plan's text, kept as built for the reviewers to judge: the plan's caveat said a running Claude Code session snapshots its hooks at start, but the current Claude Code hooks documentation (\"Disable or remove hooks\") says direct edits to hooks in settings files are normally picked up by the file watcher, so the builder's message says the hooks guard sessions started from now on, that a running session usually picks up the edit itself, and that its /hooks menu shows whether it has, else restart it. Three more POSIX-only pseudo-terminal cases skip on Windows, joining D-003's five as owed a POSIX run before the landing (WSL, recipes section 7)."
alternative = "Keep the plan's snapshot wording against the current documentation."
reversal_cost = "One message string."
why_not_escalated = "A factual correction to a message inside the plan's own surface, hedged to what a user can check, and left to the review rounds."
review = ""

[decision.D-005]
decided = "The lane was rebased onto trunk's 2268a9a8c, cleanly (pre-rebase tip 7d8032e10, archived at landing beside 56d92994a). P4, the intent set, is GPT Terra's (gpt-5.6-terra at medium; the lane's retained session 01a14fe5-d655-7423-8395-7a69f1a2f012): LLR-322's title, detail and rationale and TC-345's method and expected are rewritten to the plan's drafts, since the approved text described the merging install this lane deletes; LLR-300's detail gains the plan's one sentence by addition (its approved text kept verbatim, checked mechanically); IF-280's data cell reads [--offer] for [--enable]. Beyond the plan's text, TC-345 now also verifies LLR-300 and its parents SR-229 and SR-237, because its evidence drives the lease take and a TC citing an LLR cites that LLR's SRs; the sitting judges it. The builder's note that LLR-300's code_symbol lacks consent_install was refuted by the back-link rule (those functions tag LLR-322 in guard_hooks.py; take tags LLR-300), so that cell is unchanged. The coordinator checked mechanically that only these cells changed and that no touched file holds a CR byte. Terra's own pytest run failed in its sandbox on Git's sh.exe (CreateFileMapping, Win32 error 5), so the coordinator ran the set: 359 passed, 11 skipped. P5 (a Claude Opus builder at medium): the RESYNC_PACK entry anchored at the lane's base, the bootstrap manifest's guard_hooks comment, and the regenerated CLI reference. Since WI-916 landed, the bar refuses a shipped change without its entry, so P5's entry rides P4's commit instead of following it. The interface reference regenerates at the landing; status.md's hooks --enable mention and WI-897's queued row are amended on trunk at the landing (the plan's deliverable 6)."
alternative = "Leave TC-345 verifying only SR-032 and LLR-322, which registry-integrity refuses while its evidence drives the take."
reversal_cost = "Low: unjudged until the checkpoint sitting."
why_not_escalated = "The skill's intent step; the plan's own P4 and P5 text."
review = ""

[decision.D-006]
decided = "Counted round 1 over 3b26e922b: Codex Sol at medium (REVIEW-A, 001) CHANGES-REQUESTED with 1 MINOR; Claude Opus at high (REVIEW-B, 002, the ruling-7 stand-in for the Gemini slot) CHANGES-REQUESTED with 2 MAJOR and 2 MINOR. Triage: REVIEW-B F1 (MAJOR), at a real POSIX terminal the shell dev-setup's offer captures the guard's stderr, where the consent question is written, so the question is never shown; confirmed on a pty by the reviewer, a defect reachable on every interactive POSIX first run. REVIEW-B F2 (MAJOR), five pseudo-terminal tests this lane adds fail on POSIX because their scaffold copy has no git repository and the fed answers accept the pre-commit floor offer; the coordinator's own POSIX run (WSL Ubuntu at 3b26e922b) found the same five, beside two run.command reds that also fail at the base 2268a9a8c and are not this lane's. Both MAJORs cost a fix round. REVIEW-A F1 (MINOR), JSON null in the settings file or an event reads absent where the Trust section requires occupied; it is in the same module the fix round touches, so it is fixed in that round, not deferred. REVIEW-B F3 (MINOR), the Done-when's ratchet-entry line cannot be met as written (no entry exists; the module grew when the install moved into it at the size limit), and REVIEW-B F4 (MINOR), SR-229's acceptance still reads the freed-lease take as unqualified: both go to the spine change list for the checkpoint's combined sitting, F3 as a Done-when amendment judged there, F4 as SR-229's wording or a recorded reading that the take's hooks refusal is LLR-300 detail. The fix runs in two stages on one builder: coverage plans first, then the fix."
alternative = "Defer REVIEW-A F1 to a successor row; rejected because the fix round already edits that reader."
reversal_cost = "Low."
why_not_escalated = "The skill's triage step; the POSIX evidence was owed before the landing (D-003, D-004)."
review = ""

[decision.D-007]
decided = "Fix round 1, in two stages on one Claude Opus builder (medium). Stage 1 confirmed all five findings on the real path and wrote one coverage plan per round file; the coordinator re-ran both gates (plan_coverage exit 0 each) and ruled the stop points: REVIEW-B F3 and F4 go to the checkpoint sitting (their proposed texts in the fix's spine change list); an example file holding JSON null reads none, which the spec's Trust section does not rule, so it goes to status.md's follow-ups, not the build; the other input() callers outside the surface capture no stderr and need nothing. Stage 2 built: a missing settings file or event is a sentinel no parsed JSON value equals, so a JSON null reads occupied and is never written (REVIEW-A F1); the consent question is written to stdout and flushed before the read, at the one ask the lease take and the offer share, so a POSIX terminal shows it while the sh offer captures stderr (REVIEW-B F1); the five pseudo-terminal tests answer no, so a later offer never meets a missing repository (REVIEW-B F2). LLR-322's code_symbol gains the new ask (traced). The new null cases failed on the pre-fix code on Windows; the coordinator re-ran the six modules (450 passed, 12 POSIX-only skips) and the bar, and runs the POSIX-only cases in WSL at this commit. The RESYNC entry stays true unchanged."
alternative = "Fix the two sh offers' capture instead of the ask; rejected because the take's CLI shares the ask and one place fixes both."
reversal_cost = "Low."
why_not_escalated = "The skill's two-stage fix round."
review = ""

[decision.D-008]
decided = "Counted round 2 over 9bbcfb351: Codex Sol at medium (REVIEW-A, 003) CHANGES-REQUESTED with 1 MINOR; Claude Opus at high (REVIEW-B, 004, the ruling-7 stand-in for the Gemini slot) CHANGES-REQUESTED with 5 MINOR. No BLOCKER or MAJOR, so no fix round is owed and the checkpoint follows. Triage: REVIEW-A F1 and REVIEW-B F2 are one defect: the failed-install texts name the file and the error but not the fix the Trust section asks for (move or repair the file, then run again), and the PowerShell offer only points above. REVIEW-B F1: on Windows the take's terminal predicate reads a stdin on NUL as a terminal, so an agent's take prints the question, reads EOF and refuses DECLINED, an instruction it cannot follow, where deliverable 3's no-terminal refusal names dev-setup's consent step; fail-closed either way, and the e2e test's assertion matches both texts. REVIEW-B F4: LLR-322's code_symbol lists take, whose tag names only LLR-300, the take's hooks reading carries no tag, three moved symbols sit in the wrong segment, and LLR-300's test_refs lack TC-345 (trace fields). These three are in the lane's surface and cheap, so the builder fixes them before the checkpoint, where the gate reviews them, in two stages (coverage plans, then the fix). REVIEW-B F3 (the Done-when's ratchet line, round 1's REVIEW-B F3 again) and REVIEW-B F5 (SR-229's acceptance, round 1's F4 again) go to the checkpoint's combined sitting with the fix's spine change list, as D-006 and D-007 route them."
alternative = "Send the three code and trace MINORs to a successor row; rejected because the fixes are a few lines in modules the lane already changes."
reversal_cost = "Low."
why_not_escalated = "The skill's triage step: a MINOR costs no round."
review = ""

[decision.D-009]
decided = "The round-2 MINOR fix, before the checkpoint, in two stages on one Claude Opus builder (medium). Stage 1 confirmed every finding on the real path (on this Windows box a NUL stdin read as a terminal: isatty true, GetConsoleMode false) and wrote one coverage plan per round file; the coordinator re-ran both gates (exit 0) and ruled the stage. Stage 2: one fix constant ('move or repair that file, then run again') appended to both consent_install failure texts; the take's terminal predicate requires, on Windows, that GetConsoleMode succeeds on stdin's handle; both PowerShell offers start the guard through ProcessStartInfo with only stderr redirected, so the question still reaches the console and the [missing] line carries the guard's text (file, error and fix); LLR-322's code_symbol and the new tags follow the functions, take stays in LLR-300's cell, LLR-300's test_refs gain TC-345, and TC-345's evidence gains the four new tests (traced cells). The new tests failed on 0c41237c9 (7 failed; the POSIX twin red in WSL) and pass now; the lane's modules pass (450). The coordinator's further ruling, that each offer's [missing] line be counted in a missing total as the Trust section reads, stopped the builder correctly: the offering tiers print no total at all (only the --check tier does, and it never offers), so counting would add a new line to every install tier across four files. It goes to the checkpoint's combined sitting with F3 and F5: either the Trust sentence is read as the readiness check's count, which already counts a failed hooks reader, or the row owes a new total. Follow-ups outside the surface go to status.md (bootstrap.prompt_choice's isatty; no cell-to-tag or verifies-to-test_refs check; the occupied fix text on an unparseable file; a crashed reader's traceback-only line). The PowerShell argument join assumes no spaces, which holds for the guard's constant arguments, and its comment says so."
alternative = "Keep the PowerShell offers pointing to the text printed above."
reversal_cost = "Low."
why_not_escalated = "The skill's two-stage fix and the triage in D-008; the counting question is the sitting's."
review = ""

[decision.D-010]
decided = "The checkpoint's reconcile and the three questions D-008 and D-009 left to it. GPT Terra, resumed in the lane's retained session (01a14fe5-d655-7423-8395-7a69f1a2f012), reconciled the set against the settled code at 4b20a7bc3: LLR-322's detail now states that a missing file or all missing guard events read absent and a parsed null reads occupied, that the shared consent question shows before its answer is read, that on Windows a character device that is not a console is no terminal, and that a failed consented install refuses the take without recording a holder, naming the file, error and fix, while the offer reports it missing; LLR-300's lane-added last sentence opens 'After identifying a session' (its approved text kept byte for byte, checked mechanically); TC-345's method and expected follow, so each expected clause is stated by LLR-322 or LLR-300; IF-280 is unchanged. The coordinator wrote the two spec edits itself, in the Trust section only. (1) REVIEW-B F3, the Done-when's ratchet line: the lane's row is planmode single, and its pass record binds the Done-when digest, so a Done-when edit would make the plan gate refuse every later commit outside the record homes (the act's registry commits, the rebase's RESYNC re-anchor) until a fresh plan critique passed, with the plan's critique cap already spent; the recipe's route after the second critique is the Trust section, so a Trust note reads the line as met when the module holds no merge or ownership code and no ratchet entry is added for it (the module stays below the threshold). (2) D-009's counting question: the code answers it. Every tier prints the readiness report first, which counts a failed hooks reader with the other missing components; the offer runs after that count, so its [missing] line is never counted, and the offering tiers print no total. The Trust sentence that put the offer's line in the count is corrected to say so. (3) SR-229 is unchanged: the Done-when says its acceptance is checked at the sitting and gains the hooks refusal only if the sitting reads its admission list as exhaustive, so the sitting's brief puts that question with SR-229 in its scope. Next: the closure check, then one combined sitting over LLR-322, LLR-300 and TC-345 (amendments); IF-280 is Drafted and its data cell is not judged."
alternative = "Edit the Done-when line as the spine change list proposed, and re-pass the plan; rejected because the plan's critique cap is spent, so it would go to the owner for a line whose purpose is already met and pinned by test_guard_hooks_holds_no_merge_or_ownership_code."
reversal_cost = "Low: two Trust-section sentences."
why_not_escalated = "The recipe's route for a post-pass clarification is the Trust section; Trust rulings go to the owner to confirm or overrule, as this one does."
review = ""

[decision.D-011]
decided = "The checkpoint sitting's outcome, the POSIX evidence and the convergence map before the gate. Sitting 005 (docs/reviews/wi-927/005-ADJUDICATE-65a3405.md, accepted) blessed LLR-300, LLR-322 and TC-345, all MEANING+BLESS, with no return, and took reading (b) on SR-229: its admission list is not exhaustive, the take's hooks refusal is LLR-300 detail beneath SR-229 and SR-237 as approved, and SR-229 stays unchanged, as the Done-when's SR-229 bullet provides. POSIX evidence (owed since D-003 and D-004), WSL Ubuntu, Python 3.12, at 36f7051b6, the lane's four test modules run serially: 260 passed, 34 skipped, 2 failed, the two run.command cases that fail at trunk itself (status.md's follow-ups), so none is this lane's. The convergence map, every accepted finding of the two counted rounds. Round 1 (D-006): REVIEW-B F1, the consent question hidden at a real POSIX terminal, by tests/test_run_devsetup.py::test_at_a_real_terminal_the_offer_shows_its_question_before_the_answer, which fails in WSL with today's tests over the pre-fix scripts of 7d04a1bde and passes at the tip (its take twin passes on both, a pin); REVIEW-B F2, five pseudo-terminal tests red on POSIX, by those five tests (test_an_on_file_is_unchanged_and_not_offered_at_a_terminal and the four test_an_occupied_slot_is_reported_and_never_offered cases), red in WSL at 3b26e922b and green at the tip; REVIEW-A F1, a JSON null read absent, by tests/test_coordinator_guard.py::test_a_json_null_in_the_settings_refuses_the_take_and_is_never_asked, failing on the pre-fix code (D-007); REVIEW-B F3, the Done-when's ratchet line, by checkable evidence: the Trust note at 65a340522 (D-010) and test_guard_hooks_holds_no_merge_or_ownership_code; REVIEW-B F4, SR-229's acceptance, by sitting 005's recorded reading (b). Round 2 (D-008): REVIEW-A F1 and REVIEW-B F2, a failed install not naming its fix, by tests/test_coordinator_guard.py::test_a_failed_offer_names_the_file_the_error_and_the_fix, tests/test_run_devsetup.py::test_at_a_windows_console_a_failed_install_names_the_file_error_and_fix and its POSIX twin test_at_a_real_terminal_a_failed_install_names_the_file_error_and_fix, failing on 0c41237c9 (D-009); REVIEW-B F1, a NUL stdin read as a terminal on Windows, by tests/test_coordinator_guard.py::test_a_stdin_on_the_null_device_is_no_terminal, failing on 0c41237c9 (D-009); REVIEW-B F4, the trace fields, by checkable evidence: LLR-322's code_symbol, the new tags and LLR-300's test_refs gaining TC-345 at 4b20a7bc3, with trace.py --strict clean; REVIEW-B F3 and F5 are round 1's F3 and F4 again, mapped above. D-009's counting question is answered by the Trust correction at 65a340522. Every accepted finding maps, so the gate may render: two full-lane reviewers, uncounted, in convergence stance, from the lane's base 2268a9a8c to its tip, Codex Sol at medium (REVIEW-A) and Claude Opus at high (REVIEW-B, the ruling-7 stand-in for the Gemini slot)."
alternative = "Map REVIEW-B F1 to the take's question test as well; rejected because it passes on the pre-fix code, so it cannot confirm the fix."
reversal_cost = "Low."
why_not_escalated = "The skill's convergence map; a record, not a call."

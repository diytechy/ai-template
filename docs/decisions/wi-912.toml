[decision.D-008]
decided = "Triage of counted round 1 (001-REVIEW-A-cbf0291, 002-REVIEW-B-cbf0291) under the review threat model. 002 F1 (MAJOR, the act derivation refuses a ruled row absent at HEAD, so a checkpoint that retires an Approved row cannot take its act through the act turn): accepted, the owner's ruling in session (2026-10-17d, asked at triage, the reviewers having split: Sol classed the same input a fail-closed coverage-extension note under ruling 1). The refusal removes a capability the cycle's own checkpoint step uses (the coordinator-cycle skill's 'Carry retired rows into scope explicitly'; the earlier route named retired rows in --reattests), and a queued program row retires Approved rows (plan item 14: LLR-297 and TC-312), so ruling 1's out-of-set note does not fit. Counted round 2 covers it by widening S3's Re-runs partition in the spec's Scope answers (not its Done-when, so the pass record stays bound): a re-attest of a ruled row absent at HEAD whose recorded copy still holds it is owed, a retirement named in --reattests, and taken once the copy no longer holds it; with a test that retires an Approved row under a CLARITY verdict beside a first approval in the same registry, and LLR-338 and TC-368 wording on the spine change list. Sol's coverage-extension note on the same input is answered by the same fix. 002 F3 (MINOR, three refusal branches no test reaches: no approval record, a row in no compared tier, a verdict path outside the root): fixed in the same round, which F1 already owes, with the three tests added to TC-368's evidence as trace upkeep. 001 F1 and 002 F4 (MINOR, SR-231's fresh-verdict and reservation clauses read as binding the act turn) and 001 F2 (MINOR, TC-161's method still describes the judging brief's removed approval clauses): row wording, to the spine change list for the checkpoint reconcile. 002 F2 (MINOR, the bless mark is honoured only by the act session keeping to its listed command, since the merge floor's judged_rows admits an unblessed MEANING re-attestation): kept MINOR, reached only by an act turn that widens the command its brief lists. Its owning boundary is the merge floor, which the spec's Trust section lists unchanged, and making the floor read the mark changes how lanes in flight merge acts their verdicts took without marks; so it is not built here: a follow-up row is filed on trunk at this lane's landing, its scope the reviewer's first remedy (the merge floor authorizes a MEANING re-attestation only for a row the verdict blesses). The reviewer's second remedy, a post-call check in the act command comparing the rows acted with the rows authorized, is declined as a second check where one boundary should own the rule. 002's coverage-extension note (an APPROVE row outside the sitting's Adjudicates scope is listed, then refused at the merge): fail-closed, no action. Round 2 is counted, the second of three, rendered with no stance."
alternative = "Re-grade 002 F1 to a coverage-extension note and file a successor that must land before the first lane retiring an Approved row; or send the split classification to a dispute sitting."
reversal_cost = "Low: one derivation widened and its tests; row wording judged once at the checkpoint."
why_not_escalated = "002 F1's classification was escalated and the owner ruled it; the rest is the skill's triage."
review = ""

[decision.D-009]
decided = "Fix-round stage 1 (one builder, Claude Opus at medium): every finding of counted round 1 is confirmed on the real path (probe under the lane's scratch r2/probe), and both coverage plans pass plan_coverage.py (exit 0, re-run by the coordinator). The builder reported a stop point outside the spec's surface: the merge slot, which the Trust section lists unchanged, refuses two retirements the widened derivation would list, both refusals predating this row. (1) A retirement whose registry carries no other act in the branch: the acted-set reader finds a row's registry at the branch head, where a retired row is absent, so its copy reads as widened. (2) A retirement on a held rung: re-attesting a row absent at the act is refused there, as SR-228 lets a held-rung adjudication re-attest only an amended row. The coordinator rules: (2) is the held rung's rule, not a gap, so the S3 partition states that a retirement on a held rung owes no act (the owner's, as a held MEANING row and a held APPROVE row already are), reusing the derivation's existing held-rung read; (1) is stated in S3 as residue and goes to a follow-up row filed on trunk at this lane's landing, beside D-008's merge-floor row, to land before the first lane whose sitting retires a row alone in its registry. The derivation does not pre-check the merge slot's rules: that would state them in a second home."
alternative = "List the held-rung retirement and let the snapshot refuse it in the act turn; or have the derivation mirror both merge-slot refusals up front."
reversal_cost = "Low: one partition sentence and the derivation's held branch."
why_not_escalated = "SR-228's held-rung scope and the skill's stop-and-file rule for a boundary outside the spec's surface."
review = ""

[decision.D-010]
decided = "Counted round 2, full-lane from ace24c85c to 8c1a9fce7, no stance: 003-REVIEW-A Codex Sol (medium) CHANGES-REQUESTED, 2 MINOR; 004-REVIEW-B Claude Opus (high), the stand-in for the Gemini slot under ruling 7, CHANGES-REQUESTED, 6 MINOR. Both ran at below-normal priority, each given only its rendered brief. No BLOCKER or MAJOR, so the counted rounds end at two and the checkpoint follows. Triage under the threat model: 003 F1 (TC-161's method) and F2 (SR-231's fresh-verdict and reservation clauses, carried through LLR-306 and IF-283/284), and 004 F1 (SR-231), F2 (LLR-338 and TC-368 state no retirement partition) and F3 (runtime flow 6 has the judging turn confirm a clean tree, which only the act turn checks): row wording, to the checkpoint reconcile. 004 F6 (the bless mark at the merge floor) is round 1's 002 F2: the follow-up row D-008 files at landing. 004 F4 (the actable class set declared in both the judging composer and the act assembler) and F5 (the act assembler restates the held-rung act policy that the judging composer reads from intake.adjudication_action): kept MINOR, and consolidated in the lane before the checkpoint rather than filed as rows, since both are second homes this lane created inside its own surface (the CLAUDE.md single-source rule); one builder stage, no behaviour change, with a test pinning the assembler's arm to adjudication_action over every rung and ruling; the uncounted gate reviews it with the checkpoint tip. The two coverage-extension notes (an APPROVE outside the sitting's Adjudicates scope refused at the merge; a CLARITY re-attest with no approval record refused by the snapshot writer inside the act turn) are fail-closed: no action."
alternative = "File F4 and F5 as successor rows; or run a third counted round over the consolidation."
reversal_cost = "Low: a refactor within the lane's own modules, reviewed at the gate."
why_not_escalated = "The skill's triage: MINORs cost no round; the consolidation stays inside the spec's named surface."
review = ""

[decision.D-011]
decided = "The checkpoint, in the new shape from the lane root (the Done-when's third item; the plan's P11). Terra's retained session reconciled the set (6735c6832); the coordinator checked mechanically that each changed approved cell keeps its approved text verbatim except TC-161's named method replacement, with no CR bytes, one shall in SR-231 and IF data within 160 characters naming no file. The closure check passed (both strict lints clean). The bar's lone reading breached (71.2 s); in one window the commit read 119.1 s beside its parent's 113.2 s on the same 2662-test tier, so load (coordinator-2026-10-17 D-005). One combined sitting, composed by compose_lane.py with the arms map appended, judged ten amendments (SR-231, LLR-167, LLR-305, LLR-306, LLR-310, TC-161, TC-192, TC-308, TC-321, TC-322) and two first approvals (LLR-338, TC-368) through `coordinator_adjudicate.py adjudicate --brief-file ... --brief combined`, the lane's own judge-only brief ordering no act: verdict 005-ADJUDICATE-6735c68 accepted, every amendment [MEANING+BLESS] on a released rung, both first approvals APPROVE, no return. Its three advisories block nothing: (1) a stray SR-146 Implements tag on the act assembler's act_values and compose_act, a trace-only fix the coordinator makes before the gate; (2) SR-231's new sentences sit outside its one shall, and (3) an unclear 'it' in LLR-167's addition, both row wording for those rows' next sitting, listed in status.md's unfiled follow-ups. The lane was then rebased from 796c68ba8 (the pre-rebase tip the verdict cites, archived at landing) onto trunk's 702ce8511, one watermark stop taken --ours and re-bumped; the twelve judged rows read byte-identical at the rebased head, the mark reads IF 296, LLR 338, TC 368, WI 940, and acts.toml holds no duplicate seq. The act turn then ran: `coordinator_adjudicate.py act --verdict docs/reviews/wi-912/005-ADJUDICATE-6735c68.md --wi WI-912`, which composed the act brief from the verdict committed at the rebased head, committed the amendment act (seq 126, the ten re-attestations) before the first-approval act (seq 127, LLR-338 and TC-368), and read act: complete, exit 0: the new shape's first live use."
alternative = "Rebase before the judging turn, which would not exercise the verdict crossing a rebase into a later act turn."
reversal_cost = "Low: the act is the lane's last spine commit and is archived with the lane tips."
why_not_escalated = "The Done-when's third item and the plan's P11 order this shape."

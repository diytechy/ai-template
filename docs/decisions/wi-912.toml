high_risk = []

[decision.D-001]
decided = "The lane is cut at trunk's 2b2350add (the claimed branch had no commits of its own, recipes section 2; WI-928 had just landed). The row is claimed planmode single, so the lane plans first: a fresh Opus planner at medium wrote the plan from review_brief.py plan's brief alone (DELTA within; plan_coverage passes, 7 clauses), committed verbatim, then one Codex Sol critique at medium from the lane. Its review rounds run two full-lane reviewers in parallel, Codex Sol at medium (REVIEW-A) and Claude Opus at high (REVIEW-B, the stand-in for the Gemini slot under ruling 7, recorded as the substitution each round), the trial having ended (coordinator-2026-10-16 D-008); at most three counted rounds before the checkpoint. The row changes the machinery the cycle runs on (the adjudication sitting and its act), so it lands alone, after WI-931."
alternative = "Build without the plan step, which the plan-gate hook step and the merge slot refuse."
reversal_cost = "None: the lane is new."
why_not_escalated = "The skill's plan step and the queue's landing rules."
review = ""

[decision.D-002]
decided = "The plan's one critique (Codex Sol, medium, from the lane over 324787db5) is CHANGES-REQUESTED with one MINOR, which reads as an APPROVE, so the pass record is written. The MINOR (P11's judging command, coordinator_adjudicate.py adjudicate --brief combined, omits the --brief-file argument the parser requires) is adopted through the build brief, which names the composed brief's path and passes --brief-file in P11's command, without editing the plan (an edit unbinds the record)."
alternative = "Revise the plan for a one-argument recipe slip, costing a second critique."
reversal_cost = "None: one argument in a recipe step."
why_not_escalated = "The skill's plan step: an all-MINOR critique passes; WI-928 D-001 is the precedent."
review = ""

[decision.D-003]
decided = "The lane was rebased from 2b2350add onto trunk's ace24c85c after WI-931 landed (its pre-rebase tip 9169e850c, reaching the critique's reviewed 324787db5, is archived at this lane's landing; the pass record binds by content digest, which the rebase keeps). The first build round runs in three stages on one builder (P2 to P4; P5 to P7; P9 and P10), each verified and committed before the next. Stage 1 cannot pass the bar alone: its new module belongs to no component until the new LLR names CMP-008, so check_trajectory.py --strict errors. GPT Terra, in the lane's one retained session, therefore authors at intent the rows stage 1's code needs (the new LLR, LLR-310's addition, the new TC, TC-192's pin, the new IF row and the six requestor or data additions) before the stage-1 commit, which carries the build and those rows together; the rest of P8 (SR-231, LLR-306, LLR-167, the act command's IF rows, TC-321, TC-161, the runtime flow) is authored once, by the same session resumed, after stage 3. The coordinator then names IF-296 in the module's contract header (Contracts: IF-296, Contract IF-296: in place of the id-less paragraph) and adds LLR-338 to its nine Implements tags, the trace upkeep the new ids owe. The prompt catalogue (project-trajectory/prompts/CATALOG.md, a [generated] view) is regenerated and committed with each lane commit that changes a prompt: the plan's P3 places it at the landing only, but the commit hook's prompt-catalog step refuses a stale catalogue on a lane commit, as its staged-divergence step refuses an unstaged regeneration, so the hook overtakes that sentence; the landing regenerates it again."
alternative = "Commit stage 1 with check_trajectory --strict red; or hold all three stages uncommitted until one intent turn after stage 3."
reversal_cost = "Low: one more Terra turn; the rows stay Drafted and are judged once at the checkpoint."
why_not_escalated = "The skill's intent step and the bar; the plan's P3 and P8 place the catalogue and the rows."
review = ""

[decision.D-004]
decided = "Stage 2's new tests/test_coordinator_act.py (39 cases on real git lanes through a stub adjudicator, 48.0 s at -n 2, 3 to 6 s a case) moves into tests/conftest.py SLOW_MODULES, the fallback the plan's P6 and P12 name, with tests/test_adjudicate_act.py (in-process, smoke) keeping the family's pin. Measured in one window at below-normal priority, the stage-2 tree with the module in the smoke tier read 140.9 s (2693 passed) beside its parent 51ffd81b5's 114.8 s (2651 passed): a 26 s gap where D-004 of coordinator-2026-10-17 records pairs within 9 s, so the module itself grew the tier, which read 49.4 s quiet at stage 1. The coordinator made the one-line move (the plan's own measured step; the builder left it to the bar's reading). TC-321, whose evidence now cites the module, owes its tier cell Smoke -> Full by TC-205's rule, a row-text change on the spine change list for the intent turn and the checkpoint sitting. After the move, the pair read 92.2 s (2654 passed) beside the parent's 90.6 s (2651 passed) in one window, a 1.6 s gap on the same tier: load, under coordinator-2026-10-17 D-004 and D-005 (alone, before the pair, 61.9 s)."
alternative = "Keep the module in the smoke tier and re-stamp the 60 s budget; or move the act turn's cases into the in-process module."
reversal_cost = "Low: one SLOW_MODULES line; the module runs in the full suite and CI either way."
why_not_escalated = "The plan's P6 and P12 name this move; CLAUDE.md's per-commit bar: the budget is not moved to fit."
review = ""

[decision.D-005]
decided = "Stage 3's builder reported that the act assembler refuses a verdict ruling a row absent at HEAD (plan decision 3: below Approved, or absent, is inconsistent), so a checkpoint that retires a row cannot take its act through the act turn, where the earlier recipe named retired rows in --reattests. The refusal is fail-closed and names the row; neither the spec nor the plan promises retired rows. The coordinator does not amend the passed plan for it: the recipe now states the behaviour truthfully, and counted round 1's reviewers classify the input (ruling 1: a fail-closed out-of-set input is a coverage-extension note, a fail-open one a blocking finding). Nothing in the reviewers' briefs mentions it."
alternative = "Revise the plan to admit retired rows before review, unbinding the pass record and costing a fresh critique; or file a successor row now, before any reviewer has classified it."
reversal_cost = "Low: a widening of one derivation in a later fix round or successor row."
why_not_escalated = "Ruling 1 gives the classification to the reviewer, and the skill's triage routes it; a convergence-class finding still goes to the dispute sitting or the owner."
review = ""


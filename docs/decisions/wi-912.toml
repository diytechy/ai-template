decided = "The convergence map for the gate over the checkpoint tip (revisions 8 and 33): every accepted finding maps to a regression test failing on the pre-fix code, or, with no executable test, to independently checkable evidence. Round 1's 002 F1 (MAJOR, the retirement): test_a_retired_row_ruled_CLARITY_beside_a_first_approval_is_listed_in_the_reattests, test_a_retirement_and_its_first_approval_taken_through_the_snapshot_writer_leave_nothing_owed and test_a_retirement_on_a_held_rung_owes_no_act, each red at cbf029136 and green at 8c1a9fce7 (3 failed, 32 passed, then 35 passed), with test_a_first_approval_of_a_row_absent_from_the_committed_tree_is_refused_naming_it pinning the kept refusal. 002 F3 (the three unpinned refusals): test_an_approval_owed_where_no_approval_record_exists_is_refused, test_a_ruled_row_no_compared_tier_holds_is_refused_naming_it and test_a_verdict_path_outside_the_root_is_refused, pins that fail if their branch is deleted. Round 2's 004 F4 and F5 (the consolidation): the one ACTABLE assignment, in the act assembler (inspection: the judging composer assigns none and reads it), and test_each_rows_act_arm_follows_the_adjudication_action_policy_on_every_rung, which pins the assembler's arm to the one held-rung act policy. The wording findings (001 F1, F2; 002 F4; 003 F1, F2; 004 F1, F2, F3): the corrected text at each cited site (SR-231's requirement, acceptance and rationale; LLR-306's detail; TC-161's method; LLR-338's detail; TC-368's method and expected; runtime flow 6), judged by sitting 005-ADJUDICATE-6735c68 and anchored by acts 126 and 127. The sitting's advisory 1 (a stray SR-146 Implements tag on the act assembler's act_values and compose_act): the corrected tags at both sites. Not mapped, as not accepted for a fix: 002 F2 and 004 F6 (the bless mark at the merge floor), a follow-up row at landing (D-008). The reviewers read no decisions record."
alternative = "Run the gate without the map, which the skill forbids for a convergence round."

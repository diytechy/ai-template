high_risk = ["D-001", "D-002"]

[decision.D-001]
decided = "Two lanes (WI-853 and WI-848) landed on a fresh full-lane Sol review whose ONLY finding was then dismissed by a final dispute ruling (WI-853's dispute 006, DISMISS not-worth-cost; WI-848's dispute 002, DISMISS refuted), without a further Sol round; only the dispute records were added after the reviewed tip. Recorded per lane as wi-853.toml D-005 and wi-848.toml D-010."
alternative = "Run one more fresh full-lane Sol review after each dispute, so the last gate reads SOUND."
reversal_cost = "Low: a review of either landed squash costs one Codex session; a finding would become a follow-up row."
why_not_escalated = "The dispute ruling is final (PROCESS.md §6), so a further round could not re-raise the dismissed finding, and the reviewed content is the landed content; Codex was the night's binding constraint (it hit its limit later in this leg). The owner may prefer the strict reading of 'SOUND as the last gate', hence high risk."
review = ""


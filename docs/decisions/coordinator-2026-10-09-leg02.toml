alternative = "Treat the spec's named chain as settling parentage and dismiss the finding without a sitting."
reversal_cost = "Medium: retiring SR-236 would re-parent LLR-069's findings half and its TC."
why_not_escalated = "The spine author and the reviewer independently raised it; the adjudicator's ruling is final and the SR rung is released (human_approval_through = DevStg-Boundary)."

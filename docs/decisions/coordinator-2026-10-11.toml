# docs/decisions/coordinator-2026-10-11.toml — overnight legs 01 and 02 (2026-10-11);
# delegated decisions made on trunk (coordinator). Lane decisions are in each
# lane's own record. Format: project-trajectory/decisions.template.toml.

high_risk = ["D-001", "D-004", "D-005"]

[decision.D-001]
decided = "WI-887's lane re-anchored the low-level-requirements snapshot with a coordinator act as its last spine commit (seq 111, `intake.py snapshot --approves \"low-level-requirements=docs/reviews/wi-887/009-ADJUDICATE-2310bdc.md\"`, no re-attests): after sitting 009's act 110, the dispute-011 fix added two symbols to LLR-270's traced code_symbol cell, so the live registry differed from its anchor only in that traced cell. The recipes sanction this re-anchor for a traced-only change; taken on trunk inside the squash it was refused by text-then-act, so it was taken in the lane; no approved text moved and nothing was blessed."
alternative = "Rewind the lane and have the adjudicator take the act after the code_symbol change, or drop the two symbols from code_symbol and leave their back-links unlisted."
reversal_cost = "Low: an overrule restores the act-110 copy and re-sits LLR-270 for a traced-cell re-anchor."
why_not_escalated = "A traced-only change owes no sitting; the copy blesses no requirement text."
review = ""

[decision.D-002]
decided = "WI-858's scope critique (Sol gpt-6.1-sol, medium, round 1) returned two MAJORs: S1, the coordinator_guard lock-site check is an independently landable deliverable with no recorded order or joint-landing decision; S2, durable bookkeeping and release markers give files authority over lease holds and retirement, and the spec has no Trust section. Answering S2 is a design of the lockless bookkeeping protocol (every carrier's producer, write route and failed-write shape, every consumer, a ruling per consumer), which this leg could not finish inside its occupancy budget; WI-858 is left queued, unclaimed, for the next leg to write its Trust section and settle S1 before the claim. WI-901 (queue row 4; WI-895 at row 3 has landed) is claimed ahead of it, its critique approved at round 1. WI-901's sr_refs were re-anchored to SR-144 and its Done-when to LLR-167's chain before the critique, per WI-903's census note."
alternative = "Hold every later row until WI-858's Trust section is written and critiqued, or write a provisional Trust ruling now without reading the store protocol through."
reversal_cost = "Low: WI-858 stays first in the next leg's queue; WI-901 is independent of it."
why_not_escalated = "The Trust ruling goes to the owner for confirmation once written; skipping one unclaimable row to the next ready one changes no scope."
review = ""

[decision.D-003]
decided = "WI-858's scope critique S1 (the coordinator_guard lock sites as an independently landable deliverable) is answered by a split, not a joint landing: the check found the coordinator lease has no expiry, so contention there never retires a healthy holder (WI-858's harm), but a contended session_end or on_session_start hook can leave the lease with an ended session until a human releases it, a different harm with different consumers (the claim gate, the relaunch). That fix is filed as WI-906 (needs WI-858, queued after it); WI-858's Done-when bullet on coordinator_guard gains the check's result and names WI-906, and its other Done-when bullets are unchanged. WI-858 gains a Deliverables and order section stating this."
alternative = "Keep both in WI-858 as one joint landing (the owner's 2026-10-08 ruling put every store-lock contention path in WI-858), ordered session store first, coordinator lease second in the same lane."
reversal_cost = "Low: an overrule closes WI-906 as absorbed and restores the bullet; nothing is built yet."
why_not_escalated = "The owner's 2026-10-08 ruling was about the session store's release paths (WI-846's); the Done-when itself allowed the coordinator_guard check to end in 'shown not to leave a lease behind', and the split changes no obligation, only which row carries it."
review = ""

[decision.D-004]
decided = "WI-858's Trust ruling (its spec's Trust section): one lockless carrier, a store marker per call (kinds bookkeep, release and retire; the existing .retire tombstone folds into it), named by record stem and a hash of the per-call lease holder, written once and deleted only by name by the locked reader that applied it; every producer publishes the marker first and then applies it under a short lock wait, one route for every path; locked readers read the clock first, then apply markers, then run the expiry retirement; lockless readers fold markers with the same pure function and never skip a record for a pending release; an unreadable marker defers that record's expiry retirement, a malformed one is deleted with a stderr line; bookkeeping no longer raises StoreBusy, and a deferred apply reports reset-reason 'pending'. The reset decision is computed at apply time under the lock, never stored in the marker. retire_scope joins as a producer: with no call lease behind it, each of its retire markers takes a fresh publisher id, names the session and generation it read, releases no lease, and a failed publication raises to the loop's round (critique round 2)."
alternative = "Catch StoreBusy and retry the locked write with a longer wait; or keep the decision in the marker computed at publish time against a lockless read."
reversal_cost = "Medium once built: the carrier and its readers; nothing is built yet."
why_not_escalated = "The skill routes every Trust ruling to the owner for confirmation or overrule after the fact; the design answers WI-846's three recorded contention findings (D-005 there) one by one."
review = ""

[decision.D-005]
decided = "WI-902's Trust ruling (its spec's Trust section): the adoption is a one-key TOML block (adopts = WI-NNN) in the disposition row's own Dispositions section, written by the adjudicator; the disposed row is derived from the disposition row's title report path, never from the adjudicator's text; an adoption is accepted only while the named row is open on trunk and its supersedes names the disposed row, re-read at each consumer (the close, the sweep); it mints nothing, owes no spine review, is refused on a consolidation close, and leaves the verdict's successors=N line unchecked as today. Round 2: the disposed row resolves from the title's terminal path for both the report-backed and the report-less cancellation forms by one shared function; absent, unreadable and registry-load failures refuse with distinct reasons; the sweep's skip of an unreadable merged adjudication spec becomes a refusal; the close runs only after a sitting that exited 0."
alternative = "Let the adjudicator name both the successor and the disposed row; or accept the adoption once at the close and trust it at the sweep."
reversal_cost = "Low: nothing is built yet."
why_not_escalated = "The skill routes every Trust ruling to the owner for confirmation or overrule after the fact."
review = ""

[decision.D-006]
decided = "Both rows are claimed on their scope critiques as answered, without a fourth round for WI-902: WI-858's round 3 approved with 0 findings; WI-902's round 3 returned one MINOR (the Trust section omitted consolidate._enacted_supersedes, the historical absorption reader), answered in the spec exactly as the finding allowed (the draft-only reader is preserved and named, and the blanket refusal statement is qualified), with no change of design."
alternative = "Run a fourth Sol round on WI-902 before its claim."
reversal_cost = "Low: the lane's full-lane review reads the spec; a gap found there is answered in the lane."
why_not_escalated = "A MINOR answered as its own text proposed changes no scope; the skill asks that each critique be answered before the claim, which it is."
review = ""

[decision.D-007]
decided = "WI-798 is not claimed this leg. Its scope critique (Sol gpt-6.1-sol, medium, round 1) returned three MAJORs: S1, the spec names no landing order or keep-together decision for its account tables, the per-family home's retirement, the route@account cooldown key and the adjudicator-authentication move; S2, it has no Trust section although route and account selection authorize launches and the account home carries the adjudicator's sign-in (carriers, producers, write routes, failed-write shapes, every consumer by path, a ruling per consumer, the binding); B3 (a proposed new rubric anchor), the Windows two-login check and the live sign-in migration need owner-provisioned credentials and are not separated from the unattended deliverables, with no stated hold or partial disposition when the isolation result is missing. The leg then reached the Codex usage limit, so the next leg writes the order, the Trust section and the owner-dependent split before re-critiquing."
alternative = "Write WI-798's Trust section in this leg after the limit, without a critique to check it."
reversal_cost = "Low: WI-798 stays first among unclaimed rows."
why_not_escalated = "Settling scope before a claim is the coordinator's step; the Trust ruling goes to the owner once written."
review = ""

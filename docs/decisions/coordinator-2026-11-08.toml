# trunk on 2026-11-07 and 2026-11-08.
# Format: project-trajectory/decisions.template.toml.

high_risk = ["D-004", "D-005"]

[decision.D-001]
decided = "WI-1002 landed first and alone, then WI-996 (each changes machinery the cycle runs on). WI-1002's change reaches only the unattended dispatcher's parked-lane resume, a step this coordinator's attended and headless lanes never run, so the cycle had nothing of it to run through before WI-996's landing; WI-996's lane was rebased onto WI-1002's landing before its next attest. WI-996's own changed steps (attest's mark check, the refresh's landing arm and the hand landing's staged-squash check) ran at its own landing: the new recipes step read no red mark on the staged squash."
alternative = "Hold WI-996's landing for a later leg until another lane runs through WI-1002's change."
reversal_cost = "Low: both landings are fixed forward if a defect shows."
why_not_escalated = "The skill's machinery rule asks that the cycle run through the last landing's changed step; WI-1002 changes no step the coordinator's cycle runs."
review = ""

[decision.D-002]
decided = "The landed lanes' worktrees and branches are removed after their tips were archived to archive/lanes (wi-1002 with its pre-rebase tip 4a6b9aeea, wi-996 with 28a9a114e), and leg 36's and leg 37's scratch roots are deleted now that both lanes they served have landed, as the replaced handoff asked."
alternative = "Keep the branches beside the archive."
reversal_cost = "Low: each tip is a parent of archive/lanes."
why_not_escalated = "Housekeeping the replaced handoff and the recipes direct."
review = ""

[decision.D-003]
decided = "The leg closes out with the `Overnight: stop` line: the queue table's two remaining rows are held (WI-910 on OI-124, WI-1001 on OI-129 through WI-999 and WI-1000), and every other open row is on the never-claimed list, so no row can move without the owner."
alternative = "Claim a row outside the table."
reversal_cost = "None: the owner restarts the run once an item is ruled."
why_not_escalated = "The headless block's own rule for the stop line."
review = ""

[decision.D-004]
decided = "WI-1000's scope critique (round 1, three findings) is answered by adopting all three in the spec: the scan contract is closed (surface, ID vocabulary, token set declared once in the test module, matching rule, what is outside the claim), planmode = none, and the architectural delta is stated. The contract exempts a `.py` name that is exactly a kit script (`<name>.py` or `scripts/<name>.py` where `project-trajectory/scripts/<name>.py` exists): the shipped registry templates name the kit's own tools 37 times (29 in registries/*.template.*), and those tools are Python for every adopter whatever its stack, so naming them names the delivered checks SR-035 presupposes, not the adopter's language. Any other source path (`src/check.py`, `tests/*.py`) is still reported."
alternative = "Rewrite the 29 template references to the kit's scripts so the templates carry no `.py` at all (a shipped change with a RESYNC entry), or ask the owner before filing."
reversal_cost = "Low: the exemption is one rule in one test; dropping it reds the scan on today's templates, and the rewrite then follows as its own row."
why_not_escalated = "A reading of an approved SR's acceptance that the spec states openly and the confirming round judges; the owner confirms or overrules it from the handoff."
review = ""

[decision.D-005]
decided = "WI-999's backfill is an owner-held step: OI-130 is filed pending and WI-999 gains `needs = [\"OI-130\"]`. OI-129's ruling rested on the derivation having been worked in the 2026-08-16 plans; the drafter's evidence, checked here against the cited lines, shows those plans derived SR-165 itself, while the partition came from WI-441's 2026-08-13 data pack, whose recorded ranking (P5, P3, P4, P1, P2) recomputes from no single declared objective, and whose approval decision 10 deferred, with the log on 2026-08-23 still calling it the owner's. Writing the record would invent an objective or attribute a ruling to the owner. The rest of the scope critique (four MAJORs, one MINOR) is adopted in the spec: a Trust section, a closed record form with its ranking rule, planmode = single, the landing order and the architectural delta."
alternative = "Claim WI-999 now, build the schema, rules and tests, and park the lane at the backfill until the owner rules."
reversal_cost = "Low: the owner's ruling releases the row; nothing is built against an unruled record."
why_not_escalated = "The skill's owner-held-step rule (SKILL section 7) files the step as an open item and moves to the next row; it is not build debt, because the record's content is a ruling the coordinator cannot make. A parked lane would hold a claim whose landing needs the ruling anyway (the strict check reds on four unrecorded rows)."
review = ""

[decision.D-006]
decided = "The scoped unpause claimed WI-1000 alone (976c43094 deletion, 0f90241f9 claim, b683375ad byte-identical restore). The deletion commit was made before the commit bar was run on it; the bar run before the restore commit, over the same tree plus the claim, was green (smoke 3459 passed, 3 skipped; both strict lints clean), and the restore's sha256 equals the pre-deletion bytes."
alternative = "Run the bar before the deletion commit as well."
reversal_cost = "None: the deletion and restore are byte-checked and the next bar covered the tree."
why_not_escalated = "A procedural slip with its evidence recorded; the recipe already states the bar comes first."
review = ""


# docs/decisions/wi-916.toml — delegated decisions made in the WI-916 lane (a
# change to a shipped kit file passes the commit bar only when it adds its
# re-sync entry, anchored at its trunk base) by the attended coordinator.
# Format: project-trajectory/decisions.template.toml.

high_risk = []

[decision.D-001]
decided = "The lane is cut at trunk's 6533a2331 (the claimed branch had no commits of its own, recipes section 2), claimed under the session's first scoped unpause (coordinator-2026-10-17 D-008). The row is claimed planmode single, so the lane planned first: a fresh Claude Opus planner wrote the plan from review_brief.py plan's brief alone (DELTA within; plan_coverage passes, 5 clauses), committed verbatim; one Codex Sol critique at medium approved it with no findings, and the pass record binds it. Its ordering preconditions hold: the plan gate (WI-913) and the strict-lints row (WI-914) are both closed. Build round 1 (Claude Opus at medium, the kit-builder agent) built the plan's rows P1 to P4 in one round; P5, verify and land, is the coordinator's. The builder departed from the plan's text in one detail and reported it: the check classifies a kit tree in a child Python run with -B, because classifying the working tree imported its bootstrap.py and wrote a __pycache__ file into the kit, which the check then refused as an untracked shipped path in a repository that does not ignore __pycache__. Review rounds run two full-lane reviewers in parallel, Codex Sol at medium (REVIEW-A) and Claude Opus at high (REVIEW-B, the stand-in for the Gemini slot under ruling 7, recorded as the substitution each round; coordinator-2026-10-16 D-008), at most three counted rounds before the checkpoint. The row changes the commit bar the cycle runs on, so it lands alone."
alternative = "Build without the plan step, which the plan-gate hook step and the merge slot refuse."
reversal_cost = "None: the lane is new."
why_not_escalated = "The skill's plan step and the queue's landing rules; the -B detail is a construction inside the plan's own P1 surface."
review = ""

[decision.D-002]
decided = "Counted round 1 over f881d233d: Codex Sol at medium (REVIEW-A, 001) APPROVE with 0 findings, and Claude Opus at high (REVIEW-B, 002, the ruling-7 stand-in) CHANGES-REQUESTED with 2 MINOR. F1: an added heading that re-anchors an existing entry (the same title under a new since-sha) counts as this change's entry, and the reviewer's probe passed a shipped change with no new entry that way, while deliverable 1 says an edit to an existing entry does not count; graded MINOR for its reach (a deliberate edit to a base entry's anchor). F2: the enforcement audit's residue says a commit made without the bar is caught at the next bar or at landing, which holds for a lane commit only; a trunk-direct commit made without the bar escapes the check (wording). No BLOCKER or MAJOR, so the round costs nothing more by count. The triage of F1 is left open to the next session: whether it is a Done-when gap against deliverable 1's text (then re-graded and fixed in a fix round, with F2's wording in the same round), or a MINOR for the follow-ups. No fix is dispatched and nothing is built until that call."
alternative = "Rule F1 now at the session's close, without the fresh reading a Done-when-gap call deserves."
reversal_cost = "None: the lane holds at its round-1 tip."
why_not_escalated = "The triage is the coordinator's (the skill's step 4); the next session makes it, and a contested call goes to a dispute sitting."
review = ""

[decision.D-003]
decided = "Triage of round 1's F1 (002-REVIEW-B), left open by D-002: F1 is a Done-when gap, re-graded MAJOR. The Done-when's first item is that the check behaves as deliverable 1 states, and deliverable 1 lists an edit to an existing entry among what does not count; the reviewer's probe re-anchored a base entry's heading to the change's base and the check counted it, passing a shipped change that added no entry. That is fail-open against the row's own text, so it is convergence-class and is never left to a follow-up (ruling 4's revision 7 clarification). Its reach is a supported route: an agent following the recipes' 'fold a fix round's entry into its parent entry' on an entry that has already landed edits that entry's anchor. It costs a round: a fix round, then counted round 2. F2 (the enforcement audit's residue reads true for a lane commit only) stays MINOR and its wording rides in the same fix round, since the fix touches the same record. The fix round runs in two stages on one builder (recipes section 1, coverage plan): stage 1 confirms both findings on the real path and writes the coverage plan, changing nothing; the coordinator re-runs the gate and rules any stop point; then the fix. The construction is the builder's to propose in stage 1, against deliverable 1's text: an edit to an existing entry, its heading included (re-anchored or retitled), adds no entry. Before the fix round the lane was rebased onto trunk's c58293d54 (from 6533a2331; trunk's commits since touch none of the lane's files, and the rebase was clean); the pre-rebase tip 65d2962bc, which round 1's files cite through f881d233d, is archived at landing."
alternative = "Keep F1 MINOR for status.md's follow-ups, as the reviewer graded it; rejected because the landing would then claim a Done-when item the reviewer's probe shows false."
reversal_cost = "One fix round and one review round."
why_not_escalated = "Triage is the coordinator's (the skill's section 3, step 4); a contested grading would go to a dispute sitting, and nobody contests it."
review = ""

[decision.D-004]
decided = "After the rebase onto c58293d54 the bar read red on membership: the smoke tier collected 2717 tests against max-tests 2715. Each side fit alone (trunk collects 2697 with WI-917's in-process cases; the lane's 20 check_resync cases sit in the smoke tier, as its Done-when requires). The ceiling is re-stamped to 2825 in this commit, about 4% headroom over 2717, with its reason and fig line in docs/stack.ini, as the recipes require of a commit that takes the tier past the ceiling. The seconds budget is not moved: in one quiet window the enforce check read 41.5 s on the lane and 45.8 s on trunk, so the module does not grow the wall."
alternative = "Re-tier check_resync's cases into SLOW_MODULES; rejected because the Done-when puts them in the smoke tier and the wall reading is inside the budget."
reversal_cost = "One line in docs/stack.ini."
why_not_escalated = "The recipes' re-stamp rule (section 6) and the precedent stamps in docs/stack.ini; the seconds budget, which the owner holds, is unchanged."
review = ""

[decision.D-005]
decided = "The fix round's stage 1 (the same kit-builder, Claude Opus at medium) confirmed both findings on the real path: re-anchoring a base entry's heading, or retitling and re-anchoring it, passes a shipped change with no new entry; and a trunk-direct commit made without the bar leaves its shipped change outside every later range. Its coverage plan passed plan_coverage (exit 0, 7 clauses). It named one stop point for the coordinator: its proposed construction made the base's entry headings append-only, refusing any change that removes or alters a landed heading. Ruled instead: the net count the builder named as the alternative. The change's entries are its added headings that pass the entry rules, less the base's entry-grammar headings the working tree no longer holds byte for byte; a shipped change needs a positive count. A re-anchor or a retitle adds one heading and loses one, so it counts nothing, which closes F1 as deliverable 1 states it. Reasons: deliverable 1 says an edit to an existing entry does not count, not that it is refused; the Trust section binds the check to the headings the change adds, never to a heading present at the base; and refusing the removal of a landed entry would give the check an authority over base headings the spec never granted, new S2 surface the recipes say to avoid (prefer removing the authority). Fail-closed corner, a coverage-extension note: a shipped change that adds one entry while removing a landed one counts nothing and is refused; it would take two changes. A pack-only change that re-anchors a landed entry still passes, as deliverable 1 leaves edits unjudged. The plan's text describing the rule as first built stays as the accepted plan of record; the fix is inside P1's surface."
alternative = "The append-only construction, which refuses deleting or editing a landed heading: stricter, but a refusal class beyond deliverable 1 and the Trust section's binding."
reversal_cost = "One reader's counting rule and its tests."
why_not_escalated = "A construction inside the spec's stated rule and surface; it changes no Done-when text and adds no authority."
review = ""

[decision.D-006]
decided = "Counted round 2 over 69131a5bf: Codex Sol at medium (REVIEW-A, 003) APPROVE with 0 findings; Claude Opus at high (REVIEW-B, 004, the ruling-7 stand-in for the Gemini slot) APPROVE with 1 MINOR. F1: the check prints each refused heading verbatim, and on Windows with piped stdout Python encodes it as cp1252, so a refused heading holding a character cp1252 cannot encode (21 of the live pack's 255 headings carry one, such as an arrow) crashes with a UnicodeEncodeError: the exit stays 1, so the bar fails closed, but the stated reason and every later refusal line are lost. No BLOCKER or MAJOR, so the checkpoint follows; the lane owes no spine rows, so it holds no sitting. F1 is accepted and fixed before the gate, in the check's own surface: deliverable 1 has the check exit 1 naming each shipped path and the reason, and the Trust section has it state the reason, which a traceback loses. It stays MINOR (fail-closed), costs no counted round, and carries a regression test that fails on the pre-fix code, which the convergence map cites. The reviewer's coverage-extension note (on Python 3.11.0 to 3.11.3, the tar extraction's filter argument raises an uncaught TypeError, so a kit change exits 1 with a traceback) fails closed and is recorded, not built: this repository's interpreter is 3.11.9."
alternative = "Leave F1 to status.md's follow-ups, landing a check that can lose its stated reason on this workstation's normal shell."
reversal_cost = "One reconfigured stream and its test."
why_not_escalated = "The skill's triage step; a MINOR inside the spec's surface, fixed before the gate that reviews it."
review = ""

[decision.D-007]
decided = "The convergence map before the gate (revisions 8 and 33; the gate never sees earlier verdicts, so the coordinator maps every accepted finding first). Round 1 F1 (002-REVIEW-B: an edited landed entry counted as the change's entry) maps to test_a_re_anchored_existing_entry_does_not_count, test_a_retitled_and_re_anchored_entry_does_not_count and test_a_new_entry_beside_a_removed_one_does_not_count in tests/test_check_resync.py, each red before the fix round (each returned no refusal). Round 1 F2 (002-REVIEW-B: the audit row's residue held for a lane commit only) is wording, mapped to independently checkable evidence: the corrected sentence in docs/enforcement-audit.md's check_resync row, which names the trunk-direct escape. Round 2 F1 (004-REVIEW-B: an unencodable refused heading crashed the CLI's output on a cp1252 console) maps to test_a_refused_heading_a_legacy_console_cannot_encode_is_still_named, red before its fix (empty stdout). The fix calls the kit's existing utf8_console guard in main. Every accepted finding is mapped, so the gate renders. The lane is at trunk's tip (c58293d54), touches no trunk-only generated view, and owes no sitting, so the gate is over the tip that lands."
alternative = "None: the map is required before a convergence round."
reversal_cost = "None."
why_not_escalated = "The skill's convergence-map step."
review = ""

[decision.D-008]
decided = "The gate over b629f2328 (uncounted, convergence stance, after D-007's map): Codex Sol at medium (REVIEW-A, 005) APPROVE with 0 findings; Claude Opus at high (REVIEW-B, 006, the ruling-7 stand-in) APPROVE with 2 MINOR. F1: the enforcement audit's row and the check's docstrings say a re-anchored or retitled entry counts zero, while a retitled entry that keeps its old anchor is refused outright by the anchor rule (wording; the behaviour fails closed). F2: when a lost base heading cancels a valid added entry, every shipped path is refused with the plain no-entry reason, which names neither the cancelling heading nor the cancellation (fails closed; a clearer message). No BLOCKER or MAJOR, so the lane lands. Both MINORs go to status.md's unfiled follow-ups, never a fix after the gate, since a fix would move the tip off the gated one (wi-935 D-005)."
alternative = "Fix both after the gate and run another gate."
reversal_cost = "None: both are follow-ups."
why_not_escalated = "The recipes' gate-MINOR rule."

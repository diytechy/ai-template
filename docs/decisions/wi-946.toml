# with the merge slot) by the attended coordinator.
# Format: project-trajectory/decisions.template.toml.

high_risk = []

[decision.D-001]
decided = "The plan step and build stage 1. The lane was cut at trunk's 7c59c67d1 (the claimed branch had no commits of its own; recipes section 2). A fresh Claude Opus planner at medium wrote the single plan from review_brief.py plan's brief alone, committed verbatim (fab48ca19); plan_coverage --item passed it (39 clauses, DELTA: within); a fresh Codex Sol critique at medium approved it with no findings (a0e7cfc76), and the pass record followed (db78234a2). Build stage 1 (a Claude Opus builder at medium, the kit-builder agent) built P2 alone, as the plan's commit order requires: integrate._loop_claimed moved verbatim to agent_common.loop_claimed(root, branch, trunk_tip), which _loop_window calls with the slot's trunk tip, its reading and its fail-open unchanged until P3; the RESYNC entry is written in this commit, anchored at the lane's base and describing the behaviour P3 completes, because the bar's check_resync step refuses a shipped change without one; the size ratchet's exact baselines are re-stamped (agent_common.py +9, integrate.py -9). No test is added: the existing TC-242 cases passing unchanged are the move's evidence. LLR-248's code_symbol does not yet name loop_claimed, so check_trajectory prints a WARN (strict stays clean); the plan's P8 adds it at the checkpoint, and it is on the spine change list. The coordinator re-ran the slow modules and the bar."
alternative = "Fold P2 into P3's commit; rejected because the plan keeps the extraction alone in its commit, so the review sees a pure move."
reversal_cost = "Low."
why_not_escalated = "The skill's plan and build steps; the plan's commit order."
review = ""

[decision.D-002]
decided = "Build stage 2 (P3), on the same Claude Opus builder. agent_common.loop_claimed now answers (claimed, unreadable): a claim log git cannot read, or a record in it with no NUL or no commit id, is (None, why) naming the read, never unclaimed; the merge slot's _loop_window refuses on it ('cannot read <branch>'s claim to check its provenance; nothing was merged'), so the trailer rung and the held-status rung both refuse a lane whose claim cannot be read; the launcher's own copy lane_claimed is deleted and lane_refusal raises AuditStop on the same answer. The docstrings and IF-065's contract text name the one reader and its failure rule; the shipped docstrings do not name this repo's launcher, which is not shipped. Each new test failed on e3cfe7fe6 before its code (the builder's red run from a detached scratch worktree: 11 failed), the readable-log cases marked as pins. Two small departures from the plan's wording, both accepted: the slot tests fail the claim read by matching the claim suffix's --grep rather than the new format string, so the red shows the base's real fail-open (both rungs passed the lane) instead of an unrelated assertion; and the test lane is closed by an unmarked close commit so integrate_one reaches the provenance rungs. The RESYNC entry already describes this behaviour. The tier grew by one in-process test. The coordinator re-ran the slow and touched modules and the bar."
alternative = "Hold the plan's literal test seam (fail only a log carrying the new format), which at the base would not fail the old reader's read and so prove no red."
reversal_cost = "Low."
why_not_escalated = "The skill's build step; the departures change test mechanics, not what the plan builds."
review = ""

[decision.D-003]
decided = "Build stage 3 (P4), on the same Claude Opus builder. The launcher binds trunk once per run, through the kit's agent_common.trunk_name, as prepare_run's last step (a small bind_trunk helper), logging the bound name; a reader that refuses stops the run with exit 2 before any leg. Its own trunk reader is deleted. pre_leg refuses a snapshot without the bound ref, and pre_leg and the audit's last judgement call checkout_refusal, which stops the run when a leg leaves the primary checkout detached, on another branch, or unreadable. The leg's log line prints the bound trunk's tips, and check-lane reads trunk through the kit's reader, a refusal or a name no branch holds reading as 'cannot judge' (exit 3). The window call is untouched (WI-918's). The plan's one bind test and its check-lane test are each split in two, and an order test is added; the builder's red run at 009c91498 (30 failed, from a detached scratch worktree) reproduces the spec's finding exactly: leg 2 audited the branch leg 1 left the checkout on as trunk, and the run ended 0. The tier grew by eleven in-process tests, together about 0.05 s. The coordinator re-ran the slow and touched modules and the bar."
alternative = "Bind inline in prepare_run, as the plan's wording reads; the helper changes no behaviour and keeps prepare_run's complexity down."
reversal_cost = "Low."
why_not_escalated = "The skill's build step; the departures are test granularity and one helper."
review = ""

[decision.D-004]
decided = "Build stage 4 (P5), on the same Claude Opus builder. The launcher's trunk and archive rules are one judge_descent, per the plan's decision 2: a ref present before the leg that does not resolve after it, or no longer descends from its pre-leg tip (a rewind, or a reset to an unrelated commit), stops the run naming the old tip; a descending move judges its first-parent commits; the archive created by a leg is judged as before, and an archive absent and still absent reads absent. Each new test failed at 90e0db7a0 before its code (6 failed, from a detached scratch worktree): the real-git cases ran leg 2 after a rewind, a reset and a deletion of archive/lanes, each ending 0. One log wording changes: an unmoved trunk reads 'trunk unmoved' where it read 'trunk 0 commit(s)', as decision 2 gives both refs; no test or doc read the old text. The tier grew by three in-process tests. The coordinator re-ran the slow and touched modules and the bar."
alternative = "Keep two judges with a shared descent check; rejected by the plan's decision 2, one rule for both refs."
reversal_cost = "Low."
why_not_escalated = "The skill's build step and the plan's decision 2."
review = ""

[decision.D-005]
decided = "Build stage 5 (P6, P7), on a fresh Claude Opus builder (the stage-4 builder's session was not carried into this coordinator session), from a short brief that binds the stage brief's rules unchanged. P6 rewrites the launcher's docstring: the run's trunk bound once, the Stops list naming the run-start trunk refusal (exit 2), the pre-leg snapshot and checkout stops, the archive descent stop and the unreadable-claim stop, a new 'The bound.' paragraph from the spec's Trust section, and check-lane judging from the trunk the kit's reader names. P7 adds the coordinator-cycle skill section 7 clause (the launcher judges every leg against the trunk it bound at run start and stops when a leg leaves the primary checkout on another branch), synced to both copies by bootstrap.py --dest . --sync. The stage brief asked the builder to extend the RESYNC entry for the skill if it did not already name it; the builder declined, correctly: the skill is scope: this-repo, bootstrap's delivery inventory excludes it, and check_resync counts only stage 1's two shipped paths, so an entry naming it would mislead an adopter. Text only, so no new test. The coordinator re-ran the bar."
alternative = "Extend the RESYNC entry anyway; rejected, the file does not ship."
reversal_cost = "Low."
why_not_escalated = "The plan's P6 and P7; the RESYNC call follows the delivery inventory."
review = ""

[decision.D-006]
decided = "The order of the rest of the lane: P8 (Terra's spine turn) and counted round 1 wait until WI-918 has landed and this lane has rebased onto it, rather than running now and re-sitting after the rebase as the 2026-10-18f handoff's queue row reads. P8 amends LLR-248 and TC-242, the rows WI-918's checkpoint is amending now, and both lanes edit _loop_window and lane_refusal; rebasing first lets Terra amend the text WI-918's sitting approves, settles the code conflict before any reviewer reads the lane, and lets round 1 review the tip that lands, so no uncounted post-rebase round and no second sitting of the shared rows is owed. The lane idles meanwhile; nothing else in the queue is held by it."
alternative = "The handoff's order: P8 and round 1 now, then rebase, re-sit LLR-248 and TC-242, and run an uncounted convergence round over the rebased tip; rejected as two extra review sessions and a re-sitting for no earlier landing."
reversal_cost = "Low: the order of steps the lane owes either way."
why_not_escalated = "Sequencing inside the queue the owner ordered; the landing order (WI-918 first) is unchanged."
review = ""

[decision.D-007]

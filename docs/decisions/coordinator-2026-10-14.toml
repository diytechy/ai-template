# docs/decisions/coordinator-2026-10-14.toml — the attended coordinator session
# of 2026-10-14 (review-churn program, first batch); delegated decisions made on
# trunk (coordinator). Lane decisions are in each lane's own record. Format:
# project-trajectory/decisions.template.toml.

high_risk = ["D-005", "D-006"]

[decision.D-001]
decided = "WI-910's spec of record is a new docs/specs/WI-910.md holding the Mac drill record (how the drill ran, its two findings, why they went unseen), moved verbatim out of the row; the row's specref names it, and the row keeps its filing line and its Done-when. This is the review-churn queue's 'pre' trunk fix: the empty specref made check_trajectory.py --strict exit 1 on trunk (R-E)."
alternative = "Point the specref at an existing document instead: a placeholder that resolves (docs/work/README.md, as WI-906 does), the archived WI-909 row the drill continued, or the test module the fix touches; or point it at the row's own queued file, which stops resolving when the claim moves the row to active/."
reversal_cost = "Low: move the text back into the row and choose another specref; nothing reads the spec file but R-E, R-F and the review brief."
why_not_escalated = "The review-churn plan's revision 32 dispositions leave choosing WI-910's spec to the coordinator; the kit's docs/specs/ README names docs/specs/WI-###.md as a standalone WI's spec of record, and a placeholder would green R-E without giving the row a spec."
review = ""

[decision.D-002]
decided = "The review-churn batch row B1 is split at filing under S1: WI-911 carries the text every later lane runs under (the coordinator-cycle skill's review shape and pre-claim dispositions, the scope-critique rubric's S3, S4, B3, B4, delta and dependency anchors with its widened artifact line and the critique brief's matching render change, PROCESS.md section 3's record-at-event rule, the spine-questions and Terra-brief contract-voice fix, and the reviewer template's three clauses); WI-912 carries the verdict/act split (sitting briefs that judge only, the act turn in coordinator_adjudicate.py, the Loop-Session trailer line and the skill's section 4 text for it), needs WI-911, and builds behind the plan gate if S4 marks it single."
alternative = "File B1 whole and let its scope critique decide the split, as the handoff allows ('split under S1 if its critique finds it separate')."
reversal_cost = "Low: before either is claimed, fold WI-912 back into WI-911 and cancel WI-912."
why_not_escalated = "S1 is the coordinator's question at filing (coordinator-cycle section 1), the handoff anticipated this split, and the critique still judges it; the text half has no Trust section and no code beyond one render change, so holding it behind the act split's plan gate would delay every later lane's rules."
review = ""

[decision.D-003]
decided = "WI-912's three design calls left open by the plan are answered as its drafter recommended: the act turn is an adjudicator turn with its own act brief composed by a new act command from the committed verdict (revision 32's 'a later turn of the retained adjudicator', fresh where retention lapsed; OI-45 (b) keeps scripted approval retired); a released-rung MEANING row's bless decision becomes a typed mark on the verdict's row line, read by one reader in kitlib.verdict, an absent mark reading as not blessed; and the entry point appends agent_brief.loop_provenance_note() to every prompt it launches under the loop marker. The fourth call (where the managed loop's act turn is built) was the owner's: WI-809, whose Done-when now carries it."
alternative = "A continuation call on the retained session for the act (nothing to continue once retention lapses); the bless decision left as verdict prose for the act turn to read (its success then uncheckable); a trailer slot in each sitting template (the rule restated per template and doubled in the loop's sessions)."
reversal_cost = "Low before the claim: amend WI-912's Deliverables 1-4 and re-critique."
why_not_escalated = "Each answer follows a ruled text (revision 32's 'turn', ruling 2's record-at-event, the existing WI-636 provenance note); WI-912's scope critique judges them before the claim."
review = ""

[decision.D-004]
decided = "The review-churn batch row B2 is split at filing under S1, as its drafter recommended: WI-914 carries the LLR-292 amendment and the strict lints in the commit bar ([run] smoke, which also gains session-protocol's check_docs --stale line), the closure check and the landing check (planmode none); WI-916 carries the RESYNC-presence check, its wiring and K4's retirement (planmode single, a Trust section), soft-needs WI-914 and the plan gate. The B3 row WI-915's seven calls are ruled as its drafter recommended, including two behaviour changes that make the shared stack.ini reader fail closed: one decode rule (UTF-8, optional BOM, stray byte replaced; today a BOM makes the sym: reference tier skip silently) and an unreadable path read as an error, not as absent; so B3 is a refactor plus two fail-closed corrections, not the pure refactor the handoff named."
alternative = "Keep B2 whole (then single, with a Trust section, waiting for the plan gate); keep each stack.ini site's own decoding (four decode rules kept alive in the shared reader) and read an unreadable path as absent at four sites."
reversal_cost = "Low before the claims: fold WI-916 into WI-914, or restore the per-site decode and absent-path rules in WI-915's deliverable text."
why_not_escalated = "S1 is the coordinator's question at filing and the split's halves have different planning needs; WI-915's two behaviour changes close a fail-open the owner's rules forbid keeping, change no requirement row, and are judged by the scope critique before the claim."
review = ""

[decision.D-005]
decided = "The plan gate G is filed as WI-913, split from WI-805 (whose title, Done-when and needs are amended in the same commit: needs WI-804, WI-799 and WI-913), with its drafter's eight design calls ruled as recommended: the commit refuses a single row's build (the pre-commit hook in its lane, and the same check on every lane commit at landing); a second fresh convergence-stance critique judges the one allowed revision; a dispute FIX after that revision goes to the owner; the pass record binds the plan and the Done-when; advice binds through the plan, and promise-changing advice is written into the lane's Done-when or Trust; the loop's dispatch hold stays with WI-805; the gate hangs from SR-154; the plan states its delta on a typed DELTA line. WI-913 itself is planmode none and built without the gate it builds, as the handoff's G row says: it cannot plan itself, and a single mark would let its own new check hold its own lane."
alternative = "A procedural gate only (the review brief or the coordinator's checklist refusing an unplanned build) instead of a commit check; or the review brief naming the accepted plan for reviewers."
reversal_cost = "Low before the claim: amend WI-913's deliverables and re-critique; WI-805's split reverts with one file."
why_not_escalated = "Ruling 9 pulled the gate forward and fixed its one path; a commit-time refusal follows the owner's 2026-10-03 enforce-at-the-commit rule, and the scope critique judges the design before the claim."
review = ""

[decision.D-006]
decided = "WI-911's round-2 scope critique (S2, MAJOR) is adopted: a review brief's convergence marking lets a non-convergence-class MAJOR pass to a successor row instead of holding the landing, so the row gains a Trust section. The marking is a construction, not a convention: only review_brief.py review renders it, from a new --stance choice (ordinary by default, or convergence) as one fixed ROUND FACTS line, refused on a narrow round; a hand-appended line is not a marking and the unattended loop marks none; the reviewer applies the reduced blocking rule only on that rendered line, and the coordinator lets a successor-marked finding leave the landing's path only for a round its lane decisions record shows as one of the three convergence rounds at the verdict's reviewed tip. Every failure leaves the stricter ordinary stance."
alternative = "A coordinator-appended stance line named in the recipes, with the Trust section stating its failure rules (no code change); or reviewers that never relax, grading every round alike, with the coordinator alone applying the convergence blocking rule from the round's position."
reversal_cost = "Low before the claim: amend WI-911's deliverables 3 and 7 and its Trust section, and re-critique."
why_not_escalated = "The critique's remedy asked for a Trust section, which the coordinator writes before the claim (coordinator-cycle section 1); the rendered choice reuses review_brief.py's existing round model, which already refuses a narrow round's shape in a full one. The Trust ruling itself goes to the owner to confirm or overrule, as every row's does."
review = "Owner, 2026-10-14, in session (the attended coordinator's question on WI-911's round-3 critique): only the dispute sitting may move a BLOCKER or MAJOR to a successor row. The reviewer only tags each finding's class, every open BLOCKER or MAJOR after a convergence round goes to the sitting, and the dispute grammar gains a SUCCESSOR ruling (WI-911 deliverable 8). The convergence marking carries no authority, so WI-911 loses the Trust section this entry chose."
owner = "overruled"

[decision.D-007]
decided = "WI-913's round-1 scope critique (S3, MINOR, a capped CHANGES-REQUESTED of MINORs only) is adopted with a different resolution than the critic's partial close: the plan critique's word is read through kitlib.verdict.effective_verdict, the one rule the loop and the merge slot share, so a CHANGES-REQUESTED whose findings are all MINOR reads as an APPROVE at either critique and its findings stay in the filed record for the build to weigh. The critic's resolution keeps the remaining case: a capped critique that does not read as an APPROVE and has no BLOCKER or MAJOR finding to dispute closes the lane partial for the owner, and an empty dispute set never authorizes a pass record."
alternative = "The critic's remedy as written: a capped MINOR-only CHANGES-REQUESTED closes the lane partial for an owner decision; or a revision at the first critique for MINOR findings, as the row first read."
reversal_cost = "Low before the claim: amend WI-913's deliverable 3 and Trust section, and re-critique."
why_not_escalated = "Ruling 4 says a MINOR never costs a round, and the kit already routes a MINOR-only CHANGES-REQUESTED as an APPROVE in one home for its two readers; a partial close would spend an owner decision on findings the reviewer did not think worth blocking on. The confirming critique judges the change before the claim."
review = ""

[decision.D-008]
decided = "WI-912's round-1 scope critique (S3, MAJOR, the act turn's re-runs) is adopted with one change to the remedy: each authorized act is judged at the lane's HEAD in its committed tree, taken when HEAD carries all of it and owed when it carries none of it; any other combination, such as a flip committed without its snapshot copy, is refused before the launch, naming the row, instead of resumed; and the act turn refuses a lane with uncommitted changes, so a flip left uncommitted by an interrupted turn is discarded by the coordinator, recorded, before the re-run lists the whole act."
alternative = "The critic's remedy as written: a status-only partial act at HEAD is resumed, the brief listing the missing snapshot and its commit without a second flip."
reversal_cost = "Low before the claim: amend WI-912's S3 Re-runs answer, Trust ruling and Done-when tests, and re-critique."
why_not_escalated = "Both forms fail closed; refusing serves a state the commit hook's integrity floor may already exclude without adding a resume path for it, and the reachable partial states (an uncommitted flip, or a combined act stopped between its two commits) are handled either way. The confirming critique judges it before the claim."
review = ""

[decision.D-009]
decided = "WI-902's lane acts 113 to 117, taken in the lane on 2026-10-11 for the history-reading sweep, do not land: SR-148 (act 113) and the six rows of act 114 (LLR-153, LLR-161, LLR-312, TC-147, TC-156, TC-254) are re-sat at the rebuilt lane's checkpoint and take their acts there, above trunk's top; acts 115, 116 and 117 retire with the replay design they blessed, and LLR-335 and TC-360 are first-approved at the rebuilt checkpoint. Nothing is renumbered, so trunk's next act (WI-914's LLR-292 act) takes seq 113 (the lane record, docs/plans/2026-10-11-review-churn/wi-902-lane-record.md, part (a))."
alternative = "Keep verdict 006's SR-148 blessing and re-take act 113 from it under WI-912's act turn, provided SR-148's bytes are unchanged; or keep acts 113 and 114 and renumber them above trunk's ledger at the landing."
reversal_cost = "Low: no act has reached trunk. An overrule re-takes act 113 from verdict 006 at the rebuild, one re-sit fewer."
why_not_escalated = "The owner ruled the reshape (plan ruling 2) and the B4 row asks the coordinator to decide the lane's acts before the rebuild; retiring lane-only acts loses nothing trunk holds, and the rebuilt checkpoint sits anyway because the code those rows' trace homes cite changes (coordinator-cycle section 4)."
review = ""

[decision.D-010]
decided = "WI-902's lane is re-cut from trunk's tip at its rebuild, porting the survivors the lane record lists (kitlib/adoption.py, the section parser, the lineage join, title identity, the handback arms, the prompt, manifest and recipe edits, the tests, the lane's reviews and verdicts as its record, and its decisions record with each entry's fate), and its old tip d3d301216 is archived whole to archive/lanes, instead of rebasing its 48 commits and dropping the five act commits."
alternative = "Rebase the 48 commits onto trunk, dropping the five act commits, and archive the pre-rebase tip with each dropped act as an extra parent (the lane record's first draft)."
reversal_cost = "Low: nothing moves until the rebuild, and a rebase can still be chosen then."
why_not_escalated = "How a lane comes onto trunk is a coordinator mechanic: this harness has no interactive rebase, each replayed registry commit risks the recipes' section 4 conflicts, and most of the 48 commits carry code the reshape deletes or rewrites."
review = ""

[decision.D-011]
decided = "WI-902's rebuilt lane keeps the ids LLR-335, TC-360 and IF-294 for its reshaped rows, under the owner's keep-or-mint rule (plan revision 26, with revision 31's cross-reference): the spirit, one rule and one home for the adoption decision shared by its two ends, is retained; every live user (the surviving functions' tags, TC-360's verifies, IF-294's note, LLR-153's citation) already cites them and is rebuilt anyway; trunk never saw the old text; and the lane's verdicts and reviews that quote the old meaning are records, not users. The commit check's new rows are minted above WI-798's lane ids."
alternative = "Mint new ids for the reshaped LLR, TC and IF rows, retiring LLR-335, TC-360 and IF-294 with their old meaning, and re-tag the survivors."
reversal_cost = "Low before the rebuild: mint at its spine step instead. After it: a re-tag commit and the new rows' sitting."
why_not_escalated = "The keep-or-mint rule decides case by case and names its tests (spirit retained, fewer changes); the check that each other user still reads compatibly runs at the rebuilt checkpoint's sitting."
review = ""

[decision.D-012]
decided = "WI-902's adoption record is a declared Adopted column of the work-item table (front-matter key adopted), beside Adjudicates and Digests, read by one strict reader, so neither parse_spec nor a converter drops it."
alternative = "A raw front-matter key read only by the close, the commit check and the sweep: no column-table change, at the risk that parse_spec or a converter drops it."
reversal_cost = "Low before the rebuild: amend deliverable 2 and the Trust section's record carrier, and re-critique."
why_not_escalated = "It follows the kit's precedent for a machine-written work-item cell (Adjudicates, Digests); the carrier's authority and failure contract are in the row's Trust section, which goes to the owner with its Trust ruling."
review = ""

[decision.D-013]
decided = "WI-902 keeps the Dispositions parser's unpaired-fence refusal (review 015's MAJOR, the lane's D-010) in the same row and landing as the adoption record, as its deliverable 5, rather than splitting it into a row that lands first: the reshape rewrites that parser and its return shape, the refusal's regression is review 015's adoption reproduction, and a split would serialize two mechanism landings on one function."
alternative = "Split the unpaired-fence refusal into its own row under S1, landing first, since it fixes a silent loss trunk already has for drafts."
reversal_cost = "Low: a split row can be filed on trunk before the rebuild, taking deliverable 5 and its tests."
why_not_escalated = "S1 lets independent deliverables stay together when that is recorded in the spec with its reasons; the coordinator records the keep-together, as D-002 did for WI-912's trailer line, for the owner to confirm or overrule (if split, the parser fix lands first)."
review = ""

[decision.D-014]
decided = "WI-902 keeps the mint's lineage corrections (the lane's D-003 and D-004: a drafts-only replay re-points to the full successor set, and an exact-title match on another lineage refuses the mint before any write) in the same row and landing as the adoption record, as its deliverable 10, rather than splitting them into a row that lands first; this answers the round-1 scope critique's MINOR S1 finding, which asked that they be named and their grouping decided."
alternative = "Split them into their own row under S1, landing before the rebuild, since they fix trunk's mint for drafts without the record."
reversal_cost = "Low: a split row can be filed on trunk before the rebuild, taking deliverable 10 and its tests from the lane's survivors."
why_not_escalated = "As D-013 for the parser fix: S1 lets independent deliverables stay together when the spec records why; their functions are the ones the adoption's lineage join extends, D-004 builds a dispute ruling's FIX already reviewed in the lane, and the owner may split them (the spec states the order)."
review = ""

[decision.D-015]
decided = "P9's lane-mode rule (plan revision 36: a lane claimed headless lands headless, or the attended coordinator re-claims it before committing in it) is read as covering any lane a headless leg marked: its claim, or any commit one of the loop's own writers made in its range under the marker, a sitting's telemetry commit included, since the merge slot's loop-lane window (provenance.loop_lane_window) opens at either. WI-917 states the rule so, and WI-918's re-claim closes either."
alternative = "Read 'claimed headless' literally, as only a lane whose claim commit carries the trailer, leaving outside the rule a lane claimed attended and then sat in by a headless leg, whose later attended commits the merge slot would still refuse once WI-808 moves landings onto it."
reversal_cost = "Low before WI-917's build: narrow deliverable 3's rule text. The slot's window would still open at a sitting's commit, so a narrowed rule leaves such a lane unlandable through the slot without a re-claim."
why_not_escalated = "It follows the merge slot's existing definition of a loop lane rather than adding one, and the ruling's purpose (a lane that spans headless and attended sessions, as WI-798's did, stays landable) needs the wider reading."
review = ""

[decision.D-016]
decided = "WI-917's design calls: (Q1) one loop session per overnight run, set once by the launcher through mark_loop_process, so a lane one leg claims and a later leg continues names one session; (Q2) each leg's prompt is the handoff's one attended session prompt, then a fixed headless block (scripts/coordinator/headless-leg.md) that states only the mode, then the kit's loop_provenance_note, so no second headless prompt is copied between handoffs; (Q4) a leg that reaches an owner-held step brings the lane to a safe committed point, records the step and its evidence, files a pending open item where only the owner can decide, moves to the next row, and closes out with Overnight: stop when no row can move; (Q5) every commit carries the trailer by construction for porcelain commits and the kit's writers, by recipe for the archive commit, and by the launcher's after-leg audit for every other route."
alternative = "A session per leg; a separate headless session prompt carried in each handoff, as legs 01 to 03 used; a leg that stops the whole run at the first owner-held step."
reversal_cost = "Low before the build: amend deliverables 1 to 3 and re-critique; after it, a launcher and skill edit in a lane."
why_not_escalated = "Each follows an existing kit contract (mark_loop_process's once-per-run marker, the kit's own trailer note, skill section 5's open-item route) or removes a drift the 2026-10-11 legs showed (leg 03's copied prompt still prescribes narrow rounds); the owner may overrule any one."
review = ""

[decision.D-017]
decided = "WI-918's re-claim, how a re-claim clears the loop mark (P9's Q3): an unmarked, empty commit in the lane whose subject is reclaim: <branch> (attended), read by provenance.loop_lane_window as closing the trailer window for the commits after it; a marked process cannot make one through porcelain, a commit with any Loop-Session trailer is not one, and a later marked loop-writer commit re-opens the window. Its authority, the first record that makes a lane less governed, is held to one rung and goes to the owner with WI-918's Trust section."
alternative = "A second, unmarked claim commit on trunk for the branch (which cannot clear a sitting's mark); or dropping SR-209's loop-lane rule so that no re-claim is needed (which removes the managed loop's guard too)."
reversal_cost = "Low before WI-918's build: amend its deliverable and Trust section and re-critique. Re-claim commits WI-917's recipe wrote before then stay inert records."
why_not_escalated = "P9's design is the coordinator's to propose (plan revision 36); the authority it creates is stated in WI-918's Trust section, whose ruling goes to the owner to confirm or overrule before the row is built."
review = ""

[decision.D-003]
decided = "Round 1 triage. REVIEW-B's MAJOR is confirmed: the named-tests step appends paths and a basetemp argument to `[product] test`, and the unattended draw now reaches it, so a runner refusing them reds every code-touching row. wi-956 D-002 left the remedy as the owner's call (a declared placeholder, or a pytest-only note). This round takes the note, in the shipped template's comment and the RESYNC entry, which also drops its no-forced-migration claim for such an adopter: it fails closed, changes no code, and forecloses nothing, since a placeholder can still follow. The render's derivation refusal now names the reviewed commit and the step that clears it, with the derivation's text whole inside it, keeping SR-241's approved sentence true. A walk case pins the through-its-LLRs arm. The row-text MINORs (LLR-367's references, TC-420's overlap, the eight planned-tests methods) go to the checkpoint's change list."
alternative = "Build the placeholder now, or hold the row for the owner."
reversal_cost = "Low: text; the placeholder remains open."
why_not_escalated = "Text only, fail-closed, and listed for the owner to confirm or overrule; it needs no ruling to stand."
review = ""


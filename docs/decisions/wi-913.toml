# docs/decisions/wi-913.toml — delegated decisions made in the WI-913 lane (the
# plan gate, review-churn batch row G) by the attended coordinator. Format:
# project-trajectory/decisions.template.toml.

high_risk = []

[decision.D-001]
decided = "The plan gate's command line gets its own exit-code interface row, IF-295 (owner scripts/plan_gate, consumer scripts/check, which runs it as the plan-gate step), in the shape of IF-230, the assumption gate's command: every check.py step that runs a script of its own declares that script's seam, except three generators, and this one holds builds. The coordinator adds the module's Contracts marker and Contract IF-295 body in IF-230's docstring form, and retags the Implements lines of the functions moved from LLR-313 to the gate's new LLR, in the commit that carries Terra's rows. The Done-when's spine bullet is not amended: it names the rows the change requires and does not exclude a seam the build exposes."
alternative = "Ride IF-040 (check.py's exit code to the pre-commit hook), which says nothing of the gate's own exit contract or its hold lines; or amend the Done-when to list the new row, which holds the lane's next build until a sitting blesses the new text."
reversal_cost = "Low before the checkpoint sitting: delete IF-295 and its docstring body, and cite IF-040 from the gate's test case instead."
why_not_escalated = "The builder flagged the call for the coordinator; the registry's own precedent (IF-230) answers it, and the lane's full-lane reviews and the checkpoint sitting judge the row and its body."
review = ""

[decision.D-002]
decided = "The lane's review rounds run in the review-churn trial shape (plan revision 37): three full-lane reviewers in parallel, each from its own render and scratch: Codex Sol at medium filed as REVIEW-A, and Claude Fable at medium and Claude Opus at high, both stand-ins for the Gemini reviewer B slot, each filed as REVIEW-B under its own number. Both stand-ins share the builder's and the adjudicator's model family, and Opus shares the builder's model; the decision recording each round names the model behind each REVIEW-B file. The lane starts its count at round one; at most three rounds before the checkpoint."
alternative = "The plan's norm of two reviewers (Sol and one stand-in), or the coordinator-cycle skill's narrow Sol rounds, which ruling 4 retired."
reversal_cost = "None for rounds already run; a later round may drop a stand-in."
why_not_escalated = "The owner ruled the trial for this program (revision 37) and the substitution until WI-815's Gemini route (ruling 7); this record states it for the lane, as the ruling asks."
review = ""

[decision.D-003]
decided = "Round 1 (three full-lane reviews of 96b00df, filed as docs/reviews/wi-913/001-REVIEW-A-96b00df.md by Codex Sol at medium, 002-REVIEW-B-96b00df.md by Claude Fable 5.1 at medium and 003-REVIEW-B-96b00df.md by Claude Opus 5.5 at high) is dispositioned. Accepted MAJORs, fixed in round 2's build: 001 F1 (a non-string planmode value in a claim copy, such as false, 0, [] or {}, collapses to the ungated empty value, failing open on the spec's closed set) and 003 F1 (the cap recipe numbers the dispute findings F1..Fn over the blocking findings, while the gate and the filing step number a finding by its position among all the critique's findings, so a sitting's accepted DISMISS of a MAJOR after a MINOR is refused and the lane goes to the owner). Six code and text MINORs are fixed in the same build, since round 2 runs for the MAJORs anyway and a successor row would cost a lane: 002 F1 (a squash whose tip no local branch contains is judged by nothing at the hook; this repository lands by hand, so the hook is its only check), 002 F2 (the critique-record pattern admits rounds above the two the gate allows), 002 F3 (the merge slot's wiring is pinned by reading its source instead of driving it), 002 F5 (the RESYNC entry names a template path an adopter does not have), 003 F4 (neither RESYNC nor the recipe names the recovery for a row already claimed single whose lane holds build commits; WI-902 is the live case, and its re-cut, D-010 of coordinator-2026-10-14, runs plan, critique and pass first) and 003 F5 (the second critique renders without checking the revision against the first critique's findings, which deliverable 3 names). Four row-text MINORs go to the checkpoint's spine change list for Terra: 001 F2, 003 F2 and 003 F3 (SR-154's added acceptance: the cap clause read with an approving second critique, the clause outgrowing the requirement statement and its fan-out, the cross-family clause as an obligation on the launch, and an unrecognized mark being held) and 002 F4 (TC-333's smoke tier against filing evidence that runs in the slow tier). Trial tally (accepted findings by reviewer): Sol 1 MAJOR and 1 MINOR; Fable 5 MINOR; Opus 1 MAJOR and 4 MINOR. Round 1 of at most three before the checkpoint."
alternative = "Fix only the two MAJORs and file the six code MINORs as a successor row (ruling 4: MINORs never cost a round), or dispute 003 F1 as a recipe-only defect."
reversal_cost = "Low: any MINOR fix can be dropped from the round's diff before it is committed."
why_not_escalated = "Ruling 4 keeps MINORs from costing a round, and none does here: round 2 runs for the two MAJORs. Both MAJORs are reachable in normal use or fail open, and neither is contested."
review = ""

[decision.D-004]
decided = "Round 2 (three full-lane reviews of 0f23c75, filed as docs/reviews/wi-913/004-REVIEW-A-0f23c75.md by Codex Sol at medium, 005-REVIEW-B-0f23c75.md by Claude Fable 5.1 at medium and 006-REVIEW-B-0f23c75.md by Claude Opus 5.5 at high) is dispositioned. Accepted MAJOR, fixed in round 3's build: 004 F1 (the shipped pre-commit hook never runs the plan-gate step: its explicit step floor omits it and the step registers no path trigger, so a single lane's unplanned build commit passes the hook; confirmed by reading the hook's step list). MINORs fixed in the same build, since round 3 runs for the MAJOR anyway: 006 F1 (the pre-record path set misses two writers the kit prescribes, the station refresh merge's regenerated views and compiled log and a docs/log.d fragment, so a single lane that exits to a partial close cannot land; fails closed, reproduced by the reviewer), 006 F2 (the Done-when-digest arm of the pass form and of the pass-record commit has no test, which the Done-when's 'a test covers each' names), 006 F3 (the coordinator-cycle skill's step 5 sends an adopted Done-when change after the pass record, which unbinds it) and 005 F1 (the pass form compares working-tree bytes with HEAD's blob, so line-ending conversion after a rebase fails it closed with a misleading message). Row text to the checkpoint's spine change list: 004 F2 to F6, 005 F3 and F4, 006 F4 and F5 (SR-154's acceptance wording, LLR-313's two coverage rounds, TC-333's tier, IF-288's and IF-289's dispute-findings mode). Recorded, no change: 005 F2, the ids this lane's Terra skipped (LLR-327 to LLR-336, TC-352 to TC-366, IF-294) are the open lanes' own (wi-798 holds the LLR and TC ranges, wi-902 the IF), chosen as a floor so no id collides; they are not retired, and the spent-id advisory lists them until those lanes land their rows (plan item 16's watermark carrier ends the floor). 005 F5, LLR-069's and LLR-302's code_symbol and module edits are back-link upkeep for functions this lane moved or added, not row text, and are listed in the spine change list's trace-cell section for the sitting. Trial tally, round 2 (accepted): Sol 1 MAJOR; Fable 1 MINOR; Opus 3 MINOR. Round 3 is the last allowed round before the checkpoint and runs in convergence stance."
alternative = "Defer 006 F1's pre-record set extension and 005 F1 to a successor row (ruling 4: MINORs never cost a round); or retire the skipped ids with retire.py --seed (which would spend the open lanes' ids for good)."
reversal_cost = "Low: any MINOR fix can be dropped from round 3's diff before it is committed."
why_not_escalated = "The MAJOR is a confirmed fail-open of the Done-when's first arm; the MINORs ride a round that runs anyway, and the id floor follows recipes section 4."
review = ""

[decision.D-005]
decided = "Before round 3, the convergence round, every accepted finding of rounds 1 and 2 is mapped to the regression test that fails on its pre-fix code, or to independently checkable evidence (owner rulings 4 and 8, revision 33): 001 F1 to test_plan_pass::test_a_non_string_planmode_is_outside_the_set_and_named and test_plan_gate::test_a_non_string_planmode_holds_at_the_hook_and_the_landing; 003 F1 to test_plan_filing::test_at_the_cap_a_major_after_a_minor_is_disputed_under_its_own_number, test_at_the_cap_two_blocking_findings_with_one_dismissed_are_refused and test_the_dispute_findings_file_refuses_ids_other_than_the_blocking_ones; 002 F1 to test_plan_gate::test_a_squash_no_local_branch_contains_is_held_by_name; 002 F2 to test_plan_pass::test_a_critique_round_past_the_cap_is_no_critique; 002 F3 to test_plan_gate::test_the_merge_slot_asks_the_gate_of_each_lane_commit (evidence: it fails with the gate call removed from integrate.py, the slot's wiring being right already); 002 F5 and 003 F4 to the corrected RESYNC_PACK.md entry and recipe text; 003 F5 to test_plan_filing::test_the_second_critique_refuses_a_revision_that_misses_a_first_finding; 004 F1 to test_plan_gate::test_the_shipped_hooks_floor_refuses_an_unplanned_build; 006 F1 to test_plan_gate::test_each_record_home_passes_before_any_record[log-fragment] and test_a_refresh_merge_of_a_partial_closed_lane_passes; 006 F2 to test_plan_gate::test_a_pass_record_whose_critique_reviewed_another_done_when_is_refused (evidence: it fails with the reviewed-tree check narrowed to plan bytes, the code being right already); 006 F3 to the corrected step 5 of the coordinator-cycle skill; 005 F1 to test_plan_filing::test_the_pass_form_reads_a_committed_critique_through_line_ending_conversion. The builder's round 3 also reported, outside this row, that WI-841's done-when-blessed step is registered but missing from the shipped hook's step floor with no path trigger, so the hook never runs it (confirmed on trunk); it is filed on trunk as its own row, not fixed here."
alternative = "Run the convergence round without a mapping (the ruling forbids it), or fix done-when-blessed's floor in this lane (outside its named surface and its RESYNC entry)."
reversal_cost = "None: the mapping is a record."
why_not_escalated = "The mapping is the coordinator's step the ruling names; the stray defect follows the stop-and-file rule."
review = ""

[decision.D-006]
decided = "Round 3, the last allowed round, ran in convergence stance (decision D-005 mapped every earlier accepted finding to its test or evidence first; the briefs carried no earlier verdict): three full-lane reviews of 2d33622, filed as docs/reviews/wi-913/007-REVIEW-A-2d33622.md by Codex Sol at medium, 008-REVIEW-B-2d33622.md by Claude Fable 5.1 at medium and 009-REVIEW-B-2d33622.md by Claude Opus 5.5 at high, all APPROVE with MINORs only. With no BLOCKER or MAJOR, the lane moves to its checkpoint. Row text to the checkpoint's spine change list: 007 F1 to F3, 008 F3 to F5, 009 F2 to F4 (SR-154's wording; LLR-313's two coverage rounds and its dispute-findings writer; LLR-337's pre-record set with the log fragments and a merge's regenerated views and compiled log, and the spec's S3 list to match; TC-333's tier; IF-288's and IF-289's dispute-findings mode). Three code MINORs share one class, landing shapes the hook does not judge, each escaping only a hand landing that leaves the recipe and each still caught elsewhere or needing a hook bypass: 008 F1 (a build commit on a detached HEAD in a single lane's worktree; the squash path and the merge slot hold it), 008 F2 (a hand git merge --no-ff of a lane on trunk) and 009 F1 (a squash from a renamed alias of the lane after a --no-verify lane commit). They are not fixed here: the coordinator files one successor row for the class on trunk at this lane's landing. Trial tally, round 3 (accepted): Sol 3 MINOR (row text); Fable 5 MINOR (3 row text, 2 to the successor); Opus 4 MINOR (3 row text, 1 to the successor)."
alternative = "A fourth fix round for the hook-shape MINORs (the cap forbids it; MINORs never cost a round), or dismissing them as contrived (two are plausible hand mistakes on this repository's own landing path)."
reversal_cost = "Low: the successor row can be cancelled before its claim."
why_not_escalated = "Ruling 4's convergence round blocks only on fail-open, data loss or a Done-when gap, and none was raised; MINORs go to the spine change list or a successor row, as here."
review = ""

[decision.D-007]
decided = "The checkpoint's authoring directions and the coordinator's own text edits, after the lane rebased onto trunk at 2025f8419 (pre-rebase tip b9de474d7, kept for the archive). (a) SR-154: its added acceptance needs a scope its approved requirement statement does not carry (003 F3: the statement covers unattended work reaching integration; the planning half holds attended lane builds), so Terra amends the statement by addition, keeping the approved text verbatim, and also records a 'fan-out re-stamp: <reason>' in Rationale, since the statement addition does not reduce SR-154's direct LLR children from 9 to the declared 7. The reason is the Done-when's own placement: the WI-788 matrix homes the single plan's critique on SR-154, with the dial left to WI-805, so the two new children (LLR-313 for the briefs and filing, LLR-337 for the gate) are one obligation's two carriers, not a merged decision. (b) TC-333 keeps the filing cases, since the Done-when names TC-333 for the briefs and the filing; its tier stays Smoke for its approved and smoke-resident cases, and its appended Method says which plan cases run only in the full suite (002 F4's second option). (c) The coordinator amends the spec's S3 answer (the pre-record path list gains the log fragments and a merge's compiled log and regenerated views, 006 F1) and the plan-decomposition rubric's coverage sentence (first and revised plans distinguished, 007 F2), byte-exact to the code at HEAD; neither is Done-when text."
alternative = "(a) Mint a separate SR for the attended planning hold (departs from the Done-when's naming of SR-154 and the WI-788 matrix, a Done-when change that holds the lane); or only re-stamp the fan-out and leave the statement narrower than its acceptance. (b) A new Full-tier TC for the filing cases, or moving them to TC-367, either of which leaves the Done-when's 'TC-333 for the briefs and the filing' untrue; or retiering TC-333 Full, which drops the per-commit claim of its approved smoke cases."
reversal_cost = "Low before the sitting: Terra re-authors the cells; after it, a re-sit of SR-154 or TC-333."
why_not_escalated = "Both are spine-authoring calls inside the Done-when's named rows; the combined sitting judges the text, and the owner confirms or overrules this record."
review = ""

[decision.D-008]
decided = "Sitting 010 (combined, docs/reviews/wi-913/010-ADJUDICATE-76dc674.md) blessed and re-attested LLR-313 and TC-333, first-approved LLR-337 and TC-367 (the adjudicator's two acts, in the lane), and returned SR-154. Its return is answered in the lane (the S11 in-lane adjudication ruling), not minted as a rework row. (a) SR-154: the disposition's item 1, first option, removes the clause that the plan's critique is launched from a model family other than the planner's from the appended acceptance. The launch is the coordinator procedure's step, no check can observe it (the filing reads the critique's text, not its author), and SR-154's approved first sentence already carries cross-family routing, with its documented degradation, for unattended critique. Item 2's 'shall refuse' would give SR-154 a second shall, which the one-shall form rule reports in trace.py --strict, a finding WI-913's Done-when forbids; the owner chose in session (2026-10-15), over a separate SR for the hold (reversing Q7 of coordinator-2026-10-14 D-005 and changing the Done-when) or a waiver with a Done-when exception, to reorder the approved sentence so its unattended condition scopes only the routing predicate, and to carry the planning hold as a second predicate under its one shall. The coordinator applied that text byte-exact with a guarded edit that keeps every approved word, reordered, as a sitting return's fix, openly and recorded here. (b) TC-333's tier becomes Full, superseding D-007 (b)'s tier half: the sitting's advisory cites TC-205's rule that the tier is the cheapest one at which every cited arm runs, and TC-333 cites modules the smoke tier deselects. Its appended Method keeps the per-commit and full-suite split. (c) SR-154 and TC-333's tier are re-sat together in one amendment sitting; once it anchors them, the verdict's Dispositions section moves under 'Dispositions answered in the lane', so the landing sweep mints no rework row."
alternative = "(a) The disposition's second option: state the critic-family obligation in SR-154's requirement, with a configured-family condition, the same-family degradation and an Attest or Demonstrate verification, which adds an obligation no gate reads. (b) Keep TC-333 at Smoke as D-007 (b) chose, against TC-205's recorded rule."
reversal_cost = "Low: a later row can state the critic-family obligation with its own verification; the tier is one cell."
why_not_escalated = "Both answer an adjudicator's return and advisory inside the lane's named rows; the re-sit judges the text, and the owner confirms or overrules this record."
review = ""

[decision.D-009]
decided = "The post-checkpoint gate runs uncounted, in convergence stance, with the trial's three reviewers (D-002), each from its own render and scratch, over the lane from its trunk base to the tip after the checkpoint's acts. Before it, every finding accepted since D-005's mapping is mapped to its evidence (owner rulings 4 and 8, revision 33). Round 3's accepted row-text MINORs (007 F1 to F3, 008 F3 to F5, 009 F2 to F4) map to the corrected text at each cited site: the reconciled cells of the checkpoint commit (SR-154, LLR-313, LLR-337, TC-333, TC-367, IF-288 and IF-289), as sittings 010 and 011 judged them, the spec's S3 answer and the plan-decomposition rubric's coverage sentence (the checkpoint prep commit). Round 3's three hook-shape MINORs (008 F1, 008 F2, 009 F1) are not fixed in the lane; they go to the successor row filed on trunk at the landing (D-006). The gate's briefs carry the two by-hand addenda, and their reading exclusion is extended from docs/reviews/ to this lane's decisions record, docs/decisions/wi-913.toml, which summarizes every earlier round's findings and dispositions: the anchoring ruling keeps earlier conclusions from a convergence reviewer, and a reviewer reading that record meets them."
alternative = "Leave the decisions record readable, as round 3's briefs did, and rely on the reviewers not to anchor on it."
reversal_cost = "None: a brief-wording choice for one round."
why_not_escalated = "It applies the owner's anchoring ruling to a record the by-hand addendum did not name; the mapping is the coordinator's step that ruling assigns."
review = ""

[decision.D-010]
decided = "The uncounted post-checkpoint gate (D-009) passed: three full-lane reviews of 6d7a153, in convergence stance, filed as docs/reviews/wi-913/012-REVIEW-A-6d7a153.md by Codex Sol at medium, 013-REVIEW-B-6d7a153.md by Claude Fable 5.1 at medium and 014-REVIEW-B-6d7a153.md by Claude Opus 5.5 at high, all APPROVE with MINORs only, so the lane lands. Dispositions: 013 F2 and 014 F2 (the RESYNC_PACK.md entry anchored at the lane's old base aac06695e) are fixed at the landing, which re-anchors the entry at the landing's parent (recipes section 3). 013 F1 and 014 F1 (SR-154's reordered requirement can read as scoping the single-plan refusal under its unattended condition) and 013 F3 (an unreachable branch in the gate's cap check, a guard for a state the filing boundary already refuses) go to the successor row D-006 files at the landing, whose lane re-touches SR-154's gate chain and the gate's code: restate the single-plan predicate with its own condition under the row's one shall, and delete the branch. 012 F1 (the interface rows for the coverage command, its exit result and its report do not list the attended brief renderer among their requestors and consumers) is deferred to the plan's item 11 phase-3 migration, which re-derives every interface's local consumer and requestor sides from code, and is named in the handoff so that census covers it. A fix here would put an unreviewed delta on the landing tip, which ruling 4 spares MINORs. Trial tally, the gate (accepted): Sol 1 MINOR (unique); Fable 3 MINOR (1 unique, 2 shared with Opus); Opus 2 MINOR (both shared with Fable)."
alternative = "Fix SR-154's wording and delete the branch in the lane, which re-sits SR-154 and reruns the gate over the changed rows and code."
reversal_cost = "Low: the successor row's scope can drop either item before its claim."
why_not_escalated = "Ruling 4: MINORs never cost a round, and the gate raised no fail-open, data-loss or Done-when finding."
review = ""

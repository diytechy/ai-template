alternative = "A ledger format-version marker as the legacy boundary; or treat a missing field as an empty copy set."
reversal_cost = "Low before the claim; medium after the build (the field name and boundary are in the producer, validators and IF-220)."
why_not_escalated = "Within the ruled OI-115 (a) scope; the commit boundary follows the owner's enforce-at-the-commit rule and the readers' existing seq comparison; the Trust ruling is routed for confirm or overrule (coordinator-cycle section 1)."

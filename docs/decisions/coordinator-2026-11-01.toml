[decision.D-006]
decided = "Headless leg 28: WI-967's scope critique (Sol, CHANGES-REQUESTED findings=4, all MAJOR) answered by adopting all four. The design calls the dispositions make: the new entry field is named `copied`, the sorted repo-relative registry files the act actually wrote, drawn from SNAPSHOT_TIERS' files; a legacy entry (no `copied`) reads as copy set unknown, never empty, and is never backfilled; the new-versus-legacy boundary is the commit (an entry a commit adds against its parent, by seq, must carry `copied`) plus a whole-file monotone rule (no entry omits it after one that carries it), never a format marker. The spec gains a Trust section whose one shared Ruling is routed to the owner for confirm or overrule. The adopted text leaves the spec more than three times its filing size (2463 to 8412 bytes), so the row is listed under the handoff's For the owner."
alternative = "A ledger format-version marker as the legacy boundary; or treat a missing field as an empty copy set."
reversal_cost = "Low before the claim; medium after the build (the field name and boundary are in the producer, validators and IF-220)."
why_not_escalated = "Within the ruled OI-115 (a) scope; the commit boundary follows the owner's enforce-at-the-commit rule and the readers' existing seq comparison; the Trust ruling is routed for confirm or overrule (coordinator-cycle section 1)."
review = ""


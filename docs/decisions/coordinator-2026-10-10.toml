[decision.D-002]
decided = "WI-847 stays one row, built in its lane in this order: the narrow round's brief rendered through prompts.py first, then reviewer retention together with the merge gate's freshness binding. Recorded in its spec's Context before the claim, answering the scope critique's S1."
alternative = "Split the narrow-brief render into a preparatory row landing first, or split retention from the gate binding."
reversal_cost = "Low: a split is still possible before the claim's build."
why_not_escalated = "The render stands alone but is small; retention without the binding would let a resumed review clear a merge, so those two cannot land apart."
review = ""

[decision.D-003]
decided = "WI-847's `## Trust` ruling: an absent, unreadable or malformed retained-reviewer record (or one naming another family or route) is no record, so the call mints fresh, and a malformed dial reads as off. The merge gate accepts only a verdict whose session was minted fresh for that review and whose range runs from the claim base to the tip; any other verdict holds the merge, with no fallback to an older verdict. Written into the spec before the claim, answering the scope critique's S2."
alternative = "Let the gate accept a resumed session's verdict when its range is full-lane."
reversal_cost = "Medium: the gate's acceptance rule is the row's central obligation; changing it after the build re-opens the gate code and its tests."
why_not_escalated = "coordinator-cycle §1 has the coordinator write the Trust section and route its ruling to the owner for confirmation or overrule; the ruling follows the owner's 2026-10-07 direction that the last gate is a fresh, full-lane review."
review = ""


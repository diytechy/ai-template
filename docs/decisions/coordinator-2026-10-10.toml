alternative = "Discard them and resume Terra for a fresh intent turn over the rebased lane."
reversal_cost = "Low: the sitting judged the text as committed; a redo would re-sit it."
why_not_escalated = "The handoff asked the session to read the edits and decide; reading them found a finished authoring turn."

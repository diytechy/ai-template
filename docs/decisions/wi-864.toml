reversal_cost = "Two one-line edits and one bullet."
why_not_escalated = "The verdict asks the coordinator for exactly these edits and words the bullet itself."
review = "Owner, in the coordinator session of 2026-10-08: \"Those decisions are fine.\" Recorded by the coordinator at the owner's word."
owner = "confirmed"

[decision.D-003]
decided = "The mechanical close wrote only the last of the verdict's three edges on WI-848 (WI-860): `handback._enact_plan` computes each planned write from the on-disk text before any write, so two edges on one waiter keep only the last. The coordinator added the two lost edges (WI-852, WI-853) by hand in the same commit as D-002, and files the defect as its own row."
alternative = "Re-run the close after fixing the defect in this lane."
reversal_cost = "None to the queue; the defect row fixes the close."
why_not_escalated = "The verdict's typed block names all three edges; writing them is enacting it, not judging it. The fix is kit code and belongs in its own row."

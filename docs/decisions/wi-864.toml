why_not_escalated = "The owner asked for this cluster; a census-derived row would have asked a wider question than the owner's and missed the threat-model row, which touches no code."
review = "Owner, in the coordinator session of 2026-10-08: \"Those decisions are fine.\" Recorded by the coordinator at the owner's word."
owner = "confirmed"

[decision.D-002]

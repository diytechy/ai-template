[decision.D-001]
decided = "No Terra turn and no sitting are owed: the row adds no spine row, amends no row text and leaves its Done-when unchanged; its one registry edit is TC-165's traced `evidence` cell, which the builder keeps with the tests (SKILL section 3: traced-only updates owe no sitting). The tests are a characterization of already-correct behaviour (the shipped surface scans clean today), so they carry no expected-failure mark, with the adequacy witness written in the test module."
alternative = "A Terra intent turn to restate LLR-171 or TC-165."
reversal_cost = "Low: a later sitting can amend either row if the checkpoint finds text owed."
why_not_escalated = "The skill's rule for traced-only changes."
review = ""

[decision.D-002]
decided = "REVIEW-B is a Claude Opus (high) stand-in for the Gemini slot (ruling 7; coordinator-2026-10-16 D-008), in every round of this lane."
alternative = "A Gemini reviewer, which has no verified launch yet."

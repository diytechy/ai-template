[decision.D-020]
decided = "Counted round 3, the cap (reviews 009 REVIEW-A, Codex gpt-6.1-sol medium; 010 REVIEW-B, the Claude Opus high stand-in, ruling 7's substitution), in convergence stance. 009's MAJOR (a qualified OpenCode launch's declared base drops KIT_LOOP_SESSION, so a loop child loses the marker the provenance rows require; tagged convergence-class) is uncontested and goes to the cap's one dispute sitting (findings file 011, id A009-F1), which alone rules it; a convergence-class finding is never deferred. 010's MAJOR (LLR-270's LAUNCH and lease-only clauses and rationale false against the code) names no code defect and is re-graded to the checkpoint sitting, as D-014 and D-017 did. The MINORs are row text for the spine change list (LLR-268, LLR-305, TC-324, TC-262 or TC-362's verifies for LLR-266, IF-248, TC-267, TC-323), the owner's SR-227 wording successor, and agents-enabled's and RESYNC_PACK's weight-0 sentence (a win-stay or phase pin still reaches the entry), which rides the fix round the sitting orders, if any."

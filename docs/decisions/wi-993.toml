[decision.D-002]
decided = "Round 1 triage. REVIEW-B's MAJOR is confirmed on the real path, so the round costs a fix: the mint files one owner row and item per landing per registry, its command names every row it carries, passes a verdict only when one verdict covers them all, and option (a) states that the act copies the whole registry. REVIEW-B's three MINORs are confirmed and taken in the same round, each small and inside the spec's surface: the non-TOML remedy is the conversion (the old carrier removed in that commit), the skill's stop sentence points at PROCESS.md section 5, and a row off the text its verdict bound stays on the amendment row. REVIEW-A's MINOR is row text and goes to the spine change list, with LLR-153, TC-147 and IF-091. The claim copy's Trust table states the new arms; its Done-when is unchanged, so the pass record stands. Plan decisions 5 and 8 and its Downstream paragraph are superseded by this round and the plan is unedited, since an edited plan holds the lane. Each fix's regression test failed before the fix; the builder's notes hold the map."
alternative = "File the MINORs as follow-ups and fix the MAJOR alone."
reversal_cost = "Low: lane code under review."
why_not_escalated = "A confirmed reviewer finding inside the spec's surface; rulings 1 and 4 place the triage here."
review = ""


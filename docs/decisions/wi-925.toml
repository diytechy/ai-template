[decision.D-010]
decided = "The rebase onto trunk's 8d64910f2 (the 2026-10-19b close-out, docs only, sharing no file with the lane) before the gate, so the gate reviews the tip that lands; the pre-rebase tip cb54f657b is archived at landing beside 81d271c6d and a9a9ad61b. It replayed 19 commits cleanly; git patch-id --stable over the lane's diff reads 3ab8cafae3df at the old base and tip and at the new, so the rebase changed no lane code or row and no post-rebase round is owed (wi-927 D-013); the eight rows sitting 004 judged read identical at its verdict commit 28a40afc2 and at the rebased tip; the RESYNC entry is re-anchored at 8d64910f2 (check_resync OK). The convergence map for the gate, which the reviewers do not read (revisions 8 and 33), from round 1's accepted findings: 002 F1 -> tests/test_done_when_blessing.py::test_an_undeclared_trunk_refuses_each_caller_naming_the_key, whose hand-close case failed on the pre-fix tree 3693196e5 (the builder's red run: 4 shapes failing at the hand-close assertion, AssertionError None) and passes at the tip (the coordinator's re-run, 10 passed over the fix's targeted tests); 002 F2 and 003 F5 -> LLR-307's reconciled detail (the redirect caused by another specification's move from active into a terminal home; the three supported routes named in the bound), the corrected text at the cited site, blessed MEANING at sitting 004 (004-ADJUDICATE-6c9ac8f.md); 003 F1 -> TC-325's method and expected naming test_a_trunk_commit_deleting_a_claim_copy_is_held_and_no_blessing_releases_it, the corrected text, blessed at sitting 004; 003 F2 -> tests/test_check_readability.py::test_an_undeclared_trunk_on_a_claimed_lane_skips_naming_the_declaration (both cases red on the pre-fix tree, the old message blaming an unreadable claim history) and the pin tests/test_step_path_trigger.py::test_an_undeclared_trunk_reads_as_unknown_and_runs_every_opted_in_step, with LLR-339's reader sentence stating what each non-refusing reader does (D-008 S1); 003 F3 -> sitting 004's verdict line judging LLR-337's detail by name, [MEANING+BLESS]; 003 F4 -> the pins tests/test_plan_gate.py::test_a_claimed_single_lane_with_the_trunk_undeclared_gets_one_hold_naming_it and ::test_a_branch_holding_no_claim_folder_is_judged_at_head_with_the_trunk_undeclared (a missing pin, not a defect: the evidence is the tests and TC-367's cells citing them); 003 F6 -> LLR-339's detail, now opening its inference sentence with the trunk as subject, the corrected text; 003 F7 -> the corrected comments in project-trajectory/scripts/agent_policy.py and tests/test_process_config.py at the cited sites. Every accepted finding maps, so the gate renders: the two full-lane reviewers, uncounted, from 8d64910f2 to the tip, in convergence stance."

decided = "An id floor across the two unlanded lanes that both tagged LLR-339 in code (wi-925 and wi-926; recipes section 4). wi-925, ahead in the queue, keeps LLR-339 for the declared trunk's new LLR and takes TC-369 for its TC. wi-926 renumbers before it mints: SR-240 stays its own, and its LLRs start at LLR-340, its TCs at TC-370, its IF rows at IF-297 and its component at CMP-008. The floor is recorded in both lanes' decisions."
alternative = "Renumber wi-925 instead."
reversal_cost = "Low before either lane mints."
why_not_escalated = "The recipe's id-floor step."
review = ""

[decision.D-004]
decided = "Build round 1, stage 2 (P4 to P8), a fresh Claude Opus builder at medium: the one shared relink reading, spec_move.exact_relink, called by integrate._relinked_exactly and plan_gate.build_paths (plan_gate._relinked deleted; the existing relink tests pass unedited); kitlib/done_when's exemption, a lone claim-copy modification whose bytes are exactly the relink of a spec move the same staged delta carries, through an injected oracle (staged_hold's fifth argument); staged_closes deleted; check_trajectory's hold-by-rename finding names restoring the ref at the claim commit, closing partial through the handback and landing the close through the merge slot; the shipped hook's done-when-blessed comment states the promise and one residue list (seven fail-open routes, two fail-closed shapes, the relink sentence). The new tests failed on 8a2671aab (9 failed) and the affected modules pass (302). Departures: the pure test is seven parametrized cases; a third private helper, _only_relinked; an ambiguous closed copy builds no remap, so the change is still judged. The coordinator re-stamped the ratchet (check_trajectory.py 1652 to 1654; integrate.py down 1554 to 1546). Two flags go to P9 and the checkpoint, not the build: a claim (queued to active) relinks other claim copies too but commits through plumbing, so the hook never sees it and its later reach is the C2 probes' shape (state it in the residue list or LLR-307); and a row whose own Done-when holds a relative link reads as changed at its own close (already a status.md follow-up). The interface reference regenerates at the landing (IF-286's contract text changed)."
alternative = "Re-stamp the ratchet at the landing, leaving a red bar standing."
reversal_cost = "Low: unjudged until the checkpoint."
why_not_escalated = "The plan's stage 2; the recipe's in-stage re-stamp."
review = ""

[decision.D-005]
decided = "The lane was rebased onto trunk's 342bd95ef (WI-946's landing and its close-out) before stage 3, as the 2026-10-19a handoff asks; its pre-rebase tip 81d271c6d is archived at landing beside a9a9ad61b. Two files conflicted. project-trajectory/RESYNC_PACK.md keeps both sides' entries, trunk's first, and the lane's own entry is re-anchored at 342bd95ef (check_resync passes). tests/test_module_size_ratchet.py took trunk's lines in both replayed build commits, which also dropped the lane's three non-conflicting stamps, so this commit re-stamps all six against trunk's numbers with the lane's own reasons unchanged: bootstrap.py 1493 to 1517, check_trajectory.py 1652 to 1654 and agent_loop.py down 2427 to 2422 as before; agent_common.py 1077 to 1097, check.py 1298 to 1301 and integrate.py down 1555 to 1547 (+3 then -8 from trunk's 1552), each net delta the lane's. The low-level registry merged clean, and a per-cell three-way read of it and docs/process.toml (base 2268a9a8c, lane 81d271c6d, trunk 342bd95ef) found every cell on the side that changed it and no cell both sides changed. Trunk's new launcher reads trunk through agent_common.trunk_name(repo), the signature this lane keeps. No review round is owed for the rebase alone: the lane has run no counted round yet, and counted round 1 reviews the rebased tip after stage 3."
alternative = "Hand-merge each ratchet conflict at replay time, keeping each commit's own stamps; the tip's file is the same either way, and only the tip is reviewed and landed."
reversal_cost = "Low: the old tip stays reachable, and the re-stamp is one test file."
why_not_escalated = "The recipes' rebasing table (trunk's note plus the lane's count; the RESYNC re-anchor)."
review = ""

[decision.D-006]
decided = "Stage 3 (P9 and P10), in a headless leg (Loop-Session 20261019T185432Z-8e4f05): this commit is the lane's first under the loop marker and opens its trailer window; the attended commits before it stay exempt (coordinator-2026-10-18 D-006). P10, a fresh Claude Opus builder at medium: it confirmed on the real path that a claim's queued-to-active move relinks other rows' claim copies and commits through plumbing, and that the staged reader's exemption reads only a close's move, so it would not pass a claim's relink; the hook comment states the claim's own relink as a source of fail-closed shape 2 (the counts stay seven and two), and the RESYNC entry mirrors it. It also corrected three entry sentences the code made untrue: a detached HEAD keeps the template's trunk as a non-repository does; the adjudicator's brief joins the refusing routes; and two readers degrade instead of refusing (the commit floor's path-triggered step selection runs every opted-in step, the readability report skips). The file set already matched the lane diff. P9, GPT Terra (gpt-5.6-terra, medium, retained session 01a15587-f3b2-7813-be7e-69c45d86ce1e) authored the intent set from SR-156 down: new LLR-339 and TC-369 (Drafted; the id floor of D-003), LLR-307, LLR-208 and LLR-337 amended, TC-325 extended, IF-179, IF-189 and IF-286 aligned. The coordinator's mechanical check returned five corrections, which Terra applied in a resumed turn: LLR-307's approved spec_at and lane_hold clause restored verbatim (only the staged_closes clause goes), the declared trunk defined in LLR-307 as the plan's phrase, its residue bound covering the two fail-closed shapes too, IF-179 keeping the git seam the rollup still calls, and LLR-339's every-reader sentence made true against the three non-refusing readers. D-002 item 6 is settled as one home: the coordinator retagged bootstrap.declare_scaffold_trunk Implements SR-156, LLR-339 (one docstring line), LLR-339 lists bootstrap.py beside agent_common.py and carries the symbol, and LLR-156 stays byte-identical to its approved copy, so the Done-when keeps its one new LLR and no second row states the scaffold's declaration. A cell check reads every approved changed cell keeping its approved text except the sentences the plan replaces (LLR-307, LLR-208), no CR byte, and SR-156, SR-170, SR-137, SR-019, LLR-309, TC-326, LLR-151 and LLR-156 unchanged. The bar on this tree: 2813 passed, smoke tier 58.3 s against 60 s; the parent 5f896e3b3 in the same window read 64.8 s (2813 passed), so the tier is unchanged and the box is loaded. For the checkpoint's spine change list: LLR-339's scaffold sentence says where the scaffold writes the declaration but not its value (the branch the scaffold is on), and tests/test_trajectory_holdban.py's new pin is cited by no TC (the plan routes it to no row)."
alternative = "Keep the scaffold writer under LLR-156 with Terra's added sentence, which states the scaffold's declaration in two rows and amends an approved row the Done-when does not name."
reversal_cost = "Low: one docstring tag and three registry cells, all unjudged until the checkpoint."
why_not_escalated = "The plan's P9 and P10, the recipes' cell-check and restore steps, and D-002 item 6, which left the home to P9."
review = ""

[decision.D-007]
decided = "Counted round 1 over 84fcc27a9 (two full-lane reviewers in parallel, rendered by review_brief.py review --scope full with no stance): REVIEW-A, Codex Sol at medium, 002-REVIEW-A-84fcc27.md, CHANGES-REQUESTED with 2 MINOR; REVIEW-B, Claude Opus at high, 003-REVIEW-B-84fcc27.md, CHANGES-REQUESTED with 1 MAJOR and 6 MINOR. REVIEW-B is the ruling-7 stand-in for the Gemini slot (coordinator-2026-10-16 D-008), a substitution recorded here. Triage under PROCESS.md section 6: nothing is dismissed. 003 F1 (MAJOR: TC-325's method and expected do not name the deletion-only pin the spec's deliverable 6 lists) names no code defect: the pin exists and its evidence cell cites it, and the remedy is row text, the checkpoint reconcile's, judged at the sitting, so it is re-graded as the checkpoint's item and costs no fix round (wi-931 D-006); the convergence map points it at the reconciled cells and the sitting's verdict. The wording findings go to the lane's spine change list for the reconcile: 002 F2 and 003 F5 (LLR-307's exemption reads as the claim copy's own move; name the other specifications' moves into a terminal home, and the three supported routes in the bound), 003 F6 (LLR-339's subject is the trunk, never inferred, and the shapes are refused), and 003 F3 (LLR-337's added sentence is an amendment the sitting judges by name; the owner's choice in D-002 item 1 put it there). The code findings are MINOR and cost no counted round; they are fixed before the checkpoint in one build round, coverage plans first, so the reconcile and the sitting read settled code: 002 F1 (a trunk hand close passes the staged step with the trunk undeclared, where deliverable 2 says the staged reader asks for the trunk whenever a claim-copy change is listed), 003 F2 (with the trunk undeclared on a claimed lane the readability report skips a measure the profile declares gating and blames an unreadable history: the remedy the reviewer names, refusing naming the declaration where a gating measure is declared and naming it in the skip otherwise, with pins for it and for the step selection's run-every-step degrade), 003 F4 (no test pins either half of the plan gate's undeclared-trunk arm) and 003 F7 (the schema registration's comment, and its test's, give an untrue reason). Round 1 has no BLOCKER or MAJOR code finding, so the checkpoint follows that build."
alternative = "Send the four code MINORs to a successor row and go straight to the checkpoint, leaving a deliverable-2 deviation and a skipped gating measure in the landing."
reversal_cost = "Low: the fixes are small and the gate reviews them with the rows."
why_not_escalated = "The skill's triage, MINOR and checkpoint steps; the re-grade follows wi-931 D-006."
review = ""

[decision.D-008]
decided = "The MINOR fix build after counted round 1, on one Claude Opus builder (medium) in two stages. Stage 1 wrote one coverage plan per round file (002 and 003), each passing plan_coverage.py --findings at exit 0 when the coordinator re-ran it, changing nothing. The builder's three stop points, ruled before stage 2: (S1) refusing where a gating readability measure is declared would make LLR-256's approved exit contract (nonzero only for a worsening in a gating measure) untrue, an approved row outside the spec's spine list, so D-007's disposition of 003 F2 is narrowed to the remedy's other half that the reviewer offered: the report skips each measure naming the declaration and exits as for any unreadable change, LLR-256 and IF-187 unchanged, and LLR-339 states what each non-refusing reader does at the reconcile; (S2) the builder edits no approved TC, and the new plan-gate pins go to TC-367 at the reconcile; (S3) docs/plans/WI-925/plan.md lines 306-307 repeat 003 F7's untrue reason, but the pass record binds the plan, so it stays as filed. Stage 2: 002 F1, the staged reader asks for the trunk once whenever a claim-copy change is listed, a close included, so with the trunk undeclared a hand close (on trunk, in a linked worktree on it, or on a detached HEAD) and a lane's own claim-copy change are refused naming the declaration, and a delta listing no claim-copy change never asks (deliverable 2's sentence; IF-286's contract text gains the sentence); its case added to test_an_undeclared_trunk_refuses_each_caller_naming_the_key was red before (4 shapes) and is green after. 003 F2, the readability report names the declaration in its skip (test_an_undeclared_trunk_on_a_claimed_lane_skips_naming_the_declaration, red before), and test_an_undeclared_trunk_reads_as_unknown_and_runs_every_opted_in_step pins the step selection (a pin, green before and after). 003 F4, two plan-gate pins (green before and after). 003 F7, the two comments give the true reason. The coordinator re-ran the targeted tests (10 passed) and the bar: 2814 passed, smoke tier 54.3 s; the parent 3693196e5 in a detached worktree right after read 79.3 s (2813 passed): box load, the tier grew by one in-process test."
alternative = "Build D-007's refusal for a gating measure and amend LLR-256 at the sitting, an approved row the Done-when does not name."
reversal_cost = "Low: unjudged until the checkpoint and the gate."
why_not_escalated = "The skill's coverage-plan and staged fix steps; S1 keeps an approved contract the spec does not reach."
review = ""

[decision.D-009]
decided = "The checkpoint reconcile, by Terra resumed (retained session 01a15587-f3b2-7813-be7e-69c45d86ce1e), against the settled code at 3c0b94915: the accumulated spine change list (the coordinator's items, the round-1 wording findings 002 F2, 003 F1, F5 and F6, and the fix build's items) plus the arms map. LLR-307's exemption now names other specifications' moves from active into a terminal home, its bound names the three supported routes, and it states that the trunk is read once whenever a claim-copy change is listed; LLR-339's subject is the trunk, its non-refusing readers are stated as the code does them, and its scaffold sentence names the value written; TC-325 names the deletion-only pin (003 F1), the undeclared-trunk and no-claim-copy cases and an inspection of the hook comment; TC-367 takes the two plan-gate pins against LLR-337's added sentence; TC-369 takes the readability and step-selection pins; TC-206 takes the rollup's declared-trunk and undeclared cases against LLR-208's amended clause. The closure check (a second Terra turn) left no arm UNVERIFIED in the arms map; every TC citing an LLR cites its SR; IF-179, IF-189 and IF-286 each have a citing TC; LLR-156 and LLR-256 are byte-identical to their approved copies; and every approved sentence of LLR-307, LLR-208, LLR-337, TC-206, TC-325 and TC-367 is in the new cell, except the sentences the plan replaced (LLR-307's staged_closes clause, close-listing sentence and residue sentences, and its trunk phrase; LLR-208's one phrase). The hold-by-rename pin stays untraced: no row states that finding's text, and the plan routes it to no row. Bar on this tree: 2814 passed, 0 failed, smoke tier 62.9 s, over the 60 s budget; the parent 3c0b94915's tier alone in a detached worktree in the same window read 83.2 s; the tier did not grow (registry text only), so the breach is load and holds nothing (coordinator-2026-10-17 D-011)."
alternative = "Skip the reconcile turn, which the rule allows only when no round proposed row text and no code moved since intent; both happened."
reversal_cost = "Low: the sitting judges the set next."
why_not_escalated = "The skill's checkpoint steps 1 and 2."

# docs/decisions/wi-925.toml — delegated decisions made in the WI-925 lane (the
# trunk is the branch the repository declares by name, and a spec move's own
# link redirect inside a claim copy's Done-when is not a Done-when change) by
# the attended coordinator.
# Format: project-trajectory/decisions.template.toml.

high_risk = ["D-002"]

[decision.D-001]
decided = "The row is claimed planmode single, so the lane planned first: a fresh Claude Opus planner wrote the plan; critique 1 (Codex Sol, medium) asked for changes with one MAJOR; the one revision answered it; critique 2, in convergence stance at the plan cap, asked for changes with one MAJOR, which the cap's dispute sitting (001-ADJUDICATE-20a6044.md) ruled DISMISS not-worth-cost, and the pass record binds the revised plan. The lane was rebased onto trunk's 2268a9a8c (pre-rebase tip a9a9ad61b, archived at landing). The plan orders its commits, so build round 1 runs in stages on a Claude Opus builder (medium, the kit-builder agent): stage 1 is P0 to P3 with the RESYNC entry begun; stage 2 is P4 to P8; stage 3 is P9 (Terra's spine turn) and P10. P0's reproduction fixture reproduced the relink hold, so P4 and P5 go ahead. Review rounds run two full-lane reviewers in parallel, Codex Sol at medium (REVIEW-A) and Claude Opus at high (REVIEW-B, the ruling-7 stand-in; coordinator-2026-10-16 D-008). The row changes the machinery the cycle runs on (every trunk reader), so it lands alone."
alternative = "Build P0 to P10 in one round, against the plan's ordered stages."
reversal_cost = "None: nothing is committed past the pass record."
why_not_escalated = "The skill's plan, build and staged-commit steps."
review = ""

[decision.D-002]
decided = "Stage 1's departures from the plan, ruled before its commit. (1) plan_gate._claim_base keeps asking default_base first, not the plan's reorder: the reorder answered HEAD on any branch whose HEAD holds no claim folder, which opens the gate on a lane that closed its row (the claim copy is gone at HEAD and read at the base), even with the key declared; test_a_refresh_merge_of_a_partial_closed_lane_passes caught it, so the plan's claim that the answer was unchanged where the key is declared was wrong. With the key undeclared, a branch whose HEAD holds no claim folder is judged at HEAD and any other raises TrunkUndeclared, which staged_lines turns into one hold line naming the key. That arm reads no other trunk; on the trunk and on an unclaimed branch its gate result equals the declared reading's, since neither ever holds a claim folder; it differs only on a lane past its close with the key later removed by hand, and the merge slot still judges every lane commit at landing against the declared trunk. The builder flagged the arm as close to a fallback, so the coordinator put it to the owner, who chose to keep it in session on 2026-10-18; LLR-337's detail states it at the checkpoint. (2) This repository declares trunk = \"refactor_again\", the branch every lane is cut from and lands on; the owner confirmed the name in session on 2026-10-18. (3) scripts/check_resync.py, this repository's own reader of default_base that the plan's grep did not list, refuses with the key's message (exit 1) instead of a traceback, as the spec's every-reader rule asks. (4) The fixture departures follow from deleting the current-branch fallback: fixtures that read the train branch as trunk now declare main and move it up to their config commit, the starting point of the lane, so the reviewer prompt's trunk slot renders main where it rendered the train branch; test_default_base_reads_the_claim_record_after_a_single_checkout_resume becomes the plan's renamed test asserting the trunk boundary. (5) The module-size ratchet is re-stamped with reasons in the stage's commit (agent_common.py 1053 to 1073, bootstrap.py 1493 to 1517, check.py 1307 to 1310, integrate.py 1551 to 1554, and agent_loop.py down 2427 to 2422); all five were past the size line before this lane, and check_complexity's enforce mode reads them unchanged. (6) bootstrap.declare_scaffold_trunk is tagged LLR-156, the bootstrap LLR that writes docs/process.toml in place, since the new LLR's module is agent_common.py; whether LLR-156's code_symbol takes it as a traced-only cell, keeping the Done-when's one new LLR, is Terra's at P9 and the sitting's."
alternative = "(1) The plan's reorder, or refusing whenever the key is undeclared, which contradicts the Done-when line that a commit touching no claim copy is not refused over the key. (2) Declare main."
reversal_cost = "Low: the arm is one branch in one function and the declaration one line, both unjudged until the checkpoint."
why_not_escalated = "Items 1 and 2 went to the owner in session and were answered as recommended; the rest are the plan's own steps or follow from them."
review = ""


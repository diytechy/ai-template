alternative = "Keep reading a malformed policy file as privacy ON (no adopter-visible change), or hold the filing for the owner."
reversal_cost = "Low before the claim: an overrule rewrites one Trust line and its Done-when case."
why_not_escalated = "It follows the fail-closed rule every Trust ruling applies; the owner confirms or overrules."

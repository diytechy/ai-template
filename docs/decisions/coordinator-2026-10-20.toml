[decision.D-001]
decided = "Queue row P1 (review-churn item 13's review gate) is filed on trunk as four rows, split at birth on independent deliverables (ruling 3): WI-955, the text (TC-first in lanes, the reviewer's test-adequacy and duplication questions); WI-956, the one tree-bound bar attestation (grammar, verifier and producer, the landing refresh moved onto it); WI-957, the coordinator's review-render refusal; WI-958, the loop's review-draw refusal with the red-round cap as a partial close. They land in that order. A planner sub-agent drafted them from plan item 13 and the code; the scope critique judges each before its claim. Each specref names plan item 13's section, as WI-914 named its plan item."
alternative = "File P1 as one row, as the queue text names it."
reversal_cost = "Low: four queued rows, unclaimed; a merge is a spec edit before any claim."
why_not_escalated = "Ruling 3 and the coordinator-cycle skill's section 1 make the split the coordinator's call at filing; the scope critique's S1 judges it."

[decision.D-002]
decided = "WI-956 declares the review bar in one new required key in docs/stack.ini (beside the [run] commit bar it names, until item 10's one-file migration moves both into docs/process.toml), shipped in the template with the kit's commit bar. An adopter running the loop must declare it: the RESYNC entry adds it with the shipped value, and a review dispatch refuses until it is declared. This forces a downstream migration (CLAUDE.md: flag it). The alternative, reading [run] smoke or check.py when the key is absent, is a fallback path the owner's 2026-10-03 rule forbids."
alternative = "Derive the review bar from an existing declaration, with no new key."
reversal_cost = "Medium once WI-956 lands (a RESYNC entry and adopters' declarations); low before its claim (a spec edit)."
why_not_escalated = "A design call inside a ruled item (item 13, revision 35) with no owner-only act; flagged high-risk so the owner sees the migration first under Decisions to review."
review = ""


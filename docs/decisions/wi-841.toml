[decision.D-026]
decided = "Round 15 (Sol final7 MAJOR 2): adjudicate_brief.record_outcome now RETURNS its decision, `(outcome, why)`, and the loop's adjudication_bookkeeping sets its completion obligation (`adjudication_owed`) from that same decision rather than a second verdict check: a failed call (call_ok false) keeps its obligation, is recorded failed, and its verdict is never read, so the worker cannot finish DONE and the re-sit is not lost. A missing root or verdict path is owed without recording. Sol final7 MAJOR 1 (row-tied coverage) was NOT built: by the coordinators' standing rule a further crafted-input finding goes to the independent adjudicator as a named dispute, whose ruling sets the fix or files it as a follow-up."
alternative = "Keep two decisions (record from call success and validation; clear the obligation from validation alone), which let a failed call finish DONE."
reversal_cost = "One return value and the bookkeeping that consumes it."
why_not_escalated = "The coordinator directed one decision consumed in both places; the row-tied coverage change was explicitly withdrawn from this round."
review = ""

[decision.D-027]
decided = "Round 16 (owner ruling: an act's authority comes from the judgement of ITS rows; Sol final7 MAJOR 1). SUPERSEDES D-025's kind-only coverage. At merge, every ROW an added adjudication act flips must be ruled APPROVE in a first-approval part, and every row it re-attests ruled MEANING or CLARITY in an amendment part, of an ACCEPTED verdict among the bindings the branch carries (single-kind or combined; kitlib.sitting.uncovered_refusal over judged_rows), whether or not the act names a verdict; an accepted verdict over other rows authorizes nothing, and each unjudged row is named with its kind. A NAMED `--verdict` must be accepted AND judge each row the act re-attests (kitlib.sitting.unaccepted_refusal / _named_line). The held-rung CLARITY-only rule stays acceptance_record's, now reading the accepted part's parsed rows. The per-row rulings come from the ONE row reader, kitlib.verdict.row_rulings (generalised from verdict_rulings to each sitting kind's tags and fail-toward rule: MEANING over CLARITY, RETURN over APPROVE), exposed by kitlib.sitting.accepted as each part's fourth element; no second row parser. D-022's legacy rule and D-025's upgrade effect stand (an adjudication lane with no accepted, row-judging binding is refused at merge)."
alternative = "Keep kind coverage (an accepted sitting over other rows authorizes this act - Sol's bypass), or require every act to name a verdict (the act CLI forbids `--verdict` without `--reattests`)."
reversal_cost = "The row-coverage refusal, the named-verdict row check and the generalised row reader; the fixtures' judged rows."
why_not_escalated = "The owner ruled the scope; the coordinator directed row coverage through the existing parse with no second row parser, and the D-025 supersession recorded here."
review = ""

[decision.D-028]
decided = "Round 18 (Sol final9 MAJOR): the Done-when hold moves to the ONE point a session is actually selected for dispatch. run_iteration now calls agent_loop.routed_session, which runs route_session and then, for a routed session that builds (neither a review, a critique nor an adjudication brief - the worker assignment, a build or a rework), asks build_hold and exits with its banner before anything launches. worker_endstate holds nothing of its own any more (its building arm is restored to its pre-WI-841 shape), so no early-return arm before routing (the dirty-tree deferral after a completed WI trailer, or a resumed lane's first iteration over a Blocked-WI trailer) can bypass the hold. route_session (complexity 37) and run_iteration (15) are not grown: the hold rides the routing call's existing int-return arm."
alternative = "Keep the hold in worker_endstate and add it to each early-return arm (two hold sites, and any future arm would need it too), or put it inside route_session (complexity 37, over budget, and its hold banner names adjudication rows)."
reversal_cost = "One wrapper function and its call; worker_endstate's three restored lines."
why_not_escalated = "The coordinator directed one hold at the point a BUILD or rework is selected, after routing decides, removing the hold from worker_endstate if redundant; the wrapper is the smallest change that keeps run_iteration within budget."
review = ""

[decision.D-029]
decided = "Round 19 (Sol final10 MAJOR): the one parser reads machine lines strictly one PHYSICAL line at a time (kitlib.sitting._keyword_lines: a line whose first token is `KEYWORD:`, split into tokens; no regex spans a newline). Every such line counts, complete or not - a bare keyword, a label carried onto the next line, a label outside the enum or a missing `field=value` token makes the verdict invalid (_machine_lines / _machine_line / _incomplete). A single-kind verdict carries exactly one complete line of its kind and none of another sitting keyword; a combined sitting carries exactly one SITTING line and one complete line per requested kind across the WHOLE file (a keyword line outside every section included) and none of an unrequested kind (_keyword_count_refusal), checked after each section's own line so section-located messages stay. named_kinds and own_section use the same per-line reader. The MINOR: coordinator_adjudicate's Contract IF-285 (and IF-284) paragraphs now state the full success condition, session_service.call_succeeded."
alternative = "Patch the regex so its whitespace class no longer spans a newline, and keep counting only matched lines (a bare keyword line would still go uncounted)."
reversal_cost = "Four small functions in kitlib.sitting replacing two regexes."
why_not_escalated = "The coordinator directed strict per-physical-line parsing in the one parser every reader uses, counting every keyword line complete or not."
review = ""

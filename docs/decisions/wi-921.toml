[decision.D-014]
decided = "Owner ruling in session (2026-10-15) on 004 F1, asked as a multiple choice with the coordinator's recommendation: a successor row, not a build in this lane and not a dispute sitting. The builder's stage 1 confirmed the finding in both shapes through the shipped step and a real git commit --amend (a trunk close amended to carry a Done-when edit, and an amend that drops a trunk edit's only ruling, both pass): a fail-open and a gap in deliverable 5's promise that a trunk commit is judged against its parent, so neither the coordinator nor a sitting could defer it. It found no reliable amend signal at pre-commit (the hook environment is byte-identical for plain and amend commits, Git 2.49 on Windows); the exact boundary is git's reference-transaction hook in its prepared state, about 250 to 350 lines with a new shipped hook, a git 2.28 floor, local verification on Windows only, and side effects (it runs under --no-verify, so close_partial's lane commit would be judged; a single fetched commit fast-forwarded onto trunk would be refused if unblessed). The class is wider than the amend: cherry-pick, revert and rebase run no pre-commit, a hand fast-forward makes no commit, and a linked worktree on the trunk branch while the primary checkout sits elsewhere reads as elsewhere (005 F4; both of its shapes fail open at commit). Ruled: fix round 3 states that residue in the spec's Trust section under this ruling (those commits are judged against HEAD or not at all, and the merge-time mint mints a goalposts row for an uncovered Done-when change after the fact); one successor row for a real-parent boundary at the reference-transaction hook, covering the whole class with its own scope critique and Trust ruling, is filed on trunk at this lane's landing (a work branch never mints a WI id). The Done-when text is unchanged, so the plan's pass record stays bound. D-013's coordinator position (an amend of a trunk close is improbable in normal use) is withdrawn: the primary checkout's reflog holds one amend among 1010 commits, WI-841's landing squash."
alternative = "Build the reference-transaction hook in fix round 3 (review round 3, the last allowed, would judge a new hook), or send the finding to a dispute sitting, which could only order that build or escalate."
reversal_cost = "Moderate: building the boundary later costs the successor's own lane; until it lands, the residue is caught after the fact by the merge-time mint rather than held at the commit."
why_not_escalated = "It was the owner's ruling: a fail-open finding is never deferred without the owner."
review = ""

[decision.D-015]
decided = "Fix round 3 (text only; no code changed) answers round 2 under D-013 and the owner's ruling D-014. The spec's Trust section states the residue the owner ruled (004 F1, with 005 F4 inside it); the shipped hook's done-when-blessed comment names no return route the kit lacks and states the residue in adopter terms (006 F1); the recipes' interim two-commit landing bullet is replaced with text true once this lane lands, in the kit source and both synced copies (006 F5); the RESYNC entry folds 'judged against HEAD' and the residue. The builder's stage-1 coverage plans (cov-r3-004 to 006), revised to the ruling, passed plan_coverage on the builder's and the coordinator's runs; plan_gate reads ok, and the done-when-blessed step does not hold the Trust-only spec edit (driven staged). Before round 3 each accepted round-2 finding is mapped to its evidence (the convergence round never sees earlier verdicts): 004 F1 to the Trust residue bullet and D-014 (an owner-ruled residue, no code); 006 F1 to the corrected comment in project-trajectory/hooks/pre-commit's done-when-blessed entry; 006 F5 to the corrected text of recipes section 3 (Squash). Round 1's accepted finding keeps fix round 2's regression (D-012). Carried to P4: 004 F2, 005 F1, 006 F4. To the reconcile: 004 F3, 005 F2, 005 F3, 006 F2, 006 F3, and this round's spine-change entry (LLR-307 and LLR-309, and SR-156's trunk arm, state the step's reach). Reported for a successor, not fixed: docstrings in spec_move.py, intake.py, integrate.py and dispatch.py, and an approved LLR's detail, still name a handback return route that no longer exists."
alternative = "Build the reference-transaction boundary in this round, which the owner's D-014 ruling declined."
reversal_cost = "Low: text only, reviewed by round 3."
why_not_escalated = "It carries out D-013's triage and the owner's D-014 ruling."

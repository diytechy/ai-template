[decision.D-012]
decided = "Round 1's triage (2026-10-15d session), and fix round 2. 001 F1 (MAJOR, Sol) and 003 F3 (MINOR, Opus) are one defect, accepted: under git's default core.quotePath a claim copy whose path has a non-ASCII byte lists quoted, names no spec, and passes the trunk arm unjudged (the builder confirmed it on the shipped step, and found the own-branch close passes the same way, since _copy_at listed quoted too). It needs no compromised or contrived host (a default git setting and agent-written repo content; minted slugs are ASCII, so a hand-named spec reaches it), and it fails open, so it is a convergence-class defect never deferred; the severity split changes nothing. Fix round 2 reads every path the step's reader classifies or looks up through the one lossless reader, kitlib.git.git_paths, with a regression red at a877ee506. The builder's search found the class outside the step's reader too, reported and not fixed: agent_common.name_status (claim_base, default_base) leaves a lane-side close of a quoted-path claim, in a single checkout only, comparing the lane's copy with itself; the landing's trunk arm (lossless after this fix) re-judges it and the merge slot's listing fails closed on it, so it is a lane-local residue like the detached-HEAD one; integrate._branch_tree_paths, _minted_id_refusal and _claim_delta and kitlib/sitting.branch_verdicts read paths the same way (the mint check's miss fails open, off the Done-when path). Those sites are noted for a successor row filed on trunk. 001 F2 (MAJOR, Sol), 002 F4 and 003 F2 (MINOR) are one finding, accepted and carried by the passed plan's P4 checkpoint (the combined sitting over SR-156, LLR-307, LLR-309, TC-019 and TC-325, and its act); not a code finding, so it costs no build round; the act commit is its independently checkable evidence. 002 F1 and 003 F1 (MINOR): SR-156's appended sentence's antecedent goes to the reconcile, and SR-156 sits explicitly as an amendment, carried by the Done-when's general trace clause, so no Done-when edit (which would unbind the pass record). 002 F2 (MINOR, fails closed): D-006's premise that the kit has no un-claim flow is wrong (handback.hand_back returns a claim to the queue, committing with the hook bypassed); D-006's hold stands, and the hook's comment now states the residue. 002 F3 (MINOR, fails closed): a single checkout's trunk_name falls back to the current branch, so an amendment on a branch not named for its claim is judged as trunk and held; the comment states it. Trial record, round 1: round-costing Sol 2 (F1 also raised by Opus at MINOR), Fable 0, Opus 0; MINORs Fable 4, Opus 3."
alternative = "Fix the class at every site in this lane (agent_common, integrate, sitting), or dispute F1's severity on reachability."
reversal_cost = "Low: the residue sites are noted for a successor; the reader change is one module."
why_not_escalated = "Each disposition follows the review shape and the threat model as ruled; the residue is re-judged at the landing, and the class's other sites are filed as their own row rather than widening this one."
review = ""

[decision.D-013]
decided = "Full-lane review round 2 (counted round 2 of at most 3, ordinary stance; the three-reviewer trial) ran at f69a9c95f over e474f51dd..f69a9c95f, framed as D-011: 004-REVIEW-A-f69a9c9 (Codex Sol, medium) CHANGES-REQUESTED, 2 MAJORs and 1 MINOR; 005-REVIEW-B-f69a9c9 (Claude Fable, medium) CHANGES-REQUESTED, 1 MAJOR and 3 MINORs; 006-REVIEW-B-f69a9c9 (Claude Opus, high) APPROVE, 5 MINORs. Triage (2026-10-15d session): 004 F1 (MAJOR; a git commit --amend is judged against HEAD rather than its real parent, so a close amended with a Done-when edit, or an amend that drops a prior trunk edit's only ruling, passes) is true by its reproduction and stays OPEN: it goes to the builder's coverage plan first (confirm, and a construction that judges an amend against its real parent, with its cost), then, if contested, to a dispute sitting before fix round 3. The coordinator's position for that sitting: an amend of a trunk close that rewords a Done-when item, or drops a ruling, is improbable in normal use; git tells no pre-commit hook that it is amending; and the merge-time mint reads the merged trunk and mints the goalposts row for an uncovered change. 004 F2 and 005 F1 (MAJOR) and 006 F4 (MINOR) are round 1's checkpoint finding again, carried by P4 as D-012 records; not code. 004 F3, 005 F3 and 006 F3 (SR-156's appended sentence; also its 'trunk commit' against the row's 'integration branch'), 005 F2 (TC-325's method omits the new test) and 006 F2 (LLR-309's lane-only exemption against LLR-307's elsewhere reading) go to the reconcile. 005 F4 (a linked worktree on the trunk branch while the primary checkout sits on another branch, and a hand fast-forward, the latter WI-922's landing-shape class) is recorded as a coverage note: the landing re-judges a close. 006 F1 is confirmed: handback.py has no return-to-queue route (its docstring records that the old return contract was replaced; close_partial moves a row to the terminal partial/ folder, and handback.py:413 is that close's commit), so fix round 3 rewords the hook comment's residue, and D-012's sentence calling handback.hand_back a return route is withdrawn: D-006's premise, that the kit has no un-claim flow, stands (spec_move.py's docstring naming the return is stale, noted for the successor D-012 names). 006 F5: fix round 3 replaces the recipes' interim two-commit landing bullet, which this lane makes obsolete. Trial record, round 2: round-costing Sol 1 (F1, open); Fable and Opus 0 (Fable's MAJOR is the checkpoint item); MINORs Sol 1, Fable 3, Opus 5."
alternative = "Accept 004 F1 outright and build a real-parent reading in fix round 3, or dismiss it in triage as improbable."
reversal_cost = "Low: nothing is built for F1 before the builder's plan and, if contested, the sitting's ruling."
why_not_escalated = "A contested fail-open goes to the dispute sitting under the review shape, and the sitting's ruling is final; triage alone may dismiss only the compromised or contrived host class."

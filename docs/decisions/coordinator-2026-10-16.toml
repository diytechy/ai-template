[decision.D-001]
decided = "The 2026-10-15i drafts are filed on trunk (the handoff's queue row 2), each owing its scope critique: WI-925's and WI-926's specs are replaced by their finals, and five rows are new: WI-927 (the coordinator's Claude Code guard hooks, split from WI-926 under coordinator-2026-10-15 D-019), WI-928 (WI-834's grammar forms removed, D-016), WI-929 (the shared machine-line reader's repeated-field refusal removed, D-017), WI-930 (filing's rollup branch-name refusal removed, D-017) and WI-931 (WI-881's launch-window and late-spawn guards removed, D-018). The coordinator read each final's Trust, Done-when and Scope answers (WI-925's and WI-928's by their diff from the first drafts read in full on 2026-10-15i) and made three filing calls. (1) WI-927 gets its own spec of record, docs/specs/WI-927.md, in place of the draft's specref to WI-926's: the recipes point a split's specref at its own stable home, never at another row's spec, and one spec per row keeps check_trajectory's shared-spec warning off the pair (R-F would not have broken the link: it archives a spec of record only once no open row cites it); WI-926's spec of record now names WI-927's. (2) WI-927's one call left open in its final, the take with no terminal and the hooks absent, is replaced by D-021's ruling under its Calls ruled at filing; its Done-when already carried that option. (3) WI-931's empty specref, which R-E refuses for an open row, names the audit of contrived guards, the record D-011 ordered the removal from, as WI-928's does. check_trajectory --strict is clean, with three advisory warnings it is right to raise and that stand by design: WI-928 and WI-931 share the audit as their specref, WI-929 and WI-930 share coordinator-2026-10-15.toml (each pair is separate rows from one ruling, and neither file is under docs/specs, so no close archives it), and WI-927 and WI-928 both answer SR-229 (both amend LLR-300; each row's S6 names the rebase). Noted for WI-931's critique, not changed: its Done-when names review bar A, one cross-family REVIEW-A, where the program's trial runs three reviewers. WI-922's narrowed copy is not filed: the row is claimed, so it is critiqued fresh from a detached checkout carrying the copy."
alternative = "File WI-927 with WI-926's spec of record as its specref and its Q1 still open, or WI-931 with an empty specref, leaving the scope critiques to find them."
reversal_cost = "Low: every row is queued and unclaimed, so each can be amended or cancelled before its claim."
why_not_escalated = "Filing follows the owner's rulings D-016 to D-021; the three calls apply the recipes' specref rules and a ruling already made."

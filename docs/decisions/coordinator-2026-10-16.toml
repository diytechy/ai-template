[decision.D-005]
decided = "Owner ruling in session (2026-10-16, as recommended) on D-002's one question: S4 exempts a pure deletion from the in-lane plan step. A row that only removes code, tests and text, adding no code path, gets planmode none, even where S4's other criteria would make it single: the plan step checks a construction, and a deletion constructs none; its consumers are settled by the scope critique. Applied in this commit: docs/rubrics/scope-critique.md's S4 states the exemption, and WI-929 and WI-930, both pure deletions that round 1's S4 findings made single (D-002), are set to planmode none, their S4 answers citing this ruling. The rubric is this repository's own, not shipped, so the sentence lands directly with the ruling rather than through a lane; no confirming critique round is owed, since the change applies a ruling, not a critique's advice."
alternative = "Keep S4 as is (both rows pay the plan step), or exempt the two rows as a one-off with S4's text unchanged."
reversal_cost = "Low: one rubric sentence and two queued rows' planmode."
why_not_escalated = "It was the owner's ruling."
review = ""


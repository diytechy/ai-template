[decision.D-002]
decided = "Round 1 scope critiques (Codex Sol, medium, eight sessions in parallel from detached checkouts at 962921f22, each brief with the interim critique addendum). APPROVE, 0 findings: WI-925, WI-926, WI-931, and WI-922's narrowed claim copy, which ran from its own detached checkout carrying the copy uncommitted, since the row is claimed. WI-922's critique confirms S4 at none, so its trunk claim copy's planmode mark changes from single to none, as coordinator-2026-10-15 D-020 provided; the narrowed Done-when and deliverables are written into its lane when it is cut, where the done-when-blessed hold makes a sitting bless them. CHANGES-REQUESTED: WI-927 (two MAJORs), WI-928 (one MAJOR), WI-929 (one MAJOR) and WI-930 (one MAJOR and one MINOR). Each MAJOR was triaged for plausibility first, and all are real; none needs a contrived host. WI-927 S2: a consented install whose write fails left the take free to go on after consent alone, a fail-open on an ordinary filesystem failure. WI-927 S3 and WI-928 S3: each spec stated two contradictory rules (a matcher-only example change under the by-name check; the retained assignment reading against 'not read and not denied'). WI-929 S4 and WI-930 S4: the ruled S4 criteria by their letter (a promise over an input space; two interface seams), so both become single. All are adopted, each spec carrying a round-1 Critique dispositions section that quotes its new text; WI-930's MINOR (the coverage construction moved into a Done-when bullet) is adopted too. A planner sub-agent drafted the edits into scratch copies, and the coordinator read and corrected WI-927's on two points the planner flagged. First, no partial-write residue is stated, since the install already writes through the kit's atomic write. Second, a consumer the critique did not name is ruled: dev-setup maps any non-zero exit of the hooks reader to none in both templates, so an occupied or unreadable state read as nothing to do. The Trust section now rules that dev-setup takes the state only from a reader that exits 0, reports a failure on its [missing] line and never reads it as none, and the Done-when gains that case, failing before the change. WI-927 to WI-930 each owe a confirming round in convergence stance before any claim."
alternative = "Reject WI-929's and WI-930's S4 findings, keeping planmode none for two small deletions against the ruled criteria' letter; or leave dev-setup's reader-failure mapping for the confirming round to find."
reversal_cost = "Low: the rows are queued and unclaimed; each disposition is spec text a confirming round re-reads."
why_not_escalated = "Each adoption applies the critique's own remedy or the ruled S4 criteria. For the owner: S4 now makes two pure-deletion rows plan before building, which costs a plan step each; whether S4 should exempt a deletion is yours to say."

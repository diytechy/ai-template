[decision.D-014]
decided = "Dispute sitting 007's FIX, built under OI-115 (a)'s route (the Trust section's squashed-landing ruling): settlement reads, from the act ledger's `copied`, which acts wrote the row's registry. A fresh kit-builder first built the plain last-writer rule (the sitting's equivalent route: a later range-added entry that wrote the row's registry, or a legacy entry whose copy set is unknown, leaves the row unsettled). That turned the Done-when's WI-926 replay red (5245ac82c..08bbb71b6: seq 137 re-attests six rows, then legacy seqs 138 and 139 approve LLR-340, SR-240 and TC-370), and the builder stopped as briefed. The coordinator narrowed the rule rather than change the replay's expectation: a later act writing the registry without re-attesting the row cannot absorb an unattested change to the row's approved cells (the builder verified `baseline_snapshot.refresh_refusal` refuses that drift before any copy, through `_unattested_rows`), only to its routed traced cells; so a row is settled when it is re-attested in the range, its whole approved and routed traced cell set at `after` equals its copy there, and either (i) no range-added entry after the latest re-attesting one wrote, or may have written, its registry, or (ii) its routed traced cells at `after` equal those at `before`. Every other case mints. WI-926's six rows moved approved cells only, so (ii) settles them; WI-956's landing holds one entry, so (i) settles its rows; the sitting's two-acts regression mints over an unsquashed and a squashed range."
alternative = "Keep the plain last-writer rule and take the Done-when's WI-926 replay item to the owner; or (iii) read a legacy entry's copy set from its approved and re-attested ids, which IF-220 forbids (never inferred)."
reversal_cost = "Low: unlanded code, judged by the re-sitting and the gate."
why_not_escalated = "Inside the ruled route (OI-115 (a): settlement read from the ledger's record of what each act copied) and the sitting's FIX; it keeps every Done-when item, and the checkpoint sitting and the gate judge it."
review = ""


alternative = "Fix only 006 F1 and leave the MINORs to the checkpoint or successors."
reversal_cost = "Low: each change is text or one render-time choice, pinned by its own test."
why_not_escalated = "Fixes the accepted round-2 findings as D-011 dispositioned them; no scope, Done-when or Trust text changes."

[decision.D-007]
decided = "Terra's intent pass (codex session 01a14070-6bc6-7b80-bde5-97286c2ce5e3, gpt-5.6-terra medium) drafted the plan's P12 set: SR-234, SR-236, LLR-069, LLR-311, LLR-313, LLR-314, TC-069, TC-332, TC-333 and TC-334 amended by addition, SR-233's acceptance extended, TC-334's tier moved from Smoke to Full (TC-205's rule: tests/test_dispute.py is in SLOW_MODULES), and IF-290's requestors gaining scripts/plan_gate and scripts/review_brief; no new id. In SR-233's acceptance_criteria it also reworded two approved phrases ('repository content agents write' to '... write into the repository'; 'a compromised or contrived host' to 'the host itself to be compromised or contrived'), against its brief's amend-by-addition rule (recipes section 5). The coordinator restored the approved bytes verbatim by a guarded replace and kept Terra's appended sentence unchanged, authoring no text; a mechanical check then showed every other amended cell holding its approved text verbatim. The set stays unjudged until the checkpoint's combined sitting."

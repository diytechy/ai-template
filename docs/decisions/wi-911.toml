[decision.D-016]
decided = "Owner ruling in session (2026-10-15h), asked as a multiple choice with the coordinator's recommendation, after WI-925's confirming critique raised a fail-open MAJOR that needed a hand rewind of trunk (coordinator-2026-10-15 D-009): the stronger dismissal language is folded into this lane now, before its checkpoint sitting, as a text fix round. Two defects the coordinator found: the owner's 2026-10-13 ruling (contrived, improbable scenarios are dismissed too; severity tracks plausibility and impact, not ingenuity) never reached PROCESS.md section 6, whose threat model names only a compromised or contrived host; and the severity rule this lane ships ('a scenario reachable in normal use, or a fail-open, data-loss or security path') exempts any fail-open from reachability, as does the convergence rule 'only if fail-open, data loss or a Done-when gap'. The fix makes reachability gate every class and names a contrived scenario (a hand act the process forbids, or ordinary tools run in an order no supported route produces) as MINOR at most or dismissed. The lane's Done-when is unchanged: severity tied to reachability is already its deliverable, and this refines its text. The checkpoint's reconcile gains the LLR-311, SR-233 and TC-332 text for it, judged in the same combined sitting; the post-checkpoint gate reviews the fix. The coordinator applied the same wording to its interim review and critique addenda for this session's remaining rounds."

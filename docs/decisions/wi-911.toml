# docs/decisions/wi-911.toml — the lane record of WI-911 (review-churn batch
# 1, B1's process text), the first row to plan through WI-913's plan gate.
# Format: project-trajectory/decisions.template.toml.

high_risk = []

[decision.D-001]
decided = "The plan critique's brief, rendered by review_brief.py critique --plan, carries no severity-by-reachability clause, and the handoff chain says to append critique-addendum.md to every critique brief until this row lands. The addendum's anchors are written for a row's scope, which this row's five scope-critique rounds settled before the claim, so the coordinator appended it under a one-line preface: apply the anchors to the plan's construction, not to the row's scope, and apply the severity rule to every finding. Round 1's critic (Codex Sol, medium) judged the plan at 1726fce66 under it and raised one MAJOR."
alternative = "Append nothing (no severity rule for the pass), or append the addendum bare, which invites a re-judgement of the row's scope at the plan step."
reversal_cost = "None: the next critique can be rendered either way; the rendered and appended briefs are kept in the coordinator's scratch."
why_not_escalated = "A by-hand brief convention for the interim the owner's 2026-10-11 ruling already covers until this row's text lands."
review = ""

[decision.D-002]
decided = "Plan critique round 1: the critic, given only its brief, ran review_brief.py plan-file in the lane itself and then tried to commit; the sandbox refused the index lock, and sol_review.sh exited 3 for the changed lane. The coordinator set the critic's filed copy aside, filed the verdict itself with plan-file, and found the two byte-identical, so the record committed at 1211b5508 is the filer's output from the critic's verdict. Its one MAJOR is accepted: P11 runs the uncounted gates in convergence stance but never the last allowed counted round, which ruling 4 requires, so the plan takes its one revision (review_brief.py plan --revise, a fresh Opus planner)."
alternative = "Commit the critic's own filed copy, or re-run the critique, which would spend the cap's second round on a filing slip."
reversal_cost = "None: the filed text is identical either way."
why_not_escalated = "The filed bytes are the filer's own; the brief's text that let the critic file is a procedural defect, recorded for the recipes."
review = ""

[decision.D-003]
decided = "The second plan critique (round 2, convergence stance, on the revision at 8c361b7a7) is rendered by review_brief.py critique --plan with no reading exclusion, although the lane now holds the first critique (docs/plans/WI-911/critique-1.md) and this decisions record, which summarizes its finding, and the owner's anchoring ruling bars a convergence round from earlier verdicts. The coordinator appended a reading-scope block by hand, mirroring the full-lane convergence addendum (wi-913 D-009): docs/plans/WI-911/critique-*.md, docs/reviews/ and this record are outside the critic's reading scope, and the critic writes only its verdict file and never runs the filing step or commits (round 1's critic did both, D-002). The renderer's missing exclusion is a defect in WI-913's landed gate, noted for the queue in the handoff."
alternative = "Launch the rendered brief as is and trust the critic not to browse the lane, which round 1's critic did."
reversal_cost = "None for this round; the renderer fix is a later row's."
why_not_escalated = "The anchoring ruling already decides it; this applies it by hand where the renderer does not."
review = ""

[decision.D-004]
decided = "Before the first build, the coordinator rebased the lane from its claim base c2b20453b onto trunk's tip e474f51dd. The lane held only the plan gate's five records, so the replay was clean; the pass record binds by content digest (plan_gate.py: a rebase keeps it). P11 edits the coordinator-cycle recipes, which trunk's close-out commit changed after the lane's base, so building on the old base would have bought a recipes conflict at the landing rebase. The pre-rebase tip 89bb71838 (whose plan commit 8c361b7a7 the second critique names as reviewed) joins archive/lanes at the landing."
alternative = "Build on the claim base and resolve the recipes conflict at the landing rebase."
reversal_cost = "None: no build had run; the old tip stays reachable until the archive commit."
why_not_escalated = "A lane-mechanics call inside the cycle's own rule (cut lanes from trunk's tip), with no change to the plan, the spec or any binding."
review = ""

[decision.D-005]
decided = "Build round 1 takes the smoke tier to 2606 collected cases, past docs/stack.ini's max-tests = 2600 (tests/test_smoke_budget.py's membership ceiling), with 17 in-process cases the plan puts in the tier. The coordinator re-stamped the ceiling to 2715 in the commit that crosses it, with its reason and fig line, as the 2026-10-10 and 2026-10-11 stamps did: the parallel WI-921 lane adds 5 in-process cases, so trunk will collect about 2611 once both land, and 2715 keeps ~4% headroom over that. The plan placed a re-stamp at its landing step (P14) only if the tier passed the ceiling; it passed it at the build, and a red commit bar is not left standing. The seconds budget is not moved. No test moves out of the tier to make room (WI-921's plan R7)."
alternative = "Leave the bar red until P14, or move tests to the slow tier to fit the old ceiling."
reversal_cost = "Low: one stamp; a later landing re-stamps it with its own reason."
why_not_escalated = "The ceiling is a growth sensor the coordinator re-stamps with a recorded reason (stack.ini's own rule); the seconds budget, the binding one, is untouched."
review = ""

[decision.D-006]
decided = "The plan did not fix the form of P7's convergence-class tag on a finding, so the builder chose a trailing `convergence-class: yes` or `convergence-class: no` on the finding's line, which leaves the verdict grammar and the finding count unchanged (its filing pin in tests/test_review_brief.py). Recorded so the owner sees the shape reviewers will write."
alternative = "A separate field line, or a bracketed prefix, either of which the filer's count would have to learn."
reversal_cost = "Low: one template sentence and its pin."
why_not_escalated = "A format detail inside the plan's construction, visible to the reviewers who judge the lane."

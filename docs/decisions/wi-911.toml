[decision.D-008]
decided = "Full-lane review round 1 (counted round 1 of at most 3; the program's three-reviewer trial, owner revision 37) ran at bd52ffaf5 over e474f51dd..bd52ffaf5. Reviewers, in parallel, each from its own render with its own scratch: A, Codex Sol (gpt-6.1-sol, medium) through sol_review.sh, filed as REVIEW-A; B, Claude Fable (medium), and C, Claude Opus (high), each a sub-agent given only its brief's path, the lane path and the interpreter, both filed as REVIEW-B under their own numbers as stand-ins for the Gemini slot (ruling 7; Opus shares the builder's model and is watched most closely). The briefs were rendered by TRUNK's review_brief.py with --root at the lane, so the reviewer template is trunk's (prompts resolve beside the script), not the lane's rewritten one: a lane that changes the reviewer template is not reviewed under its own new text. The interim review-addendum.md (severity by reachability, the closed-set classification, the threat model) was appended by hand, as the handoff chain directs until this row lands. Round 1 is an ordinary round, so no convergence addendum. Filed: 001-REVIEW-A-bd52ffa (Sol), 002-REVIEW-B-bd52ffa (Fable), 003-REVIEW-B-bd52ffa (Opus)."
alternative = "Render with the lane's own review_brief.py, so the lane's rewritten reviewer template would frame the review of itself."
reversal_cost = "None for later rounds: each round is rendered afresh."
why_not_escalated = "The handoff chain's interim procedure, applied as written, with the renderer chosen so the judged change does not set its own judge's frame."
review = ""

[decision.D-009]
decided = "Round 1 triage. One finding costs a round: 003 F1 [MAJOR] (Opus), accepted for fix round 2: the reviewer template's diff pathspec does not exclude docs/decisions/ or docs/plans/<WI>/critique-*.md, so a convergence reviewer running its own brief's command sees earlier findings, defeating revision 8's anchoring ruling that deliverable 1 carries; reachable in every convergence round over a lane with a decisions record. The builder answers it with a coverage plan before any fix. The MINORs cost no round: the spine-text clarity findings (001 F1 and 003 F2 on SR-236's refused-ruling clause; 002 F2, 002 F3 and 003 F3 on SR-234's ruling list and its SUCCESSOR bound) go to the lane's spine change list for the checkpoint's reconcile; the non-spine MINORs (002 F1, the recipes' closure-check and landing lines; 003 F4, the skill's ruling-6 wording; 003 F5, the route of a fail-closed out-of-set note) may be fixed in round 2's build where each is a one-site text fix, else they become a successor at the landing. No finding needed the threat model. The trial's record (owner revision 37): accepted round-costing findings, Opus 1, Sol 0, Fable 0; MINORs raised, Sol 1, Fable 3, Opus 4, two of them raised by two reviewers each (SR-236 by Sol and Opus; SR-234 by Fable and Opus)."
alternative = "Run a dispute sitting on the MAJOR, or spend the round on the MINORs too."
reversal_cost = "Low: a later round or the checkpoint re-judges every finding's fix."
why_not_escalated = "The review shape (ruling 4) decides which findings cost a round; the MAJOR's remedy stays inside the row's deliverable 1."
review = ""

[decision.D-010]
decided = "Fix round 2 answers round 1. The builder's three coverage plans (one per round file, kept in the coordinator's scratch, never given to reviewers) each passed plan_coverage.py --findings (exit 0), re-run by the coordinator. Fixed: 003 F1 [MAJOR], by construction: the reviewer template's diff pathspec now excludes docs/decisions and docs/plans/*/critique-* beside docs/reviews, so the brief's own command never prints a record of earlier findings; 003 F5 [MINOR], one clause in the skill's section 3 step 4. Excluded: 002 F1 and 003 F4 (one recipe finding needing two bullets, so not a one-site fix) to a successor at the landing; the spine-wording MINORs to the checkpoint reconcile (D-009). The convergence map for the coming convergence round: 003 F1 maps to tests/test_review_brief_git.py::test_the_reading_scope_never_shows_a_record_of_earlier_findings and its smoke pin tests/test_prompts.py::test_the_reviewers_reading_scope_excludes_every_record_of_earlier_findings, both red at the pre-fix template and green after; 003 F5 maps to the corrected text at SKILL.md section 3 step 4. Two residues the builder surfaced, for the owner and the next round: (a) docs/plans/<WI>/plan.md stays in the reading scope, and a revised plan can name the first critique's finding (this lane's revision does), so a convergence reviewer can still learn of one earlier critique finding there; (b) the exclusion is in the one shared template, so every review (ordinary and the loop's) now skips decisions records, as it skips docs/reviews: a decisions record is the owner's to confirm or overrule, not a code reviewer's."
alternative = "Exclude the records only in convergence rounds (a second pathspec per stance), or keep relying on the convergence sentence the reviewer must obey."
reversal_cost = "Low: one pathspec line and its two tests."
why_not_escalated = "The remedy is the finding's own, inside deliverable 1; the residues are recorded for the owner and for round 2's reviewers to judge on their own."
review = ""

[decision.D-011]
decided = "Full-lane review round 2 (counted round 2 of at most 3, ordinary stance; the three-reviewer trial) ran at 6e2ad9f7f over e474f51dd..6e2ad9f7f, framed as D-008 sets out (trunk's review_brief.py with --root at the lane, plus the interim review-addendum.md): 004-REVIEW-A-6e2ad9f (Codex Sol, medium) APPROVE, 2 MINORs; 005-REVIEW-B-6e2ad9f (Claude Fable, medium) APPROVE, 2 MINORs; 006-REVIEW-B-6e2ad9f (Claude Opus, high) CHANGES-REQUESTED, 1 MAJOR and 5 MINORs. Triage (2026-10-15d session): 006 F1 MAJOR accepted. Fix round 2 wrote the docs/decisions and plan-critique exclusion into the one shared reading-scope pathspec, so every review, ordinary rounds and the shipped loop's reviewer in adopters' repositories included, loses the delegated-decisions record, which PROCESS_OPTIONS's decision-recording doctrine has a reviewer check against the diff; the anchoring ruling (owner, revision 8) binds only the convergence round. That is a regression of supported behaviour, reachable in every ordinary review, so fix round 3 makes the exclusion the convergence stance's alone, by construction, keeping round 1's 003 F1 fixed. MINORs fixed in fix round 3 as text: 004 F1 (spine-questions.md's SR guidance still permits a file name in acceptance), 006 F2 (the closure-check recipe runs trace.py --strict), 006 F3 (rubric K2 in ruling 5's voice), 006 F4 (the plan critique's severity rule survives the deleted recipe bullet: the handoff's noted item), 006 F5 (the convergence stance also sets aside lane commit messages, which cite earlier rounds). MINORs to the checkpoint reconcile: 004 F2 (LLR-311's stance sentence), 005 F1 and 006 F6 (SR-234, SR-236 and LLR-069 fold SUCCESSOR into their one enumeration). 005 F2 (stack.ini's fig line) is re-stamped at the landing tip. Round 3 is the last allowed round, in convergence stance: each accepted finding is mapped to its regression test or its corrected text before it. Trial record, round 2: round-costing Opus 1, Sol 0, Fable 0; MINORs Sol 2, Fable 2, Opus 5."
alternative = "Contest 006 F1 in a dispute sitting as a reversal of round 1's accepted fix, or grade it MINOR and land the shared exclusion."
reversal_cost = "Low: the exclusion's placement is one render-time choice; the round cap still counts."
why_not_escalated = "The finding cites shipped doctrine and a reachable ordinary-round regression; the fix narrows round 1's fix to what the owner's anchoring ruling requires and changes no scope, Done-when or Trust text."

[decision.D-014]
decided = "The text fix after round 3 (fix round 4), answering 008 F3 and 009 F1 (R1: the convergence paragraph's command now prints no commit message: `git log -p --format=%h`, each patch under its short hash; `git show` is left out because the prompt-composing path refuses it under the egress convention SR-175 states) and 008 F4 and 009 F2 (R2). Stage 1's coverage plans (cov-r4-008, cov-r4-009) passed the gate on the builder's and the coordinator's runs. D-013's triage of R2 is NARROWED to the two findings' own remedies, which both say to cite the WI and the ruling: WI ids stay in shipped maintainer notes (the kit's established convention, pinned by tests/test_prompts.py), a ruling is cited by its date in the form PROCESS.md already uses, so Done-when D1's citation of each ruling holds; what leaves the lane's shipped comments is review round and finding numbers and paths into this repository's docs/plans, docs/reviews and docs/decisions. D-013's sentence that a WI id is not fine is withdrawn. Added to R2: the lane-added test comments citing review rounds or findings are reworded to state what they pin, because the post-checkpoint gate runs in convergence stance over the lane's diff and must never see earlier findings (009 F2's second half). Pre-existing shipped sites of the class this lane did not touch (docs/plans paths in 13 scripts, review round numbers in about 30, this repository's decision ids in 3) are reported, not fixed: noted for a successor at the landing (consolidation-stop rule)."
alternative = "Keep D-013's broader reading (no WI id or dated ruling in shipped comments), which would strip D1's ruling citations from the targets; or leave the lane-added test comments for the gate to read."
reversal_cost = "Low: comment and test-comment text only; the post-checkpoint gate reviews it."
why_not_escalated = "It applies both reviewers' stated remedies and an existing pinned convention; no owner ruling is touched."

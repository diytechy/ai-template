[decision.D-012]
decided = "Fix round 3 (2026-10-15d session), from three coverage plans the coordinator re-gated (plan_coverage --findings, exit 0 each; one per round-2 file), built by one builder in two stages (plans first, then the fix). 006 F1: the reviewer template's reading-scope command is back to its trunk form, and review_brief.py's render adds the docs/decisions and plan-critique exclusions to a convergence round's command only (a template whose command does not carry the docs/reviews exclusion exactly once is refused), so ordinary rounds and the loop's reviewer read the decisions record again while round 1's 003 F1 stays fixed for the convergence render. 006 F5: the convergence stance also sets aside filed plan critiques and the lane's commit messages, and finds pre-fix code from the diff. 004 F1: spine-questions.md states the file-naming rule once in its section 0, which every tier's questions carry. 006 F2: the recipes' closure check and landing step run trace.py --strict. 006 F3: rubric K2 in ruling 5's voice. 006 F4: plan-decomposition.md gains a Verdict section tying severity to reachability, and scope-critique.md applies the rule in every round, its sibling site (kept: the by-hand addendum used to reach every critique). A test whose name overstated what it checks was renamed, with TC-332's evidence cell; TC-333's evidence names the three new tests (traced cells). Each covered finding maps to a regression red at 027a5ac99 or to corrected text, as round 3's convergence mapping needs: 006 F1, test_only_a_convergence_brief_leaves_the_decisions_record_and_critiques_out_of_its_reading_scope and test_an_ordinary_review_reads_the_decisions_record (with the pin test_the_reading_scope_never_shows_a_record_of_earlier_findings for 003 F1); 006 F5, test_the_reviewer_brief_states_the_convergence_stance; 004 F1, test_every_tier_receives_the_one_naming_rule; 006 F4, test_the_plan_critique_brief_ties_severity_to_reachability and the scope-rubric test's every-round clause; 006 F2 and
# docs/decisions/coordinator-2026-10-04.toml — the wave-11 coordinator's
# DECISIONS RECORD for its calls on trunk (the unattended session of
# 2026-10-04; the owner is away and reviews afterwards). The format and
# doctrine are project-trajectory/decisions.template.toml's. Lane calls go in
# the lane's own docs/decisions/<branch>.toml.

high_risk = []

[decision.D-001]
decided = "Each scoped unpause's deletion commit counts as 'reviewed' when it passes the commit bar and cites the owner's written session authorization of 2026-10-04; no separate review session is drawn for the one-file deletion."
alternative = "Draw a Codex Sol review of each pause-deletion commit before the claim."
reversal_cost = "None: the pause is restored byte-identical in the commit after each claim, so nothing claims in the window but the authorized row."
why_not_escalated = "The owner's session prompt authorizes exactly this sequence (delete, claim, restore) for WI-791, WI-790 and WI-788; the earlier scoped unpause (OI-99, 236038e8) took the same form."
review = ""

[decision.D-002]
decided = "When the first pause-deletion commit was refused by the hook but integrate.py claim still claimed WI-791 (it reads the working tree's pause file, which the staged deletion had removed), the coordinator reset its own unpushed commits to 423ec57c, deleted the orphan wi-791 branch and redid deletion, claim and restore in the authorized order."
alternative = "Keep the out-of-order claim and record it, or commit the deletion after the claim."
reversal_cost = "None: the discarded claim commit (bd8e7619) is in the reflog; nothing was pushed."
why_not_escalated = "The owner's authorization names the order (deletion commit, then claim, then restore); redoing local unpushed commits restores it exactly. The claim's working-tree read is reported as a kit finding."
review = ""

[decision.D-003]
decided = "The WI-788 lane is kept open (claimed, its design note committed on the lane, not landed) at the owner checkpoint; the checkpoint item holds the row and the owner reads the note on lane wi-788."
alternative = "Land the note on trunk and return the row to queued, or close WI-788 partial with a handback."
reversal_cost = "Low: the lane lands as it stands once the owner approves, or is refreshed and amended."
why_not_escalated = "The spec closes WI-788 on the APPROVED note (half 2: the coordinator files the slice rows and WI-788 closes); un-claiming is not one of the integrator's three outcomes, and a partial close would mint a successor the owner has not ruled."
review = ""

[decision.D-004]
decided = "WI-788's checkpoint is filed as pending OI-104 plus a queued placeholder row WI-794 citing it in needs (WI-790's rule, live since its landing), rather than an OI with wi_refs; WI-788 itself stays claimed on its lane and does not cite OI-104."
alternative = "Add OI-104 to WI-788's own needs (an active row the uncited-pending check does not count, and whose spec lives on both trunk and the lane), or file the item with wi_refs before WI-790 landed."
reversal_cost = "Low: one placeholder row; the ruling writes its Done-when, or the row is cancelled and WI-788 cites the item."
why_not_escalated = "The owner's WI-790 rulings make a queued placeholder the way every hand-filed open item reaches the owner's surface; the placeholder is not one of the note's successor rows, which stay unfiled as the session prompt requires."
review = ""

[decision.D-005]
decided = "The full unfiltered suite was run twice: once on WI-790's lane tip before its adjudication (to catch slow-tier reds while rounds remained), and once on trunk at the session's end."
alternative = "Run it once, at the end only, as the session prompt states."
reversal_cost = "None."
why_not_escalated = "The extra run cost wall time only and moved no state; the end-of-session run the prompt asks for still happens."
review = ""

[decision.D-006]
decided = "The owner's in-session verdicts on WI-788's high-risk decisions were transcribed into docs/decisions/wi-788.toml as reviewed = true, each with a review note quoting the verdict; 'D-012: Good' was read as D-010 (the value the coordinator had just raised), flagged in session and not corrected."
alternative = "Leave every entry unmarked for the owner to mark by hand, or mark D-012 as written."
reversal_cost = "None: set the key back to false or delete it."
why_not_escalated = "Each mark records a verdict the owner gave in words; the D-010 reading was put to the owner, who did not correct it."
review = ""

[decision.D-007]
decided = "On OI-104's ruling, WI-794 keeps its needs and title, gains a Done-when (land WI-788's lane, close WI-788, file the twenty-one rows) and points its specref at the ruling's log record, since a ruled placeholder may not keep the open-items registry as its spec."
alternative = "Close WI-794 at the ruling and carry the follow-through on WI-788 alone."
reversal_cost = "Low: one row."
why_not_escalated = "WI-794's own Context says the ruling writes its Done-when; the specref rule (WI-790 A6) leaves the log record as the real spec on trunk."
review = ""


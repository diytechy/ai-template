[decision.D-002]
decided = "The queue's two drafted hook-coverage rows are filed on trunk, each before its scope critique: WI-921 (done-when-blessed joins the shipped hook's batched floor, with a census of every built-in step; planmode none) and WI-922 (WI-913's successor: the plan gate judges a single row's landing by the commits and the close it carries; planmode single). The owner ruled the drafts' four calls in session (2026-10-15), each as recommended: WI-921 Q1, a census test over the built-in steps rather than a derived floor; WI-922 Q1, the close-by-content rule stays in the row; WI-922 Q2, a git merge that git commits itself runs no pre-commit hook, so it skips every floor step, and it stays out of reach: listed in the row's S3 and recorded here, with nothing built; WI-922 Q3, text-then-act is left alone and LLR-302's acceptance of the hand-merge gap is recorded here (the merge slot judges each lane commit), while whether the ruling-sync and held-status riders share the shape goes to status.md's unfiled follow-ups. The coordinator's filing calls: the drafts' facts were refreshed against trunk after WI-913's landing (38 built-in steps, 21 in the floor with plan-gate; the blast-radius replay re-run at 323930653 judges 47 closes and holds only WI-847's, and holds no open lane); WI-922 absorbs wi-913 D-010's two MINORs as deliverables 5 (SR-154's single-plan hold under its own condition, keeping the one shall the owner ruled in wi-913 D-008) and 6 (the cap check's unreachable branch deleted), so its Done-when amends SR-154 instead of leaving it unchanged; WI-922's specref names WI-913's archived spec, the gate's spec of record, in place of the plan's item 9 section; and WI-922 carries a soft edge on WI-921, which lands first because both edit the shipped hook and RESYNC_PACK.md."
alternative = "File WI-922 without D-010's two items and mint a third row for them, which would sit SR-154 in two lanes; or file the drafts with their pre-landing counts and leave the scope critique to find them stale."
reversal_cost = "Low: both rows are queued and unclaimed, so either can be amended or cancelled before its claim."
why_not_escalated = "The four calls were the owner's, ruled in session and recorded in each row's Calls ruled at filing section; the rest refreshes facts and follows D-010's binding."

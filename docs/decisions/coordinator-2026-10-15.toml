high_risk = ["D-003"]

[decision.D-001]
decided = "The two hook-coverage rows are drafted and not yet filed; the next session files each on trunk with its scope critique. They are the queue's 'to file' row for WI-841's done-when-blessed step, which the shipped hook never runs, and the successor row that WI-913's lane decision D-006 said would be filed at the lane's landing, for the landing shapes the hook does not judge. D-010 of that lane adds two MINORs to the second row: SR-154's single-plan predicate stated with its own condition, and the gate's unreachable cap branch deleted. A planner drafted both into the session scratch (review-tmp/2026-10-15-coord/drafts/: row-hook-floor.md and row-landing-shapes.md, with notes and probes). The landing used the session's context budget, so filing them here would have left their scope critiques and dispositions half done. The landing-shapes draft carries three calls (its Q1 to Q3) to rule at filing; its Q2 notes that a merge which commits itself runs no pre-commit hook at all, a gap beyond the plan gate."
alternative = "File both rows at the landing as D-006 planned, and leave their scope critiques to the next session, which splits each row's filing from its critique across two sessions."
reversal_cost = "None: the drafts are complete, and filing them is the next session's first queue row."
why_not_escalated = "A sequencing call inside the queue; no ruling changes, and the rows' calls stay for their filing."
review = ""

[decision.D-002]
decided = "The queue's two drafted hook-coverage rows are filed on trunk, each before its scope critique: WI-921 (done-when-blessed joins the shipped hook's batched floor, with a census of every built-in step; planmode none) and WI-922 (WI-913's successor: the plan gate judges a single row's landing by the commits and the close it carries; planmode single). The owner ruled the drafts' four calls in session (2026-10-15), each as recommended: WI-921 Q1, a census test over the built-in steps rather than a derived floor; WI-922 Q1, the close-by-content rule stays in the row; WI-922 Q2, a git merge that git commits itself runs no pre-commit hook, so it skips every floor step, and it stays out of reach: listed in the row's S3 and recorded here, with nothing built; WI-922 Q3, text-then-act is left alone and LLR-302's acceptance of the hand-merge gap is recorded here (the merge slot judges each lane commit), while whether the ruling-sync and held-status riders share the shape goes to status.md's unfiled follow-ups. The coordinator's filing calls: the drafts' facts were refreshed against trunk after WI-913's landing (38 built-in steps, 21 in the floor with plan-gate; the blast-radius replay re-run at 323930653 judges 47 closes and holds only WI-847's, and holds no open lane); WI-922 absorbs wi-913 D-010's two MINORs as deliverables 5 (SR-154's single-plan hold under its own condition, keeping the one shall the owner ruled in wi-913 D-008) and 6 (the cap check's unreachable branch deleted), so its Done-when amends SR-154 instead of leaving it unchanged; WI-922's specref names WI-913's archived spec, the gate's spec of record, in place of the plan's item 9 section; and WI-922 carries a soft edge on WI-921, which lands first because both edit the shipped hook and RESYNC_PACK.md."
alternative = "File WI-922 without D-010's two items and mint a third row for them, which would sit SR-154 in two lanes; or file the drafts with their pre-landing counts and leave the scope critique to find them stale."
reversal_cost = "Low: both rows are queued and unclaimed, so either can be amended or cancelled before its claim."
why_not_escalated = "The four calls were the owner's, ruled in session and recorded in each row's Calls ruled at filing section; the rest refreshes facts and follows D-010's binding."
review = ""

[decision.D-003]
decided = "Two owner rulings in session (2026-10-15), recorded with what follows from them. (1) Queue order: WI-921 and WI-922 are claimed together under one scoped unpause once their critiques confirm; WI-911 plans through the plan gate first; WI-921 builds beside it and lands once WI-911's plan has passed (so the cycle has run the gate's plan step), and WI-911 then lands through WI-921's armed hold; WI-922 lands after WI-917, so it does not delay the overnight runner. (2) Answering WI-921's round-1 S2 finding, a drafter found that the done-when-blessed step fails open on this repository's two-commit landing (recipes section 3): on trunk the step reads the claim copy at HEAD, the landing's first commit carries the lane's Done-when edit into trunk's claim copy unjudged, and the close then compares the edit with itself. WI-835's landing (squash 181ec9001, close dc0333a32) has that shape, with an uncovered digest. The owner ruled it fixed in WI-921, over a successor row or a recipe step: the step judges the commit made on trunk that first changes a claim copy's Done-when, against its parent and never by searching history, and a read it cannot complete holds. What follows: a trunk amendment of an already-claimed row's Done-when (the B4 pattern WI-902's amendment used) now owes its blessing in its own commit, an accepted verdict or a confirmed owner ruling in that commit's tree, or is made in the lane instead. WI-902's amendment landed before this; its re-cut owes a Done-when sitting before its first build anyway. WI-921 becomes single (round-1 S4) and gains a Trust section (round-1 S2)."
alternative = "(1) Land both rows before WI-911, or both after the B batch. (2) Arm the step as filed and file a successor row for the reader, leaving the hole open between the two landings, or add a recipe step that runs integrate.py done-when-hold on the full squash before splitting it."
reversal_cost = "Low before WI-921's claim: the trunk arm can be dropped from its spec. After its landing, a trunk amendment of a claimed row's Done-when is refused without a blessing, so dropping the arm means a forward fix in a lane."
why_not_escalated = "Both were the owner's rulings, made in session; the trunk-amendment consequence is recorded high-risk here so the owner can overrule it before the claim."
review = ""

[decision.D-004]
decided = "Filed WI-923 on trunk (the 2026-10-15c attended session), a defect the smoke tier showed as a load-sensitive red (the owner's rule for such reds, plan revision 37): session_keep's lock primitive treats only an exists error as a held lock, so on Windows a contender whose exclusive create meets the holder's in-progress delete gets an access-denied error that escapes as a crash (tests/test_session_keep.py's two-concurrent-first-calls case failed once among the session's smoke runs at -n auto, and passed 3 of 3 runs alone). A drafter (Claude Opus, scratch only) confirmed it on the code and by probes, refuted the coordinator's first guess at the mechanism (the window is the holder's own delete call, not a handle kept open), found no duplicate row (WI-906, WI-800 and wi-798 are related, not the same), and anchored it at SR-227 and LLR-270 (TC-329, TC-267, IF-273). The spec carries the drafter's one call for the owner, Q1, written with its recommended answer: a refusal that never clears within the wait becomes the existing busy refusal, naming the lock path and the access refusal (the alternatives: re-raise at the deadline, or a Windows-only rule). planmode none, needs none, no Trust section; its scope critique comes before any claim."
alternative = "Leave the red as a note in the handoff, unfiled, or ask the owner Q1 before filing."
reversal_cost = "Low: a queued row; Q1's answer is spec text the scope critique and the owner can still change before the claim."
why_not_escalated = "Filing a defect row is the coordinator's; Q1 is recorded with its recommendation for the owner's confirm or overrule, and nothing is built before the scope critique."
review = ""


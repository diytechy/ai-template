alternative = "Reject the finding: the input space is a closed enumeration of four outcomes, each pinned by one deterministic test named in the Done-when, so a plan would restate the Done-when."
reversal_cost = "Low: the row is queued and unclaimed; planmode is one frontmatter line before the claim."
why_not_escalated = "Applies the owner's S4 criteria as written; a rejection would override the ruled rule for one row."
review = ""


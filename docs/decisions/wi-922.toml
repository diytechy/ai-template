[decision.D-005]
decided = "Counted round 1 (tip cba1d96aa): 002-REVIEW-A (Codex Sol, medium) APPROVE with no findings; 003-REVIEW-B (Claude Opus, high, the Gemini slot's stand-in under ruling 7, recorded as the substitution) APPROVE with two MINOR findings. No BLOCKER or MAJOR, so the counted rounds end at one and the checkpoint follows. F1 (plan_gate.py, IF-295's residue clause 'a commit made on a detached HEAD' overstates: staged_lines judges a squash landing's carried lane commits whatever the branch) is confirmed on the code path (staged_lines computes the squash lines before and regardless of the branch check) and accepted: this lane wrote the clause, so the builder narrows it to the spec Context's own residue, a build commit made on a detached HEAD in a lane worktree, and regenerates the interface reference; a MINOR costs no round. F2 (LLR-337's rationale, 'a skipped hook, rebase, merge or landing cannot turn an unreviewed plan into build output', now reads wider than the residue IF-295 states) is accepted as wording and deferred to LLR-337's next sitting, listed among status.md's unfiled follow-ups: the blessed Done-when pins LLR-337 unchanged, and amending its rationale here would change the Done-when for a MINOR, as with SR-233's rationale follow-up (wi-911 D-020)."
alternative = "Amend LLR-337's rationale in this lane, changing the Done-when and adding a done-when kind to the checkpoint sitting; or send F1 to a successor row."
reversal_cost = "Low: one docstring clause; F2 stays a listed follow-up."
why_not_escalated = "MINOR triage is the coordinator's (the skill section 3); neither finding is convergence-class."
review = ""

[decision.D-006]
decided = "The checkpoint. Terra's reconcile turn is omitted: the set was drafted at intent (cba1d96aa, SR-154's one moved phrase), the only row text a round proposed (round 1's F2, LLR-337's rationale) is deferred out of the lane (D-005), and the code that moved since intent is IF-295's residue clause, a docstring, with no trace cell, symbol or tag changed; the amended cell was checked mechanically against the approved text (old minus the moved phrase equals new minus it; one shall; every other cell unchanged). The closure check passed (trace.py --strict and check_trajectory.py --strict clean at b35809891). Combined sitting 004 (docs/reviews/wi-922/004-ADJUDICATE-b358098.md) ruled SR-154 CLARITY, identical obligation, and re-attested it: act seq 122 (12ed8fa4c). The lane keeps docs/interface-reference.md, the one trunk-only view it carries, rather than restoring it before the gate (recipes section 3): the blessed Done-when names the regenerated reference and a clean interface-reference check, so restoring it would leave the lane's reference stale against its own contract body; the landing's regen rewrites it from the same body."
alternative = "A Terra reconcile turn with nothing to carry; restoring the interface reference to trunk's copy before the gate."
reversal_cost = "None."
why_not_escalated = "The skill's checkpoint step allows the omission on these conditions; the view's handling follows the Done-when."
review = ""


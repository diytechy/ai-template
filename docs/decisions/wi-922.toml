[decision.D-001]
decided = "The lane's review rounds run in the review-churn trial shape (plan revision 37): three full-lane reviewers in parallel, each from its own render and scratch: Codex Sol at medium filed as REVIEW-A, and Claude Fable at medium and Claude Opus at high, both stand-ins for the Gemini reviewer B slot (ruling 7), each filed as REVIEW-B under its own number. Both stand-ins share the builder's and the adjudicator's model family, and Opus shares the builder's model; the decision recording each round names the model behind each REVIEW-B file. The lane starts its count at round one; at most three rounds before the checkpoint."
alternative = "The plan's norm of two reviewers (Sol and one stand-in)."
reversal_cost = "None for rounds already run; a later round may drop a stand-in."
why_not_escalated = "The owner ruled the trial for this program (revision 37) and the substitution until WI-815's Gemini route (ruling 7)."
review = ""

[decision.D-002]
decided = "The lane is cut at trunk's tip f0ff66cc4 (the claimed branch had no commits of its own, so it was moved there, recipes section 2), and the row's narrowed copy replaces its claim copy: the 2026-10-15i redraft (title, Context, Deliverables, Spine rows, Done-when, Scope answers, Calls ruled at filing and Critique dispositions), whose round-1 scope critique, run from its own detached checkout carrying the copy, approved with no findings and S4 at none (coordinator-2026-10-16 D-001 and D-002). The copy changes the Done-when, so the Done-when hold binds before any build: an early done-when sitting judges the copy's exact text first (the coordinator-cycle skill section 3), and SR-154's amendment (deliverable 1) is authored and sat at the lane's checkpoint as the Spine rows section states. planmode stays none, so no plan step precedes the build."
alternative = "Sitting the Done-when together with SR-154 at the checkpoint (the hold forbids a build before a verdict binds the Done-when), or building against the unblessed copy."
reversal_cost = "Low: the copy is one committed file; a returned Done-when goes back to its drafter's text."
why_not_escalated = "The owner's filing rulings and the critique settled the copy; the hold and the sitting order are the skill's."
review = ""

[decision.D-003]
decided = "Deliverable 3's residue text continues IF-295's contract body with no blank line before it, rather than standing as its own paragraph as the spec words it: gen_arch_map's contract-body reader ends a body at a blank line, so a separate paragraph would sit outside the body and never reach the interface reference. The text is the spec's proposed wording verbatim, and the Done-when ('IF-295's contract body in plan_gate.py carries the residue list') is met. The builder found no dogfooded hook copy (.githooks/pre-commit runs the shipped hook), no test pinning the hook's text, and no complexity-baseline row for plan_gate.py."
alternative = "A separate paragraph, which drops the residue out of the generated interface reference; or changing the contract-body reader, outside the spec's surface."
reversal_cost = "None: one docstring's line breaks."
why_not_escalated = "A format-forced layout of text the spec states and the Done-when names; no meaning changes."
review = ""


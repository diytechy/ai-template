[decision.D-004]
decided = "The lane was rebased onto trunk's 342bd95ef (WI-927, WI-943, WI-918 and WI-946 landed since its base) before counted round 1, as the 2026-10-19a handoff asks; its pre-rebase tip d15adb2de is archived at landing beside 0eb9c31c6. Eleven files conflicted in the build commit, resolved by the recipes' rebasing table. The byte-budget table takes the lane's AGENTS.template.md and CLAUDE.md rows and re-measures the skill's own row at 4,527 (trunk's 4,509 plus the lane's 18), its two copies synced. The id watermark is trunk's, then trace.py --bump-ids (SR 240, LLR 340, TC 370, IF 297, WI 950; wi-925's floor ids sit below them). LLR-300 keeps trunk's code_symbol and test_refs, which the lane left alone, and its detail keeps both sides' one-sentence additions verbatim at the one place both inserted, the lane's commit-floor sentence first, as the take's code orders its checks (the commit floor, then the session, then the guard hooks); WI-927's approved text is otherwise unchanged, and the checkpoint sitting judges both additions. RESYNC_PACK keeps both sides' entries, trunk's first, with the lane's re-anchored at 342bd95ef. coordinator_guard.take's docstring states both refusals in code order; integrate.py's and test_adjudicate_act.py's imports keep both names; the launcher test fixture keeps trunk's docstring and the lane's hooked checkout. The module-size ratchet's integrate.py line is trunk's note plus the lane's 12 (1552 to 1564). A per-cell three-way read of the interface, low-level, system and test-case registries (base 2268a9a8c, lane d15adb2de, trunk 342bd95ef) found every cell on the side that changed it, except LLR-300's detail above. Two fixes follow the rebase, in this commit: trunk's new test_the_hook_opt_in_with_no_guard_hooks_changes_nothing took the lease over a plain directory, which this lane's take refuses first, so it now builds its root with hooked_checkout, as the lane's other take tests do, with no assertion changed; and docs/stack.ini's max-tests is re-stamped 2825 to 2970, since trunk's landings and this lane together pass the ceiling (2799 at trunk, 2839 on the lane, about 2855 once WI-925 lands too). The plan's pass record still binds: the plan is unchanged, and trunk's one edit to docs/specs/WI-926.md, WI-927's close relinking its spec, sits in the spec's split section, outside the Done-when. The rebased tier reads above trunk's in adjacent runs on a loaded box (102.2 s against 86.3 s, then 118.6 s against 95.1 s), where at its old base it read at its parent's: the lane's hooked-checkout fixtures run git per test, and three smoke modules about double at four workers (test_overnight_legs 1.5 s to 4.5 s, its fixture's checkout kept from the lane in this merge; test_blackout_window 3.4 s to 6.7 s; test_coordinator_guard 3.8 s to 7.7 s). That is the lane's cost to the tier, for round 1's builder to answer before the landing's bar reads it: re-tier, or have a fixture that already fakes the kit's shared readers, as the launcher's does, fake the hooks reader too. No review round is owed for the rebase alone: the lane has run no counted round, and counted round 1 reviews the rebased tip."
alternative = "Hand the conflicts to a kit-builder; they were small enough to resolve and read directly. Leave trunk's new take test to the builder's round 1 fix; it was red on the rebased tip, and a red bar is not left standing."
reversal_cost = "Low: the old tip stays reachable; every resolution is unjudged until the checkpoint."
why_not_escalated = "The recipes' rebasing table and its smoke-ceiling restamp; the test fix follows the lane's own fixture pattern."
review = ""

[decision.D-005]
decided = "The slow tier after the rebase: trunk's changed test modules and the lane's, run together on the rebased tip, read 4 failed, 1892 passed. Three are rebase interactions, fixed here in tests only, with no assertion changed: WI-927's two Windows-console take cases built their root as a plain directory, which this lane's take refuses first, so _take_root now builds a hooked checkout, as the lane's other take tests do; and this lane's launcher fixture faked prepare_run with WI-946's old shape, so the fake now takes the repository and returns the trunk's ref as its fifth value. The two modules then pass (80 passed, 13 skipped). The fourth, test_done_when_blessing's test_the_scaffold_hooks_floor_resolves_and_passes_on_a_clean_tree, fails at the pre-rebase tip d15adb2de too: build round 1's _init now calls hooks_on, whose stubs overwrite the scaffold's own .githooks/pre-commit, so the test reads a stub with no batched --run-steps line. It is the lane's own defect, not the rebase's, and goes to round 1's builder with D-004's tier cost; the full suite at the landing would refuse it."
alternative = "Fix the scaffold-floor test here too; how a scaffold keeps its own hook while its commits run under stubs is the builder's design call, not a rebase's."
reversal_cost = "Low: test-only edits, unjudged until the checkpoint."
why_not_escalated = "The same fixture pattern as D-004's test fix; a lane defect found during a rebase goes to the lane's next build round."
review = ""

[decision.D-006]
decided = "The lane was rebased onto trunk's 5245ac82c, which carries WI-925's landing (the trunk declared by name), in headless leg 02 of loop session 20261019T185432Z-8e4f05; the pre-rebase tip 93a141a9e is archived at landing beside d15adb2de and 0eb9c31c6. Sixteen files conflicted in the build commit, each kept both sides: thirteen test modules and fixtures take trunk's declare_trunk beside the lane's hooks_on (imports and fixture lines, trunk's lines first); the low-level and test-case registries keep WI-925's LLR-339 and TC-369 and the lane's LLR-340 and TC-370; RESYNC_PACK keeps both entries, trunk's first, the lane's re-anchored at 5245ac82c; the module-size ratchet takes trunk's note plus the lane's count (agent_loop.py 2422 to 2424, integrate.py 1547 to 1559); the id watermark is trunk's, then trace.py --bump-ids (IF 297, LLR 340, SR 240, TC 370, WI 951). The rebase's line union dropped cells the new rows share: LLR-339's component and phase and TC-369's phase went to the lane's rows, and TC-370 lost its level, tier and automated lines to a dedupe meant for import lists; this commit restores each row's block from its own side, and a per-cell three-way read of every registry (base 342bd95ef, lane 93a141a9e, trunk 5245ac82c) now finds every cell on the side that changed it. The remaining two commits replayed cleanly. Trunk's and the lane's changed test modules (48) on the rebased tip read 1 failed, 2063 passed: the one failure is D-005's scaffold-floor test, the lane's own. The commit bar reads 2853 passed, smoke tier 57.5 s against 60 s, beside trunk's tip at 49.1 s in the same window: the lane's 8 s is D-004's tier cost. No review round is owed for the rebase alone: the lane has run no counted round."

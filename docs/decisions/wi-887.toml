[decision.D-001]
decided = "Done-when's 'the gate's evidence that a verdict came from the final reviewer's scope is the verdict file itself, under WI-884's filing contract' is read as WI-884's whole filing contract, which already binds the coordinator-written `# review-scope:` and `# session-gen:` records in the committed session log (WI-884 D-004). Round 1's fix (plan R1, answering review 001's F1) adds a distinct final kind to that existing `# review-scope:` record and has the gate read that one binding, with the mode resolved from both dials (retention on and final_reviewer persisted) in one reader. The new session-mode and keep-scope columns stay audit-only. The reviewer-written round text is not used as provenance: a reviewer cannot attest where its own session came from."
alternative = "Read 'the verdict file itself' as the round file's own text, and have the reviewer write its scope into it; or amend the Done-when wording first under a bound verdict."
reversal_cost = "Medium: an overrule moves the binding from the session log header to the round file, rewriting the gate reader and its tests before landing."
why_not_escalated = "It applies the spec's own pointer to WI-884's contract, adds no authority beyond the record the gate already reads, and the checkpoint sitting judges the rows that state it; the lane's Done-when text is unchanged."
review = ""


[decision.D-007]
decided = "Owner ruling in session (2026-10-17d), on the question the 2026-10-17c handoff left open (should a row make the smoke budget step itself judge load, or does D-005's paired-reading procedure suffice). The owner keeps the budget as it is, and asked whether machine load can be fetched mechanically: 'the spirit of the smoke tests is just to prevent egregiously heavy / long repeatative tests, but we never know what other items will be running on the computer or what priority the smoke test has been given.' Told it can, with the stdlib only but not trivially (Windows through a job object's CPU accounting and GetSystemTimes over ctypes; Linux through /proc/stat and getrusage; macOS weakest), and offered two designs (scale the wall budget by the foreign load sampled during the run, or budget the tier's own CPU-seconds with a looser wall cap for tests that sleep or wait), the owner chose the CPU-time budget, filed as a queued row after the program's current batch. D-005's paired-reading procedure stays until that row lands. At filing the owner ruled the draft's three calls as recommended: Q1 (a), the wall-clock cap sits above the ordinary loaded readings on record (58.7 to 287 s), so only an extreme window or a tier that sleeps or hangs for minutes breaches; Q2 (a), one CPU-seconds value measured on this workstation is applied everywhere, CI included, the report naming the CPU count, and a breach on another box is a finding, not a re-stamp; Q3 (a), the Windows job-object code moves first into one shared kit module, in a behaviour-preserving commit, which the session kill, the root conftest and the budget step all import."
alternative = "The load-scaled wall budget; a row with the design left open; or no row, keeping the procedure alone."
reversal_cost = "Low: a queued row, critiqued before its claim."
why_not_escalated = "It was the owner's ruling."
review = ""

[decision.D-005]
decided = "Owner direction in session (2026-10-17c), asked whether the box was quiet for WI-931's landing reading: 'It may not be quite, but run it anyways, it sounds like the bar needs to be relaxed. The smoke test time check is to ensure smoke tests do not take an egregious amount of time, but an occupied machine isn't an excuse to avoid them. It can just be documented, and if it's due to CPU load that's okay.' So a landing no longer waits for a quiet box: its bar runs on the box as it is, on the staged squash, beside its parent's reading taken in the same window (D-004's pairing), and the landing commit records both. A breach whose reading stays close to its parent's (the tier running the same tests, the gap a few seconds, as D-004's pairs ran within 9 s) is load and does not hold the landing; a reading well above its parent's, or a tier that grew, is charged to the change as before, and every test must still pass. WI-931's landing is the first: the staged squash read 60.5 s (over by 0.5 s) beside its parent's 58.7 s, the two runs concurrent at below-normal priority, both 2623 passed and 2 skipped, against a quiet 46.7 s for the same tier at WI-928's landing. This replaces D-004's clause that landings wait for a quiet reading the owner gives, and coordinator-2026-10-16 D-012's landing clause; the below-normal priority stays. Changing the budget step itself (the owner's 'the bar needs to be relaxed') is not built or filed here: the coordinator asks the owner whether a row should make the step judge load."
alternative = "Hold WI-931's landing for a quiet reading the owner gives, as D-004 and D-012 had it."
reversal_cost = "None: the readings are recorded with each landing, and a quiet re-measure can follow."
why_not_escalated = "It was the owner's ruling."
review = ""


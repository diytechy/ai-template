alternative = "Keep a second copy of the test-file rule in red_mark.py, or file a preparatory row for the move."
reversal_cost = "Low: a byte-for-byte move back."
why_not_escalated = "One module outside the named surface read the rule, and a copy would breach PROCESS.md section 3's consolidate-don't-duplicate rule; the reviewers judge it in round 2."

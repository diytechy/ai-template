[decision.D-003]
decided = "Headless leg 38 continued the lane after leg 37's machine crash. The lane was rebased onto trunk f24a68ca2 (WI-1002's landing) with the crashed builder's uncommitted partial C3+C4 build stashed around the rebase (a patch copy kept in the leg's scratch root); the reservation commit dropped as already upstream, since the landing's carrier fold had written the lane's reserved ids into trunk's watermark. A fresh kit-builder read the partial build against the plan's P3 to P7, kept it whole (with the C2 marks on, 75 cases read as strict unexpected passes and 8 characterizations passed, so the code was complete), added LLR-368 tags on refresh, attest and _AttestPlan, removed the 42 marks and the stand-in, re-stamped integrate.py down (1801 to 1793), wrote the RESYNC entry at the new base, and built C4 on disjoint files. Fixture census (decision 9 and D17): every [bars] declarer carries red_mark (conftest declare_review_bar and its callers, the BARS_RED_MARK and RED_MARK constants, test_integrate_station ATTEST_STACK_INI, test_integrate_attest's refusal table); the [product]-only declarations that reach the refresh gain BARS_RED_MARK (test_integrate_station STATION_STACK_INI and the station_repo users, test_id_landing _trunk, test_loop_provenance _station_repo, test_dispatch stub_harness_repo and census_repo, WI-1002's parked_beside_ready_repo inheriting it); the template-copying fixtures inherit it; test_red_mark_lane's lane-without-the-key case omits it on purpose. No red-mark test skips on this machine, so no skip disposition is owed. C3 and C4 commit as two attests, as the plan orders. The lane's round count starts at zero at its first review."
alternative = "Discard the partial build and rebuild C3 from the plan."
reversal_cost = "Low while uncommitted; the review rounds judge the result either way."
why_not_escalated = "The handoff's direction (keep the work, discard only on a recorded finding) and the plan's commit table."
review = ""


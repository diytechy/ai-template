[decision.D-001]
decided = "The tests-first work leg 36's builder left uncommitted at the usage limit is kept and committed as the build's first deliverable, after a fresh builder read it against the plan and TC-421 to TC-426. The 8 tests that passed under `--runxfail` before any code are all unmarked characterizations in `tests/test_red_mark_lane.py`, each with its adequacy witness: the added mark the set names, the removal over the same set, the deleted marked file, the lane without the key refreshing on the merged key, the unmarked tree refreshing as today (landing and no-bar), the plain-commit removal over a matching record, and the trunk file merged in. Each pins an outcome `attest` or the refresh already gives and the new check must keep. One witness was wrong (the merged trunk file reads 0 to 0, so a count-judging check passes it) and now names the check it does catch, one judging set membership instead of the count. No marked test passes; under `--runxfail` all 76 marked tests fail at an AssertionError. No test is skipped on this machine, so no skip disposition is owed. The tests commit fills TC-421 to TC-426's Evidence cells from the tags."
alternative = "Discard the work and rebuild the tests stage."
reversal_cost = "Low: test files and evidence cells under review."
why_not_escalated = "The handoff's instruction (keep the work, settle the passes, record them) and the skill's evidence classes."

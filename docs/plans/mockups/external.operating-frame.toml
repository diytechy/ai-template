# MOCKUP — NOT A LIVE REGISTRY. Nothing reads this file except
# render_depth0_mock.py beside it.
#
# The depth-0 view as the assumption-tier plan
# (docs/plans/2026-09-20-validation-gap-and-the-assumption-tier.md, after review
# round 3) would leave it once the sitting applies it. The live, LOCKED frame is
# docs/requirements/external.toml, and it is unchanged. Ids above the live
# watermark (EXT-006, B-09, B-10, IF-180) are PROPOSED ids, minted here only so
# the mockup can draw them; the sitting mints the real ones.
#
# One file stands in for three proposed homes:
#   external.toml          [entity] [boundary] [relationship]
#   assumptions.toml       [assumption] [rig]            (a new registry, §10.1)
#   stakeholder-needs.toml [stakeholder] and each need's stakeholder_refs
# plus proposed cells on live rows the mockup cannot edit:
#   [sr_da_refs] [sr_coincident] [sr_repoint]   SR cells (§6.2, §5.1)
#   [need_stakeholder_refs]                      SN cells (§6.2)
#   [retie] [if_bridged_by] [if_coincident]      IF cells (extension, §9)

# --- external.toml: parties (frame comes from their bundles, §5.1) -----------------

[entity.EXT-006]
name = "Human operator"
class = "operational"
description = """The person: writes through the session, holds approval authority, and reads the spine and the views generated from it. Split out of EXT-001 (Q1)."""
status = "Proposed"

[entity.EXT-001]
name = "Development session"
class = "operational"
mediates = "EXT-006"
description = """The computer, narrowed: shell, editor, OS, git client, Python, test runner and the working copy — the operating environment. It carries the human's writes and shows the human its verdicts (mediates)."""
status = "Approved"

[entity.EXT-005]
name = "Model provider API(s) / CLI(s)"
class = "interoperating"
description = """The model services and runners, primary and reviewer alike. Invoked by the kit's own loop, so REL-003 becomes a bundle (§5.2)."""
status = "Approved"

[entity.EXT-002]
name = "Template"
class = "deliverable"
description = """The delivered package, emitted at B-05. From an adopter's frame, their enabling system."""
status = "Approved"

# --- external.toml: bundles, each declaring its system-of-interest -------------------

[boundary.B-02]
entity = "EXT-006"
direction = "in"
system = "kit"
carries = """Authority: rulings, attestations and Status flips. No IF of its own; its proxy arrives as a commit through IF-134."""
status = "Approved"

[boundary.B-09]
entity = "EXT-006"
direction = "out"
system = "kit"
carries = """Read: the spine and the views generated from it (dashboard, open items, status, gate reports). 13u's B-03 content, returned."""
status = "Proposed"

[boundary.B-01]
entity = "EXT-001"
direction = "in"
system = "kit"
carries = """Governed writes: edits admitted only through the git hook floor."""
status = "Approved"

[boundary.B-04]
entity = "EXT-001"
direction = "out"
system = "kit"
carries = """Guardrail verdicts: hook-floor accept/reject and subagent_gate allow/deny."""
status = "Approved"

[boundary.B-10]
entity = "EXT-005"
direction = "inout"
system = "kit"
carries = """The loop invoking a model runner: prompt and brief out on stdin; output, exit code and commits back."""
status = "Proposed"

[boundary.B-05]
entity = "EXT-002"
direction = "out"
system = "delivery"
carries = """THE TEMPLATE: the packaged deliverable, emitted by the delivery system."""
status = "Approved"

[relationship.REL-002]
from = "EXT-002"
to = "EXT-001"
kind = "hands-off"
flow = """Transition: the Template installed into an operating environment — the only lifecycle hand-off between the frames. Absorbs REL-001."""
status = "Approved"

# --- assumptions.toml: rigs -----------------------------------------------------------

[rig.RIG-01]
name = "Scripted model runner"
emulates = "EXT-005"
description = """FAKE_AGENT (tests/test_agent_loop.py): answers the runner contract (IF-041) from a script. Reproduces protocol, not judgment."""
status = "Drafted"

[rig.RIG-02]
name = "Scaffold rig"
emulates = "EXT-001"
description = """The scaffold fixture (tests/conftest.py): a fresh operating environment in a temp dir, driven the way a downstream user would."""
status = "Drafted"

[rig.RIG-03]
name = "Render critic"
emulates = "EXT-006"
description = """render-dashboard-critique plus a vision model: judges the rendered views against a rubric, standing in for the human reader."""
status = "Drafted"

# --- assumptions.toml: assumptions ---------------------------------------------------

[assumption.DA-001]
effect_at = ["B-09"]
assumption = """A spine the strict check passes with zero orphans is one a reviewer can rely on: each row says something, and the links are the ones a reviewer would draw."""
holds_when = """Rows are authored under the spine-authoring question list; the reviewer reads the generated views, not raw TOML."""
obstacle = """Every row resolves and every row says nothing: an orphan-free, semantically vacuous spine."""
falsifier = """A sampled reviewer, reading the views cold, finds a traced row that says nothing the reviewer would rely on."""
status = "Drafted"
standing = "active"

[assumption.DA-002]
effect_at = ["B-01", "B-09"]
assumption = """A scaffold whose harness runs green is one an adopting team can actually work in."""
holds_when = """The team's stack is one of the shipped profiles, and the team reads ADOPTING.md before first use."""
obstacle = """A team green-scaffolds, never fills a registry, and operates a spine that resolves and says nothing."""
falsifier = """A first-time team, given a shipped profile, fails to reach a first filled registry without reading the kit's source."""
status = "Drafted"
standing = "active"

[assumption.DA-003]
effect_at = ["B-02"]
assumption = """A changed Status cell on a human-held rung means a human actually exercised the judgment that Status asserts."""
holds_when = """The row's rung is at or below the human_approval_through dial."""
obstacle = """A Status change on a human-held rung arrives in a commit the unattended loop authored."""
falsifier = """A commit carrying the loop's provenance trailer that changes a Status cell on a human-held rung."""
status = "Drafted"
standing = "active"

[assumption.DA-004]
effect_at = ["B-01"]
assumption = """A write the local hook floor admitted was checked: the floor was not bypassed, or a re-run of the same bar agrees."""
holds_when = """Commits are not made with --no-verify, or a re-run of the bar away from the session is in place."""
obstacle = """git commit --no-verify admits an unchecked write, and nothing re-runs the bar."""
falsifier = """A merged commit whose re-run bar is red while its local hooks reported green."""
status = "Drafted"
standing = "active"

[assumption.DA-005]
effect_at = ["B-09"]
assumption = """The model runner follows the runner contract — prompt on stdin, the documented exit codes, commits in the expected form — so the work the owner sees is the work the loop asked for."""
holds_when = """A runner and model listed in docs/agents.toml, at the pinned CLI version."""
obstacle = """A provider CLI update changes exit-code or commit behaviour; every loop requirement citing this assumption loses its premise at once."""
falsifier = """A routed session whose exit code or commit shape falls outside the documented contract."""
status = "Drafted"
standing = "active"

[assumption.DA-006]
effect_at = ["B-10"]
realized_by = "RIG-01"
assumption = """The scripted runner reproduces argv/stdin, exit codes and commit effects of a real runner; it reproduces no judgment, so nothing about prompt quality is evidenced by it."""
holds_when = """Loop tests that assert protocol behaviour, not model output."""
obstacle = """A real runner behaviour the script does not model (partial writes, streaming, timeouts) that the loop depends on."""
falsifier = """A loop defect seen with a real runner that the scripted runner cannot reproduce."""
status = "Drafted"
standing = "active"

[assumption.DA-007]
effect_at = ["B-01", "B-04"]
realized_by = "RIG-02"
assumption = """A synthetic scaffold in a temp dir behaves like a fresh adopter repository for the checks the suite runs."""
holds_when = """The same shipped profile, a clean Python 3.11+, git on PATH."""
obstacle = """An adopter environment property the temp dir lacks (existing hooks, CRLF settings, a monorepo layout)."""
falsifier = """An adopter-reported scaffold failure the suite's scaffold fixture passes."""
status = "Drafted"
standing = "active"

[assumption.DA-008]
effect_at = ["B-09"]
realized_by = "RIG-03"
assumption = """A vision model judging the rendered dashboard against the rubric reaches the verdict a human reviewer would."""
holds_when = """An image-capable model; the rubric carries its accumulated anchors; a static render at a declared width and theme."""
obstacle = """A model revision shifts judgment silently; or the rubric overfits to anchors accumulated under one model's eye."""
falsifier = """A periodic human Attest sample that disagrees with the critic's verdict."""
status = "Drafted"
standing = "active"


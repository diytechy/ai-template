notes ="""The spine and everything that decides whether it holds: spine_carrier, trace, trace_text, spine_rules, check_trajectory, plan_coverage, migrate_carrier, wi_convert, gen_arch_map. Ten modules of the shared helper package kitlib are owned here: config.py, git.py, registry.py and __init__.py via LLR-181, ladder.py via LLR-184, stage.py via LLR-185, evidence.py via LLR-192, spine.py via LLR-197, secret_classes.py via LLR-205 and observation.py via LLR-234 - the closest-fit reason is registry.py's bulk within LLR-181's module set. Eight of the ten are consumed across components by design and are declared on the shared-kernel surface (docs/kernel-modules-allow): the package root, config, git, registry, ladder, stage, evidence and spine. An import into them is not a seam, so the extra tags other design rows give config.py, git.py, registry.py and spine.py change nothing for those edges. The other two have consumers a row can name, and their cross-component edges are covered as interface rows: IF-314 for secret_classes.py (check_privacy, agent_common), IF-214 for observation.py's records (rejudge) and IF-315 for its atomic write (coordinator_guard, kitlib/guard_hooks). kitlib/station.py (LLR-182, CMP-008) and kitlib/verdict.py (LLR-207, CMP-008, and CMP-006 through LLR-278) stay off the kernel surface, so every edge into them is checked. Their cross-component edges are covered as interface rows: IF-093 for the dashboard's edge into the station, IF-175 for the rollup generator's edge into the verdict record. Their other uncovered edges - integrate and kitlib/verdict into the station; agent_brief, plan_gate, session_keep, kitlib/sitting and kitlib/expected_failure into the verdict record - share a component with the destination while an endpoint carries several tags, so the check reports them as multi-membership advisories, not findings. gen_arch_map also carries a CMP-009 tag through LLR-080, the one LLR row whose modules straddle this cut; every import edge into or out of it is covered by an interface row or lands on the kernel surface, so no seam is suppressed."""


boundary_refs = ["B-02", "B-05"]
hat_refs = ["CONSISTENCY", "SECURITY"]
requirement = "The kit shall express human approval authority as a cumulative level naming the highest spine tier a human still approves, compared against a separately derived SPINE STAGE via a declared, auditable rung ordering — every unreadable or out-of-range input resolving toward MORE human involvement."
rationale = """The retired three-value enum could not express "TCs are human-held but LLRs are not", and four tables each re-interpreted the same word with its own fail-safe direction. The failure that matters is a machine approving something a human meant to hold, so every degrade has to point the same way — including the ones that look like kindness: clamping an out-of-range level toward 0 reads as "nothing is human-held" and disarms every hold in the repo. The crossing attribution: B-02 is unarguable - the approval level IS the authority input, and every fail-safe clause here describes how that input is read when it is broken. B-05 earns its place on a test, not on the fact that everything here is delivered content: the acceptance clause "Level N holds exactly the tiers the SHIPPED TEMPLATE documents" is a claim about the package's own contents agreeing with its behaviour, which is falsifiable against the package alone with no authority act performed - the same package-wide property class SR-031 occupies. The objection this had to survive is the measured one: B-05 already carries about four fifths of the layer's references, so adding a row to it needs an observable that is genuinely AT the package, not a default. This row has one. That the imbalance itself may be wrong is a separate question about the frame rather than about this row, and it is recorded where such questions belong."""

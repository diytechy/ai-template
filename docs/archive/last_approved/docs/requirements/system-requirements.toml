[requirement.SR-234]
title = "Contested or repeated review findings receive a bounded adjudication"
sn_refs = ["SN-006"]
boundary_refs = ["B-09", "B-10"]
hat_refs = ["UNATTENDED-OPS"]
requirement = "Where a review finding is contested by the builder or coordinator, or recurs for a third review round, the delivered adjudication content shall preserve each requested finding, the position held on it and its relevant change scope, and accept only a verdict that rules every requested finding exactly once as a fix, a reasoned dismissal in a declared class, or an escalation to the owner."
rationale = "A DERIVED requirement, and labelled so. SN-006 asks an unattended run to report failures clearly and surface to a human when it cannot proceed, but it does not state who ends a contested or repeated review finding. The unattended-operations lens listens for an unbounded review loop in which the coordinator sends the same finding back to the builder without a bounded, attributable decision. A complete adjudication was chosen so an independent call can settle each requested finding without silently adding, dropping or defaulting one. Fed back to the need: SN-006's acceptance could state that contested review findings receive a bounded ruling; until it does, this row is derived and says so."
acceptance_criteria = "A composed adjudication carries exactly the requested findings, each finding and held position verbatim, change-range facts, and a link to the review scope; malformed findings input refuses composition without a partial sitting. A verdict refuses when a requested finding is unruled or ruled twice, an unrequested finding is ruled, a ruling is outside the declared set, a dismissal lacks its declared reason class, or a ruling lacks its reason. An accepted dispute verdict authorizes no approval act."
priority = "S"
verification = "Test"
status = "Approved"
phase = 6
aspect = "process"

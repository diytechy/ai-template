[requirement.SR-147]
title = "One machine-parseable carrier for the requirement spine"
sn_refs = ["SN-002"]
boundary_refs = ["B-05"]
hat_refs = ["TEST-ENGINEER"]
requirement = """The delivered harness shall hold every spine tier in one machine-parseable representation, reached by a migration proven cell-for-cell over the live registries before the new representation becomes authoritative."""
rationale = "THE ROW STATES ONE OBLIGATION, and the migration history - the two prior carriers and the cutover - is no part of it: normative history and a merged decision have no place at the requirement tier, and a rationale is where that account may live. The two-carrier split has no recorded rationale and costs on both sides. Reading 32 need rows takes ~166 code lines across 14 functions in 8 modules - six bespoke scanners, two of them F5 twins pinned by nothing but a docstring, which have already drifted once and rendered a phantom root in the dashboard - while reading all 436 SR+LLR+TC rows takes csv.DictReader. CSV also cannot represent the cells that actually exist: five hold a literal pipe, 552 hold commas, the longest is 1,553 characters, and an embedded newline has no representation at all. A structured carrier turns three integrity rules into properties of the parse - a duplicate id becomes a decode error, a ref list becomes a typed array (retiring the split-on-whitespace rule that read `and` as an orphan), and an empty cell becomes an absent key, so `unset` and `set to empty` stop being the same value. The converter is the migration's evidence, not its convenience: SR-129's 140-cell lesson is that an unproven representation change is exactly where a registry silently loses cells. ONE ROW because the single-carrier claim and its converter-proof are one contract — the converter is the migration's evidence — and the converter's mechanics already decompose to this row's LLR chain; splitting would separate a claim from the proof that makes it checkable. The single-carrier claim is checkable only because the converter proves it cell-for-cell BEFORE the authority flip — the charter refuses an obligation whose enforcer has never been shown to bite, and a carrier change is precisely where a silent loss hides."
acceptance_criteria = """A migration check over the live registries exits 0 reporting the round-trip clean for every row of every tier; a cell that is dropped, truncated, re-typed or re-ordered is REFUSED with exit 1 and a finding naming the registry, the row id and the field; and the emitted text re-parses under the declared format's standard parser."""
priority = "C"
verification = "Test"
status = "Approved"
phase = 5
coincident = """The need asks that the chain from need to test be mechanically verified, not manually asserted, with the strict check reporting zero orphans and a malformed or duplicate id failing at any stage. Every tier held in one machine-parseable representation is what that check reads, and the representation carries part of the outcome itself: a duplicate id is a decode error of the parse, and a reference list is a typed array, so no prose word is read as a reference; the migration proven cell for cell before the switch means the chain verified is the one the registries held, with nothing silently dropped. The harness delivers both with no party between."""
aspect = "trajectory"

[requirement.SR-148]
title = "Autonomous loop work selection: what it derives from, and in what order"
sn_refs = ["SN-025", "SN-029", "SN-027", "SN-006", "SN-008", "SN-010"]
boundary_refs = ["B-05", "B-09", "B-10"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """The delivered loop content shall select the work an unattended run does next from the repository's tracked registries and git history alone, in this order: ready adjudication rows first, as a stable partition applied at admission rather than by renumbering the ruled rank table; then unresolved handback records; then the earliest incomplete spine tier in SN-to-SR-to-LLR-to-TC order; then implementation work after test-case layout is complete — with the eligible set and its order deterministic, an item whose declared safety, policy or plan-mode inputs are missing, undeclared or contradictory failing closed for that item alone, human holds applied only from the declared approval level, nothing admitted past a human-held stop, no prose surface and no predefined track in the derivation, no hand-curated next-work or run-phase pointer surface shipped for any live instruction or executable surface to read, write, validate, generate or link, and the status surface a session reads generated and freshness-gated rather than hand-copied."""
rationale = """Without one precedence rule, the same repository can resume into implementation while returned obligations or prerequisite requirement tiers remain unresolved. That produces work against stale intent and makes repeated resumes select different next actions. A recorded selection class, source record and hold decision provide replayable evidence of the choice. ONE SR PER (need, property): the loop's work-selection invariant — what the next work derives from, in what order, and that no hand-curated pointer surface participates in it — is stated here and nowhere else, so no second row can drift from it. An explicit three-way partition was rejected: the partition already existed textually and still produced duplicated acceptance. The no-pointer obligation is stated for a migrated repository as well as a fresh scaffold, and the migrated half is the one that matters most: a fresh scaffold never had the files to keep, while an upgraded repository can retain the retired authority files and still pass. Fan-out re-stamp: this row states one decision — what an unattended run's next work derives from and in what order — and its children are the successive stages of that one selection, not separable contracts; the width is the deliberate consolidation of three rows that stated the same invariant into one, so re-splitting to satisfy the bound would restore the duplication the consolidation removed."""
acceptance_criteria = """A ready adjudication row admits ahead of every other class, the ruled rank table unchanged (--explain still reports it) and non-adjudication rows keeping their relative order; an unresolved handback is selected before spine or implementation work, and processing it either resolves the record or mints a provenance-linked successor exactly once; with no unresolved handback, only the earliest incomplete spine tier is eligible; implementation work is ineligible while any required test case remains unlaid; at human_approval_through = 0 no spine tier produces a human hold, each higher level holds exactly its documented cumulative tiers, and a human-held attestation still drains and surfaces with the adjudication row waiting behind the stop; every selection records the chosen class, source identifier and hold decision. Two resumes over the same tracked state select the same eligible set in the same order; an item with missing or contradictory declared inputs is excluded with a stated reason while disjoint classified work stays eligible; no prose surface participates in the derivation; the ordering and exclusion reasons are exposed for replay. A fresh scaffold ships no next-wi/run-phase pointer and is parallel-by-default; no live instruction or executable surface reads, writes, validates, generates or links such a pointer; a build-out lane's phase resolves from its branch name with no pointer file; an upgraded or resynced repository that once carried such a pointer carries neither pointer file after the migration and no live dependency on either survives, so the deletion holds for a migrated repository and not only for a fresh scaffold; the status snapshot regenerates mechanically and its freshness is gated."""
priority = "S"
verification = "Test"
status = "Approved"
phase = 5
da_refs = ["DA-006"]
aspect = "unattended-loop"


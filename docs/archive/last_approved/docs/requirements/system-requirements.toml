[requirement.SR-173]
title = "Shared regeneration is ordered and commits no partial result"
sn_refs = ["SN-008", "SN-010"]
boundary_refs = ["B-01", "B-09"]
hat_refs = ["INTEGRITY-RECOVERABILITY"]
requirement = """The delivered loop content shall regenerate the shared derived artifacts in declared dependency order, stopping at the first failure and committing no partially regenerated set."""
rationale = """THE TRANSACTIONALITY HALF of three obligations that fail independently: ordering and all-or-nothing are one decision about a regeneration run, and they are not the same decision as who is allowed to write (SR-170) or how identity is allocated (SR-174). A regeneration that runs in the right order and still commits half a set satisfies neither, which is what makes them separable. Realizes SN-008 - a first failure that stops loudly beats a half-regenerated set that reads as complete - and SN-010.
THE GUARANTEE IS "COMMITS NO PARTIAL SET" RATHER THAN "LEAVES NONE BEHIND", and the narrower wording is the one the delivered behaviour supports: the regeneration step touches git NOT AT ALL, so on a first failure it exits nonzero having run no later step, with HEAD unmoved and nothing committed - and it DELIBERATELY LEAVES the already-green steps' output dirty in the working tree, because the design assigns the commit to the caller (LLR-142's "never commits; the caller owns the commit"). The residue is not tolerated, it is REQUIRED: TC-170's own evidence test asserts `git status --porcelain` is NON-EMPTY after the failure, so an implementation that cleaned up after itself would fail the test that holds this row. The transactional rollback a reader might otherwise expect exists, but it belongs to the WRAPPING callers (the integrator and intake each reset the branch to its last work commit on failure) and is their obligation, not this row's - which is why stating it here would credit this row with a guarantee a bare invocation does not provide."""
acceptance_criteria = "Regeneration runs the declared artifact families in declared dependency order, with a producer before every consumer that reads it; a failure stops the run at that point and reports it rather than continuing, running no later family; a failed run moves the recorded history not at all and commits no partially regenerated set, while the already-regenerated output stays uncommitted in the working tree for the caller to commit or discard; an absent artifact family is skipped with a stated reason rather than treated as a failure."
priority = "M"
verification = "Test"
status = "Approved"
phase = 4
coincident = """The needs ask for generated views that are never committed half-regenerated; ordered regeneration that stops at the first failure and commits no partial set is that outcome."""

[requirement.SR-174]
title = "Work-item identity is allocated once and never re-issued"
sn_refs = ["SN-025"]
boundary_refs = ["B-01"]
hat_refs = ["INTEGRITY-RECOVERABILITY", "MAINTAINER"]
requirement = """The delivered loop content shall allocate each work-item identity at most once, so that no two concurrent actors receive the same identity and an identity freed by a deletion is never re-issued."""
rationale = """Identity allocation is its own decision, not a consequence of serialization: serializing the writer makes a COLLISION unlikely and does nothing about RE-USE, which is the half that silently re-points every commit message and archived document citing the freed id. The non-reuse clause has a `shall` of its own here rather than living in SR-170's acceptance, which is a cell that cannot mint a requirement. Contributes to SN-025 (the ready frontier ordered deterministically, so two readers of the same registry dispatch the same work) by supplying a work-item identity that names one record for every reader, before and after a deletion."""
acceptance_criteria = "Two actors finishing against the same tree cannot obtain the same work-item identity; an identity freed by deleting its record is not re-issued to new work; allocation counts from the recorded high-water mark rather than from the live maximum."
priority = "M"
verification = "Test"
status = "Approved"
phase = 4
delivered_with = ["SR-148", "SR-170"]

[requirement.SR-175]
title = "Declared inclusion rule for content dispatched to a model provider"
sn_refs = ["SN-026"]
boundary_refs = ["B-10"]
hat_refs = ["DATA-PROTECTION", "LEGAL", "SECURITY"]
requirement = """The delivered loop content shall compose what it dispatches to an external model runner under a DECLARED inclusion rule rather than an implicit one — the content eligible for each dispatched brief, and what is excluded, readable as a declared set — with the basis on which repository content crosses to a declared provider stated as the scope of the consent the enabling surface grants, never presented as a technical bound on what an invoked runner reads."""
rationale = """Repository content is briefed to external model providers, and for an adopter that content's history carries every contributor's name, email and timestamp — personal data crossing with no declared basis or exclusion in any need. SN-026's own text governs WHICH model runs, never WHAT IT IS SHOWN, so this obligation is content beyond the parent's demand — derived from the data-protection lens, with the security and legal lenses converging on the same boundary control (three charters, three reasons, one crossing), rather than from the need's text, which is what makes the derivation reviewable and lets the need owner see it fed back (the alternative, amending SN-026, was deliberately not taken alongside: one rule, one home — option analysis in docs/plans/2026-08-17-wi468-obligation-intake-options.md §1 option (b)). WHAT EXISTS TODAY IS A DISCIPLINE, NOT A DECLARATION: the push channel is measurably narrow — an allowlist-only planning surface, the project log excluded BY NAME in three composers, zero authorship fields formatted into any prompt — but the rule lives as a convention inside the composing functions, unfalsifiable because no requirement stated it; this row converts it into a stated one and the chain below pins the conventions as they exist. NOT YET MECHANIZED, stated rather than implied: the declared-set surface itself (a per-row inclusion/exclusion field on the provider registry, or a policy dial) and the planted-credential dispatch block in the acceptance are not built. THE PULL-CHANNEL LIMIT, the design-control honesty this row must carry: every enabled runner is launched with permission-bypass flags and can read the whole tree itself, so the declared rule can bound what the loop ASSEMBLES and state the scope of what the consent surface CONSENTS to — it cannot technically bound an invoked runner: the loop's invocation crosses the operation frame at B-10, and the runner on its far side (EXT-005) is outside this system's design control, which is what makes it external."""
acceptance_criteria = """The inclusion rule for each brief class the loop dispatches is readable as a declared set naming what is eligible and what is excluded, so a composer can be checked against it rather than against convention; a planted credential inside brief-eligible content blocks dispatch (the security lens's fit criterion, on the same scanner the transcript path already runs); the basis and exclusion for repository content crossing to a declared provider are stated where the provider is declared, and the consent surface's documentation names them as the scope of what enabling consents to; the pull channel is presented as consent-scoped, never as filtered. The conventions this row makes declared are, today, the planning surface's allowlist-only registry read and the composers' by-name exclusions and clipped log reads; the declared-set surface itself is the row's stated build gap."""
priority = "S"
verification = "Test"
status = "Approved"
phase = 5
coincident = """The row promises the declared inclusion rule and the stated scope of consent, and deliberately claims no bound on what an invoked runner reads; the declaration itself is the outcome, so no premise about the runner carries it."""

[requirement.SR-176]
title = "A privacy finding persists by class and location, never by value"
sn_refs = ["SN-009"]
boundary_refs = ["B-01", "B-09"]
hat_refs = ["DATA-PROTECTION"]
requirement = """Any durable record the delivered kit produces of a secrets or privacy finding shall identify the finding by its class and location, never by the matched value."""
rationale = """The finding record is the one artifact guaranteed to contain the personal data it reports, created by the control itself — SN-009 defeating itself, since a scanner that catches a value and then echoes it into a committed artifact has published what it protected. The intake proposal's measurement (docs/plans/2026-08-17-wi468-obligation-intake-options.md §2 option (b)) grounds the row: the scanner mints no record of its own (check_privacy prints location, label and the MATCHED VALUE to stdout and writes nothing), but an unattended run's transcript is committed bookkeeping, so the durable copy of every finding is the session log — and the transcript path redacts credential shapes only. DELIBERATE NARROWING of the charter's ask, recorded here as the deriving decision: C-DPR-2 asks for a retention limit and an access rule, and a kit cannot honestly promise either over an adopter's git history (committed content is effectively forever; access is the host's) — what it CAN promise is that the matched value never reaches durable storage, which moots both. MECHANIZED TODAY for the always-on class: the transcript writer redacts the credential shapes and its summary line names class and count, never the value — pinned by the chain below. NOT YET MECHANIZED, stated rather than implied: the PII/identity classes the privacy gate adds are not in the redaction set, so for an adopter with the gate on a PII finding echoed into a session transcript would persist — closing that, on the same seam, is this row's build debt."""
acceptance_criteria = """A planted value matched by a scanning class appears 0 times in any tracked artifact after the run that caught it; the durable trace of the finding names the class and the location (a count line, a path), never the matched text; the unredacted raw stream stays in untracked scratch space only. The one path by which a finding becomes durable is the transcript's redaction seam, which holds today for the credential classes; the privacy-gate PII/identity classes are the row's stated gap."""
priority = "S"
verification = "Test"
status = "Approved"
phase = 4
coincident = """The need asks for a secret or identity not republished by the kit's own records; a finding recorded by its class and location, and not by the matched value, is that outcome in each record the kit writes."""

[requirement.SR-177]
title = "Fan-out utilisation reported from the run's own telemetry"
sn_refs = ["SN-027"]
boundary_refs = ["B-09"]
hat_refs = ["PERFORMANCE"]
requirement = """The delivered loop content shall report, per run, the utilisation of the fan-out it commissions — the lanes configured, the lanes actually occupied, and the work integrated per unit of wall time — derived from the run's own recorded telemetry, reported and never gated, with no declared improvement target."""
rationale = """The charter refuses a declared budget with no measurement behind it: fan-out is complex machinery justified by a throughput claim, yet configured capacity can be mistaken for actual concurrent use or throughput when no run-level instrument distinguishes them. A numeric improvement target would pin machine, provider and model conditions the kit does not control, so this row makes utilisation observable rather than budgeted. The existing telemetry does not join configured lanes, occupied lanes and integrated work per wall-hour into the per-run aggregation the acceptance requires. Without that aggregation, the telemetry columns alone cannot distinguish configured capacity from run-level utilisation."""
acceptance_criteria = """A completed run's report states the lanes configured, the lanes actually occupied, and the work items integrated per wall-hour, derived from the run's recorded telemetry; the report is informational — no threshold, no exit-code change; a serial run reports its single lane rather than omitting the line, so the configured-versus-occupied gap is always visible. The report aggregates the run's own recorded per-session telemetry; the aggregation itself is the row's stated build gap."""
priority = "C"
verification = "Test"
status = "Approved"
phase = 4
delivered_with = ["SR-156", "SR-170"]

[requirement.SR-180]
title = "A design row is discharged only by a realization symbol that resolves"
sn_refs = ["SN-002", "SN-003"]
boundary_refs = ["B-09"]
hat_refs = ["TEST-ENGINEER"]
requirement = """If none of the realization symbols a design-tier row names resolves within any implementation unit that same row names, then the delivered harness shall report that row as undischarged."""
rationale = """Realizes SN-002 — the chain from need to test is trustworthy because it is mechanically verified rather than manually asserted, and the bottom rung of that chain is the claim a design row makes that the code it names exists. Without this row the spine states a terminating condition for every tier except the one that decides when decomposition is finished: a reader learns from the registries when a need is answered, when a requirement is decomposed and when a test verifies it, and cannot learn from them when a design row is done. The condition that settles it is built and gates, so what the spine lacks is the statement, not the mechanism, and an adopter inherits the gate without inheriting any statement of what it demands.

Realizes SN-003 in the row's altitude, which is the load-bearing half of the wording rather than a stylistic preference. The obligation names no language: a realization symbol, an implementation unit, and a rule that decides whether the one resolves in the other are terms every stack carries, and the resolution rule is read from the declared stack profile exactly as the harness commands are. A row naming one language's file extension would ship one stack's requirement to every adopter — and it would buy nothing, because the association is answerable off the shelf in any stack by a multi-language tag index that asks only whether a name exists in a unit. What has to hold is the association; the form it is recorded in is no part of the obligation, which is what lets the row sit at this altitude honestly.

Two alternatives lost. Per-token exactness — every named token must resolve — asks a harsher question than discharge, and on real registries it reds rows for tokens that were never symbol claims: a local, an attribute, a prose fragment. The anchor validates the coarse claim (the code is real, at a unit that is real, under a name that is really there) and counts the fine misses, so tightening the cell's grammar stays available instead of being hidden behind a green. Folding the obligation into the documentation-drift row also lost: a design row is a specification, not a documentation surface, and an unresolved realization symbol is a completeness verdict rather than drift, so the fold would put two decisions in one row.

Stated so it cannot be read in: nothing here obliges source code to carry a back-link naming the requirement it implements. That is the opposite direction, it rests on weaker evidence than this one, and it is a separate question this row neither states nor implies."""
acceptance_criteria = """A design-tier row naming a realization symbol that resolves in one of the implementation units the same row names is discharged; a row whose named symbols all fail to resolve is reported and gates at the declared release bar; a named symbol that fails to resolve beside a sibling on the same row that resolves is counted and never gates, so tightening the cell stays possible without reopening the gate. The unit cell is read as a union, never as a positional pairing with the symbol cell: a row naming several units is discharged by one symbol resolving in any one of them. A row naming only units the declared stack profile carries no resolution rule for is reported as skipped-with-reason and is not counted as discharged, so a row the harness cannot judge never reads as a pass; an example placeholder row is out of scope, so a freshly generated scaffold is silent here. The resolution rule is read off the declared stack profile rather than restated in this row; for the current profile it is a name bound at module scope, or defined at class scope, in a source module of that profile's language."""
priority = "M"
verification = "Test"
status = "Approved"
phase = 5
coincident = """The needs ask for a chain verified rather than asserted; a design row reported undischarged when none of its named symbols resolves is that verification's verdict."""
aspect = "trajectory"

[requirement.SR-181]
title = "A spine edit that lowers the effective stage surfaces as a phase change"
sn_refs = ["SN-004", "SN-008"]
boundary_refs = ["B-09"]
hat_refs = ["TEST-ENGINEER"]
requirement = """The delivered harness shall require, at authoring time, that any registry edit which drops the derived effective stage carry a Phase tag on every row it added or moved a stage-affecting cell on that is NOT the phase the settled work already stood in — a new (higher) phase, or an already-open lower one — except a decrease landing exactly on the DevStg-LLReqs to DevStg-Arch transition, which is within-phase decomposition rework and carries no such obligation."""
rationale = """Realizes SN-004: an edit that regresses the spine's own derived readiness without opening a new phase is a gate advanced past what the tree actually shows, the false green SN-008 exists to refuse. Ruled in docs/plans/2026-08-21-stage-unification-plan.md §4 and the owner's answer §6.1: phase stays a pure function of the registries (no stored counter, alternative (ii) declined) — the decrease rule is an authoring-time check on the row tags themselves rather than a second phase concept that could drift against them, and `docs/stage` records the derived phase exactly as `docs/gate` did. The one exemption is deliberately narrow: the owner confirmed exactly the one-rung `DevStg-LLReqs -> DevStg-Arch` permutation (the permitted decomposition cycle), not a wider Arch-tier allowance, because a deep decomposition would otherwise run the phase counter up for churn that is not a scope regression. This row corrects a mis-trace: `derive_stage.phase_rule_findings` previously declared `Implements: SR-139`, crediting a requirement about approval authority (which tier a human holds) with a realization edge from a function that states a different obligation entirely (a spine edit's own honesty about scope). The false edge is removed and this row states the obligation the function actually implements, and the function's declaration now points at it."""
acceptance_criteria = """A stage-affecting row edit that drops the effective stage and carries a Phase tag equal to the phase the settled work already stood in is a finding naming the row and the cause; a decrease landing exactly on the DevStg-LLReqs to DevStg-Arch transition is exempt and produces no finding; a frame row (one with no Phase cell to tag) that causes a decrease is reported with the decrease and its cause rather than demanding a cell it cannot carry; the rule degrades silently (reports nothing) when no prior committed state is available to compare against; the check is warn-tier, reported by `derive_stage.py` and not yet wired into any `--strict` exit."""
priority = "S"
verification = "Test"
status = "Approved"
phase = 5
coincident = """The needs ask for a gate that drops honestly; a stage-dropping edit required to carry its phase tag where it is authored is that honesty, enforced by the harness."""
aspect = "process"

[requirement.SR-182]
title = "Duplicated function bodies in the kit's own scripts are measured against a stamped baseline, never gated"
sn_refs = ["SN-007"]
boundary_refs = ["B-09"]
hat_refs = ["CONSISTENCY"]
requirement = """The delivered harness shall report the kit's own duplicated-function-body count against a stamped baseline at a warn-only severity, never gating a bar on it."""
rationale = """Realizes SN-007 (the kit holds itself to its own standard): the consolidation doctrine states the goal in prose, and a number that moves is what proves it is not just prose. Deliberately narrower than an earlier, retired duplication-census step that GATED on an unbounded population where most of its findings registered as accepted idioms — that step was torn down and duplication left unbounded by design, and this row does not revisit that: the response clause's "never gating" is not a style choice, it is the boundary this row states as the obligation itself. One row because the standing measurement and its never-gating posture are one contract: a version of this check that gated would be a different requirement, not a stricter reading of this one."""
acceptance_criteria = """A fresh run reports the current duplicated-function-body group/copy/line counts over the kit's own script tree; when compared against a stamped baseline (the current carrier: `docs/stack.ini` `[dupes-census]`) any count above baseline is reported as a finding naming the delta, any count below baseline is reported as an invitation to re-stamp downward, and an unstamped repo (no baseline yet) reports the bare reading; the check exits 0 in every one of those cases, including under `--strict` — a gating change here is a new requirement, not a tightened acceptance of this one."""
priority = "S"
verification = "Test"
status = "Approved"
phase = 5
coincident = """The need asks for maintainers holding the kit to its own standard; the duplication count reported against its stamped baseline is the measurement that standard reads, and it gates nothing."""
aspect = "process"

[requirement.SR-183]
title = "Per-function complexity is measured against a stamped baseline, and gated only where a repo opts in"
sn_refs = ["SN-007", "SN-012"]
boundary_refs = ["B-09"]
hat_refs = ["CONSISTENCY", "MAINTAINER"]
requirement = """The delivered harness shall report each source function's cognitive complexity against a stamped per-function baseline, failing a declared gate on any divergence from that baseline only where the repo has enabled the gating mode."""
rationale = """Realizes SN-007 (the kit holds itself to its own standard) and SN-012 (a heavy layer costs a repo that does not use it nothing). Cognitive complexity rather than a branch count because the two are not interchangeable: charging an increment per level of NESTING separates a deeply nested function from a flat one with the same number of branches, which is the property a reader pays for and the one a branch count cannot express — a measured population of functions here scores far apart on the two. Standard library rather than a linter because the strictest form of the dependency rule applies to a check an adopter runs: a sensor that forced every adopter to install a tool is a sensor most adopters would disable, and a baseline coupled to a third-party tool's counting rules is a property of that tool's version rather than of the code. The response clause carries BOTH postures in one row because they are one contract read at two settings — the measurement and its baseline are identical either way, and only the exit code differs; a version that could not report would be a different requirement, but a version that can gate is this one enabled."""
acceptance_criteria = """A fresh run over a declared source tree reports every function whose cognitive complexity is strictly OVER the declared threshold (the boundary is exclusive — a function scoring exactly the threshold is under it and is not reported, matching LLR-206 and the baseline's over-threshold rows), with its complexity and its source-line count, and a per-module public-symbol count that is reported and never graded. Compared against a stamped baseline (the current carrier: `docs/complexity-baseline`, one tab-separated row per over-threshold function with the reason for its entry) a function above its entry, and a function whose entry no longer exists, are each reported as a finding naming the delta; a function BELOW its entry is reported as an invitation to re-stamp downward; an unstamped repo reports the bare census. In reporting mode every one of those cases exits zero; in gating mode a divergence in either direction exits nonzero and the message names the three sanctioned remedies. A re-stamp mode rewrites the baseline from the current census and writes nothing else. No per-site suppression is honoured from the source tree."""
priority = "S"
verification = "Test"
status = "Approved"
phase = 5
coincident = """The needs ask for maintainers holding the kit to its own standard while small changes stay cheap; each function's complexity reported against its baseline, and gated only where a repository opts in, is that outcome."""
aspect = "process"


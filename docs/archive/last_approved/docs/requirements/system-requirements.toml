[requirement.SR-225]
title = "A delegated run closes with a record of the calls it made, where the declared dial asks for one"
sn_refs = ["SN-029"]
boundary_refs = ["B-09", "B-10"]
hat_refs = ["UNATTENDED-OPS"]
requirement = "The delivered loop content shall keep the owner's verdict on each delegated decision coupled to the work that acts on it and each delegated run to its record: whatever the declared decision-recording dial, reporting without refusing a record entry that omits a required disclosure field or leaves one blank, listing each entry the owner has not yet seen and each overruled entry with the open work that carries it, and refusing an overrule unless its transition change files or amends open work that cites the entry; and, where that dial asks for a record, refusing to integrate a closing lane whose record is absent, naming where it belongs."
rationale = "A DERIVED requirement, and labelled so. SN-029 asks that a run released to automation get as far as it honestly can, and that an approval it makes on a released tier leave a record naming who made it; it does not name the other calls a delegated run makes on the owner's behalf, the ones too settled to hold the run for and not settled enough to be history, so this obligation arrives through the unattended-operations lens rather than through the need's text. A call nobody is told about is the failure that lens listens for: it pages nobody, and a run that looks green is green partly because nothing looked at what it chose. Required fields and a close refusal make that record durable rather than an instruction that can be omitted. The obligation is keyed to a dial because how much of the owner's reading a run may claim is the owner's to set; it ships off, so a repository owes nothing until its owner asks. Every close owes the record, a partial close included, because every delegated run closes with one; a lane the machinery closed with no session present is refused too, and that refusal is a hold for a person to write the record rather than a strand. A malformed entry is reported rather than refused, because the record is there and readable and a refusal would hold finished work for a reporting defect. A decision is an already selected direction, so the owner either confirms it or overrules it; approval would falsely imply a new selection. A closed verdict makes that answer visible without inferring it from a free-text note, and an unknown value is shown rather than allowed to hide a call. An overrule that is not coupled to changed open work leaves the selected direction and its execution apart; coupling them in the transition change keeps both readable without a history walk or a marker convention. Who sets the verdict remains a convention, because the record cannot confer authority on its writer. A value of the dial outside its alphabet is judged before the record is read, since the reader keeps the obligation for such a value and would otherwise report a missing record in place of the real fault. The record is never a route for work: a call that is the owner's to make, or an act that cannot be undone, still reaches the owner through the process's exits, at every dial setting. Fed back to the need: SN-029's acceptance could name a record of the delegated calls a run made beside the record of its approvals; until it does, this row is derived and says so."
acceptance_criteria = "With the dial off or undeclared, a closing lane owes no newly written delegated-run record and the close does not read one to decide whether that record is owed; with the dial at record or escalate-first, a lane whose work closed complete, cancelled or partial without its record at its run's path is refused, the refusal naming that path, and one carrying its record passes this check. Whatever the dial, in a present record an entry that is not a table, an entry lacking what was decided, the alternative passed over, the reversal cost, why it was not escalated or the review cell, or carrying one that is not text, or leaving one of the first four blank, a hoist that is absent or not a list of entry ids, and a hoist naming an entry the record lacks, are each reported naming the entry and none refuses; an optional owner value is confirmed or overruled, absent means not yet seen, and any other value or a retired reviewed key is reported and reads as not yet seen whatever owner value accompanies it; an overruled entry with a blank review note is reported; the owner's surface lists unseen entries with hoisted entries first and, under its own heading, overruled entries with every citing work item or the notice that none cites it, and states the confirmed count when no unseen entry is left; an entry numbered -000 is never judged or listed. The records under docs/decisions have their retired reviewed keys migrated to the owner vocabulary without altering string contents, preserving an unknown retired value for a person to resolve and refusing a rewrite whose result would change more than verdict keys. Whatever the dial, a commit whose resulting tree carries a touched decisions record that does not parse is refused at staged and merge admission, naming the record and parse error; a commit that newly overrules an entry is likewise refused unless the same diff adds or changes a queued or active work specification whose new text cites docs/decisions/<run>.toml#D-NNN, while an untouched or archived specification and a token with following digits do not satisfy it. A value of the dial outside its three, compared trimmed and case-folded, is refused where the policy file is checked, and at the close it is refused as configuration before the record is read; a session handed a lane to build or to adjudicate under a recording dial is told the path its record belongs at, the owner vocabulary and that it leaves owner unset, and a review session is not."
priority = "S"
verification = "Test"
status = "Approved"
phase = 6
delivered_with = ["SR-139", "SR-140"]

[requirement.SR-226]
title = "A retired spine row leaves one record of its own, found by its id"
sn_refs = ["SN-010"]
boundary_refs = ["B-01", "B-09"]
hat_refs = ["MAINTAINER"]
requirement = "When a spine row is retired, the delivered harness shall leave one record found by the retired id, written in the same change that deletes the row, naming the id, the date, the successor if any and the reason, and kept in view by two reports that warn without failing, one naming any record changed after it landed and one naming any spent id retired since the record began that has no record."
rationale = """A DERIVED requirement, and labelled so. SN-010 asks that a reader can navigate the documentation and trust it, with references that resolve; it does not name what a reader finds when a reference names a row that no longer exists, so this obligation arrives through the maintainer lens rather than through the need's text. Retiring a row deletes it, so the registries state only what is, and ids are never reused, so a reference to a spent id stays unambiguous; but a reader who meets one in a commit message, a log entry or an archived document learns neither why it went nor what replaced it. The id watermark holds only high-water marks, a shallow or squashed history holds nothing, and a forwarding map written into the activity log is prose no tool can read, so the reason lives only in the session that retired the row: the failure that lens listens for. One small record per id, written with the deletion, answers that lookup and nothing else; it is for looking up the id in hand, not for browsing the set. A file per id rather than a registry keeps the lookup a path instead of a search, and keeps the write conflict-free across parallel branches, since no two branches retire one id. The record does not carry the commit that deleted the row, because a commit cannot contain its own hash; history supplies it wherever history exists, and a reader without it is told the commit is unknown rather than given a wrong one. Both reports warn rather than fail: a missing or edited record loses a reason, it does not make the spine false, and a check that fails on history nobody can now rewrite gets switched off. Ids retired before the record began are declared once, as a list, rather than given invented records. Fed back to the need: SN-010's acceptance could name a spent id as a reference that must resolve; until it does, this row is derived and says so."""
acceptance_criteria = "Retiring a live row removes that row, and only that row, from its registry and writes its record naming the id, the date, the successor when one is given and the reason, both as working-tree changes for one commit; a retirement naming a row that is not live, a successor that is not live or is the row itself, no reason, a malformed date, or an id that already has a record is refused with nothing written; the record survives the step that folds session records into the activity log; a record whose text differs from its text as it landed, or that was removed after it landed, is reported naming it; a spent id with neither a record nor a place among the ids declared as retired before the record began is reported naming it, while a live id, a recorded id, a declared id and an id above its space's mark are not; neither report fails a check; and the commit that deleted a row is read from history when the record is shown, reading unknown where history cannot answer."
priority = "S"
verification = "Test"
status = "Approved"
phase = 6

[requirement.SR-222]
title = "Every model session is recorded in one usage record, whichever provider CLI serves it"
sn_refs = ["SN-026"]
boundary_refs = ["B-10"]
hat_refs = ["PERFORMANCE", "CONSISTENCY"]
requirement = "The delivered loop content shall record every model session it launches, whichever provider command-line runner serves it, in one usage record: token usage under a published usage vocabulary pinned to a named revision, input counted inclusive of cached input, fresh input derived by one formula, the runner's raw usage kept verbatim, the route's provider filled from its roster row for every routed call, the runner named, the vocabulary's gen_ai.provider.name holding the runner's default provider for claude and codex and empty for any other runner, with runner reconfiguration to another provider not detected, and the context occupancy of the session's latest request kept apart from its billed tokens; for a runner other than claude, codex and opencode, the runner name is left empty, and so is every count or raw usage the loop cannot read from the runner's output."
rationale = """A DERIVED requirement, and labelled so. SN-026 asks that the owner can configure several model families and route work among them per job and capability level; it does not name a usage record, so this obligation arrives through two lenses rather than through the need's text. The performance lens listens for measurements that cannot be compared, or are unavailable, being read as a reliable total: routing among families is a cost and quality choice, and the choice is blind when one family's calls record their usage and another's do not, or when the runners disagree on what "input tokens" means (two count cached input apart from input, one counts it inside), so one column would hold two incompatible numbers. The consistency lens listens for readers disagreeing after a one-sided change: when each launching role keeps its own launch and logging path, a usage fix lands in one path and not the others. A published vocabulary avoids inventing a log format for a problem that is not novel; because it has no tagged release, the record pins the exact revision it follows. The raw usage is kept verbatim so a mapping later found wrong is re-derived rather than lost. Occupancy is kept apart from billed tokens because they answer different questions: billed tokens are summed over every request the session made, while how full a context is depends on the latest request alone, and a session reset that read the first as the second would fire on sessions that are nowhere near full. A runner whose output the loop does not read is still recorded, with what it cannot read left empty rather than guessed, so the record shows which calls carry no usage instead of reporting them as zero. Fed back to the need: SN-026's acceptance could name comparable per-family usage as what makes routing among families an informed choice; until it does, this row is derived and says so."""
acceptance_criteria = "For a recorded session of the claude, codex and opencode runners, the record carries the vocabulary's usage names and the revision they are pinned to; its input count includes cached input; its fresh input equals input less cache read and cache write; its raw usage reproduces the runner's usage events exactly; a count the runner does not report is empty, not zero; the route's provider column is filled from its roster row, the runner column is filled, and gen_ai.provider.name is anthropic for claude and openai for codex, also when that runner is reconfigured to another provider, and empty for opencode; a successful call's usage survives in the record even where the runner's result text is read from a separate file; and occupancy is the latest request's prompt over the model's window, blank where the runner reports no window, so no session reports occupancy above 100% because counts accumulated across its requests; and a session of any other runner, a stand-in included, carries the same columns, with its runner and its gen_ai.provider.name empty, and every count or raw usage the loop cannot read from the runner's output empty."
priority = "S"
verification = "Test"
status = "Approved"
phase = 6
da_refs = ["DA-016"]

[requirement.SR-227]
title = "Where the retention dial is on, adjudication routes retain sessions and reset them only when safe"
sn_refs = ["SN-025"]
boundary_refs = ["B-10"]
hat_refs = ["PERFORMANCE", "UNATTENDED-OPS", "INTEGRITY-RECOVERABILITY"]
requirement = "Where the declared adjudicator retention dial is above zero, the delivered adjudication content shall manage each retained-class adjudication consistently whether the coordinator or loop starts it: resume the route's active, unheld session in its model runner's resume form; mint and record a session id where the route has no active session; wait a bounded time where its active session is held, then run unretained and state why; record each call like any other; drain the session when its latest request's occupancy reaches the dial or the inputs it judges under change; retire it only when no work it has a stake in is pending; retire it at once when a call fails except that an authentication failure records the failed call and leaves its session record unchanged; let no two calls use one retained session at once; write the retention state only whole, by one writer at a time; make any keep-warm call one bounded turn that never blocks the scheduler; compose both routes' retention request once; and, before retaining a family that uses a dedicated CLI home, read any long-lived credential at each launch from the location a declared environment setting names, keep every verbatim occurrence out of logs, records and commits, and refuse an absent or unreadable credential before launch, naming setup without interactive sign-in or fallback; and, where no long-lived credential applies, refuse either retained route when a dedicated-home reading is other than signed in before any launch, home creation, lease or retention-state write, naming the setup action without signing in automatically or falling back to a fresh session or another home."
rationale = """A DERIVED requirement, and labelled so. SN-025 asks that a configured agent implement toward the vision with no human curating what comes next; it does not name retaining a session, so this obligation arrives through three lenses rather than through the need's text. The performance lens listens for an operating-cost risk left unassessed: a run that spins a fresh adjudicator for every small work item reloads the spine on each call, and the usage record makes that cost visible, while resuming a session by id uses the provider's prompt cache. The unattended-operations lens listens for a silent degrade: a retained session that has filled, judges under changed rules, or is started in a home whose sign-in cannot be read degrades every later judgement with nothing paging anyone; a coordinator route that bypasses the retained operation repeats that cost and loses the state the loop preserves. One composition keeps both routes under the same drain and lease rules. The integrity lens listens for a durable artifact updated in place without an all-or-nothing guarantee and for a claim nothing can reclaim: two calls resuming one transcript at once corrupt it, so one call at a time holds a session, under a hold that expires when its holder is gone. Refusing an unreadable or absent sign-in before that hold prevents a failed retained launch from changing state or escaping into a person's default home. Retiring only when no work the session has a stake in is pending keeps a review, rework and re-review round trip in one session; a session is retained as a transcript a bounded process replays, never as a long-lived process, so an unattended run still cannot wait on a prompt. The dial is keyed off because turning it on is the owner's decision once the layer has been verified where it runs. Fed back to the need: SN-025's acceptance could name bounded operating cost per judgement as part of what lets a run proceed with no human curating it; until it does, this row is derived and says so."""
acceptance_criteria = "With the dial at zero, an adjudication launches exactly as a fresh session: no session id minted, no resume argument, no retention state written, no keep-warm call made and no sign-in probe. With the dial on, an adjudication of a retained class resumes the route's retained session by its id in the runner's own resume form, or starts one whose id is recorded; a second coordinator-route adjudication resumes the session recorded by its first call; both routes form the same retention request; an adjudication meeting a held session waits a bounded time and then runs unretained, stating why; a session whose latest request's occupancy reaches the dial, whose governing inputs changed, or whose runner version changed is marked draining and is still resumed while a queued adjudication, or a lane out on work, belongs to a chain it judged, and is retired at the first launch where none does; a call that exits non-zero, times out, reports an error or fails to launch retires the session at once except an authentication failure, which records the failed call and releases only its lease; a keep-warm call is one bounded turn, recorded like any other call, never blocks the scheduler, and never runs while another call holds the session; the retention state is only ever written whole, by one writer at a time; and a long-lived credential is read at each retained launch from the location a declared environment setting names, has every verbatim occurrence absent from its argv, logs, records and commits, while escaped, encoded and line-split representations are outside that guarantee; an absent or unreadable credential refuses either retained route before any launch, home creation, lease or retention state write, naming setup; a keep-warm ping with an unavailable credential skips and releases its lease; and, where no long-lived credential applies, a dedicated-home reading other than signed in refuses either retained route before any launch, home creation, lease or retention-state write, names the setup action, and neither signs in automatically nor falls back to a fresh session or another home."
priority = "S"
verification = "Test"
status = "Approved"
phase = 6
da_refs = ["DA-017"]

[requirement.SR-231]
title = "Coordinator adjudication enters from a claimed lane and accepts only its current verdict"
sn_refs = ["SN-025"]
boundary_refs = ["B-10"]
hat_refs = ["UNATTENDED-OPS", "INTEGRITY-RECOVERABILITY"]
requirement = "The delivered coordinator adjudication entry point shall, regardless of the declared adjudicator retention dial, run only from a claimed lane worktree and read success only from a verdict that its own call wrote within that call's deadline."
rationale = "A DERIVED requirement, and labelled so. SN-025 asks that a configured agent progress without a human curating what comes next; it does not state the entry boundary for an adjudication the coordinator starts, so this obligation arrives through two lenses. The unattended-operations lens listens for a run whose telemetry lands on trunk instead of the claimed work it judges, leaving a later reader unable to recover its work item context. The integrity lens listens for stale evidence being accepted as this call's success: a verdict left by an earlier or overdue call can make an unsuccessful current call look valid. A lane-local call that owns a fresh verdict reservation was chosen over trusting a caller-supplied path or a shared trunk record, because both leave the evidence's author and time ambiguous. Fed back to the need: SN-025's acceptance could name attributable, current adjudication evidence as part of unattended progress; until it does, this row is derived and says so."
acceptance_criteria = "At every retention-dial value, a coordinator adjudication from the primary checkout, an unclaimed worktree or outside a repository refuses before launch; a valid claimed lane exclusively reserves a new verdict path and only one concurrent call can claim it; a successful call returns success only for a valid verdict it wrote before its deadline; and a failed, timed-out, missing or invalid verdict never returns success."
priority = "S"
verification = "Test"
status = "Approved"
phase = 6
form = "interface"

[requirement.SR-228]
title = "Held-rung CLARITY re-attestation"
sn_refs = ["SN-029"]
boundary_refs = ["B-02"]
hat_refs = ["SECURITY"]
requirement = "Where the declared approval level holds a tier for a human, the delivered loop shall permit an independent adjudication to re-attest an approved amended row only when its verdict rules that amendment CLARITY."
rationale = "SN-029 delegates review on released tiers without skipping it, but an approved row whose wording is clarified on a held tier remains anchored to a signature the owner already gave. Treating that unchanged meaning as a new approval would strand every clarification with the owner; treating a meaning change the same way would carry a signature onto text the owner did not read. The verdict boundary keeps those alternatives separate: only the independent judgement that the signature still describes the row permits re-attestation, while a meaning change remains the owner's decision."

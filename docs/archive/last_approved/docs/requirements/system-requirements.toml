hat_refs = ["INTEGRITY-RECOVERABILITY", "UNATTENDED-OPS"]
requirement = "Where one lane checkpoint requests several declared adjudication kinds, the delivered adjudication content shall present and validate one sitting that preserves each kind's own scope, evidence and decision grammar."
rationale = "A DERIVED requirement, and labelled so. SN-025 asks for unattended progress but does not require one sitting to carry several judgements. The unattended-operations lens catches a green checkpoint where a requested kind was never judged; the integrity-recoverability lens catches a partial write where one kind acts while another section refuses.  A composed sitting was chosen so each judgement remains independently checkable while sharing its checkpoint. Fed back to the need: SN-025's acceptance could name bounded, attributable checkpoint adjudication; until it does, this row is derived and says so."

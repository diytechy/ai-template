boundary_refs = ["B-09"]
hat_refs = ["CONSISTENCY"]
requirement = "The delivered harness shall derive each system requirement's system of interest from the crossings its boundary references name, reporting a requirement whose crossings belong to both systems."
rationale = """Where a requirement sits follows from the crossings it names, so writing it on the requirement as well would give the fact a second home that can disagree with the first. A requirement naming crossings of both systems states one obligation about two systems of interest, whose halves are verified against different parties; reporting it is how such a row gets split."""
acceptance_criteria = "A requirement whose crossings all belong to one system is placed in that system; one naming crossings of both is reported without failing the check, naming the requirement and a crossing from each system; a crossing that declares no system places nothing, so a requirement is placed by its other crossings; the placement is never recorded on the requirement; a project declaring no frame is vacuous."
priority = "S"
verification = "Test"
status = "Approved"
phase = 6
coincident = """The need asks for a stakeholder seeing which system each promised behaviour belongs to; the system derived from a requirement's crossings, and a requirement spanning both reported, is that outcome."""

[requirement.SR-220]
title = "Overlapping queued work is consolidated through one judgement per queue state"
sn_refs = ["SN-025"]
boundary_refs = ["B-01", "B-09", "B-10"]
hat_refs = ["UNATTENDED-OPS", "PERFORMANCE"]
requirement = "While the queued work items include a set that overlaps, the delivered loop content shall hand that set to a single judgement, at most once for any one state of the queued work items and never while another judgement is in progress, queued over an item of the set, or queued to run before it, whose outcome takes effect only as a recorded restructuring in which each absorbed item is closed in a terminal state naming its one successor, its scope text unchanged."
rationale = """A DERIVED requirement, and labelled so. SN-025 asks that no human curate what comes next; its acceptance states only that the next work derives from the tracked work-item graph, which a stranger reading it would derive as work selection alone. This row states what that promise needs once the loop also mints work: rows minted one finding at a time overlap, and without this row either a human merges them, which is the curation the need rules out, or the loop builds the same job more than once. Two lenses shape it. UNATTENDED-OPS: an overlap is a standing state, so a judgement fired on it re-asks the same question on every idle tick unless the judged state is remembered past the judging row's close, an unbounded retry that pages nobody. PERFORMANCE: each judgement is a strong-tier session, so asking once per queue state is the operating-cost bound rather than an optimisation. The restructuring is recorded rather than done by deletion so that an absorbed item's scope and its successor stay readable after the act. Fed back to the need: SN-025's acceptance could name the loop keeping its own queue free of duplicated work; until it does, this row is derived and says so. Choosing the next work stays SR-148's, and reporting an overlap as a warning stays SR-157's."""
acceptance_criteria = "A queue holding an overlapping set yields exactly one judgement row, and the same state of the queued work items yields none again, including after that judgement has closed; no judgement is started while another is in progress, while another consolidation is pending, while a queued judgement names an item of the set, or while a queued judgement would run before it, each refusal naming that judgement, and a queued judgement that does neither holds nothing back; a judgement is never itself a member of a set; a set is never seeded by, and never re-absorbs, an item created by an earlier judgement that enacted a consolidation, while an item made by a judgement that consolidated nothing, or by a consolidation without a recorded judgement, is not treated as judged; an outcome that moves an item no longer queued is refused, naming the item; an absorbing outcome leaves each absorbed item in a terminal state naming its one successor with its scope text unchanged, and the successor records every item it supersedes."
priority = "S"
verification = "Test"
status = "Approved"
phase = 5
da_refs = ["DA-015"]

[requirement.SR-221]
title = "A builder changing a module can list the tests the spine links to it"
sn_refs = ["SN-012"]
boundary_refs = ["B-09"]
hat_refs = ["PERFORMANCE", "TEST-ENGINEER"]
requirement = "The delivered harness shall list, for a module a design row names, the test files the requirement spine links to it through the design rows naming it, the test cases verifying those rows and those cases' evidence, derived from the registries with no hand-kept map."
rationale = """A DERIVED requirement: SN-012 asks that small changes stay cheap and does not name a test listing, so this obligation arrives through two lenses rather than through the need's text. The performance lens prices operator time: a builder iterating on one module either reruns the whole suite, minutes each time, or guesses which tests matter. The test-engineer lens names what the guess costs: tests picked by file name are a fraction of those exercising a module, because cases are named for the behaviour they drive and driven suites for the script they run, so a green from them has not examined what the module's design rows claim. The spine already records which tests carry each design row's evidence, so the listing reads it. It is an inner loop only: the commit bar still runs before every commit, and making a module-scoped subset the bar was considered and rejected, since a change that breaks another module through a shared import would then commit green."""
acceptance_criteria = "For a module a design row names, the listing names every test file under the declared test root that the evidence of a test case verifying one of its design rows cites, files not named for the module included, and no other file; a name matching no declared module and one matching several are each refused with a distinct outcome, the latter naming the candidates; the listing reads the registries of the repository it is pointed at; the commit bar is unchanged by it."
priority = "S"
verification = "Test"
status = "Approved"
phase = 6
coincident = """The need asks for small changes staying cheap; the tests the spine links to a module, listed from the registries with no hand-kept map, are what a builder needs before changing it."""

[requirement.SR-223]
title = "A guarded session receives the guardrails payload vendored for its model"
sn_refs = ["SN-026"]
boundary_refs = ["B-05"]
hat_refs = ["UNATTENDED-OPS"]
requirement = "Where a repository vendors a guardrails payload for a model-name substring, the delivered loop content shall inject that payload, in place of the default guardrails core, into a guarded session whose model name contains that substring."
rationale = """A DERIVED requirement, and labelled so. SN-026 asks that models be selected per job and capability level; it does not name what a session on a given model is told, so this obligation arrives through the unattended-operations lens rather than through the need's text. A guardrails posture written for one model is ritual noise to a stronger one and too little for a weaker one, and in an unattended run nobody watches a session drift: one core for every guarded model is the silent degrade that lens listens for. Selecting by a substring of the model name reuses the matcher the guardrails policy already applies, so one grammar decides both whether a session is guarded and what it is given, and the repository's own file names carry the mapping. A per-model key in the policy dial was the alternative, and it lost because a model name in shared configuration is the name that rots when models turn over. Fed back to the need: SN-026's acceptance could name a per-model posture; until it does, this row is derived and says so."""
acceptance_criteria = "A guarded session on a model whose name contains a vendored payload's substring receives that payload and not the default core; when several vendored substrings match, the longest wins; a session on a model matching none receives the default core; a session the declared guardrails policy leaves unguarded receives nothing, whatever payloads are vendored; the kit ships no payload of its own, and so names no model to the selection: with only the default core present, every model receives the default core."

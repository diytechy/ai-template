[requirement.SR-140]
title = "Each acceptance is recorded by a copy riding its own approval commit"
sn_refs = ["SN-029"]
boundary_refs = ["B-02"]
hat_refs = ["INTEGRITY-RECOVERABILITY", "SECURITY"]
requirement = """The kit shall record each acceptance as a byte-identical copy of the accepted
registries riding the same reviewed commit as the approval itself - so the
commit, its date and its author come from git rather than from a cell, and the
transition accepted and the acting reviewer that accepted it are distinguishable
BY QUERY, an approval delegated to automation on a tier the declared approval
level released from a human one."""
rationale = """Attestation STATE is already the row's own Status - spine_rules derives the spine STAGE from those cells and reads no other source - so a separate ledger is a second home for a fact the row already carries, and three of its seven columns duplicated cells outright (Decision=approved|meaning IS Status; superseded IS SupersededBy). What a ledger gets right is the BASELINE ITSELF: answering 'has this been approved' by walking git for the newest commit where a row read Verified is sound only while every amendment flips its row in the same commit - which is neither the sanctioned staged-amendment path nor the approval ladder, so the walk returns HEAD and the diff is empty BY CONSTRUCTION on exactly the rows a sitting exists to judge.
The record is therefore a whole-file copy of the accepted registries into docs/archive/last_approved/, riding the SAME reviewed commit as the approval. Three things follow. First, the commit, its date and its author come FROM that commit, so no cell has to carry them and no cell can lie about them. Second, the record is diffable by every git tool and by eye - a record only a script can read is a record only a script can audit. Third, the copy MUST ride the approval commit, because riding it is the only thing that makes "this copy is what was blessed" decidable. Anti-laundering rests on the MIRROR INVARIANT - any commit touching the record must leave it byte-identical to its live counterpart, so the only way to write text INTO the record is to write it live first, in a reviewed commit - together with the SEED RULES: the first copy refuses to create itself without an explicit seed, so the initial blessing cannot happen by accident, and an absent record is None rather than {} so it can never read as "re-bless everything with no diff shown".
ONE DECISION PER ROW, and the three clauses fail in different directions, so they separate cleanly: RECORDING an acceptance (this row), REPORTING text that has moved away from the record (SR-178), and REFUSING a record written from anything but the live text (SR-179). A record that exists and rides its approval commit while nothing ever compares live text against it satisfies this row and not SR-178; a comparison that reports drift faithfully against a record a hand edit wrote satisfies SR-178 and not SR-179. Three rows on one (SN-029, B-02) pair is what a need with three separable obligations looks like, and the alternative - one row whose partial pass has no id to report against - is the defect the split rule exists to prevent.
SN-029's DELEGATED-APPROVAL RECORD is this row's. Two of its four fields are supplied by the mechanism rather than by a cell: the ROW is in the copy, and the COMMIT is the approval commit. The transition (the copy's Status against live's) and the acting reviewer (the approval commit's author) belong HERE rather than on SR-139 because this row is the one that says what an acceptance record contains and where it lives, while SR-139 says which tiers are held. The query-distinguishability is the load-bearing part: a record that cannot separate a machine approval from a human one turns a released tier into an unauditable one, which is the failure the need exists to prevent."""
acceptance_criteria = """A row claiming approval that no acceptance record records, or whose recorded copy reads at a status making no such claim, is reported rather than passing silently — an approval that never rode a record; once a record exists, a registry absent from inside it is itself a finding, so the vacuous state is exactly one and it is "nothing has been approved yet"; an acceptance recorded with no acting reviewer, or one whose acting reviewer cannot be told apart from a human's by query, is a finding — releasing a tier delegates the review, it does not skip it; the recorded copy is byte-identical to the accepted text and rides the same reviewed commit as the approval, so the commit, its date and its author are answerable from history rather than from any cell; and the FIRST record refuses to create itself without an explicit seed, reachable from no automated step, so the initial blessing cannot happen by accident and can only ride the acceptor's own reviewed signing commit."""
priority = "S"
verification = "Test"
status = "Approved"
phase = 5
da_refs = ["DA-003"]
aspect = "process"

[requirement.SR-178]
title = "Text that has moved away from its acceptance record is reported"
sn_refs = ["SN-029"]
boundary_refs = ["B-02"]
hat_refs = ["TEST-ENGINEER"]
requirement = """The kit shall report any recorded artifact whose text has moved away from the
copy recording its acceptance - stakeholder needs included - regardless of any
Status movement."""
rationale = """THE DRIFT half, separable from SR-140 in the direction that matters: a record that exists and rides its approval commit, with nothing ever comparing live text against it, satisfies SR-140 completely and leaves every later amendment invisible. That is not a hypothetical - it is precisely the failure the git-history derivation had, and the reason a baseline on disk was owed at all.
REGARDLESS OF STATUS MOVEMENT is the load-bearing clause, not a qualifier. The amendment machinery watches the Status flip, and the sanctioned staged-amendment path deliberately does not flip - so a rule keyed off the flip returns nothing on exactly the rows a sitting exists to judge. Reporting against the recorded copy is the only reading that survives that, because the copy is a baseline OUTSIDE the live file and a walk over the live file can never be one.
THE STAKEHOLDER-NEED RIDER is in the normative text rather than left to the acceptance because the need tier is the one a sitting most wants to hold and the one the amendment-watching rules were last to reach: each rule walks the tiers it is given, so without the clause the need tier is left off the walk and no rule reaches it. Needs are compared row by row under the same approved and traced split as every other tier.
WHAT COUNTS AS MOVEMENT is one definition with one home, shared with the amend-without-flip guard: the id column and the Status cell are excluded STRUCTURALLY (the id is the join key rather than content, and folding Status in would make every flip read as an amendment and every amendment invisible behind its own flip), and the remainder splits into an approved half and a traced half. Two readers of one basis rather than two rules that agree until they do not."""
acceptance_criteria = """An artifact whose normative text has moved since the copy that recorded its acceptance is reported whether or not its Status moved; an approved cell moving under a row still claiming approval is reported, a merely traced cell moving is not, and a row below approval has no claim to fall from and is never reported; the status marker itself is never read as the movement, so a flip is neither an amendment nor a mask for one; and stakeholder needs, assumptions and surrogates are held to the same rule."""
priority = "S"
verification = "Test"
status = "Approved"
phase = 5
da_refs = ["DA-003"]
aspect = "process"

[requirement.SR-179]
title = "The acceptance record can only be written by copying live text"
sn_refs = ["SN-029"]
boundary_refs = ["B-02"]
hat_refs = ["SECURITY"]
requirement = """The kit shall refuse a recorded copy that is not byte-identical, in the commit
that writes it, to the live text it claims to record - so the only path into the
record runs through the live registry first."""
rationale = """THE ANTI-LAUNDERING half, failing independently of both siblings: a comparison that reports drift faithfully against a record a hand edit wrote is a comparison against a forgery, so SR-178 can pass in full while this row is violated. It is what makes "the record holds what was actually blessed" a DECIDABLE property rather than a convention.
IN THE COMMIT THAT WRITES IT is the whole strength of the rule and the reason it is stated as a refusal rather than a report. One comparison, made at the moment of the act, catches a hand edit, a partial copy and a copy-then-amend-live alike - three attacks that need three different detectors if the check is made after the fact. A stronger rule for less machinery. Its companion rule, the SEED, is deliberately NOT here: refusing to create the first record without an explicit seed is a statement about how a record comes into being and rides its approval commit, which is SR-140's subject, so it sits there. This row governs every write AFTER that, which is where laundering actually lives.
DELETION IS AN ATTACK ON THIS ROW, not on SR-140's: the cheapest laundering is never to forge the record but to remove the page, since the unanchored rule reports a row whose copy reads below it and deleting the copy deletes exactly that evidence. So a registry removed WHILE THE REST OF THE RECORD STANDS is refused, and a wholesale replacement of the record is not - retirement is legitimate, and a rule that fired on it would make its own design undeployable."""
acceptance_criteria = """A commit that writes a recorded copy differing from its live counterpart is refused, which is the one comparison that catches a hand edit, a partial copy and a copy-then-amend-live alike; a faithful copy passes; a copy removed while the rest of the record stands is refused, while a wholesale replacement of the record is not; the first record refuses to create itself without an explicit seed, so no automated step can bless a tree; and prose that is not a recorded registry is exempt."""
priority = "S"
verification = "Test"
status = "Approved"
phase = 5
da_refs = ["DA-003"]
aspect = "process"

[requirement.SR-144]

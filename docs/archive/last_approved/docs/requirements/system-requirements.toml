rationale = """ONE DECISION PER ROW: a shared serial actor is a shared MECHANISM, not one decision. This row holds the EXCLUSIVE-WRITER contract alone; ordering-and-all-or-nothing is SR-173's and identity allocation SR-174's, each with its own children. Realizes SN-027's serialization guarantee at the surfaces where a parallel writer would actually corrupt something, with SN-010 (the status surface a human reads regenerates at the seam, never on a lane), SN-008 (a first failure stops loudly rather than half-regenerating) and SN-025 (the surface a session reads is generated, never hand-copied). The serial LANDING (SR-156) and the rule that shared authority surfaces regenerate only there are two contracts that fail independently, since a perfectly serialized landing that still lets a lane commit a regenerated artifact satisfies the landing row and not this one. The three surfaces sit in ONE row rather than three because they share one decision, not three: the serial trunk actor is their sole writer. That decision is already ruled for the identity mint — a work branch never mints a work-item id — and this row is its requirement-tier home, which it did not have. `phase` inherits the parent's 4, matching every child."""
acceptance_criteria = """The compiled activity log and the generated project-state artifacts are written only by the serial merge step and never committed from a work branch; a work branch that regenerates one is refused or its result is not what lands. Ordering and partial-result behaviour are SR-173's; identity allocation is SR-174's; the harness work-branch freshness skip is SR-006's clause and is not restated here."""
priority = "M"
verification = "Test"
status = "Approved"
phase = 4
da_refs = ["DA-013"]

[requirement.SR-171]
title = "Bounded retry on a declared transient model limit"
sn_refs = ["SN-006", "SN-025"]
boundary_refs = ["B-09", "B-10"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """The delivered loop content shall retry a declared transient provider limit under a bounded backoff, surfacing the wait so a throttled run is distinguishable from a wedged one, rather than ending the run."""
rationale = """This obligation was live but stated ONLY in SR-026's acceptance cell, where it minted a requirement the shall never made. Deleting it would have dropped real behaviour, so it is stated here instead. Realizes SN-006 (a walk-away run survives the conditions it will actually meet - a rate limit is the ordinary one) and SN-025. The bound is what separates this from a retry loop: unbounded retry against a limit that is not transient is indistinguishable from a hang, which is the failure SN-006 exists to prevent. Surfacing the wait is the other half - a silent backoff and a wedged run look identical from outside.
ONE `shall`, with both clauses kept: surfacing is stated as a property of HOW the retry happens rather than as a second obligation, which is the honest reading - an unsurfaced bounded retry and a wedge are indistinguishable from outside, so a retry nobody can see does not discharge this row. Whether surfacing is instead a decision that fails independently of the retry - a split rather than one obligation - is an open question for the sitting, flagged and not decided here."""
acceptance_criteria = "A declared transient limit is retried under the declared backoff and the run continues; the wait is visible on the run surface rather than silent; a limit that is not declared transient ends the run with its own outcome code rather than retrying; the retry count and interval come from a declared value, never a literal."
priority = "S"
verification = "Test"
status = "Approved"
phase = 4
da_refs = ["DA-006", "DA-008"]

[requirement.SR-172]
title = "A stalled session ends at its declared limit"
sn_refs = ["SN-006", "SN-025"]
boundary_refs = ["B-09", "B-10"]
hat_refs = ["UNATTENDED-OPS"]
requirement = """The delivered loop content shall end a session that has made no declared progress within its declared stall limit, reporting the stall as its own outcome rather than as success or as an ordinary failure."""
rationale = """The sibling of SR-171, and from the same defect: the obligation lived only in SR-026's acceptance. Realizes SN-006 and SN-025. It is a SEPARATE row from SR-171 because the two fail independently and for opposite reasons - a backoff that never gives up is the failure this row catches, and a stall limit that fires on a legitimately slow provider is the failure SR-171's bound prevents. Stated as its own outcome because a stall reported as a plain failure sends a reader looking for a defect that is not there, and reported as success is a false green."""
acceptance_criteria = "A session with no declared progress inside the declared stall limit ends and reports the stall as its own distinct outcome; a session making declared progress is not ended by that limit; the limit is read from a declared value; the stall outcome is distinguishable from both success and an ordinary failure at the run surface."
priority = "S"
verification = "Test"
status = "Approved"
phase = 4

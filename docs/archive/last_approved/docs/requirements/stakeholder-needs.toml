# Stakeholder Needs (SN-###) — the kit meta-repo's OWN needs.
#
# The "product" here is the kit under `project-trajectory/`, and the
# stakeholders are the people and agents who adopt, run and maintain it. These
# rows are distinct from the blank `stakeholder-needs.template.toml` the kit
# ships to adopters. Engineering translations live in
# `system-requirements.toml`, which points back through its `sn_refs`; do not
# restate them here.
#
# Every need serves the [PROJECT-VISION](../../README.md#vision), and the
# DevStg-Reqs consistency review checks each row against it: a need serving no
# part of the vision is scope creep, and a need contradicting it is a finding.
# (The link is kept in markdown form so the pointer stays checkable and a human
# following it lands in the right place.)
#
# ONE TABLE PER NEED, id-keyed with the prefix retained and the key BARE:
# `[need.SN-006]`. An empty cell is an ABSENT key — omit the key rather than
# setting it to "". A duplicate id is a parse error, which is the carrier doing
# what a check used to. The reader is
# `project-trajectory/scripts/spine_carrier.py`.
#
# THE FIELDS — what each one is, and how it is used.
#
#   status      Maturity, and the ONE vocabulary the whole spine speaks (SN,
#               SR, LLR, TC), so "what is un-approved right now?" is one
#               question with one answer rather than a per-registry special
#               case. `spine_rules.py` reads it to compute the stage.
#
#                 Drafted   still being drafted — reads DevStg-Below, and
#                           `trace.py` exempts it from the "every SN needs an
#                           SR" rule so it can sit here before its
#                           decomposition exists. Not a park for real needs.
#                 Approved  a ratified need, the steady state. Ratifying IS
#                           changing this cell in a reviewed commit; that
#                           commit is the sign-off and its date is the
#                           ratification date.
#                 Modified  ratified text that has since been amended and is
#                           not re-signed — the owner re-attests it.
#                           Transitional: it retires once approved text is
#                           snapshotted and a diff answers the same question.
#
#               Maturity is a FIELD and never a section heading, so a prose
#               mention of an id cannot change a row's state.
#
#   need        The need itself, in plain language and in the stakeholder's
#               own terms. A failure-mode expectation ("never hand me a
#               half-written file") is a need like any other.
#
#   why         The need tier's REASON cell — the consequence of NOT meeting
#               it. It takes the ARGUMENT, never the CITATION: no work-item
#               id, ruling, sitting, review-round or open-item reference, no
#               decision id, edit verb or date stamp. A `why` is context and
#               nothing derives from it, so anything a child must realize
#               belongs in `need`, not here.
#
#   priority    M=Must · S=Should · C=Could.
#
#   acceptance  How anyone would know the need is met, written as a condition
#               the system satisfies rather than as a reading off an
#               instrument.
#
#   tags        OPTIONAL — omit the key on an untagged need. Names the DOMAINS
#               the need's OWN subject sits in, in the vocabulary the hats
#               roster's `applies_when` clauses evaluate
#               (`docs/requirements/hats.toml`), which is how a hat reaches a
#               need rather than only a work item. Tag a need when a HAT'S
#               CHARTER SUBJECT IS THE NEED'S OWN SUBJECT — reading the need
#               without that lens leaves a plainly governing question unasked
#               — never merely because some hat once derived a row from it.
#               Untagged is normal rather than incomplete: an `always` hat
#               needs no tag to reach anything, and `tags` carries no
#               arithmetic and appears in no schema rule.
#
# ## Non-goals
#
# Explicit scope boundaries — what the kit deliberately does **not** do,
# recorded so a later contributor treats them as decisions rather than
# oversights. DevStg-Reqs requires non-goals to be captured, and this section is
# their home in this repo.
#
# - **NG-1 · Internationalization / localization.** The kit's display strings,
#   CLI output, policy tokens, status vocabulary, registry headers and parsers
#   are English-only by design. The product is a developer-process kit whose
#   audience and machine vocabulary are English, so externalizing strings would
#   add cost with no stakeholder need behind it. If localization ever becomes a
#   requirement, first separate the **display** strings from the stable
#   **machine** tokens — policy names, status values, registry column headers —
#   before translating anything: those tokens are contracts, not prose, and
#   must not move with a locale.

[need.SN-001]
status = "Approved"
tags = ["templates", "scripts"]
need = """An adopting team can add this process to a new or existing repository and get a working gated, requirement-traced process, without hand-building the tooling."""
why = "It is the kit's reason to exist — a *reusable starting point*."
priority = "M"
acceptance = """A single scaffolding action against a destination repository produces a scaffold whose harness runs green out of the box; a re-sync onto an existing repo never clobbers the repo's own files."""

[need.SN-002]
status = "Approved"
need = """A reviewer can trust the chain from need to requirement to design to test because it is **mechanically verified**, not manually asserted: every requirement links to a need and a test before a gate."""
why = "*Requirement-traced … trust what ships*; a hand-maintained trace rots."
priority = "M"
acceptance = """The strict traceability check reports **zero orphans** across the joined `SN→SR→LLR→TC` spine; a malformed/duplicate id fails at any stage."""

[need.SN-003]
status = "Approved"
tags = ["templates", "scripts"]
need ="""A team in any language can use this process: it is **stack-agnostic**, and a non-Python project adopts it by re-pointing the harness at that stack's tools, with Python only as the reference."""
why = "*Stack-agnostic with Python-first reference scripts.*"
priority = "M"
acceptance = """The toolchain is declared once, in a single declared configuration file; a stack swap edits that declaration, not a kit script; a non-Python bootstrap profile omits Python-only artifacts."""

[need.SN-004]
status = "Approved"
need = """A team advances only through **explicit approval gates** (DevStg-Reqs→DevStg-Tests→DevStg-Impl→…), and a gate passes only when its mechanical bar is met."""
why = "*Explicit approval gates so you can trust what ships.*"
priority = "M"
acceptance = """A harness run for a named gate enforces that gate's required steps; a missing required tool **fails**, never silently skips."""

[need.SN-005]
status = "Approved"
tags = ["shell"]
need ="""AI agents and humans work from the **same playbook**, and the process is enforced **agent-neutrally** — by git hooks + CI — not by trusting whichever agent showed up."""
why = """*AI agents and humans working from the same playbook*; enforcement can't depend on which agent showed up."""
priority = "M"
acceptance = """The enforcement floor is git + CI running the *same* harness a human runs — where "same" is ONE DEFINITION OF PASSING PER MOMENT: each CI trigger runs the documented entry point at the tier the declared moment-to-tier table assigns to that moment (per-commit bar, slice close, release), pinned by test for the SHIPPED reference workflow. Per-agent configs only mirror the floor, never replace it. Two things are deliberately outside the claim: an adopter-edited workflow copy, which is beyond this repo's reach, and full local-CI equivalence on every input, which is not mechanizable and would be a bar nothing can check."""

[need.SN-006]
status = "Approved"
tags = ["unattended", "loop", "scripts", "personal-data"]
need = """An agent can run **unattended** and resume from repository text alone. Such a run never waits for interactive input, and reports its failures clearly. It also stays **safe**: declared limits bound the workers it may set running and the actions it takes that cannot be undone, and only an override a human provides — never one the model can set — may relax those limits. That safety is **supervision rather than an absolute**: the layer's first obligation is to move forward as far as it can, and it surfaces to a human when it cannot proceed — so a fault in the machinery that carries a limit degrades to a recorded condition, not to a stopped run."""
why = """Agents develop here, and a walk-away run is only worth having if it can be both left alone and trusted while unwatched. The safety half is stated in the need itself rather than only here, because a `why` cell is context that nothing derives from: a safety obligation recorded only here leaves the gate enforcing it parentless, and drops out of any re-derivation of the need."""
priority = "S"
acceptance = """The unattended loop resumes from the repository's tracked status surface, exits a **typed code** at each end state, and a preflight refuses a broken footing (no agent CLI, not a git repo, private author under privacy-check) rather than hanging. During unattended operation, configured limits bound every spawned worker and irreversible action, and only an explicit human-provided override may exceed those limits. A fault in a limit's own enforcement is recorded and lets the run continue rather than halting it — the run surfaces to a human when it cannot proceed, never when its own supervision errs."""

[need.SN-007]
status = "Approved"
need = """The people maintaining this kit hold it to its own standard: it stays traceable and tested through every change."""
why = """The kit is a foundation many repos inherit; a regression here propagates downstream."""
priority = "M"
acceptance = """The suite bootstraps a temp scaffold and runs every script; a green run of that whole suite is required before each change lands."""

[need.SN-008]
status = "Approved"
need = """A reader can believe a **pass verdict**: gates are **honest**, and a pass verdict never hides a skipped check, a stub, or an unmet criterion."""
why = """*Trust what ships*; a false pass is worse than a failure. The verdict is named as a verdict — the word PASS — never by hue: a colour word as the only name for the system's most important signal does not exist for a substantial class of readers, and the kit's console output carries zero ANSI colour in any case."""
priority = "M"
acceptance = """The harness **fails** (not skips) on a missing required tool — the explicitly-requested `--lenient` local mode is the one sanctioned degrade to SKIP (SR-006), never a CI/gate default; the no-stub detector and the privacy/secrets floor run at their declared gate."""

[need.SN-009]
status = "Approved"
tags = ["personal-data", "scripts"]
need ="""A team is protected from publishing a **secret or private identity**: it is caught before it publishes, in **every** repo, without extra setup."""
why = "Trust + safety; a leaked key or PII is near-irreversible once pushed."
priority = "M"
acceptance = """The always-on secrets floor scans every commit's staged diff, message, and outgoing range; the privacy gate adds PII/identity classes when the `privacy_check` dial is on."""

[need.SN-010]
status = "Approved"
need = """A reader can navigate the documentation and trust it: **navigable and honest** — links resolve, the vision is declared once, and generated views cannot silently rot."""
why = "*Readable and correct over the long run.*"
priority = "S"
acceptance = """The documentation check fails on a broken intra-repo link or a missing `PROJECT-VISION` tag; every generated artifact carries a `--check` freshness contract."""

[need.SN-011]
status = "Approved"
tags = ["scripts", "legal"]
need ="""An adopting team can run every check on a **clean Python 3.11+ with minimal, argued dependencies** — stdlib by default, a non-stdlib dependency admitted only through a reviewed ledger row — on Windows and POSIX (and macOS)."""
why = """Portability — the kit must not impose an *unargued* dependency stack on a downstream repo to run its checks. But a blanket "no dependencies" rule is itself a design constraint: it can force a worse hand-rolled alternative than a well-chosen tool, so the bar is **argument, not abstinence**."""
priority = "M"
acceptance = """Every non-stdlib import in the kit's scripts is declared as a row in the dependency ledger naming what it replaces, why hand-rolling is worse, and the ruling that admitted it — the suite fails on an undeclared import; checks an adopter runs (`shipped` tier) stay stdlib-*preferred*, since a dependency there forces every adopter to install it; the CI matrix is green on Linux + Windows + macOS."""

[need.SN-012]
status = "Approved"
tags = ["process"]
need ="""A team can keep small changes small: the process is **right-sized**, not ceremony for its own sake — small changes stay cheap, and heavy layers are opt-in."""
why = "An over-heavy process is abandoned; adoption depends on proportionality."
priority = "S"
acceptance = """Opt-in layers (perf, guardrails, unattended, parallel tracks, OKF export) cost a repo that doesn't use them nothing; the proportionality doctrine governs LLR/TC granularity."""

[need.SN-023]
status = "Approved"
# Both tags are INERT AS ROUTING and kept as SUBJECT metadata. `ui`: the UX
# pair is `always` here and gated on `render`/`ui` in the SHIPPED template (the
# VALUES-DIVERGE NOTE in hats.toml), so the row reads correctly under both.
# `a11y`: hat.ACCESSIBILITY was ruled `always` on 2026-08-16 in BOTH rosters, so
# nothing routes on the token any more — the lens reaches this need regardless
# (hats.py NON_ROUTING_TOKENS keeps the audit from reading that as a typo).
tags = ["a11y", "ui"]
need ="""A reviewer can see the project's progress **and how its parts connect** from one dashboard-like file."""
why = """*Readable and correct over the long run*; the relationships between the parts (which module talks to which, over what contract) are as much of the project's truth as its requirement tree, and scattering them hides architectural drift."""
priority = "S"
acceptance = """The single root dashboard renders both the roadmap/decomposition **and** the declared interface graph; every module in the arch-map inventory is a declared `IF-###` interface endpoint or an explicit source/sink, checked mechanically (warn-first)."""

[need.SN-024]
status = "Approved"
need = """A reviewer can trust subjective/perceptual acceptance — a realistic-looking render, an artifact comparison with no crisp measurable interface — because it is adjudicated by an **independent critical eye against a written rubric**, never by the session that authored the artifact."""
why = """*Trust what ships*; an implementer session cannot judge its own output, and a lax test case lets awkward work ship because nothing gave it the critical eye — another agent wearing a different hat must say *where and why* it isn't good enough and drive rework."""
priority = "S"
acceptance = """A `Verification=Critique` requirement is judged by a fresh, family-heterogeneous critique session against a written rubric derived from the SN/SR intent (not the possibly-lax TC); the verdict cites numbered rubric anchor ids, bounded iteration drives rework, and the loop escalates to the human on budget exhaustion."""

[need.SN-025]
status = "Approved"
tags = ["unattended", "loop"]
need ="""**With no human curating what comes next**, a configured LLM agent implements toward the vision — fully autonomously where enabled — deriving its own next work from the repository's tracked state. (The launcher that starts it is SN-034's obligation; this need is the self-direction.)"""
why = """Walk-away autonomy is the whole promise of the unattended layer: if a human must hand-maintain a next-step pointer, the loop is attended in practice and the pointer rots against the registry it paraphrases. Extends SN-006 (a *resumable* unattended run) into a *self-directing* one."""
priority = "S"
acceptance = """A plain launch derives what to do next from the tracked WI DAG plus Git — never from prose or a hand-maintained pointer, and never from predefined tracks; the ready frontier is ordered deterministically, so two readers of the same registry dispatch the same work; the status surface a human reads is generated, never hand-copied."""

[need.SN-026]
status = "Approved"
tags = ["unattended", "loop"]
need ="""The repo owner can configure **several LLM families** — selected per job and per capability level — so that work benefiting from an independent second opinion is automatically routed to a *different* family wherever that is configured."""
why = """One family is a single point of both failure and bias: an outage, a retired model or an expired auth stalls the whole loop, and a reviewer drawn from the implementer's own family shares its blind spots — so a same-family review reads like corroboration while adding little. Declaring the families and levels in a registry, rather than hard-coding one vendor, is also what keeps the kit vendor-neutral as models turn over."""
priority = "S"
acceptance = """A declared agent roster carries (family × model × tier) pair-rows and a separate consent surface, whose presence turns managed selection on. The coordinator resolves a row per in-process phase and tier, prefers a cross-family draw for the reviewer, critic and planner-pair sessions, degrades to the *documented* same-family mode when only one family is routable rather than silently skipping the second opinion, and logs every selection before launch — never a silent model swap."""

[need.SN-027]
status = "Approved"
# `perf` is INERT AS ROUTING since the 2026-08-16 ruling made hat.PERFORMANCE
# `always` in both rosters; kept as SUBJECT metadata (the same reading as
# SN-023's `a11y`). `unattended` and `scripts` still route.
tags = ["perf", "unattended", "scripts"]
need ="""A team gets more than one piece of ready work moving at once: ready work **fans out across bounded parallel lanes**, while mutation of the integration branch stays **serialized and gated**."""
why = """Concurrency is admitted here on structural grounds, not throughput ones: the WI DAG already encodes what may proceed, so a frontier bounded to one lane idles ready work for no reason; and parallel *integration* is precisely how a reviewed process ships an unreviewed tree — so fan-out is admitted only because it narrows back to a single serialized, gated seam before anything lands. No instrument here measures speedup, so a quantified-speedup justification would be unfalsifiable as written; the observability such a claim would need is carried instead by the lane-utilisation report."""
priority = "S"
acceptance = """A launch with independent ready WIs runs up to the configured worker ceiling (default 2) concurrently in isolated worktrees; every finished branch lands through one serial, fail-closed integrator that runs the declared bar on the composed tree; `--jobs 1` preserves the serial semantic; a declared pause stops claiming and drains what is already in flight; a crash at any lifecycle boundary recovers from Git history alone, without double-assignment or half-integrated authoritative state. Spec of record: `docs/archive/specs/parallel-wi-dispatch.2026-07-20.md` + `docs/concurrency-restructure.md`."""

[need.SN-028]
status = "Approved"
tags = ["shell"]
need ="""The repo owner can find and change every policy dial in **one home** — a **single hand-edited, machine-read file** — and a repo that declares the same dial twice is REFUSED rather than resolved by precedence."""
why = """The dials had accreted into ~10 one-word files under `docs/`, an idiom that was never ruled: it was held in place by the git hooks' pure-sh parse (a Python-less box must still fail closed on a declared privacy gate) and by a 3.8 floor with no `tomllib`. Both reasons are spent. Scattering costs an owner one file per question and a reader five ad-hoc parsers; worse, two sources for one dial is exactly the state where two readers disagree about the same policy, and a precedence rule makes that disagreement invisible instead of loud."""
priority = "S"
acceptance = """A single declared process-dial file holds every process dial under **bare `[section]` headers**, one `key = value` per line. The SHAPE is a checked contract rather than a convention, because two grammars read the file (a TOML parser and the hooks' plain-sh parse) and every shape only one of them understands is a silent flip of a security gate; the two readings are pinned equal over a table of adversarial files. A legacy one-word file still present alongside its key is a REFUSAL naming both, and a declared migration action — run by bootstrap and by the documented re-sync — converts and deletes the legacy files so an adopter never meets that refusal unaided. A wrong-typed or out-of-range dial is refused, never defaulted."""

[need.SN-029]
status = "Approved"
tags = ["unattended", "loop"]
need ="""**An autonomous run gets as far as it honestly can.** Once triggered, the coordinator stops for a human judgement only when the declared ratification level reserves that tier for a human, when a round cannot converge on its own, or when requirement/test documentation is introduced or amended such that the gate drops below what automation is permitted to attest. On every tier released to automation, an approval still happens as a review from a declared perspective against the row's actual evidence, and leaves a record naming who or what approved it — releasing a tier means the review is delegated, never skipped."""
why = """The unattended layer only pays for itself if a walk-away run actually walks away — so what stops it must be exactly the set of judgements the owner reserved, and nothing else. A three-value gate-authority enum (`attended` / `single-ratify` / `autonomous`) cannot express "TCs are human-held but LLRs are not", the distinction an owner actually wants to dial, and leaves each consuming table free to re-interpret the same word with its own fail-safe direction. Answering "has this been ratified?" by walking git for the newest commit where a row reads `Verified` is sound only while every amendment flips its row in the same commit — precisely the sanctioned path an amendment detector ignores — so the blessed way to amend an attested requirement is invisible to every consumer, and a stakeholder need has no anchor at all (an SN has no Status cell)."""
priority = "S"
acceptance = """A cumulative level names the highest tier a human still ratifies, compared against a separately derived SPINE STAGE (which tier is in process) via a declared, auditable mapping. Every failure direction — an unreadable stage, an out-of-range level, a wrong-typed dial — resolves toward MORE human involvement, because the failure that matters is a machine ratifying something a human meant to hold. Each acceptance is anchored ON THE ACCEPTED ARTIFACT'S OWN ROW — the commit whose tree carries the accepted text, plus a digest of that row's normative cells — never in a second registry keyed on the same artifact. Text that has moved away from what was accepted surfaces regardless of any Status movement, the one signal the sanctioned amend-and-flip path would otherwise hide, so an AMENDED requirement drops the derived stage exactly as a newly introduced one does. Each automated approval on a released tier appends a durable record (row, transition, acting reviewer, commit) distinguishable from a human approval by query."""

[need.SN-033]
status = "Approved"
priority = "S"
need = """**Scope: template (adopters + this repo).** A stakeholder can read each stakeholder need and recognize the outcome they asked for without knowing how the repository is built."""
why = """A need written in internal engineering vocabulary can remain technically current while becoming unreadable to the person whose intent it is supposed to preserve. The resulting failure is an approved requirement spine that no stakeholder can independently validate."""
acceptance = """The rule applies specifically to each SN `need` cell, not to engineering requirements or acceptance evidence. A declared check reports the row and phrase when a need cell contains an internal path, implementation-only identifier or process citation; a reviewed exception list distinguishes names that are themselves user-facing interfaces. The DevStg-Reqs review evidence includes the resulting findings."""

[need.SN-034]
status = "Approved"
tags = ["launcher", "templates"]
priority = "S"
need = """**Scope: template (adopters + this repo).** A person setting up to work on the repository can start each of the two universal contributor actions — preparing their development environment, and resuming the automated development loop — with a single action from the repository's front door, on Windows, macOS and Linux alike (one click where the platform allows it; one obvious command where it does not)."""
why = """Setup friction is where a new contributor or fresh machine silently diverges from the declared toolchain, and a resume path that needs remembered commands is a resume path that rots. A single visible entry point per platform makes the sanctioned path the easy path. On Linux desktops a bare double-click is unpromisable (the platform requires marking a file executable first), so the promise there is one action, not one click."""
acceptance = """Both entry points exist at the repository root for each supported platform in a fresh scaffold and in this repository; each launches its action as a single step on that platform, or documents the one platform-required step where a single click is impossible; the adopter-facing guide names the capability and invites reuse. This row is the ONE home for launcher-class obligations — root visibility, one action per platform, both universal contributor actions. Spanning those three is what holds it at need tier: the demotion test asks whether a need is a single requirement in a need's clothing, and this row is not one requirement, so the test does not reach it."""

[need.SN-035]
status = "Approved"
tags = ["launcher"]
priority = "C"
need = """**Scope: this repo (adopters advised).** A person working on this repository can open one launcher that lists the repository's available actions and runs the one they choose, on each platform this repository supports; adopters are told the pattern exists."""
why = """This repository has a dozen legitimate actions whose invocations are buried in documentation; a menu makes them reachable without remembered commands. This deliberately proposes amending the recorded self-application boundary ("no product launchers" — this repo has no product) to "no product launch": a menu of repository actions is not a product. The boundary prose in the contributor guide and status scope amends only if this need is attested."""
acceptance = """A root menu launcher exists for this repository's supported platforms, lists actions from one declared action inventory (so completeness is checkable against a single source), and runs the chosen action; the recorded non-goal is amended in the same change that lands the launcher, not before. This is held at need tier rather than demoted: the row's subject is the self-application boundary itself — a stakeholder-level scope decision about what this repo does and does not apply to itself, which no requirement cell has the standing to carry."""

[need.SN-036]
status = "Approved"
priority = "S"
need = """**Scope: template (adopters + this repo).** When a stakeholder's need is turned into detailed requirements, it is examined from every relevant expert and downstream-user perspective so important failure cases are not lost."""
why = """A decomposition produced from one perspective can omit security, operations, accessibility or first-use failures while still appearing complete. The omission remains invisible unless the review records which relevant perspectives were considered and what each contributed."""
acceptance = """Each decomposition has a machine-readable record of the declared perspectives, the applicability decision for each perspective, and the requirements or explicit no-finding result produced from it. A check reports any applicable declared perspective missing from that record. The record proves coverage and provenance; an independent review judges whether the resulting requirements are adequate."""

[need.SN-037]
status = "Approved"
priority = "M"
need = """**Scope: template (adopters + this repo).** A stakeholder can see where each promised system behavior enters or leaves the system, and the architecture changes with those promises instead of being invented afterward."""
why = """A requirement whose inputs and outputs cannot be located at a declared system boundary cannot be verified or assigned to a responsible component. Updating requirements and architecture separately also leaves periods in which each tells a different story."""
acceptance = """Every system-requirement input and output references a declared interface; every referenced interface identifies its boundary endpoints and whether its signal is discrete or variable; every declared component-boundary crossing has an interface row; unresolved references, uncovered crossings and incompatible signal types are mechanical findings. A reviewed change that alters one side of the requirement/interface relationship must include or explicitly justify the corresponding change on the other side."""

[need.SN-038]
status = "Approved"
tags = ["templates"]
priority = "M"
need = """**Scope: template (adopters + this repo).** An adopter can determine why every file supplied by the kit exists and which stakeholder outcome it supports."""
why = """A supplied file with no recorded purpose becomes inherited scope creep: adopters carry, maintain and trust it even though nobody can explain what failure its removal would cause. The absence must appear as a named coverage finding rather than remain hidden in the tree."""
acceptance = """A declared shipped-file inventory defines the coverage universe and its exclusions. Every inventoried file maps to at least one system requirement whose references resolve to a stakeholder need; generated outputs may map through their generator. A mechanical check reports missing files, stale inventory entries, unresolved references and files with no mapping, and applies the declared warning-to-gating policy."""

[need.SN-039]
status = "Approved"
tags = ["templates"]
priority = "S"
need = """**Scope: template (adopters + this repo).** An adopter can tell whether each stakeholder need applies to the reusable template, this repository alone, or both, without inferring scope from surrounding prose."""
why = """A need whose audience is ambiguous gets enforced against the wrong repositories: an obligation meant only for the template's own upkeep leaks into every adopter's process, or a template promise is quietly treated as one repository's habit. The scope must be a declared value a check can read, not a reading-between-the-lines exercise."""
acceptance = """Every non-example stakeholder-need row carries a required scope value from a closed vocabulary (template / this repository / both); a checker reports a missing or invalid value; the scope field enters the registry schema in the scheduled schema batch rather than as a one-off column."""

[need.SN-040]
status = "Approved"
priority = "S"
need = """**Scope: template (adopters + this repo).** A stakeholder can obtain a repeatable explanation for why the system was divided into its chosen components, based on the system's declared inputs, outputs and internal signal trade-offs rather than an unrecorded model judgment."""
why = """A component breakdown invented free-form by a model (or a person) leaves no record of the alternatives weighed, so the next reviser cannot tell load-bearing boundaries from accidents. Deriving the partition from the system's own declared inputs and outputs, against a declared objective, leaves evidence the choice can be re-examined against."""
acceptance = """A decomposition run records the candidate partitions considered, the declared objective and constraints they were scored against, the selected partition, and a comparison a reviewer can reproduce; the human names the components and rules the final choice; the record is kept with the architecture, not in session prose."""

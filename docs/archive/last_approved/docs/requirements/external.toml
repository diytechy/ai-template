# docs/requirements/external.toml — THE DEPTH-0 FRAME, as rows: who is outside
# this system, what crosses its boundary, and which external-to-external flows
# the system is not a party to.
#
# THIS IS NOT interfaces.toml. A boundary crossing is a FRAME-LEVEL fact — it is
# what the system requirements form around, and it exists whether or not any
# module realizes it yet. A concrete `IF-###` row ties BACK to a crossing here
# (`interface_from_external` / `interface_to_external`) only when it realizes
# one. That split is what lets an SR state the boundary obligation while an LLR
# states which piece provides it, without the two fighting over one row.
#
# THE FRAME IS LOCKED: its rows change only by a recorded ruling.
#
# THREE ROW KINDS, ONE FILE, because they are one statement:
#
#   [entity.EXT-###]        who is outside
#   [boundary.B-##]         what crosses, from the SYSTEM's point of view
#   [relationship.REL-###]  external-to-external, the system NOT a party
#
# A relationship carries NO interface vocabulary, deliberately: it is not a
# crossing and must never grow a realizing IF row. Wanting one means what you
# have is a boundary crossing.
#
# ROW IDS — READ THIS BEFORE CITING ONE. Crossings are `B-##`, and that is the
# name every ruled citation writes: an SR's shall names a `B-##`, and a
# tie-back writes `interface_to_external = "B-05"`. `BIF-###` is NOT used here
# and must not be — those ids name a DIFFERENT, superseded set of crossings, so
# reusing the prefix would recycle live ids onto new meanings. The gaps in the
# numbering are on purpose: a spent id keeps id and frame name aligned 1:1
# rather than renumbering a locked table.
#
# SPENT IDS — never re-minted at a different thing: `EXT-003` (the Adopter,
# dropped: an adopting team is the human operator of the kit in its own
# repository) and `EXT-004` (the cut hosted-CI entity, re-drawn as `EXT-007`);
# `B-03` (the read set, returned as `B-09`), `B-06` and `B-07` (the cut
# hosted-CI crossings, absorbed by `B-11`) and `B-08` (the vendored-doc check,
# not a crossing until a repository vendors something); `REL-001` (merged into
# `REL-002`), `REL-003` (promoted to `B-10`) and `REL-004`. `docs/id-watermark`
# carries the protection (OI-47 ruled (e), 2026-08-20, executed by WI-492): a
# mint counts from the mark, never from the live maximum, so none of these
# numbers can be handed out again.
#
# THE FIELDS — what each one is, and how it is used.
#
#   ENTITY ROWS
#     name         The party, named as its own side would name it.
#     class        CLOSED vocabulary: `operational` (a user or peer system that
#                  acts), `enabling` (something the system depends on to run),
#                  `interoperating` (a service it exchanges with) or
#                  `deliverable` (a package it produces and hands off).
#     description  What the party is, in one line.
#     mediates     OPTIONAL — the `EXT-###` whose writes this party carries
#                  into the system and to whom it shows the system's verdicts.
#
#   BOUNDARY ROWS
#     entity       The `EXT-###` on the far side. Must resolve to a row above.
#     direction    CLOSED vocabulary, read from the SYSTEM's point of view:
#                  `in` | `out` | `inout`.
#     system       CLOSED vocabulary, `operation` (the system in use) |
#                  `delivery` (the system that builds and delivers it) — the
#                  system-of-interest this crossing belongs to.
#     carries      What crosses, in one testable line. A crossing may be a
#                  BUNDLE of implementation-specific interfaces, which is
#                  legitimate provided the decomposition is broken down or
#                  clearly stated.
#
#   RELATIONSHIP ROWS
#     from / to    The two external parties. Neither may be the system.
#     kind         What the relationship is.
#     flow         What moves between them, and in which direction.
#
#   ON EVERY ROW KIND
#     status       The ONE maturity field — the same field and words the spine
#                  uses. Closed vocabulary, `Drafted` | `Approved`. `Founded` is
#                  NOT APPLICABLE to this tier and never will be: it means
#                  settled AND demonstrated, while an approval says the crossing
#                  is AGREED. The rung that reads it is
#                  `spine_rules.boundary_incomplete` ("is the boundary inventory
#                  still in work?"), through one table, `BIF_MATURITY`.
#
#                  FLIP AUTHORITY IS DERIVED, NOT DECLARED: a `status` cell may
#                  be machine-flipped only when this registry's stage rung —
#                  DevStg-Boundary — is not human-held under the `[attestation]
#                  human_approval_through` dial, the predicate being
#                  `agent_common.human_approves(docs, "external")`. READ THE
#                  DIAL, DO NOT ASSUME IT: whether DevStg-Boundary is held is
#                  that value's to say, never this comment's. What keeps these
#                  values the owner's, whatever the dial says, is that the kit
#                  ships no automated writer for an off-spine `status` — they
#                  are hand-edited, in a reviewed Status-change commit. The
#                  predicate exists so the first such writer cannot be added
#                  without consulting it.
#
#     absorbs      OPTIONAL — the earlier ids this row folded in, so a re-drawn
#                  frame loses nothing and an old citation still lands.
#     notes        OPTIONAL free prose about the row.
#
# APPLIES-WHEN: a project that never declares a boundary simply does not create
# this file, and the DevStg-Boundary rung is skipped rather than held open. The
# `-000` example rows that ship in `registries/external.template.toml` are absent
# here on purpose: this is the kit's own filled registry, not the blank form.

# --- entities: who is outside the system ---------------------------------------

[entity.EXT-001]
name = "Development session"
class = "operational"
mediates = "EXT-006"
description = """The computer and the working copy in its hands: shell, editors, OS, git client, Python and the test runner. Writes reach the system through it, whether a person types them or an agent CLI makes them, and the system's verdicts come back through it. The session HOLDS the checkout; the system owns the governed state those edits become once admitted through the hook floor."""
status = "Approved"
absorbs = "v1 EXT-001; dissolved into it: v1 EXT-005 (git), EXT-007 (OS/filesystem/Python), EXT-008 (test+coverage toolchain)"
notes = """It mediates for the human operator (EXT-006): an outcome landing on its crossings can be one that operator experiences. Who holds authority is policy, declared by the approval dial, not a property of this party."""

[entity.EXT-002]
name = "Template"
class = "deliverable"
description = """The delivered package - every *.template.*, the registries, scripts, hooks, skills and launchers - as a separate package. From an adopter's frame this package is their enabling system."""
status = "Approved"
absorbs = "v1 EXT-002"
notes = """`deliverable` was an ADDITION to the class vocabulary (operational/enabling/interoperating did not fit an output package) and is CONFIRMED (§1R.7 item 2). Nothing gates on `class` today; it is read by the generated context view and the advisory schema tier."""

[entity.EXT-005]
name = "Model provider API(s) / CLI(s)"
class = "interoperating"
description = """The model services and command-line runners behind every model in use, the primary builder and the adversarial reviewers alike. The kit's own loop invokes them across B-10; a person may also drive one directly, and its writes then arrive through the development session."""
status = "Approved"
absorbs = "v1 EXT-004 merged with the external-reviewer CLI at 13o"
notes = """A model CLI is just a model CLI, whether primary or secondary."""

[entity.EXT-006]
name = "Human operator"
class = "operational"
description = """The person who operates the kit: writes to the system through the development session, holds approval authority, and reads the spine and the views generated from it."""
status = "Approved"

[entity.EXT-007]
name = "Hosted CI"
class = "interoperating"
description = """A remote runner that invokes the declared bar on a push, pull request or schedule, across the OS x Python matrix the job declares, and reports the job verdict and step log."""
status = "Approved"
notes = """Outside this system's design control: it may or may not honour the workflow it is handed. That is what makes it an external party; the obligation the system can carry stays on the shipped workflow (B-05 content)."""

# --- boundary crossings: what enters and leaves the system ---------------------

[boundary.B-01]
entity = "EXT-001"
direction = "in"
system = "operation"
carries = """Governed writes: artifact, registry and config edits admitted ONLY through the git hook floor (privacy, format, gate checks) - the one write path from the session into the system's governed state."""
status = "Approved"
absorbs = "v1 BIF-004/N-01, BIF-006/M-13, BIF-007-in/M-10, BIF-025/X-09, and the write half of BIF-026/M-16"

[boundary.B-02]
entity = "EXT-006"
direction = "in"
system = "operation"
carries = """Authority: rulings, attestations and Status flips - the distinguished input the process advances on."""
status = "Approved"
absorbs = "v1 BIF-005/M-11"
notes = """No port of its own: authority arrives as content on B-01's write path. The system can observe that a Status cell changed, not that a person judged."""

[boundary.B-04]
entity = "EXT-001"
direction = "out"
system = "operation"
carries = """Guardrail verdicts during a session: hook-floor accept/reject and subagent_gate PreToolUse allow/deny."""
status = "Approved"
absorbs = "v1 BIF-012/X-07, and the verdict halves of BIF-006 and BIF-026"
notes = """The honest limit belongs in this crossing's SR: a local hook floor is bypassable (git commit --no-verify), so "no unchecked write enters governed state" rests on this verdict at the moment of the act PLUS a re-run of the same bar away from that bypass. Where hosted CI is configured, that re-run crosses B-11. The system holds no design control over whether the runner honours the workflow it is handed, so the obligation it carries stays on the shipped workflow (B-05 content, SR-151 and SR-152)."""

[boundary.B-05]
entity = "EXT-002"
direction = "out"
system = "delivery"
carries = """THE TEMPLATE - the packaged deliverable. The delivered scripts' contracts (check.py, bootstrap.py + MAPPING, agent_loop.py, check_vendored.py, gen_cases.py, gen_release_checklist.py, the hooks, the launchers) are IF definitions tied to this crossing: content of the package, not separate system crossings."""
status = "Approved"
absorbs = "v1 BIF-014/M-07, BIF-015/M-06, BIF-016..021/X-01..X-06; BIF-001/M-01 and BIF-002/M-02 as CONTENT (their invocation is the session's, 13n); the skills fan-out and docs/knowledge packs (§1R.7 item 5)"
notes = "The largest bundle in the frame, and legitimate as one under §3R: a single shall against it is permitted BECAUSE the decomposition is stated in the component details. The delivered capabilities it breaks down into are: harness verdict, scaffold + MAPPING, unattended loop, generators, hook floor, and cross-cutting property -- the sixth being a ruled class for a property of every delivered capability at once, which is why SR-031, SR-034, SR-035 and SR-114 each stay one row in it rather than one per capability."

[boundary.B-09]
entity = "EXT-006"
direction = "out"
system = "operation"
carries = """Read: the spine and the views generated from it - the project-state dashboard, the open-items page, the status surface, the derived stage and the console reports."""
status = "Approved"
absorbs = "v1 BIF-007-out/M-10, BIF-008/M-03, BIF-009/M-19, BIF-010/M-09, BIF-011/M-08 - the former B-03 set, held by REL-002 while the views were not system outputs"

[boundary.B-10]
entity = "EXT-005"
direction = "inout"
system = "operation"
carries = """The loop invoking a model runner: the prompt and brief out; the output, exit code and commits back; and the runner's limits - rate limit, expired authorization, model retirement."""
status = "Approved"
absorbs = "REL-003 (v1 BIF-023/M-15 and BIF-024/M-14)"
notes = """The backoff obligation stays a requirement on the loop content that makes the call."""

[boundary.B-11]
entity = "EXT-007"
direction = "inout"
system = "operation"
carries = """A hosted run of the declared bar: the trigger and the declared OS x Python matrix in; the job verdict and step log out."""
status = "Approved"
absorbs = "EXT-004's cut crossings B-06 (trigger in) and B-07 (verdict out)"

# --- relationships: external-to-external, the system not a party ---------------
# No interface vocabulary appears in these rows. That absence is what keeps
# decision 6 satisfied: a relationship is not a crossing and must never grow a
# realizing IF.

[relationship.REL-002]
from = "EXT-002"
to = "EXT-001"
kind = "hands-off"
flow = """Transition: the Template installed into an operating environment, this repository's own or an adopter's - the only lifecycle hand-off between the delivery frame and the operation frame."""
status = "Approved"
absorbs = "REL-001 (the Template adopted into the Adopter's repository), merged when EXT-003 was dropped"

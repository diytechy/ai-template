notes ="""The spine and everything that decides whether it holds: spine_carrier, trace, trace_text, spine_rules, check_trajectory, plan_coverage, migrate_carrier, wi_convert, gen_arch_map. Ten modules of the shared helper package kitlib declare this component in their headers: config.py, git.py, registry.py, __init__.py, ladder.py, stage.py, evidence.py, spine.py, secret_classes.py and observation.py. Eight of the ten are consumed across components by design and are declared on the shared-kernel surface (docs/kernel-modules-allow): the package root, config, git, registry, ladder, stage, evidence and spine. A reused file keeps one owner, this component, and an import into it is not a seam. The other two have consumers a row can name, and their cross-component edges are covered by call rows this component owns naming the importing component: IF-314 for secret_classes.py (check_privacy, agent_common) and IF-315 for observation.py's atomic write (coordinator_guard, kitlib/guard_hooks), whose CMP-008 requestor also covers rejudge's import of its records; IF-214 states those records' file medium, which covers no import. kitlib/station.py and kitlib/verdict.py declare CMP-008 and stay off the kernel surface, so every edge into them is checked. Their cross-component edges are covered by call rows CMP-008 owns naming CMP-009: IF-093 for the dashboard's edge into the station, IF-175 for the rollup generator's edge into the verdict record. Their other edges come from files declaring CMP-008 and are internal. Each file declares one component, so no edge is silenced by a file belonging to two."""


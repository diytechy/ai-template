notes = """The spine and everything that decides whether it holds: spine_carrier, trace, trace_text, spine_rules, check_trajectory, plan_coverage, migrate_carrier, wi_convert, gen_arch_map. The shared helper package kitlib (config.py/git.py/registry.py/__init__.py via LLR-181, ladder.py via LLR-184, stage.py via LLR-185, evidence.py via LLR-192, spine.py via LLR-197, secret_classes.py via LLR-205) is owned here alone, single-tagged CMP-006 - the closest-fit reason is registry.py's bulk within LLR-181's module set. It is still imported from every component; that consumption is recorded on a declared shared-kernel surface (docs/kernel-modules-allow) rather than by a multi-tag - a single `Component` cell can no longer silence a genuine cross-component seam finding. kitlib/station.py (LLR-182) and kitlib/verdict.py (LLR-207) are the package modules NOT owned here: both stay CMP-008, each one's cross-component edges declared and policed as an interface row - IF-093 for the station, IF-175 for the verdict record - rather than folded into the kernel surface. gen_arch_map also carries a CMP-009 tag through LLR-080, the one LLR row whose modules straddle this cut - its single import edge stays POLICED (IF-117 covers it), so no seam is suppressed."""


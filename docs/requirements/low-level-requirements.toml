[design.LLR-172]
sr_refs = ["SR-165"]
title = "Component derivation record: element completeness + the ranking recompute"
module = "project-trajectory/scripts/trace.py"
code_symbol = "component_findings"
detail = """Extends the existing component pass — the one home that already reads docs/requirements/components.toml and already emits CMP findings — with the derivation-record rules SR-165 states, rather than adding a second reader of the same registry. Per live CMP row: the record must declare the candidate partitions considered, the objective and the constraints they were scored against, a score per candidate, the selected partition, and the human ruling that named the components and adopted it; a missing element is one finding naming the row AND the element. Two derived rules on top of presence, because presence alone is satisfiable by a record that says nothing: (1) THE RANKING RECOMPUTES — re-rank the recorded candidates from the record's own objective, constraints and scores and compare with the recorded order, a mismatch being a finding, which is what makes the record falsifiable without a reviewer re-running a model session; (2) A SELECTION THE SCORES DO NOT RANK FIRST is a finding unless the record carries a human override naming that choice, so a legitimate "the scores said A, the human chose B" is expressible and an unexplained one is not. Vacuous by construction on a project declaring no components, and on the example -000 rows. NOT BUILT YET: the record cells do not exist on the CMP schema today, which is why this row and TC-166 are Draft — SR-165 was flipped Inspection -> Test at act 7 precisely because the check is mechanizable, and this is the debt that flip incurred, recorded rather than silently owed."""
rationale = """The check belongs where component_findings already is for the reason the census keeps applying: a second module reading components.toml would be a second answer to "is this partition recorded", and the two would drift. The recompute is the load-bearing half — an element-presence check passes on a record whose scores contradict its own conclusion, which is the exact failure SN-040 exists to catch (the next reviser cannot tell load-bearing boundaries from accidents). The override arm is what stops the recompute rule from forbidding human judgement: the requirement is that a departure from the scores is RECORDED, never that it is disallowed."""
test_refs = "TC-166"
status = "Drafted"
component = "CMP-006"
phase = 5

[design.LLR-173]
sr_refs = ["SR-140"]
title = "The last_approved snapshot: the record of what was blessed"
module = "project-trajectory/scripts/baseline_snapshot.py"
code_symbol = "copy_live/load_all/rows_for/exists/stamp/is_drifted/drifted_cells/unanchored_findings"
detail = """The approval RECORD, sibling to LLR-158's comparison basis: SR-140 says an acceptance is recorded as a byte-identical copy of the accepted registries riding the approval's own reviewed commit, and that text moved away from that copy is reported regardless of Status movement - this is where the recorded side lives. copy_live(root, seed=False) mirrors seven registries (the four spine tiers plus interfaces/external/components, which carry human-only approval and state cells) BYTE FOR BYTE into docs/archive/last_approved/, preserving repo-relative paths so spine_carrier.resolve/carriers/stem resolve under the snapshot root verbatim, carrier fallback included; the stale other-carrier file for a stem is deleted in the same act, or the next read raises "exists under BOTH carriers". Whole files rather than extracted rows is what makes "snapshot file == live file at the copy commit" DECIDABLE - check_trajectory.staged_snapshot_findings is the mirror invariant that fails a hand edit, a partial copy and a copy-then-amend-live on one comparison - and it is also what makes the UNANCHORED rule decidable, because the copy keeps each row's own Status cell, so a live row claiming approval whose snapshot copy reads below it is an approval that never rode a copy. Three refusals are load-bearing and each is the opposite of a convenient degrade: copy_live REFUSES to CREATE the directory without seed=True, because the first snapshot blesses whatever text is in the tree and must ride the owner's reviewed signing commit (reachable only from `intake.py snapshot --seed`); load_all returns None for an absent directory and RAISES on a file that exists and will not parse, because {} and None are opposite claims and the empty one reads as "re-bless everything with no diff shown"; and rows_for is the ONE place the None sentinel is collapsed, so no caller invents its own `or {}`. is_drifted/drifted_cells delegate the cell comparison to LLR-158's split_changed_cells and arm on the RATIFIED half only. stamp() is advisory and derived FROM GIT rather than from a file, so it can never quietly become the ledger this mechanism replaced; every arm degrades to ("", ""). SR-140's two remaining record fields come from the same two places and neither is a cell: the TRANSITION is the copy's Status read against live's (the comparison above), and the ACTING REVIEWER is the AUTHOR of the commit that wrote the copy - which is why the copy must ride the approval commit and why the author is queried from git rather than stamped, since a stamped reviewer is a claim and a commit author is a record. ADVISORY TODAY: unanchored_findings returns strings and joins no failure set - it is promoted to the integrity floor at migration step 7, and not before, because against a pre-seed or pre-rename snapshot it would red every row."""
rationale = """The baseline had to leave git history. The derivation it replaces walked the registry for the newest commit at which a row read Verified, which is sound only while every amendment flips its row in the same commit - and the D-9 ladder deletes the flip, so the walk returns HEAD and the diff is empty BY CONSTRUCTION, on exactly the rows a sitting exists to judge. A snapshot on disk is a baseline OUTSIDE the live file, which is the one thing a walk over the live file can never be. docs/archive/ is the placement rather than an accident: check_vocab.EXEMPT_GLOBS already exempts it, and the snapshot legitimately holds the PREVIOUS vocabulary, so anywhere else reds the vocabulary enforcer on every signing. The design's own argument for whole-file copies is that a human can open the record and `git diff` it - a record only a script can read is a record only a script can audit."""
test_refs = "TC-167"
status = "Drafted"
component = "CMP-006"
phase = 5

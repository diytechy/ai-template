rationale = """SN-005's strongest clause is that the enforcement floor is git plus CI running the SAME harness a human runs, and that clause was true, shipped, and pinned by nothing: the existing workflow tests asserted triggers, action digests and job names, and one asserted that the reference workflow mentioned the harness AT ALL. The measurement that made it checkable is that "the same harness" cannot mean one command, because the human bar is itself tiered by MOMENT - smoke per commit, the full suite at a slice close, the release tier at a tag - so the obligation is per-moment equivalence and the mapping is the thing that has to have one home. What this deliberately does NOT claim, and the honest split is the row's: it says nothing about an adopter's edited copy, which is outside this repo's reach, and it proves one definition of passing per moment rather than equivalence on all inputs, which is not mechanizable at any price."""

[design.LLR-183]
sr_refs = ["SR-161"]
hat_refs = ["MAINTAINER", "TEST-ENGINEER"]
title = "The perspective record as a resolvable cell: Hat-Refs, its integrity rule and the derived effective set"
module = "project-trajectory/scripts/spine_carrier.py;project-trajectory/scripts/trace.py;project-trajectory/scripts/check_trajectory.py"
code_symbol = "load_hat_names/hat_findings/effective_hats"
detail = "The machine-readable half of the perspective record, sited on the row rather than beside it. spine_carrier declares hat_refs (column Hat-Refs) as an OPTIONAL key on the SR and LLR tiers, a typed array of hat roster NAMES; the roster name is the id space, and the C-###-style clause numbering that appears in eight rationale cells is prose that resolves against nothing. Absence is NOT RECORDED and never no-perspective-applied, which is why no rule anywhere requires the cell to be present. trace.load_hat_names reads the roster's table keys only - hats.py stays the sole validator of roster CONTENT, and this reader answers the one question that module answers for nobody else, is this name declared - degrading to the empty set for an absent or unparseable file so the whole rule goes vacuous rather than reporting every row as dangling. trace.hat_findings splits severity the way the boundary rule does: a name the roster does not declare is a finding in the --strict failure set under its own class label, while coverage and the roster's own unattributed hats are single advisory summary lines that never gate. trace.effective_hats derives a design row's effective set as its own refs unioned with its SR parents', so the LLR cell holds only what its own decomposition raised and a dangling parent contributes nothing rather than raising. check_trajectory classifies Hat-Refs TRACED at both tiers, which is what keeps the cell off the re-attest window and out of the snapshot drift basis. NOT DISCHARGED, stated in the debt-stating pattern this tier uses rather than left to be discovered: the parent asks for a record that distinguishes NOT-APPLICABLE from CONSIDERED-WITH-NO-FINDING, and this cell expresses neither - both are facts about a decomposition, while this cell is a fact about a row. Applicability is separately DERIVABLE from the roster's own predicates, so storing it here would store a derived fact and let it go stale; the no-finding half needs a per-decomposition artifact that does not exist."
rationale = """A prose label is not a record. The convention this replaces asked an author to name the deriving perspective inside a rationale sentence, which reads correctly to a human and resolves against nothing: no check could tell a live perspective from one deleted a month earlier, and a census was the only instrument that ever found a stale one. Making the attribution a cell whose values resolve against the declared roster converts the whole class from unfalsifiable to mechanical, at the cost of one existence check. The severity split is what makes it adoptable rather than merely correct - the cell is empty on nearly every row the day it exists, so a presence rule would red an entire spine at once and be switched off within a day, while a resolution rule reds only rows that cite something untrue and can therefore be armed immediately. Deriving the effective set instead of copying parents down is the same argument one tier up: a copy turns re-ruling a single requirement into a sweep across every child it has, which is precisely the hand-maintenance a resolvable cell exists to escape."""
test_refs = "(see TC-178)"
status = "Approved"
component = "CMP-006"
phase = 5

[design.LLR-185]
sr_refs = ["SR-139"]
title = "The stage carrier: the declared derivation inputs, their fingerprint, and the common reader"
module = "project-trajectory/scripts/kitlib/stage.py"
code_symbol = "DECLARED_INPUTS/fingerprint/effective_stage/read_stage"
detail = """The stage axis's carrier, one rung above the ladder vocabulary and below every consumer of it. It holds the DECLARED derivation input set as one list (the spine registries by logical name with their carrier alternatives, plus the declared dials), the fingerprint over those inputs - SHA-256 of each file's LF-normalized content folded with the declared name and the carrier that answered, so a migration between carriers and an absent registry both move it - the ordering that admits the per-phase DevStg-Below sentinel without letting it reach the headline, the require_rung guard that REFUSES rather than truncating, the selection FLOOR, the per-phase fold, the docs/stage key=value format, and read_stage: the one function every consumer of the current stage calls. read_stage recomputes the fingerprint, returns the recorded record on a match with no registry parse, and derives fresh IN MEMORY otherwise. It never writes. The derivation is passed IN as an argument rather than imported, because the registry parse needs a sibling this package may not import."""
rationale = """Freshness was previously something a SCHEDULE had to arrange, and the schedule had two holes: the freshness step stands down on a claimed work branch, where a green run over a stale cache is therefore reachable, and the loop reads the value once per run and threads it down, so a mid-session approval is invisible for the rest of it. Both are closed by making verification a property of the CALL instead of the calendar, which is only affordable because the derivation's inputs are enumerable and small - under a dozen files, hashed in milliseconds, against consumers that already parse those same files wholesale. So the fingerprint is a fast path that REMOVES scans rather than adding one. It lives in kitlib for the reason ladder does: every consumer will call it, so a home inside any one consumer would make the others import that consumer. Readers never write because the committed file is load-bearing history for the event detectors, and a self-healing reader would rewrite that history from whichever process looked first, on the very lanes where a work branch must not commit a generated artifact."""
test_refs = "(see TC-180)"
status = "Approved"
component = "CMP-006"
phase = 5

[design.LLR-186]
sr_refs = ["SR-139"]
title = "The effective stage: per-phase, draft-excluded, floored"
module = "project-trajectory/scripts/derive_stage.py"
code_symbol = "derive/_stage_map/_phase_groups/main"
detail = """The producer that turns registry rows into the docs/stage record. It loads the spine through spine_rules.load_spine and re-uses spine_rules's own rung predicates and fall-through rather than restating them, groups the rows into phases by REFERENCE (an LLR belongs to the phase of the SR it decomposes, and a TC citing only its LLR resolves back through it), and derives each phase's stage twice: once over all rows (the honest live reading) and once over the settled subset with every Drafted row removed, off-spine rows included. The headline effective stage is the min over the phases that have EARNED a rung - a phase with nothing settled carries the sentinel and contributes no opinion - then floored. The file records the effective value, its derived position, the floored flag, the settled and live readings, the derived phase, both per-phase breakdowns, the draft count and the input fingerprint; --check recomputes and compares the whole field block, and treats the comment-only scaffold placeholder as not-yet-derived rather than stale."""
rationale = """Three defects were driven against the previous single stage field and all three are answered here. It had no draft counterfactual, so ONE ordinary Drafted row dropped a mature repo to exactly what a fresh scaffold reads, and the depth of the drop was set by which tier the draft happened to land in; the existing ex-draft field could not be reused because it carries a BAR, which would type-check against the stage ladder and return a wrong ordinal. It had no floor, so ord 0 was reachable - below every runnable rung, where an at-or-above selector runs nothing and the run goes green because of it. And it had no per-phase reading at all, so the single global value was already a min over phases and no consumer could ask what the current phase had earned. The draft-excluded reading is shown BESIDE the honest live one rather than instead of it, which is the standing rule for any derived reading of a deliberately non-monotonic ladder. The derivation stays OUT of kitlib because it needs the registry carrier, and out of spine_rules because that module is being emptied rather than grown; keeping the rung fall-through in one place is what lets the ladder be re-discriminated later by editing one function."""
test_refs = "(see TC-181)"
status = "Approved"
component = "CMP-006"
phase = 5

[design.LLR-187]
sr_refs = ["SR-162"]
title = "Frame-reference resolver and interface-cell checker"
module = "project-trajectory/scripts/trace.py"
code_symbol = "frame_findings/sr_boundary_findings/_frame_report_section"
detail = """In the trace pipe, frame_findings resolves a crossing's Entity and a relationship's From and To against declared entity ids. It returns finding strings, not the older spine rules' (at_fault_id, finding) pairs, because no caller uses the id. These are FAILURE findings. An empty entity set is vacuous only when nothing references it; otherwise a reference to a missing entity would falsely report full resolution. sr_boundary_findings joins the SR side and returns (findings, advisories): an SR Boundary-Refs value naming an undeclared crossing is HARD and joins --strict, while the uncovered-requirement count, crossings named by no requirement, and the realization gap - a declared crossing with no InterfaceFromExternal/InterfaceToExternal interface row - are one advisory each and never gate. Both rules are vacuous with no declared frame, and _frame_report_section renders their state or findings. At the IF entries in this module's required-field and closed-vocabulary tables, endpoint pairs and the closed discrete/variable signal vocabulary are declared as this row's observables; the generic checker executes them but remains owned by the schema row. NOT DISCHARGED: incompatible signal types on joined seams cannot be reported naming both rows because no join reads signal vocabulary; the carriage cell is the tier's only seam-to-seam edge and carries none. The cross-side requirement/interface amendment rule is also unimplemented."""
rationale = """A boundary reference that resolves against nothing is the same defect as a requirement citing a deleted need, and it went unpoliced for as long as the frame was prose. Making the frame a registry with typed reference cells converts the whole class from unfalsifiable to mechanical at the cost of one existence check per cell. The severity split is what makes the rule shippable rather than merely correct: resolution can be armed hard the day it exists because it reds only rows that cite something untrue, while coverage - every requirement names a crossing - would red most of a spine on the day the column appears, for work that belongs to an authoring campaign, and a gate that is fully red on arrival is a gate somebody switches off. So the uncovered count ships as the one number the campaign has to move. The realization gap is reported at the same restraint and for a stronger reason: whether every declared crossing owes an interface row is a question the frame's own ruling deferred, so gating on it here would enforce a decision nobody made. Vacuity for a frameless project is not a convenience - it is what lets the rule ship to adopters who have not drawn a boundary yet without teaching them to ignore a permanent warning."""
test_refs = "(see TC-182)"
status = "Approved"
component = "CMP-006"
phase = 5

[design.LLR-188]
sr_refs = ["SR-148"]
title = "The registry-gap census as a read model, sited below every module that reads it"
module = "project-trajectory/scripts/census.py"
code_symbol = "gap_census/red_tc_census/parse_red_tc/_implemented_ids"
detail = """The empty-frontier ladder's rung-1 derivation, its red-TC class and the grammar that carries both, in one module that decides nothing about lanes and writes nothing. gap_census re-uses trace.load_registries + trace.analyze (phase unfiltered, require_verified on) rather than re-deriving a second orphan/status engine, and returns finding strings: orphan rows, status findings, draft needs, then the red-TC lines. red_tc_census names a test case that is not green while every requirement it verifies is cited by a work item recorded done, stated as exemptions rather than as a list of red words so the rule fails toward naming a gap. _red_tc_line and parse_red_tc are the two halves of the one structured line class and sit adjacent; nothing else parses a census line. _implemented_ids reads the work registry through the one home that derives docs/work/ from the path its callers already declare, so this module carries no layout literal and, more to the point, no import of the minting module that used to supply one. THE SITING IS THE ROW: three modules read the census - the dispatcher at rung 1, the mint that turns lines into concrete rows, and the disposition brief that re-runs the red-TC half live - and two of them sit BELOW the dispatcher, so a census defined in the dispatcher forced the mint to import the scheduling composer back. The dispatcher re-exports gap_census, red_tc_census, parse_red_tc and the prefix under their former names, so no caller moved to gain the layer."""

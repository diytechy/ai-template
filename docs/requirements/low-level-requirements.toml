module = "project-trajectory/scripts/check_trajectory.py"
code_symbol = "queue_conflict_findings/_title_tokens"
detail = """Three signals over OPEN rows only — Jaccard over title token sets at a deliberately high bar, shared `SR-Refs`, and a shared anchor-stripped `SpecRef` — each reported once per pair per signal with both ids, in sorted order. Printed on the warn-only line beside backlog staleness; never appended to `errors`."""

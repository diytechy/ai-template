[design.LLR-180]
sr_refs = ["SR-180"]
title = "The realization-symbol anchor and the binding oracle behind it"
module = "project-trajectory/scripts/check_doc_refs.py;project-trajectory/scripts/gen_arch_map.py"
code_symbol = "symbol_findings/module_bindings"
detail = "symbol_findings walks the live design registry and, per row, asks module_bindings for the names each named module binds at module scope plus its class-level definitions, reading the ;-joined module cell as a union rather than as a positional pairing with the symbol cell. Three verdicts: a cell carrying no identifier-shaped token is untraced (it names a file format, a CLI or CSS token, or prose, none of which is a symbol claim); a cell whose identifier tokens all miss the union is dangling, the one class that joins the failure set under --strict; a cell with at least one hit is anchored, with every remaining miss counted as untraced. Four skips, each costing a stated thing: an example placeholder row, so a generated scaffold stays copy-ready; a module the profile carries no resolver for, returned as a per-row advisory naming the row and its modules and folding to one line past the declared threshold, warn-only and never the exit code; a module absent from disk, which the path tier already reports; and a module that will not parse, which the parse pass reports. The caller owns the parse, so the oracle is pure and an unparseable module costs that module's verdict rather than the run."
rationale = """The resolver lives with the module that already owns AST symbol extraction rather than being copied into the consumer, because a second parser that has not learned a node type does not crash — it answers that a live symbol does not exist, which on this seam is a false red on the spine. It deliberately does not read the rendered public-API map: that view drops underscore-prefixed names and module constants, which live design rows name in quantity, so reading the artifact would report real code as missing. The verdict is per row rather than per token because discharge asks whether the row's realization exists, not whether every name in the cell is exact; the harsher question reds rows for tokens that were never symbol claims, while counting the misses keeps a later tightening available. The non-resolvable-module skip is reported rather than silent because a row that discharges by default with no output is a fail-open, and the skip itself stays correct — only its visibility changed."""
test_refs = "(see TC-175)"
status = "Approved"
component = "CMP-006"
phase = 5

[design.LLR-181]
sr_refs = ["SR-166"]
title = "The shared helper package, and its complete arrival in a scaffold"
module = "project-trajectory/scripts/kitlib/__init__.py;project-trajectory/scripts/kitlib/config.py;project-trajectory/scripts/kitlib/git.py;project-trajectory/scripts/kitlib/registry.py"
code_symbol = "first_declared_line/read_spec_rows/git_out"
detail = "kitlib is the kit's one home for behaviours that were previously copied per script: config.first_declared_line with its two adapters (read_declared substituting a caller default, read_declared_lower lowercasing to a \"\" sentinel), registry's docs/work/ spec-folder reader (the row shape, the frontmatter/status/body parse and the ordered read), and git.git_out, the best-effort-off-git subprocess pattern that answers None on any failure and leaves the fail-direction to its caller. Themed modules, never one generic common file. Every module of the package is a bootstrap.MAPPING row, so a scaffold receives it whole; bootstrap.py imports it and imports no other sibling, and the package imports no sibling at all. The completeness of that manifest is asked of a REAL SCAFFOLD, not of this repo, because this repo's scripts/ holds every file and a partial copy would read green here and ImportError on an adopter's first check."
rationale = """Owner ruling D-8 (OI-16, inversion confirmed 2026-08-13) replaced the F5 rule, under which a shared module was rejected so each script stayed independently copy-able. F5 bounded nothing: a 2026-08-12 census found the declared-line reader with five homes carrying a false claim of equivalence, is_example with three homes one of which crashed on None, and a 270-line spec-folder reader copied verbatim into three modules — a copy that had itself drifted by the time this row landed. Equality pins could contain that class but never shrink it. The INVERSION is the load-bearing half: D-8's literal step 2 (import from bootstrap.py) is unbuildable because bootstrap.py is deliberately absent from its own MAPPING, so a shipped script importing it would raise ModuleNotFoundError on a fresh scaffold while passing in the kit — the exact failure this repo shipped once when MAPPING omitted schedule.py. So the package ships like any other sibling and the scaffolder imports FROM it. The four-component tag was never a claim that four units own one behaviour — the package is imported from every component, and which unit OWNS a shared kernel was a partition question the locked depth-0 frame did not answer on its own; that question has since resolved to ONE owning component, CMP-006, the recorded closest-fit reason being registry.py's bulk within this row's own module set (304 of 572 lines, the four files above). The four-way tag collapses to that one component; the package's cross-component consumption does not disappear, it moves to a declared shared-kernel surface (docs/kernel-modules-allow) — a per-entry recorded declaration, never a bare tag, and never special-cased to kitlib."""
test_refs = "(see TC-176)"
status = "Approved"
component = "CMP-006"
phase = 5

[design.LLR-182]
sr_refs = ["SR-144"]
title = "The lane-close terminal-outcome vocabulary, one home below its readers"
module = "project-trajectory/scripts/kitlib/station.py"
code_symbol = "Outcome/OUTCOME_DIRS/outcome_of"
detail = "The three terminal states a lane can close into, as a str-subclassing enum (Outcome), the declaring docs/work/ status directory each one is named by (OUTCOME_DIRS, immutable), the Bar-Green: attestation trailer label the station render draws, and outcome_of, which answers which SINGLE outcome a set of status directories names and answers None for BOTH ways the set fails to name one - naming no declared directory, and naming two. Reading a branch tree stays in the merge coordinator, which is where the effect belongs; this module holds only the decision, so it imports nothing and is exercisable without a repository. The merge coordinator re-exports OUTCOME_DIRS and BAR_GREEN under their former names, so no caller had to move to gain the type."
rationale = """A vocabulary that several layers read must sit below all of them. This one used to be defined in the module that claims lanes, merges branches and moves specs, which meant every reader of the table imported a mutation coordinator to reach it - including the dashboard, a render leaf that writes nothing and must not be able to. That import was an edge of the strongly connected component the runtime scripts form, and it ran in the one direction a layered system forbids outright: a view into a lifecycle service. Moving the definition down cuts the edge at its cause rather than documenting it, and it removes two modules from the cycle in one act, because the render leaf was the whole route by which the dashboard facade reached the coordinator. The component tag is single deliberately: the shared kernel's ownership question is open, but the station flow is not ambiguous - the modules that ship it are all in this component - so this row states an owner instead of inheriting a four-way usage tag that would suppress the cross-component seam rule on its own edges. The shared kernel's ownership question has since been settled elsewhere, and the reconciliation it owes this row is a recorded confirmation, not a tag move: the tag STAYS `CMP-008`, unmoved and NOT added to the declared shared-kernel surface. Unlike config/git/registry/ladder/stage, this module has exactly one real cross-component consumer - scripts/traj_panels reading the render leaf's own vocabulary - and that single edge was already given its own declared, policed seam (IF-093) authored alongside this row for precisely that reason. Folding it into the kernel declaration instead would silence an edge this row went out of its way to keep visible, for no benefit."""
test_refs = "(see TC-177)"
status = "Approved"
component = "CMP-008"

[design.LLR-203]
sr_refs = ["SR-163"]
title = "The shipped-file inventory, its declared exclusions, and its tolerant purpose reference"
module = "project-trajectory/scripts/bootstrap.py"
code_symbol = "MAPPING"
detail = """MAPPING is the declaration SR-163's own reasoning designates as the coverage universe: one row per shipped source, the destination it lands at in a scaffold, a prose comment saying why it ships, and OPTIONALLY a third cell naming the requirement that is the reason. The cell is tolerant by construction - mapping_entries normalizes every row to (source, destination, reference) and a bare pair survives as a reference of None - so filling it is a burn-down and no flag day is forced. All four of the parent's finding classes run over the inventory today; two of them are this row's own arms and are described next. STALE ENTRIES AND MISSING DESTINATIONS, in the dogfood direction: the scaffold-coverage walk reports every MAPPING destination this repository neither carries, nor serves in place out of the kit tree, nor declares as an absence, and its honesty half reports a declared exclusion whose destination has since materialized - so the exclusion list can only shrink, never mask a backfill. MISSING FILES, in the package direction: the completeness check asks a REAL scaffold whether the copied helper package holds exactly the kit's module set, naming a MAPPING row that is missing or stale, and the sibling-import closure reports a shipped script importing a file the inventory omits - the class this repository has shipped once, invisible in the kit tree because its own scripts directory holds every file. docs/declared-absences is the recorded-exclusions carrier both dogfood arms read, parsed by check_doc_refs.load_declared_absences, with a marker for the paths whose presence is a legal state. THE SHIPPED TREE, walked independently of the inventory so that deleting a row stays observable: delivery_inventory enumerates every physical file under the kit, classifies each as a MAPPING source, a reasoned kit-only exclusion or a conditional materialization, and separately enumerates the generated outputs, which inherit their generator source's reference rather than carrying a second purpose cell. Its exclusion carrier is the mechanically parsed mapping-source-exclusions, one `<source> — <reason>` row per kit-only file, the separator a literal spaced EM DASH the parser partitions on — a hyphen row is silently skipped, excludes nothing, and its source resurfaces as a gate-class missing-file finding. The installer is one of those rows rather than an exemption asserted in prose at its own module. NOT DISCHARGED, and stated here rather than left to be rediscovered: the reference cell is mostly UNFILLED, so the join the parent asks for is declared and running rather than complete - the unmapped class is warn and not gate precisely because filling it is the migration, and a coverage reading taken today measures the burn-down and not the obligation. And the consumers of the cell are undecomposed: the SR-to-need resolution, the four finding classes and the table that decides which of them warns and which gates are general mechanisms this row names as facts about the inventory without owning, and they are named by no design row's Module or CodeSymbol, so the delivered half of the parent's obligation is traceable only through its test."""
rationale = """Naming the INVENTORY, and only the inventory, is what keeps this row falsifiable. The declaration, its exclusion carrier and the two dogfood arms that walk it are this row's subject and are driven by its own tests; the resolver, the four finding classes and their warn-to-gate table are separate mechanisms that consume the cell, and a row that annexed them would be claiming a decomposition it does not make. Naming them as facts about the inventory while recording that no design row OWNS them is the load-bearing half - a design row describing only what it owns would read as though the parent's obligation were discharged the moment its own arms were, and the next reviser would have to re-derive by inspection how much of the purpose cell is actually filled and which of its consumers is traceable at all. The tolerance of the cell is the other deliberate choice: a mandatory reference would have forced a flag day across the whole inventory to buy a coverage number, where a warn class over an optional cell buys the same number as a burn-down and costs an adopter carrying no spine nothing."""
test_refs = "(see TC-199)"
status = "Approved"
component = "CMP-009"
phase = 5

[design.LLR-204]
sr_refs = ["SR-163"]
title = "The purpose-reference grammar and its declared warn-to-gate dial, running the other direction"
module = "project-trajectory/scripts/gen_arch_map.py"
code_symbol = "backlink_ids/scan_backlinks/read_backlink_min"
detail = """backlink_ids is the ONE definition of a purpose declaration in the source surface: an Implements token OPENING a line, followed by spine ids, with a line whose token is preceded by prose declaring nothing at all - the tightening that stopped two sentences denying a link from being harvested as the link. scan_backlinks runs that grammar over the declared source roots and implements_report joins its result against the live design rows; read_backlink_min reads the threshold from the one policy home, and the report WARNS at exit zero below that threshold, failing only when the caller asks for the strict arm, which the harness appends from the tests rung onward. That is exactly the warning-to-gating shape the parent's fourth clause asks for, delivered and driven end to end on a real scaffold, and shipped at a threshold that costs a repository declaring nothing. NOT DISCHARGED, in two independent ways. DIRECTION: the report asks whether each live design row is NAMED by some source declaration, while the parent asks the inverse - whether each shipped file NAMES a requirement - and a full reading here is compatible with a tree in which no file declares anything, because the two questions quantify opposite sides of the same join. UNIVERSE: the roots scanned are the declared source paths, so the grammar never sees a shipped template, registry seed, launcher, workflow or process document, which is the greater part of the inventory the parent's universe is drawn from. AND THE PARENT DID NOT COME THIS WAY. The file-to-requirement join and its warn-to-gate policy are delivered, and they ride neither this grammar nor this dial: the purpose reference is a cell on the shipped-file inventory rather than a token in a source line, its resolution to a live need is its own function, and its four finding classes are graded against a separate policy table. So this row's two gaps bound THIS mechanism and are no longer the parent's outstanding remainder - what stands here is a source-side declaration grammar and a report that reads it, useful on its own terms and not on the way to anything."""
rationale = """The mapping obligation needs three things - a universe, a binding from a file to a requirement id, and a policy deciding which finding class warns and which gates. Two of the three exist as general mechanisms that no requirement states, and naming them here is what turns the remainder into a join rather than a design: the declaration grammar already binds source to spine id and is proven to refuse the near-miss shapes that would otherwise inflate any coverage number, and the dial already proves the warn-then-gate exit contract the parent describes. Stating the direction and universe gaps on the row rather than in a session note is what stops a later reader from taking a healthy coverage percentage as evidence for a claim it cannot support: the two readings differ only by which side of the join is quantified, which is invisible unless someone writes it down."""
test_refs = "(see TC-200)"
status = "Approved"
component = "CMP-006"
phase = 5

[design.LLR-205]
sr_refs = ["SR-017", "SR-176"]
title = "The credential class vocabulary, one home below the floor and the redactor"
module = "project-trajectory/scripts/kitlib/secret_classes.py"
code_symbol = "SecretClass/SECRET_CLASSES/SECRET_CLASSES_BY_NAME"
detail = """SECRET_CLASSES is a tuple of SecretClass(name, scan_pattern, redact_pattern) rows, one per credential class (private key header, github token, github fine-grained token, slack token, aws access key id, api secret key, generic bearer token); either pattern may be None, a stated per-class decision rather than an omission. check_privacy.py's KEY_RE and TOKEN_RES and agent_common.py's _SECRET_RES are DERIVED from this table by comprehension (filtering on scan_pattern / redact_pattern respectively) rather than each carrying its own literal, so LLR-017's Scanner/KEY_RE and LLR-177's redact_secrets/_SECRET_RES code symbols still resolve unchanged. Before this table, the two consumers had compiled their pattern sets independently: driven against five samples, four disagreed in both directions - the PEM private-key class was refused at the commit hook (SR-017) but passed unredacted into a committed transcript (SR-176's own never-by-value rule, missed by omission rather than by name). The table adds no exhaustiveness claim: redact_secrets stays "deliberately imperfect - unknown token shapes pass through" by its own docstring, and the redactor's threshold is DELIBERATELY looser than the floor's on three classes (comments on the table's own rows state which and why) because a false-positive redaction costs a reader nothing while a false-positive commit refusal costs a contributor a lot."""

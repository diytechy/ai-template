[design.LLR-172]
sr_refs = ["SR-165"]
title = "Component derivation record: element completeness + the ranking recompute"
module = "project-trajectory/scripts/check_trajectory.py"
code_symbol = "component_findings"
detail = """Extends the existing component pass — the one home that already reads docs/requirements/components.toml and already emits CMP findings — with the derivation-record rules SR-165 states, rather than adding a second reader of the same registry. Per live CMP row: the record must declare the candidate partitions considered, the objective and the constraints they were scored against, a score per candidate, the selected partition, and the human ruling that named the components and adopted it; a missing element is one finding naming the row AND the element. Two derived rules on top of presence, because presence alone is satisfiable by a record that says nothing: (1) THE RANKING RECOMPUTES — re-rank the recorded candidates from the record's own objective, constraints and scores and compare with the recorded order, a mismatch being a finding, which is what makes the record falsifiable without a reviewer re-running a model session; (2) A SELECTION THE SCORES DO NOT RANK FIRST is a finding unless the record carries a human override naming that choice, so a legitimate "the scores said A, the human chose B" is expressible and an unexplained one is not. Vacuous by construction on a project declaring no components, and on the example -000 rows. NOT BUILT YET: the record cells do not exist on the CMP schema today — recorded as open debt on this row and TC-166; SR-165 carries Test verification precisely because the check is mechanizable, and this is the debt that verification incurs, recorded rather than silently owed."""
rationale = """The check belongs where component_findings already is for the reason the census keeps applying: a second module reading components.toml would be a second answer to "is this partition recorded", and the two would drift. The recompute is the load-bearing half — an element-presence check passes on a record whose scores contradict its own conclusion, which is the exact failure SN-040 exists to catch (the next reviser cannot tell load-bearing boundaries from accidents). The override arm is what stops the recompute rule from forbidding human judgement: the requirement is that a departure from the scores is RECORDED, never that it is disallowed."""
test_refs = "TC-166"
status = "Approved"
component = "CMP-006"
phase = 5

[design.LLR-173]
sr_refs = ["SR-140"]
title = "The last_approved snapshot: the record of what was blessed"
module = "project-trajectory/scripts/baseline_snapshot.py"
code_symbol = "copy_live/load_all/rows_for/exists/stamp/is_drifted/drifted_cells/unanchored_findings"
detail = """The approval RECORD SR-140 requires, sited: LLR-158's comparison basis (SR-178's drift rule) and LLR-178's mirror invariant (SR-179's refusal) are its two readers, and what make it worth recording. copy_live(root, seed=False) mirrors seven registries (the four spine tiers plus interfaces/external/components, which carry human-only approval and state cells) BYTE FOR BYTE into docs/archive/last_approved/, preserving repo-relative paths so spine_carrier.resolve/carriers/stem resolve under the snapshot root verbatim, carrier fallback included; the stale other-carrier file for a stem is deleted in the same act, or the next read raises "exists under BOTH carriers". Whole files rather than extracted rows is what makes "snapshot file == live file at the copy commit" DECIDABLE - LLR-178 carries that mirror invariant - and it is also what makes the UNANCHORED rule decidable, because the copy keeps each row's own Status cell, so a live row claiming approval whose snapshot copy reads below it is an approval that never rode a copy. Three refusals are load-bearing and each is the opposite of a convenient degrade: copy_live REFUSES to CREATE the directory without seed=True, because the first snapshot blesses whatever text is in the tree and must ride the owner's reviewed signing commit (reachable only from `intake.py snapshot --seed`); load_all returns None for an absent directory and RAISES on a file that exists and will not parse, because {} and None are opposite claims and the empty one reads as "re-bless everything with no diff shown"; and rows_for is the ONE place the None sentinel is collapsed, so no caller invents its own `or {}`. is_drifted/drifted_cells delegate the cell comparison to LLR-158's split_changed_cells and arm on the APPROVED half only. stamp() is advisory and derived FROM GIT rather than from a file, so it can never quietly become the ledger this mechanism replaced; every arm degrades to ("", ""). SR-140's two remaining record fields come from the same two places and neither is a cell: the TRANSITION is the copy's Status read against live's (the comparison above), and the ACTING REVIEWER is the AUTHOR of the commit that wrote the copy - which is why the copy must ride the approval commit and why the author is queried from git rather than stamped, since a stamped reviewer is a claim and a commit author is a record. ADVISORY TODAY: unanchored_findings returns strings and joins no failure set - it is promoted to the integrity floor at migration step 7, and not before, because against a pre-seed or pre-rename snapshot it would red every row."""
rationale = """The baseline had to leave git history. The derivation it replaces walked the registry for the newest commit at which a row read Verified, which is sound only while every amendment flips its row in the same commit - and the approval ladder deletes the flip, so the walk returns HEAD and the diff is empty BY CONSTRUCTION, on exactly the rows a sitting exists to judge. A snapshot on disk is a baseline OUTSIDE the live file, which is the one thing a walk over the live file can never be. docs/archive/ is the placement rather than an accident: check_vocab.EXEMPT_GLOBS already exempts it, and the snapshot legitimately holds the PREVIOUS vocabulary, so anywhere else reds the vocabulary enforcer on every signing. The design's own argument for whole-file copies is that a human can open the record and `git diff` it - a record only a script can read is a record only a script can audit."""
test_refs = "TC-167"
status = "Approved"
component = "CMP-006"
phase = 5

[design.LLR-174]
sr_refs = ["SR-171"]
title = "Rate-limit recognition + bounded, surfaced wait"
module = "project-trajectory/scripts/agent_loop.py"
code_symbol = "limit_reset_hint/seconds_until_reset/main"
detail = """A rate limit is recognized only on an error signal (the JSON result's is_error, or a nonzero exit for a plain-text template) whose message carries a reset wording - a healthy transcript merely mentioning limits never reads as a throttle - and it wins the outcome ladder as WAITING, bypassing the stall guard. With --wait-on-limit set, a parsed reset within that ceiling is slept and the session retried, the sleep printed with its reset time; an unparseable wording sleeps min(--limit-retry-fallback, ceiling), printed, and retries. Past the ceiling, or without the flag, the run stops at EXIT_WAITING (5) with a banner naming the resume time. Both dials are declared flags with declared defaults (0 / 3600), never in-line literals. The outcome ladder itself (WAITING ahead of every other code) is LLR-028's home; this row owns the recognition gate, the two clocks and the wait/stop fork."""
rationale = """The wait/stop fork keys on the one ceiling the human consented to, so an unbounded silent sleep is unrepresentable - the fallback nap is capped at the same ceiling for the same reason, and every arm prints what it is waiting for so a throttled run is tellable from a wedged one at the console."""
test_refs = "(see TC-168)"
status = "Approved"
component = "CMP-008"
phase = 4

[design.LLR-175]
sr_refs = ["SR-172"]
title = "Consecutive no-progress stall guard"
module = "project-trajectory/scripts/agent_loop.py"
code_symbol = "RoutingState.note_session/main"
detail = """Declared progress is a moved git HEAD: note_session resets the stall counter on a commit and increments it otherwise, so the window is consecutive and interleaved progress is never ended by the limit; a throttled (WAITING) session bypasses the counter entirely, and a timed-out one counts (it produced no commit). At --stall-limit consecutive no-commit sessions (a declared flag, default 3) the loop stops with EXIT_STALL (4) - its own exit code, distinct from success and from the error/config exits - under a STALL banner pointing at the latest iteration log. Which banner (the all-ERROR agent-unavailable wording vs the generic work stall) is stall_verdict's fork and LLR-028's home under SR-028; this row owns the counter, the declared limit and the distinct exit."""
rationale = """The counter reads committed evidence (HEAD movement), not session prose, so a session cannot talk its way out of the guard - and the reset-on-commit is what keeps the limit a stall detector rather than a slow-progress killer."""
test_refs = "(see TC-169)"
status = "Approved"
component = "CMP-008"
phase = 4

[design.LLR-176]
sr_refs = ["SR-175"]
title = "The push-channel inclusion conventions, pinned as they exist"
module = "project-trajectory/scripts/plan_briefs.py"
code_symbol = "build_surface + agent_loop.worker_prompt/critique_brief + adjudicate_brief.compose + intake.context_block"
detail = """The brief composers' inclusion rule as it exists today, pinned so the convention is falsifiable while SR-175's declared-set surface is unbuilt: plan_briefs.build_surface reads ONLY the SR and IF registries (the two-file read IS the redaction boundary - status.md, log.md and every self-assessment are unreachable because the function never names them); adjudicate_brief.compose embeds oneline/name-status logs only, never commit bodies, and excludes docs/log.md by name, as do plan_briefs and intake.context_block; agent_loop.worker_prompt clips predecessor Deliverables, an --oneline --no-decorate log and a --name-status diff at declared caps; agent_loop.critique_brief embeds SR intent, TC Parameters and the rubric files. Across the whole composing path no authorship field is formatted into any prompt: a source sweep of the composing modules and the shipped prompt templates for the authorship tokens (%an, %ae, %ad, --author, git blame, git show) finds zero hits, and that sweep is a standing test rather than a one-time measurement. NOT BUILT YET, the same debt-stating pattern as LLR-172: the declared-set surface SR-175 requires (a per-row inclusion/exclusion field on docs/agents.toml, or a process.toml dial) and the planted-credential dispatch block do not exist - this row pins the conventions that declaration will state."""

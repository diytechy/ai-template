[design.LLR-178]
sr_refs = ["SR-179"]
title = "The mirror invariant: the record is only ever written by copying live"
module = "project-trajectory/scripts/acceptance_record.py;project-trajectory/scripts/check_trajectory.py"
code_symbol = "staged_snapshot_findings/_snapshot_survives"
detail = """SR-179 is the anti-laundering half of the record, and its mechanism is a sibling of LLR-158's comparison basis rather than a part of LLR-173's record. staged_snapshot_findings(root, base, head) is a whole-commit rule, not a per-row one: in ANY commit that touches the last_approved record, every touched file must be byte-identical to its live counterpart AS OF THAT SAME COMMIT. One comparison is what makes a hand edit, a partial copy and a copy-then-amend-live all fail, and it is why no separate co-mutation guard is owed - the abandoned on-row anchor design would have needed one. It reads the INDEX and the commit-ish alike (matching _spine_revs' prefix contract), so it fires at the hook where the act happens rather than after the fact. THE DELETION ARM is the half a first reading misses and is deliberately asymmetric: _snapshot_survives is the two-line tree probe that separates a registry removed WHILE THE REST OF THE RECORD STANDS (refused - deleting the copy deletes exactly the evidence the unanchored rule reads, which is cheaper laundering than forging one) from the record going away WHOLE (silent - retirement and a wholesale replacement are both legitimate, and a rule that fired on them would make its own design undeployable). The prose README inside the record is exempt: it is not a recorded registry, and holding it to a live counterpart that does not exist would red every signing. It joins the failure set at check_trajectory's main aggregation, so unlike LLR-173's advisory unanchored arm this one is a real gate today."""
rationale = """The record is worthless if anything but a copy can write it, and "only a copy writes it" is a claim no per-row check can make - a per-row rule sees the row it is given and never the commit that wrote it. Placing the invariant on the COMMIT is what converts a convention into a decidable property. It lives in check_trajectory rather than in baseline_snapshot because the writer must not also be the judge of its own writes: the module that copies has every reason to believe its copy is faithful, and the guard exists for the cases where it is not."""
test_refs = "(see TC-173)"
status = "Approved"
component = "CMP-006"
phase = 5

[design.LLR-179]
sr_refs = ["SR-157"]
title = "EARS statement-pattern advisory"
module = "project-trajectory/scripts/trace_text.py"
code_symbol = "ears_advisories"
detail = "ears_advisories reads the opening of each non-example SR Requirement cell and reports the row when that opening is a condition dressed in a keyword outside the four EARS condition keywords (When / While / If / Where) — a bare subject (the ubiquitous pattern) and an empty cell pass. Reported in its own advisory pipe, which never joins a failure set; the scan covers Drafted rows, unlike the gating form rules in the same module, and the SR tier alone."
rationale = """EARS puts the condition in front of the subject so a reader learns when a requirement applies before what it obliges, which is also what makes the opening scannable by eye and by tool; a row opening 'Before X, the system shall …' carries the same condition where nothing looks for it. Advisory rather than gating deliberately: which pattern a row IS — ubiquitous with a qualified response, or event-driven with the trigger fronted — is a judgement about the obligation, and the same sentence can be honest in either shape, so a gating version would overrule the author on the one question the author is better placed to answer. Drafted rows are in scope because an opening is finished the moment it is written and a warn costs a drafter nothing, and because both rows this rule found at landing were Drafted — skipping them would have shipped a guard that had never once fired."""

[design.LLR-189]
sr_refs = ["SR-144"]
title = "The per-close report's shape, one home below the module that writes it and the one that refuses on it"
module = "project-trajectory/scripts/kitlib/station.py"
code_symbol = "REPORTS/CLAIMED_OUTCOMES/SUGGESTED_TIERS/SPLIT_DECIDERS/report_path/render_report/read_report/report_refusal"
detail = """The decision half of the immutable per-close record the terminal-outcome obligation requires, sited beside the outcome vocabulary it belongs to. report_path is the event identity - the work item and the branch, a pair that cannot close twice - and it is what lets a disposition dedupe on positive provenance instead of reconstructing the event. render_report writes TOML frontmatter carrying every field anything downstream keys off, typed rather than prose, so a review tier is read from a field and never from a substring of a reason. read_report parses the first frontmatter fence and answers None for all three ways it fails - no fence, unparseable, not a mapping - because every caller refuses on any of them. report_refusal is the merge slot's rung: a close claiming an outcome outside the declared set is refused, and a partial close silent about the keep and discard split is refused by name, since a close that says nothing about which of its commits should survive leaves the revert to a hand cleanup. WHAT STAYED WHERE THE EFFECT IS: writing the report, moving the specs and reverting a quarantined diff are worktree and git effects and remain in the module that performs them, which re-exports every name above so no caller moved. Stdlib only, like every module of this package, which is why the frontmatter parse calls the TOML reader directly instead of the shared script helper."""
rationale = """One sentence of the terminal-outcome obligation - every lane close is a terminal state with an immutable record - had been split across two modules, the table in the read model and the record's shape in the writer. The split was not merely untidy: the merge coordinator refuses a partial merge whose report omits the keep and discard split, so it reached up into the writer for the path and the refusal through a deferred function-body import, and that import was a back edge of the strongly connected component the runtime scripts formed. Moving the shape down to sit with the vocabulary it describes cut the edge at its cause rather than softening the header sentence that had claimed the dependency ran one way while it did not. The split of decision from effect is the same line the outcome table already draws: reading a branch tree stays with the coordinator, deciding what the tree means is a pure function; writing a report stays with the closer, deciding what a report must say is a pure function."""

[design.LLR-158]
sr_refs = ["SR-178"]
title = "The one comparison basis an amendment is measured by"
module = "project-trajectory/scripts/acceptance_record.py"
code_symbol = "split_changed_cells/spine_cell_class/_APPROVED_TEXT/_spine_row_sides/staged_spine_amendments/_approval_act/staged_approval_acts/staged_drafted_rows/lane_approval_refusal/SPINE_CSVS/APPROVAL_ACT_CSVS/OUTSIDE_THE_APPROVAL_ACT"
detail = """An approval that records what it blessed by COPYING the registries needs no canonical text to hash, no separator that cannot occur in a cell and no second exclusion list, so no digest engine sits behind this row — the comparison basis is discharged by split_changed_cells(csv_path, id_col, head, row) -> {"approved": {cell: (before, after)}, "traced": {...}}: the id column and Status are excluded STRUCTURALLY - the id is the join key rather than content, and folding Status in would make every flip read as an amendment and every amendment invisible behind its own flip - and the remainder is split by spine_cell_class, the SAME classifier the amend-without-flip guard reads, so the two can never disagree about what normative means. It is PUBLIC for exactly one reason: baseline_snapshot.is_drifted reads it as the drift basis (LLR-173), so the snapshot comparison and the staged-amendment guard are one rule with one home rather than two rules that agree until they do not. _APPROVED_TEXT names the one Status value whose row TEXT is approved (Approved — the status fold collapsed Verified and Planned into it) and requires the SAME value on both sides, so prose rewritten under an Approved row is never invisible. It returns the before/after PAIRS a brief has to render anyway, which is why it replaced a hash rather than being wrapped by one. Needs are covered by the whole-file copy rather than by a per-need projection: the three need tables have different shapes, and a projection would have hashed the garbling. ONE TWO-TREE WALK feeds every reader that asks what a spine delta did: _spine_row_sides pairs each row's before and after side once, and four consumers read it — staged_spine_amendments (the rows whose approved text moved), staged_approval_acts (the rows that crossed INTO an approval claim, or arrived already making one), staged_drafted_rows (the rows a lane authored below approval, which the first-approval mint is raised over) and lane_approval_refusal, the judgement over the second, worded for the merge slot that refuses a work branch performing an approval act. The walk is shared rather than copied so that the set one reader EXEMPTS is the set another REPORTS, MINUS the de-approvals: an Approved -> Drafted withdrawal moves Status, so the amendment reader exempts it, but it blesses nothing, so the approval-act reader does not report it and staged_drafted_rows raises the re-approval it now owes instead. Subject to that one subtraction, an approval act is invisible to the amendment reader by construction, and a row that no reader saw is unrepresentable. The per-row judgement is stated once, in _approval_act, so the flip arm and the born arm are read side by side rather than as two branches of the walk that could drift apart. UNREPRESENTABLE WITHIN A DECLARED BOUND, and the bound is named rather than left as an absence — the walk's universe is a PARAMETER over two declared sets, not one set every reader shares. SPINE_CSVS is the THREE registries whose rows carry an id column and an approved text — system-requirements, low-level-requirements, test-cases — and is the walk's default, so staged_spine_amendments and staged_drafted_rows read exactly it, the same universe the amend-without-flip warn and the intake mint hold; widening those is its own decision rather than a side effect of this rung. APPROVAL_ACT_CSVS is those three PLUS stakeholder-needs, and staged_approval_acts passes it, so lane_approval_refusal — the judgement over that reader — refuses a lane signing a NEED as readily as one signing an LLR. The need tier is inside because it is a spine tier carrying the same status vocabulary, and because the rung the approval act was moved off the writer's lane for is precisely the one a lane must not sign for itself. The three registries a snapshot anchors that no approval reader walks — interfaces, external, components — are listed in OUTSIDE_THE_APPROVAL_ACT: off-spine, their approval cells governed by their own rung rather than this one. The two lists are pinned as one exhaustive, disjoint statement, SNAPSHOTTED == APPROVAL_ACT_CSVS + OUTSIDE_THE_APPROVAL_ACT, against baseline_snapshot.SNAPSHOTTED's seven. A tier added to the snapshot therefore lands on one side or the other by a deliberate edit, and cannot reach no approval reader at all."""
rationale = """A ledger that does not parse is not an anchor at all, and every reader then falls back silently to the git-history derivation it replaced. The copy-based baseline removes that failure mode rather than hardening it: the record is a file a human can open and `git diff`. What had to be kept is the DEFINITION of a change - which cells count, and which of them are approved rather than merely traced - and that is one function, cited by both readers, rather than a hash whose inputs each reader re-derives."""

detail = """Every rule of the checker that needs MORE THAN ONE ROW to have an opinion, in one module below the engine that runs them. The four-tier orphan rules answer whether each row has the children its tier requires and whether each id it cites resolves - an SR its LLR, TC and SN, an LLR its SR parent and TC, a TC a real spine id (seam ids supplement, never replace, a spine citation), an SN at least one citing SR - and each tier now returns the same at-fault-id-and-finding pair, so the id set the rendered views flag is collected in ONE place rather than at eight append sites. The off-spine resolutions join the same way: a PB row's Refs against SR ids, LLR ids and LLR Module paths; a REPO row's DelegatedSRs against SR ids; a CMP row's PartOf and SupersededBy plus the Component tags on LLR, IF, PART and ASSET rows against the component registry; and a CMP Knowledge cell's docs/knowledge prefix against a real pack file, which is this module's single filesystem read and is named as such rather than left for a reader to find. PhaseScope resolves the delivery filter once - the requested labels plus the foundation phase every filter includes - and the require-verified status criterion is scoped by it. Emission ORDER is load-bearing and belongs to the composer: SR, then LLR, then TC, then SN, which is what the report and the console compare."""
rationale = """The engine that ran these was one 553-line function at five times the complexity limit, and the reason it could not be simplified in place is recorded in the ratchet it breached: a helper extracted INWARD is charged to its enclosing function by the same measure, so the only decomposition that pays is outward. Outward then raises the siting question, and the answer is a boundary that can be stated in one sentence rather than a line count: a rule that JOINS ACROSS ROWS lives here, and a rule that inspects one row's prose, or asks whether a FILE parses, stays with the engine and its carriers. That split is what makes the module honest about what it is - the checker's coherence half - instead of a bucket named after the function it was carved from, which is the generic-module failure this package was warned about by name. It is a plain sibling rather than a shipped-helper module for the reason the census recorded one slice earlier: the scaffolder may import the shared package and nothing else, and the checker's rules are no business of the scaffolder. The two attribute bags around the engine were typed in the same act because they are the same defect one level up - an empty class populated by assignment cannot say which fields exist, which is why two readers had to defend themselves with getattr and a default."""
test_refs = "TC-197"
status = "Approved"
component = "CMP-006"
phase = 5
[design.LLR-202]
sr_refs = ["SR-161"]
hat_refs = ["MAINTAINER"]
title = "Staged Hat-Refs amendment guard"
module = "project-trajectory/scripts/acceptance_record.py"
code_symbol = "staged_hat_refs_findings/traced_cells"
detail = """LLR-183 resolves the perspective record and derives its effective set; staged_hat_refs_findings(root) checks whether that record stayed TRUE. As a Hat-Refs arm of the amend-without-flip guard rather than a new mechanism, it reuses the amendment set staged_spine_amendments already computes and reports each row whose approved half is non-empty while Hat-Refs is absent from its traced half. THE COMPARISON IS BY CELL CLASS: a line-based comparison cannot distinguish an approved-cell amendment from an informative-cell edit that re-dates the row, so this arm keys off split_changed_cells' A5.1 split and stays silent on a traced-only edit - the perspective backfill's own shape. Scope is STRUCTURAL, not an allowlist: traced_cells, extracted from spine_cell_class, answers whether a registry declares the column at all, so the test-case tier is silent because it carries no such cell and a third registry that gains one is guarded with no edit here. Its baseline is the guard's own - HEAD versus the index over rows reading the same approved-text Status on both sides - which leaves two honest vacuities: a row minted in the same commit has nothing to compare, and a row below approval has blessed nothing to amend behind a human's back. Warn-first and never an exit code, printed only under --staged. NOT DISCHARGED: the warn fires once, at the commit that earns it, where a last_approved snapshot would make the finding STAND until answered; that baseline was declined on the timing argument this row exists to serve, and promoting the arm to a drift-tier finding is the next rung if the warn is measured to be ignored."""
rationale = """The component and knowledge views are DERIVED, and a derived view is only as true as the rows it derives from: freshness compares an artifact to its regeneration and never asks whether the source was right, so a generated page can be perfectly fresh and confidently wrong. That is the one obligation generation cannot discharge, and the measured instance is a design row that published a deleted symbol for five weeks and was caught by a census rather than by a check. Building it as an arm of an existing guard rather than as its own rule is what keeps the two from disagreeing about what an amendment IS - the same amendment set, the same cell classes, one home. Warn-first because the judgement it asks for is a re-read, not a refusal: whether a moved obligation changes which lenses bear is exactly the call a checker cannot make, and a rule that guessed it would be silenced."""

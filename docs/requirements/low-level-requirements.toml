detail = """pick_py distinguishes found from usable: it first runs each candidate, then checks that its sys.version_info meets the 3.11 floor every kit script's tomllib import needs. This rejects a Windows python3 on PATH that is the Microsoft-Store alias stub, which exists and executes nothing. It tries both .venv layouts, bin/ for POSIX and Scripts/ for a Windows-created venv, before python3 and python on PATH, so the pinned toolchain a contributor built wins over whatever ambient interpreter PATH resolves. On refusal it names every rejected candidate and its PYWHY reason rather than reporting a bare 'not found', so the front door reports clearly instead of dying deep inside the engine at an obscure import. agent-resume.cmd's :pickpy label runs the identical two-stage probe for cmd.exe, trying .venv\\Scripts\\python.exe, .venv\\bin\\python, python, then the py launcher. agent-resume.command carries no probe of its own; its whole body delegates (exec ./agent-resume.sh) and inherits the policy. Together the three root files realize, on Windows, macOS and Linux alike, the loop-resume half of SN-034's two universal contributor actions. NOT DISCHARGED: SN-034 names two universal actions and only loop resume has a root launcher today. The environment-preparation half's scripts (onboard.sh, dev-setup.sh) materialize under scripts/, not at the repository root SR-160's acceptance names (bootstrap.py's MAPPING; README.md's own 'Still owed' ledger states the gap), so the residual is recorded as a finding rather than fabricated as a citation."""

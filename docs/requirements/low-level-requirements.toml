detail = "claim: §2.3 steps 1+2 with the refusal ladder (tracked pause via agent_common.tracked_pause, dirty tree, existing branch, unsafe name, non-ordinary safety_class, off-frontier id) before a git mv + trunk commit + branch cut. finished_branches: a claimed branch whose tip holds no spec under active/<branch>/ (the closing move IS the signal). integrate_one: --no-ff --no-commit merge, trunk_step.py folded into the merge commit so it passes its own floor, check.py --jobs 0 at the declared tier on the composed tree read fail-closed (nonzero exit OR any SKIP line refuses), verdict gate per docs/process.toml [policies] review_rounds (legacy docs/review-policy read through the migration window) computed over the branch's own round files, restricted to rounds a LOGGED reviewer session produced and governed by TREE IDENTITY - a verdict counts only while it names the branch's current non-record tree at the work tip, so there is no ordering rule and no time comparison; whether an adjudication lane owes a verdict at all is docs/process.toml [attestation] adjudication_review, read through the one function the loop's round scheduler also reads - over the same input, since which copy of a branch's spec answers for it when both the terminal and the active home carry one is decided by a single declared precedence (terminal first: it is what the closing session did) that both callers ask for rather than each walking the homes in its own order. A legacy hand-authored docs/reviews/WI-<n>-REVIEW-A.md still clears the gate under the same identity rule for the length of the migration window, warning on that path, at a declared count of ONE only - a count of two declares two INDEPENDENT reviewers and one hand-authored document is one author's word, so that count has no window. The trailer is a cross-check over the newest attestation at the tree under judgement, refusing on a differing verdict word or a round count ABOVE the evidence and never on one below it - the attestation's writer is best-effort, so a stamp the evidence outruns is a missed stamp rather than a forgery, and understating cannot buy a merge the round files do not already buy. ff-only trunk advance, branch deleted on green, candidate parked on red. audit: git log --first-parent --no-merges over --since..HEAD; paths outside docs/work/, docs/log.d/, docs/log.md and the stack.ini [generated] set flag the commit. A missing stack.ini or an empty [product] test declaration refuses the merge; a red bar parks the candidate and stops the queue rather than composing past it."

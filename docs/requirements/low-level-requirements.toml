rationale = """The top rung means every declared test case PASSES, and the ruling that governs it is that no Status cell and no hand-written file may ever be the source of that claim - which left the rung with no producer at all and the ladder honestly topless. The four candidate evidence sources were measured absent: no outcome cell by ruling, the generated reports gitignored, the coverage report opt-in and deleted per run, no machine-readable test report anywhere. So the carrier is new state, and the only interesting question was what makes a committed claim believable. Binding by VALUE rather than by space or timestamp is the recorded-correction precedent applied to a measurement: a claim survives exactly as long as the thing it describes. The alternative designs died on that criterion - a timestamp cannot see an edit, a revision alone cannot see a dirty tree, and a record covering only the registries would ride any code change silently. What is NOT claimed is stated at the module: this is not a signature, and a determined author can compute a valid binding by hand. It defeats the failure this kit actually has - a green that was true once and quietly outlived its tree - and the honest sentence is that one."""

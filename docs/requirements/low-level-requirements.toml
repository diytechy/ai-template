[design.LLR-155]
sr_refs = ["SR-137", "SR-139"]
title = "The config layer: one reader, checked shape, one comparison"
module = "project-trajectory/scripts/agent_common.py"
code_symbol = "process_config/process_shape_findings/config_conflicts/ratification_level/human_holds"
detail = """`process_config` parses `docs/process.toml` once; `declared_policy` reads a dial through it with the legacy file as fallback; `process_shape_findings` refuses every line shape the hooks' sh cannot follow; `config_conflicts` returns refusal STRINGS (never raises — `dispatch.run` sits in the tick loop's caller, where an exception would rewrite an exit-code contract) covering the double-declaration, the wrong type and the out-of-range value; `ratification_level` + `human_holds` are the ordinal and the ONE comparison every consumer makes."""
rationale = """Five entry points read policy without passing through `agent_loop.main`, so the refusal has to live where the value is read. The comparison is stated once for the same reason the shape is checked: the failure modes here are silent, and a rule restated at four call sites is four chances to state it differently."""
test_refs = "TC-150;TC-151"
status = "Draft"
component = "CMP-002"
phase = 5

[design.LLR-156]
sr_refs = ["SR-138"]
title = "The legacy converter, and the one word that is not a rename"
module = "project-trajectory/scripts/bootstrap.py"
code_symbol = "migrate_legacy_config/_migrate_gate_policy/set_process_key/LEGACY_RATIFICATION"
detail = """`set_process_key` answers THREE states (`wrote`/`unchanged`/`missing`) and the write decides the delete; `add_if_missing` makes the write total. `gate-policy` gets its own arm because its single word expands to three dials, so it cannot be a one-key `LEGACY_CONFIG` row. `LEGACY_RATIFICATION` is F5-duplicated from `agent_common` (bootstrap imports no kit sibling — it must run standing on nothing but the kit directory it copies FROM) and pinned equal by `test_rule_sync`."""
rationale = """This is duplicated POLICY, not plumbing: a migrator and a reader disagreeing about what `single-ratify` meant would let a repo scaffold with one posture and run with another — which is the shadowing defect the ordinal was introduced to remove, returning through the migration path."""
test_refs = "TC-152"
status = "Draft"
component = "CMP-002"
phase = 5

[design.LLR-157]
sr_refs = ["SR-139"]
title = "The second axis: which tier is in process"
module = "project-trajectory/scripts/derive_gate.py"
code_symbol = "spine_stage/stage_to_gate/_decomposed_sr_ids"
detail = """`spine_stage` returns the LOWEST unfinished tier, where a MISSING artifact belongs to its own tier rather than to its parent (an SR with no LLR yet is stage 2, because what is being written is an LLR), `Modified` is the SR's own tier and is checked FIRST, and any other not-yet-Verified SR is checked LAST because a child in flight is the honest answer while it is in flight. `stage_to_gate` states the mapping to the harness gate once, deliberately lossy in one direction only. The value rides `docs/gate` as an APPENDED basis field."""
rationale = """Reading a missing child as the parent's tier made stages 2 and 3 unreachable during exactly the period they describe, leaving the axis unable to express the distinction it exists for. Appending rather than inserting the basis field is required: `check.py`'s basis regex depends on the existing field order."""
test_refs = "TC-151"
status = "Draft"
component = "CMP-002"
phase = 5

[design.LLR-158]
sr_refs = ["SR-140"]
title = "The digest that anchors an attestation"
module = "project-trajectory/scripts/check_trajectory.py"
code_symbol = "normative_text/sn_normative_text/digest/current_digests"
detail = """normative_text() joins a row's RATIFIED cells in header order with a unit separator, reusing spine_cell_class rather than a second list so the digest and the amend-without-flip warn can never disagree about what normative means; the id and Status are excluded because neither is content - the id is the key the digest is looked up BY, and folding Status in would make every flip look like an amendment and every amendment invisible behind its own flip. sn_normative_text() takes the RAW table line for a stakeholder need rather than a parsed projection, because the three need tables have different shapes and a projection would hash the garbling. current_digests() is the one reader that joins both halves. The WRITER and the co-mutation guard are not here yet: which cells hold the anchor depends on the registry carrier, ruled separately (OI-12)."""
rationale = """Integrity is hard because a ledger that does not parse is not an anchor at all and every reader silently falls back to the git-history derivation it replaces. Removal was the gap: it silenced all three rungs at once, so the strongest form of rewriting was the one form the guard could not see."""
test_refs = "TC-153"
status = "Draft"
component = "CMP-001"
phase = 5

[design.LLR-159]
sr_refs = ["SR-141", "SR-142"]
title = "Admission order and the red-TC census"
module = "project-trajectory/scripts/dispatch.py"
code_symbol = "_judgement_first/_admission/red_tc_census/parse_red_tc/_implemented_ids"
detail = """`_judgement_first` is a STABLE PARTITION over the frontier, applied inside `_admission` before the surface/dispatch split so it can never move work past a human-held stop. `red_tc_census` rides the existing finding-string seam with a distinct prefix; `_red_tc_line` and `parse_red_tc` sit adjacent because the grammar is a contract between two modules, and `intake` routes on the parser rather than re-splitting prose."""
rationale = """The alternative to the partition — renumbering `schedule._KIND_RANK` — would change ordering for every downstream repo for a rung that belongs to admission. The alternative to the parser is prose carrying control flow, which is the exact defect the typed `suggested_tier` field replaced."""
test_refs = "TC-154"
status = "Draft"
component = "CMP-004"
phase = 5


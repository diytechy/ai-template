[design.LLR-206]
sr_refs = ["SR-183"]
title = "Per-function cognitive-complexity and SLOC census against a central TSV baseline, both directions"
module = "project-trajectory/scripts/check_complexity.py"
code_symbol = "cognitive/census/main"
detail = """cognitive() walks one function's body by recursive descent carrying a nesting level (not ast.walk, which loses depth), adding 1 + nesting for each If/For/AsyncFor/While/ExceptHandler/IfExp/Match, 1 flat for a real else, a nesting increment with no base increment for a nested FunctionDef/AsyncFunctionDef/Lambda, one per RUN of like operators inside a BoolOp, and 1 for a recursive call. An elif chain is FLATTENED before descent: the parser nests it inside orelse, so a naive recursion both double-counts and over-nests every ladder. census() walks the declared source paths (excluding __pycache__), keying each function on (relative path, qualified name) so a module move is spelled rather than double-counted, and returns every source-function row plus a per-module public-symbol count that is emitted and never compared. main() selects only rows strictly over the threshold for baseline comparison, reads docs/complexity-baseline as tab-separated rows, compares by exact equality in both directions, prints the three sanctioned remedies on a finding, and honours no per-site suppression token from the scanned source; --report always exits 0, --restamp rewrites the baseline and compares nothing, --mode warn (the default) reports a divergence but still exits 0, and --mode enforce returns nonzero on a divergence in either direction. Standard library only. The shipped downstream template remains REPORT-ONLY: it wires no [step:complexity], so its enforce capability is exercised by this module's own tests until an adopter opts in. This repository has made that separate opt-in: its [step:complexity] in docs/stack.ini is layer=product at DevStg-Impl and runs --mode enforce over project-trajectory/scripts/ and tests/."""
rationale = """The counting rules are pinned in this module's own docstring rather than delegated, because a census whose rules live in a third-party tool has a baseline that is a property of that tool's version: an upgrade that began counting a new construct would invalidate every entry at once, with no code having changed. Keying on (path, qualified name) rather than on the bare name is what lets a function move between modules as one re-keyed row instead of appearing twice. The absence of a per-site suppression token is stated here rather than left to the implementation because it is the clause most likely to be added later as a convenience: scattered opt-outs self-replicate as new code copies them, and a central file is the only form of this escape hatch that stays auditable in one read. Landing Drafted because its parent SR-183 is itself Drafted and approving this design is the owner's act."""
test_refs = "(see TC-202)"
status = "Drafted"
component = "CMP-007"
phase = 5

[design.LLR-207]
sr_refs = ["SR-156"]
title = "The verdict record: what carries a governing verdict, and what binds it to the tree it judged"
module = "project-trajectory/scripts/kitlib/verdict.py"
code_symbol = "RECORD_PREFIXES/fold_listing/tree_identity/refresh_subject/refresh_attestation/work_tip/governing_rev/governing_identity/format_trailer/parse_trailer/round_file/session_log/branch_paths/logged_rounds/round_entries/branch_entries/declared_phases/phases_owed/round_count/format_branch_trailer/branch_trailers"
detail = """tree_identity folds raw NUL-delimited `git ls-tree -r -z` entries after dropping docs/reviews/, docs/log.d/ and docs/iteration/, and returns a 64-hex SHA-256 identity. fold_listing accepts bytes and preserves every path byte so display quoting or decoding cannot merge distinct work trees. refresh_attestation validates a station refresh from its subject, first parent, commit tree and Bar-Green trailer. work_tip peels only a verified refresh at the tip for the reset path; governing_rev is read-only and walks across commits whose non-record identity equals their first parent's, peeling any verified refresh it meets to reach one those commits would otherwise hide, and ending at the first commit whose identity differs from its parent's or at its absent-parent and depth bounds - so a branch with no refresh under it still walks. governing_identity composes governing_rev and tree_identity for the branch tip or an explicit revision, including a round's reviewed commit and a trailer's carrier; the branch argument is a branch NAME, because the peel verifies a refresh commit against the branch it names and no refresh subject names HEAD. logged_rounds joins branch-scoped round files to coordinator session logs by train and ordinal, and each round's review phase is the JOINED LOG's declared phase rather than the one its own filename carries, so a file cannot claim a phase its session did not serve; a joined key whose logs declare more than one review phase yields no round. round_entries retains only rounds whose reviewed revision governs the identity under judgement and emits phase, ordinal and verdict entries through an injected parser. declared_phases clamps the configured independent-review count to the available review phases. phases_owed returns declared phases with no drawn entry at the governing identity, independent of whether a drawn verdict parses or approves. round_count returns the largest per-phase entry count at one governing identity, so a multi-phase review cycle counts once and changed work starts a new count. format_trailer and parse_trailer carry `Review-Verdict: APPROVE|CHANGES-REQUESTED rounds=<N> tree=<64 hex>`. branch_trailers verifies each carrier against its governing identity and returns the ordered attestation sequence per tree. Readers treat unavailable repository answers according to their own fail-closed contract."""
rationale = """The merge gate asks whether a lane may merge while the loop asks which review phase the lane still owes. A shared identity, evidence join, phase span and count keep both answers on the same tree and policy. Logged round evidence is authoritative because its coordinator session establishes reviewer provenance; the self-verifying trailer is only a cross-check and cannot create an approval. Identity binding answers staleness directly and prevents ordering from promoting a verdict for different work. Separate read-only and reset peels protect both contracts: the reader may traverse identity-preserving commits, while the destructive reset path may remove only the verified refresh at its tip."""
test_refs = "TC-205"
status = "Drafted"
component = "CMP-008"
phase = 5

[design.LLR-208]
sr_refs = ["SR-170"]
title = "The per-review-scope verdict rollup: generated, checked, never an input"
module = "project-trajectory/scripts/gen_verdict_rollup.py"
code_symbol = "scopes/render/targets/_extra/main"
detail = """One file per review scope under docs/reviews/rollup/<train>.md, compiled from the round files that scope carries: ordinal, phase, reviewed sha, parsed verdict word, finding count and filename, one row each. The scope SET is the train field the round-file name parser itself returns, taken over every round file found under docs/reviews/ - not the directory layout, because a second notion of what a review scope is can disagree with the first: enumerating directories skipped the flat pre-train layout that parser supports, which produced an empty rollup directory AND a --check calling it fresh against the same empty target set. That layout has no directory to be named after, so its rollup takes a reserved stem, and the one name collision that leaves is REFUSED by name on both the check and the write arm rather than resolved by a last write - two scopes sharing one output file leave the other permanently stale. The scope is the TRAIN and not the work item, because a traincar is one review scope - a worker schedules its round only once every assigned item is built and the round covers the combined train diff, so a per-item rollup would have to invent a slice of a round that does not exist. Declared in the toolchain file's generated section, freshness-gated by --check at the commit floor, and standing down on a work branch with the rest of the trunk-owned artifacts - the one member of that set whose SOURCE a branch necessarily writes, since the round files are a lane's own committed evidence. THE WRITER THAT CLOSES THAT CIRCLE IS THE TRUNK STEP'S REGEN SET, named by the id it carries there: the `verdict-rollup` row, armed by the presence of docs/reviews/ and skipped with a printed notice wherever that directory is absent, a LEAF whose position in the dependency order is therefore free. Membership in that set is part of THIS contract and not an implementation accident, because it is the only thing that makes the exclusive-writer clause above true: a work branch stands the freshness check down and commits the round files, so a trunk step that does not run this generator leaves the artifact written by nobody, and the first commit floor that reads it reds on a staleness no lane is permitted to clear. The generator OWNS that directory rather than only writing into it: --check reports an absent file, a diverged one and an EXTRA one - a retired review scope keeping its rollup is the same lie as an out-of-date one - on normalized line endings, and the WRITE path prunes the extra in the pass that writes the rest. Both halves or neither: reporting a file the regenerator would never touch made the remedy the failure message names unable to clear the failure, which on a step sitting at the commit floor and in the trunk freshness set is an unbreakable red under a misleading instruction. It names NO governing verdict: governing is tree identity, a question about a branch's current tree that can only be answered against a repository at a moment, so every row here is a fact about a file."""
rationale = """The hand-authored per-item rollup was the merge gate's only input and nothing in the kit wrote it, so every mechanized lane stopped at a human - and because it paraphrased evidence that already existed, it was also the one artifact in the tree that was neither generated, checked nor declared while the doctrine everywhere else refuses that shape. Splitting the roles is what makes both halves honest: the gate reads the evidence, and the summary a human genuinely wants to read becomes derived state that cannot drift from it. Writing a governing verdict into the file would rebuild the retired artifact under a new name - a checked-in summary that reads as authority and is stale the moment the branch moves - so the file states facts about files and stops."""
test_refs = "TC-206"
status = "Approved"
component = "CMP-009"
phase = 5

[design.LLR-209]
sr_refs = ["SR-181"]
title = "The authoring-time stage-decrease rule: a lowering edit must carry an off-phase tag"
module = "project-trajectory/scripts/derive_stage.py"
code_symbol = "phase_rule_findings/_changed_rows/_spine_at/_by_id/_effective/_ATTRIBUTED_ROWS/_PHASELESS_KEYS/_EXEMPT_DECREASE/main"
detail = """The predicate that reads a registry edit as a scope change. It loads the live spine and the same spine at HEAD, derives the effective stage on both sides through the module's own producer, and returns nothing at all unless the live stage is strictly LOWER than the committed one - so the rule costs a comparison on every ordinary edit and only walks rows on a decrease. The one permitted decrease is the exact ordered pair DevStg-LLReqs -> DevStg-Arch (`_EXEMPT_DECREASE`), the decomposition cycle, matched as a pair and not as a destination: a two-rung drop that merely ENDS at Arch is not the permitted permutation and still fires. The attributed set is every stage-affecting input (`_ATTRIBUTED_ROWS`), not the spine tiers alone, so a component-only or boundary-only edit that lowers the reading is attributed rather than invisible; a row is attributed when it is NEW on the live side or when one of its stage-affecting cells moved, compared case-insensitively on the stripped cell. The phase a new tag must differ from is the STANDING phase, derived here as max(Phase) over the non-Drafted rows of the BEFORE side - the same basis the recorded `phase =` field is derived from, so the rule and the field cannot come to mean different things. A row carrying that standing phase is the finding; a row carrying any other phase - a new higher one, or an already-open lower one - satisfies the rule, because both are honest readings of "the scope moved". A FRAME row (`_PHASELESS_KEYS`: the boundary and partition rungs, repo-global and dropping every phase at once) has no phase cell to tag, so its finding reports the decrease and names its cause instead of demanding a cell the row cannot carry. Off git there is no before-state and the function returns the empty list rather than a complaint, the standing degradation for every two-tree rule here. The carrier is `main`'s `--phase-rule` mode: findings print as WARN and exit 0, and `--strict` alone promotes them to FAIL - the rule is deliberately not wired into any gate's strict trio, so the promotion is one call-site edit and no predicate change."""
rationale = """An edit that regresses the spine's own derived readiness while staying inside the phase the settled work already occupies is a gate standing higher than the tree shows, and nothing else in the tree can see it: the derived stage records the NEW reading as if it had always been true, and the phase field increments only because rows say so. Checking it at AUTHORING time rather than storing a counter is what keeps phase a pure function of the registries - a stored counter is a second phase concept that can disagree with the row tags, and the disagreement is unresolvable because neither side is derived from the other. The exemption is one permutation rather than a tier-wide Arch allowance, because a deep decomposition would otherwise run the phase number up for churn that regresses no scope, and widening it to a destination would readmit the two-rung regressions the rule exists for. Warn-first rather than gating on arrival: a rule whose firing has never been observed against real authoring should not be able to block a commit, and the promotion path is left as a single wiring decision so arming it is a ruling rather than a rewrite."""
test_refs = "TC-207"
status = "Approved"
component = "CMP-006"
phase = 5

[design.LLR-210]
sr_refs = ["SR-157"]
title = "The consolidation census: which queued rows are one work item, and the memory that stops the question being re-asked"
module = "project-trajectory/scripts/consolidate.py"
code_symbol = "census_draft/queue_digest/spine_digest/clusters/parse_verdict/close_refusal/archive_absorbed"
detail = """The queue-overlap pre-filter's judgement half, as a producer of one adjudication row rather than a warn. `clusters` selects the candidate set from `check_trajectory.queue_conflict_pairs` — the same three signals reported at PAIR grain so a caller reads edges instead of parsing warn sentences — widened by two signals the pair producer cannot carry: rows commissioned by one plan document or one open-item edge, and rows whose SR-Refs reach the same design-row `Module` or whose own body names the same source file. `census_draft` returns the row that cluster would mint, carrying its scope in the typed `Adjudicates` cell and its recursion guard in the typed `Digests` cell (a queue sha over the sorted id/title/needs/safety_class of the ready queue, and a spine sha over the three spine registries). Three refusals, all over typed cells: none while another judgement is queued or active; none for a queue sha a consolidation row already carries in ANY status, terminal included; and a row an earlier consolidation minted neither seeds a cluster nor may be re-absorbed. `parse_verdict` and `close_refusal` read the verdict's typed outcome block and refuse by name for any row it moves that is not queued; `restructured_text`, `returned_text` and `edged_text` are the pure transforms the two call sites write back, and `archive_absorbed` performs the absorbed rows' move to the fourth terminal folder at the mint, where the successor's id exists."""
rationale = """A census fires on a STATE rather than an event, so it re-asks its question on every idle tick unless something remembers — and each ask is a strong-tier judge session, which makes the memory the load-bearing part of the design rather than an optimisation. The memory is a registry cell and not a runtime one so that it survives the judging row going terminal: an active-only guard reads "nobody has judged this" the moment the consolidation closes, and mints the identical row forever. The module is separate from the mint for two reasons that point the same way: the decision half is testable with no repository at all, and the one allocator of a work-item id must stay the one allocator, so the arrow between the two modules runs one way and the effect lives with the allocator."""
test_refs = "TC-208"
status = "Drafted"
component = "CMP-008"
phase = 5

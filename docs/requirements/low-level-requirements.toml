detail = """The RENDERED half of the Modified/Draft attestation regime whose gate SR-049 derives. gen_open_items renders (a) every pending row of docs/requirements/open-items.toml as a decision brief and (b) every SR whose Status is Draft (approval owed) or Modified (re-attest owed) with its whole chain's per-cell before/after. Two contracts the emitted file carries: the attestation-baseline STAMP (a --since render must be reproducible by the freshness gate, or --check compares against a different history) and the check-the-baseline empty state (an auto-derived baseline sitting AFTER a pre-regime amendment renders no cells, which must never read as nothing-changed). The machine-local advisory region is masked before comparing. SCOPE and its deliberate narrowings: this module RENDERS and owns no second opinion — the attestation model is trace.reattest_model and the pending pointers are gen_trajectory.pending_block, both imported, so a disagreement with `trace.py --approve` means this view is the defect and the brief wins. NOT claimed: that the rendered page is legible or well-composed."""
rationale = """A human cannot bless a delta they cannot see, and the depth that makes a re-attest readable is a WORD-LEVEL diff — which the markdown surface this replaces could not mark, so a reviewer was asked to sign a change they could only read as a whole cell. Re-deriving the attestation model here was rejected: a second opinion that disagreed with the brief would leave the reviewer arbitrating between two surfaces. Both emitted contracts exist because their absence fails SILENTLY in front of someone about to attest, which is the worst place for a quiet failure."""

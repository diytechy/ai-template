holds_when = """The repository's workflow is the shipped reference workflow, unedited, and the hosted runner executes workflow files as its provider documents them."""
obstacle = """The runner, a provider default or an edited copy suppresses a declared run or a step (a disabled schedule, a path filter, a skipped job, a continue-on-error), and a change is shared behind a verdict no checks produced."""
falsifier = """A declared trigger with no hosted run, or a hosted job reported passing whose step log lacks the harness invocation at its declared tier."""
obstacle_hats = ["UNATTENDED-OPS"]
status = "Drafted"
standing = "active"


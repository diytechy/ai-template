# docs/requirements/assumptions.toml — THE CLAIMS ABOUT THE WORLD this kit's
# requirements rely on, and the stand-ins that answer for outside parties in its
# tests. The shipped blank form, with every cell explained, is
# project-trajectory/registries/assumptions.template.toml.
#
# TWO ROW KINDS, ONE FILE:
#
#   [assumption.DA-###]   a domain assumption a requirement's argument relies on
#   [surrogate.SUR-###]   a stand-in for outside parties in tests, named by the
#                         assumption stating its fidelity
#
# EVERY ROW HERE IS DRAFTED. Each is a newly derived claim, not a transcription:
# nothing wrote these premises down before, so each waits for its own reviewed
# acceptance act, where an assumption and the surrogate its fidelity names are
# judged together. Until one is accepted the tier's stage arm stays off, so
# these rows move no derived stage. The requirement classification, form and
# interface-bridging reports read them already, warn-only.
#
# WHERE THEY LAND. An assumption's outcome lands where a person meets the kit in
# use: the person's own crossings (B-02 authority, B-09 read) or the
# development session's, which mediates for that person (B-01 writes, B-04
# verdicts). A fidelity assumption lands on a crossing of the party its
# surrogate emulates instead. The delivered package's crossing, B-05, is never a
# landing: no stakeholder meets the kit there.
#
# The record of what was accepted (`docs/archive/last_accepted/`) holds no copy
# of this file yet, and must not be given one early: the first copy is written
# by the acceptance act that accepts this file's first row.

[assumption.DA-001]
effect_at = ["B-09"]
assumption = """A spine the strict traceability check passes with zero orphans is one a reviewer can rely on: each traced row says something a reviewer would act on, and its links are the ones a reviewer would draw."""
holds_when = """Rows are authored and adjudicated under the spine-authoring question list, and the reviewer reads the generated views rather than the raw registries."""
obstacle = """Every row resolves and every row says nothing: an orphan-free spine whose rows are vacuous, or whose links were drawn to satisfy the check rather than the argument."""
falsifier = """A reviewer new to the spine, sampling traced rows through the generated views, finds a row that says nothing they would rely on, or a link they would not have drawn."""
obstacle_hats = ["TEST-ENGINEER"]
status = "Drafted"
standing = "active"

[assumption.DA-002]
effect_at = ["B-01", "B-09"]
assumption = """A scaffold whose harness passes straight after generation is one an adopting team can work in: it can write its first registry rows and advance through its first gate without reading the kit's source."""
holds_when = """The team's stack is one of the shipped profiles, and the team reads the adoption guide before first use."""
obstacle = """A team scaffolds a repository that passes, never fills a registry, and operates a spine that resolves and says nothing, because the step from the passing scaffold to a first real row needs knowledge only the kit's source holds."""
falsifier = """A first-time team, given a shipped profile and the adoption guide, fails to reach a first filled registry without reading the kit's source."""
obstacle_hats = ["FIRST-RUN-ADOPTER"]
status = "Drafted"
standing = "active"

[assumption.DA-003]
effect_at = ["B-02"]
assumption = """A changed Status cell on a rung the declared acceptance level holds for an operator means an operator actually exercised the judgement that Status asserts."""
holds_when = """The row's rung is at or below the rung the declared acceptance level holds for an operator, and the change is committed by a person rather than by an unattended run."""
obstacle = """A Status change on an operator-held rung arrives in a commit an unattended run authored, or a person flips the cell without reading the row it accepts."""
falsifier = """A commit carrying the loop's provenance trailer that changes a Status cell on an operator-held rung."""
obstacle_hats = ["SECURITY"]
status = "Drafted"
standing = "active"

[assumption.DA-004]
effect_at = ["B-01"]
assumption = """A write the local hook floor admitted was checked: the floor was not bypassed, or a re-run of the same checks away from the session agrees with it."""
holds_when = """Commits and pushes are made through the installed hooks rather than with them skipped, or a re-run of the declared checks away from the session is in place for each change that reaches a shared branch."""
obstacle = """A commit or push made with the hooks skipped (a --no-verify commit or push, or a checkout where the hooks were never installed) admits an unchecked write, and nothing re-runs the checks before it is shared."""
falsifier = """A pushed commit carrying a secret-class match the hook would have refused, or a merged commit whose re-run checks fail while its local hooks reported a pass."""
obstacle_hats = ["SECURITY"]
status = "Drafted"
standing = "active"

[assumption.DA-005]
effect_at = ["B-09"]

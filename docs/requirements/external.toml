# docs/requirements/external.toml — THE DEPTH-0 FRAME, as rows.
#
# Three kinds of row in one file, because they are one statement: WHO is outside
# the system (`[entity.EXT-###]`), WHAT crosses its boundary
# (`[boundary.B-##]`), and which external-to-external flows exist that the
# system is NOT a party to (`[relationship.REL-###]`). Ruled at sitting 2
# (docs/plans/2026-08-13-sitting-2-boundary-and-context.md §1R, decisions 3/4/5;
# owner 2026-08-13i/l/n/o/u). The frame is LOCKED — its rows change only by a
# recorded ruling (EXT-004, B-06 and B-07 were cut by 2026-08-16q; the rows
# below are the census, restated nowhere).
#
# THE INVERSION THIS FILE CARRIES (decision 3, 13l). The boundary interfaces
# live HERE, with the entities — not in `interfaces.toml`. System requirements
# form around THESE rows; a concrete `IF-###` row in `interfaces.toml` ties back
# to one directionally (`interface_from_external` / `interface_to_external`)
# only when it REALIZES a crossing. That is what lets an SR state the boundary
# obligation while an LLR states which piece provides it, without the two
# fighting over one row.
#
# ROW IDS — READ THIS BEFORE CITING ONE. The crossings are `B-##`, the names the
# locked frame itself uses (§1R.2) and the names every ruled citation writes:
# the SR form rule (§3R) says an SR's shall names `B-01`…`B-05`, and the owner's
# tie-back naming (13m) writes `interface_to_external = "B-05"`. §1R.5's schema
# sketch wrote `[boundary.BIF-###]`; that shorthand predates the B-## naming and
# is NOT used here, deliberately — v1's `BIF-001`…`BIF-031` are a DIFFERENT set
# of 31 crossings (archived at
# ../archive/plans/2026-08-13-sitting-2-superseded-material.md, cited by id in
# the `absorbs` cells below), so reusing that prefix would recycle live ids onto
# new meanings. `B-03` is absent on purpose: it was removed at 13u when the
# status/validation surfaces were ruled adopted-toolkit outputs, not system
# outputs, and the gap keeps id and frame name aligned 1:1 rather than
# renumbering a locked table.
#
# SPENT IDS — DO NOT MINT THESE. `B-08` and `REL-004` were ALLOCATED in the v2
# frame and then cut by owner ruling on 2026-08-13 (B-08 at 13o, sitting-2 plan
# §1R.2; REL-004 folded into REL-003 at 13o, log 2026-08-13o). They are cited by
# id in a ruled plan document and in `docs/log.md`, so re-minting either would
# silently re-point that history onto a different thing.
#
# `docs/id-watermark` does NOT protect them: it reads `B = 7` and `REL = 3`, so
# the next mint from the mark is exactly `B-08`/`REL-004`. The marks were seeded
# 2026-08-17n against `git log -S` over THIS file, which was created 2026-08-14
# — four days after the two ids were cut — so the probe could not see them and
# returned empty (2026-08-17 desk round, F9/F10). Raising the marks by hand is
# REFUSED by `trace.py`'s own integrity rule ("a mark rises by allocating an id,
# never by hand"), and the first-seed exemption no longer applies now that both
# spaces carry a committed mark. Correcting a mis-computed seed therefore needs
# a mechanism the kit does not have, which is an OPEN RULING for the owner; this
# note is the interim protection, and it lives here because this file is where a
# crossing is actually hand-minted.
#
# STATUS — THE ONE VOCABULARY (decision 12, 13u; unified 2026-08-17).
# Every row here carries `status`, from this file's first commit under the
# name `approval`, because a frame with no approval element is un-ratifiable
# and the rung that reads it (`derive_gate.boundary_incomplete`) would have
# nothing honest to read. The subset this tier takes:
#
#     status = "Drafted" | "Approved"
#
# `Founded` is NOT APPLICABLE HERE, and never will be: it means settled AND
# DEMONSTRATED, and an approval says the crossing is AGREED — it says nothing
# about the crossing having been demonstrated. No predicate computes that for
# this tier, so the word would be a claim nothing can check.
#
# Decision 12 ruled ONE shared status vocabulary across every registry with
# per-registry subsets allowed, and the D-9 ladder that names its values
# (Drafted / Approved / Founded) LANDED AT MIGRATION STEP 5/5b, 2026-08-15. This
# file's half of it is exactly the rename that block predicted: `draft` ->
# `drafted`, `approved` keeping its spelling, `founded` still an ADDITION the
# boundary tier has not taken. No row's meaning changed, and `derive_gate` reads
# the drafted rung through one table (`BIF_MATURITY`), which is why the re-key
# was one line there and none anywhere else.
#
# FLIP AUTHORITY — MECHANIZED 2026-08-15 (OI-30 D3), AND IT IS DERIVED, NOT
# DECLARED. Authority over an off-spine `status` cell FOLLOWS THE DEV-STAGE
# LADDER: a cell in registry R may be machine-flipped only when R's stage rung
# is not human-held under the EXISTING `[attestation] human_ratification_through`
# dial — no new key and no new enum, because the registry-to-rung association
# already exists in `derive_gate` (`boundary_incomplete` gates DevStg-Boundary on
# THIS file; `arch_incomplete` gates DevStg-Arch on the component registry).
# `external.toml` -> DevStg-Boundary; `interfaces.toml`/`components.toml` ->
# DevStg-Arch; a status-carrying off-spine registry with NO mapping is HELD. The
# predicate is `agent_common.human_approves(docs, registry)`, beside
# `human_holds`. At this repo's dial of 4 the effect is what the prose below
# always said: THE APPROVAL VALUES IN THIS FILE AND IN interfaces.toml ARE THE
# OWNER'S TO FLIP, in a reviewed Status-change commit. No loop, no LLM verdict
# and no script may set one to `approved`.
#
# The example rows (`-000`) that ship in registries/external.template.toml are
# absent here on purpose: this is the kit's own filled registry, not the blank
# form.

# --- entities: who is outside the system (§1R.1) -------------------------------

[entity.EXT-001]
name = "Development session"
class = "operational"
description = """Human or LLM in a terminal - attended or the agent-resume loop, indistinguishable by rule - plus the user's local development environment and the working copy in its hands (shell, git client, OS, Python, editors, test runner, LLM runners). The session HOLDS the checkout; the system owns the governed state those edits become once admitted through the hook floor."""
status = "Drafted"
absorbs = "v1 EXT-001; dissolved into it: v1 EXT-005 (git), EXT-007 (OS/filesystem/Python), EXT-008 (test+coverage toolchain)"
notes = """The human is inside this entity, not beside it (13k). Reversing that is an open follow-on from decision 2 and must be stated deliberately, never drifted into."""

[entity.EXT-002]
name = "Template"
class = "deliverable"
description = """The delivered package - every *.template.*, the registries, scripts, hooks, skills and launchers - as a separate package. From an adopter's frame this package is their enabling system."""
status = "Drafted"
absorbs = "v1 EXT-002"
notes = """`deliverable` was an ADDITION to the class vocabulary (operational/enabling/interoperating did not fit an output package) and is CONFIRMED (§1R.7 item 2). Nothing gates on `class` today; it is read by the generated context view and the advisory schema tier."""

[entity.EXT-003]
name = "Adopter"
class = "operational"
description = """The downstream team and their repository. Receives the Template (REL-001); never receives this repository."""
status = "Drafted"
absorbs = "v1 EXT-003"

[entity.EXT-005]
name = "Model provider API(s) / CLI(s)"
class = "interoperating"
description = """The model services and command-line runners behind any LLM in the session - the primary builder AND the adversarial reviewers alike. They touch the SESSION, never the system (REL-003)."""
status = "Drafted"
absorbs = "v1 EXT-004 merged with the external-reviewer CLI at 13o"
notes = """A model CLI is just a model CLI, whether primary or secondary (owner merge, 2026-08-13o)."""

# --- boundary crossings: what enters and leaves the system (§1R.2) -------------

[boundary.B-01]
entity = "EXT-001"
direction = "in"
carries = """Governed writes: artifact, registry and config edits admitted ONLY through the git hook floor (privacy, format, gate checks) - the one write path from the session into the system's governed state."""
status = "Drafted"
absorbs = "v1 BIF-004/N-01, BIF-006/M-13, BIF-007-in/M-10, BIF-025/X-09, and the write half of BIF-026/M-16"

[boundary.B-02]
entity = "EXT-001"
direction = "in"
carries = """Authority: rulings, attestations and Status flips - the distinguished input the process advances on."""
status = "Drafted"
absorbs = "v1 BIF-005/M-11"

[boundary.B-04]
entity = "EXT-001"
direction = "out"
carries = """Guardrail verdicts during a session: hook-floor accept/reject and subagent_gate PreToolUse allow/deny."""
status = "Drafted"
absorbs = "v1 BIF-012/X-07, and the verdict halves of BIF-006 and BIF-026"
notes = """The honest limit belongs in this crossing's SR: a local hook floor is bypassable (git commit --no-verify), so "no unchecked write enters governed state" rests on this verdict at the moment of the act PLUS a re-run of the same bar away from that bypass (§1R.6). THE RE-RUN IS NOT A CROSSING OF THIS SYSTEM, and that is a ruling rather than an omission: a hosted runner is an ADOPTER's boundary, this system holds no design authority over whether an external runner honours the workflow it is handed, and what the system delivers is a METHOD for one to invoke - so the obligation lands on B-05 as package content, carried by SR-151 and SR-152. The EXT-004/B-06/B-07 rows that used to state it were CUT on that reading, the same argument REL-003 already applies to the model provider. Their ids are spent: never re-mint B-06, B-07 or EXT-004."""

[boundary.B-05]
entity = "EXT-002"
direction = "out"
carries = """THE TEMPLATE - the packaged deliverable. The delivered scripts' contracts (check.py, bootstrap.py + MAPPING, agent_loop.py, check_vendored.py, gen_cases.py, gen_release_checklist.py, the hooks, the launchers) are IF definitions tied to this crossing: content of the package, not separate system crossings."""
status = "Drafted"
absorbs = "v1 BIF-014/M-07, BIF-015/M-06, BIF-016..021/X-01..X-06; BIF-001/M-01 and BIF-002/M-02 as CONTENT (their invocation is the session's, 13n); the skills fan-out and docs/knowledge packs (§1R.7 item 5)"
notes = "The largest bundle in the frame, and legitimate as one under §3R: a single shall against it is permitted BECAUSE the decomposition is stated in the component details. The delivered capabilities it breaks down into are: harness verdict, scaffold + MAPPING, unattended loop, generators, hook floor, and package-wide property -- the sixth being a ruled class for a property of every delivered capability at once, which is why SR-031, SR-034, SR-035 and SR-114 each stay one row in it rather than one per capability."

# --- relationships: external-to-external, the system not a party (§1R.3) -------
# No interface vocabulary appears in these rows. That absence is what keeps
# decision 6 satisfied: a relationship is not a crossing and must never grow a
# realizing IF.

[relationship.REL-001]
from = "EXT-002"
to = "EXT-003"
kind = "hands-off"
flow = """Full template content provided and adopted into the adopter's repo - their scaffold, their loop, their hooks."""
status = "Drafted"

[relationship.REL-002]
from = "EXT-002"
to = "EXT-001"
kind = "self-adoption"
flow = """This repository's own session adopts the same delivered content and activates autonomous builds from it (agent-resume). The session then RUNS that adopted toolkit to produce PROJECT_STATE.html, open-items.html, docs/status.md, docs/gate and the console reports, and surfaces them to the human reading from that session."""
status = "Drafted"
absorbs = "v1 BIF-007-out/M-10, BIF-008/M-03, BIF-009/M-19, BIF-010/M-09, BIF-011/M-08 - the former B-03 set, moved here at 13u"
notes = """Those outputs are NOT system outputs (13u). The system delivered the generators as B-05 content; the workflow that runs them is adopted, exactly as an adopter's would be. Activating the loop from adopted content is an input into this repository's DEVELOPMENT SESSION, not into the system (13n)."""

[relationship.REL-003]
from = "EXT-001"
to = "EXT-005"
kind = "runner-surface"
flow = """The LLM runner surface, primary and adversarial alike: rate limit, auth expiry and model retirement; hostile-review briefs out and findings in."""
status = "Drafted"
absorbs = "v1 BIF-023/M-15 and BIF-024/M-14, merged 2026-08-13o"
notes = """The backoff obligation reads as a requirement on delivered loop content (B-05), exercised session-side."""

# The HATS ROSTER — this repo's declared expert perspectives, the ones every
# applicable decomposition must face (SN-036; ruled at OI-19, 2026-08-13).
#
# THIS ROSTER CURRENTLY CONTAINS SIXTEEN HATS, ALL RATIFIED OWNER TEXT — no
# provisional block remains. (History, in one clause: six shipped 2026-08-13
# under OI-19 option (a) — injection first, record second; the UX pair and the
# five aspect hats came in by Decision 11, rulings 2026-08-13q/s, at WI-453;
# the three cross-cutting lenses were drafted 2026-08-16, CONSISTENCY ruled
# that day and the other two on 2026-08-17. The growth record belongs to the
# log, not to this header.)
#
# THIS FILE IS OWNER TEXT, NOT AGENT TEXT. The sixteen ratified charters land
# as ruled owner text; MARKED FOR THE OWNER'S EDIT AT RETURN: review all
# sixteen, cut what does not earn its place, add what is missing, and rewrite
# any `applies_when` that does not match how this repo actually files work. A
# roster chosen by an agent and left unread is exactly the ceremony SN-036 was
# admitted to prevent.
#
# A HAT IS NOT A PERSON AND NOT A STAKEHOLDER ROW. It is a QUESTION that must
# be put to every decomposition it applies to. A domain expert may have no
# needs of their own, yet their perspective constrains someone else's need —
# that constraint is what a hat carries.
#
# ONE TABLE PER HAT, keyed by the hat's NAME (upper-case, `-` joined):
# `[hat.SECURITY]`. The name is the id; there is no numeric id space and
# therefore no inert `-000` example row — this file carries CONTENT, because an
# empty roster would be a form with nothing behind it. A duplicate name is a
# parse error. The reader is `project-trajectory/scripts/hats.py`.
#
# THREE KEYS, ALL REQUIRED (`hats.py` refuses a row missing any):
#
#   applies_when   The condition a composer EVALUATES to decide whether this
#                  hat is put to a given decomposition. A closed, evaluable
#                  grammar — never prose:
#
#                      always
#                      scope == "template"        (also !=)
#                      kind == "core"             (also !=)
#                      tags contains "unattended"
#
#                  Clauses join with `or` OR with `and`, not both in one
#                  expression (no precedence to guess at). A field the composer
#                  did not declare satisfies NO condition — an undeclared fact
#                  is not a true one. Today the dual-plan decomposition composer
#                  declares `tags` (the work item's Workstream + SafetyClass)
#                  and does NOT declare `scope`, because stakeholder-need rows
#                  do not yet carry a scope FIELD — that is SN-039's job, so a
#                  hat keyed on `scope` stays silent until that field lands.
#   asks           The question put to the decomposition, in the second person.
#                  This is the text that lands in the brief.
#   listens_for    The FAILURE CLASS this hat catches. A hat that names no
#                  failure is refused as ceremony.
#
# ABSENCE IS OPT-OUT, MALFORMED IS A REFUSAL. Delete this file and every
# composer proceeds without hats; leave it here broken and the composer refuses
# loudly rather than quietly decomposing with no perspective at all.
#
# WHAT IS NOT BUILT YET (stated so its absence is not mistaken for coverage):
# SN-036 also requires a per-decomposition RECORD of which hats were applied and
# what each produced. Injection is the half that changes what decompositions
# produce; the record only proves it happened, and it is a later artifact class.
# Nothing gates on a hat today.
#
# THREE KINDS OF SILENCE, AND WHICH HAT IS IN EACH TODAY (the first two ruled
# 2026-08-13s and executed at WI-453; the third added PROVISIONALLY on
# 2026-08-16 under the WI-467 blind-re-derivation's finding R-3 — OWNER TO
# RULE). The reach counts below are `hats.py audit` output, not narration.
#
#   1. SILENT BY DESIGN — opt-in by tagging: LEGAL and DATA-PROTECTION. Each
#      keys on its own tag, ships OFF, and switches on the moment this project
#      tags work with it — no `enabled` field, using the grammar's own rule
#      that an undeclared field satisfies no condition. That silence is a
#      choice, and here it is now SPENT: the 2026-08-16 need tags wake LEGAL on
#      one need (SN-011) and DATA-PROTECTION on two (SN-006, SN-009). Neither
#      is silent in this repo any more, which is the opt-in working rather than
#      a change of kind.
#   2. SILENT BY DEFECT — FIRST-RUN-ADOPTER, as ORIGINALLY written: it keyed on
#      the `scope` field SN rows do not carry (above), so no clause of it could
#      ever fire on a real row. FIXED at WI-453 — it keys on the deliverable
#      tags real work actually carries, and reaches ten needs. Nothing in this
#      roster is silent by defect today.
#   3. SILENT BY DOMAIN — SAFETY, the one hat still silent here (reach zero: no
#      row carries the `safety` tag). Its predicate is sound and its opt-in
#      deliberate, but its failure vocabulary — harm to a person, property or
#      the environment — has essentially ONE reachable referent in a
#      developer-process kit (identity exposure), and that one is already
#      SECURITY's and DATA-PROTECTION's declared subject. Switching it on here
#      buys one strained row and a great deal of ceremony, which is exactly
#      what SN-036 was admitted to prevent. It is RECORDED rather than cut,
#      because the charter is real product for an adopter whose system can hurt
#      someone; the owner rules whether SAFETY stays in THIS repo's roster or
#      ships only in the template.
#
# IN NONE OF THE THREE: ACCESSIBILITY and PERFORMANCE. The owner ruled them
# `always` on 2026-08-16 — "in general those should always be considered; the
# cleanest option" — so neither is opt-in by tagging any more and neither is an
# example of any silence above. They still sit in the aspect block below
# (declared order is stable on purpose) with the ruling noted on each row.
# A reader must never have to guess which kind of silence a silent hat is.
#
# VALUES-DIVERGE NOTE (the kit's dogfood rule): in THIS repo the two UX hats
# are `always`, because PROJECT_STATE.html / open-items.html are real,
# owner-facing surfaces the session reads under REL-002; the SHIPPED template
# gates them on `render`/`ui` tags, since not every adopter has a UI.

[hat.SECURITY]
applies_when = "always"
asks = """What secret, credential, or irreversible action does this touch — and which requirement says who may reach it?"""
listens_for = """A decomposition that spends a secret, or takes an action nothing can undo, with no requirement naming the authority for it."""

[hat.FIRST-RUN-ADOPTER]
applies_when = 'tags contains "scripts" or tags contains "templates" or tags contains "process"'
asks = """Does this hold for a stranger with only the shipped README and examples — no context from this project, no one to ask?"""
listens_for = """A requirement only satisfiable by someone who already knows this project: an undocumented convention, an example that does not run as shipped, a step whose prerequisite is never stated."""

[hat.UNATTENDED-OPS]
applies_when = 'tags contains "unattended" or tags contains "loop"'
asks = """What does this look like at 3am with no human — what happens when its input is missing, stale, or half-written?"""
listens_for = """A failure that pages nobody: a silent degrade, a partial write left behind, an unbounded retry, a green that is green because nothing looked."""

[hat.CROSS-PLATFORM]
applies_when = 'tags contains "scripts" or tags contains "launcher" or tags contains "shell"'
asks = """Which of Windows, macOS and Linux breaks this — path separators, line endings, console encoding, shell quoting, case sensitivity?"""
listens_for = """A rule that is true only on the author's platform and shipped as if it were universal."""

[hat.MAINTAINER]
applies_when = "always"
asks = """Can a reader two years from now tell why this exists, and what would break if they deleted it?"""
listens_for = """A requirement whose reason lives only in the session that wrote it, leaving the next reviser unable to tell load-bearing from accident."""

[hat.TEST-ENGINEER]
applies_when = "always"
asks = """What mechanical check fails if this is quietly violated — and can that check be shown to fail when it should?"""
listens_for = """An obligation with no enforcer, or an enforcer that passes because it never actually looks at the thing it claims to check."""

[hat.UX-DESIGNER]
applies_when = "always"
asks = """Who reads this surface, what decision are they making on it, and does the layout put that first?"""
listens_for = """A surface that renders every fact it has instead of the one the reader came for."""

[hat.UX-ENGINEER]
applies_when = "always"
asks = """Does this hold up at the real widths, themes and content volumes — and what does it do when the data is empty, huge, or malformed?"""
listens_for = """A view verified only by reading its generator, never by looking at it rendered."""

[hat.SAFETY]
applies_when = 'tags contains "safety"'
asks = """How can this harm a person, property or the environment if it behaves incorrectly, and what requirement bounds that harm?"""
listens_for = """A hazardous outcome with no requirement naming its bound, or a mitigation asserted with nothing verifying it."""

[hat.LEGAL]
applies_when = 'tags contains "legal"'
asks = """What licence, contract or regulation constrains this, and does the decomposition record which obligation each part discharges?"""
listens_for = """An obligation assumed to be someone else's, or a dependency whose licence terms nothing states."""

[hat.DATA-PROTECTION]
applies_when = 'tags contains "personal-data"'
asks = """What personal data does this touch, on what basis, for how long, and who can reach it?"""
listens_for = """Personal data crossing a boundary with no stated basis, retention limit or access rule."""

# RULED `always` 2026-08-16 (owner, in session), out of the tag-gated aspect
# set above it: accessibility should always be considered, so gating it on an
# `a11y` tag only bought the chance to forget the tag. The `a11y` tag on SN-023
# is kept as SUBJECT metadata — it no longer ROUTES this hat to that need,
# because nothing needs routing when the charter is unconditional.
[hat.ACCESSIBILITY]
applies_when = "always"
asks = """Can someone using a keyboard, a screen reader, or a low-vision setting complete this — and is that stated as a requirement rather than hoped for?"""
listens_for = """A surface whose acceptance names only how it looks to a sighted mouse user."""

# RULED `always` 2026-08-16, same ruling and same reason as ACCESSIBILITY: a
# budget is a thing you declare BEFORE you find out you needed one, so the
# question belongs on every decomposition rather than on the ones somebody
# remembered to tag. The `perf` tag on SN-027 is kept as SUBJECT metadata; it
# routes nothing now. The QUESTION is conditional even though the hat is
# unconditional — "does this need a bound" is answerable "no" in one line,
# which is what keeps an always-on budget lens from presupposing a budget for
# every subject and colliding with SN-012's right-sizing.
[hat.PERFORMANCE]
applies_when = "always"
asks = """Does this need a measurable performance or size bound? If yes, what is the budget, measured on what, and what happens when it is exceeded?"""
listens_for = """A material speed or size risk left unassessed, or a declared budget with no measurement behind it."""

# RULED `always` 2026-08-16 (owner, in session), out of the provisional block
# below it — the R-4 finding accepted as stated. The roster carried no coherence
# charter: three independent derivations (needs-only, frame-only, hat-aware)
# failed to produce SR-053's cross-view uniformity obligation, and §4.1 called it
# the one row UNDERIVABLE rather than merely underived. UX-DESIGNER asks about
# one surface's priority and UX-ENGINEER about one surface's conditions; neither
# asks whether two surfaces agree. This repo has at least three status-bearing
# surfaces (the dashboard, the open-items view, console reports) plus the
# template/instance dogfood obligation, so the drift this catches is the drift a
# reader experiences as untrustworthiness. Unconditional rather than tag-gated
# for the reason the whole provisional block gives: the finding WAS
# unreachability, so a tag would reproduce the defect the charter answers.
[hat.CONSISTENCY]
applies_when = "always"
asks = """Where else does this same fact, state or action already appear — and does this render it in the same words, the same vocabulary and the same idiom as that one?"""
listens_for = """One meaning given two treatments: a status word that differs between the console and the dashboard, one concept with two colour or shape vocabularies, an interaction idiom that changes where the underlying structure does not, a rule the template states one way and the instance another."""

# RULED `always` 2026-08-17 (owner, in session), closing the provisional block:
# *"keep both, as long as they can be opted out of downstream users I tend to
# think default always is fine. Easy to change later."* Both were drafted on
# 2026-08-16 from the WI-467 blind-re-derivation's roster findings R-5 and R-6
# (`docs/plans/2026-08-16-derivation-alignment.md` §4.3; team C's report §2.5),
# and each is `always` for the reason the finding gave: the lens was
# UNREACHABLE in both cases, so a tag-gated charter would reproduce the defect
# it was drafted to answer. Ruled on their own findings, not as a pair and not
# on R-4's precedent.
#
# THE OPT-OUT THE RULING CONDITIONS ON, stated so a downstream reader can find
# it: this file is SEEDED from the shipped template and then PRESERVED — the
# scaffold writes it once (`bootstrap.copy_if_new`) and re-sync never
# overwrites it (RESYNC_PACK "Preserve always"), so an adopter's edits survive
# a kit upgrade. Narrow a charter by rewriting its `applies_when` predicate;
# remove one entirely by deleting its block. If that ever stops being true,
# this ruling's premise is gone and both rows are worth re-reading.

# R-5 — atomic writes, bounded claims and crash recovery reach a decomposition
# ONLY through UNATTENDED-OPS, which is tag-gated. An attended session that
# half-writes a registry gets no lens at all, though the corruption is
# identical and the next reader is the same reader.
[hat.INTEGRITY-RECOVERABILITY]
applies_when = "always"
asks = """If this is interrupted mid-write — a kill, a crash, a lane that dies holding it — what does the next reader find, and what gets the system back to a state it can name?"""
listens_for = """A durable artifact updated in place with no all-or-nothing guarantee; a claim or reservation nothing can reclaim once its holder is gone; a recovery path written only for the unattended run when the same corruption is reachable attended."""

# R-6 — every other charter in this roster is engineering-side. None asks whether the
# thing being hardened is still the right thing, which is why SN-033 (the one
# need explicitly about a stakeholder's own comprehension) landed text-only:
# no hat professionally owned it. A roster excellent at hardening a
# decomposition and blind to a decomposition hardening the wrong thing is a
# roster that will be thorough about the wrong work.
[hat.PRODUCT-FITNESS]
applies_when = "always"
asks = """Who asked for this, which stated need does it still serve, and would the person who asked recognise this as the outcome they wanted?"""
listens_for = """A decomposition faithfully hardening the wrong thing: an obligation no stakeholder can be named for, a need whose subject has moved while its text stayed, work justified by the machinery it continues rather than by an outcome anyone wants."""

(a) IS THE DESTINATION, RECORDED AS SUCH AND NOT TAKEN NOW. A gate that reads the tree being committed is strictly more honest than one that reads the tree on disk. It is refused today on cost rather than correctness: it would convert nine scripts whose contract is "a pure function of a directory" into scripts that read git objects, and that contract is what lets the whole freshness tier be tested against a temp scaffold.


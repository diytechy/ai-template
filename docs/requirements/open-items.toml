- 4 - LLR definition in work
- 5 - TC definition in work
- 6 - implementation in work
- 7 - all complete; release checklist and formal version tagging available

The owner adds: the ladder -would also correspond with the level of automation the user would approve-, and the stage identity could be a STRING rather than an integer (-more robust and more readable-). Historical documentation may be updated wholesale: -the meaning is the same, and if history is really desired git can be referenced-; leaving the archive unconverted is the alternative, at the cost of being -harder to read / compare.-

### What measurement says about tractability, 2026-08-12

- THE AXES ARE ALREADY DECOUPLED IN PRODUCTION, which is the fact that turns this from a rewrite into a migration: `spine_rules.stage_to_gate`'s own docstring states -Nothing derives the gate FROM the stage in production.- The gate is one 4-value enum plus its readers, renamed and re-pointed; the stage machinery already computes independently.
- The REAL edit surface is ~201 files carrying ~2,538 tags, out of 5,231 raw tags in 538 files - history and generated surfaces (okf, dashboards, report) fall away or regenerate free. Five files carry 502 of the tags: `spine_rules.py` (129), `check.py` (111), the registry-machinery reference (119), `PROCESS.md` (81), `PROCESS_OPTIONS.md` (62).
- SIX CONTRACT BREAKS, and they are the expensive part: (1) `check.py --gate {DevStg-Reqs,DevStg-Tests,DevStg-Impl,all}` argparse choices - a downstream-visible CLI; (2) `docs/stack.ini [step:*] gates=` - a value adopters AUTHOR; (3) the WI `bar:` frontmatter enum, refused by two scripts; (4) the `[phase]-[gN]` WI-title archetype - 20 live anchors plus review-directory names; (5) the `docs/gate` basis-line format - precedent exists and is five days old: -field-compatible, not value-compatible-, one forced regenerate; (6) `LOG.template.md`'s Gate Sign-offs table, which ships downstream and has no obvious eight-rung successor.
- TESTS: 137 of 2,167 test functions carry a G-tag across 36 modules; 11 modules assert gate SEMANTICS (the min-fold, the window arithmetic, the per-gate step plans, the ratification matrix) and need genuine rewriting, not relabeling.
- THE WORD -gate- IS NOT THE TAG: ~3,400 word-occurrences, and whole modules (`test_env_gates`, `subagent_gate`, `check_perf`) use it in the unrelated sense of -a check that can fail.- The TAGS die; the word survives where it means that. A blanket find-replace would destroy working code - the sweep must be tag-scoped.

### ONE TAG, THREE READINGS - the ambiguity is worse than the stage-number conflation

The owner's stated reason for killing the tags is that gate numbers get conflated with stage numbers. Measured 2026-08-12, there is a SECOND ambiguity inside the gate axis alone, and it is the one that makes the current definition hard to hold in the head:

- APPROACHING, in `docs/gate` - the file's own header: -The value on the last line is the gate that must next be PASSED.- It is also the strictness selector, on the reasoning -you are held to the bar you are trying to clear.-
- PASSED, in the sign-off records - `## Gate Sign-offs` reads -DevStg-Reqs - Requirements/UX/Constraints | MET 2026-07-07- and the log carries -RATIFICATION - DevStg-Impl - Human sign-off.- There the tag names a boundary already cleared.
- ALREADY-PASSED-BUT-STILL-HELD, at the top rung - `stage_to_gate`'s docstring: stage 5 -has already passed DevStg-Impl ... so it stays held to the DevStg-Impl bar rather than reporting a gate the harness does not know.- Neither of the first two readings.

THE TWO ARE LIVE AND CONTRADICTORY IN THIS REPO AT THIS MOMENT: `docs/gate` says `DevStg-Reqs` (not yet cleared, drafting needs at `stage=0`) while the sign-off table says DevStg-Reqs MET 2026-07-07 (cleared five weeks ago). Both are correct under their own reading. A reader who knows only the tag cannot tell which is meant, and the owner - who wrote the model - reports forgetting which way it points.

That is an argument the ruling did not previously have: the tags are ambiguous WITHIN their own axis, not merely against the stage axis, so retiring them removes two conflations rather than one. It also sets an acceptance bar for the replacement - a rung name must be unambiguous about whether it describes a state or an event, which -stage 4, LLR definition in work- is (a state, always) and -DevStg-Tests- is not.

### WHERE THE LAYERS END - the recursion question, raised by the owner 2026-08-12

The ladder implies a recursion the owner spotted immediately: if stage 1 is boundary, 2 is architecture and 3 is component requirements, then stage 4's LLRs are -implicitly describing the architecture of a component- - so is that another whole level of boundary, architecture and requirements, and -where do the layers need to end-? The repo already answers this, in three parts that fit together.

- IT RECURSES IN SCOPE, NOT IN TIERS. `PROCESS_OPTIONS.md` section 10 (scale-ladder rung 2) rules it: -No new machinery, just partition the spine- - a multi-module repo is the SAME four tiers grouped by the `LLR.Module` and `SR.Area` columns that already exist, and -`IF-###` applies WITHIN a repo, too-, with the counterpart naming the other module. Going a level down adds a PARTITION and new seam rows, never tiers 5, 6, 7.
- THE TERMINATION CRITERION IS ALREADY MECHANIZED, and it is OI-20's rule: an LLR is discharged when a token in its `CodeSymbol` BINDS to a real symbol. That is the definition of the bottom, not bookkeeping - a requirement that still needs allocation to sub-parts is an SR for that sub-scope; one that binds to code is the floor. Ruling OI-20 therefore also rules where decomposition stops.
- TIER IS A ROLE, NOT A DEPTH. An SR is what a component must PROVIDE at its boundary (externally observable - the owner's own framing for `CompReqs`: -the outcomes of the system are really at the boundary level, and are strictly what the system must provide to accomplish the stakeholder requirements-). An LLR is how the inside is REALIZED, which is why it binds to code. Both roles exist at every scope, which is exactly why the spine partitions instead of deepening. Designing a component's internals PRODUCES LLR rows plus new IF rows where internal seams appear: the ACTIVITY recurses, the ARTIFACT TIER does not.

TWO CONSEQUENCES FOR THIS RULING:

- THE LADDER MUST NOT CARRY DEPTH, and the OWNER'S OWN TWO CANDIDATE LADDERS resolve here (2026-08-12): a fully depth-ambivalent ladder (Needs/Boundary/Architecture/LayerReqs/Tests/Implement/Release) versus a subcomponent-ambivalent one adding `SubArcitecture` and `SubCompReqs`. TAKE THE FIRST ON DEPTH-AMBIVALENCE - its internal ordering (architecture before the requirements rung) is itself superseded by THE RECOMMENDED LADDER section, which reverses those two. The second contradicts machinery the kit already ships - `PartOf` makes depth a property of the COMPONENT TREE (membership is tagged at the finest enclosing CMP and coarser membership DERIVES), so adding sub-rungs would make depth a property of the REQUIREMENT TIER as well, which is two homes for one fact. It also fails on its own premise: if the sub-rungs recurse -in theory infinitely- then at depth 3 the name -Sub- is describing sub-sub work, and if they do not, depth is capped at two - which the Core evidence refutes outright, since its real chains run FIVE to SIX levels (platform, robot definition, assembly, part; and repo, package, node-plus-logic, class, method). A depth-bearing identifier (`DevStg-4.1-...`) additionally reintroduces the numbering hazard question (1) just eliminated, and makes -what stage is the project in- unanswerable when one branch is two deep and another four.
- WHAT THE SUB-RUNGS WERE REALLY BUYING is the owner's APPROVAL-BUBBLING concern - that a deep change re-engages the human - and it belongs on the dial, not in the rung names. Sub-rungs encode exactly ONE cut (system versus below) and cannot express -human through depth 2-. The bubbling exists because `human_holds` compares the PROJECT AGGREGATE stage to the dial level, so anything that drops the aggregate re-engages the human wherever it happened. Two fixes stack: key approval to the DEPTH AND TIER OF THE ARTIFACT TOUCHED rather than the aggregate, and carry depth as a derived companion (`stage-depth=5`) so a reader distinguishes a leaf refinement from a system-level rethink. Core's narrow-waist heuristic (6 or fewer interfaces per assembly) gives the natural granularity for where such a cut should fall. Depth is a structural property of the artifact tree; the ladder is a project-level progress axis entered once and exited once. Its exit criterion is not -N levels done- but -every leaf requirement binds to code, and every internal seam carries an interface row.-
- THE NEW RUNGS ANSWER THE RECURSION FOR FREE, ON ONE CONDITION. `spine_rules` is already a MIN-fold - the least-mature row picks the value - but it folds only over SN/SR/LLR/TC today, which is why rung 1 has no machine-readable state and rung 2's `CMP.State` is read by nothing that gates. ONCE IF AND CMP ROWS JOIN THE FOLD, a newly identified sub-component landing a Draft `CMP` row and an uncovered seam DROPS the reported stage back to Architecture, at a lower scope, with nobody deciding to. That is the honest report and it is self-maintaining - so the recursion needs no ladder machinery at all. The recursion question and the two-new-rungs question are ONE question, and folding those two registries into the maturity computation is the work that answers both.

### THE RECOMMENDED LADDER AND WHAT EACH RUNG MEANS - the ordering question resolved

The owner asked two things 2026-08-12: how LLRs get architected and whether that is its own rung, and whether architecture belongs BEFORE or AFTER requirement definition. Both resolve, and the second CHANGES the draft ladder.

REQUIREMENTS COME BEFORE ARCHITECTURE - the owner's own instinct is correct. Architecture is a RESPONSE to requirements: a scope is partitioned in the way that best satisfies its obligations, so partitioning first means partitioning against nothing but the frame, which is the failure (A2) was refuted for one level up. The alternative reading - that a boundary declaration already carries its constraints, so architecture could precede - does NOT hold, because an interface and a requirement say different things: an interface says WHAT CROSSES (direction, counterpart, contract, type), a requirement says WHAT MUST BE ACHIEVED. -Power crosses at 12V plus/minus 5 percent- is an interface; -the system shall run 8 hours on one charge- is a requirement that CONSTRAINS that interface without being derivable from it.

THE RESTATEMENT WORRY IS REAL, AND ITS MIRROR IMAGE IS ALREADY MEASURED. The owner's fear that requirements -will just restate the boundary constraints themselves- is the same leak OI-14 part B found running the OTHER way: 8 interface rows now speak in requirement voice. The tiers already bleed into each other, so the distinction has to be stated in BOTH directions - which is part B's job, and is why these two items stay coupled.

SYSTEM REQUIREMENTS AND COMPONENT REQUIREMENTS ARE ONE RUNG, NOT TWO. They are the same tier at different depths - the system is simply the depth-0 component, which is exactly what the `PartOf` membership rule already encodes. Splitting them into separate rungs would put depth back into the ladder, which this item ruled against on other grounds.

WHAT IS GENUINELY SPECIAL AT DEPTH 0 IS THE BOUNDARY, NOT THE ARCHITECTURE - and this is the correct form of the owner's -depth ambivalent below the first layer- instinct. Every boundary below the top is PRODUCED BY a partition; only the system's own frame comes from the needs and the context. So rung 1 happens ONCE and the recursion lives in the two rungs after it. The repeating unit is therefore two steps - state the obligations at the current boundaries, then partition them into sub-boundaries - and a partition IS the next level's boundary declaration, which is why boundary and architecture do not both need to recurse.

THE LADDER:

- 0 NEEDS - vision and stakeholder needs in work.
- 1 BOUNDARY - the system's frame: what is outside, what crosses, each crossing typed. HAPPENS ONCE.
- 2 REQUIREMENTS - the obligations at the current level's boundaries, system and component alike. RECURSES.
- 3 ARCHITECTURE - partition each scope into sub-boundaries. RECURSES; exits when no child needs partitioning.
- 4 LLREQS - the inside of a leaf, bound to a realization artifact (a code symbol, or a part source). TERMINAL.
- 5 TESTS - 6 IMPLEMENTATION - 7 RELEASE.

LLRs ARE NOT ARCHITECTED AND NEED NO RUNG OF THEIR OWN. Rung 3 recurses to whatever depth the system needs; rung 4 is where it STOPS. The test is the one OI-20 already mechanizes: if a requirement still needs allocating to parts it is a rung-2 requirement for that sub-scope, and if it binds to a realization artifact it is an LLR. So -how does an LLR get architected- has a clean answer - it does not, and if a row seems to need it, the row is MIS-TIERED.

COMPATIBLE WITH OI-14, and the reconciliation is worth stating because that item's ruled sequence reads differently at a glance: boundary, first-cut functional decomposition, PARTITION, write SRs, RE-SCORE. That is NOT partition-before-requirements. The -first-cut functional decomposition- IS rung 2's first pass (its own words: -what the system must DO, as signals, from the needs-), and the RE-SCORE is the LOOP rather than a rung. The ladder carries the dominant DEPENDENCY; the min-fold carries the ITERATION, because refining a requirement that invalidates a boundary drops the reported stage back to 3 by itself.

ONE HONEST CONSEQUENCE TO ACCEPT: the ladder is NOT MONOTONIC. Rungs 2 and 3 oscillate as the recursion descends, so any progress display will move backward - which is the truth about iterative decomposition rather than a defect in the report. If a monotonic reading is wanted, it is a SECOND derived number (a high-water mark) shown BESIDE the honest one, never instead of it.

LABEL CONSEQUENCE: the draft set becomes Needs / Boundary / Reqs / Arch / LLReqs / Tests / Impl / Release - `CompReqs` loses the -Comp- (it covers system and component alike) and swaps places with architecture. Still eight rungs.

### The two inserted rungs are the honest cost, and they are OI-14 promoted into the ladder

- Rung 1 (boundary interfaces in work) has NO machine-readable state today - OI-14's own words: the boundary step has no home, and `interfaces.csv`'s only candidate state column is an undeclared defect awaiting the OI-14 part B schema tier. The rung needs a completeness predicate (every external crossing typed and covered) that must be built.
- Rung 3 (architecture in work, after requirements per the canonical ladder) has exactly one machine-readable candidate, `CMP.State` - currently read by NOTHING that gates (the dashboard renders it, that is all) - over a 5-component partition OI-14 calls an accident and schedules for re-derivation. (Rung 2, requirements, needs no new state - the SR tier already carries it.)
- Rung 7's -formal version tagging- machinery DOES NOT EXIST: `gen_release_checklist.py` has one CI call site (tag-triggered), is not freshness-gated, and has never been run in this repo; there is no tagging, no changelog, no release version anywhere (OI-27 measured the same absence from the re-sync side).
- SEQUENCING FOLLOWS: this program lands AFTER OI-14 part A. Ruling the partition and boundary first gives rungs 1 and 2 the artifacts they gate on; landing the ladder first would ship two rungs computed from nothing.

### The insert hazard, with a five-day-old precedent

The 2026-08-12 rework inserted one rung and its own basis-line docstring records the failure mode: a cache written before it carries `stage=4` meaning done, which now means implementation in process. That insert was saved by a coincidence (`human_holds` answers identically for stages 4 and 5 at every level). Inserting rungs at positions 1 and 2 shifts EVERY number above them with no saving coincidence - under an integer ladder, every cached stage and the automation dial's comparisons go silently wrong in the direction of LESS human involvement. This is the strongest single argument for the string carrier."""
blast_radius = """A KIT VERSION BUMP WITH A MIGRATION - and the owner has softened that cost explicitly: every adopter is inside the owner's own development sphere, nothing is released beyond it, so a breaking conversion is acceptable. The adopter-side recipe is OI-27's inaugural migration-registry row.

- HISTORY: ~1,584 tags in historical surfaces. `docs/okf/`'s 37 (603 files) regenerate FREE; the real mass is `docs/log.md` (641) and `docs/archive/` (553 across 132 files). Mechanically sweepable EXCEPT ~30 sites that are ATTESTATION QUOTES: the 9 `docs/ratify/` briefs quote registry cells byte-for-byte at a pinned baseline (18 hits), and the log's dated sign-off entries record a named human ratifying a thing CALLED DevStg-Reqs/DevStg-Tests/DevStg-Impl at the time. Rewriting those makes the record claim something was signed that was not - the one place the owner's -the meaning is the same- does not quite hold, and git-referenced history does not fix a quote that now misquotes.

- THE RESOLVING DEFINITION, and it is domain-neutral: COMPONENT is the coarse swappable boundary that owns an interface contract, a test rig, a budget and an owner (an assembly OR a package, interchangeably); MODULE is the fine implementation home a requirement discharges into (a source file OR a part source, interchangeably).
- -ONE BOUNDARY, FOUR VIEWS- - Core's organizing principle, and the reason no hardware component TYPE is needed: -Cut the robot so that each assembly is simultaneously a mechanical unit, an electrical node, a software sub-graph, and a registry `Module` - one boundary, one interface contract, one test rig, one owner.- The four views live on the INTERFACE (Mechanical mount/mate/joint, Electrical connector/pinout/rail, Network bus/protocol, Software message/topic schema), not on the component. Boundary placement is the NARROW-WAIST RULE: -place a boundary where the fewest signals cross- - target 6 or fewer IF rows per assembly.
- IT REFUSES THE HARDWARE-CONTAINS-SOFTWARE RECURSION, explicitly: -An assembly = mechanics + local board + firmware, one tracked unit, one IF contract, gated together.- The worked instance is the owner's own example: a bought stereo camera with an 800 Hz IMU running vendor firmware and per-serial factory calibration hangs off ONE capability row and ONE interface row, not a nested tree. The recursion is dissolved by boundary PLACEMENT rather than by adding a level.
- THE MODEL BREAKS AT MADE-VERSUS-BOUGHT, NOT SOFTWARE-VERSUS-HARDWARE - the sharpest correction Core offers. A DESIGNED part can BE code: `hardware/parts/tendon_finger_rig.py` is parametric build123d Python, an LLR binds to `build_rig`, and a TC asserts joint travel and tendon path length and pins a byte-identical STL - so the `CodeSymbol` discharge rule survives UNCHANGED for designed hardware. A BOUGHT part cannot, and is honestly a `PART` row owned by an IF row plus an `ASSET` row for its opaque per-instance data. So the LLR tier needs no non-code exemption for the made case, and the bought case never reaches the LLR tier at all - a narrower gap than the -generalize the discharge rule- framing assumed.

### Part A's radius

- Re-attestation: none. `LLR.Component` is a TRACED cell, so re-pointing it opens NO re-attest window - which is precisely why this can be ruled inside the lock program rather than after it.
- Migration: the arch-map regenerates; `cross_component_findings` re-computes (a partition with more boundaries demands more interface rows, and a repartition can turn a today-internal edge into a today-uncovered crossing); every interface row's endpoints are restated.
- Blocked artifact: `components.csv` cannot convert to the TOML carrier until this is ruled, since the ruling is ABOUT those rows.

### Part B's radius

- Schema: THE WHOLE IF REGISTRY HAS NO SCHEMA TIER, re-verified 2026-08-12. `trace.py`'s required-field and enum dictionaries carry keys for SR, LLR and TC only - there is no IF key at all, and no SN key either, despite SN's TOML carrier having landed - so on an IF row nothing is required, nothing is enum-checked, and nothing bounds a cell's content. The tier this item builds for IF is the same tier SN is still missing. `Contract` is unconstrained; `Status` is undeclared (OI-13 ruled that IF's Status lands HERE); `Stability` is validated nowhere despite being one of the fields `PROCESS.md` section 8 actually names.
- Undeclared columns, CORRECTED at verification 2026-08-12: the header carries ELEVEN columns and section 8's prose names only seven of them. The other four (`ThisProject`, `Status`, `Component`, `Notes`) ARE defined - but only in `INTERFACES.template.md`'s column table, a shipped prose gloss that no check reads. The proof a prose definition does not hold: `Stability`'s own shipped vocabulary is Experimental/Stable/Deprecated, yet FOUR live rows carry `Provisional`; and `Status` re-measured at 113 rows is Stable 99 / Draft 9 / Active 5. So ruling this means ADDING A SCHEMA TIER, not writing more prose - and the owner's typing rule needs that tier to exist or it is one more unvalidated column.
- Consumer 1, the sharpest practical cost: `plan_briefs.IF_SURFACE_COLUMNS` feeds the row VERBATIM into the dual-plan LLM planning briefs, and the surface is `IF-ID, Direction, ThisProject, Counterpart, Status, Contract` - so it hands a model BOTH the unconstrained narrative cell AND the undeclared status column as though each were a contract. This is the point that argues for splitting the cell rather than declaring alone.

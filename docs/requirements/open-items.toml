- What this does NOT touch: nothing gates on a hat today, so a partial build is safe - the roster can exist and be injected before any coverage record is enforced."""
options = """- (a) SHIP THE SIX-HAT SKETCH as the starting roster, with adopters expected to edit. FOR: concrete immediately, and it makes the mechanism real rather than theoretical - and several of the six name a failure class this repo has demonstrably shipped (a Windows path assumption, a scaffold-only-green). AGAINST: six perspectives on every need is a real cost per decomposition, and a roster chosen by an agent is exactly what SN-040 says a decomposition should not be.

- (b) KEEP IT AS PROSE and make the convention explicit - write the exact parenthetical into `spine-authoring/SKILL.md` (it is defined nowhere today; the format is a convention observed in the data), and keep the `docs/provenance-allow` entries as the standing record. FOR: zero schema cost; the reasoning already lives where a reader of the row will meet it, which is the argument that keeps rationale prose rich elsewhere; and 18 rows is a small population to police by review. AGAINST: it makes 17 permanent exceptions in a file whose header states it is not a second home for provenance; the state is uncountable and ungateable, so "how many unsigned derived requirements does this repo have" is answerable only by grep; and SR-053 shows the failure mode already - the same concept in two prose forms, with nothing to say which is which.
- (c) RETIRE THE LABEL CONCEPT - drop the derived-requirement class and let a hat-derived SR be an ordinary SR with a rationale naming its lens. FOR: it is one fewer vocabulary; the rationale requirement already forces the lens to be named, so arguably the label adds only a word; and it deletes 17 carve-outs by deleting their subject. AGAINST: it discards the one signal that distinguishes "this obligation follows from the parent need" from "this obligation was ADDED beyond the parent's text" - which is precisely the distinction DO-178C's class exists for and precisely the one a trace cannot recover afterwards. It also amends 17 reason cells inside the ratification wave, which is the most expensive timing available."""
recommendation = """(a) ONE SCHEMA CELL, and rule it in the same sitting that signs the labels rather than before.

The deciding argument is the one the allow file already makes and does not follow to its conclusion: deleting the parenthetical would silently promote 17 unsigned claims to ratified ones. A fact whose DELETION changes meaning is a fact the schema should carry - that is the same reasoning that produced `Status`, `Approval` and the id watermark in this repo, and there is no principled reason this claim is the exception.

SR-053 IS THE STRONGEST SINGLE PIECE OF EVIDENCE and it is easy to miss because it looks like a solved row. It carries the SIGNED state - `charter ruled, row retained` - in prose, in the same cell, distinguishable from the unsigned form only by reading the words. So the repo already has two states of a ratification claim encoded entirely in wording, which is exactly the condition that makes a cell necessary rather than merely tidy. It also means (b) has already been tried and has already produced a divergence nothing detected: no tally in the repo counts 18.

(c) IS THE OPTION MOST LIKELY TO BE REGRETTED. The label is not decoration; it is the marker that an SR carries an obligation its parent need's text does not demand. Delete it and the trace still joins, still reports zero orphans, and silently claims a decomposition relationship that is not true. That is the fail-open shape this kit exists to catch, and it would be introduced deliberately.

SEQUENCING, and it matters: mint the cell AS PART OF the signing act, not ahead of it. A `derived` cell added while all 17 stay unsigned is machinery with nothing behind it; a cell added in the reviewed commit that signs them is the ratification, recorded the way every other ratification here is recorded. If the sitting is not ready to sign, rule (a) as the destination and leave the prose standing - which is (b) knowingly and for a stated reason, rather than (b) by default.


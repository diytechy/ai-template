[open_item.OI-37]
title = """SR-043's fail-open-on-any-error against SN-006's normative bound - fail closed, narrow the ceiling, or narrow the need"""
status = "ruled"
raised = "2026-08-18"
ruled_date = "2026-08-18"
ruling_ref = "docs/log.d/2026-08-18-owner-rulings.md"
one_line = """RULED 2026-08-18: RELAX SN-006 - the need means the unattended layer moves forward as much as possible and surfaces to the human only when it cannot proceed; the absolute bound goes, the human-held override stays. Original brief: rule the contradiction between SR-043's fail-open-on-any-error clause and the bound SN-006's text now promises"""
decision = """RULED (owner, 2026-08-18): RELAX SN-006 - the need's own text, not the code.

The owner's words: "SN-006 needs to be relaxed. Note this is not the first time I've seen absolutes in a place it wasn't warranted. SN-006 really just means the unattended layer will move forward as much as possible, only surfacing to the human if it is unable to move forward."

WHAT THE RULING SETTLES. The contradiction was never between two obligations; it was between one obligation and an ABSOLUTE that had been written around it. SN-006 asks for an unattended layer that keeps going and escalates only when it is stuck. "A gate error preserves the configured bound" is a stronger promise than that intent needs, and it is the clause SR-043's fail-open contradicts. The intent survives; the absolute does not.

WHAT IS PRESERVED, and this is not a reduction of the safety claim to nothing: declared limits still bound the workers an unattended run may set running and the actions it takes that cannot be undone, and the override that relaxes them is still HUMAN-PROVIDED and never one the model can set. The obligation is supervision with a human-held override; what is withdrawn is the claim that the bound holds even when the mechanism carrying it has failed.

THE GENERAL NOTE IS PART OF THE RULING, because it generalizes past this row: "this is not the first time I've seen absolutes in a place it wasn't warranted." An absolute in a need is a promise every child must keep under every condition, including the conditions where the child's own machinery is broken - and a need that reaches for an absolute it does not actually mean manufactures contradictions with rows that are behaving correctly. That is what happened here: SR-043's clause did not change, the parent's promise did, and the child was put in the wrong by a word. Read the needs for unwarranted absolutes as a class, not one row at a time.

WHAT WAS EXECUTED THE SAME DATE: SN-006's `need` and `acceptance` cells amended to state the ruled intent (before/after in the log fragment). The amendment is a PROVISIONAL act the sitting countersigns - SN-006 was already `Modified`, no `status` cell was flipped, and nothing here is attested.

WHAT IS NOT DONE AND IS OWED: SR-043's `rationale` still carries the OPEN QUESTION FOR THE SITTING paragraph and its matching `docs/provenance-allow:28` entry, both of which describe the tension as unresolved. They are correct to retire now, and they retire TOGETHER (the allow file's own rule: when the ruling lands, the marker and the entry go together). That is a separate amendment on an SR row and was deliberately not folded into this one.

TWO THINGS THE BRIEF ASKED TO BE RULED IN THE SAME BREATH ARE NOT RULED HERE and stay open: the unparseable-`process.toml` path (a broken policy file reads as gate-OFF in `subagent_gate.py` while the same file reads as ON in its two twins), and the fact that every fail-open appends to `out/subagent-gate.log` and NOTHING READS IT. The second matters more under this ruling than it did before it: the relaxed need says the layer keeps moving and RECORDS the condition, and a record nobody counts makes a degraded run indistinguishable from a clean one. Neither is a contradiction, so neither blocks the sitting; both are worth a row.

The original brief follows.

TWO ROWS SAY OPPOSITE THINGS AND BOTH SAY SO OPENLY. This is a documented contradiction, not a latent one - each row cross-references the other, which is why it is a ruling rather than a repair.

- SR-043's shall (`system-requirements.toml:276`), final conjunct: "...and fail open on any error so a broken gate never wedges the tools."
- SN-006's acceptance (`stakeholder-needs.toml:148`): "a gate error preserves the configured bound."
- SN-006's normative text (:145) supplies the bound: "declared limits bound the workers it may set running and the actions it takes that cannot be undone, and only an override a human provides - never one the model can set - may relax those limits."

A fail-open on error IS a relaxation not provided by a human. That is the whole contradiction, in one sentence.

HOW IT AROSE, which matters for judging it: the safety half used to live only in SN-006's `why` cell, where nothing derives from it. It moved into the need's NORMATIVE text at the same pass that recorded this question - so SR-043's clause did not change, the parent's promise did, and the child is now in tension with a bound that had no force before.

WHAT THE GATE ACTUALLY IS. `subagent_gate.py` is a Claude Code `PreToolUse` hook, wired by `bootstrap.py:1771`. `SPAWN_TOOLS = {"Task", "Agent"}` (:41); `decide()` (:118-142) is pure, returning allow/ask/deny/defer; `emit()` returns exit 2 only for deny. Precedence: not-a-spawn-tool, then a launcher-set `SUBAGENT_GATE=allow` the model cannot set, then the dial (`off`/absent is a vacuous allow, which is the SN-012 proportionality half), then deny/ask, with an unrecognized value falling to ask.

THE FAIL-OPEN CODE, `subagent_gate.py:189-201`:

    try:
        raw = sys.stdin.read()
        payload = json.loads(raw) if raw.strip() else {}
        ...
        decision, reason = decide(tool_name, policy, override)
    except Exception as exc:  # noqa: BLE001 - deliberate fail-OPEN; see module doc
        log_decision(root, "?", "allow", "gate error, failing open: {}".format(exc))
        return 0

The span matters as much as the handler: the `try` wraps the payload parse, BOTH policy readers, the override read and `decide()` itself. Any exception anywhere in that span exits 0, which means proceed, which means the spawn is admitted.

THERE IS A SECOND, QUIETER FAIL-OPEN worth ruling on in the same breath. `read_process_policy` (:77-84) swallows `OSError`/`UnicodeDecodeError`/`TOMLDecodeError` and returns `None`, falling through to the legacy reader, which swallows `OSError` and returns `""` (:107-115), which `decide` maps to allow (:136-137). So AN UNPARSEABLE `docs/process.toml` READS AS GATE-OFF. This is deliberate and documented at :61-68, and it is explicitly the opposite of the twins: "THE ONE PLACE THIS READER DELIBERATELY DIFFERS from the twin in check_trajectory.py / gen_okf.py: an UNPARSEABLE process.toml reads as *undeclared* here, where those two read it as ON."

THE COUNTER-ARGUMENT IS IN THE ROW AND IT IS A GOOD ONE, so it should not be lost: "Supervision, not security - a model that can edit files can remove the hook". The clause was written against a real failure - a gate that wedges every tool on its own bug - and SR-043's rationale says in terms that the fail-open behavior is UNCHANGED pending this ruling for exactly that reason.

(The licence attribution in the same cell - "adapted from stop-subagent-fanout, MIT" - is a legal notice, carries no citation token, and stays under every option.)"""
blast_radius = """SMALLER THAN IT LOOKS ON RE-ATTESTATION, LARGER THAN IT LOOKS ON BEHAVIOR.

- RE-ATTEST: SR-043, SN-006 and LLR-040 are all already `Modified`, so the window is already open and a ruling CLOSES it rather than opening one. IF-020 and IF-038 are `Drafted`, never attested. THE ONE EXCEPTION, and it belongs to the fail-closed option specifically: TC-043 is `Approved`. Changing the behavior flips it to `Modified` and invalidates its own acceptance clause - "a malformed payload fails open (allow) and is logged" - along with `tests/test_subagent_gate.py::test_hook_fails_open_on_malformed_payload`.
- FAIL CLOSED costs what the clause was written to prevent, and the span makes it worse than it sounds: a malformed hook payload after a Claude Code version bump, an `OSError` reading `process.toml`, or a formatting failure inside `decide` would refuse EVERY Task/Agent spawn for the whole run. On an unattended loop that is a wedge, not a degradation.
- A NARROWER INDEPENDENTLY-ENFORCED CEILING cannot live in this module, and that is the crux: the module is what errored. It needs a second, simpler enforcement point OUTSIDE the try - a bare counter, or a hard cap in the coordinator that counts spawn attempts independently of the hook's verdict. That is new code with a new LLR, a new TC and an interface row, since the hook is the only carrier today.
- NARROWING THE NEED costs no code at all and rules the safety claim DOWN. SN-006 is already `Modified`, so the edit is free mechanically. The cost is entirely in what it says: SR-043 is hat-derived from `hat.SECURITY`, and C-SEC-2 asks that every irreversible action an unattended run can take name the dial or human authority permitting it. Narrowing the need answers that lens by lowering the bar.
- DOWNSTREAM: any behavior change ships to every adopter's hook. The dial's default is `off`, so a non-adopter is unaffected under all options - the SN-012 half holds either way."""
options = """- (a) FAIL CLOSED - the handler at `subagent_gate.py:199-201` emits deny (or ask) instead of returning 0. FOR: it makes SN-006's promise TRUE, which is the only option that does so without editing the promise; a bound that evaporates on error is not a bound, and the need now states it normatively; and it puts the failure where a human will see it immediately rather than where it is silent. AGAINST: a bug anywhere in a ~9-line span refuses every spawn for an entire run, which is a wedge on an unattended loop and is precisely the failure the clause was written against; it flips the one `Approved` row in the chain and invalidates a shipped test; and it converts a supervision aid into a hard dependency, which the row's own "a model that can edit files can remove the hook" argues it can never really be.
- (b) A NARROWER INDEPENDENTLY-ENFORCED CEILING that stays active when the hook errors - the hook keeps failing open, and a second, much simpler mechanism outside the hook's failure domain enforces a hard cap on spawns per run. FOR: it is the only option that satisfies BOTH rows as written - the tools never wedge on a gate bug, and the bound survives a gate bug - and it puts the durable guarantee in the simplest possible code, which is the correct place for a guarantee that must hold when the complicated code fails; it also answers C-SEC-2 on its own terms, by naming a ceiling that does not depend on the thing being supervised. AGAINST: it is the most work - new code, a new LLR, a new TC, an interface row - and it introduces a SECOND enforcement point for one obligation, which needs a stated relationship or it becomes two homes for one behaviour, the exact defect OI-14 ruled against. It also has to answer what the cap counts and where the count survives a crash.
- (c) NARROW THE NEED - strike "a gate error preserves the configured bound" from SN-006's acceptance and let the fail-open stand as ruled behavior. FOR: zero code, zero new machinery, and it is honest - it says the repo offers supervision rather than enforcement, which is what the mechanism actually delivers and what SR-043's rationale has always claimed; a promise the implementation cannot keep is worse than a smaller promise kept. AGAINST: it is the only option that resolves the contradiction by LOWERING the bar, and the bar was raised deliberately at the pass that moved the safety half into normative text - so taking (c) reverses a recent, considered decision; and it leaves C-SEC-2's lens answered by "we decided not to".
- (d) DO NOTHING - leave both rows contradicting each other with the tension recorded. FOR: nothing breaks today, and the record is honest about the state. AGAINST: it is a live contradiction between a parent and its child, which is the one thing a traceability spine exists to make impossible; and it blocks the re-attest of three rows that are otherwise ready."""
recommendation = """(b) THE INDEPENDENT CEILING - and it is worth the extra work rather than being the compromise option.

The deciding observation is about the SHAPE of the argument, not about safety appetite. (a) and (c) both assume the two obligations are in genuine conflict, so one must give. They are not. "The tools must not wedge when the gate breaks" and "the spawn count must stay bounded when the gate breaks" are only in conflict IF THE SAME MECHANISM CARRIES BOTH - and the reason it does today is historical, not designed: the hook was written first and the need's normative bound arrived after.

The engineering rule that applies is the ordinary one for fail-safe systems: THE GUARANTEE THAT MUST SURVIVE A FAILURE BELONGS IN CODE SIMPLE ENOUGH NOT TO FAIL. The hook is not that code - it parses JSON off stdin, reads two policy files in two formats, consults an environment override and runs a four-way decision. A counter that refuses past N is. Putting the durable half in the simple half is not a compromise between (a) and (c); it is the correct decomposition, and it is what SN-006 is actually asking for when read carefully - the need says limits BOUND the workers, not that the hook does.

(a) IS REFUSED ON THE SPAN, not on principle. If the try block wrapped only the decision, fail-closed would be defensible. It wraps the payload parse and both policy readers, so a Claude Code payload-shape change - an event entirely outside this repo - would refuse every spawn on every unattended run until someone noticed. That is a supply-chain wedge with a silent trigger.

(c) IS THE HONEST FALLBACK and a ruler may reasonably take it, particularly if the ceiling work cannot be scheduled. If it is taken, take it EXPLICITLY: SN-006's acceptance should not merely drop the clause but say what the repo offers instead - supervision with a human-held override, not an enforced bound - so the next reader does not re-derive the stronger promise from the need's normative text, which still says "declared limits bound the workers it may set running".

TWO THINGS THAT SHOULD BE RULED IN THE SAME BREATH, because they are the same question in smaller form:

- THE UNPARSEABLE-`process.toml` PATH. Today a broken policy file reads as gate-OFF here while the same file reads as ON in `check_trajectory.py` and `gen_okf.py`. That divergence is deliberate and documented, but it means the gate can be disabled by CORRUPTING a file rather than by editing a dial - and unlike the hook, that path does not even log an error. Whatever severity is ruled for the exception handler should be ruled for this reader too, or the two will diverge again.
- THE LOG IS THE ONLY EVIDENCE. Every fail-open appends to `out/subagent-gate.log`, and nothing reads it. If (b) or (c) is ruled, a fail-open that nobody counts is indistinguishable from a gate that never errored; a count surfaced at run end costs almost nothing and is the difference between a known-degraded run and an assumed-clean one."""

[open_item.OI-38]
title = """SR-040's resume-surface tripwire - an obligation whose carrier was deleted: rebuild it, or strike the clause"""
status = "ruled"
ruled_date = "2026-08-19"
ruling_ref = "docs/log.md#decisions-log"
raised = "2026-08-18"
one_line = """rule SR-040's resume-surface size tripwire, whose carrier was deleted with the serial resume driver and whose SUBJECT no longer exists either - the nearest live look-alike was examined and refused on measured evidence, so the row states an obligation nothing satisfies; recommendation is (b) STRIKE, with the two hat lenses answered explicitly rather than silently"""
decision = """THE CLAUSE. SR-040's shall (`system-requirements.toml:260`) ends: "...and warning (never blocking) when a lane resume surface exceeds the declared size threshold." Its acceptance (:265) states the fit criterion and then explicitly disclaims discharge: "NOTHING IN THE DELIVERED COORDINATOR DOES THIS, so this clause is an open obligation with no current carrier rather than a criterion any evidence today satisfies."

THE CARRIER WAS `status_size_warning(status_path, limit)` in `agent_loop.py`, deleted at commit `c4aeab9f` (2026-07-17, "WI-210: legacy-path retirement - one engine, one selection path"), whose message lists it among the things deleted WITH the serial driver. The module now carries a tombstone in its place (`agent_loop.py:499-501`):

    # (status_size_warning retired with the serial driver, WI-210: no session
    # inherits status.md as its resume surface any more - status.md is a
    # generated integrator artifact whose size the generator owns.)

READ THAT CAREFULLY, because it is the fact that decides this item: THE PREMISE DISSOLVED, THE CODE DID NOT MOVE. There is no longer any "lane resume surface" that a session inherits. So the clause has no implementation AND its subject as originally drawn has no referent. Its dial, `AGENT_STATUS_WARN_BYTES`, occurs nowhere in live code or tests.

THE NEAREST LIVE CANDIDATE WAS EXAMINED AND REFUSED, ON MEASUREMENT RATHER THAN TASTE. `check_docs.check_status_surface` warns when `docs/status.md` passes a declared line budget, which sounds like this clause and is not it. It differs on ACTOR (a documentation checker, not the delivered coordinator the shall names), on MOMENT (the commit and gate bar, not run start or mid-run), and on SURFACE (a status page judged as lean prose for a human reader - which is the very "human noticing" the C-UNA-8 lens says is the wrong mechanism at 3am). It is already the carrier of a different requirement. And decisively, ITS THRESHOLD SEMANTICS ARE INVERTED: only the literal token `off` silences it (`check_docs.py:777`), so a declared `0` or `-1` becomes the budget and every non-empty file exceeds it - the exact opposite of the retired warner, which returned None when `limit <= 0`. That was measured by exercising the function on declared `0`, `-1`, `off` and `200`, not read off the source.

So adopting it would have been carrier substitution across a different requirement, component, actor, moment AND with inverted semantics. It was refused, and the refusal is on the record rather than in someone's head.

WHAT IS AT STAKE IN STRIKING IT. SR-040's rationale says "only the resume-surface tripwire clause is orphaned", and the row's hat-derived parentage is that clause: two lenses reach it independently - C-UXE-2, that a view must stay usable as its content volume grows, and C-UNA-8, that at 3am the reader of a resume surface is another automated step, so growth must be legible from the artifact rather than from a human noticing. Both also explain the warn-not-fail severity: a smell is reported, not gated. Strike the clause and SR-040 loses its entire derived-requirement parentage, which makes its `(Derived-requirement label, ... PROVISIONAL, unsigned.)` parenthetical moot for this row - a coupling to OI-34 worth noting.

THE CHILDREN ARE ALREADY CORRECTED AND WAITING. LLR-037's detail (`low-level-requirements.toml:394`) records that the tripwire half is gone from the row and that the module has no size tripwire, and TC-040's method (`test-cases.toml:423`) records that a fourth clause it used to claim is performed by no test in its evidence file. Both flipped `Approved` to `Modified` on 2026-08-18. They are the subject of their own item, and neither can settle until this one does.

OWNER QUESTION, 2026-08-18, AND THE ANSWER - recorded here plainly because the brief above assumed it. The owner asked WHAT "SIZE" REFERS TO.

IT IS THE SIZE OF THE LANE RESUME SURFACE - the document an agent READS TO RESUME A LANE. Nothing else: not the size of the repository, not the size of a registry, not the size of a log. The clause's concern is that the artifact a session must read before it can continue grows until reading it costs more than the work, and that the growth is invisible because each addition is small.

THE TRIPWIRE WARNED AND NEVER BLOCKED. `status_size_warning(status_path, limit)` printed a warning when the surface passed a declared byte threshold and returned None when `limit <= 0`. It could not fail a run, fail a gate, or refuse a step. That severity is not incidental - both hat lenses behind the clause (C-UXE-2, C-UNA-8) reach a SMELL rather than a defect, and a smell is reported, not gated.

AND THE SURFACE IT WATCHED NO LONGER WORKS THAT WAY. When the serial resume driver was retired, `docs/status.md` stopped being a document a session INHERITS and became a GENERATED INTEGRATOR ARTIFACT WHOSE SIZE THE GENERATOR OWNS. So the question "how big is the resume surface" now has a different answer-holder: the generator decides what goes in it, and a size bound on it is a constraint on the generator's output, not a warning to whoever last wrote to a file by hand. That is the whole of why the brief above says a rebuild is a NEW requirement against a NEW subject rather than a restore of the deleted function."""
blast_radius = """NARROW, AND ASYMMETRIC BETWEEN THE TWO DISPOSITIONS - which is unusual enough to be the deciding fact rather than a footnote.

- RE-ATTEST: SR-040, LLR-037 and TC-040 are all already `Modified`. The window is open; a ruling CLOSES it. No option here opens a new one.
- STRIKING costs one reviewed Status-change commit and NO CODE: the final conjunct leaves SR-040's shall, the resume-surface paragraph leaves its acceptance, LLR-037's and TC-040's recording paragraphs go (they exist only to record the gap), and the two `docs/provenance-allow` entries retire with the marker they mark. TC-040 already passes on its three function-granular evidence tests, so nothing needs writing.
- REBUILDING costs a DESIGN QUESTION FIRST, then code: what IS the current resume surface, and who inherits it? The tombstone says nobody inherits `status.md` any more, so a rebuild cannot restore the deleted function - it must answer a requirement-shaped question before a line is written. Then: a new warner in the coordinator (the shall's subject is "the delivered coordinator", so it must live there), LLR-037's struck half restored with a `code_symbol` token for the new function, TC-040's fourth method clause re-added with a function-granular evidence entry, and that test written.
- WHAT NEITHER OPTION TOUCHES: SR-040's routing half - the per-phase command template map, the preflight, the reviewer dial in the banner - is live, carried by `session_template`/`parse_map`/`read_declared`, and verified by TC-040's three passing tests. Only the tripwire conjunct is at issue.
- ONE COUPLING: SR-040 is one of the 17 rows carrying an unsigned derived-requirement label, and its label's whole justification is the clause under discussion. If this strikes, OI-34's population drops by one and the reason should be recorded there."""
options = """- (a) REBUILD THE TRIPWIRE inside the coordinator, against whatever the CURRENT resume surface is. FOR: the two hat lenses that reach the obligation are not answered by anything else, and they are real - a resume surface that grows without bound degrades an unattended run silently, and the lens that says a machine rather than a human is reading it at 3am is exactly right about this repo; and it keeps SR-040's hat-derived parentage intact rather than removing the row's only derived content. AGAINST: it is not a restore, it is a new requirement - the premise dissolved, so someone must first decide what surface is inherited and by whom, and that is a design question this item cannot answer for the owner; and it builds a warner for a growth problem nobody has yet observed on the current architecture, which is machinery ahead of evidence.
- (b) STRIKE THE CLAUSE from SR-040's shall and acceptance, and let the two lenses be answered elsewhere or recorded as declined. FOR: it is the honest reading of what happened - the code was not deleted by accident, it was retired BECAUSE ITS PREMISE DISSOLVED, and a requirement whose subject has no referent is not an unmet obligation, it is a stale one; it costs no code and no test; and it removes the last thing standing between three already-`Modified` rows and their re-attest. AGAINST: it removes the row's entire hat-derived parentage, so two lenses that independently reached a real concern are answered by deletion; and if a resume surface DOES grow unbounded later, the record will show the obligation was struck rather than solved.
- (c) RE-POINT TO ANOTHER CARRIER - adopt `check_docs.check_status_surface` as the tripwire's home. FOR: it exists, it warns, it reads a status surface against a declared threshold, and it costs nothing. AGAINST: REFUTED ON MEASUREMENT, not on judgement - different actor, different moment, different surface, already carrying another requirement, and INVERTED threshold semantics measured by exercising it on `0`, `-1`, `off` and `200`. Re-opening this means overturning a measurement, and doing it anyway would put one mechanism under two requirements that do not agree about what it must do.
- (d) LEAVE IT STANDING as an open obligation with no carrier, as it is today. FOR: it is honestly labelled, and the row says plainly that nothing satisfies it. AGAINST: an unsatisfiable acceptance criterion holds three rows out of attestation indefinitely, and `docs/status.md` already names this as one of exactly two things the sitting must rule - leaving it is not a decision, it is the absence of one."""
recommendation = """(b) STRIKE - and answer the two lenses explicitly in the same ruling rather than letting them disappear with the clause.

The deciding fact is the tombstone's own wording, and it is stronger than it first reads: the premise dissolved rather than the code moving. A requirement is unmet when the system fails to do something it should do. This clause is different in kind - its SUBJECT does not exist. There is no lane resume surface that a session inherits, so "warn when the lane resume surface exceeds its threshold" is not an obligation the system is failing; it is a sentence about an architecture that was replaced. Carrying it forward as an open obligation misdescribes the repo to every future reader, and rebuilding it would mean inventing a subject so the predicate has something to attach to - which is requirement-writing backwards.

(a) IS THE PRINCIPLED OBJECTION and it deserves a real answer rather than a dismissal: C-UNA-8 is right that at 3am the reader is another automated step, and a surface that grows without bound is a genuine failure mode for an unattended loop. The answer is that the concern survives the clause and should be RE-LODGED where the current architecture puts it. Today the resume surface is a GENERATED integrator artifact whose size the generator owns - so if the concern is to be carried, its home is the generator's own contract, not the coordinator's. That is a different row against a different subject, and it should be minted deliberately if the owner wants it, not smuggled in by keeping a dead clause alive.

SO THE RULING SHOULD DO TWO THINGS, not one: strike the clause, AND record whether the growth concern is re-lodged against the generator or declined. Striking alone leaves the record saying a hat lens was answered by deletion, which is the outcome the enforcement audit exists to make visible.

(c) SHOULD STAY REFUSED. It was investigated properly and refuted on measured evidence, including the inverted-threshold finding that was obtained by exercising the function rather than reading it. Overturning that needs new measurement, not a fresh opinion.

ONE CONSEQUENCE TO CARRY: if this strikes, SR-040's derived-requirement label loses its subject, since the label's justification IS the orphaned clause. Record that in OI-34's population rather than leaving a labelled row whose derived content is gone."""

[open_item.OI-39]
title = """No SR states the CodeSymbol-anchor obligation - mint the requirement, or rule it not owed"""
status = "ruled"
ruled_date = "2026-08-19"
ruling_ref = "docs/log.md#decisions-log"
wi_refs = ["WI-472"]
raised = "2026-08-18"
one_line = """rule whether the LLR CodeSymbol anchor rule - the computation that decides when decomposition is FINISHED - is owed a stating SR, or stays a decision-registry rule with a code carrier; today it is normative only in OI-20's ruling, SR-147 states the carrier and SR-158's acceptance names only the verdict shape; the research round SPLIT the question - this row is the ENFORCED registry-to-code direction, the unenforced code-to-registry one is now OI-42 - and the recommendation is (a) MINT, written against the obligation rather than against Python or the checker, with NO back-link obligation minted here and the LLR owed either way (evidence: docs/knowledge/traceability-enforcement.md)"""
decision = """DISAMBIGUATION FIRST, BECAUSE THE RESEARCH ROUND FOUND THE ROW AND THE REQUEST ARE ABOUT TWO DIFFERENT OBLIGATIONS. "Traceability between code and requirements" names TWO directions, and they are not the same problem:

- REGISTRY -> CODE. A DESIGN ROW NAMES A REALIZATION SYMBOL AND A CHECKER VERIFIES IT BINDS. This is ASSERT-AND-VERIFY: a human writes a falsifiable claim in the registry and a machine falsifies it. It is what `check_doc_refs.symbol_findings` does, it is hard under `--strict`, and IT IS WHAT EVERYTHING BELOW IN THIS ROW IS ABOUT.
- CODE -> REGISTRY. A SOURCE COMMENT CITES A REQUIREMENT ID (`Implements: SR-007, LLR-014`). This is an ANNOTATION CONVENTION. It is mandated unconditionally in two SHIPPED documents, it is enforced by NOTHING, and it is adhered to in the kit's own scripts at 2 of 781 public symbols.

THE PHRASING THAT SENT THIS TO RESEARCH - code carrying back-links to its requirements - NAMES THE SECOND. OI-39'S OWN TEXT IS ENTIRELY THE FIRST. Reading them as one question is how a ruling here would silently mint an obligation nobody weighed: the anchor rule is the enforced direction and the `Implements:` mandate is the unenforced one, and they need separate answers. THE SECOND DIRECTION IS NOW ITS OWN ROW, OI-42, so this row can be ruled on its own merits. The evidence for both is in `docs/knowledge/traceability-enforcement.md` (reviewed 2026-08-18) and is not restated here.

WHY THE SPLIT IS EVIDENTIAL RATHER THAN TIDY-MINDED: the published evidence points OPPOSITE WAYS on the two directions. Verified assertion is the strong instrument (recovered links are not gate-grade: best classical IR F is about 48.7 across the standard benchmarks, and LLM recovery is no better and worse under a realistic candidate distribution). Code-side annotation is the weak one (no standard requires the representation, no surveyed commercial tool requires it, and every available proxy says such conventions are not maintained). A single ruling covering both would take the evidence for one and apply it to the other.

THE MECHANISM EXISTS, IS HARD-GATED, AND NO REQUIREMENT STATES IT.

THE RULE, as implemented in `check_doc_refs.symbol_findings` (:508-631) and stated in its own docstring (:512-514): "a live LLR row must carry at least ONE identifier-shaped `CodeSymbol` token that BINDS in one of the `.py` modules its `Module` cell names. Everything else about the cell is filed untraced." `CodeSymbol` supplies the tokens, `Module` supplies the search scope, and a `;`-joined module list is read as a union. The verdict split (:606-630): no identifiers -> untraced; no token binds -> dangling, which GATES; some bind -> anchored, misses counted as untraced.

ITS WEIGHT IS STATED IN THE MODULE ITSELF (`check_doc_refs.py:537-543`) and is why this is not a bookkeeping question: "THE WEIGHT OF THIS RULE - IT IS THE DECOMPOSITION FLOOR. Under OI-21's ladder, rung 4 (LLR definition) TERMINATES WHERE A TOKEN BINDS. ... So this is not only a check on a cell - it is the computation that decides when decomposition is FINISHED, which is why it is hard under `--strict` (an advisory version would make D-9's `Founded` rung vacuous for one of four tiers)."

WHERE IT IS NORMATIVE TODAY: `open-items.toml` OI-20, ruled by the owner 2026-08-13, option (a) RATIFY AS BUILT. That is an OWNER DECISION REGISTRY ROW. It is authoritative and it is not a requirement - nothing traces to it, no LLR decomposes it, no TC verifies it, and it does not appear in any coverage arithmetic.

THE TWO SRs THAT LOOK LIKE THEY MIGHT COVER IT DO NOT, verified cell by cell:

- SR-147 "One machine-parseable carrier for the requirement spine" (:549) states one obligation about REPRESENTATION - every spine tier in one machine-parseable form, reached by a migration proven cell-for-cell. Its acceptance (:551) is entirely round-trip migration fidelity. Neither cell mentions symbols, binding, `CodeSymbol` or discharge. IF-117's own notes concede it: "SR-147 ... does not state a symbol-binding oracle either."
- SR-158 "Documentation drift reds or warns per its declared tier" (:672) has as its subject "a documentation surface that has drifted from what it claims" - and an LLR registry row is not a documentation surface. Its acceptance (:674) carries the one clause that touches this - "the reference and figure checks gate at the release bar, gating on dangling references alone, with untraced ones counted and never gating" - which states HOW A FINDING IS GRADED, never that an LLR must anchor to real code. Its design child LLR-038 covers the path and `sym:` tier only (`findings_for`/`load_symbol_oracle`/`is_path_shaped`) and NAMES NEITHER `symbol_findings` NOR `module_bindings`.

So the strongest checker in the repo - the one that decides when a tier is finished - has no SR and no LLR.

HOW THE GAP SURFACED. IF-117 is the seam behind the rule: `check_doc_refs` consumes `gen_arch_map.module_bindings(tree)` rather than reading the rendered arch-map, deliberately, because the committed map is a PUBLIC-API view that drops `_`-prefixed names and module constants, and 41 of this repo's live LLR rows name exactly those - reading the artifact would report real code as missing. An earlier batch re-point assigned IF-117's owner cell to LLR-023 by matching on MODULE NAME (`gen_arch_map`) rather than on contract; LLR-023 covers `build_map`/`splice_region`, i.e. the rendered arch-map, which is precisely what IF-117's contract disclaims. The owner reverted the pick to the `req_refs` SR on 2026-08-17 and FLAGGED THE RESIDUE rather than forcing an owner: no SR states the obligation itself. The adversarial round that caught it (`docs/reviews/retier-v2/ROUND-2-SOL-TERRA.md:79`, F4) calls it "a module-name match, not an answerable owner", and puts IF-117 in a class of 19 such picks, several of which are "merely co-located-module candidates".

The visible symptom is that IF-117's `owner` cell holds an SR where an LLR normally sits - the registry itself is signalling that no design row answers for this seam.

OWNER DIRECTION, 2026-08-18, AND WHERE IT LEAVES THE ROW - not a ruling, and the row stays pending.

THE OWNER ASKED FOR RESEARCH BEFORE RULING, AND LEANS TOWARD MINTING - which is (a). A RESEARCH BRIEFING IS IN FLIGHT; this row waits on it rather than on the sitting's calendar.

THE OWNER'S CONSTRAINT ON ANY ANSWER, AND IT IS BINDING RATHER THAN ADVISORY: IT MUST BE LANGUAGE-AGNOSTIC, NOT PYTHON-SPECIFIC. That constraint reaches further than the wording of one `shall`. The rule as implemented is Python-shaped in two places at once - `symbol_findings` searches `.py` modules, and "identifier-shaped" is a Python identifier - and the kit's own doctrine is a stack-agnostic core with a Python-first REFERENCE. So a minted SR must state the obligation in terms every stack can satisfy (a design row's named symbol RESOLVES in its named implementation unit) and leave the resolution mechanism to the declared stack profile, exactly as the harness commands already are. A row that says `.py` would ship a Python requirement to every adopter.

THIS SHARPENS THE BRIEF'S OWN FIRST GUARD rather than adding a new one: "write the SR against the OBLIGATION, not the checker." The language-agnosticism constraint is what makes that guard testable - if the shall can be read by an adopter whose implementation units are not Python files, it was written against the obligation; if it cannot, it was written against `check_doc_refs`.

UNCHANGED BY THE DIRECTION: the LLR is owed under either ruling. `check_doc_refs.symbol_findings` is a hard `--strict` gate with no design row, and that is a gap on the repo's own terms whichever way the SR question goes."""
blast_radius = """ADDITIVE, AND CHEAPER THAN IT LOOKS ON THE GATE - the cost is in the chain, not the ratification.

- THE GATE DOES NOT MOVE. `STATUS_VALUES` is `{Drafted, Approved, Modified}` (`trace.py:394`), and the derived gate is the MIN over every in-scope row's own bar. The live basis is `drafted=74 modified=151` over 390 spine rows with the computed value already floored. A 391st row at `Drafted` changes nothing.
- IF-117 IS `Drafted` AND WAS NEVER ATTESTED, so re-pointing its `req_refs`/`owner` costs no re-attestation. SR-147 is `Modified` and SR-158 is `Drafted` - both already outside attestation.
- THE REAL COST IS THE CHAIN: a new SR needs an `sn_refs` parent (SN-002 or SN-010 are the candidates), at least one LLR naming `check_doc_refs.symbol_findings` - which today has NO design row at all - and a TC. That LLR is arguably owed regardless of how this rules, because a hard-gating checker with no design row is a gap on its own terms.
- RULING IT NOT OWED costs nothing mechanically and leaves the decomposition floor permanently un-required: the rule that decides when rung 4 terminates would be stated only in a decision registry, so a downstream adopter reading the requirement spine would find the ladder's terminating condition nowhere in it.
- DOWNSTREAM: the rule is shipped machinery (`check_doc_refs.py` is in `MAPPING`), so an SR stating it is a kit-level requirement, not a this-repo note - which is an argument for minting it, since adopters inherit the gate without inheriting any statement of what it demands.

WHAT THE RESEARCH ROUND ADDS TO THE BLAST RADIUS, and it CHANGES THE SIZE OF (a) RATHER THAN ITS DIRECTION - full evidence in `docs/knowledge/traceability-enforcement.md`:

- THE OBLIGATION IS SATISFIABLE OFF THE SHELF IN ANY LANGUAGE, so the owner's language-agnosticism constraint costs an adopter nothing. universal-ctags carries about 150 parsers, emits JSON Lines the stdlib parses, ships prebuilt Windows binaries, is GPL-2.0, and REQUIRES NO ANNOTATION FROM THE ADOPTER - it answers "does this name exist in this unit" for a stack the kit has never seen. (One sharp edge for whoever implements: BSD ctags also answers to `ctags`, so a probe must match the literal string "Universal Ctags".) Doxygen 1.16.0 (Jan 2026) goes further with NATIVE `\\requirement`/`\\satisfies`/`\\verifies`, a bidirectional `requirements.xml` and dangling-reference warnings that can fail a build - but only about 12 languages. So an SR written against the OBLIGATION has a credible discharge path per stack profile; it is not a promissory note.
- NO STANDARD CONSTRAINS THE REPRESENTATION, which is what lets the SR be written at the obligation altitude honestly. DO-178C section 11.21 makes Trace Data a lifecycle data item requiring bidirectional LLR-to-source associations - purpose: no orphan or dead code - and specifies NO representation; Trace Data is enumerated ALONGSIDE Source Code, not inside it. IEC 62304's normative chain omits source code entirely. (ISO 26262 and IEC 61508 could NOT be verified from primary text and are recorded as unchecked, not as support.)
- WHAT DOES NOT MOVE: nothing here reaches the `Implements:` mandate, `gen_arch_map.implements()`, or any code comment. Those are OI-42, and the two rulings are independent in both directions."""
options = """- (a) MINT THE SR - one requirement stating the anchor obligation (an LLR is discharged when at least one identifier-shaped `CodeSymbol` token binds within its named modules), with an LLR naming `check_doc_refs.symbol_findings` and a TC, and IF-117's `req_refs`/`owner` re-pointed onto it. FOR: it puts the ladder's TERMINATING CONDITION inside the requirement spine, where the ladder's other rungs already live - a decomposition floor stated only in a decision registry is the one rung a reader of the spine cannot find; it gives IF-117 an answerable owner, retiring a flagged residue instead of carrying it; and it supplies a design row for a HARD-GATING checker that has none, which is a gap regardless of this ruling. AGAINST: it is a three-row addition plus an IF re-point during a program that is trying to close, and it mints a requirement for behaviour that already ships and already gates - so the row documents rather than shapes, which is the accretion pattern this repo has ruled against before.
- (b) RULE IT NOT OWED - the anchor rule stays an owner decision (OI-20, ratified as built) with a code carrier, and IF-117's flag is struck. FOR: OI-20 IS a ruling, and a ruled decision with a working implementation is not obviously improved by a requirement restating it; the spine does not need a row for every mechanism, and proportionality (SN-012) argues against minting one for a rule nobody disputes. AGAINST: this rule is not "a mechanism" - it is the computation that decides when a tier is FINISHED, and the module says so. Leaving it out means the requirement spine cannot answer "when is decomposition done?" from its own contents, which is the one question a decomposition floor exists to answer; and it leaves a `--strict`-gating checker with no requirement and no design row.
- (c) FOLD IT INTO SR-158 by widening that row's subject to cover registry-cell anchoring as one more documentation-drift class. FOR: smallest addition - no new id, and the checker already lives in `check_doc_refs`. AGAINST: it breaks the one-obligation rule on a row that currently satisfies it. SR-158's subject is "a documentation surface that has drifted from what it claims"; an LLR row is a specification, not a documentation surface, and the anchor rule's verdict is not drift - it is a decomposition-completeness judgement. Folding them would put two decisions in one row, which is the tiering defect PROCESS.md §3 names explicitly.
- (d) DEFER PAST THE SITTING. FOR: keeps the sitting's scope small, and nothing is broken today. AGAINST: IF-117 stays flagged and its `owner` cell keeps holding an SR where an LLR belongs, which reads to every later reader as an un-migrated row rather than a declared gap.
- (e) WIDEN THE MINT TO BOTH DIRECTIONS - one SR obliging the registry-to-code anchor AND a code-to-requirement back-link. FOR: it is the reading the raising phrase invites, and it would put the `Implements:` convention on the spine where the enforcement audit says it belongs. AGAINST: REFUSED ON MEASURED EVIDENCE, and this is the option the research round exists to kill. The two directions have OPPOSITE evidence (knowledge pack, "The two directions are not the same problem"): the anchor rule is verified assertion, while code-side annotation is required by NO standard, by NO surveyed commercial tool, and is adhered to in this repo's own scripts at 2 of 781 public symbols - so widening the row would mint an obligation the author of the row is already failing at 99.7%, in the same breath as one it already meets. It also breaks the one-obligation rule as squarely as (c) does. The second direction is OI-42's, and it is not obviously owed at all."""
recommendation = """(a) MINT THE SR FOR THE ENFORCED DIRECTION ONLY - written against the OBLIGATION, not against Python and not against `check_doc_refs` - and DO NOT MINT A CODE-TO-REQUIREMENT BACK-LINK OBLIGATION. The LLR is owed under either answer.

THE FIRST THING THE RULING MUST DO IS PICK A DIRECTION. If the sitting rules "yes, mint traceability between code and requirements" without saying which direction, the implementer has to guess, and the two guesses have opposite evidence behind them. So the recommendation is stated as three separate answers.

MINT, FOR REGISTRY -> CODE. The deciding argument is the module's own claim about its weight, taken literally: this is the computation that decides when rung 4 of the ladder TERMINATES. Every other rung's terminating condition is stated in the spine. If this one is stated only in an owner decision registry, then the spine - the artifact whose entire purpose is to say what the system must do and how you know it is done - cannot answer the question for one of its four tiers. That is a hole in the thing itself, not a documentation nicety. The research round STRENGTHENS this rather than complicating it: verified assertion is the instrument the evidence actually supports. Automated link RECOVERY is not gate-grade (best classical IR averages F about 48.7 across the eleven standard benchmarks; LLM recovery is no better - LiSSA's best req-to-code F1 is .322 against VSM's .282 - and collapses under a realistic candidate distribution, P@1 32.5 to 14.4, with plain VSM winning). What this repo already does is the strong form: a human writes a falsifiable claim and a machine falsifies it. The row would state the strongest available mechanism, not aspire to a weak one.

WRITE IT AGAINST THE OBLIGATION, WHICH THE OWNER'S CONSTRAINT MAKES TESTABLE. The shall says that A DESIGN ROW'S NAMED SYMBOL RESOLVES IN ITS NAMED IMPLEMENTATION UNIT, with the resolution mechanism left to the declared stack profile - exactly as the harness commands already are. Not `.py`, not "identifier-shaped" in the Python sense, and not "`check_doc_refs` reports it" (which would name its own carrier and trip the altitude rule). The constraint is affordable rather than aspirational: universal-ctags answers "does this name exist in this unit" for about 150 languages, from JSON Lines the stdlib parses, with prebuilt Windows binaries and NO annotation required of the adopter. So the obligation-level wording has a real discharge path per stack, and DO-178C section 11.21 backs the altitude - it requires the ASSOCIATION and specifies no representation at all.

DO NOT MINT THE BACK-LINK OBLIGATION IN THIS ROW, and this is a positive recommendation rather than a deferral. Requiring source comments to cite requirement ids is required by no standard surveyed, by no commercial tool surveyed (Polarion OFFERS in-source tags for three languages; none requires them), and every available proxy says conventions of that shape are not maintained - about 48% of commits untagged in six Apache projects CHOSEN for good discipline, 13-20% of code changes triggering a comment update. This repo is its own strongest evidence: the mandate is stated unconditionally in two SHIPPED documents and adhered to at 2 of 781 public symbols in `project-trajectory/scripts/*.py`. Minting an SR for it would put a 0.26%-adhered, zero-enforced convention on the spine. That question is OI-42's, where it can be answered on its own terms.

THE ACCRETION OBJECTION IN (b) still deserves a head-on answer. It is true that this row would document behaviour that already ships, and this repo has correctly refused rows like that before. The difference is what the row would be ABOUT: a row restating "check X exists" is accretion; a row stating the CONDITION UNDER WHICH A DESIGN TIER IS COMPLETE is what a requirement spine is for. And the evidence that it is missing is not theoretical - a batch re-point assigned IF-117 an owner whose artifact its contract explicitly disclaims, and a module-name match was the best available answer BECAUSE no row states the obligation.

THE LLR IS OWED UNDER EITHER RULING and should not wait for this one. `check_doc_refs.symbol_findings` is a hard `--strict` gate with no design row anywhere. Even if the sitting rules (b) and leaves the obligation with OI-20, a gating checker carrying no design row is a gap on the repo's own terms - and it is the cheapest half of the work.

TWO GUARDS IF (a) IS RULED:

- RE-POINT IF-117 IN THE SAME CHANGE. The residue exists because the seam's owner cell holds an SR as a placeholder; minting the SR without moving the pointer leaves the same flag with a better excuse. And record that the module-match class is wider than this one row - the round-2 review named 19 such picks, several of them co-located-module candidates rather than answerable owners.
- STATE IN THE RULING THAT THE OTHER DIRECTION WAS CONSIDERED AND LEFT TO OI-42. Otherwise the next reader finds an SR about code-and-requirement traceability and reasonably infers the back-link mandate was ratified with it."""

[open_item.OI-40]
title = """LLR-037 + TC-040 - the tripwire pair: rebuilt with SR-040's clause, or corrected shut"""
status = "ruled"
ruled_date = "2026-08-19"
ruling_ref = "docs/log.md#decisions-log"
raised = "2026-08-18"
one_line = """rule the design/test half of SR-040's retired tripwire - both rows were corrected on 2026-08-18 against the live code after LLR-037 was found publishing a DELETED symbol and TC-040 was found Approved while claiming a clause no test performs; the pair follows OI-38 and cannot settle before it; recommendation is (b) correct shut, tracking OI-38's strike"""
decision = """WHAT THE PAIR SAYS TODAY, after the 2026-08-18 correction.

LLR-037 (`low-level-requirements.toml:388-398`) carries the live half of SR-040 - `cmd_map` parsed by `parse_map`, `session_template(phase)` falling back to `AGENT_CMD`, every map entry preflighted, the review policy read and printed in the banner - over `module = agent_loop.py` with `code_symbol = "session_template/parse_map/read_declared"`. All three bind: `session_template` is defined at `agent_loop.py:646`; `parse_map` (:231) and `read_declared` (:203) are module-scope re-exports from `agent_common`, which `gen_arch_map.module_bindings` sees, so the anchor rule passes.

Its second paragraph (:394) records what was removed and why: the cell used to describe `status_size_warning` as "pure and warn-only (limit<=0 disables)" for A SYMBOL THAT NO LONGER EXISTS. In the row's own words, "an Approved design row publishing a deleted symbol into the generated knowledge bundle is worse than a gap, because it reads as a carrier."

TC-040 (`test-cases.toml:419-429`) verifies SR-040 and LLR-037 at Integration level. Its method (:423) records the matching correction: it "claimed a fourth clause - 'a bloated status.md warns without blocking' - that NO test in the evidence file performs, and the row was `Approved` while claiming it."

THE MECHANISM THAT HID IT IS THE MOST TRANSFERABLE FINDING HERE, and it is stated in TC-040's own cell: "The file-granular evidence cell is what hid it: naming a 63-test file rather than the functions leaves a stated clause and an absent test indistinguishable." The evidence cell is now function-granular - `tests/test_agent_loop.py::test_cmd_map_broken_entry_fails_preflight`, `::test_review_policy_surfaced_in_banner`, `::test_model_map_entry_without_equals_fails_preflight` - and all three pass:

    $ .venv/bin/python -m pytest -q tests/test_agent_loop.py -k "test_cmd_map_broken_entry_fails_preflight or test_review_policy_surfaced_in_banner or test_model_map_entry_without_equals_fails_preflight"
    3 passed, 62 deselected

BUT PASSING IS NOT VERIFYING SR-040, and TC-040's `expected` cell says so in terms: "the resume-surface tripwire clause is unverified BY CONSTRUCTION because it has no carrier". Grepping `tests/test_agent_loop.py` for the tripwire returns nothing. The pair is green AND honestly incomplete, which is exactly why both are `Modified` rather than `Approved`.

WHAT IS ACTUALLY BEING RULED HERE. Both cells currently carry a paragraph whose only job is to RECORD THE GAP - LLR-037's "THE SIZE-TRIPWIRE HALF IS GONE FROM THIS ROW" and TC-040's "CORRECTED 2026-08-18". Those paragraphs are provenance in living cells, allow-listed together in `docs/provenance-allow` ("ruled together or not at all") precisely because deleting them would erase the only note that the question is open. So this item decides two things at once: whether the tripwire's design and test are REBUILT, and whether those two recording paragraphs come out.

THE DEPENDENCY IS STRICT AND SHOULD NOT BE FUDGED: this pair is the design and test half of the clause OI-38 rules on. It cannot resolve first, and it cannot resolve differently. If OI-38 strikes the clause, the correct answer here is (b); if OI-38 rebuilds it, the correct answer is (a). This row exists because the pair carries its own decisions - what LLR-037's cell should say, whether TC-040's fourth clause returns, and what evidence granularity is required - which the parent ruling does not answer by itself."""
blast_radius = """SMALL AND ALREADY-PAID ON RATIFICATION, with one durable consequence worth ruling separately.

- Both rows are already `Modified` (they flipped from `Approved` on 2026-08-18 as part of the correction), so the re-attest window is OPEN and any ruling here CLOSES it rather than opening one. SR-040 is `Modified` too.
- CORRECTING SHUT costs one reviewed Status-change commit and no code: the two recording paragraphs go, the two `docs/provenance-allow` entries retire with them, and both rows re-attest `Modified` -> `Approved` on evidence that already passes. Nothing is written, nothing is deleted from the delivered code.
- REBUILDING costs a new coordinator function, a `code_symbol` token added to LLR-037, the restored design sentence, TC-040's fourth method clause, a new function-granular evidence entry, and the test behind it - and it inherits OI-38's prior question of WHAT SURFACE the tripwire watches, since the tombstone says no session inherits `status.md` any more.
- THE DURABLE CONSEQUENCE, independent of which way this goes: file-granular test evidence is what made a false `Approved` invisible. TC-040 is now function-granular, and nothing requires any other TC to be. That is a general finding about the evidence cell, discovered here, and it should be recorded where it applies rather than left as a fact about one row.
- Under both options the corrected halves STAY corrected. Nobody is proposing to restore LLR-037's deleted-symbol sentence or TC-040's untested clause as they stood; the question is whether a REBUILT carrier earns them back."""
options = """- (a) REBUILD - track OI-38's rebuild: a new warner in the coordinator, LLR-037's design half restored against it with the new symbol named, TC-040's fourth method clause re-added with its own function-granular evidence and the test written to back it. FOR: it is the only option that leaves SR-040's clause verified rather than declared unverifiable, and it closes the pair honestly - a design row and a test that describe something real; the two hat lenses behind the clause (C-UXE-2, C-UNA-8) keep an answer. AGAINST: it is downstream of a design question nobody has answered - what the current resume surface IS - so it cannot start until OI-38 rules rebuild AND that question is settled; and it re-flips two rows that are one commit from being attestable.
- (b) CORRECT SHUT - track OI-38's strike: delete the recording paragraphs from both cells, retire the two allow entries, and re-attest both rows on the evidence that already passes. FOR: the rows then say only what is true, which is what a design row and a test case are for; the three evidence tests already pass function-granularly, so nothing is claimed that is not checked; and it removes two provenance markers by resolving what they mark, which is exactly how the allow file says its entries should end. AGAINST: it closes the pair by removing the obligation rather than meeting it, and the record will show a design tier and a test tier that both narrowed to fit the code - which is the right move when the premise dissolved and a bad habit if it becomes routine.
- (c) SPLIT THE PAIR - correct TC-040 shut now (its tests pass) and hold LLR-037 for the rebuild. FOR: it unblocks the half that is genuinely finished. AGAINST: REFUSED BY THE ALLOW FILE'S OWN TERMS - the two entries say "ruled together or not at all", and for a reason: a test case narrowed to what it verifies while its design row still claims an unbuilt carrier is precisely the mismatch that produced the false `Approved` in the first place, one tier down.
- (d) LEAVE BOTH `Modified` pending the rebuild indefinitely. FOR: honest, and costs nothing today. AGAINST: it holds two rows out of attestation on a decision that is already the sitting's to make, and an indefinite hold is how a recorded gap becomes a permanent one."""
recommendation = """(b) CORRECT SHUT, tracking OI-38's strike - and rule the two together in one sitting rather than in sequence.

The reasoning is OI-38's and does not need re-deriving here: the tripwire's premise dissolved, so its design row and its test have nothing to describe. What this item adds is the observation that THE PAIR IS ALREADY IN THE RIGHT STATE and is being held open only by the paragraphs that record the gap. LLR-037 now carries what the module actually does; TC-040 now claims only what its three named test functions perform, and they pass. Remove the two recording paragraphs and both rows are attestable on evidence that already exists. That is a genuinely clean close, not a papered-over one.

IF OI-38 RULES REBUILD, THIS BECOMES (a) AUTOMATICALLY and no separate deliberation is needed - which is why the two should be ruled in one sitting. The one thing a rebuild must not do is restore the old text: the deleted symbol and the untested clause were wrong on their own terms, independent of whether the tripwire returns.

THE FINDING WORTH KEEPING IS NOT ABOUT THIS PAIR AT ALL, and it should be ruled explicitly rather than left in a cell: FILE-GRANULAR TEST EVIDENCE HIDES A FALSE GREEN. TC-040 was `Approved` while stating a method clause no test performed, and it stayed that way because its evidence cell named a 63-test file instead of the functions. Any TC whose evidence names a file rather than test functions can carry the same defect today, and nothing checks it. Two cheap responses are available and neither depends on how this rules - a census of TCs with file-granular evidence, and a warn-first rule that a TC's evidence cell names test functions. Recording that here, on the row where it was found, is the minimum; ruling it is better.

WHAT SHOULD NOT HAPPEN: (c), the split. The allow file says these two are ruled together or not at all, and the reason is exactly the failure this pair demonstrated - a test narrowed to reality while its design row still claims an unbuilt carrier is the same mismatch one tier down."""

[open_item.OI-41]
title = """A generated view can be perfectly FRESH and carry nothing - what makes open-items.toml the single point of review it is meant to be"""
status = "ruled"
ruled_date = "2026-08-20"
ruling_ref = "docs/log.d/2026-08-20-owner-rulings-review-ois.md"
wi_refs = ["WI-485"]
raised = "2026-08-18"
one_line = """rule what mechanism reinforces that EVERY deferred-to-the-owner decision reaches `open-items.toml` - the owner's own question, raised because the ten briefs of 2026-08-18 only appeared when they asked; today the generated view can report itself up to date while carrying zero pending rows and ten genuine decisions sit on other surfaces; recommendation AMENDED 2026-08-19 to (e) - three arms that are each a FIELD or a COUNT rather than a phrase match (the allow-file grammar gains a required `OI-###`; the session log declares what it deferred; a vacuity check names the contradicting entry), because the owner's objection is that a phrase matcher grabs items that are not applicable and a matcher's precision cannot be bounded before it ships"""
decision = """THE OWNER'S QUESTION, VERBATIM, BECAUSE IT IS THE ROW'S SUBJECT: "Why did these only show up on open-items when I prompted? Is there some other mechanism / reference that could help reinforce that ideally all items surface in open-items.toml for single point review?"

THE FAILURE IS NOT STALENESS, AND THAT IS THE WHOLE POINT. A GENERATED VIEW CAN BE PERFECTLY FRESH AND STILL CARRY NOTHING. Before 2026-08-18, `gen_open_items --check` reported UP TO DATE. It was telling the truth: `docs/open-items.html` matched its regeneration exactly. The registry behind it held 22 rows - 21 `ruled` and one `pending`, and that one was `OI-000`, the inert example placeholder. So the owner surface rendered `No pending decision - the owner queue is empty` while approximately TEN GENUINE OWNER DECISIONS were live in the repo, sitting in log fragments, `docs/provenance-allow` entries and session reports.

EVERY FRESHNESS GATE IN THIS REPO ASKS THE SAME QUESTION - does the artifact match its regeneration - and NONE of them asks whether the SOURCE was populated. A view derived from an empty registry is a correct view of an empty registry. The check cannot tell an empty queue from an unrecorded one, and the reassuring word it prints is the same in both cases.

THE STRONGEST LEAD, AND IT IS ALREADY IN THE TREE: SEVERAL SURFACES ALREADY ANNOUNCE THE DEFERRAL IN A DETECTABLE PHRASE. They are not silent about owing an open item; they say so, in words, and nothing reads the words.

- `docs/provenance-allow` is the clearest case. Its header states the rule for the whole file - "Each row below owes an open-item row at the sitting; when the ruling lands, the marker and the entry go together" - and NINETEEN of its 34 entry lines repeat it verbatim in their own reason text: "Owes an open-item row at the sitting." Nineteen written promises of an open-item row, and until 2026-08-18 not one of them had one. The file's grammar is already parsed (`<ROW-ID> <Cell> <token>` then ` - <reason>`), and `tests/test_trace.py` already asserts every entry still bites, so this surface has machinery, a schema and a test - and no field for the thing it keeps promising.
- REGISTRY CELLS carry the same tell in three other spellings, each on a live row: `OPEN QUESTION FOR THE SITTING` (SR-043's `rationale`, SN-006's `acceptance`), `FLAGGED FOR THE OWNER` (IF-117's `notes`), and `OPEN RULING` (`external.toml`'s header, on the mis-seeded `B`/`REL` watermarks).
- THAT LAST ONE IS THE SHARPEST INSTANCE AVAILABLE and it is still live as this row is written: the `B-08`/`REL-004` watermark correction is named as an OPEN RULING in `external.toml` and listed as item 1 of "What the sitting still has to RULE" in `docs/status.md`, and IT HAS NO `OI-###` ROW. A decision the repo announces twice, on two surfaces, in the owner's own working document - and it is invisible to the surface built for exactly this.

WHY THE PHRASES MATTER MORE THAN THEY LOOK. A rule that says "file an open item when you defer a decision" is a rule with no enforcer, and this repo's own enforcement audit records that prose is the weakest tier. But the authors here DID NOT SKIP THE PROSE - they wrote the deferral down, in a consistent form, on a live surface. The gap is not authorial discipline; it is that the announcement and the queue are two unconnected artifacts. That is a mechanizable gap rather than a cultural one, which is what makes this rulable.

THE HONEST LIMIT, STATED UP FRONT: no mechanism below catches a decision that was deferred SILENTLY - taken by nobody, written nowhere, noticed by no one. The phrase is the tell, and an author who defers without a tell is invisible to every option here. What is achievable is that a deferral ANNOUNCED ANYWHERE resolves to a row; the remainder is genuinely reviewer-tier and should be said so rather than papered over."""
blast_radius = """SMALL MECHANICALLY, AND IT DECIDES WHAT A SURFACE MEANS - which is the larger half.

- (a) is one new advisory arm reading live surfaces for a DECLARED phrase vocabulary and requiring a resolving `OI-###`. It is the same shape `trace_text.provenance_tokens` already ships - a declared list of prose shapes, matched over cells - so the technique is inherited rather than invented, and the reader has a precedent for how such a warning behaves.
- (b) is a grammar change to `docs/provenance-allow`: an entry gains a required `OI-###` field. That is a small parser edit plus 19 entries to fill, and it makes the promise UNREPRESENTABLE-WITHOUT-A-ROW rather than merely detected. It is kit-shipped (the file is scaffolded), so it is a RESYNC entry and every adopter's allow file gains a field.
- (c) is a vacuity arm inside `gen_open_items --check`: report "0 pending rows while other surfaces defer" as a FINDING rather than as up-to-date. Cheapest of all, and it changes what a green from that check MEANS - which is a behaviour change to a step every commit runs.
- NO SPINE COST UNDER ANY OPTION: nothing here moves a `status` cell, mints or retires a spine id, or opens a re-attest window. The cost is one advisory class and, under (b), one downstream migration.
- THE COST OF DOING NOTHING is measured rather than hypothetical: ten decisions, of which the ten briefs of 2026-08-18 are the recovered set, plus at least one still-unrecovered instance (the `B`/`REL` watermark ruling). And the owner found it, not the repo - which is the failure mode a single point of review exists to prevent."""
options = """- (a) A DEFER-PHRASE CHECKER - scan the live surfaces (the registries, `docs/provenance-allow`, `docs/status.md`) for a DECLARED vocabulary of defer-to-owner phrases ("owes an open-item row", "OPEN QUESTION FOR THE SITTING", "the sitting must rule", "FLAGGED FOR THE OWNER", "OPEN RULING") and report any occurrence with no resolving `OI-###` nearby. FOR: it is the only option that reaches EVERY surface rather than one, and the four live instances outside the allow file are exactly the ones a per-file grammar cannot see; the technique already ships here, so the failure modes are known; and the vocabulary is DECLARED, which makes it reviewable and extendable rather than a guess. AGAINST: it is a phrase matcher, so it is evadable by wording - an author who writes "the owner should look at this" is caught by nothing - and it will produce false positives on prose that QUOTES the phrase (this very row does, four times), which needs an exemption story before it is anything but noise.
- (b) REQUIRE AN `OI-###` IN THE ALLOW-FILE ENTRY GRAMMAR - an entry that says it owes an open-item row must NAME the row, and an entry naming a nonexistent or non-pending `OI` is a finding. FOR: it makes the bad state UNREPRESENTABLE on the surface where 19 of the instances live, which is this repo's stated preference over detection; the file already has a parsed grammar and a test asserting every entry bites, so the machinery is already there; there are no false positives, because the requirement is a field rather than a phrase; and it closes the loop in the other direction too - when a ruling lands, the entry names the row that ruled it, so retiring the marker and the entry together stops being a memory exercise. AGAINST: it covers ONE surface. The allow file is where the deferrals are DENSEST, not where they are only. It would not have caught SR-043's open question, IF-117's flag, or the `B`/`REL` open ruling - three live instances on three different surfaces.
- (c) A VACUITY CHECK ON THE GENERATED VIEW - `gen_open_items --check` reports "0 pending" as a FINDING when other surfaces are deferring, instead of reporting up to date. FOR: it attacks the exact thing that went wrong - a green that meant "the view matches its source" being read as "the queue is empty" - and it is the only option that would fire even for a phrase the vocabulary does not know, because it compares a COUNT against a signal rather than matching text; it is a handful of lines. AGAINST: it names nothing actionable - "something, somewhere, defers" is a finding a reader cannot discharge without doing the search by hand; it depends on the same phrase detection as (a) to know that other surfaces defer, so it is not independent of it; and a zero-pending queue is a legitimate state that will now need an explicit way to be declared, or the check becomes a permanent warning that gets silenced.
- (d) PROSE ONLY - state in `PROCESS.md` and the session protocol that a deferred decision is filed as an `OI` row before the session ends. FOR: zero mechanism; and it addresses the general case that no detector can reach, which is the silent deferral. AGAINST: the 19 allow-file entries prove the prose rule was ALREADY UNDERSTOOD and already written down - the authors said in terms that a row was owed - and it still did not happen. A rule whose stated form is already being followed, and whose outcome is still absent, is not short of prose.
- (e) CLOSE THE LOOP ON THE EXCEPTION SURFACE, AND MAKE A DEFERRAL AN ACT RATHER THAN A PHRASE (added 2026-08-19 on the owner's concern that a phrase matcher "will grab multiple items that are not applicable"). Three arms, each a FIELD or a COUNT rather than a text match, so none of them can fire on prose that merely discusses a deferral.
  ARM 1 - THE ALLOW FILE'S GRAMMAR GAINS A REQUIRED `OI-###`, which is (b) verbatim and is the strongest arm because the bad state becomes unrepresentable. But it generalizes further than (b) framed it: `docs/provenance-allow` is not merely where deferrals are densest, it is THE DECLARED-EXCEPTION SURFACE - every knowingly-unsatisfied mechanized rule already has to have an entry there or the detector fires. So for the whole class "a rule this repo mechanizes is knowingly not satisfied", the question "did the deferral reach open-items?" collapses into "does every allow entry name a pending `OI`?" - a field check with ZERO false positives, because there is no third state between "the check fires" and "an entry silences it".
  ARM 2 - THE SESSION LOG DECLARES WHAT IT DEFERRED, at the one seam every session already passes. A session that ends owing the owner a decision writes it in its `docs/log.d/` fragment as a declared list of `OI` ids, and the commit bar checks that each names a pending row. This reaches the class ARM 1 cannot: a deferral that is NOT the suppression of any mechanized rule - the `B-08`/`REL-004` watermark ruling is exactly that shape, which is why it is the one live miss (b) would not have caught. It is a field, so it cannot false-positive; its weakness is the opposite one, an agent that simply declares nothing.
  ARM 3 - THE VACUITY CHECK, RE-AIMED SO IT NAMES SOMETHING. Not (c)'s "0 pending is a finding", which is exactly the unactionable form the owner is right to distrust, but: a pending count of ZERO while ARM 1's surface carries ANY entry, or ARM 2's fragments declare any id, is a contradiction between two artifacts and the finding NAMES THE ENTRY. It compares counts rather than matching text, so it fires for a deferral whose wording no vocabulary knows, and it is a handful of lines.
  ON THE FALSE-POSITIVE WORRY GENERALLY, because it also bounds (a) if (a) is kept as a fourth arm: the distinction that makes phrase matching tractable is DECLARATION SURFACES versus DISCUSSION SURFACES. A live registry cell, `docs/status.md` and the allow file DECLARE; `open-items.toml`, `docs/plans/`, `docs/log.d/` and `docs/reviews/` DISCUSS, and quoting a defer-phrase there is normal writing - THIS VERY ROW quotes the vocabulary four times. Scanning only declaration surfaces removes the dominant false-positive class by construction rather than by an exemption list that has to be maintained.
  FOR: every arm is a field or a count, so the owner's objection is answered structurally rather than by tuning a vocabulary; ARM 1 costs one grammar change on a file that already has a parsed grammar and a test asserting every entry bites; ARM 3 is the only thing here that would fire on an unknown wording; and the three together cover both classes of deferral (suppressed rule, and open design question) where each option above covers one.
  AGAINST: ARM 2 is the weak one and should be labelled as such - it is a declaration, so a session that defers silently and says nothing passes clean, and it taxes every close with a field that is empty almost always. ARM 1 needs a migration pass over the 19 entries that currently promise a row in prose. And the three arms are three changes rather than one, which is a real cost for a surface that is already generated and already checked."""
recommendation = """RULED (owner, 2026-08-20) - (e) AS AMENDED, the three field-or-count arms, WITH the folded-in always-on direction: ARM 1 (the allow-file entry grammar gains a required `OI-###`, hard immediately, 19 entries migrated in one pass), ARM 2 (the session log fragment declares the `OI` ids it deferred, checked at the commit bar - ruled with its stated weakness on record: a silent deferral passes it clean), ARM 3 (the vacuity check re-aimed to NAME the contradicting entry), and the open-items layer moves to always-shipped process with the "always-on is not populated" caveat standing. Executed as WI-485. The pre-ruling text is preserved below.

(a) THE DEFER-PHRASE CHECKER, WARN-FIRST, WITH (b) AS ITS HARDEST ARM - one recommendation with two teeth, not two recommendations.

THE DECIDING ARGUMENT IS COVERAGE AGAINST WHERE THE EVIDENCE ACTUALLY IS. (b) is the more satisfying mechanism and it is genuinely stronger where it applies: a required field is a constraint, a phrase match is a detector, and this repo prefers the former every time. But (b) sees ONE FILE, and the instance that matters most right now is not in it. The `B`/`REL` watermark correction is announced as an OPEN RULING in `external.toml` and again as item 1 of the sitting's rule-list in `docs/status.md`, and it has no `OI` row TODAY - after a sweep that was looking for exactly this. A mechanism that would not have caught the one live miss remaining is not the answer to the owner's question, which was about ALL items reaching one surface.

SO TAKE (a) AS THE RULE AND (b) AS ITS FIRST ARM. Where a surface has a grammar, encode the requirement AS A FIELD - that is the allow file, and 19 entries fill in one pass. Where a surface has only prose - registry cells, `docs/status.md` - match the declared vocabulary and warn. The two are the same rule at two enforcement strengths, which is exactly the pattern the enforcement audit already uses to describe every other rule here.

WARN-FIRST IS NOT TIMIDITY, IT IS THE FALSE-POSITIVE STORY. The vocabulary will fire on prose that QUOTES a phrase rather than deferring - this row does it four times, and any log fragment describing the rule will do it again. Running warn-first for a program is how the exemption shape gets designed from real hits instead of guessed at. Promotion to error is its own act, and the allow-file arm (b) can be hard IMMEDIATELY, because a missing field has no false positives.

(c) SHOULD BE BUILT, AND NOT AS THE ANSWER. The vacuity finding is four lines and it fixes the specific misreading that started this - a check saying "up to date" about an empty queue. But it cannot know that other surfaces defer without (a)'s detection, so it is a PRESENTATION of (a)'s result rather than an alternative to it. Fold it in; do not rule it alone.

(d) IS REFUSED ON ITS OWN EVIDENCE, and this is the cleanest refutation available anywhere in this registry: 19 allow-file entries state, in their authors' own words, that the row owes an open item. The prose rule was understood, agreed, and WRITTEN DOWN NINETEEN TIMES. It produced zero rows. Adding a twentieth statement of it is not a plan.

THE LIMIT, RESTATED SO THE RULING DOES NOT OVERCLAIM: none of this catches a decision deferred with no words at all. What it buys is that a deferral ANNOUNCED anywhere resolves to a row - which is what actually failed here, since every one of the ten was announced somewhere and none of them was queued.

OWNER DIRECTION, 2026-08-19, FOLDED IN RATHER THAN LEFT BESIDE: THE OPEN-ITEMS SURFACE IS ALWAYS ON, NOT OPT-IN. The layer moves out of `PROCESS_OPTIONS.md` and into the always-shipped process, so every adopting repo scaffolds `open-items.toml` and renders `open-items.html` whether or not it has yet used them.

WHAT THAT BUYS, PRECISELY: it makes S-3 non-vacuous. `check_docs.py`'s S-3 today reads "every Needs-<human> `OI-N` has a pending row and every pending id appears in `status.md`", and `PROCESS_OPTIONS.md` states its escape in terms - "S-3 is vacuous without the registry - the surface is optional; omit it to opt out". A detector whose finding is "you deferred and no `OI` row resolves it" is only actionable in a repo that HAS the registry; in an opted-out repo it either no-ops or tells the reader to adopt a layer they declined. Always-on is what turns (a) and (b) from a check that fires in some repos into a rule that means the same thing in all of them.

AND WHAT IT DOES NOT BUY, WHICH MUST BE SAID IN THE SAME BREATH OR THE RULING OVERCLAIMS: ALWAYS-ON IS NOT POPULATED. This row's own founding evidence is that the registry ALREADY EXISTED here, was perfectly fresh, and rendered `No pending decision - the owner queue is empty` while approximately ten genuine owner decisions were live in log fragments, allow entries and session reports. `gen_open_items --check` reported UP TO DATE and was telling the truth. Mandating the surface would not have changed one word of that. So always-on is the SUBSTRATE that makes the mechanism worth building, never a substitute for it - the ruling should take it AND (a)+(b), and a ruling that took only always-on would leave the measured failure exactly where it was found.

THE TWO COSTS, STATED SO THE SITTING PRICES THEM: it moves a layer from the opt-in doc to the load-bearing one, and `PROCESS.md` is byte-budgeted, so the clause has to land net-zero or displace something; and it forces a downstream migration on every repo that adopted the kit without the layer - the class of change this repo's own working agreement says to flag rather than slip in. Both are payable; neither is free.

AMENDED 2026-08-19 - THE RECOMMENDATION MOVES FROM (a) TO (e), on the owner's objection that a phrase matcher "will grab multiple items that are not applicable". The objection is correct and it is sharper than the AGAINST clause originally written for (a): that clause worried about prose QUOTING the vocabulary, but the deeper problem is that a phrase matcher's precision is a property of the wording it meets, so its false-positive rate cannot be reasoned about in advance and cannot be bounded by review. Every arm of (e) is a FIELD or a COUNT, which is this repo's stated preference over detection and is the only form whose error rate is knowable before it ships.

WHAT (e) KEEPS FROM THE ORIGINAL RECOMMENDATION: (b) survives INTACT as ARM 1, and the argument for it is stronger stated the general way. The original reading was that the allow file is where deferrals are DENSEST but not where they are ONLY - true, and it undersells the file. That file is the DECLARED-EXCEPTION SURFACE for every mechanized rule in the repo: a rule either fires or an entry silences it, and there is no third state. So for the entire class "a rule we mechanize is knowingly unsatisfied", requiring an `OI-###` in the entry grammar makes the unrecorded deferral UNREPRESENTABLE, not merely detectable - and 19 entries already promise that row in prose, so the migration is one pass over text that already says what the field would say.

WHAT (e) ADDS THAT NOTHING ELSE COVERED: the class of deferral that suppresses no check at all. The `B-08`/`REL-004` watermark correction is an OPEN RULING about a mechanism, not an exception to one - no detector is being silenced, so no allow entry would ever exist to carry the field. That is the one live miss this row was raised over, and ARM 2 (the session log declares what it deferred, checked at the commit bar) is the only proposal on this list that reaches it. It is honestly the weakest arm - a declaration cannot catch a session that says nothing - and it should be ruled with that written down rather than discovered later.

WHY ARM 3 REPLACES (c) RATHER THAN JOINING IT: (c) as originally posed reports "0 pending" as a finding, and the owner's instinct against unactionable findings applies to it exactly as it does to (a) - "something, somewhere, defers" is a finding a reader cannot discharge. Re-aimed, it compares the pending count against ARM 1's and ARM 2's declared ids and NAMES THE ENTRY that contradicts the count. Same handful of lines, same ability to fire on wording no vocabulary knows, but now it points at a row.

AND IF A PHRASE ARM IS KEPT AT ALL, the bound is DECLARATION SURFACES ONLY - live registry cells, `docs/status.md`, the allow file - never `open-items.toml`, `docs/plans/`, `docs/log.d/` or `docs/reviews/`, where quoting the vocabulary is ordinary writing and where this row itself does it four times. That single scoping rule removes the dominant false-positive class by construction, which is the difference between an exemption list someone has to maintain and a boundary that holds itself.

INDEPENDENT CORROBORATION, 2026-08-19 (the repository review, archived at `docs/archive/repo-review-2026-08-19.md`; triage in `docs/log.d/2026-08-19-repo-review-triage.md`). The review surfaced two more live instances of exactly this row's class: the red-TC retire-or-re-arm call, recorded in `dispatch.py`'s own comments and as a sitting-desk judgement item but never as a row here (review M-10); and the module-size baseline whose named debt owner is a CLOSED work item (review H-05 - re-pointed to WI-483 by the triage). Both deferrals were ANNOUNCED in prose on live surfaces and reached no queue - ARM 2's class exactly. The recommendation does not change; the instances are recorded so the ruling can price (e) against a measured population that is still growing while the mechanism is unbuilt."""

[open_item.OI-42]
title = """The `Implements:` back-link mandate - shipped unconditionally, adhered to at 0.26%, enforced by nothing, and feeding a harvester that fabricates links from prose"""
status = "ruled"
ruled_date = "2026-08-20"
ruling_ref = "docs/log.d/2026-08-20-owner-rulings-review-ois.md"
wi_refs = ["WI-486", "WI-487"]
raised = "2026-08-18"
one_line = """rule the CODE-to-REGISTRY direction that OI-39 is NOT about - two SHIPPED documents require `Implements: SR-/LLR-` on every public symbol, the kit's own scripts carry it on 2 of 781, nothing checks it, and `gen_arch_map.implements()` fills the map's back-link column 97% from undeclared prose (SR-9, SR-10, LLR-1 harvested out of sorting examples); recommendation is (b) SOFTEN THE GUIDE AND TIGHTEN THE HARVESTER, with (e)'s reverse-coverage measurement as the second arm in place of (a) - (e) is the owner's 2026-08-19 proposal, it is the only option that measures adherence rather than policing the links that exist, and unlike (a) it needs no history-marker convention first, but it must ship at a report-only default because measured coverage is 1 of 161 LLRs"""
decision = """THIS ROW IS INDEPENDENT OF OI-39 AND SHOULD BE RULED WHICHEVER WAY OI-39 GOES. OI-39 is the REGISTRY-to-CODE direction (a design row names a symbol; a checker verifies it binds - assert-and-verify, hard-gated today). This row is CODE-to-REGISTRY (a source comment cites a requirement id - an annotation convention). The full evidence for why the two are different problems, with sources, is in `docs/knowledge/traceability-enforcement.md` (reviewed 2026-08-18) and is not restated here.

THE MANDATE IS UNCONDITIONAL AND IT SHIPS. `PROCESS.md:161`: "Code carries back-links (`Implements: SR-007, LLR-014`)". `AGENTS.template.md:83`: "`Implements: SR-007, LLR-014` on implementing symbols"; and `:102`, inside the "Every public symbol: a docstring" bullet, "include `Implements: SR-/LLR-` so the back-link lands in the map". No applies-when, no warn-first, no exemption. Both files scaffold into every adopting repo.

THE ADHERENCE, MEASURED HERE 2026-08-18. Method: an AST walk over the 59 modules of `project-trajectory/scripts/*.py` counting module-level `def`/`class` whose name does not start with `_` - which is `gen_arch_map.scan_module`'s OWN public-API rule - with back-links counted as lines literally matching `Implements:\\s*(SN|SR|LLR|TC)-\\d+`, and ids resolved against the four spine registries via `tomllib`. Cross-checked by an independent route: `grep -hE '^(def|class) [A-Za-z]'` over the same files returns 782 and the single excess reconciles exactly - `check_figures.py:10` is a docstring line beginning "class cheap instead:".

- 781 PUBLIC SYMBOLS. 2 CARRY A LITERAL `Implements:` BACK-LINK - 0.26%. Both are in `subagent_gate.py` (`decide` :130, `main` :187) and both read `Implements: SR-043, LLR-040`.
- REVERSE COVERAGE: 1 OF 161 LIVE LLR ROWS (0.6%) is named by any back-link in the scripts - LLR-040.


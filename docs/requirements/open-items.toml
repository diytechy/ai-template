WHAT THE DRIVER IS LEAST SURE OF, so a ruler can weigh it: cognitive complexity is a modestly-validated metric - about r = 0.54 against comprehension time in the best meta-analysis, with a published failure to outperform plain LOC in a later study, and NO controlled study anywhere showing that enforcing a complexity threshold reduces defects. The case for it over cyclomatic is narrower and firmer than the case for complexity metrics in general: on THIS tree, cyclomatic is largely explained by size while cognitive is much less so, so cognitive adds information the existing C901 census does not have. That is the whole claim, and it should not be inflated into a defect-prevention claim it cannot carry.

SEQUENCING, so nothing is removed before its replacement exists:

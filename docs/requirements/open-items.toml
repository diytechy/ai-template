decision = """RULED (owner, 2026-08-13): APPROVE THE RECOMMENDATION, all five execution questions - its own program AFTER OI-14 part A (the provisional partition adoption suffices to start it); the LABEL string carrier (`DevStg-<Label>`, position DERIVED, every comparison through a STAGE_ORDER lookup that RAISES on unknown); the historical sweep WITH the attestation carve-out; sittings stay their own axis; the dial MAPPED onto the ladder, not collapsed; and the rung-predicates work sequenced as ONE program with the D-9 ladder migration. The sweep lands WITH its refusal enforcer or not at all.

THIS ROW WAS A CONFIRMATION BRIEF AND THE ANSWER ARRIVED: the previous brief asked whether -retire gate semantics- meant keeping DevStg-Reqs/DevStg-Tests/DevStg-Impl as boundary names (the reading that shipped) or retiring the vocabulary entirely, and flagged -say so explicitly if the second was the intent.- The owner said so, 2026-08-12: all G* and DevStg-Release tags are CONVERTED to stage semantics - traceability survives, the tags die, -very purposefully, because leaving them will always be conflated with stages, which have different numeric values.- The prior brief's confirm-the-shipped-reading recommendation is MOOT; what follows replaces it.

### The ruled ladder - AS FIRST DRAFTED; the rung ORDER is superseded below

The owner's original 2026-08-12 list, kept as the ruling record. Its rungs 2 and 3 were REVERSED by the owner's follow-up the same day (see THE RECOMMENDED LADDER below, which is CANONICAL - requirements before architecture); the count, the endpoints and the intent stand.

- 0 - vision and stakeholder needs in work
- 1 - system boundary interfaces in work
- 2 - high-level system architecture in work (superseded: architecture is now rung 3)

[open_item.OI-74]
title = "A record surface for delegated decisions: shape, affirmation lifecycle, and altitude"
status = "ruled"
ruled_date = "2026-08-31"
ruling_ref = "docs/log.d/2026-08-31-owner-rulings-oi74-75.md"
raised = "2026-08-31"
one_line = """RULED ((a) as amended by the owner: a PURE-TOML per-run record, review state changed IN PLACE, no second record to join) 2026-08-31 — one TOML file per delegated run, entries as tables with required keys plus a review cell defaulting empty that the owner edits with any free-string note; a non-empty review marks the entry reviewed, and no machinery checks the review state. Original brief: rule the decide-and-record-for-affirmation mechanism — per-sitting run report vs per-decision registry, where affirmation lands, what an overturn mints, which altitudes it covers; a RECORD beside OI-70/OI-73's exits, never a third exit"""
decision = """RULED 2026-08-31 (record docs/log.d/2026-08-31-owner-rulings-oi74-75.md): (a), the per-sitting run report, with the owner amending the format and the review lifecycle — PURE TOML, not the markdown-plus-frontmatter hybrid, and review state changed in place rather than recorded beside it. The owner: "if it was toml, the state could just change (and no machinery needs to check it, it can be up to the user to make whatever string note they want so some eventual (if ever) mechanized collator of all decisions could skip any that already has some review entry. I would pref that over yet another record that needs to be joined." The driver's own registry is the evidence the hybrid was unnecessary: this file authors long prose in TOML strings already, and one-file-per-run keeps the medium conflict-free the way log.d fragments are. What survives from the recommendation: the run is the unit; every delegated run closes with one record; entries carry REQUIRED keys (decided, alternative, reversal_cost, why_not_escalated) so the format cannot degrade the way the prose contract measurably did; a high-risk hoist gives per-decision visibility; an overturned entry mints a WI; all delegated altitudes are covered; and the record is never an exit — OI-70/OI-73's machinery still owns where work goes. What changes: each entry also carries review = "" (empty = unreviewed; any owner string = reviewed, semantics the owner's own); the file is edited in place for review and is NOT immutable; no separate approval record, no join, and NO review-state checker or surface band is commissioned — an eventual collator, if ever built, skips entries whose review is non-empty. Commissioned: WI-557 (with OI-75's dial).

The original brief follows. The evidence base is docs/knowledge/decision-routing.md (2026-08-31 research, external plus this repo's own measurements). The problem: sessions and adjudicators make delegated decisions that deserve a non-blocking owner second look, and today that practice has no home — too settled for a pending OI (blocking by design, and scheduling-gating since OI-73), not settled enough for the log's Decisions section (already-settled decisions only). The ad-hoc prototype ran three times (docs/decisions-for-review-*.md, 72 entries) with a measured 4/72 affirmation rate, no script or check reading any file, and the declared prose format degrading within one session (21 of 46 entries carried the Decided field). The one affirmation that ever happened was PER-SITTING with per-entry exceptions, recorded as an approval commit quoting the owner's words. 44 of the 46 most recent entries were SUPERVISOR-altitude decisions about running the loop — an altitude OI-70's adjudicator-exits doctrine does not reach. Framing constraint: OI-70 ruled exactly two exits, no third, nothing silent; this mechanism must be a record of calls already made and discharged (or needing no exit at all), or it re-litigates that ruling. The review-queue literature in the pack says a mostly-fine per-entry queue decays into reflex regardless of reviewer diligence; what survives is a filtered, counted, batched surface landing where the owner already stops."""
blast_radius = """Whichever shape lands touches the owner surface (a new generated band with derived counts), a close-time existence check for delegated runs, and the supervisor/session doctrine (session-protocol skill, the embedded resume prompt). Shape (b) additionally costs a new registry, id space, watermark row, template, schema check, and a resync entry — the heaviest artifact class the kit has, two weeks after OI-73's one-word posture (simplify). Shape (a) reuses the dated human-approval record convention and the handback-style immutable close artifact. Getting the framing wrong re-opens OI-70 within the month; getting the surface wrong reproduces the measured 4/72 graveyard with a schema."""
options = """- (a) PER-SITTING RUN REPORT: every delegated or unattended run must close with one immutable report at a known path — frontmatter counts plus a hoisted high-risk entry list, numbered entries in the body under a structured entry contract; existence checked at the run's close the way a handback report is checked at a lane's close; the owner affirms per-sitting via a dated approval record with per-entry exceptions; an overturned entry mints a WI. Surface: a generated band showing N unaffirmed runs / M decisions / oldest date. FOR: derived from the one observed successful affirmation; respects report immutability; covers the supervisor altitude, which is where the live entries actually sit; no new id space. AGAINST: per-decision granularity is lost except through the hoisted high-risk list, which re-imports the who-decides-what-is-high-risk question.
- (b) PER-DECISION REGISTRY (DR-### rows, recorded/affirmed/overturned): the owner works a queue with per-entry state. FOR: full granularity; every anti-graveyard instrument (count contradictions, staleness, cross-checked declarations) becomes available in ruled form. AGAINST: the heaviest shape; a queue of mostly-fine entries is the exact form the evidence says decays; against the simplify posture.
- (c) A FIELD ON EXISTING ARTIFACTS swept into the surface. FOR: purest single-source-of-truth. AGAINST: collides with handback-report immutability (affirmation state cannot live on the artifact) and covers the supervisor altitude worst — the measured majority of entries have no artifact to carry the field.
- (d) TEMPLATE THE CURRENT FILE PATTERN and stop. FOR: changes nothing. AGAINST: dominated by (a) at near-equal cost; the prose contract already degraded once, measured."""
recommendation = """(a), covering ALL delegated altitudes (supervisor sessions, adjudicators, workers — any session that ends a delegated run writes the report), with the entry contract as REQUIRED STRUCTURED FIELDS (what was decided, the alternative passed over, reversal cost, why it was not escalated) so the format cannot degrade the way the prose contract did, and the high-risk hoist giving the owner per-decision visibility without a per-decision queue. Overturn mints a WI (an overturned decision is work to undo, not a question); affirmation is the existing dated-approval ritual, per sitting, exceptions listed. State in the built doctrine, explicitly, that this is a record and not an exit — OI-70/OI-73 remain the only exits. The owner's separately noted in-HTML feedback idea (commit 1983e05a) has its natural host in the generated band, and folding it in is the owner's call at the ruling."""
wi_refs = ["WI-552"]

[open_item.OI-75]
title = "Routing delegated decisions: the signal doctrine, the disclosure obligation, and where the appetite lives"
status = "ruled"

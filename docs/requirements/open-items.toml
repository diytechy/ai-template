f this registry's cells came to name deleted code", which is an argument about the cell's LOCATION, not its length. AGAINST: it BANKS NO CLEANUP - the 108 rows keep their restatement, and their rot exposure, for as long as the relocation question takes to rule and build, where (a)/(b) remove it as they go. (This is softer than it first reads: the rot class that actually bit this registry is named-symbol rot, and (d)'s tripwire now catches that class unconditionally and on its own schedule - `IF-055` was found by the check, not by a reading pass - so what (e) defers is the prose bulk, not the live detector.) It is plausibly two sessions where (b) would have been one, and the second re-reads rows the first already judged unless the per-row verdicts are recorded durably enough to be the second pass's input, which is an obligation (e) must carry explicitly rather than assume. The relocation it sets up is a BIGGER change than any of (a)-(d) and crosses a line they all stay inside: a contract-header convention must be authored, checked and generated-from in the KIT, and every adopting repo inherits it, where thinning a cell is a local edit to this repo's own spine. And if the measurement comes back the (d)-skeptic's way - most rows irreducible on a heterogeneous population at a 374-char median - (e) has spent a session to learn the registry is roughly fine and improved not one cell."""

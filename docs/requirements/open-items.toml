[open_item.OI-66]
title = """Is the component-side contract header worth its build price, or does the remainder stay in the cell"""
status = "ruled"
ruled_date = "2026-08-29"
ruling_ref = "docs/log.d/2026-08-29-oi66-ruled-go.md"
raised = "2026-08-28"
one_line = """The header build is priced at roughly one WI-512, about 2,000 changed lines across 35 files. Decide go or no-go; the ruled fallback is that the content stays in the cell."""
decision = """The question: with the build priced, does the unique interface content move to a component-side contract header, or does it stay in the cell?

OI-65 ruled the header direction in principle and owed a price before anything moved. WI-525 has now taken it. Record: docs/plans/2026-08-28-header-build-price.md.

### The price, taken by analogue rather than estimated

WI-512 built the same shape of mechanism - thin the cells to their crossing, harvest the removed content into a committed generated reference, freshness-gate it, ship the convention to adopters. Its cost is a measured diff: **+2,024 / -156 across 36 files**.

- The reference itself: 566 lines. Its generator: 189. Its freshness gate: 79 across `check.py`, `trunk_step.py` and `docs/stack.ini`. Registry-side reader and checks: 239. Tests: 334. Adopter-facing kit surfaces: about 110.
- This build differs in four ways: the cell pass is **71 rows against 27** (the one item that scales, roughly 2.6x on the registry line alone); **21 of 78 modules carry no `Contracts:` anchor** and each needs one authored; the **harvester is broken** and fixing it is a precondition; and it is *less* work in one place, because the anchor, its grammar and its citation check already exist - WI-512 built those.

**Order 2,000 changed lines across about 35 files. One work item of a size this repo has absorbed before, not a program.**

### The correction that makes this rulable

Both OI-63 and OI-65 recorded that option (b)'s precondition was unbuilt, and cited WI-512 as the precedent that worked *because* a committed `docs/cli-reference.md` already existed. That is not what happened: `git log --diff-filter=A` puts the creation of that file **in WI-512's own commit**. The precedent built its reference from nothing. So the missing artifact is a cost, not an unbounded prerequisite - which is a different answer from the one both prior rulings assumed.

### What is still not priced

The authoring judgement inside the cell pass. WI-512 harvested the CLI surface mechanically from `argparse`; a contract body is written by a person reading the code, and 71 rows of that is not a line count. A five-row sample tranche would produce the only honest number.

### The harvester bug, which needs a decision either way

`gen_arch_map.module_contracts` returns `['IF-080']` for `handback.py`, whose docstring says "No `Contracts:` line, deliberately". Its guard admits any line carrying the word `Contracts`, and a negated declaration carries it. Fixing it raises a question the bug exposes: whether a module may declare "no contracts, deliberately" as a first-class state."""
blast_radius = """- RULING GO: about 2,000 changed lines, roughly 35 files, one work item. Every adopting repo takes a version bump for the header convention and its gate. The 21 unanchored modules and the 71-row authoring pass are the parts that cannot be mechanised.
- RULING NO-GO: costs nothing to execute and returns placement to keep-in-cell. What it accepts is that the cell stays held to the code by nobody - IF-055's stale names and IF-117's three false claims are what that has already cost, and IF-117 was corrected by hand at WI-524 rather than by any check.
- DEFERRING: OI-62's deletion pass removes restatement "in place", and "in place" stays undefined until placement is settled, so that pass cannot run either way.
- REVERSING after GO: the generated reference and its gate would have to be retired the way the module map was at WI-455, and the content moved back into cells. Cheaper than the build, but not free."""
options = """- **(a) GO.** Effect: commissions the generated reference, its generator, its freshness gate, the registry-side reader, the 21 missing anchors, the harvester fix and the adopter migration - about 2,000 lines over ~35 files. FOR: the declaration lands beside the code it describes, which is the only version of this that makes the rot self-correcting rather than caught after the fact; the price is now a measured analogue rather than an unknown. AGAINST: the largest adopter-visible change on the table, and the 71-row authoring pass inside it is the part no number covers.
- **(b) NO-GO, return to keep-in-cell.** Effect: nothing is built; OI-62's deletion pass then runs in the cell. FOR: no adopter migration, no new gate to maintain, and the deletion pass shrinks the surface that can rot even without moving it. AGAINST: accepts the rot class permanently - the cell keeps being held to the code by nobody.
- **(c) GO on a reduced scope.** Effect: fix the harvester and author the 21 missing anchors; defer the generated reference and its gate. FOR: the harvester bug is worth fixing whichever way this is ruled, and the anchors are useful on their own. AGAINST: half a mechanism holds nothing to the code - without the committed reference the cell has nothing to point at, so it buys tidiness rather than the property that motivated (b).
- **(d) GO, but sample first.** Effect: author five rows of the cell pass, measure what a contract body actually costs to write, then commit the rest. FOR: it prices the one item the analogue cannot, and five rows is cheap. AGAINST: a fourth act on this question, and the sample can only refine a decision the other numbers already support."""
recommendation = """RULED (a) GO by the owner 2026-08-29 (record: docs/log.d/2026-08-29-oi66-ruled-go.md). Build the component-side contract header, its generated reference and its freshness gate; execution row WI-527.

- The deciding reason stands: the argument that carried two prior rulings - that (b)'s precondition was an unpriced, possibly unbounded artifact - does not survive the record. WI-512 built the same artifact from nothing inside one work item.
- The required guard is binding: the harvester fix lands BEFORE any cell moves, and it carries the "no contracts, deliberately" decision with it.
- The one number still not taken is the authoring cost of the 71-row cell pass. It is measured as the pass runs rather than sampled first, because (d) was not the option ruled."""
wi_refs = ["WI-525"]

[open_item.OI-67]
title = """The interface row shape: one row, one direction, one kind of information — and which cells go"""
status = "ruled"
ruled_date = "2026-08-29"
ruling_ref = "docs/log.d/2026-08-29-oi67-ruled-a.md"
raised = "2026-08-29"
one_line = """RULED (a) 2026-08-29 — the owner: "feel free to start implementing the OI-67 recommendation". Original brief: rule the shape of an interface row; recommend (a): a row is one direction of one kind of information — the providing side, its consumers, and a typed data cell — with `provider`, `req_refs` and the prose `contract` removed, and the module header built at WI-527 the only home for the definition."""
decision = """The owner, reading the registry after the contract header landed (2026-08-29): an interface should say what the information plugs into, who it serves, and what the data is — an enumeration for a CLI return value, a file's schema — and nothing else. One row is ONE DIRECTION of ONE KIND of information. A request and its answer are two rows. A row that reads one file and writes another is two rows. The registry today describes two-way communication in places, and that is where the churn has come from.

The question: what does the vision (README — maintainable, requirement-traced, trustworthy, gated) actually LOSE if `provider`, `req_refs` and `contract` are removed outright and the row becomes owner + consumers + data details?

### What each cell does today — measured over the 136 live rows

- **`provider`** is read by the component graph (`gen_components.seam_placement`), the rule that fails a cross-component import with no declared interface (`check_trajectory._declared_seam_pairs`), the architecture map and the planning briefs. It is ABSENT on 106 rows, derived from the owner's design row through `kitlib.spine.seam_provider`. It is stated on 30: 21 modules (16 whose owner is a bare requirement, which names no module; 5 whose owner names several), 3 directories, 3 files and 3 `external:` parties. Nothing is lost by removing the cell IF the owner cell can name what those 30 name.
- **`req_refs`** has ONE mechanical reader — `trace.interface_findings`, which fails a row whose list is empty or names an unknown requirement. Its stated purpose, that every seam links the spine and stays transitively test-covered, is met by `owner` alone (an SR and an LLR both sit on the spine); seam-to-test coverage joins the other way, on a TC's `Verifies`. On 88 of 136 rows the cell adds nothing the owner does not derive (31 name the SR owner itself, 56 name exactly the LLR owner's parents, 1 names a subset). The 48 that add a requirement are hand-written and verified by nothing; the consuming side's requirement is reachable by following consumer → module → design row → requirement, which is a join, not a cell.
- **`contract`** is the ONLY place the payload is described. It is fed verbatim to the dual-plan LLM briefs (`plan_briefs.IF_SURFACE_COLUMNS`) as authority, used as a description by `gen_okf` and `intake`, and policed by five form rules plus a symbol/path-resolution check in `trace.py`. It is a REQUIRED cell. Removed with nothing behind it, a row is an edge with no schema.
- **`signal`** is the only TYPED description of what crosses, and it reads `variable` on 127 of 136 rows. Eight of the nine `discrete` rows state no alphabet. It is not a schema.

### Direction — every row read, not sampled

- **87 rows are already one direction of one kind.**
- **14 rows are two-way** — a request and its answer, or a read and a write, in one row (`IF-005`, `IF-020`, `IF-033`, `IF-039`, `IF-041`, `IF-047`, `IF-059`, `IF-060`, `IF-079`, `IF-101`, `IF-110`, `IF-116`, `IF-123`, `IF-135`). They become 35 rows.
- **35 rows are one direction but several kinds** — a CLI plus the file it writes, a library plus its CLI, several registries read as one (`IF-021` alone names ten schemas). Split to one kind each they become 91 rows.
- So the registry is 136 rows today, **157 if only the two-way rows split, 213 if every bundled kind gets its own row**. `carried_by` (22 rows ride a carrier today, 17 of them on `IF-102`) is the mechanism that keeps the second number from being a flat list: a constituent is still one direction of one kind, and the bundle is still declared once.

### Where the providing side is not a Python module

- 105 rows are provided by a module. **31 are not**: 21 are published files no cell names (the spine registries, `docs/stack.ini`, `docs/process.toml`, the `docs/work/` spec folder, `docs/runtime-flows.md`, the reviews folder, skill frontmatter, the open-items registry), 3 are files stated in `provider` (`performance-budgets.csv`, `agents.toml` + `agents-enabled`, `coverage-floors`), 4 are directories, 3 are `external:` parties.
- **Nearly all of those files are hand-edited** — no kit module writes them (`docs/stage`, read on `IF-037`, is the one generated exception). A rule that sends a file's definition to the module that writes it would cover almost none of them.
- The header scanner reads `*.py` docstrings only. The two git hooks (`IF-134`, `IF-135`) are extensionless shell and cannot declare anything today.

### What the module header changes

WI-527 built the home the owner's shape needs: a module declares its seams on a `Contracts:` line and states each as a `Contract IF-###:` block, harvested into `docs/interface-reference.md` under a freshness gate. Two rows use it. Under the owner's shape it is not an option beside the cell — it is the definition's only home, so a declared seam with no body is an interface with no definition, and the scanner must reach every provider kind above before the cell can go.

### The far side

29 rows name an `external:` consumer and 29 tie to a boundary row (`B-05` × 26, `B-04` × 3), whose `carries` cell already describes the payload at the boundary grain. Nothing below touches the boundary tier."""
blast_radius = """### The shipped kit — every adopter takes a version bump and a registry migration

- Format: `interfaces.template.toml` (146 lines), `INTERFACES.template.md` (114 lines), `PROCESS.md` §8 (the field list and the contract paragraph), `PROCESS_OPTIONS.md` "Intra-repo interfaces & the architecture graph" (82 lines), `RESYNC_PACK.md` (a migration entry with a converter), plus 39 references across the reference docs and shipped guides.
- Code: `spine_carrier` (the IF schema and required-cell list), `kitlib.spine.seam_provider`, `trace.py` (`interface_findings`, `if_contract_advisories`, `contract_named_tokens`, `contract_symbol_surface`, `if_ownership_advisories`), `check_trajectory.py` (`interface_findings`, `_declared_seam_pairs`, `spec_interface_findings`), `gen_components.seam_placement`, `gen_arch_map` (`load_seam_modules`, `_seam_edges`, the contracts scanner), `plan_briefs.IF_SURFACE_COLUMNS`, `gen_okf`, `intake`, `gen_release_checklist`, `migrate_carrier`, `traj_views`.
- Tests: 31 modules touch the IF tier.
- The kit's own `docs/requirements/interfaces.toml` is the worked instance — 136 rows re-keyed, plus the rows that split, each new row minted `Drafted`.

### What is at risk under each answer

- Removing `provider` without widening `owner`: the 30 stated providers lose their edge, and the cross-component rule reports real imports as undeclared seams — a false FAIL on the pre-commit floor of every adopter with a file- or directory-provided seam.
- Removing `contract` before the header reaches every provider kind: the 31 non-module seams have no home for their definition, and the planning briefs are handed rows with no payload.
- Removing `req_refs`: impact analysis ("which seams does SR-X touch?") becomes a join instead of a grep. Nothing mechanical breaks.
- The split: every `TC.Verifies`, `carried_by`, `Implements:` line and `Contracts:` marker that cites a split row is re-pointed, and the id watermark moves. Per-row authoring; it cannot be mechanised.
- Doing nothing: the 71-row cell pass ruled at OI-66 is authoring against a shape the owner has just said is wrong, and a later ruling for (a) redoes it.

### What does NOT change

The requirements chain (SN → SR → LLR → TC) is untouched: no requirement row is added or removed. The boundary tier is untouched. The stage ladder reads nothing here. Every IF row is `Drafted`, so no approval is re-opened."""
options = """### (a) The owner's shape — one row, one direction, one kind; three cells go

Effect: `provider`, `req_refs` and the prose `contract` are REMOVED. `owner` is widened to name the providing thing — a design row (→ its module), a file path, a directory, or an `external:` party — replacing both today's `owner` and `provider`; the answerable requirement is found through it. `signal` is replaced by a `data` cell holding the typed description: an enumeration, a schema pointer, a file-format name. The definition lives in the module header (`Contract IF-###:`) and nowhere else, and a declared seam with no body FAILS. Two-way rows split; bundled kinds split or ride `carried_by`. The scanner widens to `#`-comment headers in TOML/INI/CSV files and to extensionless hooks, so the 31 non-module seams have a home.

FOR: the row becomes three facts a human or an agent reads without prose. Every cell that could disagree with the code — a hand-copied contract, a hand-written requirement list, a provider the owner already implies — is gone, which is the rot `IF-055` and `IF-117` already cost. Direction stops being inferred from a sentence. The header mechanism exists; this is the shape that makes it load-bearing instead of optional.

AGAINST: the largest migration the IF tier has had — three cells removed, one widened, one replaced, rows split, every adopter converted. The scanner widening is new, unpriced code. `owner` naming a file path puts the answerable requirement one join away instead of on the row; the Q1 ruling (2026-08-15) refused a derived owner once on the ground that a derived view only surfaces what is encoded — weaker now that a path IS encoded, but not gone.

### (b) The owner's shape, but the schema stays a cell

Effect: as (a) for `provider`, `req_refs`, direction and the split — but the payload stays in the registry as a structured `data` cell, and the header stays opt-in as built.

FOR: no scanner widening; the 31 non-module seams have a home on day one; the planning briefs keep a payload column. AGAINST: it keeps the one cell that rots — a hand-typed schema beside code nothing checks it against — which is the defect the header was built to remove, and it leaves two homes for one definition, the state OI-65 was raised to end.

### (c) Remove `req_refs` only

Effect: `req_refs` becomes optional — dropped on the 88 rows where the owner derives it, kept on the 48 where it adds something. Everything else stays. FOR: the exact precedent of the `provider` shed (OI-60 ruled (a)); one cell, one check, one migration entry. AGAINST: it does nothing about two-way rows, the prose contract or the `variable` shrug; the churn continues, and the 71-row cell pass proceeds against a shape the owner has rejected.

### (d) Status quo — finish the 71-row cell pass as ruled at OI-66

Effect: nothing changes shape; the remaining cells move their detail into module headers as planned. FOR: already ruled, already priced, no adopter migration. AGAINST: it spends the authoring on a shape whose cells are two-thirds redundant and whose direction lives in prose; a later ruling for (a) redoes the pass."""
recommendation = """RULED (a) by the owner 2026-08-29 (record: docs/log.d/2026-08-29-oi67-ruled-a.md; program plan: docs/plans/2026-08-29-if-row-shape-plan.md). The driver recommended (a), sequenced so nothing is removed before its replacement exists.

The vision loses NOTHING structural under (a): every seam still traces to the spine through `owner`, the component-boundary rule still has both endpoints, and the payload description moves to the one place a check can hold it to the code. What it loses is convenience — a join instead of a grep for impact analysis, and a payload column in the planning briefs that is read from the generated reference instead.

The sequence, each step green before the next:

- **Rule the shape here** — the three cells named, `owner` widened, `data` replacing `signal`, the one-direction rule stated in `PROCESS.md` §8.
- **Widen the header's reach** so every provider kind has a home: extensionless hooks and `#`-comment headers in registry and config files. Price it the way WI-525 priced the header.
- **Split the rows** — 14 two-way rows first (they are wrong under any option), then the 35 bundled rows, each either split or declared once with constituents on `carried_by`. New ids minted, citations re-pointed. This is the same per-row authoring the 71-row cell pass would have spent, spent on the right shape.
- **Convert** — a `migrate_carrier` arm that drops the three cells, folds `provider` into `owner`, and fills `data` from `signal` + `signal_note` where an alphabet is stated; a `RESYNC_PACK.md` entry; the kit's own registry as the worked instance.
- **Arm the gate** — a declared seam with no `Contract IF-###:` body fails, once the kit's own tree is clean.

Do not take (c) as an interim: it is a second migration on the same cells within weeks. If (a) is beyond appetite, (d) is the honest fallback — but rule it, so the 71-row pass is not authoring against a shape nobody has agreed to. The pass is HELD until this is ruled."""
wi_refs = ["WI-527"]

[open_item.OI-68]
title = """The complexity sensor and the line ratchet: does one replace the other, does it watch `tests/`, and is it armed here"""
status = "ruled"
ruled_date = "2026-08-30"
ruling_ref = "docs/log.d/2026-08-30-owner-rulings-oi68-oi69.md"
raised = "2026-08-29"
one_line = """RULED (1c, the line ratchet re-based to SLOC / 2a / 3a / 4a) 2026-08-30 — the owner: "the more I read for OI-68 I wonder if 1c is the right direction + some update to make sure line length checks omit whole-line comments, which can obscure what matters". Original brief: rule the complexity sensor's shape before it is built - four questions in one sitting: (1) does a stdlib cognitive-complexity ratchet REPLACE the module-size line ratchet (the question banked in the 2026-08-20 log under the OI-16 correction), (2) does it census `tests/` as well as the kit scripts, (3) does this repo run it ARMED or report-only, (4) do the two Sonar-spec conventions the prototype resolved stand (match = one increment; comprehension conditions nest) and is the threshold 15 or 14; recommendation is (1a) replace, (2a) yes, (3a) armed here, (4a) keep the prototype's conventions at 15"""

decision = """RULED 2026-08-30 (record docs/log.d/2026-08-30-owner-rulings-oi68-oi69.md): (1c) BOTH sensors stay armed - they measure different axes, module SIZE and function COMPLEXITY - and the module-size ratchet is RE-BASED from raw physical lines to SLOC (non-blank, non-comment, non-docstring), the prototype's own definition held once in the kit beside the sensor and imported by the ratchet; a one-time full re-stamp with the derivation on record; nothing deleted, no pointer moved. (2a) the sensor censuses tests/ too, the line ratchet stays scripts-only. (3a) armed on this repo at DevStg-Impl, --report only downstream. (4a) match is one increment, a comprehension's if takes the nesting increment, threshold 15. Phase 2 of the plan becomes arm + re-base; the driver's (1b)/(3b) reservations are on record and not taken.

WHY THIS IS ASKED NOW, AND WHY IT IS ONE SITTING RATHER THAN THREE. The owner has approved in principle a program to build `check_complexity.py` - a stdlib-`ast`, Sonar-style COGNITIVE COMPLEXITY plus SLOC census per function, with a central TSV baseline, exact equality both directions, and no inline suppression pragma. Nothing is built yet, deliberately: two of the three questions below decide the sensor's SCOPE and its POSTURE, and answering them after the code exists means writing the code twice. The third question - the retirement - is not new at all; it is the question this repo banked for the owner on 2026-08-20 and has been carrying ever since, and it is asked here because the program is the first thing that makes it answerable with a replacement in hand rather than as a bare deletion.

THE STANDING RULINGS THIS BRIEF DOES NOT REOPEN, stated first so the options are read against them.

- D-7 (2026-08-10): the GATING duplication census was torn down - one real catch at the one-time triage and none since, structurally blind to both drift incidents this repo actually suffered, and 93% of its census lines registering accepted idioms. F5 duplication is UNBOUNDED by ruling. NOTHING IN THIS BRIEF IS A DUPLICATION CHECK, and no option below re-arms one. What D-7 contributes here is its LESSON rather than its subject: a check whose findings are mostly noise earns the ignore, so a new sensor ships warn-first and its false-positive behaviour is measured before anything is claimed about it.
- OI-16 (owner correction, 2026-08-12): "the monolith risk was really around function size / complexity, not strictly file size." That correction is the warrant for this whole program. It ruled the AXIS and did not rule the retirement, which is exactly what is asked below.

THE FOUR QUESTIONS.

### Q1 - Does the complexity sensor REPLACE `tests/test_module_size_ratchet.py`?

This is the banked question, and it is banked in two homes so it cannot be lost. The 2026-08-20 grind log, in the WI's own words:

> "Note the axis it wants ALREADY EXISTS unused-for-this-purpose: `tests/test_complexity_ratchet.py` runs ruff `C901` per function and, unlike the line ratchet, RECURSES into packages. NOT redesigned here, deliberately - filing it is the WI's instruction. The question for the owner is whether the line ratchet retires in favour of the complexity one, or the two keep different jobs with the line one demoted to advisory."

and `tests/test_module_size_ratchet.py`'s own module docstring, which is the file arguing about itself:

> "AND THE SENSOR MEASURES AN AXIS ITS OWN OWNER DISPUTES. ... `tests/test_complexity_ratchet.py` measures the disputed axis; this census recurses into packages too since 2026-08-21 (see `_all_modules`), so the two now cover the same files and differ only in what they measure about them. Whether the line ratchet retires in favour of the complexity one or the two keep different jobs is an open question for the owner, banked in the 2026-08-20 log; until it is ruled, this file stays armed, because an unruled axis is not a reason to stop sensing growth."

TWO WORKED COUNTEREXAMPLES ARE ON RECORD, both from WI-448, and they run in opposite directions - which is what makes them evidence rather than an anecdote. `bootstrap.py` shed two duplicated helper BODIES, gained a MAPPING declaration block, and the line ratchet demanded a REVIEWED BUMP on a module that had got structurally simpler. In the same programme `agent_common` and `check_trajectory` each lost roughly 230 lines of pure duplication and the ratchet's only response was "re-stamp downward". Neither direction told anyone anything about complexity.

WHAT THE LINE RATCHET IS ALSO MEASURING, and it is measurable rather than arguable: roughly half the kit-scripts tree is prose - comment lines plus docstring lines - because the house style puts paragraph-length rationales inside the baselines themselves. The module-size ratchet is itself among the largest files in the repo and the great majority of it is commentary explaining its own entries. A line sensor over this tree partly measures documentation, which is a second reason the owner's OI-16 correction was right. Measured at HEAD `7fc42a5a` (tokenize + ast, re-derivable by `prototype/`): 9,670 comment lines and 18,246 docstring lines of 60,646 non-blank lines in `project-trajectory/scripts/` - 46.0% prose; `tests/` is 35.0% prose (14,664 + 8,434 of 66,024).

### Q2 - Does the sensor census `tests/` as well as `project-trajectory/scripts/`?

`WI-521` - the module-size ratchet's own named debt owner - states the gap and then refuses to close it without this ruling:

> "`tests/test_module_size_ratchet.py` censuses `SCRIPTS` only, so no armed sensor watches the test tree - which is why three of the four monoliths grew 5-36% between the 2026-08-19 review and the `WI-483` close with nothing saying so. Do not just extend the census. That file's own docstring banks an unruled owner question ... Extending a disputed axis to a second tree doubles whatever is wrong with it. The honest sequence is to raise the axis question with the measurement this row can now supply, and extend only what survives the answer."

The measurement that makes the case (prototype census at HEAD `7fc42a5a`): `tests/` is 146 files and 77,074 lines, holding 3,635 functions, of which 20 exceed a cognitive complexity of 15 (10 exceed 25, 1 exceeds 50). The sharpest single instance: `tests/test_import_layers.py::import_graph` at cognitive 58 - the seventh most complex function in the whole repository, 36 SLOC long, living inside a complexity sensor; its sibling `strongly_connected` scores 41.

### Q3 - Does THIS repo run it armed, or report-only?

The shipped default is settled by the program and needs no ruling: downstream gets `--report` only, and arming is an opt-in `PROCESS_OPTIONS.md` layer. Google's static-analysis bar is under 10% effective false positives before a check becomes an error, and a metric that has never been run on anyone else's codebase has no false-positive evidence at all. What needs ruling is THIS repo's own posture, because it changes every future session's commit bar.

The evidence for arming is this repo's own, and it is the strongest enforcement evidence available anywhere in the kit: over one 48-day window the byte-CAPPED doc grew +2.6% while the two byte-WATCHED docs grew +91% and +1,101% (derived in `docs/knowledge/instruction-file-adherence.md`). HARD LIMITS HOLD; WATCH-ONLY DOES NOT. Any proposal here that lands as "flag it in the log" should be assumed to fail.

The evidence against is the seed size. At a Sonar-default threshold the baseline seeds at 179 entries over the kit scripts (of 1,549 functions), plus 20 over `tests/` if Q2 is ruled in - 199 in all, 67 of them over 25 and 9 over 50. A baseline that large is a debt statement, not an approval - which is precisely the stance `test_module_size_ratchet.py` took and defended for months, so it is a stance with precedent here rather than a novelty.

### Q4 - Two metric conventions and the threshold

The prototype (`C:/Projects/ai-template-plans/complexity-pushback/prototype/`, 49 tests green, 9 oracle cases transliterated from the Sonar white paper's own worked examples, 89.5% exact agreement with the `cognitive_complexity` 1.3.0 reference package over 5,184 functions) had to resolve two points the spec leaves to the implementer, and each moves the seed:

- `match` statements: the spec is explicit that a switch is ONE increment for the whole statement, not one per case. The prototype follows the spec. The brief that proposed it had assumed per-case.
- Comprehension `if` conditions: the prototype counts them WITH the nesting increment (a filter inside a nested comprehension reads as nested control flow). The reference package does not. This one choice is worth 199 vs 166 seeded rows, and it is a one-function change either way.
- Threshold: at 15 (Sonar default) the sensor carries 43 of the 47 entries in `tests/test_complexity_ratchet.py`'s C901 baseline; two of the four drops sit EXACTLY on 15 and one is a nested `def` the new sensor folds into its parent by design. At 14 it would carry 45 of 47.

WHAT IS DELIBERATELY NOT ASKED. Whether to build the sensor at all (approved in principle). Whether it is stdlib (a shipped check that needs a linter forces every adopter to install it, and `docs/dependencies.md`'s `shipped` tier already makes that the highest bar in the kit). Whether a duplication gate returns (D-7; it does not). Whether to import numeric method-size rules (rejected on measurement - this repo's longest function is 670 lines at cognitive 14, and a 4-argument rule would mint 98 findings in the kit scripts on day one, which is the exact shape D-7 tore down)."""


[open_item.OI-70]
title = "A lane stopped for a HUMAN has no state, and the owner surface cannot see one"
status = "ruled"
ruled_date = "2026-08-31"
ruling_ref = "docs/log.d/2026-08-31-owner-rulings-oi70-71-72.md"
raised = "2026-08-31"
one_line = """RULED 2026-08-31 — the owner: partial stays the only stop and a hold is not a state; every closure produces a handback, and the adjudicator's exits are exactly two — a QUEUED successor WI when the work continues by another route, or a minted OPEN ITEM when the answer is human-owed; deferred/ is never an adjudicator destination unless what it places there is a replacement. Original brief: rule how a lane stopped for the owner's own ruling is RECORDED and SURFACED - today it is a branch rename plus prose, invisible to open-items.html"""
decision = """RULED 2026-08-31 (record docs/log.d/2026-08-31-owner-rulings-oi70-71-72.md): the recommendation below was at odds with the intended design — no held state, no fifth vocabulary. A lane that stops CLOSES PARTIAL; the close produces its handback report; the ADJUDICATOR judges that handback under bounds, with exactly two exits: (A) the work continues by another route — a successor WI is QUEUED; (B) the answer is human-owed — an OPEN ITEM row is minted, which surfaces through vocabulary (d) below with zero new surface code. deferred/ is never an adjudicator destination unless what it places there is a replacement. The wi508 rename-hold was a bypass of this flow, not evidence against it.

MEASURED AGAINST THE BUILD (same session), the model is mostly delivered and three pieces are missing:
- the adjudication-row CLOSE is specced and unbuilt: the ADJUDICATE brief promises "the machinery mints your draft at this row's own close" and nothing does (2026-08-31 run, decision 21 — the dispatcher resumed WI-542 in a cycle until a supervisor closed it by hand). Exit (A)'s drafting half works (WI-550 drafted WI-551); the close that moves the draft into queued/ and archives the adjudication row does not exist.
- exit (B) has no sanctioned path: adjudicate_brief's outcome vocabulary is COMPLETE/PARTIAL/CANCELLED plus a successors section; open-items.toml is hand-authored, and no brief arm, id mint or regeneration step lets an adjudicator produce a row here.
- the BOUND is unenforced: nothing refuses a disposition that names neither a queued successor nor an OI id. The invariant — every handback terminates in (A) or (B), no third exit, nothing silent — is checkable at the adjudication close and today is not checked.

Raised 2026-08-31 out of the WI-508 hold. On 2026-08-30 a supervising session stopped that lane at nineteen review rounds and recorded the stop by RENAMING ITS REF (`wi508-architectural-remap` -> `wi508-architectural-remap-HELD-for-owner-verdict`), because the dispatcher reads finished and parked lanes off the ref and the merge slot would otherwise refuse the lane on the verdict rung and stop every subsequent run. That rename is the only mechanical part of the hold. Everything else about it lives in prose: a line in status.md, an entry in a delegated-run decisions file, and the session log. NO GENERATOR READS ANY OF THEM, so the owner surface said `0 pending rows` for two days while a 43-commit spine lane waited on a ruling.

The surface reads exactly four vocabularies (`gen_open_items.py` + `pending.pending_items`): (a) a work item in `queued/` carrying a `blockref`; (b) `Drafted` or drifted SR rows owing an approval or re-attest; (c) the tracked `docs/work/pause`; (d) `status = pending` rows of this registry. The held lane matched none - its spec is in `active/` with no `blockref`, its Drafted TCs are on the branch rather than trunk, it is not a pause, and no row was ever minted here.

Source (a) is worse than unused: it has NO PRODUCERS LEFT. `handback.close_partial` deliberately moves specs to the TERMINAL `partial/` rather than back to `queued/` with a `blockref` (LLR-161, the anti-livelock property - the old contract let a driver claim, close and re-claim the same row forever), so the only `blockref` in the tree today is the `-000` example row. The loop's own page-human path (`EXIT_NEEDS_HUMAN`) reaches the same close. The consequence: a stuck lane can reach an ADJUDICATOR - the partial close mints a disposition row and a strong session judges it - but it has no path at all to the human's decision surface, and stopping for a human currently MEANS closing the row terminally.

One adjacent weakness, same class: `gen_open_items.py --check` verifies that a log fragment DECLARES its deferred open items (`Deferred open items: ...`), not that the declaration is TRUE, and only at commit time - once fragments compile into log.md the cross-check reads zero declarations. A sitting can honestly write `none` while holding a lane for the owner, and nothing contradicts it."""
blast_radius = """Every future human-owed stop, in both directions. Today the kit's only honest stop is terminal: a lane that needs a ruling either dies as `partial` (its spec archived, a successor minted, the branch's work reduced to a patch) or is held by a bespoke rename that no check, dashboard or generated surface can see. The WI-508 hold has already survived one full unattended run and two supervised sittings without appearing anywhere the owner looks, and its 43 commits, thirteen round files and compiled verdict were single-copy until the 2026-08-31 push to origin. Ruling this also decides whether `pending.blocked_pending` stays a live surface or is retired as dead code, and whether the WI-540-class partial close is the right instrument for `EXIT_NEEDS_HUMAN` at all."""
options = """- (a) RESTORE `blocked` FOR HOLDS ONLY: a hold returns the spec to `queued/` with a `blockref` pointing at the OI row, and the claim rung refuses a blockref'd row. FOR: uses a surface that already exists, already renders, already refuses; no new state. AGAINST: reintroduces the shape LLR-161 removed, and the lane's work stays on a branch whose ref no longer matches the claim directory - the two must be reconciled or the hold is still half-mechanical.
- (b) A FIRST-CLASS `held/` STATE that mints an OI row at hold time and keeps the branch out of the merge queue by declaration rather than by rename. FOR: says exactly what is true; the row is minted by machinery, so it cannot be forgotten in prose; the scheduler and dispatcher stop disagreeing. AGAINST: a new terminal-adjacent state costs a directory, a scheduler arm, a dispatcher arm and the migration note.
- (c) KEEP THE RENAME as the mechanism but make the OI row + a status.md line a REQUIRED ritual, checked by nothing. FOR: zero code. AGAINST: it is what we already did, and it failed - the ritual is exactly the part a tired session skips.
- (d) MAKE `EXIT_NEEDS_HUMAN` MINT AN OI ROW instead of closing the lane partial, leaving the lane parked. FOR: the loop's own page-human becomes visible without a human writing anything; pairs with (a) or (b). AGAINST: a parked lane holds a worktree indefinitely, which is the resource the terminal close was protecting."""
recommendation = """Narrowed by the owner direction above, which supersedes the (b)+(d) recommendation: (1) build the adjudication-row close — it moves the successor drafts into queued/ and archives the ADJUDICATE row; (2) add the OI-mint arm for human-owed outcomes, with the refusal invariant: a PARTIAL or CANCELLED disposition that names neither a queued successor nor a minted OI id is refused at the close; (3) retire `pending.blocked_pending` and the blockref vocabulary (zero producers) in the same slice; (4) keep the original tightening — the fragment's deferred-open-items declaration cross-checked against the registry, not presence-checked. CLARITY ANSWERED (owner, 2026-08-31): (i) the adjudicator mints the OI id from the watermark — docs/id-watermark already carries the OI space, so the mint is the same read-and-bump discipline as WI ids (trace.read_watermark / --bump-ids), no new id machinery (the minor authored-by-marker question was not raised; builder's discretion unless the owner says otherwise). (ii) hold-by-rename is BANNED — a lane must close or it gets lost, as this one nearly was. The mechanization, endorsed by the owner ("the claim directory with a matching branch ref is a good idea"): every docs/work/active/ claim directory must have a matching branch ref, which is the rename-hold's exact signature (wi508: spec in active/, no ref) and the same scheduler/dispatcher disagreement the phantom-head finding names — it rides with the repair set as item (5). (iii) a mixed outcome is PERMITTED: one close may queue a successor for the continuable part AND mint an OI for the human-owed part. RULED on these terms 2026-08-31."""
wi_refs = ["WI-508"]


[open_item.OI-72]
title = "SR-163: how an Approved, Test-verified requirement with no complete TC is satisfied"
status = "ruled"
ruled_date = "2026-08-31"
ruling_ref = "docs/log.d/2026-08-31-owner-rulings-oi70-71-72.md"
raised = "2026-08-31"
one_line = """RULED (the tolerant requirement-reference cell, the four-class checker warn-first, the direct TC proving the checker; WI-543 re-scoped owns SR-163) 2026-08-31 — the owner: the debate over-analyzed it; the expectation is at least one TC tying a template file's production back to a system requirement — even a presence check suffices. Original brief: rule whether SR-163 keeps a directly-tracing TC, is covered only through its LLR arms, or has its Verification class amended - two review rounds of the same reviewer asked for opposite answers"""
decision = """RULED 2026-08-31 (record docs/log.d/2026-08-31-owner-rulings-oi70-71-72.md): the owner — SR-163 was being over-analyzed; the expectation is at least one test case tying back into the production of a file that is in the template, even a presence check tying the file's reason to a system requirement. The confirmed shape (the owner: "then you would add those SRs, and then a test case would just do a cheap test to verify the SR exists and the file exists effectively, and that is the TC that would tie up to SR-163" — confirmed with the checker/TC split, then "Yes that all sounds good, consider all ruled"): references mostly cite EXISTING SRs, a new SR minted only where a shipped file has no justifying requirement; the CHECKER does the cheap verify (reference resolves, file exists, bare entries named) over the real inventory on every run; the direct TC proves the checker catches each of the four classes on a scaffold, so the checker's green carries the standing every-file-maps claim and the TC claims exactly what it exercises. The shipped default for unmapped stays warn-only.

MEASURED AGAINST THE REQUIREMENT'S OWN TEXT (same session), the direction is buildable without either horn of the dilemma below. SR-163 names FOUR finding classes reported under the DECLARED WARNING-TO-GATING POLICY: missing files, stale inventory entries, unresolved requirement references, unmapped files. Two are delivered (the dogfood walk and the bootstrap checks — TC-199/TC-200's evidence). The other two CANNOT OCCUR YET because the MAPPING inventory carries no requirement-reference cell — exactly the undischarged arm LLR-203 records. Because the warn-to-gate dial is in the SR's own text, the honest minimal build is: (1) add the requirement-reference carrier to the inventory and a checker for all four classes; (2) declare unmapped and unresolved WARN initially; (3) mint the direct TC that drives each class on a scaffold — a file with no mapping is REPORTED, which is the true state, so the TC claims exactly what it exercises. Round 013's false-coverage objection and round 019's direct-TC ask BOTH dissolve, and no derived-TC type is needed for this SR. The authoring pass — filling a reference for every inventory row — becomes a visible warn-count burn-down instead of a precondition, which re-scopes the deferred WI-543 from "author the whole join first" to mechanism + burn-down. The wi508 branch's four Drafted rows stay honest as-is (they verify the delivered arms only).

A GENERAL RULE THE OWNER RECALLED, found NOWHERE in the repo (searched the rulings, the log and the process masters this session): an LLR can be satisfied by its parent, but an SR cannot be satisfied by its children unless the children span the SR's full dimensional space and are not interdependent. Not load-bearing for SR-163 under the direction above (its children do not span its space today, and the direct TC makes the question moot here), but worth writing into the spine-authoring doctrine as its own act if wanted.

SR-163 is `Approved` and declares a `Test` verification class, but it has no complete test case that traces it directly. That leaves exactly two possible shapes and the wi508 lane was asked for both: round 013 REMOVED the direct SR-163 targets from TC-199/TC-200 (they verify their LLR arms only), and round 019 asked for a TC to be put BACK on SR-163. Both readings are defensible, which is the signature of a question the requirement itself has not answered: an Approved `Test` requirement with no complete TC must land as either an ORPHAN (no direct coverage, recorded) or FALSE COVERAGE (a TC that claims more than it exercises), and no reviewer can settle that from the diff in front of them.

The deferred WI-543 also answers SR-163, and `check_trajectory` warns that WI-508 and WI-543 are both open against it - so the ruling also decides which row owns the answer."""
blast_radius = """SR-163's cells are `Approved`, so amending its Verification class is a post-attestation amendment: it owes a re-attest and an adjudication under the declared approval level, and it moves the drift count on the next brief. Leaving it as-is keeps a live contradiction in the review loop: any lane that touches the SR-163 chain can be asked for either shape by any reviewer, which is how the wi508 lane spent rounds 013 through 019. The trace surfaces are affected either way - an orphan is reported, false coverage is not, which is the asymmetry that makes the honest option the noisier one."""
options = """- (a) PUT A DIRECT TC BACK ON SR-163 (round 019's ask). FOR: the requirement's declared class is satisfied by construction and the coverage report is clean. AGAINST: the TC would claim evidence it does not fully exercise - the false-coverage side, which the kit's own doctrine refuses.
- (b) LEAVE SR-163 WITHOUT A DIRECT TC, covered through its LLR arms, and RECORD the orphan deliberately (round 013's shape). FOR: honest; the orphan advisory is the system telling the truth about a gap. AGAINST: a standing advisory that every future reader must be told is intentional.
- (c) AMEND SR-163's VERIFICATION CLASS to what it actually is (Demonstrate / Analyze / Attest), and let the TC tier follow. FOR: fixes the requirement rather than the evidence; the tension disappears at its source. AGAINST: an Approved-cell amendment, so it owes a re-attest and an adjudication, and it is the owner's alone.
- (d) DEFER until the remap program lands. FOR: no ruling on an unstable subject. AGAINST: it is precisely what has already cost nineteen rounds."""
recommendation = """Narrowed by the owner direction: none of (a)-(d) as stated — instead build the small missing mechanism and mint the direct TC it makes honest: the inventory requirement-reference carrier, the four-class checker under the declared warn-to-gate policy (unmapped/unresolved start WARN), the TC driving each class on a scaffold, and WI-543 re-scoped to own the mechanism plus the reference burn-down. Name WI-543 (re-scoped) the owning row so it and WI-508's successor stop answering the same requirement. THE OWNER'S FOCUS (2026-08-31): start with SR-163 alone — it is the one-off. THE TWO CLASSES WITHOUT MECHANISM OR TEST COVERAGE, stated plainly: (3) UNRESOLVED REFERENCE — an inventory entry names a requirement id that does not exist or does not chain up to a stakeholder need — and (4) UNMAPPED FILE — a file ships and no requirement says why it exists. Neither can even occur today, for one shared root cause: the inventory (MAPPING in bootstrap.py, a list of source->destination pairs) has no place to record WHY a file ships. One mechanism resolves both: give each entry a requirement reference, plus a checker that verifies every reference resolves (class 3) and names every entry that carries none (class 4). THE CARRIER OPTIONS IN PLAIN TERMS: (cell) each MAPPING row becomes a triple — ("PROCESS.md", "docs/process.md", "SR-###") — the id is data the checker reads directly; (comment grammar) rows stay pairs and a structured comment beside each (# req: SR-###) is parsed, the pattern gen_arch_map already uses for Implements: lines; (sidecar) a separate file listing destination->requirement, which SR-163's own rationale already rejects — the coverage universe must be "a declaration that exists rather than a second list that drifts". RECOMMENDED: the cell, read TOLERANTLY — a checker that accepts both pairs and triples makes every remaining pair an unmapped-entry warning by definition, so downstream MAPPINGs keep working with no flag day and the burn-down IS the migration. THE POLICY DIAL IN PLAIN TERMS: per class, does a finding fail the build or print a warning? Missing files and stale entries already fail tests and stay failing; unresolved and unmapped start as warnings (on day one nearly every entry is unmapped) and flip to failing in a reviewed commit when the count reaches zero — and the SHIPPED default for unmapped stays warn-only (ruled with the rest, per the kit's conservative-shipped-checks stance). The children-coverage rule the owner recalled: write it into the spine-authoring doctrine as trust-based prose — the owner notes there may be no efficient validation beyond trust, and none is proposed."""
wi_refs = ["WI-508", "WI-543"]

[open_item.OI-73]
title = "Typed OI dependencies and the mandatory successor: the ordering OI-70's two exits left open"
status = "ruled"
ruled_date = "2026-08-31"
ruling_ref = "docs/log.d/2026-08-31-owner-ruling-oi73.md"
raised = "2026-08-31"
one_line = """RULED ((a), the full posture) 2026-08-31 — the owner: typed OI edges in needs, a mandatory successor at every partial close, inbound hard edges replaced at the mint, the OI (when minted) a dependency of the successor rather than a standalone exit; WI-552 re-scoped to carry all four arms. Original brief: rule whether a WI's needs list may carry OI ids as hard, gating edges, and whether every partial close must queue at least one successor whose inbound needs edges are REPLACED at the mint"""
decision = """RULED 2026-08-31 (record docs/log.d/2026-08-31-owner-ruling-oi73.md): (a), the full posture as recommended — the owner: "Agreed with recommendation, please update the frontier and current WI scope as needed." OI ids become valid hard tokens in needs, satisfied when the row leaves pending; every PARTIAL or CANCELLED disposition must queue at least one successor (an OI alone no longer discharges the refusal invariant — OI-70's exit-(B)-alone case is retired); the mint REPLACES the superseded row's inbound hard needs edges; dead_dependency_findings extends to partial as the validator net. WI-552 is re-scoped in the ruling commit to own all four arms; no new row.

The original brief follows. Two gaps measured against the 2026-08-31 hand-back mechanization, raised the same day the OI-70/71/72 rulings landed:

(1) A MIXED OUTCOME HAS NO ORDERING. OI-70 permits one close to queue a successor AND mint an OI, and WI-552 builds both arms — but nothing ties the successor's READINESS to the OI's RULING. The only mechanized OI->WI link is advisory: intake.context_block injects pending OIs whose wi_refs intersect the session's scope as premise-risk context, and is explicitly never gating. A successor whose premise awaits a human answer is schedulable the moment it lands in queued/; today only adjudicator judgment holds it back.

(2) THE STRAND CLASS IS SILENT. A WI hard-depending on a row that closed partial can never become ready (schedule.hard_preds_satisfied requires exactly done), and no finding fires: check_trajectory.dead_dependency_findings tests only cancelled, though partial is equally terminal to the scheduler. The WI-541 -> WI-540 strand waited invisibly and was repaired by hand (commit b708a604, needs re-pointed to WI-551). WI-552 Done-when 4 covers the mint-time half (re-point or loudly report) — but the OI-only exit mints no successor at all, so the closed row's dependents have nothing to re-point to until the ruling, and the validator says nothing meanwhile.

THE OWNER'S POSTURE (2026-08-31, stated when raising this item): simplify. Every partial close MUST queue at least one successor WI; inbound hard needs edges on the closed row are REPLACED with the successor at the mint; and the successor MAY carry an OI id in needs where the answer is human-owed and the adjudicator found no alternative route — the OI exit becomes a typed dependency of the successor rather than a standalone exit. An OI edge is hard and is satisfied when the row leaves pending. This refines OI-70 rather than re-litigating it: BlockRef was retired as free text with zero producers; a validated OI edge read by the loaders, the validator and the scheduler is a different instrument."""

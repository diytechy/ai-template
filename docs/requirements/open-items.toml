options = """TWO PARTS, RULED IN ORDER. Part A is safe to rule alone; Part B is not - its migration would be redone if A changes which rows exist.

### PART A - the partition

- (A1) RATIFY THE CURRENT 5 - declare the existing partition correct. FOR: zero migration; the repo ships against it and reports `component-findings=0` today. AGAINST: it ratifies an accident, it answers the optimisation question by declining to ask it, the zero it leans on is partly vacuous, and it leaves the three measured one-behaviour-two-homes violations with no architecture that forbids them.
- (A2) DERIVE FROM TODAY'S MODULE GRAPH - cluster the 55 existing modules on their import coupling. FOR: the input exists now, needs no requirements, and is cheap. AGAINST: REFUTED BY THE STATED PURPOSE - clustering what exists ratifies the duplication and contradiction already in it, which is the one thing the architecture is for. It would have drawn a boundary around all five homes of the declared-line reader and called it cohesion.
- (A3) DERIVE FROM THE SYSTEM'S I/O, RULE ONE - declare the boundary, take a first-cut functional decomposition from the needs, score candidate partitions with ONE HOME PER BEHAVIOUR as a hard constraint and cut-count as the tie-breaker, and bring a RANKED SHORTLIST for a human to name and choose from. FOR: it is the method the owner prescribed, it is formative rather than descriptive, and it produces the rework list as a by-product - the delta between the derived partition and today's tree. It leaves the reproducible record SN-040 requires. AGAINST: the most work of the three, it will surface rework the owner has accepted in principle but not yet sized, and the tie-breaker is a proxy that cannot see volatility - so the shortlist must be ranked FOR a human, never selected BY the tool.
- (A4) DEFER PAST THE LOCK. FOR: keeps the lock program small. AGAINST: it strands Part B, the interfaces conversion and SN-037 behind an item explicitly deferred - which does not defer their cost, only moves it behind a wall.

### PART A - the boundary rung (rulable separately)

The sequence needs a declared system boundary BEFORE SRs are written, and DevStg-Reqs's bar does not ask for one. Three ways to close that, and it is a shipped process change either way.

NOTE, 2026-08-12 after OI-21's re-ruling (citation updated to the CANONICAL ladder): the eight-rung ladder names the boundary as rung 1 (declared ONCE) and architecture as rung 3, AFTER the requirements rung - so the ORDERING half of this rung is ladder-borne for every project: the boundary precedes SRs by construction. A5/A6/A7 stay live as the ENFORCEMENT question (what the harness requires before the next rung, and for whom) - restated in stage vocabulary since DevStg-Reqs retires: A5 means -a hard bar at the boundary rung's exit-, A6 the same bar with an applies-when, warn-first. This item's partition ruling also supplies the artifacts rungs 1 and 3 gate on, which is why OI-21's program is sequenced AFTER part A. Reconciliation of this item's own ruled sequence (boundary, functional decomposition, PARTITION, SRs, RE-SCORE) with requirements-before-architecture lives in OI-21's ladder section: the first-cut functional decomposition IS the requirements rung's first pass, and the re-score is the LOOP the min-fold carries, not a rung.

- (A5) REQUIRE IT AT DevStg-Reqs - the boundary is a DevStg-Reqs deliverable: every crossing an interface row, typed, with the set declared complete. FOR: SRs stop being blessed without a frame to be written against, which is the gap; the mechanism half-exists already (15 of 113 rows name an external counterpart). AGAINST: it hardens DevStg-Reqs for every adopter, including projects small enough that the boundary is obvious.
- (A6) REQUIRE IT WITH AN APPLIES-WHEN - same obligation, opt-in by project size or profile, warn-first until a project is held to the DevStg-Tests bar. FOR: proportionality (SN-012) says heavy layers cost a project that does not use them nothing; a three-file project genuinely does not need a formal context declaration. AGAINST: the projects most likely to skip it are the ones whose boundary later turns out to have been guessed.
- (A7) LEAVE IT IMPLICIT - no boundary artifact; the external interfaces accumulate as they are noticed. FOR: zero process change; it is what happens today. AGAINST: it is also WHY only 15 rows are external - the set was never declared, so nothing says whether it is complete, and an SR can be written against a boundary nobody has stated.

### PART B - the contract

The direction is already ruled, so these are about ENFORCEMENT and MIGRATION - what a check can honestly police, and what happens to 113 existing cells.

- (B1) DECLARE PLUS SCHEMA TIER NOW, SPLIT GRADUALLY - write the contract into `PROCESS.md` section 8 and the shipped template, add the missing columns (a `Rationale` home for the why, and the ruled discrete-vs-variable signal type), build IF's first schema tier (required fields, closed vocabularies for `Stability`, `Status` and the new type), and let existing cells migrate as rows are touched. FOR: new and amended rows land correct immediately; the schema tier is the part that makes every LATER rule cheap, including the owner's typing rule, which is unenforceable without it; no bulk prose rewrite means no chance of silently losing load-bearing knowledge. AGAINST: the 113 existing cells stay mixed for as long as nobody touches them, so the planning-brief dilution persists on the untouched majority.
- (B2) DECLARE PLUS SCHEMA TIER PLUS SWEEP ALL 113 - migrate every cell in one batch. FOR: the corpus is correct at a known date rather than converging indefinitely; the planning briefs stop carrying narrative immediately. AGAINST: 113 prose rewrites is a commit nobody can review carefully, which is how load-bearing maintainer knowledge gets quietly deleted - and the census says the knowledge is real, just misfiled. It is also the option most likely to be redone, since Part A may change which rows should exist at all.
- (B3) DECLARE ONLY, DEFER THE SCHEMA TIER - state the contract, build no checks, revisit with the component work. FOR: smallest immediate step; nothing is built that a partition change might invalidate. AGAINST: it is the status quo with better documentation - and the re-measurement is the argument against it, because this item has been declared-in-spirit since 2026-08-09 while every drift metric got worse. A rule with no enforcer did not hold for three days."""
recommendation = """(A3) THEN (B1), IN ONE SITTING AND IN THAT ORDER - derive the partition from the system's declared inputs and outputs with one-home-per-behaviour as a hard constraint, then declare the contract and build the schema tier that makes it enforceable.

- The deciding reason is the ASYMMETRY, not a preference: Part A decides which rows exist and Part B decides what they must say, so A-then-B costs one pass while B-then-A risks migrating cells on rows the partition then moves.
- If the sitting has time for only one part, take PART A - it is safe alone and it unblocks the rest.

OWNER EXCHANGE (2026-08-21), ANSWERED BUT NOT YET RULED: the owner asked why reaching implementation would require the test suite to run - once the test registries are Founded the spine is broken down, DevStg goes to implementation, and these checks should run in parallel. The answer (recorded in the 2026-08-21 rulings fragment): nothing requires the suite to PASS to enter implementation - the defect is the inverse. The three checks are TAGGED to run only at the DevStg-Impl bar, and OI-30 D2 deliberately made that bar unreachable from status cells (a Status cell must never claim "the evidence passed"; only the future harness driver may). So during exactly the phase the owner describes, the selector never schedules format/lint/tests on a push or PR. The owner's described end state IS option (a): re-tag the three to {DevStg-Tests, DevStg-Impl} so they RUN from decomposition onward, with the pass/fail evidence claim staying where D2 put it. Awaiting the owner's word now that the mechanism is stated.

RECOMMENDED: (a) as the interim, with (b) as its stated terminus - and the reason to rule it rather than leave it is that the current state is the one thing nobody has actually chosen.

The substance. OI-30 D2's guard rail is right and nothing here asks to weaken it: a status cell must not be able to claim "the evidence passed". But the ceiling was reasoned about as withholding ESCALATION, and the enumeration behind that reasoning ("every consumer of DevStg-Impl is monotone-stricter in the bar, so withholding it relaxes no check that was running") has one counterexample the enumeration missed - the harness's own step SELECTION. Withholding DevStg-Impl from the selector does not merely decline to escalate; it withdraws the three checks that were only ever scheduled there. For this repository that was invisible, because nothing here had reached DevStg-Impl and because the CI matrix runs the whole suite anyway. For an adopter with a decomposed spine and no such matrix, it is the difference between a checked pull request and an unchecked one.

WHAT MAKES (a) SAFE TO TAKE IS THAT IT MOVES A DIFFERENT AXIS. It does not let a status cell assert that tests PASSED - it says tests should RUN once the spine says code and test cases exist. The pass/fail claim stays where D2 put it: with the harness. So (a) and (b) are complements, not rivals, and (a) can be withdrawn by the same one-line edit the day (b) lands.

WHAT TO CHECK BEFORE RULING (a), because it is the part most likely to bite: a decomposed adopter's FIRST push after re-syncing will run `ruff format --check`, `ruff check` and the full test command at the tests bar. That is the intended effect, and it should ride a RESYNC_PACK entry stating it plainly rather than arriving as a surprise red. This repository cannot rehearse it - `ex-draft` here is DevStg-Reqs - so if a rehearsal is wanted, the WI-473 fixture already builds a mature scaffold and is the cheapest place to add one.

DECLINE (d) SPECIFICALLY. It is the option that looks most accommodating and is the only one that ends with a repository able to declare its way out of lint and tests while still reporting green.

ONE THING THE RULING DOES NOT NEED TO SETTLE: the floor's own basis. WI-473 built it on `ex-draft` (derived, no stored state), which process.md section 4 pre-authorizes as "a second, derived high-water number shown BESIDE the honest one". It is monotonic against DRAFTING - the act C-01 names - and it is NOT a universal watermark: approving a row less mature than the spine's min, or demoting a ratified one, still lowers it. Both are reviewed human-held acts visible in a tracked derived file's diff, which is the sanction for a deliberate lowering. If a STRICTLY monotonic floor is ever wanted, that is a stored high-water mark and a separate row; it is not needed to rule this one."""
wi_refs = ["WI-473", "WI-498"]


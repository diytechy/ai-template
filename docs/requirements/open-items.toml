- (b) SOFTEN + TIGHTEN: a wording change in `PROCESS.md:161` and `AGENTS.template.md:83`/`:102` (both BYTE-WATCHED or capped - `AGENTS.template.md` is hard-capped at 10,000, so the edit must be net-neutral or shrinking), plus a guard in `gen_arch_map.implements()` requiring the literal `Implements` token before harvesting. THE HARVESTER CHANGE IS NOT COSMETIC: it would empty the map's third column for 48 of the 50 symbols that currently populate it, which is the honest state and will read as a regression to anyone who has seen the column full. `tests/test_arch_map.py` needs a case pinning that prose is no longer harvested.
- (c) OFT-STYLE REVISIONED MARKER (`artifact~name~revision`): the largest change - the spine gains a revision field per row, the marker grammar changes, every existing marker is re-authored, and the kit gains a downstream migration. It is also the only option that reaches MEANING, by turning a requirement's revision bump into a reported defect at every stale covering tag.
- (d) DO NOTHING is the CURRENT STATE, and it is not free: the shipped guide states a rule the kit itself follows at 0.26%, which is the paraphrase-drift/silent-conflict shape the instruction-file pack warns about - an agent reading `AGENTS.template.md` is told to do something the surrounding code demonstrably does not do.
- NO SPINE COST UNDER ANY OPTION EXCEPT (c): nothing here moves a `status` cell, mints or retires a spine id, or opens a re-attest window.
- INDEPENDENT OF OI-39 IN BOTH DIRECTIONS. If OI-39 mints its SR, this row is still open; if OI-39 rules not-owed, this row is still open."""
options = """- (a) ENFORCE EXISTENCE CHEAPLY - a stdlib regex scan asking only whether each spine id appearing in a source comment names a LIVE registry row, or is explicitly marked as history by a declared marker. FOR: it is language-agnostic BY CONSTRUCTION, since it reads comment text rather than syntax, so it costs an adopter no toolchain and no dependency; it would have caught the 8 dangling ids measured above, including `dispatch.py:310`'s SR-141, which a hand audit wrote and then missed; and it stays strictly inside what D-4 permits - existence is decidable, meaning is not, and the check claims only the former. AGAINST: it needs a HISTORY MARKER convention first, or it fires on the 11-of-69 class WI-425 correctly kept, and inventing that marker is a real design decision rather than a regex; it verifies nothing about correctness, so a comment citing a live-but-wrong id passes clean; and it does not raise adherence at all - a file with zero back-links passes trivially.
- (b) SOFTEN THE SHIPPED GUIDE TO MATCH OBSERVED PRACTICE, AND TIGHTEN THE HARVESTER. Re-word `PROCESS.md:161` and `AGENTS.template.md:83`/`:102` from an unconditional requirement to what it actually is - a recommended annotation where a symbol's requirement lineage is not obvious from its LLR row - and change `gen_arch_map.implements()` to harvest ONLY from a literal `Implements:` declaration, so the map's third column reports declarations instead of prose. FOR: it fixes the thing that is WRONG rather than the thing that is merely absent - a column 97% fabricated is worse than an empty one, because it is read as evidence; it removes a shipped rule that the kit itself fails at 99.7%, which is the exact instruction-file failure mode the repo has evidence for; it is the cheapest option in code; and it makes the enforcement-audit row honest rather than stale. AGAINST: it is a RETREAT, and the record will show a shipped obligation narrowed to fit observed practice - the pattern OI-40 names as "a bad habit if it becomes routine"; DO-178C section 11.21 does require the LLR-to-source ASSOCIATION (though not its representation), so an adopter in a regulated setting still needs an answer, and softening the guide without pointing them at one leaves them worse off; and the empty column will read as a regression.
- (c) ADOPT AN OFT-STYLE REVISIONED MARKER - `artifact~name~revision`, so bumping a requirement's revision turns every stale covering tag into a REPORTED DEFECT. FOR: it is the only mechanism found anywhere in the research that addresses MEANING without a per-site human ruling - it does not decide whether a tag is still right, it DEMANDS the human decide, at the moment the requirement changes, which is exactly when the answer is cheap; and it converts silent decay into loud failure, which is this repo's stated preference. AGAINST: it is by far the largest change - a revision field on every spine row, a new marker grammar, every existing marker re-authored, a downstream migration; it makes the 0.26% adherence WORSE before better, since the harder the marker the fewer get written; and it presumes the back-link obligation is worth keeping at all, which is the question this row is actually asking.
- (d) DO NOTHING - leave the mandate stated, unenforced, and the harvester as it is. FOR: nothing is broken today in the sense of a failing check, and `docs/enforcement-audit.md` already RECORDS the gap honestly, which is what that document is for. AGAINST: THIS IS THE CURRENT STATE, so choosing it ratifies rather than resolves - and the audit's own entry is now stale (it says the column is empty; it is not), so the one artifact that was catching this has stopped describing it accurately. Doing nothing also leaves the fabricated column shipping to adopters.
- (e) MEASURE REVERSE COVERAGE AND WARN BELOW A DECLARED THRESHOLD (owner proposal, 2026-08-19) - an existence scan asking, for each LIVE LLR row, whether any literal `Implements:` declaration anywhere in the declared source surface names it; report the percentage and WARN when it falls below a threshold declared in `docs/process.toml`. THE THREE SCOPING CHOICES, each reusing a declaration this repo already has rather than minting a rival one: SURFACE = `docs/stack.ini`'s `[paths] src` roots, and NOT its `tests` roots - an LLR that is verified but never built must not score as implemented, and the LLR-to-TC link is already in the registry. FILE TYPES = a declared extension list defaulting to `gen_arch_map._MODULE_EXTS` (`.py .sh .ps1 .ts .js .go .rs .cmd` - the kit's existing answer to "what is a source module", already kept in sync with `trace.py` and `check_trajectory`), extended with the families that list half-covers (`.tsx .jsx .mjs .cjs .java .kt .c .h .cpp .hpp .cs .rb .php .swift .scala .lua .sql`) and overridable per repo. GRAMMAR = the literal `Implements:` token only, which is (b)'s tightened harvester grammar, so the two arms share ONE definition of a back-link instead of two.
  FOR: it is the ONLY option here that MEASURES ADHERENCE - every other option polices the back-links that exist or removes the obligation, and none asks whether there are enough. It is therefore the direct answer to (a)'s own AGAINST, which concedes in terms that "a file with zero back-links passes trivially". IT ALSO SIDESTEPS THE HISTORY-MARKER DESIGN DECISION THAT BLOCKS (a), and this is the structural point rather than a convenience: running LLR-to-code instead of comment-to-registry, it never judges an id found in a comment, so a retired id narrating accurate history is simply not counted, and D-4 needs no new marker convention. The prerequisite that makes (a) "the actual work" does not exist for (e). It is stdlib regex over text, so it is language-agnostic by construction exactly as (a) is, and costs an adopter no toolchain. And it reaches (b)'s goal by a DIAL rather than by a RETREAT: the obligation becomes configurable instead of unconditional, so an adopter in a regulated setting (DO-178C 11.21) raises the number rather than being left with a softened guide and no answer.
  AGAINST: THE DEFAULT IS THE WHOLE ARGUMENT, AND 50% IS THE WRONG ONE. Reverse coverage measured here is 1 OF 161 LIVE LLR ROWS - 0.6%. A 50% default ships a check that fires on its FIRST RUN in the kit's own repo and in every scaffold an adopter creates, failing a bar its own author misses by roughly 80x - which is the precise defect this row documents one paragraph up. The dial should ship at `0` or `off` (report the number, gate nothing) with 50% recorded as the target to raise when practice earns it; shipped at 50% it reproduces (d)'s "stated and ignored" in a new form, with a warning class that trains readers to skip it. A SECOND ASYMMETRY CUTS AGAINST THE INSTINCT TO CAST THE FILE LIST WIDE: because the denominator is the LLR count, widening the extension list can only RAISE the score and never lower it, so over-inclusion produces false PASSES, not false failures - a stray `LLR-040` in a config comment scores as a carrier. The conservative list is the tight one. It measures PRESENCE and never CORRECTNESS, so a back-link naming the wrong symbol counts clean. And it is more code than (a) or (b) - a scan, a `[checks]` key, a check step, and an SR/LLR/TC if the check is itself to be traced - landing during a program that is trying to close."""
recommendation = """RULED (owner, 2026-08-20) - (b) + (e) + THE CAMPAIGN, the direction-compliant shape this cell already argued: the harvester tightening lands FIRST and the shipped guide re-words onto the declared dial rather than the unconditional mandate (WI-486, sharing the `gen_arch_map` landing with WI-478's Contracts-grammar fix, and correcting the stale enforcement-audit row in the same change); (e)'s reverse-coverage scanner ships REPORT-ONLY with its threshold dial in `docs/process.toml` and 50% recorded as the target (WI-486); then the back-link campaign writes the tags with a code-review pass and raises the dial to a bar the tree actually clears (WI-487) - the number goes up because the tags landed, never because the bar came down. (c)'s revisioned marker is RE-CONSIDERED at the campaign's close as the decay answer, per the owner direction that reversed the not-worth-the-machinery premise. The pre-ruling text is preserved below.

(b) SOFTEN THE GUIDE AND TIGHTEN THE HARVESTER - with (a)'s existence scan as a cheap second arm once a history marker is declared. NOT (c), and NOT (d).

THE DECIDING ARGUMENT IS THAT ONE HALF OF THIS IS NOT A GAP, IT IS A DEFECT. Everything else here is an absence - a rule nobody enforces, a convention nobody follows. The harvester is different in kind: it is SHIPPED MACHINERY PRODUCING FALSE STATEMENTS. `trace.id_sort_key`'s docstring explains that SR-9 sorts before SR-10, and the generated code map records that function as implementing SR-9 and SR-10. `trace.triangle_findings` poses a counter-example about LLR-1 and SR-2, and the map records three more. 60 of the 62 back-links in that column were never written by anyone, and 13 of them point at nothing. A traceability artifact that invents links is worse than one that has none, because a reader can only discount what they know is empty. That half should be fixed regardless of how the rest is ruled, and it is a few lines: require the literal `Implements` token before harvesting.

THE OTHER HALF IS A CHOICE BETWEEN TWO HONEST STATES, and 2-of-781 decides it. A rule stated unconditionally in two shipped documents and followed at 0.26% by its own authors is not an under-enforced rule; it is a rule the repo has already declined by revealed preference over hundreds of opportunities. The options are to make the words true or to make the code true. Making the code true means writing 779 back-links and maintaining them - and the maintenance side is where the evidence is worst: no standard requires the representation, no surveyed commercial tool requires it, every proxy says such conventions decay, and this repo's own WI-425 measured 69 stale sites from ONE retirement, needed a full human read to fix them because D-4 makes a retired id in prose accurate history, and the fix ITSELF was stale in three days. Making the words true costs two sentences.

(c) IS THE BEST IDEA IN THE FIELD AND IS STILL REFUSED HERE, which is worth saying plainly rather than burying. OpenFastTrace's revision suffix is genuinely clever - it does not try to judge whether a tag is still correct, it forces a human to re-judge at the one moment the answer is cheap, and it is the only mechanism found that converts silent decay into loud failure. If this repo were going to keep the back-link obligation, (c) is how it should be kept. But it presupposes the obligation is worth the machinery, and 2-of-781 says it is not. RECORD IT AS THE DESIGN TO REACH FOR IF THE OBLIGATION IS EVER RE-ADOPTED, rather than losing it with the ruling.

(a) IS WORTH BUILDING, JUST NOT AS THE ANSWER. It is cheap, it is language-agnostic by construction, and it caught something real: `dispatch.py:310` cites SR-141, written by the very campaign that was cleaning up dangling citations, three days before its target merged away. But note what it does NOT do - it does not raise adherence, and a file with no back-links at all passes it clean. It polices the ids that ARE written; it never asks for more. That is the correct scope given D-4, and it is also why it cannot be the whole answer. It should follow (b), not precede it, because a declared history marker is a prerequisite and inventing one is the actual work.

(e) SUPERSEDES (a) AS THE SECOND ARM, AND THE SITTING SHOULD TAKE IT IN (a)'s PLACE - an amendment to this row's original recommendation, made on the owner's 2026-08-19 proposal and stated here rather than silently folded in. The reason is not that (e) is larger; it is that (e) IS NOT BLOCKED AND (a) IS. (a) cannot be built until a history-marker convention is declared, because without one it fires on the eleven-of-sixty-nine sites WI-425 deliberately KEPT as accurate history - and inventing that convention is a design decision this row cannot make. (e) never encounters the question: it runs LLR-to-code, so a retired id in a comment is not a subject it has an opinion about. The prerequisite disappears rather than being met. (e) also answers the one thing (a) concedes it cannot - whether the convention is followed at all - which is the question 2-of-781 actually raises. Build (a) later if the marker is ever declared for other reasons; it stays the right instrument for dangling citations, and `dispatch.py:310` is still un-caught by (e).

THE ONE AMENDMENT (e) MUST CARRY INTO ITS RULING IS THE DEFAULT, and it should be ruled explicitly rather than left to the implementer. Shipping the threshold at 50% against a measured 0.6% would make this row's own central finding true of its own remedy: an unconditional bar the author fails by 80x, stated in a shipped artifact, ignored in practice. Ship the MEASUREMENT at a `0`/`off` default so the number appears in every run and gates nothing, record 50% as the target, and let a repo raise the dial when its practice has earned the bar. A check that starts by reporting 0.6% and stays quiet is worth more than one that starts by warning and is silenced in week one.

"DO NEITHER" IS THE CURRENT STATE, AND IT IS WHAT `docs/enforcement-audit.md` EXISTS TO CATCH. That is the sharpest thing this row has to say about (d). The audit already carries the row - "Prose (gap) ... not required by any check", closing it "filed, not built" - and the mechanism worked exactly as designed: the gap was named honestly and left visible. What it did NOT do is stay accurate. Its finding 2 says "the meta-repo's own scripts carry none and the column is empty"; two carry it, and the column is populated for 50 symbols, nearly all fabricated. So the single instrument this repo relies on to keep an unenforced rule visible has itself drifted away from the rule it is watching. Ruling (d) means trusting that instrument for another cycle after it has just been shown to go stale - and whichever option is ruled, THE AUDIT ROW SHOULD BE CORRECTED IN THE SAME CHANGE.

OWNER DIRECTION, 2026-08-19 - A DIRECTION, NOT A RULING, AND IT OVERTURNS THIS ROW'S DEFAULT-THRESHOLD ARGUMENT ON PURPOSE. The owner's reading of the 0.6%: coverage is low BECAUSE THE TAGS ARE MISSING FROM MOST SURFACES, not because the convention is unwanted - so the remedy is to write them, not to lower the bar to meet their absence. CLOSING THIS ROW THEREFORE INCLUDES THE CAMPAIGN: (e)'s scanner is built, AND the back-links are actually set in the code - now or as its own work item - with a CODE REVIEW pass over the tags so each one names the requirement the symbol genuinely fulfils. Under that direction 50% is not an unmet bar, it is the target the campaign is sized to clear, and the report-only default argued above becomes a staging step rather than the destination.

WHAT THIS CHANGES IN THE RECOMMENDATION ABOVE: the "ship at 0/off" argument stands only as SEQUENCING, and it should be stated that way rather than dropped. Land the scanner reporting, run the campaign, then raise the dial to a threshold the tree already clears - so the number goes up because the tags landed, never because the bar came down. That ordering also gives the campaign its own instrument: the percentage is the progress bar, which is exactly what a back-link campaign has otherwise never had.

WHAT DOES NOT CHANGE, AND THE CAMPAIGN MUST BE DESIGNED AGAINST IT RATHER THAN AROUND IT: THE MAINTENANCE EVIDENCE IS ABOUT DECAY, NOT ABOUT INITIAL EFFORT. Writing 779 back-links is a bounded, reviewable pass and the owner is right that it is achievable. The measured hazard is what happens after: WI-425's hand audit repointed 56 sites by what they name, and one of its OWN repairs (`dispatch.py:310`, SR-141) was stale in THREE DAYS and unnoticed for four more; `adjudicate_brief.py` was BORN citing ids retired the day before. A campaign that lands 50% coverage and then decays is worse than 0.6%, because the column reads as evidence. So the campaign owes a decay answer, and this row already surveyed the field: option (c)'s revisioned marker is the only mechanism found anywhere that converts silent decay into loud failure without a per-site human ruling. THE HONEST SHAPE OF A DIRECTION-COMPLIANT RULING IS THEREFORE (b) + (e) + THE CAMPAIGN, WITH (c) RECONSIDERED as the thing that keeps the campaign's result true - it was refused above only on the premise that the obligation was not worth the machinery, and this direction reverses that premise.

ALSO UNCHANGED: (b)'s harvester fix is owed regardless and should land FIRST, before any tag is written. `gen_arch_map.implements()` currently harvests any spine id from nearby prose, so 60 of the 62 back-links in the map were never declared by anyone and 13 name no live row. Running a coverage campaign against a fabricating harvester would measure the campaign's progress with an instrument that invents its own inputs - the tightened literal-`Implements:` grammar is what makes (e)'s percentage mean anything at all.

INDEPENDENT CORROBORATION, 2026-08-19 (the repository review, archived at `docs/archive/repo-review-2026-08-19.md`). The review reached this row's picture from outside and named it as the owner of the `Implements:` drift class. One ADJACENT defect in the same module is new: `gen_arch_map`'s `Contracts:`-line parser harvests IF declarations from the marker line only, so continuation-line declarations report as undeclared (review M-09, minted as WI-478) - if this row's ruling lands (b)'s harvester tightening, share the landing with WI-478 so the module's two parsing grammars move once. The review's stale-anchor claims for the OTHER direction were verified at 3 of 5 (WI-482, with two claims refuted) - a small live demonstration of this row's own bound that existence is checkable and meaning is not. The recommendation does not change."""


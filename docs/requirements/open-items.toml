- requirement voice 1 percent to 7.1 percent (8 rows now say -must-);
- rows citing `repo-lock D-n` 11 of 110 to 14 of 113;
- median cell length 260 to 325 characters, mean 323 to 372;
- rows over 500 characters 21 to 34;
- cross-registry citations 14 percent to 23.9 percent (27 rows name a `WI-` id in `Contract`; 34 cite any registry id; an earlier 24.8 figure was not reproducible at re-measure);
- only the maximum is unchanged at 968, and it is the same row.

THE CONTENT IS NOT MISJUDGED, IT IS UNFILED, and the reason is structural rather than careless: the kit is stack-agnostic so a type signature cannot be demanded (a seam may be a file format, a CLI, or an external actor), and the IF row has NO `Rationale` and NO `Detail` column, so the why has nowhere else in the row to go.

WHAT THE NEW DIRECTION ADDS THAT THE ORIGINAL BRIEF DID NOT CONTEMPLATE: nothing in the registry today types a signal at all - all 113 rows were searched for a discrete/variable or type/kind distinction and there are ZERO hits, in any column - so the owner's typing rule is a new column plus a rule to validate it, not a convention to write down."""

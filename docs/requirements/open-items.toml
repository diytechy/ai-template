[open_item.OI-63]
title = "Does the interface `contract`'s irreducible remainder move to a contract header on the owning component's side, or stay in the cell - and what happens to the 15% that belongs in neither"
status = "ruled"
ruled_date = "2026-08-25"
ruling_ref = "docs/log.d/2026-08-25-owner-rulings-oi63-oi64.md"
raised = "2026-08-25"
one_line = """Discharges obligation 2 of OI-62's option (e), MEASURE, DO NOT REWRITE: decide whether irreducible `contract` content moves to an owning-component header or stays in-cell. Across 108 non-CLI rows, WI-516 found 64.3% restatement (CLI: 87.7%) and remainder on 65.7% of rows (CLI: 40.7%). It also found that 15.3% is non-crossing registry bookkeeping, provenance, or argument belonging in neither home."""
decision = """### Origin

OI-62 ruled (e), MEASURE, DO NOT REWRITE (owner, 2026-08-24): classify all 108 non-CLI `contract` cells without editing any, record durable per-row verdicts, then file the relocation question with the per-family numbers. This row discharges obligation 2 of that ruling: *"at the pass's close, the relocation question - does the irreducible remainder move to a contract header / output-interface declaration on the owning component's side, or stay in the cell - is FILED as its own open item with the measured per-family numbers in its brief."*

The owner's question, verbatim: *"if enough appear to be restatement, my next question would be if the unique content that does exist in the contract today should instead be absorbed as some sort of contract header / output interface definition on the owning component side rather than something sitting in the contract row."*

### The measured numbers

From docs/plans/2026-08-25-if-contract-verdicts.md - every row read, never regexed; the per-row table there is the derivation, and summing it reproduces every figure below. Independently re-summed EXACT by the 2026-08-25 cross-family review.

- rows: CLI 27 | Provides 19 | Consumes 89 | combined 108
- characters: CLI 7,385 | Provides 10,278 | Consumes 33,717 | combined 43,995
- RESTATEMENT: CLI 87.7% | Provides 75.9% | Consumes 60.8% | combined 64.3%
- irreducible REMAINDER: CLI 12.3% | Provides 21.2% | Consumes 20.2% | combined 20.4%
- NON-CROSSING: CLI not a category | Provides 2.9% | Consumes 19.0% | combined 15.3%
- rows carrying a remainder: CLI 40.7% | Provides 84.2% | Consumes 61.8% | combined 65.7%

### The categories, defined once

- RESTATEMENT - content recoverable from another home: the owner row, the harvested module surface, a committed generated reference or declared policy, the row's own other cells, or the consumed medium's header.
- IRREDUCIBLE REMAINDER - a typed fact about the crossing with no other home, recoverable only from the implementation. Classes: A written artifact / named medium; B fail-loud guarantee; C exclusion or negative claim; D typed shape / wire format; E closed vocabulary; F consumer-side obligation (binds the reader); G purity / idempotence / determinism / network-gating posture; H compatibility guarantee; I counterparty calling convention.
- NON-CROSSING - neither recoverable elsewhere nor about the crossing: M module internals; X registry bookkeeping, provenance, or argument about why the row exists.

### What was found - five facts

- The pilot was the outlier. Only 19 of 108 non-CLI rows are pure restatement end to end (WI-512 found 16 of 27). Relocation still has a real population - 8,975 characters over 71 rows - but the residue IS most of the rows, not a by-product.
- The two families are genuinely different. Provides rows are longer and denser in remainder but nearly free of non-crossing prose (2.9%); Consumes rows carry 19.0% non-crossing. A single ruling covering both is a ruling made on an average.
- 15.3% of characters have NO destination under any relocation. Five rows (`IF-082`/`IF-083`/`IF-084`/`IF-085`/`IF-138`) state that their contract is another row's and then spend 110-250 characters explaining why the row exists; `IF-112` spends 330 of 468 characters on the defect story of the carrier it replaced. The kit already ships the right home - the `rationale` field - and uses it ONCE in 135 rows (`IF-141`). trace.py's Contract-argues advisory independently names 27 of these rows, its over-ceiling advisory 30.
- Consumer-side duties bind the READER: `IF-115`'s hold-for-a-human rule, and the same shape on `IF-124`, `IF-050`, `IF-116`. The 2026-08-25 cross-family review qualified the original claim here: a provider-side header CAN state a caller precondition; what it cannot do is keep the consumer's implementation synchronized. The class is an ownership question a relocation ruling must still answer, not a structural impossibility.
- The relocation TARGET is less built than OI-62 assumed. The CLI precedent worked because a committed, freshness-gated docs/cli-reference.md exists. The committed module map retired at WI-455 and nothing succeeded it: gen_arch_map.py can harvest each public symbol on demand, but there is no committed reference for a cell to point AT. Ruling for headers means building that artifact and its gate, not only agreeing a docstring line."""
blast_radius = """### Which options cross the kit line

(a) and (d) stay inside this repo's own registry. (b), (c) and (e) cross the kit/instance line - a contract-header convention lives in the SHIPPED kit: PROCESS.md section 8's field list, the interfaces.template.toml header, INTERFACES.template.md, gen_arch_map.py's harvester, check_trajectory.py's both-directions citation check, a NEW generated reference plus its check.py freshness step and its docs/stack.ini [generated] row, tests/test_dogfood_sync.py parity between kit template and this repo's instance, and a RESYNC_PACK.md entry on the OI-12/OI-13 precedent. Every adopting repo inherits it: a kit version bump. (The pre-review text called (a) the only zero-radius option; the 2026-08-25 round flagged the contradiction with (d)'s own case, and this is the corrected form.)

### The authoring, sized from the measurement

- 8,975 characters of remainder over 71 rows would move to headers. The `Contracts:` anchor already exists on 57 of 76 modules; the other 19 would need one first.
- 28,305 characters of restatement are deleted wherever the editing pass runs.
- 6,715 characters of non-crossing content need a decision of their own - `rationale`, the log, or deletion - under EVERY option including (a): staying in the cell does not make a changelog a contract.

The asymmetry OI-62 ruled (e) to avoid has GROWN: the double-authoring risk was reckoned against a 12.3% remainder and it measured 20.4% - two-thirds larger, which strengthens settling placement BEFORE the editing pass and enlarges that deferred pass.

### The cost of not ruling

The 108 rows keep 28,305 characters of restatement and their rot exposure, demonstrated twice: IF-055 (stale SCHED_* names, caught by the (d) tripwire) and IF-117 (three falsehoods the tripwire structurally cannot reach: a present-tense reference to the module map retired at WI-455, a false claim about which oracle the sym: tier reads, and a stale 149 against a live 184). Both exhibits re-verified against the tree by the 2026-08-25 cross-family review."""
options = """### (a) Stay in the cell

Rule that `contract` remains the home for the remainder; the deferred editing pass (OI-62's (b), still unrun) deletes restatement in place.

- FOR: zero kit/adopter radius, no new artifact or gate; 65.7% of rows carry real content where the registry's readers already look; the only option executable in one pass over this repo alone.
- AGAINST: settles the owner's question by default - the cell stays held to the code by nobody, and IF-055/IF-117 are what that costs; leaves the 12 requirement-owned Provides rows with a remainder and no design row to carry it.

### (b) Relocate the remainder to a component-side contract header

The `Contracts: IF-###` docstring line grows a structured body; gen_arch_map.py harvests it into a NEW committed generated reference; check.py freshness-gates it; the cell states the crossing and points.

- FOR: the declaration sits beside the code that must honour it - the one change that makes the rot class self-correcting rather than checkable-after-the-fact; the WI-512 CLI relocation is the worked precedent and it held; doctrinally consistent (decompose-don't-paraphrase, generated-not-hand-maintained); 57 of 76 modules already carry the anchor.
- AGAINST: the largest radius in this brief and every adopter inherits it; the new artifact and gate are unpriced; no ruled home yet for consumer-side duties or for the 15.3% non-crossing; and on the 37 rows carrying no remainder (19 pure restatement plus 18 whose only other content is non-crossing) it moves nothing, so the benefit concentrates on the 71.

### (c) Split by family

Relocate on Provides (21.2% remainder, 2.9% non-crossing, and the provider IS a module); stay in the cell on Consumes (the far side is often a file or an external party with no module to hold a header).

- FOR: the answer the per-family numbers most directly support; keeps a Consumes row's obligation beside the consumer's own row; the Provides population is 19 rows, one reviewable pass.
- AGAINST: two rules where the kit prefers one; an adopter must know which family a row is in before knowing where to write; and it re-introduces as a convention the Provides/Consumes distinction WI-455 deleted as a column.

### (d) Rule the non-crossing question first, defer placement

Non-crossing content leaves `contract` for `rationale` or the log; placement is re-asked once the cells hold only crossing facts.

- FOR: the cheapest real improvement available - 6,715 characters (15.3%) through a field that already ships and is already used (IF-141), no kit change, no migration, no new gate; it makes the placement question honest, because the cells compared would then contain only the content the question is about; trace.py's advisory already enumerates 27 of the rows.
- AGAINST: a second deferral of the owner's actual question - OI-62's own warning: *"a measured number with no row to rule on is how a deferred question becomes a forgotten one"* - and it banks none of the 64.3% restatement, which is the bulk.

### (e) Relocate only the fail-loud and written-artifact classes (A and B)

Typed shapes, vocabularies, postures and consumer duties stay in the cell.

- FOR: A and B are the classes a module can actually assert about itself, and their staleness is the dangerous kind (a refusal that no longer refuses); a much smaller kit change than (b), needing no new generated artifact if the header stays prose.
- AGAINST: a per-clause rule is the hardest to teach and the easiest to apply inconsistently; the cell keeps most of what it carries today, so the measured benefit is small."""
recommendation = """### RULED (owner, in session 2026-08-25): OPTION (d) - THE NON-CROSSING CLEANUP RUNS FIRST

The owner's words, verbatim: *"recommendation is okay at least to move information to rationale to clean up the contract text itself before further shuffle."* What is ruled: non-crossing content (class M/X) leaves `contract` for the row's `rationale` field, and the cleanup pass runs BEFORE any placement shuffle - the placement question is re-asked on the cleaned cells, per (d)'s own construction. Execution row: WI-522. THE RE-ASK ITSELF IS FILED AS **OI-65** (2026-08-25), carrying this ruling's correction, the sizes that the cleanup did not change, and the two things the cleanup could not take: the ten rows `rationale`'s grammar refused, and the lint arm nothing built. A ruled row leaves the decision surface, so the re-ask needed a row of its own or it had none.

The owner corrected (c)'s Consumes-side objection in the same act, recorded here because the re-ask must carry it: *"note that C says '(the far side is often a file or an external party with no module to hold a header)' but that indicates the file is itself the interface, and can still be defined / set by the owning header contract, so long as others refer back to it, and an external party should just be a boundary line interface."* So a file far side does NOT lack a header home - the file's format is the producing side's contract to define, with consumers referring back to it - and an external far side resolves to the boundary tier. The re-ask weighs (b)/(c) with that correction in hand, together with the method-consistency rule the owner stated on OI-64 in the same sitting: for a given interface expectation there is ONE definer - the interface contract or the LLR, never both.

--- the pre-ruling recommendation, kept verbatim below ---

### Recommend (d), then re-ask; (c) is the strong second

The reading moved DURING the measurement rather than being written to fit it: going in, a high restatement rate was expected to make (b) near-obvious. It did not survive the population - 64.3% is not 87.7%, two in three rows carry something real, and the pilot family was uniform in ways the 108 are not. Carrying its conclusion across would be the extrapolation OI-62 warned against.

(d) first, because it is the only unambiguous, cheap move: 15.3% of these cells is content about the REGISTRY - why a row exists, what defect prompted it - which no placement ruling improves. It has a shipped home (`rationale`), needs no kit change, and the advisory already enumerates most of the population. It is not a delay tactic: it is what makes the placement question answerable about the content it is actually about. Compare IF-112 and IF-107, both around 470 characters: one is a bug story and one a type-coercion fact, and any per-row average over that pair is meaningless.

Against (b) today: two preconditions are unmet. There is no committed generated reference to point at (the module map retired at WI-455 and nothing replaced it), and the consumer-side duty class needs an ownership answer - the cross-family review qualified "structurally impossible" down to "statable provider-side but not synchronizable there", which softens this objection without removing it. Ruling (b) now rules for a mechanism that does not exist yet, on a population whose restatement rate is a quarter below the number that made it attractive.

(a) is the honest zero-radius answer for a ruler who weighs adopter cost above all - but it should be ruled WITH the non-crossing cleanup, not instead of it. (c) fits the numbers best and the driver would not argue with a ruler who took it; its real cost is doctrinal - it re-introduces the family distinction WI-455 deleted as a column, and this pass had to recover that distinction from git history to run at all, which is itself evidence the split is still load-bearing. (e) is the hardest to teach, the easiest to apply inconsistently, and buys the least.

### What this brief is not claiming, and the second opinion

The remainder/non-crossing character counts are spans of the clauses judged, not post-edit lengths - a pass forbidden to write cannot measure by subtraction. They are accurate to the clause, not to the character. The ROW counts are exact: 108 read, 71 carrying a remainder, 19 pure restatement, 18 zero-remainder rows whose only other content is non-crossing.

Cross-family second opinion (OPENAI-SOL, 2026-08-25; record: docs/reviews/2026-08-25-oi63-brief-round/): the table's arithmetic re-summed EXACT, both rot exhibits re-verified, 12 of 15 spot-checked rows AGREE. Three rows are flagged for re-adjudication before the exact percentages are leaned on: IF-050 (its "every consumer reads it through kitlib.stage.read_stage" is a false universal - kitlib/stage.py itself names the display surfaces that deliberately do not), IF-061 (a retired dual-write described as live), IF-098 (remainder partly recoverable from public docstrings). The reviewer also holds that class F is an ownership axis rather than a clause kind. Its verdict: the measurement stands, with those qualifications, as a basis for ruling."""

[open_item.OI-64]
title = """Do the rules every checker already follows get stated once, or does each checker keep its own wording"""
status = "ruled"
ruled_date = "2026-08-28"
ruling_ref = "docs/log.d/2026-08-28-owner-rulings-oi64-oi65.md"
raised = "2026-08-25"
one_line = """Every shipped checker follows the same unwritten rules for reporting a problem; no requirement states them. Recommend stating them once, because a new checker can break them today and nothing fails."""
decision = """The question: state the reporting rules once, or let each checker keep its own wording? Nothing else is being proposed - no module, no refactor.

The rules, as the checkers actually behave: a finding names where the problem is; it carries a severity; a warning never changes the exit code; `--strict` promotes some warnings to failures; a missing optional input exits clean and says so.

### What the measurement found (2026-08-25)

Record: docs/plans/2026-08-25-oi64-checker-uniformity.md. 430 emission sites read, all 14 checkers driven twice.

- Behaviour is uniform. No advisory anywhere reaches an exit code.
- 141 of 158 finding sites name a location. 11 have no single row to name; 6 have one and omit it.
- 12 of 14 checkers exit 0 on an absent optional input and name the absence.
- Wording is not uniform: 12 severity words for four outcomes, six spellings of the strict flag.

So the rules are already followed. Only the wording is ragged.

### Corrections to this row as first drafted

- The count of rows restating a fragment was "eleven-to-thirteen". It is ten: SR-149, SR-150, SR-157, SR-158, SR-159, SR-162, SR-163, SR-167, SR-180, SR-182. SR-015 states no severity, location or vacuity rule at all, and SR-164 states only "naming the row"; neither belongs in the list.
- Four of the ten (SR-167, SR-180, SR-181, SR-182) make severity or exit behaviour part of the obligation itself, not a side clause. That text cannot be replaced by a citation without losing the requirement. At most six clauses are removable.
- SR-158 does not declare itself unsatisfied. It states a condition - a class whose severity is declared nowhere is unsatisfied - and the measurement found the per-class declarations. The row is Approved.

### Two facts that block implementation today

- An SR row has no field for citing an interface. Its keys are title, sn_refs, boundary_refs, hat_refs, requirement, rationale, acceptance_criteria, priority, verification, status, phase, aspect. Option (a)'s sweep has no legal mechanism until one is added.
- SR-181's acceptance says its rule "degrades silently (reports nothing) when no prior committed state is available". If the stated contract includes "every degrade is named", it lands red on an Approved row on day one. That clause was never measured."""
blast_radius = """- MINTING: one contract at the interface tier per the owner's direction, not a new SR and not an LLR. Its provider, consumers, owner and req_refs are undecided; the contract has 14 providers and no single consumer, which is not the shape an interface row currently takes.
- SWEEPING (option (a) only): up to six clauses across Approved rows. Each edit overrides an attestation and re-opens that row's approval. It also needs an SR-to-interface citation field, which does not exist.
- CODE: fixing the severity words is output text and its tests across 14 checkers. No behaviour changes. The 6 findings that omit an available location are separate small fixes.
- DOWNSTREAM: the contract describes the delivered harness, so it ships and every adopter inherits it.
- LEAVING IT: a new checker can invent a severity word, gate an advisory, or pass silently on an absent input, and nothing fails."""
options = """- **(a) State the contract, then remove the wording it replaces.** Effect: adds 1 interface contract; consolidates up to 6 clauses across Approved SR rows; changes checker output wording and its tests. FOR: the rule gets a subject and the duplication can shrink. AGAINST: not executable today - an SR has no way to cite an interface - and every edited row needs re-approval.
- **(b) State the contract, change nothing else.** Effect: adds 1 interface contract; consolidates nothing; still changes checker wording and tests if the contract fixes a severity vocabulary. FOR: banks the rule now at no re-approval cost, and new rows cite instead of restate. AGAINST: ten rows keep their own wording, and one that drifts now contradicts the contract rather than merely repeating it.
- **(d) Decline. Record it as a coding convention.** Effect: adds nothing, consolidates nothing, changes no code. FOR: severity genuinely is a per-check decision and each row's is already explicit. AGAINST: nothing constrains a new checker.
- (c) MEASURE FIRST is closed - run 2026-08-25, no longer a choice."""
recommendation = """RULED (b) by the owner 2026-08-28 and EXECUTED the same day as IF-144 (record: docs/log.d/2026-08-28-owner-rulings-oi64-oi65.md). The protocol is stated once at the interface tier; no existing row was edited.

- THE SHAPE QUESTION RESOLVED ON THE EVIDENCE, not by a further ruling. The contract is not a module-to-module seam - it is what the delivered harness presents at its package boundary, and all ten restating rows cite B-05 unanimously. IF-144 therefore takes `interface_to_external = "B-05"`, the shape 28 interface rows already use, which is also what the owner's own direction anticipated in saying an external far side is a boundary-line interface.
- The guard held: IF-144 does NOT state "every degrade is named, never silent". SR-181's acceptance permits a silent degrade while SN-008 forbids one, and the row records that contradiction rather than legislating over it.
- The closed set is four DISPOSITIONS, not twelve tokens. The checkers spell four outcomes with twelve labels; the row states the contract they already honour, not a rename they do not.
- Option (a)'s sweep stays available and unruled, and is still not executable: an SR row has no field for citing an interface."""
wi_refs = ["WI-508"]

[open_item.OI-65]
title = """Where interface contract text lives, ten passages with no legal home, and the cell nothing lints"""
status = "ruled"
ruled_date = "2026-08-28"
ruling_ref = "docs/log.d/2026-08-28-owner-rulings-oi64-oi65.md"
raised = "2026-08-25"
one_line = """Decide whether interface facts not stated elsewhere stay in the 108 contract cells or move beside the code, plus ten passages to delete and one lint gap. Recommend pricing the move first."""
decision = """Three questions that can be ruled separately. None of them adds or removes a requirement row: no SR, no LLR and no interface row is created or deleted by any option below. All 135 interface rows are Drafted, so editing them needs no re-approval.

### 1. Placement

Each interface row's `contract` cell holds prose. Some of it restates what the code or another registry already says; the rest is unique to the cell. The question is whether that unique part moves into the owning module's docstring header, next to the code it describes, or stays in the cell.

- 71 of 108 rows carry unique content, estimated at 8,975 characters. Those figures are per-clause judgements, not measured spans, and two rows have since been reclassified. Treat them as approximate; the row counts are exact.
- 57 of 78 modules already carry a `Contracts:` header line. 21 do not.
- Moving needs a committed generated reference for the cells to point at. Nothing succeeded the module map retired at WI-455, so that artifact and its freshness gate would have to be built. Neither has been priced, through two rulings.
- The harvester is not yet reliable. `gen_arch_map.module_contracts` reads `handback.py` as declaring IF-080, although its docstring says "No `Contracts:` line, deliberately". A negated declaration is counted as a declaration.

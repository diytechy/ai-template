- If the answer is "the frame owes a party": it is an EXT mint plus a B mint on a table whose header states THE FRAME IS LOCKED and whose rows change only by a recorded ruling, and which is owner-approved at 4 entities / 4 crossings / 3 relationships. That is not an execution WI's call under any reading.
- Watch the id trap either way: `docs/id-watermark` reads `B = 7` and `EXT = 5` while `B-06`, `B-07` and `EXT-004` are SPENT - cut, and cited by id in ruled documents. A mint from the mark would land exactly on spent ids and silently re-point that history. The next honest B id is B-08, which the external.toml header separately forbids minting for the same reason. So a mint here needs the seed question answered first.
- One live consequence of leaving it: the network fetch is the only place this system reaches a party it has not modelled, so if the frame IS the inventory of what the system touches, the inventory is incomplete by exactly one."""

options = """- (a) THE FULL POSTURE (the owner's stated direction): OI ids become valid hard tokens in needs, satisfied when the row leaves pending; every PARTIAL or CANCELLED disposition must queue at least one successor (the WI-552 refusal invariant tightens — an OI alone no longer discharges it); the mint REPLACES inbound hard needs edges of the superseded row; dead_dependency_findings extends to partial as the net for anything that slips past the mint. FOR: one graph, one grammar, closes both measured gaps with one mechanism, and the strand class becomes unrepresentable rather than merely reported. AGAINST: the dependency graph now reads two registries, and the successor-always rule forces a WI mint even where the whole remainder is one human question.

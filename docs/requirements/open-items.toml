blast_radius = """SCHEMA, AND THEREFORE TEMPLATES, ADOPTERS AND THE ATTESTATION SURFACE.

- (a) is a kit schema change: a key added to `spine_carrier`'s SR tuple, to `system-requirements.template.toml`'s `-000` schema row, to `trace.py`'s required/enum tables if it is to be validated, plus `test_dogfood_sync`'s template-vs-live pin, plus a RESYNC entry and a downstream migration. The rows themselves are a 17-cell edit; the machinery is the cost.
- IT ALSO TOUCHES THE ATTESTATION SURFACE, which is the point of doing it: once the state is a cell, `gen_open_items.py`'s brief can list unsigned labels the way it lists Drafted and Modified rows, and the sitting sees them instead of the owner having to grep prose. That is the concrete gain and it should be weighed as one.
- (b) costs nothing mechanically and leaves the 17 carve-outs in `docs/provenance-allow` permanently - a file whose own header says it "is not a second home for provenance". Seventeen permanent entries is that file becoming exactly what it declares it is not.
- (c) retiring the concept touches `PROCESS.md:79-81` and `spine-authoring/SKILL.md:132-142` - shipped process text, a kit version bump - and it would have to say what replaces the DO-178C obligation, because the reason the label exists (an SR whose parent's text does not demand it must be visibly marked, or the trace silently lies) does not go away.

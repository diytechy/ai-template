blast_radius = """- migration: none under any option. The change is confined to one function of a kit-shipped script; no registry row, spec or snapshot moves.
- deferring: the WI-552 record keeps asserting an unconditional guarantee that is in fact conditional, and the failure is SILENT - a dependent waits invisibly on a terminal predecessor, which is precisely the WI-541 strand arm 4 was built to eliminate.
- downstream: every adopting repo runs this mint. (b) is the only option that adds something adopters must satisfy - a hand-edited spec with a multi-line `needs` would be refused rather than accepted.
- reversal: (a) and (c) are each a single-commit undo; (b) leaves a declared invariant and a check that have to be retired together if it is later reversed."""
options = """- (a) REWRITE THE VALUE THE PARSER ALREADY PARSED - a real TOML read of the `needs` cell (or, minimally, `re.DOTALL` on the existing pattern). FOR: makes the class unrepresentable rather than merely improbable; the guarantee becomes unconditional and there is no invariant to declare or police. AGAINST: the edit must stay value-level - a full re-serialize would reformat frontmatter the surgical rewrite deliberately leaves byte-identical.
- (b) KEEP THE REGEX AND DECLARE THE SINGLE-LINE-`needs` INVARIANT, enforced by a check so a hand-written multi-line `needs` is REFUSED rather than silently skipped. FOR: converts a silent skip into a loud refusal, and the invariant is true of everything the machine writes. AGAINST: pays a permanent check and a rule adopters must learn, to preserve a regex whose only virtue is that it is already written.
- (c) ACCEPT THE NARROWED GUARANTEE and amend WI-552's arm-4 claim to name the single-line condition. FOR: zero code; the record stops overclaiming. AGAINST: leaves the failure mode both representable and silent - the next hand-authored multi-line `needs` reproduces the WI-541 strand."""
recommendation = """(a): read the value the parser has already parsed.


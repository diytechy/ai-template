one_line = "intake._SPEC_NEEDS_RE (intake.py:1344) has no re.DOTALL, so _replace_inbound_edges silently skips a dependent whose `needs` is a MULTI-LINE TOML list: WI-552 arm 4's 'the WI-541 strand becomes unrepresentable' guarantee in fact holds only under the single-line-`needs` invariant the machine writers happen to keep (a tree-wide scan finds no multi-line `needs` today, so it does not bite). Rule which the kit means: (a) tighten the regex to DOTALL (or a real TOML read) so the guarantee is unconditional, (b) keep the regex and DECLARE the single-line-`needs` invariant, enforced by a check so a hand-written multi-line `needs` is refused rather than silently skipped, or (c) accept the narrowed guarantee and amend WI-552's claim to match."
decision = """Whether `intake._replace_inbound_edges` (intake.py:1347) must re-point a dependent's HARD `needs` edge UNCONDITIONALLY, or only for the single-line `needs` list the machine writers happen to emit.

- `_SPEC_NEEDS_RE` (intake.py:1344) is `re.compile(r"(?m)^needs\\s*=\\s*\\[.*?\\]\\s*$")` - multiline-anchored, but WITHOUT `re.DOTALL`, so `.*?` cannot cross a newline.

one_line = """`IF-036` (check_vendored fetches each declared upstream source over the network and compares bytes) carries an `external:upstream docs` counterpart, but the depth-0 frame's four entities are the development session, the template, the adopter and the model provider - none of them is an upstream documentation source - so this row can name no `B-##` crossing, and the question is whether the FRAME is missing a party or the fetch genuinely crosses no boundary of this system"""

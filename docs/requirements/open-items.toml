- (b) THE FRAME OWES AN ENTITY - mint an upstream-source party and an inbound crossing for it. FOR: the frame claims to be the inventory of what is outside, and this is outside; a check that reaches the network is exactly the kind of dependency a boundary model exists to surface. AGAINST: it re-opens a locked, owner-approved frame for a single warn-only advisory on one row, and it forces the spent-id question to be settled first.

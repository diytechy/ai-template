one_line = """rule what a red test case is allowed to PRODUCE - the adjudicator that examines one can today answer only DRAFTED or NEEDS-JUDGEMENT, and neither is -mint a work item to plug the gap-, which is the outcome the owner expects; recommendation is ADD THE VERDICT, since the discovery half already works and only the disposition is missing"""
decision = """The routing for a red test case is BUILT and live: the brief is wired, it re-runs the census against the live registries at composition time rather than trusting a stale snapshot, and it refuses to compose rather than half-filling when evidence is missing. What it cannot do is the thing the owner expects a red test to cause. Its typed verdict vocabulary is DRAFTED or NEEDS-JUDGEMENT - so an adjudicator that correctly diagnoses a genuine implementation gap has no way to say -mint a work item for this-, and the finding lands as a judgement request to a human instead of as scheduled work. WHAT ALREADY WORKS, and is worth knowing before ruling, because it means the expensive half is done: the repo can already distinguish the THREE failure kinds a red test has, on three independent mechanisms - NOT IMPLEMENTED (the design row's symbol does not resolve, so the row never reaches the founded rung), IMPLEMENTED AS A STUB (the no-stub detector, a gate-level bar), and IMPLEMENTED WRONG (a substantive symbol with a red test). So the diagnosis is mechanical and typed; only the OUTCOME vocabulary is short a word. There is a precedent for the shape being asked for: adjudication elsewhere in this loop mints its work item MECHANICALLY, with no model in the loop, precisely so a scheduling decision cannot be hallucinated."""
blast_radius = """A VERDICT ENUM IS A CONTRACT, which is the whole reason this is a ruling rather than a patch. Adding a value means the verdict gate that validates a session's close must accept it, the routing that consumes it must act on it, and - if the new verdict MINTS - the minter has to obey the standing rule that a work branch never mints a work-item id, which is a real constraint rather than a formality. The safe shape is the existing precedent: the adjudicator RECORDS a typed verdict and the mint happens mechanically outside the session, so no model ever chooses an id. The risk of NOT ruling is quieter and worse: every red test case that is a genuine gap routes to a human as a judgement request, which trains the reader to treat the queue as noise, and the failure that follows is the one where a real gap sits in a queue nobody reads because most of its entries needed no judgement."""
options = """(a) ADD THE MINT VERDICT - a third value meaning -this is a real gap, schedule it-, with the work item minted mechanically outside the session. FOR: it completes a mechanism that is otherwise built; it matches what the owner expects a red test to produce; it reuses the existing no-model minting precedent, so nothing new is trusted to a model. AGAINST: it grows a typed contract, and every consumer of the verdict must handle the new value or fail closed rather than silently ignoring it. (b) ROUTE THROUGH THE EXISTING CHANGE-INTAKE PATH - keep the two verdicts and let NEEDS-JUDGEMENT carry gaps to the human, who files the work item. FOR: zero new machinery; a human sees every gap, which is defensible for something as consequential as a failing test. AGAINST: it is the state today, and it makes the human the router for a decision the machinery has already typed - the diagnosis is mechanical, so requiring a human to transcribe it into a work item is ceremony rather than judgement. (c) MINT AUTOMATICALLY ON THE NOT-IMPLEMENTED CASE ONLY - the one kind the machinery diagnoses with no ambiguity - and leave stubs and wrong-implementations to a human. FOR: it automates exactly the case where the evidence is unambiguous and leaves the interpretive ones to a person. AGAINST: -implemented wrong- is the case most likely to need scheduled work, and it is the one this option excludes."""
recommendation = """(a), minting mechanically rather than from the model's own words, and with the verdict carrying WHICH of the three failure kinds it diagnosed so the minted row inherits a real scope instead of -a test is red.- Reject (b): the machinery has already done the typing, and routing a typed diagnosis through a human to be retyped is the kind of step that gets skipped under load. On (c) - its instinct is right that the three cases differ in confidence, and the better expression of that instinct is to mint for all three but mark the confidence, so a wrong-implementation row arrives flagged for scoping rather than not arriving at all."""

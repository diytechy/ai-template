REVERSIBILITY IS ASYMMETRIC AND SHOULD DECIDE HOW CAREFULLY THIS IS RULED. Keeping the ratchet is free and reversible at any time. Retiring it is a one-way door in practice: `git revert` restores the file, but by then every baseline entry has diverged from the tree, so a revert lands a red ratchet needing a hand re-stamp with reasons nobody holds.

DOWNSTREAM: NOTHING. The line ratchet is `tests/`-resident and `scope: this-repo`; no adopter has ever had it.

### Q2 - the scope

Widening to `tests/` adds only 20 seeded entries (179 -> 199) - the test tree is larger in lines but far flatter per function - so the cost objection is small. It also puts the sensor in a position to fire on the test-splitting work `WI-521` is doing, which is a feature and a friction at once: a split that moves a complex function between modules RE-KEYS an entry rather than changing a number, and the WI-521 slice-1 record shows the repo has already met and named that exact case ("The complexity entry for `committed_snapshot_findings` was RE-KEYED to the new file, not re-stamped - the function is byte-identical and this file keys on (path, name), so a move has to be spelled or the census reports the same 12 twice"). The new sensor must key the same way and its docstring must say so.

NOT widening leaves `WI-521`'s §3 gap open on any axis, and the row has now carried it across three programmes.

### Q3 - the posture

ARMED here means the exact-equality contract runs at `DevStg-Impl` as `[step:complexity]` in `docs/stack.ini`, and every session that makes a function more complex must either simplify it or take a reviewed baseline bump with its reason in the log. It also means every session that makes one SIMPLER must re-stamp downward in the same commit - the improvement arm is not a courtesy, it is what stops the baseline becoming a floor. That is real friction on every future WI and it is the point.

REPORT-ONLY here means the census prints and nothing enforces. On this repo's own 48-day evidence, that is the posture that does not hold.

EITHER WAY the smoke tier and its budget are touched: the new test module joins the per-commit bar by default (tiering is opt-out) and `docs/stack.ini` `[smoke-budget]` `max-tests` is re-stamped with its reason. Measure the wall-seconds delta against the 60 s budget before claiming the bar is unmoved.

### What does NOT change under any answer

No requirement is retired and no gate rung moves. `tests/test_complexity_ratchet.py` (the ruff `C901` census) is UNTOUCHED by every option below - it is this repo's own dev-tool ratchet behind a `skipif`, and nothing here proposes deleting it; the new sensor is stdlib and measures a different, less size-correlated quantity. No adopter is migrated by Q1-Q3; the shipping decision is its own phase and its own surface."""

options = """### Q1 - the line ratchet

- (1a) RETIRE IT, and let the complexity sensor take the axis. FOR: it is the trade the owner's own OI-16 correction implies - one sensor replacing one sensor is a net-zero instrument count on a strictly better axis; the two now cover the same files and differ only in what they measure, so the line one is the redundant half; it does not fire on a module that got structurally simpler, which is the WI-448 counterexample; and it ends a dispute the repo has been carrying in two docstrings. AGAINST: line count is cheap, legible and has caught real growth, and a large file is still harder to hold in one head whatever its per-function complexity; the deletion takes ~1,900 lines of reviewed rationale out of the tree; and cognitive complexity is a modestly-validated metric with a failed replication behind it, so replacing a crude-but-honest sensor with a subtler one is not automatically an upgrade.
- (1b) KEEP BOTH, and DEMOTE the line one to advisory (report, never gate). FOR: keeps the size signal visible without letting it demand bumps on files that got simpler - which is the specific defect WI-448 exhibited; costs one line of code. AGAINST: this repo's own 48-day measurement says an advisory sensor is a sensor nobody obeys; and it leaves two instruments on overlapping files, which is the state the trade was meant to end.

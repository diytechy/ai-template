options = """- (a) RE-TAG THE THREE BUILT-INS to `{DevStg-Tests, DevStg-Impl}` - product checks gate from the tests bar onward. FOR: DevStg-Tests means the spine is DECOMPOSED WITH TEST CASES LAID, i.e. code exists and tests exist, which is precisely the evidence that "does it still build, lint and pass?" is a meaningful question; it is one line per step; it makes the WI-473 floor load-bearing immediately (a draft can then no longer take them away); and it leaves DevStg-Impl meaning what OI-30 D2 wants it to mean - EVIDENCE (coverage thresholds, `--require-verified`) rather than whether tests run at all. AGAINST: it is a migration for every adopter whose spine is decomposed and whose lint is dirty, and it partially contradicts OI-30 D2's enumeration ("withholding the top bar relaxes no check that was running") by conceding that something WAS relaxed.

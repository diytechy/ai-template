decision = """SCOPE FIRST, because it is easy to misread: this rules on the SENTENCE, not on whether anything gets built. B2 says a closed WI's spec-of-record moves to docs/archive/specs/complete/ or docs/archive/specs/cancelled/ rather than one flat docs/archive/specs/, so a spec's location answers shipped-or-cancelled without opening it. WI-391 was filed to build that and instead refuted it on measurement; the refutation was independently confirmed (APPROVE findings=6, 2a4c9642). WI-391 is CANCELLED, not parked, because under BOTH options below its work does not happen - so a ruler here is choosing what the design record should SAY, with the build question already closed. The measurement, which either option must live with: the spec-to-folder mapping is not total (of 111 archived specs, 92 resolve to complete, 3 to cancelled, and 16 to nothing - 15 shared effort docs plus WI-300-sr052-binding.2026-07-26.md, whose name does not match _own_spec's own glob); it is contradictory for at least one file (research-knowledge.2026-07-29.md is cited from both terminal states, and R-F archives a shared doc when its LAST open citer closes, so both folders are correct for it); there is no regenerator to gate the derived location for freshness (gen_trajectory.py names 'archive' zero times); for the 92 attributable specs docs/work/ already answers shipped-or-cancelled by location; and no reader consumes the split - every one of them would have to widen its glob to ignore it. ON THE TIMING, so the record is not read as a criticism of the filing: WI-391 was correctly filed given the ruling it inherited, and refutation is exactly what a claimed row is for. The available improvement is only about WHERE the question gets asked. The intake said AT FILING, in its own words, that the row 'deletes no machinery, closes no raise path and makes no bad state unrepresentable' and 'must justify itself on the navigation benefit alone' - and section 0 prescribes asking 'what constraint would make
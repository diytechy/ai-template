- (b) costs nothing mechanically and leaves the 17 carve-outs in `docs/provenance-allow` permanently - a file whose own header says it "is not a second home for provenance". Seventeen permanent entries is that file becoming exactly what it declares it is not.
- (c) retiring the concept touches `PROCESS.md:79-81` and `spine-authoring/SKILL.md:132-142` - shipped process text, a kit version bump - and it would have to say what replaces the DO-178C obligation, because the reason the label exists (an SR whose parent's text does not demand it must be visibly marked, or the trace silently lies) does not go away.

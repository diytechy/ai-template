decision = """`gate_policy` names two different things, and the shipped options document still instructs through the retired one. Rename, sweep, or leave?

- The collision generated TWO FALSE stale-text defects inside a single analysis pass, because a reader - human or agent - cannot tell which `gate_policy` a given mention means.
- The two things sharing the name: a CONFIGURATION ENUM that was retired and replaced by a cumulative ratification ordinal, and a LIVE RUNTIME LABEL that describes how a session is being held (`human-held` / `loop-held`). The second is real, current and useful; it simply took a name that was already spent.
- Separately but in the same family: `PROCESS_OPTIONS.md` - the document an ADOPTER reads as operative process - still instructs through the retired enum at ten distinct token lines. The two hyphenated occurrences are NOT residue - one is the live `bootstrap.py --gate-policy` flag, the other the `docs/gate-policy.md` deviation-register filename - and both must stay.
- Nothing mechanical sees any of this: the anti-drift pin covers only the shipped template, so the document drifted freely.
- Four stale-text verdicts on other rows are currently BLOCKED on this collision - they cannot be judged until it is clear which `gate_policy` their text refers to."""
blast_radius = """SMALL, LOCAL AND SHIPPED - the awkward combination.

- Migration: the rename touches the runtime label's definition and its readers, which is a contained set; the documentation sweep touches ten lines in one shipped file.
- Re-attestation: neither is a schema change, and the precondition is now CHECKED rather than assumed (2026-08-12): no spine cell names the runtime label - the two `gate_policy` hits in the spine (LLR-156's `_migrate_gate_policy` symbol, TC-031's `tests/test_gate_policy.py` citation) are the retired CONFIG sense and survive the rename untouched - so no re-attest window opens.
- Deferral: the four blocked stale-text verdicts unblock the moment this lands, so it is small work that is holding up other reading."""
options = """- (a) RENAME THE RUNTIME LABEL and sweep the ten doc lines onto the current vocabulary. FOR: one name means one thing again, which is the same doctrine already ruled for registry columns; the false-finding class disappears rather than being documented; adopters stop being taught a retired enum. AGAINST: a rename in shipped prose, and any external notes or scripts referencing the old label go stale.
- (b) SWEEP THE DOC ONLY, keep both names. FOR: fixes the adopter-facing half, which is the part with a reader outside this repo. AGAINST: it leaves the collision that produced the false findings, so the next analysis pass pays the same cost.
- (c) LEAVE BOTH, document the collision. FOR: zero risk. AGAINST: it is the state that already generated two false defects and is currently blocking four verdicts - documenting a trap is weaker than removing it, and this repo's own preference is to make a bad state unrepresentable rather than annotated."""
recommendation = """(a) RENAME AND SWEEP, as one change.

- Pick a runtime-label name that cannot be confused with a policy dial - it describes WHO IS HOLDING a session, so name it for that.
- Sweep the ten instructional lines in the same commit and leave the two hyphenated occurrences (the CLI flag and the deviation-register filename) untouched; they are a live interface, not residue.
- Sequencing: do it BEFORE the sitting rather than after - re-running the four blocked stale-text verdicts is the payoff that makes this small item worth doing first."""

[open_item.OI-26]
title = """A red test case cannot mint the work item that fixes it - the disposition half has no verdict"""
status = "pending"
raised = "2026-08-11"
one_line = """rule what a red test case is allowed to PRODUCE - the adjudicator can answer only DRAFTED or NEEDS-JUDGEMENT, neither of which schedules work; recommendation is ADD THE VERDICT, since the discovery half already works and only the disposition is missing"""
decision = """A red test case cannot mint the work item that fixes it. The adjudicator's typed verdict vocabulary is DRAFTED or NEEDS-JUDGEMENT, so one that correctly diagnoses a genuine implementation gap has no way to say -mint a work item for this-, and the finding lands as a judgement request to a human instead of as scheduled work.

WHAT ALREADY WORKS, and is worth knowing before ruling, because it means the expensive half is done:

- the routing is BUILT and live - the brief is wired, it re-runs the census against the live registries at composition time rather than trusting a stale snapshot, and it refuses to compose rather than half-filling when evidence is missing;
- the THREE failure kinds a red test has are distinguished on three independent mechanisms: NOT IMPLEMENTED (the design row's symbol does not resolve, so the row never reaches the founded rung), IMPLEMENTED AS A STUB (the no-stub detector, a gate-level bar), and IMPLEMENTED WRONG (a substantive symbol with a red test).

So the diagnosis is mechanical and typed; only the OUTCOME vocabulary is short a word. There is a precedent for the shape being asked for: adjudication elsewhere in this loop mints its work item MECHANICALLY, with no model in the loop, precisely so a scheduling decision cannot be hallucinated."""
blast_radius = """A VERDICT ENUM IS A CONTRACT, which is the whole reason this is a ruling rather than a patch.

- Consumers: adding a value means the verdict gate that validates a session's close must accept it, and the routing that consumes it must act on it.
- Constraint on minting: if the new verdict MINTS, the minter has to obey the standing rule that a work branch never mints a work-item id, which is a real constraint rather than a formality. The safe shape is the existing precedent - the adjudicator RECORDS a typed verdict and the mint happens mechanically outside the session, so no model ever chooses an id.
- Cost of NOT ruling: every red test case that is a genuine gap keeps routing to a human as a judgement request rather than as scheduled work."""
options = """- (a) ADD THE MINT VERDICT - a third value meaning -this is a real gap, schedule it-, with the work item minted mechanically outside the session. FOR: it completes a mechanism that is otherwise built; it matches what the owner expects a red test to produce; it reuses the existing no-model minting precedent, so nothing new is trusted to a model. AGAINST: it grows a typed contract, and every consumer of the verdict must handle the new value or fail closed rather than silently ignoring it.
- (b) ROUTE THROUGH THE EXISTING CHANGE-INTAKE PATH - keep the two verdicts and let NEEDS-JUDGEMENT carry gaps to the human, who files the work item. FOR: zero new machinery; a human sees every gap, which is defensible for something as consequential as a failing test. AGAINST: it is the state today, and it makes the human the router for a decision the machinery has already typed - the diagnosis is mechanical, so requiring a human to transcribe it into a work item is ceremony rather than judgement.
- (c) MINT AUTOMATICALLY ON THE NOT-IMPLEMENTED CASE ONLY - the one kind the machinery diagnoses with no ambiguity - and leave stubs and wrong-implementations to a human. FOR: it automates exactly the case where the evidence is unambiguous and leaves the interpretive ones to a person. AGAINST: two of the three failure kinds the machinery already types still route to a human, including -implemented wrong-, which it diagnoses as a substantive symbol with a red test."""
recommendation = """(a) ADD THE MINT VERDICT, minted mechanically rather than from the model's own words.

- The required guard: the verdict must carry WHICH of the three failure kinds it diagnosed, so the minted row inherits a real scope instead of -a test is red.-
- Reject (b): the machinery has already done the typing, and routing a typed diagnosis through a human to be retyped is the kind of step that gets skipped under load.
- On (c): its instinct is right that the three cases differ in confidence, and the better expression of that instinct is to mint for all three but mark the confidence, so a wrong-implementation row arrives flagged for scoping rather than not arriving at all."""

[open_item.OI-27]
title = """The LLM re-sync method - no kit version was ever designated, and the mechanical paths are skip-all or clobber-all"""
status = "pending"
raised = "2026-08-12"
one_line = """rule the method for re-syncing a repo on an older kit via LLM - no version was ever designated (the anchor is the write-only `docs/kit-version` SHA stamp), the mechanical paths are skip-all or clobber-all, and 34 migration recipes live as prose in two drifting homes; recommendation is a shipped migration registry with per-entry detectors - state first, SHA range as fallback"""
decision = """The owner's ask, 2026-08-12: -we need a method for resync to be achieved from older versions of this template via LLM.- The first question that ask raises - was a version ever designated? - has a measured answer: NO. Zero git tags, no changelog, no version number, ever. Everything below was measured 2026-08-12.

### What exists instead of a version

- `docs/kit-version` (SR-111, Verified): bootstrap stamps every adopting repo with the kit's short SHA plus date, `-dirty` on an uncommitted tree. The SHA-not-version choice was deliberate - SR-111's rationale rejected file-hash derivation because -it reports that something differs without saying from what.-
- The stamp is WRITE-ONLY. No script reads it back; one test asserts it is non-empty. The -diff your stamp against the target- step in ADOPTING.md section 6 is entirely a human (or an LLM) reading prose and running git by hand.
- The stamp requires the kit's git history. A tarball adopter is stamped `unknown (kit not a git checkout)` - SILENTLY, exit 0, no warning (the loud warning fires only on `-dirty`, which is hard-coded false on the no-git path). That scaffold has no anchor and is never told so.

### The mechanical surface an LLM would drive

- The documented re-sync is a plain `bootstrap.py --dest .` re-run, and it is WRITE-ONCE: an existing file is skipped, so it adds new files and updates NOTHING.
- The only updater is `--force`, which overwrites everything except `docs/id-watermark` with zero awareness of adopter edits - no hash, no mtime, no diff check anywhere in the copy path.
- `--sync` is a false friend: despite the name it refreshes only the per-agent skills subtrees and returns before any kit file is touched.
- So the tool offers exactly two settings - skip everything or clobber everything - with 121 MAPPING files (52 of them .py) and ADOPTING section 6's 824 lines in between, carrying 34 top-level migration recipes (19 dated), keyed by DATE and WI id while the stamp speaks SHA.
- SR-036 declares the gap deliberate: `verification = "Inspection"`, one of a handful of non-Test SRs in the registry, its rationale stating -the operator makes the overwrite-vs-preserve call.- An LLM method mechanizes a judgment the spine currently assigns to a person, which is why this is a ruling rather than a build.

### The house pattern that already answers half the question

Thirteen detector-style migrations ship today, with a settled four-way taxonomy: auto-migrate (the 13-row legacy config fold, the gate-policy word), degrade-gracefully (the value-only legacy `docs/gate` check), warn-only (the retired open-items.md beside its registry), hard-refuse (a registry live under both carriers). `gen_open_items` names the idiom: -the migration has a detector, on BOTH paths.-

- NOT ONE of the thirteen consults `docs/kit-version`. Every one infers the repo's actual state from its artifacts - and their existence is why version-blind re-syncs have mostly survived.
- The recipes meanwhile have TWO HOMES and they have already drifted: ADOPTING section 6 is the authority, the `downstream-resync` skill restates it, and the skill's WI-381 note is hand-maintained duplication - the exact two-homes state the carrier migration refuses elsewhere.

### The field record, which is the evidence this is real

Three named adopters, three distinct re-sync breakages, each caught downstream by a human: a silent public-function rename broke PictureSorter's imports; a cwd-relative `scripts/` path broke Pictures2VideoSlideShow on its `Scripts/` casing; a bootstrap re-run clobbered FileBackup's ps1-generated architecture diagram with empty Python-AST output. And the class is untested end to end: 347 tests bootstrap a FRESH scaffold, ZERO scaffold an old kit state and sync forward - `test_bootstrap` records the blind spot in prose (-invisible to a downstream re-sync ... only a fresh scaffold reaches it-), citing the `schedule.py` omission as its shipped instance.

### RULED ADDITION 2026-08-12 - the gate-to-stage conversion is this method's first job

The owner, same date, ruling OI-21's vocabulary retirement: the re-sync method -needs prose for an LLM to digest-, and adopters who use gate terminology -must ALSO be converted to stage terminology.- Two consequences for this item:

- COMPATIBILITY IS SOFTENED, explicitly: -no project that uses this has been released beyond my own development sphere- - so breaking conversions are acceptable, and this brief's kit-version-bump caution weighs correspondingly less for as long as that holds.
- THE INAUGURAL REGISTRY ROW IS CHOSEN: the gate-to-stage conversion (OI-21) becomes the first migration the method carries, and it is a good first test because it exercises BOTH selector halves - it is state-DETECTABLE (a `docs/gate` cache carrying G-values, a `stack.ini` `gates=` key, a `bar:` G-value in WI frontmatter are all probes) and SHA-rangeable. The adopter-side recipe it must carry, measured: regenerate `docs/gate` rather than preserve it (ADOPTING section 6 currently classes that file -preserve always-, which this migration inverts - the recipe must override the standing rule), re-apply `process.toml` dials, hand-check adopter-authored hooks and CI that pass `--gate` literally, their own WI rows carrying `Bar` values, their own log sign-off history (OI-21's attestation carve-out applies to adopters too), and `--sync` any materialized per-agent skills."""
blast_radius = """THE KIT'S OUTERMOST INTERFACE - the one surface every adopter meets, including the ones this repo never sees.

- Build surface: a shipped registry file (and template), a selector the skill or a driver script consumes, `bootstrap.py`'s stamp machinery, ADOPTING section 6 (prose decomposes into rows or points at them), and the `downstream-resync` skill. A kit version bump, ironically for an item about versioning.
- The REAL radius is a standing discipline, not the build: every option imposes a per-kit-change obligation (a version bump, a detector, or a registry row), and nothing today enforces -a change needing a migration note got one.- Without an enforcer the obligation holds by attention - the same class OI-21 just recorded for the retired gate vocabulary, and the reason ADOPTING section 6 already carries a stale skill duplicate.
- Sequencing: post-lock, its own program - but every kit change until then lands its recipe as one more row of prose, so the pile grows while it waits. It also COUPLES TO OI-16: a common-module consolidation is a rename-heavy program, and a silent rename is precisely the breakage class the field record shows biting adopters - so OI-16's execution WI should land the first registry rows or detectors under whatever shape this item rules.
- THREE DEFECTS DO NOT WAIT on the ruling: (1) the tarball path stamps an anchorless `unknown` with no warning - one warn line fixes it; (2) the skill's hand-maintained WI-381 recipe duplicates ADOPTING section 6 and has drifted - point, do not restate; (3) no test re-syncs from an old kit state - the first one (scaffold at an older kit commit, sync forward, harness green) is owed under EVERY option and is what makes any method's claims evidence rather than prose."""
options = """- (a) DESIGNATE VERSIONS and key migrations to them - tags or release ids plus a changelog, migrations selected by the stamp-to-target range. FOR: the stamp finally gets a reader; selection becomes a query instead of an 824-line read; humans get a shared name for kit states. AGAINST: keying to DECLARED history mis-keys every repo that hand-patched, half-synced, or carries the `unknown` stamp; versioning history retroactively is guesswork; and the per-change version discipline has no enforcer yet.
- (b) DETECT STATE, DO NOT VERSION - extend the thirteen-instance house pattern: every migration ships a detector, a driver probes the adopted repo and emits the applicable list, `kit-version` stays provenance only. FOR: state is the TRUTH - it survives hand-patches, tarballs and unknown stamps, and it is the mechanism the kit already trusts thirteen times over. AGAINST: some changes are not state-detectable - a rename reads as mere absence, which is exactly the PictureSorter defect class - and without a shared home the detectors scatter as the recipes did.
- (c) A SHIPPED MIGRATION REGISTRY WITH PER-ENTRY DETECTORS - one TOML row per recipe (since-SHA, a detect probe where one exists, the action, a pointer to the prose), the skill consumes the registry, section 6's recipes decompose into rows so the prose has one home. Detection selects where it can; the SHA range selects the rest. FOR: it answers BOTH halves - which migrations apply (a data problem, so a registry) and is this repo in the state the recipe assumes (a truth problem, so a detector) - and it dissolves the two-home drift. AGAINST: the most machinery of the three, and a registry no check enforces rots exactly like the prose it replaces - it is only better than section 6 if its enforcer lands with it.
- (d) LLM OVER THE EXISTING PROSE - harden the skill, keep everything as prose: diff the range, read section 6, apply. FOR: zero machinery, and reading prose is what an LLM is good at. AGAINST: it is the current state with better wording - the regime under which all three field breakages shipped - it is unverifiable, and it has nothing to offer the tarball adopter, who has no range to diff."""
recommendation = """(c) THE REGISTRY WITH DETECTORS, sequenced post-lock as its own program, with the three do-not-wait defects taken now.

- The deciding reason: the ask splits into a data problem and a truth problem, and options (a), (b) and (d) each answer only one half. The kit's own doctrine assembles the whole answer - a registry with derived views for the data half, the established detector idiom for the truth half, and the SHA range only as the selector of last resort for what neither can see.
- THE ENFORCER LANDS WITH THE REGISTRY OR (c) IS (d): a check that a commit touching the shipped surface (MAPPING, a schema, a carrier, a launcher contract) carries a registry row. Without it the rows hold by attention, which is the failure class this program keeps re-finding.
- The LLM's role, stated honestly: the registry and detectors bound WHAT applies; the LLM performs the merge judgment SR-036 assigns to the operator - overwrite-vs-preserve on files the adopter may have edited. SR-036's Inspection verification should be re-read at this ruling, because a mechanized selector changes what the operator is inspecting.
- The proof is the old-kit test, not the design: scaffold at an older kit commit, run the method forward, harness green. Build it first and every later row is born with a harness to fail against.
- If the sitting wants less machinery: (b) alone is the defensible minimum - it extends proven practice - but record knowingly that renames stay invisible to it and will keep shipping as field breakage."""

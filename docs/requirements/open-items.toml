one_line = """RULED ((b), the named-mode dial, over the recommended defer) 2026-08-31 — the owner: "this is the interesting dial. I would say 2." One [attestation] key, decision_recording = off / record / escalate-first, closed enum, template ships off, this repo sets record; the routing doctrine (action fields, one-way confidence ratchet, structural disclosure) rides with it. Original brief: rule the routing signal, the disclosure obligation, and whether the appetite is a dial or a launch-prompt instruction"""
decision = """RULED 2026-08-31 (record docs/log.d/2026-08-31-owner-rulings-oi74-75.md): (b) — the owner chose the dial now over the recommendation's defer-and-measure: "Hmmm, this is the interesting dial. I would say 2." One key in [attestation]: decision_recording = "off" | "record" | "escalate-first" — off: no recording obligation (the template's shipped value, conservative default); record: a delegated run's close OWES the OI-74 decisions record, the way a partial close owes its handback report (this repo's value); escalate-first: beyond recording, sessions prefer the OI-70/OI-73 exits over deciding — delegate less, ask more. Single line, closed alphabet, IF-037 grep-parity respected, structural parity template-vs-repo under the dogfood-sync test. The doctrine rides with it as ruled in the brief: routing on action fields and counts (never model self-confidence as a primary; confidence and panel dissent promote scrutiny only, never demote), the disclosure obligation as OI-74's required entry keys, and the dial as a workload-allocation instrument that never moves the safety boundary — the escalate class binds at every setting. Commissioned: WI-557 (with OI-74's record).

The original brief follows. The evidence base is docs/knowledge/decision-routing.md. Three findings constrain the design. (1) MODEL CONFIDENCE IS NOT A ROUTER: no logprobs on the API; verbalized confidence is overconfident and prompt-dominated; sampling agreement fails directly (48% wrong inside the high-agreement regime; confidence-routed cascades lose to fixed policies); a 9-judge multi-vendor panel yields about 2.2 effective independent votes. The usable residue is a ONE-WAY RATCHET — low confidence or panel dissent may promote a decision to more scrutiny; high confidence or consensus may never demote one. (2) THE ROUTING SIGNAL IS THE ACTION, AS FIELDS AND COUNTS: reversibility class, registries touched, kit files touched, external side effects — the same instrument class OI-41's ruling chose over matchers, for the same bounded-error reason; with the record tier's size DERIVED FROM THE OWNER'S REVIEW CAPACITY, which bounds the queue by construction. (3) DISCLOSURE MUST BE STRUCTURAL: models recognize their risky calls 60-80% of the time when asked but volunteer them under 5% of the time when instructed; the fix with measured support is a REQUIRED field on an artifact already produced and validated — this kit's own split_decided_by pattern — plus, optionally, a SEPARATE detector pass (measured 8 points better than self-monitoring), never a prompt reminder. On the appetite: the owner's observation that it varies with mood is empirically normal (operator preference shifts between consent and exception under time pressure and workload), which argues for a cheap per-sitting setting; the kit's own final_review precedent shows a frequently-flipped hold split out of a rarely-flipped level; and the 2026-08-31 supervisor prompt already carried a per-run recording instruction that worked."""
blast_radius = """The doctrine lands in PROCESS_OPTIONS (an opt-in layer with an applies-when) and the session/supervisor briefs; the disclosure field lands on whatever artifact OI-74 picks and inherits its refusal posture (silent-on-required-field refuses, the split_decided_by shape). A dial, if chosen, is an eighteenth process.toml key bound by the IF-037 format constraints (one key = value line, closed alphabet, no tables) and ships in the template at its quietest value. Choosing confidence as a primary router would embed a measured-unreliable signal into the close machinery; choosing a matcher over prose re-opens what OI-41 already refused."""
options = """- (a) DOCTRINE PLUS LAUNCH PROMPT, NO DIAL: the routing table (which action classes decide silently, which record, which escalate) is stated doctrine; the per-sitting appetite rides in the launch/resume prompt as it already does. FOR: zero new dial; the appetite is per-run by construction; it is the mechanism that actually ran on 2026-08-31. AGAINST: invisible to every check; a prompt instruction is the weakest adherence class the kit knows.
- (b) ONE NAMED-MODE DIAL in [attestation] (for example decision_recording = off / record / escalate-first): a single line, closed enum, template ships off. FOR: durable, greppable, one word to flip per sitting; the final_review precedent. AGAINST: an eighteenth dial; a floor-setting instrument that still leans on agent judgment for the per-decision call.
- (c) (a) NOW, (b) LATER: doctrine and disclosure field first; a dial only if the record surface, once real, shows volume a dial would govern. FOR: smallest change now, evidence before instrument. AGAINST: two sittings instead of one.
- (d) A SAMPLING PAIR mirroring complete_review / complete_sample_rate, governing what SURFACES to the owner rather than what is written. FOR: idiomatic to the kit's one existing sampling dial; recording stays free, reading stays bounded. AGAINST: premature until the record surface exists and its real volume is known."""
recommendation = """(c), with (d) folded into the later step if volume warrants: rule the doctrine now — action-fields routing, capacity-bounded record tier, confidence as one-way ratchet only, the disclosure obligation as a required structured field with a refusal for silence — and revisit the dial in one sitting after the OI-74 surface has carried a few real runs. Whatever is chosen, the dial or prompt is a workload-allocation instrument and never the safety boundary: the escalate class (OI-70/OI-73's exits) binds at every setting."""
wi_refs = ["WI-552"]


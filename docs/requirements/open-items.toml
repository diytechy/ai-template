- THE `gate-advance` SKILL (141 lines, three enforced-identical copies) is a full rewrite, not a rename - its structure IS the gate ladder. `registry-hygiene` and `session-protocol` take light passes. Mechanically: the rewrite goes through the MATERIALIZER (`gen_skills_index.py` + `bootstrap.py --agents`/`--sync`), never three hand edits, or the three-copy pin fires mid-program.
- THE ENFORCER THIS ROW ALREADY RECORDED becomes load-bearing: no check refuses retired vocabulary in authored text, and the retired -at DevStg-Reqs- construct regenerated in this very registry within days. The sweep ships with the refusal check (tag-scoped, archive and quoting exempted) or the tags grow back."""
options = """THE DIRECTION IS RULED; five execution questions remain, separable and independently rulable.

- (1) CARRIER. Measured: the numeric-stage surface is FIVE sites total (two ordered comparisons, one parse, one serialization, one label map that is already string-keyed), so ANY carrier costs one ordered-enum constant consumed at three sites - while the codebase's existing lexicographic fragility (`check.py` compares gate names as strings, correct only because DevStg-Reqs<DevStg-Tests<DevStg-Impl alphabetizes) sits on the axis being DELETED. The owner weighed four forms 2026-08-12 (`DevStg-` prefixed): a bare INT, an embedded DECIMAL (`DevStg-4.0-LLReqs`), an embedded PERCENTAGE (`DevStg-56%-LLReqs`), and a bare LABEL (`DevStg-LLReqs`) - torn because a label hides position while a number hides meaning. THE RESOLUTION IS THAT TWO OF THE THREE WANTED PROPERTIES ARE DISPLAY PROPERTIES, NOT IDENTIFIER PROPERTIES: position-in-the-ladder is DERIVED (it changes when the ladder changes), and this kit's standing rule is that derived facts are generated and rendered, never authored into a key. So the recommendation is LABEL AS THE IDENTIFIER, position DERIVED - the basis line carries `stage=DevStg-LLReqs stage-ord=4 stage-of=8` for raw-file readability, and status/dashboard render -stage 5 of 8, LLR definition in work (63%)-, so an insertion self-corrects every ordinal and percentage with no citation moved. Why the other three lose: INT's failure mode is exactly this program (insert-in-the-middle shifts every number, silently). DECIMAL still cannot answer -how close to the end- without a maximum the identifier does not carry, sorts WRONG past nine rungs (`DevStg-10.0` precedes `DevStg-2.0` lexically - a form that looks ordered while sorting wrong is worse than one that obviously is not), and a later tidy-up re-points every historical citation, which is the hazard D-4 already refuses. PERCENTAGE REFUTES ITSELF ON ITS OWN INSERTION STORY: inserting at 21% between 14% and 28% makes nine rungs, where the third of nine belongs at ~25% - so every label past the insertion is wrong AS A PERCENTAGE, and the form degenerates into the decimal one while keeping the `%`. (The `%` tooling hazard was CHECKED and is weaker than assumed: all eight `ConfigParser` constructions in the kit pass `interpolation=None`, so `stack.ini` survives it - but an adopter's own default-interpolation reader does not, and that convention is held by eight call sites rather than by any check.) Conditions on the label form, non-negotiable: ban ordering operators on the value - every comparison routes through a STAGE_ORDER lookup that RAISES on unknown, never degrades; and note stages are a CLOSED VOCABULARY, not minted ids, so they take no `docs/id-watermark` space and no retire-never-remint rule. Two label typos to fix before they become identifiers - -Arcitecture- and -Impliment-. (The `CompReqs` naming question is ANSWERED in the recommended-ladder section: the label becomes `Reqs`, covering system and component alike, since the system is the depth-0 component.)
- (2) HISTORY - sweep wholesale WITH THE ATTESTATION CARVE-OUT (recommended): convert all prose history, regenerate the generated, but leave the ~30 attestation-quote sites verbatim with a one-line header note naming the retired vocabulary. Alternatives: sweep everything including quotes (the owner's stated lean, maximally consistent, but makes signed records misquote); or leave the archive untouched (zero risk, but a reader then needs two vocabularies to search their own history, which is the cost the owner named).
- (3) THE SIGN-OFF SUCCESSOR - today three sitting rows exist because three gates exist; eight rungs means eight states and an unstated number of sittings. Either sign-off rows become rung-boundary transitions (up to seven rows), or sittings stay their own axis - fewer sittings than boundaries, each naming the rung range it certifies. The second preserves the current practice (not every boundary needs a sitting) and is recommended. NOTE THE SURFACE THIS ANSWER CHANGES: `LOG.template.md`'s sign-off table SHIPS DOWNSTREAM, and the `## Gate Sign-offs` heading is CODE-PINNED (`trunk_step.RESERVED_HEADINGS` plus its test) - and D-10's append-only approval log is this table's row-level twin, scheduled into the schema batch, so the two are ruled TOGETHER or they diverge at birth.
- (4) THE AUTOMATION-DIAL KEYING - the owner intends the ladder to -correspond with the level of automation the user would approve.- Today `human_ratification_through` deliberately counts RATIFIABLE SPINE TIERS (0-4), not stages - SN-029 split those axes because implementation is not a ratification tier. Two honest shapes: (i) MAP the dial onto the ladder (a lookup from dial level to the rungs it holds) - keeps the axes distinct, works today; (ii) EXTEND the dial to name rungs directly - coherent ONLY once rungs 1 and 3 have ratifiable artifacts, which is exactly what OI-14's boundary/partition ruling creates, so (ii) becomes available after OI-14 lands and can supersede (i) then. THE DEPTH HALF, surfaced from the recursion section where it was buried: keying approval to the DEPTH AND TIER OF THE ARTIFACT TOUCHED rather than the project aggregate is a CHANGE TO `human_holds` SEMANTICS - when a human is re-engaged - and its wrong-answer direction is silently LESS human involvement, so it is ruled here, never defaulted.
- (5) THE RUNG PREDICATES - added at the 2026-08-12 adversarial round, which found the four questions above omit the computation itself. Every rung needs a SOURCE ARTIFACT and a TRANSITION PREDICATE, and today `derive_gate.spine_stage` computes a SIX-state cascade from SN drafts plus SR/LLR/TC `Status` (`Draft`/`Modified`/`Verified`) - values D-9's ladder migration RETIRES. Three sub-decisions: (a) each of the eight rungs' predicate, including not-applicable behaviour for a project with no physical half; (b) the MATURITY VOCABULARY for IF and CMP rows so they can join the min-fold - the natural answer is D-9's own ladder (Drafted/Approved/Founded, defined to travel to other registries), BUT D-9 consequence 5 explicitly left `CMP.State` OUTSIDE that unification and parked `IF.Status` with OI-14, so the recursion-answers-itself argument above rests on a schema change nobody has yet been asked to make - it is asked HERE; (c) SEQUENCING against the D-9 ladder migration (repo-lock section 5 step 7), which rewrites the same `is_draft`/`is_verified`/`is_modified` predicates in the same file - the two programs must land as one sequence or the insert hazard this brief records fires in the gap between them."""
recommendation = """EXECUTE AS ITS OWN PROGRAM AFTER OI-14 PART A, with the string carrier, the attestation carve-out, sittings-as-their-own-axis, and the dial mapped (not collapsed) onto the ladder.


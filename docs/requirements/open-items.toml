[open_item.OI-61]
title = """What the interfaces registry's `contract` cell is FOR - generalize the 27 CLI restatements, or retire the prose cell in favour of source-resident, test-validated, LLM-audited declarations"""
status = "ruled"
ruled_date = "2026-08-23"
ruling_ref = "docs/log.d/2026-08-23-oi61-rule-and-spine-approval.md"
raised = "2026-08-23"
one_line = """the owner (2026-08-23), reading the interface registry: "These interfaces are just methods that we provide to downstream users ... I would question if this is really an interface that needs such a detailed contract if it's just restatement" and then, going further, "I would wonder if 'contract' is necessary at all" - the measurement behind the question is that 27 of the registry's 46 `Provides` rows carry a hand-written CLI restatement averaging 274 characters, the two known rot exhibits are both inside `contract` prose, and the only enforcement on the cell is PRESENCE of an id, never agreement of its content"""
decision = """THE OWNER'S WORDS, verbatim, because the question is his and the framing is load-bearing.

First message: "These interfaces are just methods that we provide to downstream users. They will naturally terminate. Since they are methods, I would think the consumer would just be the boundary interface that defines the main connection to the template. ... How is rot prevented between interfaces.toml and the actual module providing the behavior? ... Aren't there methods of generating documentation for python files? ... I would question if this is really an interface that needs such a detailed contract if it's just restatement ... wondering if it should be generalized to just stating that this method of the SR is provided as a behavior to the downstream users, where-upon the user would reference the owner itself to know the details."

Second message: "I would wonder if 'contract' is necessary at all. Unless it is something that is easy to identify and test without an LLM (like type: float ... length-max: 6540), there is not a trivial way to design around it, at which point the consumer might as well go back to the owner module and verify what it actually provides instead of referring to a potentially rotting document. ... the source of what a module provides actually lives with the module and is validated with the tests ... ideally there would be some comment generated at the source, validated by its own tests, and some method to kick off an LLM based interface validation layer to ensure what the owner does, what it says it does, and what the test checks around that interface are all agreed upon. ... there might be times an interface doesn't need a test, if these are lower level interfaces to build up to bigger functionality, maybe the parent functionality is all that needs to be tested."

THE CENSUS, measured over the live registry at `d16ddbb2` before anything was touched. 135 live rows, 46 `Provides` / 89 `Consumes`.

1. THE CLI FAMILY IS 27 ROWS AND IT IS THE `Provides` POPULATION. All 27 rows whose `contract` contains `CLI:` are `Provides` rows - 59% of that tier. 26 of the 27 literally OPEN with `<module>.py CLI:` (the exception is `IF-053`, which opens on the capability instead). Owner tier splits 9 `SR-###` / 18 `LLR-###`. Seven tie to a boundary crossing (`interface_to_external = "B-05"`: `IF-013`, `IF-014`, `IF-015`, `IF-016`, `IF-017`, `IF-018`, `IF-048`) - exactly the seven whose counterpart is `external:`; the other 20 name an internal counterpart, 15 of them `scripts/check`. Registry-wide there are 28 boundary ties, 25 of them B-05.

2. THE OWNER'S "GENERALIZE" INSTINCT ALREADY HAS A HOME IN THE SPINE, AND IT IS B-05. `external.toml`'s B-05 row says it in its own `carries` cell: "THE TEMPLATE - the packaged deliverable. The delivered scripts' contracts (check.py, bootstrap.py + MAPPING, agent_loop.py, check_vendored.py, gen_cases.py, gen_release_checklist.py, the hooks, the launchers) are IF definitions tied to this crossing: content of the package, not separate system crossings." The registry already RULES these as package content. What it does not do is let the rows say so briefly.

3. THE CELLS ARE LONG AND THE CEILING KNOWS IT. CLI-row `contract` length: min 128 (`IF-006`), median 180, mean 273.5, max 800 (`IF-103`). Thirteen exceed 200 characters, seven exceed 300, four breach the ruled 500-character ceiling (`IF-121` 587, `IF-015` 722, `IF-044` 788, `IF-103` 800) and draw `trace.if_contract_advisories`' fourth rule: "IF {iid} Contract is {n} characters (ceiling 500) - an interface states what crosses, typed; at this length it is carrying something else." Warn-first permanently, by the WI-443 ruling. The whole registry is worse - median 374, mean 381, 34 rows over the ceiling - so this is not a CLI-only disease; the CLI family is just where the restatement is provable, because the schema header itself says the cell holds "What the seam IS, in one testable line: CLI flags and exit codes, or the file schema."

4. THE ENFORCEMENT IS PRESENCE-ONLY, AND THAT IS DEMONSTRATED, NOT INFERRED. `check_trajectory.interface_findings` runs a two-way check between a module's `Contracts: IF-###` docstring line and the registry: "module {!r} docstring declares Contracts: {} but no such IF-### row exists", and the reverse "IF {} is in the registry but no script declares it via a Contracts: docstring line". Both arms are pure set differences over ids - no cell content is compared - and both are warn-first forever ("never the exit code, at any gate", `check_trajectory.py`'s own header). ALL 27 CLI rows are declared by their module today: the link is 27/27 complete, and it caught neither rot exhibit.

5. THE TWO ROT EXHIBITS, both banked by `WI-390`'s program close and both still live. `IF-055`'s contract names "the SCHED_* classification constants" - zero grep hits in `schedule.py`; the constants were deleted by the concurrency-v2 program. `IF-080`'s contract says the merge runs "--no-ff onto a candidate worktree" - the exact phrase `WI-390` slice 1 had already corrected in `PROCESS_OPTIONS.md` for contradicting `integrate.py`'s real behaviour, left standing here because Interfaces were outside that row's scope: "banked here, not fixed, for whoever next touches the interface registry's stale-prose sweep." Both are CONTENT rot inside prose that no check reads. A third, adjacent gap is already recorded as `docs/enforcement-audit.md` item 5: `gen_arch_map.module_contracts`' harvester matches `"Contracts" in line` as a substring, so a docstring line DENYING a declaration while naming its id reads as a declaration - a false QUIET, found when exactly such a line masked `IF-080`.

6. THE TYPED EMBRYO EXISTS AND IS HALF-UNATTENDED. `signal` is a closed vocabulary - `discrete` (finite enumerable alphabet) or `variable` (unbounded content) - declared in the header and in `trace.ENUM_FIELDS["IF"]`, validated by `schema_advisories` (warn-first at the IF tier). It is 100% populated: 127 `variable` / 8 `discrete` registry-wide, 21/6 on the CLI rows. But 25 rows carry the boilerplate `signal_note` "DERIVED, NOT HAND-TYPED ... re-type it by hand when this row is next touched (B1)", 14 of them CLI rows - so on half the family the one typed cell was inferred from the prose rather than authored. That is the owner's "type: float, length-max: 6540" idea already in the registry, at one bit of resolution, and not yet hand-held.

7. THE THREE-WAY AGREEMENT ALREADY EXISTS PAIRWISE, MECHANICALLY, ON OTHER TIERS. Does-vs-says: `check_trajectory.codesymbol_crosscheck_findings` (WI-502, landed 2026-08-23) resolves each literal `Implements:` tag's enclosing def/class qualname by AST and compares it by containment against the LLR row's `CodeSymbol`/`Module` - warn-first forever by ruling, 9 live findings at landing. Says-vs-tests: `WI-500`'s evidence carrier binds a recorded harness verdict to a digest over the spine registries AND the declared source tree, so a green cannot ride a test authored after the run. Does-vs-tests at its sharpest: `IF-076`'s contract ends "Finding STRINGS are part of the contract: the three golden files assert them byte-for-byte, which is what makes the split provably behaviour-preserving" - the one row in the registry whose prose IS executable, because a golden file pins it. What is missing is not the idea; it is the third edge for a cell whose content no grammar can read.

8. GENERATED DOCUMENTATION IS NOT HYPOTHETICAL HERE - IT IS THE HOUSE PATTERN. `gen_arch_map.scan_inventory()` is a stdlib `ast` walk that already harvests, per module, the docstring summary, internal coupling, every public symbol's signature and one-line summary, and the `Implements:`/`Contracts:` back-links, and it is the ONE walk the derived architecture reads ("the picture cannot drift from the code"). Its own docstring answers the owner's question: "It is harvested from your docstrings/headers, which is one more reason to comment for humans." An argparse-derived CLI reference is the same pattern one step further, and it is the kit's declared doctrine: generated-not-hand-maintained.

9. THE SEAM-TEST SUB-QUESTION HAS NO EXISTING IDIOM, and the honest answer is that the owner is asking for a new one. The `Verification` vocabulary is `Test | Demonstration | Manual | Analysis | Inspection | Attest | Critique`, and the ONLY exemption it grants is LLR-exemption: an SR needs no design row when its method is `Analysis`/`Inspection`/`Attest`. `PROCESS.md` is explicit the other way on tests - "Every SR needs >=1 TC row regardless of method". There is no "verified by the parent functionality's tests, pointer recorded" position anywhere in the vocabulary. Interfaces are off-spine and carry no `Verification` cell at all, so today a low-level seam simply has no way to SAY what verifies it.

10. WHERE AN LLM LENS WOULD LIVE IF IT LIVED ANYWHERE. `docs/requirements/hats.toml` carries 16 review lenses (SECURITY, TEST-ENGINEER, MAINTAINER, CONSISTENCY, PRODUCT-FITNESS and twelve more), each with `applies_when`/`asks`/`listens_for` - and its own header says "NOTHING GATES ON A HAT TODAY". `[policies] review_rounds = 1` in `docs/process.toml` fires ONE fresh-context verdict per worker train over the combined train diff, enforced at the integrator (`docs/reviews/{WI}-REVIEW-A.md` must parse as APPROVE and must not predate the branch's last code commit). A seventeenth hat is the cheapest possible host for a does-vs-says-vs-tests lens; it is also, honestly, a new judgement surface on a cadence that is per-train rather than per-row.

THE COUNTERWEIGHTS, carried because they are real.

- REGISTRY SELF-CONTAINEDNESS HAS BEEN USED, RECENTLY, FOR EXACTLY WHAT IT IS FOR. `WI-495`'s exception dossier adjudicated five owner picks and its instruction was "Read the contract, write the reason ... it turns entirely on what each contract says CROSSES. Read all five contracts and recommend keep-or-repick per row." That adjudication is not possible against 60 modules; it is possible against one file. The same property is what lets an adopter read the seam map without opening the tree.
- SOURCE COMMENTS ROT TOO. Proximity slows rot; it does not stop it. `IF-080`'s exhibit is the proof in both directions - the module docstring was RIGHT and the registry was wrong, but item 5's false-quiet was a docstring defect. What actually stops rot is a check that reads content, and moving prose from a registry to a docstring does not create one.
- THE LLM LENS IS A COST AND A NEW SURFACE. It is a per-run spend, a nondeterministic verdict, and a thing that can be wrong in a way a grammar cannot; the repo's standing preference is a constraint over a detector.

THE INTERACTIONS, so nothing is decided twice.

- The twelve SR-owned `Provides` rows in `docs/plans/2026-08-23-sr-owned-provides-report.md` OVERLAP THIS QUESTION BY NINE: `IF-001`, `IF-005`, `IF-009`, `IF-011`, `IF-013`, `IF-014`, `IF-015`, `IF-044`, `IF-053` are all CLI rows. Whatever `contract` becomes changes what a re-point is choosing an owner FOR, and the report's own headline - four rows are adopter-facing, where an SR is arguably the truthful owner - is the same distinction option (a) draws.
- The pending `counterpart` -> `consumers` rename (`OI-60` ruled (a), `WI-455` item 1) rewrites the far side of every row. If B-05 becomes the declared consumer for the adopter-facing rows, the tri-modality `OI-60` measured on `counterpart` shrinks by the 16 `external:downstream adopter` rows - which is the owner's first message read as a schema statement: "the consumer would just be the boundary interface that defines the main connection to the template."

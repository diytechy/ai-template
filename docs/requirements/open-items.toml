decision = """RULED 2026-08-30 (record docs/log.d/2026-08-30-owner-rulings-oi68-oi69.md): (a1) a retained transcript replayed by a bounded process is not a persistent actor - the no-daemon doctrine stands; (b1) reset_on_same_artifact = false, the fork hardening banked, the rework-round flip rate the signal to watch, and the second-round brief to carry the diff since the first verdict; (c2) keep-warm pings THROUGH the weekday blackout - a ping re-reads the cached prefix at about 0.1x the input price, so eight pings over the seven-hour window cost about $1.20 against the about $3 cold rewrite they avoid, break-even near 17 hours, Anthropic only; the driver's (c1) was wrong on the plan's own arithmetic; (d1) docs/process.toml [adjudicator]; (e1) dedicated CLI homes ONCE THE DIAL IS ON - the working directory still supplies everything the kit mandates, what moves is the user layer (credentials to provision, personal settings and skills, the shared transcripts and auto-memory); today's shared home stands for the telemetry row.


one_line = """rule the declared expert-perspective roster SN-036 requires - its contents, its home and its injection point; recommendation is a six-hat starting roster in `docs/requirements/hats.toml`, injected by the decomposition brief builder and edited as owner text"""
decision = """RULED (owner, 2026-08-13): (a) SHIP THE SIX-HAT ROSTER at `docs/requirements/hats.toml`, injection built first, coverage record second. The owner's note, recorded in substance: this does NOT conflict with SN-040 - it SUPPORTS it, by showing how a stakeholder need breaks down with each perspective in mind; the entire repo is LLM-judgement-capable, but it must SURFACE THE RATIONALE, and that surfacing happens in large part through the spine. The roster remains owner text - shipped as drafted, marked for the owner's edit at return.

SN-036 requires a declared roster of expert perspectives, and three parts of the machinery are unruled: the CONTENTS, the file's HOME, and the INJECTION POINT. The carrier is already ruled - TOML, per the owner.

The framing that makes this coherent, in the owner's words 2026-08-12: every stakeholder need should be decomposed -according to hats-, and a domain expert -may not be a stakeholder (they don't have needs)- but their perspective constrains someone else's need. So a hat is not a person and not a stakeholder row; it is a QUESTION that must be asked of every applicable need. SN-036 was admitted as a Draft on 2026-08-12 and states the obligation.

### First - the contents

A sketch was prepared and deliberately not applied, because a roster is a statement about what this project cares about and that is the owner's call:

- SECURITY (always) - what secret or irreversible action does this touch;
- FIRST-RUN-ADOPTER (template-scope needs) - does this hold for a stranger with only the shipped README and examples, which is the owner's -hats include the examples accessible to downstream users- read as a perspective;
- UNATTENDED-OPS (loop-executed needs) - what does this look like at 3am with no human;
- CROSS-PLATFORM (launchers, paths, shells) - which of Windows/macOS/Linux breaks this;
- MAINTAINER (always) - can a reader in two years tell why this exists;
- TEST-ENGINEER (always) - what mechanical check fails if this is quietly violated.

Each row would carry `applies_when`, `asks` and `listens_for` - the failure class it catches, so a hat that names no failure is refused as ceremony, which is the owner's own guardrail applied to the roster itself.

### Second - the home

`docs/requirements/hats.toml` plus a shipped template is the natural fit, but a roster is arguably a PROCESS declaration rather than a requirement artifact, and that argument has not been made either way.

### Third - the injection point

Today -Stakeholder- exists in the scripts ONLY as a tier label, never as a reviewer role, so the roles live in prose and column headers and have NO mechanical existence at all. The roster has to be injected by whatever composes the decomposition brief, and the natural carrier is the adjudicator seam (declared role, declared bar, assembled evidence, typed verdict), which is the shape a hat review already has."""

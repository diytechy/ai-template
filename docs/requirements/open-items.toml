[open_item.OI-12]
title = "One machine-parseable carrier for the requirement registries - rule the .md + .csv split"
status = "ruled"
raised = "2026-08-09"
one_line = """rule whether the four requirement tiers share ONE machine-parseable carrier - today SN is markdown prose and SR/LLR/TC are CSV, a split with no recorded rationale anywhere; recommendation is (b) one TOML carrier as the destination, sequenced as its own program after the repo is locked"""
decision = """RULED (owner, 2026-08-10): ONE TOML CARRIER, option (b), and brought FORWARD of the P0 sitting at the owner's direction so the new format is the one the remaining schema work lands on. Shape: id-keyed bare tables ([requirement.SR-137]), typed ref arrays, int Phase, multi-line strings for prose. Carrier only - Status keeps Draft/Verified/Modified, because retiring `Modified` is the ladder's job and doing it here would launder the 38 rows' re-blessing (Q11). See repo-lock D-5 for the guardrails."""
blast_radius = """MEASURED, and it differs sharply by option. Reading 32 SN rows costs about 166 code lines across 14 functions in 8 modules; reading all 436 SR+LLR+TC rows PLUS every off-spine registry costs `trace.load_csv`, five lines, because `csv.DictReader` does the rest - so the SN tier costs roughly 28x the parsing code for 7 percent of the rows, and it is also the only tier with no schema tier at all (no required-field checks, no enum checks - reference doc section 12.5). Two of those SN readers are F5 twins pinned equal by `tests/test_rule_sync.py`; a third pair, `traj_parse._sn_rows` and `gen_okf.sn_rows`, is pinned by nothing but a docstring saying -change both together- and HAS ALREADY DRIFTED ONCE, rendering a phantom SN-000 root in the dashboard icicle - a live hazard under every option, including keeping things as they are. Option (b) is a kit version bump with a downstream migration: every F5-duplicated loader, the shipped templates, `bootstrap.py` MAPPING, `EXAMPLE.md`, `ADOPTING.md`, `registry-machinery-reference.md` and the OKF export; `trace.structure_findings` (column-count integrity) has no analogue, though a parse error is arguably a stronger check; and `test_dogfood_sync`'s ordered-superset header rule has no meaning over TOML keys and needs redesigning. The precedent is IN-REPO and its cost is known rather than estimated: `work-items.csv` already became the `docs/work/` TOML-frontmatter spec folder, as a multi-phase program (2b, the 2c authority flip, Phase 5's deletion of the CSV home) spanning weeks, forcing a re-attestation sitting (LLR-051/056 re-grounded, SR-129/LLR-136 flipped Modified) and surfacing real defects - `build_scope_srs` and `critique_control` had been reading silently EMPTY since the 2c flip, which is the fail-open shape this kit exists to catch. A spine migration is LARGER than that one, because the WI registry carries no upward or downward joins into three sibling registries and the spine does. CORRECTED 2026-08-09 (the owner refuted the earlier wording, and this cell carried it): the FIELDS are carrier-neutral - `TextHash` and `HashedOn` (renamed from `TextDigest` / `AcceptedCommit`) are fields, not a format - but the CODE AND TESTS ARE NOT, so deferring this ruling does NOT cost nothing. Building the anchor on CSV and converting afterwards rewrites the column-classification machinery, test_dogfood_sync's ordered-superset header rule (meaningless over TOML keys), structure_findings (a column count becomes a parse error), intake's writer, the two-tree git-show parse, and the attestation test module a SECOND time. Forecloses-nothing is true of the design and false of the labour; see repo-lock.md F-7. This ruling now GATES the anchor half of D-1, D-2, and the D-3/D-4 registry changes."""
options = """(a) KEEP THE SPLIT and ratify it as a decision, recording the rationale that was never written. FOR: zero cost and zero risk; the CSV tiers are read by five lines of stdlib and they work; a lock program exists to CLOSE the largest amendment window this repo has carried, and this would open a larger one on top of it. AGAINST: it ratifies an accident rather than a design; it leaves the 166-line SN reader and the unpinned `traj_parse`/`gen_okf` twin standing; and it leaves the SN tier - the one a DevStg-Reqs consistency review leans on hardest - with no schema tier at all. (b) ONE TOML CARRIER for all four tiers. FOR: `tomllib` is stdlib at the kit's declared 3.11 floor, so it costs no dependency - unlike a markdown parser, which `docs/dependencies.md` would have to admit as the first Python row ever, in the shipped tier the kit holds stdlib-preferred; the kit ALREADY sanctions TOML in two homes (`docs/process.toml` and the +++ frontmatter of every `docs/work` spec); multi-line basic strings dissolve every measured carrier defect at once; typed arrays retire `refs()` splitting on whitespace and with it the SN-001-and-SN-002 orphan bug (reference doc section 12.8); TOML carries COMMENTS, which CSV cannot - today the SR template fakes them by stuffing a 700-character explanation of the Phase rule inside an example row's cell value; and it unifies SN with the other three tiers behind one loader, deleting about 139 lines of bespoke parsing. AGAINST: `tomllib` is READ-ONLY (PEP 680 omitted a writer deliberately) and this kit writes registries programmatically - `intake` rewrites Status today and must write the anchor cells under D-1 - so it needs a third hand-rolled emitter or the first genuinely shared one; the repo already carries two, by two strategies that are NOT interchangeable (`wi_convert.toml_string` re-serializes and re-parses to verify; `bootstrap.set_process_key` does a line rewrite so the explanatory header survives, which works only because that file owes the git hooks one key per line); plus the kit version bump and downstream migration sized above. (c) MARKDOWN TABLES EVERYWHERE, for consistency with SN. FOR: one carrier, and the most directly readable in an editor. AGAINST: REFUTED ON MEASUREMENT - five live cells already contain a literal pipe character (SR-024, SR-043, LLR-024, LLR-040, LLR-152), which `traj_parse`'s naive split-on-pipe shape cannot survive; 552 cells contain commas, which CSV handles by RFC-4180 quoting and markdown has no equivalent for; the longest cell is 1553 characters; an embedded newline has no representation at all (none exist today, but the CSV form permits one and `gen_open_items.normalize` exists because a Windows-authored multi-line cell was observed); there is no analogue for `trace.structure_findings`; and there is no reusable markdown-table reader here to inherit - the `docs/work` loader parses no tables at all (it is `tomllib` over +++ fences, small BECAUSE the fields are TOML) and the SN tables are read by six bespoke scanners, two of which index cells POSITIONALLY, which is exactly the failure the column-count guard exists to catch."""
recommendation = """(b) as the DESTINATION, (a) as the ACTION for this program - and those are not in conflict. The carrier question has a right answer and it is TOML: it is the only option that is stdlib at the declared floor, already sanctioned in two homes here, and able to hold the cells that actually exist rather than the cells one wishes existed. But the lock program's whole purpose is to close an open amendment window, and a kit-wide carrier migration inside it would open a bigger one - so rule the destination now if you are ready, and sequence the work as its own program once the repo is locked. IF (b) IS RULED: it graduates to an SN plus its SR on the SN-011 shape - a constraint recorded as a need, which is already what this kit does with stack-agnosticism and the dependency floor - and the F-8 gap, that a design constraint has no declared home at all, becomes worth its own row rather than a note. IF (a) IS RULED: record the rationale in `PROCESS.md` so the next reader does not re-derive it from scratch, as this one did. EITHER WAY, one thing is owed separately and should not wait on this ruling: the `traj_parse._sn_rows` / `gen_okf.sn_rows` twin is pinned by no test and has already drifted once, and that hazard is identical under all three options."""
ruled_date = "2026-08-10"
ruling_ref = "docs/repo-lock.md#d-5"

[open_item.OI-13]
title = """What does Status MEAN - align the vocabulary across all six registries, including the interfaces pair"""
status = "ruled"
raised = "2026-08-09"
one_line = """rule what `Status` means across the six registries that carry one - the word names six different vocabularies today, one of them (`interfaces.csv`) undeclared, self-overlapping, read by nothing mechanical, and fed verbatim to LLM planning briefs; recommendation is to reserve `Status` for ratifiable-artifact maturity and rename the rest, executed WITH OI-12 because both rewrite registry definitions"""
decision = """Raised by the owner 2026-08-09 while ruling on whether a stakeholder need should gain a `Status` cell: -we need to align on all the registry definitions. I am afraid this will impact the interface definitions as well.- Verified, and it does. SIX CARRIERS TODAY, only one of them closed: (1) SR/LLR/TC `Status` - OPEN vocabulary with three magic values (`Draft`, `Verified`, `Modified`) matched by exact equality, case-insensitive, everything else legal and mechanically inert; (2) SN - NO column at all, maturity is section-as-state, a heading whose text CONTAINS the word draft, so the SN rule is a substring match where the row rule is an equality; (3) WI - directory-as-state, seven directories mapping to eight in-memory names (`complete/` becomes `done`) with `blocked` DERIVED and never stored - the only CLOSED vocabulary in the repo, because an unknown directory is a loader refusal; (4) IF `Status` - {Stable, Active, Draft}; (5) OI `Status` - only `pending` carries meaning; (6) CMP `State`. THE INTERFACES REGISTRY IS THE WORST OF THE SIX AND IS A DEFECT RATHER THAN A DESIGN CHOICE: `PROCESS.md` section 8 names the IF row's fields as -direction, counterpart, contract, the SR-Refs that realize/rely on it, version, and stability- and `Status` IS NOT AMONG THEM, yet it ships in the template and carries a value on all 95 live rows (Stable 87, Active 4, Draft 4); it OVERLAPS its own neighbour, since `Stability` is {Stable, Experimental} and the word Stable appears in both columns of the same row meaning different things; and their enforcement is inverted from what a reader would assume - `Stability`, the DECLARED field, is read by exactly one consumer (`gen_release_checklist`), while `Status`, the UNDECLARED one, is read by nothing mechanical at all and its only consumer is `plan_briefs.IF_SURFACE_COLUMNS`, which hands it verbatim into the dual-plan LLM briefs. An undeclared, unvalidated, self-overlapping column is being presented to a model as fact. RULED 2026-08-11 (D-9): option (b), unify - Status means ONE thing repo-wide, a three-rung ladder Drafted -> Approved -> Founded, uniform across SN/SR/LLR/TC. Approved is defined generally as "a judgement was made", so it travels to other registries where the meaning stays coherent. The pass rung is DELETED rather than renamed: pass/fail is a live fact the harness answers, so recording it per row is a stale duplicate - and deleting it means Verified leaves the vocabulary entirely, so a stray Verified is unambiguously an un-migrated row. IF Status lands with OI-14; OI/CMP/WI dispositions in D-9 consequence 5. Migration is held behind the P0 sitting per Q11 (the 38 Modified rows must resolve first or their owed re-blessing is laundered)."""
blast_radius = """REGISTRY DEFINITIONS AND TEMPLATES, which is why this is coupled to OI-12 rather than independent of it. Any answer touches `docs/requirements/interfaces.csv` plus its shipped template, `PROCESS.md` section 8's field list, and - if the SN half is included - `stakeholder-needs.md`, its template, and the section-as-state readers in `trace.py` and `spine_rules.py` (F5 twins pinned by `tests/test_rule_sync.py`). A RENAME additionally touches every reader of the renamed column and every adopting repo, which is the same blast radius OI-12 carries, for the same files. NOTE THE SHARP EDGE ON THE SN HALF: giving an SN a `Status` cell while the section-as-state rule still stands is TWO HOMES FOR ONE DIAL, precisely the state SN-028 just shipped a REFUSAL for - so the cell and the retirement of section-as-state must land in ONE commit, never both live at once. What this does NOT touch: the gate arithmetic. `spine_rules` reads the three magic spine values and the SN section-state; nothing here proposes changing what they MEAN, only what the word is allowed to name elsewhere. Also independent of the carrier question in one direction only - the vocabulary survives any carrier, but executing a rename twice (once on CSV, once after a TOML conversion) is the same double-labour trap OI-12's own sequencing note records."""
options = """(a) DECLARE, DO NOT UNIFY - leave each registry its own vocabulary and write down what each one means, adding a schema check where the vocabulary is meant to be closed. FOR: smallest possible change; the vocabularies genuinely describe different things, and a requirement's maturity is not an interface's stability, so forcing one word onto both would be a false unification; it fixes the actual defect (undeclared, unvalidated) without a rename. AGAINST: it leaves one word naming six things, which is the condition that produced the `interfaces.csv` overlap in the first place, and leaves a reader (or an agent) to infer from context which vocabulary a `Status` cell is speaking. (b) RESERVE THE WORD - `Status` means maturity-of-a-ratifiable-artifact and nothing else (the spine tiers, plus SN if that half is taken); everything else is RENAMED to what it actually is - the IF column collapses into `Stability` or becomes `Lifecycle`, OI becomes `Decision` state, CMP stays `State`. FOR: one word, one meaning, which is the kit's own single-source doctrine applied to a vocabulary rather than to a file; it makes the six-way ambiguity unrepresentable instead of documented; and it removes the undeclared IF column rather than blessing it. AGAINST: a rename across registries, templates, readers and every adopting repo - a kit version bump with a migration, and one that is pure churn if the value it carries is never read. (c) SN HALF ONLY - add the SN `Status` cell (with section-as-state retired in the same commit) and leave the other five alone. FOR: it unblocks D-2 and puts the five Draft needs onto the owner surface, which is the concrete thing anyone is waiting for. AGAINST: it makes the ambiguity WORSE by adding a sixth `Status` while the interfaces defect stands, and it is the option most likely to be described later as -we knew and did nothing-."""
recommendation = """(b) as the destination, and EXECUTE IT WITH OI-12, not before or after. The coupling is the whole point: both items rewrite registry definitions, both touch every template, and both force a downstream migration - so doing them separately pays that cost twice, which is the same double-labour objection that reordered OI-12's own plan. If OI-12 rules TOML, the vocabulary lands as typed keys in the new carrier and the rename is absorbed by a migration that was happening anyway. TWO THINGS SHOULD NOT WAIT FOR EITHER RULING, because they are defects rather than design questions. FIRST, the `interfaces.csv` `Status` column: it is undeclared in `PROCESS.md` section 8, overlaps `Stability` in the same row, is read by nothing mechanical, and is fed verbatim to LLM planning briefs - that last fact is what makes it urgent rather than untidy, because a model is being handed an unvalidated field as though it were a contract. Either declare it with a distinct meaning or delete it and keep the field section 8 actually names. SECOND, the SN half is genuinely blocking D-2 and the owner surface; if the sitting wants the five Draft needs visible before this is ruled, take (c) KNOWINGLY, record it here as an accepted interim, and let (b) absorb it - what must not happen is (c) arriving by default and being mistaken for a decision."""
ruled_date = "2026-08-11"
ruling_ref = "docs/repo-lock.md section 2, D-9"

[open_item.OI-14]
title = """The component partition AND the interface contract - which boundaries exist, and what a row at one must say"""
status = "ruled"
raised = "2026-08-09"
ruled_date = "2026-08-13"
ruling_ref = "docs/log.md#decisions-log"
one_line = """One ruling, three questions - (A) which component boundaries exist, (B) what an interface row must say, and whether DevStg-Reqs must require a declared system boundary first; rule A then B in one sitting"""
decision = """RULED (owner, 2026-08-13): APPROVE THE RECOMMENDATION - (A3) then (B1) in that order, with the boundary rung taken as (A6): applies-when, warn-first. EXECUTION MODE, confirmed the same date for the owner's absence: when part A's ranked shortlist exists, its top candidate is PROVISIONALLY ADOPTED warn-first - safe because `LLR.Component` is a traced cell, so no re-attest window opens - so the dependent programs (OI-21, OI-16, OI-28, the IF/CMP conversions) proceed; the full shortlist with rework sizing is packaged for the owner's ratification at return, where the provisional choice can be overturned. The original brief follows.

Two parts of one ruling: PART A - which component boundaries exist. PART B - what an interface row must say. They are one item because `check_trajectory.cross_component_findings` makes an import edge between two components a FINDING unless a covering interface row exists, so the partition MECHANICALLY DETERMINES the interface population - Part B cannot be executed against a row set Part A may change.

A caveat that must be read with that mechanism: `cross_component_findings` reports ZERO findings today, but its own docstring says it is DELIBERATELY VACUOUS for any endpoint carrying no component tag, delegating that coverage to the containment rule instead.

- 46 of 113 interface rows have at least one such endpoint, so -component-findings=0- honestly means -no findings among the 67 classifiable rows-.
- Whether the other 46 are covered is the containment rule's answer, and it should be CONFIRMED rather than assumed when the partition is ruled.

### PART A - the component partition

THE PURPOSE, in the owner's words 2026-08-12, and it is the objective function rather than context: a defined architecture exists -to prevent modules and implementations from repeating the behavior in multiple places, or doing it in a way that contradicts what was done elsewhere.- The architecture is FORMATIVE - it shapes what gets built, so implementation is -not blind- - not a description of what already exists.

That rules out deriving the partition by clustering today's 55 modules. Clustering what exists ratifies whatever duplication and contradiction it already contains, which is the one thing the architecture is for. The owner accepts the consequence: -since this repository already has a form in work, that might surface more rework, and that's okay.-

- Components are architecturable breakdowns that -also define the boundaries with which system requirements must be written.-
- The prescribed method: -laying out the inputs / outputs of the system first, and then breaking that into components with internal signals will help give shape to what the component definitions need to be and the interfaces between them.-
- The method IS N2/DSM decomposition, literally rather than by analogy (docs/knowledge/system-decomposition-methods.md).
- TODAY'S PARTITION IS 5 COMPONENTS AND WAS NEVER DERIVED THIS WAY - the accident this ruling replaces, and the delta against a derived partition IS the rework list.

### PART A - the objective, corrected

The brief previously named ONE objective, hypergraph-cut minimisation, and named `interfaces.csv`'s `SR-Refs` column as the incidence matrix -the method needs-. BOTH CLAIMS WERE TOO NARROW and are corrected here.

- `SR-Refs` is one ENCODING of the coupling, available here only because 147 SRs already exist. The method needs elements plus a coupling relation; requirements are one source, shared signals from a functional decomposition another. A greenfield adopter before DevStg-Reqs has neither, so the shipped method cannot assume this one.
- Cut minimisation is the SECONDARY objective. The PRIMARY one, from the stated purpose, is ONE HOME PER BEHAVIOUR - and it is a CONSTRAINT, not a cost: a candidate partition in which one behaviour is owned by two components is INVALID, not merely expensive.
- Contradiction is the same constraint read at implementation time: two homes for one behaviour is what lets two implementations disagree.

THE CURRENT ARCHITECTURE ALREADY VIOLATES THE PRIMARY CONSTRAINT, measured 2026-08-12, which is evidence rather than tidiness:

- `is_example` - one behaviour, THREE homes, and they disagree: one copy crashes on `None`.
- the declared-line reader - one behaviour, FIVE homes, carrying a prose claim of equivalence that was false.
- `value_to_cell` and its reader - each documented as the other's inverse, with a TypeError between them.

Each is a behaviour no architecture had assigned a home, found by a census rather than by a check. That is the failure mode this ruling exists to make unrepresentable.

All three are since pinned equal by `tests/test_rule_sync.py` (the rule-sync batteries commit), so the copies can no longer drift silently - but a pin contains the symptom, not the constraint: the behaviours still have 3, 5 and 2 homes, and no architecture assigns them one.

### THREE PARTITION AXES, NO DECLARED RELATIONSHIP - measured 2026-08-12 on the owner's question

The spine carries THREE hand-authored partition columns and nothing states how they relate: `LLR.Module` (WHERE THE CODE LIVES - 70 distinct, a `;`-joined list), `LLR.Component` (WHICH ARCHITECTURAL UNIT OWNS THE BEHAVIOUR - CMP-001..005, 149 of 149 rows tagged), and `SR.Area` (WHICH DOMAIN HAT REVIEWS IT - 31 distinct values, 146 of 147 rows). Three legitimate questions; the defect is that no rule connects them.

- COMPONENT IS NOT A FUNCTION OF MODULE: 5 of 70 modules carry LLRs tagged into TWO components - `bootstrap` (CMP-002+005), `agent_common` (002+004), `agent_session` (002+004), `spine_rules` (001+002), `handback` (003+004).
- AREA ALIGNS WITH NEITHER: 6 of 31 areas decompose into more than one component; -Process- spans four and -Trajectory- spans four. `Area` is also REPORT-ONLY by construction (`trace.py`: a per-Area count, -never a finding-), so 31 authored values are validated by nothing and gate nothing.
- AND MULTI-MEMBERSHIP SILENTLY WEAKENS THE ENFORCING CHECK, which is the finding that matters. `cross_component_findings` fires only when the two endpoints' component sets are DISJOINT (the guard, abridged - the full line also skips covered pairs: `if not dst_cmps or (src_cmps & dst_cmps) or (src_n, dst_n) in covered: continue`), so tagging a module into MORE components monotonically REDUCES findings. Measured live: of 97 classifiable internal import edges, 64 are suppressed by set overlap (17 with a multi-tagged endpoint) and only 33 are policed. With the 46 vacuous IF rows recorded above, the reassuring -component-findings=0- rests on a much narrower base than it reads.

THE SIGNAL IS INVERTED, and correcting that is part of this ruling: a module serving two components is EVIDENCE ABOUT THE PARTITION - either the file splits, or the shared part is its own component, or the boundary is drawn wrong - and all three are questions this item exists to answer. Today that evidence SILENCES the check instead of raising it, and it is silenceable by authoring, which is the fail-open shape the kit exists to catch.

### EXTERNAL EVIDENCE - the Core robotics adopter already ran this investigation and RATIFIED an answer

Examined 2026-08-12 at the owner's direction. `Core` (the Gilbert/Adamah robot) is a real MIXED software-plus-physical adopter of this kit (stamped `767487c 2026-07-06`, at DevStg-Impl, 37 SN / 31 SR / 63 LLR / 70 TC) and it carries a 283-line whiteboard titled -AI-Template Fit and Hardware Traceability- written expressly to test whether this kit fits hardware, plus a RATIFIED glossary. It is the strongest evidence available for part A and it should be read before the partition is ruled.

- IT REPRODUCES THIS ITEM'S CENTRAL FINDING INDEPENDENTLY. Core's ratified glossary defines `Module` as one of 8 swappable ASSEMBLIES (BASE, TORSO, ARM-PROX, ARM-DIST, HAND, HEAD, PWR, HARNESS); its actual `Module` COLUMN holds 63 source-file paths. Two granularities, one column name - and its own WB15 tabulates a 3-to-1 component-to-module map (`part-compiler`/`robot-compiler`/`collision-gen` all realize into `hardware/parts`). That is this repo's five-modules-span-two-components pattern, reached by a different project on a different domain. The Module-plus-Component PAIR is validated; what Core lacks is the Component column, which its kit version predates.
- THE RESOLVING DEFINITION, and it is domain-neutral: COMPONENT is the coarse swappable boundary that owns an interface contract, a test rig, a budget and an owner (an assembly OR a package, interchangeably); MODULE is the fine implementation home a requirement discharges into (a source file OR a part source, interchangeably).
- -ONE BOUNDARY, FOUR VIEWS- - Core's organizing principle, and the reason no hardware component TYPE is needed: -Cut the robot so that each assembly is simultaneously a mechanical unit, an electrical node, a software sub-graph, and a registry `Module` - one boundary, one interface contract, one test rig, one owner.- The four views live on the INTERFACE (Mechanical mount/mate/joint, Electrical connector/pinout/rail, Network bus/protocol, Software message/topic schema), not on the component. Boundary placement is the NARROW-WAIST RULE: -place a boundary where the fewest signals cross- - target 6 or fewer IF rows per assembly.
- IT REFUSES THE HARDWARE-CONTAINS-SOFTWARE RECURSION, explicitly: -An assembly = mechanics + local board + firmware, one tracked unit, one IF contract, gated together.- The worked instance is the owner's own example: a bought stereo camera with an 800 Hz IMU running vendor firmware and per-serial factory calibration hangs off ONE capability row and ONE interface row, not a nested tree. The recursion is dissolved by boundary PLACEMENT rather than by adding a level.
- THE MODEL BREAKS AT MADE-VERSUS-BOUGHT, NOT SOFTWARE-VERSUS-HARDWARE - the sharpest correction Core offers. A DESIGNED part can BE code: `hardware/parts/tendon_finger_rig.py` is parametric build123d Python, an LLR binds to `build_rig`, and a TC asserts joint travel and tendon path length and pins a byte-identical STL - so the `CodeSymbol` discharge rule survives UNCHANGED for designed hardware. A BOUGHT part cannot, and is honestly a `PART` row owned by an IF row plus an `ASSET` row for its opaque per-instance data. So the LLR tier needs no non-code exemption for the made case, and the bought case never reaches the LLR tier at all - a narrower gap than the -generalize the discharge rule- framing assumed.
- THREE ASYMMETRIES A UNIFIED COMPONENT MUST ABSORB rather than hide: PER-INSTANCE IDENTITY (an `ASSET` row pins calibration for ONE serial, and a byte alignment was pinned empirically on ONE bench unit - physical components have serials, wear and board revisions where software has only versions, and nothing today records WHICH unit a verified result belongs to); VERIFICATION METHOD (physical discharges to Demonstration/Inspection/Attest or a device-probing test that HONESTLY SKIPS with a named reason, which works only because Method and Tier are first-class); and FITNESS OF EMBEDDED SOFTWARE YOU DID NOT WRITE (Core ruled a bought servo's load register is a -coarse overload/stall flag only ... never the object-force truth-, a component-level judgement with no column anywhere).
- ONE MECHANISM ALREADY SPANS BOTH DOMAINS AT ZERO COST: `check_perf.py` is metric-agnostic, so -grams and N.m budget exactly like milliseconds.- Where a rule is defined over numbers with a direction, hardware needs no special case.
- THE HONEST LIMIT ON THIS EVIDENCE: Core's hardware half is DESIGNED, not EXERCISED - `procurement.csv` holds zero rows, `hardware/assemblies/` and `tests/hardware/` are empty, `electrical/` is a README, and no mass budget row exists. Validate the model against Core's REASONING, which is battle-tested against this kit; do NOT treat its hardware registries as proof the model survives contact, because it has not yet been contacted.

USEFUL CONSEQUENCE: those five modules are a ready-made rework list for part A - the same one-home-per-behaviour violation as `is_example`'s three copies, measured at FILE granularity rather than function granularity. WHAT THE RULING MUST DECLARE: which axis is PRIMARY and how the others derive from it (the natural shape under the primary constraint is that a module belongs to exactly one component, with a shared service becoming its own component rather than a second tag), and whether `Area` derives from `Component` or retires.

### PART A - the sequence, and the rung it needs

The partition is not a one-shot step before or after requirements. The honest order:

- declare the SYSTEM BOUNDARY - what is outside, what crosses, each crossing typed;
- a first-cut functional decomposition - what the system must DO, as signals, from the needs;
- PARTITION - the optimisation, which is where -how many components- is answered;
- write SRs against the resulting boundaries (which is already this repo's practice: 76 of 147 live SRs name a script in their requirement text);
- RE-SCORE the partition against those SRs, because SR authoring is the highest-fidelity signal inventory the project will ever have. A boundary that moves at re-score is a finding about the first cut, not churn.

THE BOUNDARY STEP HAS NO HOME TODAY and is the rung this item should also rule. DevStg-Reqs's bar requires the vision tag, complete needs, non-goals and sign-offs - it says nothing about the system boundary, so SRs are blessed without a declared frame to be written against. The mechanism already half-exists: 15 of 113 interface rows name an external counterpart (`downstream adopter`, `agent CLI`, `docs`). What is missing is the COMPLETENESS obligation and the ORDERING one.

WHAT STAYS HUMAN, per the same research: naming the clusters, and judging which parts will CHANGE together rather than merely co-occur today - the Parnas criterion, which no metric sees.

### PART B - what an interface row must say

THE OWNER RULED THE DIRECTION 2026-08-12: -Interfaces must be INTERFACES only (discrete vs variable), and all component breaks must have all interfaces described by their interface- - adding that the mechanical enforcement method is itself unsettled (-I'm not sure of the best way to enforce this mechanically-), which is the open half of this item. The observation behind it, 2026-08-09: -the prose in IF appear to be requirements, when it is intended to be interface definitions.-

The cells are not requirements in the shall-statement sense, and section 8's backing rule holds mechanically - ZERO rows have an empty `SR-Refs`, so every seam does hang off a real requirement. What they carry is DESIGN NARRATIVE: what a module does across the seam, which work item split it from what, and which defect the shape was chosen to avoid.

THE DRIFT HAS ACCELERATED SINCE THE ITEM WAS RAISED, which is the fact that should change how urgently it is ruled. Re-measured against the live registry 2026-08-12, every figure moved the wrong way:

- live rows 95 to 113;
- requirement voice 1 percent to 7.1 percent (8 rows now say -must-);
- rows citing `repo-lock D-n` 11 of 110 to 14 of 113;
- median cell length 260 to 325 characters, mean 323 to 372;
- rows over 500 characters 21 to 34;
- cross-registry citations 14 percent to 23.9 percent (27 rows name a `WI-` id in `Contract`; 34 cite any registry id; an earlier 24.8 figure was not reproducible at re-measure);
- only the maximum is unchanged at 968, and it is the same row.

THE CONTENT IS NOT MISJUDGED, IT IS UNFILED, and the reason is structural rather than careless: the kit is stack-agnostic so a type signature cannot be demanded (a seam may be a file format, a CLI, or an external actor), and the IF row has NO `Rationale` and NO `Detail` column, so the why has nowhere else in the row to go.

WHAT THE NEW DIRECTION ADDS THAT THE ORIGINAL BRIEF DID NOT CONTEMPLATE: nothing in the registry today types a signal at all - all 113 rows were searched for a discrete/variable or type/kind distinction and there are ZERO hits, in any column - so the owner's typing rule is a new column plus a rule to validate it, not a convention to write down."""

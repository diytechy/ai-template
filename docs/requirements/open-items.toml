one_line = """rule the assurance posture for interface contract tests - PROCESS.md and README state every interface is backed by an SR and a contract/fixture test, while PROCESS_OPTIONS.md and check_trajectory.py DELIBERATELY keep IF-to-TC coverage warn-only at every bar and the measured gap is 115 of 125 seams (verified 2026-08-19); the recommendation is (a) PROMOTE AT DevStg-Tests WITH A MIGRATION ALLOWLIST, sequenced behind the wi455/WI-469 contract re-authoring so tests pin re-authored contracts, with (b) the prose soften executed by WI-477 only if the ruling refuses promotion"""
decision = """RAISED BY THE 2026-08-19 REPOSITORY REVIEW (H-04; archived at `docs/archive/repo-review-2026-08-19.md`), verified against this tree before minting: `check_trajectory.py --strict` reports `115 IF seam(s) are cited by no TC`.

THE TWO ARTIFACTS DESCRIBE DIFFERENT SYSTEMS, AND BOTH ARE DELIBERATE. The prose half: `PROCESS.md` (~:1095-1110) and `README.md` (~:197) state that every interface is backed by an SR and a contract/fixture test - an assurance claim a reviewer will price into their reading. The enforcement half: `PROCESS_OPTIONS.md` (~:2177-2188) and `check_trajectory.py` (~:1014-1017) keep IF-to-TC coverage WARN-ONLY at every bar, on record as a decision, not an oversight. Warn-only has not converged: the gap is 92% and no current work item owns the 115-seam backlog as a whole (the wi455 lane owns the contract-CELL rework and WI-469 the 27 Consumes re-authorings - neither owes tests).

WHY THIS IS AN OWNER CALL AND NOT A DEFECT FIX: either side can be made true. Promoting coverage to an error is a real obligation on every adopter (and on this repo's own 115-seam backlog); softening the prose is an honest retreat of a shipped assurance claim. Choosing between an obligation and a retreat is exactly the class the open-items surface exists for - and the review's framing is right that a contract that is only prose is easiest to break DURING the planned decomposition (WI-483), which is when focused interface tests earn their keep."""
blast_radius = """BOUNDED IN CODE, KIT-WIDE IN MEANING.

- (a) is a gate-behavior change in `check_trajectory.py` (warn to error at a declared bar) plus a migration allowlist file with a burn-down expectation; every downstream adopter inherits the promotion at the same bar. This repo is at the DevStg-Reqs bar today, so a DevStg-Tests promotion bites nobody until the bar rises - cheap to adopt now, real when it matters.
- (b) is a wording change in two byte-watched/capped shipped documents (`PROCESS.md`, `README.md`) - WI-477's sweep is the natural carrier and would execute it in the same pass as the H-06/H-07/H-08 corrections.
- NO SPINE COST under either option: nothing moves a status cell or mints a spine id. The allowlist under (a) is a declared list, subject to the standing never-green-by-list-edit rule.
- SEQUENCING under (a): the wi455 lane and WI-469 are re-authoring the contract cells the tests would pin - promotion should land BEHIND that re-authoring or the migration writes tests against contracts about to be rewritten."""
options = """- (a) PROMOTE MISSING TC CITATIONS TO ERRORS FROM DevStg-Tests ONWARD, WITH A TIME-BOUNDED MIGRATION ALLOWLIST seeded with the current 115. FOR: it makes the shipped prose true instead of retracting it; interfaces are where this strongly-coupled system most needs focused tests, and the planned decomposition program raises the stakes; the bar-scoped promotion means a requirements-stage repo pays nothing. AGAINST: 115 seams is a real backlog and an allowlist that never burns down is (d) wearing a field; the seams' contract cells are mid-rework, so early tests may pin doomed wording.

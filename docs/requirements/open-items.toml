WHAT IS NOW RULED, restated so no executor infers it from prose: (e) MEASURE, DO NOT REWRITE — a read-only classification pass over the 108 non-CLI `contract` rows, run at (b)'s tranche grain (non-CLI `Provides` first, then `Consumes`), each row a per-row review in WI-512's discipline, NO cell edited. The pass carries the two obligations the pre-ruling text names as conditions of (e) being better than (b) rather than worse: (1) the per-row verdicts are recorded DURABLY, as the follow-on pass's input, not as session notes; (2) at the pass's close, the relocation question — does the irreducible remainder move to a contract header / output-interface declaration on the owning component's side, or stay in the cell — is FILED as its own open item with the measured per-family numbers in its brief. The 5 ambiguous (d) tripwire findings are triaged inside tranche 1, not as a separate blocking row. Execution row: WI-516.

--- the pre-ruling recommendation, kept verbatim below ---

Driver's reading, shaped honestly rather than assumed: WI-512's own close said "(b) is worth running" and stopped there - a recommendation to run it, not a claim about how. That is the right level of confidence to carry into this brief: the trial (a) ran was a controlled one on a population picked FOR its uniformity, so 87.7%/12.3% is evidence (b) is worth trying, not a number to extrapolate onto 108 heterogeneous rows. (d) decline reads as premature given the owner's own framing of (a) as a trial for (b), and (c) hold has no real target - the 5 ambiguous (d) findings are already fully enumerated and do not grow or sharpen by waiting, so a hold buys no information (b) itself does not already generate.

Between (a) one campaign and (b) tranches: lean (b), scoped to natural row families (start with the non-CLI `Provides` rows, since those are structurally closer to the just-finished CLI `Provides` population, before the `Consumes` rows, which carry a different shape entirely) - because the CLI family's 40.7% keep-rate is a measurement over a UNIFORM population, and the honest way to find out whether it generalizes is to re-measure it on the next population rather than assume it and commit to all 108 rows in one pass. A tranche that comes back very different from 40.7% is itself information the owner should see before the rest of the registry is touched. Triage the 5 ambiguous (d) findings alongside the first tranche rather than gating on them first (folding (c)'s content into (b)'s start, not standing it up as its own blocking row).

RECOMMENDATION CHANGED 2026-08-24 TO (e), WITH (b)'s TRANCHE GRAIN, after the owner's raise widened the brief - recorded as a change rather than quietly rewritten, because the reasoning above is still the right reasoning about the question it was answering, and what moved is the QUESTION. Everything the paragraphs above say about (a), (c) and (d) stands. What (e) exposes is that the lean toward (b) was answering "at what grain do we edit?" while assuming an answer to "should we edit these cells at all, or move what is in them?" - and a recommendation that settles a question by assumption is the weaker artifact, whatever its grain.

WHY (e) RATHER THAN (b), in one line: (b) and (e) share the expensive half and differ on the cheap-but-committing one. Both must READ 108 rows with the same per-row care - that is where the judgement and the session time go. (b) additionally AUTHORS a thinned cell as it reads. On the ~59% of rows with nothing left over, that authoring is the same crossing statement under either future, so nothing is lost; but on the ~41% carrying a remainder, (b)'s author writes the remainder into the cell, which is exactly the prose a relocation ruling would lift back out. So (b)-then-relocate authors twice, and (e)-then-decide authors once, for the same reading. That asymmetry, not a doubt about (b)'s value, is what moves the recommendation.

TRANCHE THE MEASUREMENT ANYWAY: (e) should be run by row family, for (b)'s own reason - the CLI 40.7% is a measurement over a UNIFORM population and a per-family breakout is the only way to see whether it generalizes to a heterogeneous one. Start with the non-CLI `Provides` rows (structurally closest to the finished population), then `Consumes`. What changes from (b) is that a tranche's output is a recorded verdict set rather than a rewritten cell, so a surprising tranche pauses a MEASUREMENT rather than a program that has already edited a third of the registry.

THE STRONGEST CASE AGAINST THIS RECOMMENDATION, stated so a ruler can take it: (b)'s edit is mostly DURABLE under relocation. The crossing statement ("SR-006's obligation delivered as a CLI at check.py; crosses B-05") is a better cell than what it replaced whichever way the placement question is ruled, and it is the large majority of the change by character count - so the double-authoring (e) avoids applies only to the 12.3% remainder, and a ruler who reads that as small overhead against a full session's delay in removing 108 rows of restatement should take (b) and let the relocation question ride on the cells as thinned. That is a reasonable ruling and the disagreement is narrow. The reason the driver does not land there: the placement question is the one with a KIT-WIDE, every-adopter answer, and it is easier to ask honestly with a number in hand and an unedited registry than after 108 rows have been re-authored into the shape that presumes the answer.

TWO THINGS (e) MUST CARRY IF RULED, or it is worse than (b) rather than better: the per-row verdicts must be recorded durably enough to be the follow-on pass's INPUT (otherwise the second pass re-reads and (e) is a pure tax), and the follow-on relocation question must be FILED as its own item at (e)'s close rather than left implicit - a measured number with no row to rule on is how a deferred question becomes a forgotten one. Triage the 5 ambiguous (d) findings alongside the first tranche, unchanged from the reading above; that advice is independent of which option is taken."""

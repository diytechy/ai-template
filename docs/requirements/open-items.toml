title = """A dozen Approved spine rows name symbols that no longer exist, and no one may amend them mid-flight"""
status = "ruled"
ruled_date = "2026-08-22"
ruling_ref = "docs/log.d/2026-08-22-oi53-54-rule.md"
raised = "2026-08-21"
one_line = """rule how the batch of stale Approved LLR cells surfaced by the back-link campaign gets repaired - `LLR-175`'s `CodeSymbol` names `LaneState.note_session` where the live class is `RoutingState`, `LLR-011`'s names no real symbol for its `write` half, and the campaign skipped a further group (LLR-143/089/050/157/142/057/104/108/068 and LLR-172-adjacent) for the same reason: the tag is honest, the ROW is stale, and an Approved cell is the sitting's to amend, not a worker's"""
decision = """SURFACED BY A CAMPAIGN THAT WAS NOT LOOKING FOR IT. The back-link campaign wrote literal `Implements:` declarations onto 83 of 165 live LLR rows; the 2026-08-21 closing review then cross-checked every tag's ENCLOSING SYMBOL against its row's `CodeSymbol` and `Module` and read the rows behind all 14 mismatches. In every case the tag sits on a symbol that genuinely realises the row and the ROW is what has aged - a rename (`LaneState` -> `RoutingState`), a split, or a cell naming a function-local rather than a module-scope binding. Two were never banked at all (LLR-175, LLR-011); the rest were skipped by the campaign with the reason recorded.

WHY IT IS RULED RATHER THAN FIXED: the rows are `Approved`, and amending an Approved cell overrides an attestation the sitting made - the SR-006/LLR-060 precedent, held again twice in this program. `CodeSymbol` is a TRACED cell, so a correction does not arm the approved-snapshot drift detector; it is the ATTESTATION, not the machinery, that says a worker must not do it silently in the middle of unrelated work. The question is which repair instrument this batch gets: a sitting that amends them together, or a tracked repair row of the WI-482 class that does it under review."""
blast_radius = """Bounded and known: about a dozen `CodeSymbol` cells on Approved LLR rows, no requirement TEXT, no Status, no owner. Nothing mechanized fires on any of them today - `check_trajectory`'s symbol resolution is warn-first, and the back-link coverage figure (83/165) is computed from the DECLARATIONS in source, not from these cells, so the campaign's number is unaffected either way. The cost of leaving them is the one this repo keeps paying: a registry cell naming a symbol nobody can find teaches its reader to stop trusting the column, and the next author to grep `LaneState` finds a requirement instead of a class."""
options = """- (a) A BATCH AMENDMENT SITTING - the owner reads the dozen together and re-blesses them in one Status-change commit. FOR: one act, one review, the attestation stays intact and visible; the rows are all one KIND of defect, which is what a batch is for. AGAINST: it needs the owner's time on a set of cells that gate nothing today.
- (b) A TRACKED REPAIR ROW (the WI-482 class) - a WI that corrects the cells under the ordinary review round. FOR: it moves without a sitting, and the review round is a real check. AGAINST: it has a worker amending Approved cells, the precedent this repo has twice declined to set; if that is acceptable here it should be RULED so, not assumed by filing.
- (c) LEAVE THEM AND RECORD - the tags are honest, the rows are stale, and the discrepancy is now written down in the review round and this row. FOR: zero cost; nothing is enforced on them. AGAINST: the record ages into folklore, and the next campaign re-discovers the same dozen and re-banks them, which has already happened once.
- (d) MECHANIZE FIRST - promote the tag-vs-`CodeSymbol` cross-check the review ran by hand into `check_trajectory` (warn-first), so the population is measured continuously rather than by campaign. FOR: it answers "are there more?", which nobody can currently answer, and makes the burn-down visible. AGAINST: a new check on a warn-first surface that already carries several, and it repairs nothing on its own."""
recommendation = """RULED (owner, 2026-08-22): (b) + (d) as the updated recommendation stated — one tracked repair row for the batch (the CodeSymbol dozen + the seven WI-498 prose rows), ordinary review round, sanctioned by the DevStg-Needs dial; and the mechanized tag-vs-CodeSymbol cross-check as its own small warn-first row so the population is measured continuously. Review surface, per the owner's question: the repair lands as ONE commit whose spec Deliverable carries a per-row BEFORE/AFTER/EVIDENCE table (cell text old -> new, the code site that warrants it), the approved-snapshot machinery surfaces the amendments on the drift/re-attest brief as designed, and the owner reads the table at merge time (push=human). Execution: WI-501 (the repair), WI-502 (the cross-check).

UPDATE (2026-08-21, after the owner's dial change): the owner set `human_ratification_through = "DevStg-Needs"` — only the Needs tier is now human-held — which dissolves option (b)'s AGAINST: a worker amending SR/LLR/TC cells no longer bends any rule; it is the declared policy. The batch also GREW: the WI-498 close adds seven Approved rows whose design prose describes the deleted bar machinery (incl. SR-148's acceptance criterion in the retired 0-4 dial values). Recommendation accordingly moves to (b) — one tracked repair row covering the CodeSymbol dozen + the seven prose rows, ordinary review round — with (d) still its own small follow-up. Awaiting the owner's word.

The original recommendation, kept for the record:

(a) FOR THE DOZEN, with (d) as its own small row afterwards. The batch is one kind of defect found by one pass, and a sitting that re-blesses them together costs less owner attention than a repair row's review round would - while keeping the rule this repo has already declined to bend twice. (d) is worth filing separately because the honest answer to "is that all of them?" today is "that is what one reviewer found by reading 165 rows", and the next campaign should inherit a measurement rather than a memory. (b) is a legitimate answer if the owner judges `CodeSymbol` too mechanical a cell to be worth a sitting - it is a traced cell, and the drift detector agrees - but that is precisely the judgment being asked for."""
wi_refs = ["WI-501", "WI-502"]


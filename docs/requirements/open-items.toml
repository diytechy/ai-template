- downstream: none. The baseline is this repo's own snapshot; no adopting repo is affected."""
options = """- (a) STAND - accept the bytes as the approved baseline; WI-569 regenerates the snapshot at its own approval commit, re-sealing the same content, and records that the regeneration RE-SEALS the absorbed off-spine rows rather than re-reviewing them. FOR: the answer is within the declared authority, the queue moves at once, and nothing is foreclosed - any row can still be amended live later. AGAINST: signs off 132 changed / 30 added / 3 removed rows no human has read, on the strength of a merge that never presented them.

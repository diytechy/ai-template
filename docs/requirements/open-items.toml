[open_item.OI-35]
title = """Does the provenance rule reach a registry file's HEADER COMMENTS - 45 tokens sit outside every detector"""
status = "ruled"
raised = "2026-08-18"
ruled_date = "2026-08-18"
ruling_ref = "docs/log.d/2026-08-18-owner-rulings.md"
one_line = """RULED 2026-08-18: YES, THE RULE REACHES HEADERS - a registry header is a LIGHT FIELD GUIDE (what the field is, a very short why/how it is used) and carries no history reference at all; executed the same date over four headers, 59 tokens to 0"""
decision = """RULED (owner, 2026-08-18): YES - THE RULE REACHES REGISTRY HEADERS, and the ruling goes further than the brief's (a) by saying what a header should BE rather than only what it may not contain.

The owner's words, and they are the whole specification: headers should be "pretty light. They don't need to carry any history reference at all here, just what field and a very short why / how it's used."

SO THE STANDARD IS POSITIVE, NOT A FILTER. A registry header is a FIELD GUIDE: per field, what it is and a very short why or how it is used. No history, no ruling references, no dated stamps, no work-item ids, no narration of how the file got to be the way it is. That is a stricter and simpler test than "does this contain a provenance token", and it is one an author can apply while writing rather than after a detector complains.

EXECUTED THE SAME DATE, in the same change that records this ruling. The brief measured 45 tokens across three headers (stakeholder-needs 13, interfaces 17, external 15). Re-running the detector over EVERY registry header found a fourth the brief had not counted - `hats.toml`, 14 tokens - so the true population was 59. All four headers were rewritten as field guides; the detector now reports 0 over every registry header. `system-requirements.toml`, `low-level-requirements.toml`, `test-cases.toml`, `components.toml` and `open-items.toml` carry no header block at all and were untouched.

WHAT WAS PRESERVED, and each was checked before it was kept rather than assumed:

- `external.toml`'s SPENT IDS statement. It is history in FORM and a live re-mint guard in FUNCTION - `B-08` and `REL-004` are cited by id in ruled documents and `docs/id-watermark` does not protect them - so it survives, restated as a rule about the file's id space rather than as the story of how the ids were spent. This is the machinery carve-out the brief asked for, and it is stated in the ruling rather than left to a reviewer to notice.
- `stakeholder-needs.toml`'s `## Non-goals` section including `NG-1`. It is a DevStg-Reqs deliverable with NO OTHER HOME in the repo; it is normative scope, not history. Its citation of the review that first recorded it was dropped; the non-goal itself stays.
- Every FIELD statement: what `tags` is and the rule for applying one; what `owner`, `carried_by`, `req_refs`, `direction` and `status` mean on an IF row; the three-kinds-of-row shape and the `B-##` id naming in `external.toml`; `hats.toml`'s three required keys, its `applies_when` grammar, and its absence-is-opt-out / malformed-is-a-refusal contract.
- `hats.toml`'s standing instruction that the file is OWNER TEXT marked for the owner's edit at return. It is a live instruction, not a record of one.

WHAT WENT: the OI-18 dissolution paragraph opening the needs registry, the interfaces header's two-reason hold narrative and its retirement ledger, `external.toml`'s decision-by-decision status and flip-authority history, and `hats.toml`'s growth record - together with every `WI-###`, `OI-##`, `D-#`, sitting reference and dated stamp in all four.

NO ROW CELL WAS TOUCHED by this execution, no `status` moved, and no re-attest window opened.

The original brief follows.

THE RULE IS WRITTEN OVER CELLS AND THE DETECTOR CAN ONLY SEE CELLS. `PROCESS.md:107-118` states it as "No provenance in a living registry CELL - on any spine tier, in the normative cells and the reason cell alike". The detector matches that scope exactly, and does so structurally rather than by policy:

- `cite_advisories` (`trace_text.py:678-716`) iterates ROWS, and a row without a resolvable id is skipped at `:690` - a header comment has no id, so it can never enter the loop.
- The inner iteration is over a fixed declared column tuple (`PROVENANCE_ADVISORY_COLS`, `trace_text.py:595-600`; `OFF_SPINE_ADVISORY_COLS`, `:613-616`; `IF_REASON_CELLS`, `trace.py:1565`).
- Most decisively, THE COMMENTS ARE NOT IN THE DATA. Rows arrive through `spine_carrier.load`, which parses with `tomllib` (`spine_carrier.py:473, 504, 865`), and `tomllib` discards `#` comments at parse time. They are not at any key of any row dict.

So the exclusion is not a decision anyone recorded. It is a consequence of the carrier, and it has never been examined.

WHAT IS ACTUALLY SITTING THERE. Running the detector's own `provenance_tokens` over the header lines of every live registry, 2026-08-18:

| file | header block | history tokens |
|---|---|---|
| `docs/requirements/stakeholder-needs.toml` | lines 1-103 | 13 |
| `docs/requirements/interfaces.toml` | lines 1-105 | 17 |
| `docs/requirements/external.toml` | lines 1-94 | 15 |
| `system-requirements.toml`, `low-level-requirements.toml`, `test-cases.toml`, `components.toml` | no header block | 0 |

FORTY-FIVE TOKENS, none of them reported by anything. And the split is not random: the four files with NO header are exactly the four the sweeps have been run over; the three with headers are the three that were never in scope. The header/cell distinction is currently hiding a population comparable in size to the one that was swept.

THE SHARPEST FACT, and the one a ruler should weigh first: FOUR of the stakeholder-needs header's tokens are of the shape that GATES under `--strict` when it appears in a cell - `WI-454` (:47), `WI-467` (:79), and two `PROCESS.md` process-doc citations (:56). `provenance_findings` (`trace_text.py:525`) treats a work-item id or a citation of this document as class-1, exit-code-affecting. In the header they are invisible.

The OI-18 cluster is the worked instance, and it is the FIRST THING a reader sees on opening the needs registry (`stakeholder-needs.toml:45-50`):

    # (The Edge-case expectations section that stood here is GONE, not empty by
    # accident: the OI-18 dissolution (2026-08-13) demoted its rows to the
    # requirement tier, and the header prose it left behind was struck by WI-454
    # on sitting-2 §6 item 16's ruling - a declared-empty section heading with no
    # machinery behind it reads as a place to add rows, which is exactly what the
    # dissolution decided against.)

Read against the rule's own justification - a row "reads stand-alone to someone with none of your history" - that paragraph is the exact thing the rule forbids, positioned where it is read first. Read against the rule's own SCOPE, it is not a cell and the rule does not touch it. Both readings are correct today, which is why this needs ruling rather than sweeping.

THE COUNTER-CASE IS REAL AND SHOULD NOT BE UNDERSOLD. A header is not a specification; it is the file's own operating manual, and some of what it holds is load-bearing precisely BECAUSE it is historical - `external.toml`'s header carries the SPENT IDS block protecting `B-08`/`REL-004` from re-mint, which is a live safety mechanism written as history. A rule that swept headers indiscriminately would delete it."""
blast_radius = """THREE FILES AND ONE DETECTOR ARM - small mechanically, and larger than it looks in what it decides.

- Extending the rule means the detector reads raw file text for the header region, since `tomllib` never hands it over: a separate pre-parse scan, not a new column. That is a new code path in `trace_text`, not a widening of an existing loop - the one genuinely new mechanism any option here requires.
- The sweep itself is 45 tokens over three headers, all prose, no row touched, no `status` cell moved, NO RE-ATTEST WINDOW. It is the cheapest sweep of any provenance work done this month.
- SHIPPED SCOPE: `PROCESS.md`'s rule text is kit-owned, so extending it is a version bump and a RESYNC entry, and every adopter's registry headers come into scope. Adopters' headers are generally shorter (the shipped templates' headers are schema documentation, not history), so the migration cost downstream is small - but it is not zero and it is theirs to pay.
- DECLARING HEADERS OUT OF SCOPE also has a cost, and it is the interesting one: it creates a SANCTIONED HOME for provenance inside a living registry file. The next author who wants to record why a row changed has a legal place to put it, one line above the rows, and the rule's whole purpose - that the specification does not rot into a changelog - is reachable by moving text 40 lines up.
- WHAT MUST SURVIVE ANY RULING: `external.toml`'s SPENT IDS block. It is history in form and a live re-mint guard in function, and `docs/status.md` names it as the interim protection for the mis-seeded `B`/`REL` marks. Any extension needs an explicit carve-out for it, or it deletes a safety mechanism."""
options = """- (a) EXTEND THE RULE TO HEADER PROSE, warn-first, with a declared carve-out for machinery-in-the-header (the SPENT IDS block and anything like it). FOR: it applies the rule where the rule's own reason applies - a reader with none of your history meets the header FIRST, so an unresolvable `WI-454` or `sitting-2 §6 item 16` costs them more there than in a cell; it removes a 45-token blind spot that is comparable in size to the swept population; and it closes the loophole before anyone uses it, which is cheaper than closing it after. AGAINST: it needs a genuinely new code path (raw-text scanning, because the carrier strips comments), it risks deleting operating knowledge that has no other home, and it applies a rule designed for SPECIFICATION text to text that is explicitly ABOUT the specification - which is a different kind of writing with different obligations.
- (b) DECLARE HEADERS DOCUMENTATION-ABOUT-THE-REGISTRY AND OUT OF SCOPE, in the rule's own text rather than by silence. FOR: it is honest about what a header IS - the file's operating manual, whose readers are maintainers rather than requirement consumers - and a manual legitimately says "this section was removed and here is why", which a requirement may not; it costs nothing; and it makes the current situation a decision rather than an accident of `tomllib`. AGAINST: it sanctions a provenance home INSIDE a living registry file, forty lines above the cells the rule protects, and the rule then holds only against the least convenient place to write. It also leaves four gating-shape tokens permanently unreported in the file a DevStg-Reqs review leans on hardest.
- (c) A MIDDLE RULE - headers may carry provenance about the FILE (schema history, carrier migrations, spent ids) but not about individual ROWS; an `SN-nnn`/`WI-nnn` id in a header is a finding, a statement about the registry's own shape is not. FOR: it draws the line where the reasons actually differ - the OI-18 paragraph is about ROWS and belongs in the log, while the SPENT IDS block is about the FILE and belongs nowhere else; and it protects the machinery case by construction rather than by carve-out list. AGAINST: it is a subtler rule to state and a subtler one to detect (an id shape is checkable, "about the file rather than a row" is not), so its enforcement would be part mechanical and part reviewer, and a half-mechanized rule invites the same arguing-with-the-check the negative IF rules already attract."""
recommendation = """(a) EXTEND, WARN-FIRST, with the machinery carve-out stated in the rule itself rather than in an allow file.

The deciding argument is positional, not quantitative. The rule's stated purpose is that an artifact "reads stand-alone to someone with none of your history"; the header is the FIRST THING that reader meets. A rule that cleans 150 rows and leaves the front matter of the needs registry saying "struck by WI-454 on sitting-2 §6 item 16's ruling" has protected the part a stranger reads second and left the part they read first.

The `--strict` asymmetry makes it concrete rather than aesthetic. Four tokens in one header are of the shape that FAILS THE BUILD in a cell - two work-item ids and two citations of `PROCESS.md`. There is no reading of the rule under which the same token is a build failure at line 200 and unremarkable at line 47; one of those two severities is wrong, and the rule's own reasoning says which.

(c) IS THE STRONGEST OBJECTION and a ruler may prefer it. Its distinction is the true one - `external.toml`'s SPENT IDS block is history in form and a live guard in function, and no rule should delete it. The reason to fold that into (a) as a carve-out rather than making it the rule is enforceability: "no row id in a header" is a five-line check, while "about the file, not about a row" is a judgement, and this repo has a standing preference for a crisp mechanical rule plus a declared exception over a subtle rule nothing can police. If the sitting prefers (c)'s framing, take (a)'s mechanism and (c)'s wording - they are compatible.

(b) SHOULD BE REJECTED ON ITS CONSEQUENCE RATHER THAN ITS PREMISE. Its premise is right: a header is a different kind of writing. Its consequence is that the repo gains a legal, in-file, un-swept home for exactly the text the rule was written to remove, forty lines from the rows it protects - and the observed pattern is that provenance flows to wherever it is permitted. The rule survived three days before needing a widening; a declared loophole would not need three.

SCOPE THE EXECUTION TIGHTLY IF (a) IS RULED: 45 tokens, three files, prose only, no row and no `status` cell touched - and the SPENT IDS block explicitly excluded in the ruling's own words, not left to a reviewer to notice."""


one, which reads directly on the options: (A) keep-the-file preserves a fossil; (B) gate-on-round-files points the gate at the artifact the refactor actually evolved. A subsidiary question rides with the ruling: what makes a verdict GOVERNING — last round by commit time (today's hand convention; a re-run after a trivial edit can silently promote a stale APPROVE), or tree identity (a verdict names the tree it judged or does not count — stricter, needs no ordering rule). The plan's sections 2-5 name six further queue-blockers (close rituals, freshness definitions, the monotone-watermark revert, residue) as shapes awaiting rows once this is ruled, plus two policy items deliberately out of scope (the sample dial while the queue is slow; the goalpost-moving round class)."""

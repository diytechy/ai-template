[open_item.OI-21]
title = """The gate vocabulary retires ENTIRELY for an eight-rung stage ladder - direction ruled, four execution questions open"""
status = "pending"
raised = "2026-08-12"
one_line = """RULED 2026-08-12: every G* tag converts to stage semantics on a new eight-rung ladder (0 vision/needs .. 7 release-ready) - the tags die purposefully, because gate numbers will always be conflated with stage numbers; open for ruling: the string-vs-int carrier, the historical sweep's attestation carve-out, the sign-off successor shape, and the automation-dial keying"""
decision = """THIS ROW WAS A CONFIRMATION BRIEF AND THE ANSWER ARRIVED: the previous brief asked whether -retire gate semantics- meant keeping G1/G2/G3 as boundary names (the reading that shipped) or retiring the vocabulary entirely, and flagged -say so explicitly if the second was the intent.- The owner said so, 2026-08-12: all G* and G-Release tags are CONVERTED to stage semantics - traceability survives, the tags die, -very purposefully, because leaving them will always be conflated with stages, which have different numeric values.- The prior brief's confirm-the-shipped-reading recommendation is MOOT; what follows replaces it.

### The ruled ladder

- 0 - vision and stakeholder needs in work
- 1 - system boundary interfaces in work
- 2 - high-level system architecture in work
- 3 - system requirement definition in work
- 4 - LLR definition in work
- 5 - TC definition in work
- 6 - implementation in work
- 7 - all complete; release checklist and formal version tagging available

The owner adds: the ladder -would also correspond with the level of automation the user would approve-, and the stage identity could be a STRING rather than an integer (-more robust and more readable-). Historical documentation may be updated wholesale: -the meaning is the same, and if history is really desired git can be referenced-; leaving the archive unconverted is the alternative, at the cost of being -harder to read / compare.-

### What measurement says about tractability, 2026-08-12

- THE AXES ARE ALREADY DECOUPLED IN PRODUCTION, which is the fact that turns this from a rewrite into a migration: `derive_gate.stage_to_gate`'s own docstring states -Nothing derives the gate FROM the stage in production.- The gate is one 4-value enum plus its readers, renamed and re-pointed; the stage machinery already computes independently.
- The REAL edit surface is ~201 files carrying ~2,538 tags, out of 5,231 raw tags in 538 files - history and generated surfaces (okf, dashboards, report) fall away or regenerate free. Five files carry 502 of the tags: `derive_gate.py` (129), `check.py` (111), the registry-machinery reference (119), `PROCESS.md` (81), `PROCESS_OPTIONS.md` (62).
- SIX CONTRACT BREAKS, and they are the expensive part: (1) `check.py --gate {G1,G2,G3,all}` argparse choices - a downstream-visible CLI; (2) `docs/stack.ini [step:*] gates=` - a value adopters AUTHOR; (3) the WI `bar:` frontmatter enum, refused by two scripts; (4) the `[phase]-[gN]` WI-title archetype - 20 live anchors plus review-directory names; (5) the `docs/gate` basis-line format - precedent exists and is five days old: -field-compatible, not value-compatible-, one forced regenerate; (6) `LOG.template.md`'s Gate Sign-offs table, which ships downstream and has no obvious eight-rung successor.
- TESTS: 137 of 2,167 test functions carry a G-tag across 36 modules; 11 modules assert gate SEMANTICS (the min-fold, the window arithmetic, the per-gate step plans, the ratification matrix) and need genuine rewriting, not relabeling.
- THE WORD -gate- IS NOT THE TAG: ~3,400 word-occurrences, and whole modules (`test_env_gates`, `subagent_gate`, `check_perf`) use it in the unrelated sense of -a check that can fail.- The TAGS die; the word survives where it means that. A blanket find-replace would destroy working code - the sweep must be tag-scoped.

### ONE TAG, THREE READINGS - the ambiguity is worse than the stage-number conflation

The owner's stated reason for killing the tags is that gate numbers get conflated with stage numbers. Measured 2026-08-12, there is a SECOND ambiguity inside the gate axis alone, and it is the one that makes the current definition hard to hold in the head:

- APPROACHING, in `docs/gate` - the file's own header: -The value on the last line is the gate that must next be PASSED.- It is also the strictness selector, on the reasoning -you are held to the bar you are trying to clear.-
- PASSED, in the sign-off records - `## Gate Sign-offs` reads -G1 - Requirements/UX/Constraints | MET 2026-07-07- and the log carries -RATIFICATION - G3 - Human sign-off.- There the tag names a boundary already cleared.
- ALREADY-PASSED-BUT-STILL-HELD, at the top rung - `stage_to_gate`'s docstring: stage 5 -has already passed G3 ... so it stays held to the G3 bar rather than reporting a gate the harness does not know.- Neither of the first two readings.

THE TWO ARE LIVE AND CONTRADICTORY IN THIS REPO AT THIS MOMENT: `docs/gate` says `G1` (not yet cleared, drafting needs at `stage=0`) while the sign-off table says G1 MET 2026-07-07 (cleared five weeks ago). Both are correct under their own reading. A reader who knows only the tag cannot tell which is meant, and the owner - who wrote the model - reports forgetting which way it points.

That is an argument the ruling did not previously have: the tags are ambiguous WITHIN their own axis, not merely against the stage axis, so retiring them removes two conflations rather than one. It also sets an acceptance bar for the replacement - a rung name must be unambiguous about whether it describes a state or an event, which -stage 4, LLR definition in work- is (a state, always) and -G2- is not.

### WHERE THE LAYERS END - the recursion question, raised by the owner 2026-08-12

The ladder implies a recursion the owner spotted immediately: if stage 1 is boundary, 2 is architecture and 3 is component requirements, then stage 4's LLRs are -implicitly describing the architecture of a component- - so is that another whole level of boundary, architecture and requirements, and -where do the layers need to end-? The repo already answers this, in three parts that fit together.

- IT RECURSES IN SCOPE, NOT IN TIERS. `PROCESS_OPTIONS.md` section 10 (scale-ladder rung 2) rules it: -No new machinery, just partition the spine- - a multi-module repo is the SAME four tiers grouped by the `LLR.Module` and `SR.Area` columns that already exist, and -`IF-###` applies WITHIN a repo, too-, with the counterpart naming the other module. Going a level down adds a PARTITION and new seam rows, never tiers 5, 6, 7.
- THE TERMINATION CRITERION IS ALREADY MECHANIZED, and it is OI-20's rule: an LLR is discharged when a token in its `CodeSymbol` BINDS to a real symbol. That is the definition of the bottom, not bookkeeping - a requirement that still needs allocation to sub-parts is an SR for that sub-scope; one that binds to code is the floor. Ruling OI-20 therefore also rules where decomposition stops.
- TIER IS A ROLE, NOT A DEPTH. An SR is what a component must PROVIDE at its boundary (externally observable - the owner's own framing for `CompReqs`: -the outcomes of the system are really at the boundary level, and are strictly what the system must provide to accomplish the stakeholder requirements-). An LLR is how the inside is REALIZED, which is why it binds to code. Both roles exist at every scope, which is exactly why the spine partitions instead of deepening. Designing a component's internals PRODUCES LLR rows plus new IF rows where internal seams appear: the ACTIVITY recurses, the ARTIFACT TIER does not.

TWO CONSEQUENCES FOR THIS RULING:

- THE LADDER MUST NOT CARRY DEPTH, and the OWNER'S OWN TWO CANDIDATE LADDERS resolve here (2026-08-12): a fully depth-ambivalent ladder (Needs/Boundary/Architecture/LayerReqs/Tests/Implement/Release) versus a subcomponent-ambivalent one adding `SubArcitecture` and `SubCompReqs`. TAKE THE FIRST. The second contradicts machinery the kit already ships - `PartOf` makes depth a property of the COMPONENT TREE (membership is tagged at the finest enclosing CMP and coarser membership DERIVES), so adding sub-rungs would make depth a property of the REQUIREMENT TIER as well, which is two homes for one fact. It also fails on its own premise: if the sub-rungs recurse -in theory infinitely- then at depth 3 the name -Sub- is describing sub-sub work, and if they do not, depth is capped at two - which the Core evidence refutes outright, since its real chains run FIVE to SIX levels (platform, robot definition, assembly, part; and repo, package, node-plus-logic, class, method). A depth-bearing identifier (`DevStg-4.1-...`) additionally reintroduces the numbering hazard question (1) just eliminated, and makes -what stage is the project in- unanswerable when one branch is two deep and another four.
- WHAT THE SUB-RUNGS WERE REALLY BUYING is the owner's APPROVAL-BUBBLING concern - that a deep change re-engages the human - and it belongs on the dial, not in the rung names. Sub-rungs encode exactly ONE cut (system versus below) and cannot express -human through depth 2-. The bubbling exists because `human_holds` compares the PROJECT AGGREGATE stage to the dial level, so anything that drops the aggregate re-engages the human wherever it happened. Two fixes stack: key approval to the DEPTH AND TIER OF THE ARTIFACT TOUCHED rather than the aggregate, and carry depth as a derived companion (`stage-depth=5`) so a reader distinguishes a leaf refinement from a system-level rethink. Core's narrow-waist heuristic (6 or fewer interfaces per assembly) gives the natural granularity for where such a cut should fall. Depth is a structural property of the artifact tree; the ladder is a project-level progress axis entered once and exited once. Its exit criterion is not -N levels done- but -every leaf requirement binds to code, and every internal seam carries an interface row.-

- Nothing on the spine (LLR/TC) moves under either answer.
- The diff to read, named at file grain because the directory-wide form over-selects (it also lists low-level-requirements.toml): `git diff 6d3d9db4 551d1b2c -- docs/archive/last_approved/docs/requirements/interfaces.toml docs/archive/last_approved/docs/requirements/external.toml docs/archive/last_approved/docs/requirements/components.toml`."""

title = """The smoke tier runs AT its 60-second budget, and the commit bar treats a breach as green"""
status = "ruled"
ruled_date = "2026-08-21"
ruling_ref = "docs/log.d/2026-08-21-owner-rulings-oi48-52.md"
raised = "2026-08-21"
one_line = """rule what the 60 s smoke wall budget MEANS at the commit bar - the tier now runs at 0.9-1.1x of budget on the box that develops this repo, so 12 of the 17 wall times recorded in one day's log exceeded it while every one of those commits was described as green; the choice is to ENFORCE the seconds locally (a slow run fails the bar), REDEFINE 60 s as a CI target with the commit bar staying test-results-only, or RE-TIER the smoke set until the number is true again - the budget VALUE is not the question"""
decision = """THE MEASUREMENT FIRST, because the previous justification was seven times off and had never been re-driven. `scripts/check_smoke_budget.py` and `.github/workflows/test.yml` argued CI enforcement from "the re-tiered tier is startup-dominated - measured ~7.5 s at 24 cores ... so the 60 s budget keeps ~5x headroom, and a breach means the tier stopped being a smoke test, not runner noise". Re-measured 2026-08-21 on the same class of box, warm, `-n auto`, three runs: 59.59 / 59.07 / 59.98 s. The 2026-08-21 closing review measured 55.46 / 57.14 / 64.6; CLAUDE.md records 54.9 / 64.0 / 55.7; one day's grind log holds 17 readings of which 12 exceed 60 s, up to 142.9 under load. So the tier sits AT its budget, not at a fifth of it, and every premise of the old sentence is false. The prose has been corrected at both homes - that part needs no ruling.

WHAT NEEDS RULING is the protocol question the correction exposes. The session protocol states the seconds budget as part of the COMMIT BAR, and `python -m pytest -q -n auto -m smoke` does not measure time - so a worker reads "1296 passed" and reports green while the declared bar has failed. That happened repeatedly in one day, by workers following the protocol exactly as written. Either the bar means the seconds and something enforces them, or it does not and the protocol should say so."""
blast_radius = """Small in code, wide in habit. (a) makes a commit-bar step fail on a loaded machine - the failure mode every timing assertion has, and the reason this check ships `--mode warn` locally today. (b) leaves the local bar exactly as it is and moves one sentence in the session-protocol skill plus CLAUDE.md, at the cost of the repo declaring a budget that binds only in CI. (c) is real work with a real prize: the tier's membership has grown from about 900 tests to about 1,300 in a month, and re-tiering the subprocess-heavy modules that crept back is what would restore the headroom the original design had. No option moves the 60 s VALUE; both reviewers said explicitly that the number was not to move to fit the box it embarrasses."""
options = """- (a) ENFORCE LOCALLY - the commit-bar command becomes `check_smoke_budget.py --mode enforce`, or the protocol names it beside pytest. FOR: the bar means what it says, and a breach is caught where it is introduced. AGAINST: a timing assert on a developer machine is the flakiest kind of gate; a busy box reds an honest commit, which is how gates get bypassed.
- (b) REDEFINE 60 s AS A CI TARGET - the commit bar is test RESULTS; the seconds are a CI lane and a report. FOR: honest about what is actually enforced and where; costs one sentence in the session-protocol skill and one in CLAUDE.md. AGAINST: a budget nothing local enforces is a budget that drifts, and the membership ratchet (deterministic, machine-independent) becomes the only live sensor of tier growth.
- (c) RE-TIER UNTIL THE NUMBER IS TRUE - move the subprocess/scaffold-heavy modules that crept back into `conftest.SLOW_MODULES` and restore real headroom. FOR: fixes the cause rather than the reading; the tier goes back to answering "is it basically alive?". AGAINST: it is a work item, not a ruling, and it trades commit-bar coverage for speed - the trade the tiering doctrine already made once, with less left to give.
- (d) LEAVE IT - keep the words as they are now that the justification is corrected. FOR: nothing breaks; the corrected prose no longer over-claims. AGAINST: it leaves a stated commit bar that no worker can pass or fail deliberately, which is the shape that trained the "green smoke" habit in the first place."""
recommendation = """RULED (owner, 2026-08-21): (a) ENFORCE LOCALLY — with a tuning mandate that reorders this cell's recommendation. The smoke bar is TUNED so the tier passes within 60 s on EVERY dev machine (a faster box might pass in 30 s) — the budget is a worst-machine ceiling, not a this-box target, and its point is that smoke stays quick. The enabling work is the re-tier priced as (c); enforcement lands AFTER the tier fits again, or every honest commit on this box reds on day one. (b) is REJECTED: the bar means the seconds, locally. The budget VALUE stays unmoved, per both reviewers' shared constraint. Execution: WI-496.

The pre-ruling recommendation, kept for the record:

(b) THEN (c), and they are not in conflict: say what is actually enforced now, and file the re-tiering as work. The driver's reason for not recommending (a) is the one the check's own default already encodes - it ships `--mode warn` locally BECAUSE a wall-clock assert on an unknown machine is not a bar a person can act on. The reason for not recommending (d) is that this batch produced a day of commits described as green against a bar that had failed, by workers reading the protocol correctly; that is a protocol defect, not a discipline defect. The re-measurement is done and lives at `scripts/check_smoke_budget.py`; what is owed is the sentence about what the commit bar promises."""
wi_refs = ["WI-496"]


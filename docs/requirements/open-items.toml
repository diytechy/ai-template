### PART A-prime - the boundary rung: TAKE (A6)

Require the declared system boundary, WITH AN APPLIES-WHEN AND WARN-FIRST. The obligation is real - SRs are blessed today against a frame nobody declared - but (A5) hardens DevStg-Reqs for every adopter including those whose boundary is obvious, and (A7) is the status quo that produced a boundary declared only by accident. NOTE the OI-21 ladder narrows what is left to rule here: naming -system boundary interfaces- as its own stage makes the ORDERING obligation ladder-borne for every project, so A5/A6/A7 now decides only the ENFORCEMENT half - what the harness requires before the next rung, and for whom.

### Guards on Part A

- The scorer's job is to make the trade VISIBLE - here are the candidate partitions, here is what each costs in cross-boundary interfaces, here is which behaviours straddle a boundary under each - and the owner's job is to name the components and decide which boundaries are worth their crossings.
- EXPECT REWORK AND SIZE IT BEFORE COMMITTING. The delta between the derived partition and today's tree is the rework list; the owner has accepted rework in principle, but the shortlist should carry its cost so the acceptance is informed rather than nominal.
- The metric optimises COUPLING, not VOLATILITY: it cannot see that two modules co-occurring today will diverge tomorrow, which is the Parnas criterion and the one that most often decides whether a partition survives. Treat a top-ranked partition as a candidate, never a verdict.
- Confirm the containment rule actually covers the rows `cross_component_findings` is vacuous for, rather than reading its zero as full coverage.
- RULE `SR.Area` EXPLICITLY, not by omission - the sitting can take A3 and never answer it, and the decision cell's measurement (31 authored values, report-only, gating nothing, 6 of 31 spanning several components) deserves a verdict: either `Area` DERIVES from `Component` or it RETIRES. A ruling that leaves it authored-and-unread ratifies the third unpinned axis.

### The enforcement Part B needs

The honest answer to -I'm not sure of the best way to enforce this mechanically-: whether a sentence is a specification or a story cannot be mechanized, because no check reads intent. What CAN be built, and would have caught every drift the census measured:

- the schema tier proper - required fields; closed vocabularies for `Stability`, for `Status`, and for the new discrete-vs-variable type; a refusal when a component boundary has an uncovered crossing;
- refuse a work-item id in `Contract` (would fire on 24 percent of rows today);
- refuse a `repo-lock D-n` citation (14 rows);
- warn on a rationale connective such as -because- or -rather than- (18 percent - 20 rows; 24 rows if -so that- and -since- join the list);
- warn above a length ceiling (34 rows exceed 500 characters).

Those four negative rules are cheap and stdlib, and they encode the owner's own general rule that history belongs in the archive rather than in a live cell. They do not decide whether a cell is a good interface definition; they make it impossible for it to be a changelog, which is the actual observed failure.

THREE THINGS THAT DO NOT WAIT ON ANY OF IT:

- the planning-brief surface hands a model both the unconstrained `Contract` cell and the undeclared `Status` column as though each were authority - state that consumption in the declaration rather than leaving it to be rediscovered, since it is the one place a mixed cell costs behaviour rather than tidiness;
- D-9 parked IF's `Status` question here - rule it in the same pass, because `Stable` currently appears in both `Status` and `Stability` on the same row meaning different things, and no vocabulary check exists to notice;
- the `cross_component_findings` OVERLAP-SUPPRESSION fail-open (measured in the decision cell: authoring more component tags monotonically SILENCES the check, 17 of 97 edges suppressed via a multi-tagged endpoint) - fixing the DIRECTION of that rule (report the overlap as its own advisory instead of suppressing on it) presumes no particular partition, so it lands now, not with part A."""


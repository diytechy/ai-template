### Q4 - conventions and threshold

- (4a) KEEP THE PROTOTYPE'S CONVENTIONS (match = one increment; comprehension conditions nest) AT THRESHOLD 15. FOR: match follows the spec's own text; nested comprehension filters are exactly the deeply-nested-not-widely-branched shape this axis exists to catch; 15 is the published default and needs no local justification; the two on-15 C901 drops are not over the bar and should not be pretended to be. AGAINST: 33 more seeded rows than the reference-package convention; a reader comparing against `cognitive_complexity` output sees 10.5% of functions score differently.
- (4b) FOLLOW THE REFERENCE PACKAGE ON COMPREHENSIONS (no nesting increment), threshold 15. FOR: seed drops to 166; numbers match a tool people may run independently. AGAINST: the package is itself wrong against the spec on the `elif` ladder (scores 9 where spec arithmetic gives 8, pinned by a prototype test), so agreement with it is not agreement with the spec.
- (4c) (4a) at threshold 14, so the C901 baseline carries over 45/47. FOR: a smoother hand-off from the ruff ratchet. AGAINST: a non-default threshold is a number to defend forever, for two functions."""

recommendation = """(1a) RETIRE, (2a) INCLUDE `tests/`, (3a) ARMED HERE, (4a) THE PROTOTYPE'S CONVENTIONS AT 15. The first three answers are one position and the reasoning is shared; the fourth is a spec-fidelity call and is stated last.


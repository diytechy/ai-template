THE STANDING FACTS THIS BRIEF DOES NOT REOPEN. Rule 3 of the prompts README: a judge must not carry its own prior verdicts on the artifact it judges (the anchoring evidence is in the study's section 1). SN-016's no-wedge invariant, the walk-away timeout and IF-064's contract are untouched by the layer by construction - no open stdin, no server, no heartbeat process. The measured fact that makes the layer cheap: resume-by-id is cost-equivalent to a standing process under the one-hour prompt cache; the only thing a standing process would buy is about 4.5 s of spawn and replay per request.

THE FIVE QUESTIONS.

### (a) - Does this reverse the no-daemon doctrine?

The plan's own step 2 asks for a "reversal of the 2026-07-09 no persistent actor ruling". Read against the record (docs/archive/AGENT_ROLES.md: "there is no daemon - every session starts"; the archived improvement plan: "not a long-lived coordinator ... bus / daemon"), the layer reverses nothing: what it retains is a transcript on disk that the next bounded process replays, not a resident actor. The question is whether the owner reads it the same way.

### (b) - The rule-3 residual

With the dial on and `reset_on_same_artifact = false`, the retained session WILL hold its prior verdict on an item it judges again after a worker round-trip (judge -> worker acts -> worker returns -> judge again). That continuity is the owner's stated purpose for the layer; it is also the anchoring shape rule 3 exists to prevent, measured on the disposition -> successor chain (WI-418). `true` restores the strict posture at the cost of the continuity; the fork-per-verdict hardening in the study is the way to have both, and it is not built.

### (c) - Keep-warm across the blackout

`keepwarm_minutes` (ANTHROPIC only) pings a retained session to hold the one-hour cache while the queue is non-empty; a ping costs about a tenth of a cold rewrite, so pinging every ~50 minutes pays for gaps up to ~20 hours. A blackout window is a gap the dial cannot see; the review (finding 17) named the boundary semantics as an owner ruling.

### (d) - Where the dial lives

`docs/process.toml [adjudicator]` (process policy, beside the approval and push dials) or `docs/stack.ini [agent-loop]` (toolchain). The plan chose process.toml on that file's own rule - the dial changes what the process DOES, not what tools it runs.

### (e) - Dedicated homes

Whether the orchestrator's CLIs run under their own config homes (`CODEX_HOME`, `CLAUDE_CONFIG_DIR`; opencode's equivalent unverified) so retained transcripts, which carry repository content, are isolated from the owner's interactive sessions and can be retained, sized and deleted on a policy.


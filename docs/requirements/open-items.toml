decision = """RULED ADDENDUM (owner, 2026-08-13): the INVERSION IS CONFIRMED - option (a). Shared helpers live in the shipped common module, `bootstrap.py` imports FROM it, the common module joins `MAPPING`, and the replacing rule - bootstrap imports the common module and nothing else - lands as an assertion, with a real scaffold bootstrap in the execution WI. Sequenced after OI-14 part A, carrying the OI-27 migration-row obligation recorded below.

RULED by the owner 2026-08-12, in three steps: (1) keep all necessary dependencies for `bootstrap.py` contained; (2) import modules from `bootstrap.py` where applicable; (3) put all other common or reusable chunks into a single common file, or several themed library files, so the result is the smallest amount of code across the board.

The owner also corrected the reasoning this brief had used against a single large module: big files are not inherently a problem, and the monolith risk was always about FUNCTION size and complexity, not file length. That correction is accepted and has a consequence of its own, in the last bullet below.

### The one thing still owed - step 2 inverts, or every scaffold breaks

Measured 2026-08-12, and it is a blocker rather than a quibble:

- `bootstrap.py` is NOT in `bootstrap.MAPPING`, so it is not copied into an adopting repo. Its own test says so: -the scaffolder itself is not shipped.-
- So a shipped script that did `import bootstrap` would raise `ModuleNotFoundError` on a fresh scaffold, while passing here, where the kit folder holds every file.
- PROBED, not argued: inserting `import bootstrap` into `trace.py` makes `test_every_sibling_imported_module_is_shipped_by_mapping` fail with -shipped script(s) import a sibling MAPPING omits: bootstrap.py <- trace.py-. The repo's own guard already refuses step 2.
- That guard exists because this is the EXACT failure the repo has shipped once: `MAPPING` omitted `schedule.py`, and every fresh scaffold died on its first claim while this repo stayed green.
- Meanwhile the premise for keeping bootstrap standalone is weaker than its own comment claims. The comment says it -runs from a bare download before anything else exists-, but the documented path is `python project-trajectory/scripts/bootstrap.py --dest <repo>`, run from INSIDE the kit, where all 55 siblings are present. bootstrap can import; it just cannot be imported.

So the direction the owner wants - one home per helper, smallest total code - is reachable by INVERTING step 2: the shared helpers live in the common module (which ships, like every other sibling), and `bootstrap.py` imports FROM it. Same de-duplication, no downstream break.


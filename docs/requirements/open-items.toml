recommendation = """B with C as the attestation and a GENERATED per-WI rollup for the human (declared in [generated] with a regenerator and a --check, never trusted by the gate) — the plan's own recommendation, unchanged by this filing. On the sub-question, tree-identity: it dissolves the staleness comparison instead of adjudicating it, and the stricter reading fails closed. Nothing changes about who approves — only which artifact carries the verdict and who may author it. After the ruling: file the section-1 build row and the six section-2 shapes as their own rows off the frontier."""


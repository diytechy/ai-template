channel = "call"
contract = """the dispatcher's lane-mechanics seam: the admitted lane table calls lane.ensure_worktree/spawn_worker/spawn_refresh to run one claimed branch's worker session and the station refresh as their own subprocesses, then reads back only the tree-derived signal (specs moved out of active/<branch>/) plus each subprocess's exit code - no state file, no back-channel. dispatch.py decides what an exit or a red refresh MEANS; lane.py only runs and reports."""
owner = "scripts/lane"
version = "v1"
status = "Drafted"
component = "CMP-008"
notes = """A program-close connectivity mint: the seam was already load-bearing (the extraction that split it out is what the design's §A4.2 describes) but carried no IF row of its own, and lane.py's own docstring says so rather than paper over the drift by declaring it from the extracted half."""


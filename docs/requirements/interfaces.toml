# docs/requirements/interfaces.toml — INTERFACE DEFINITIONS, the kit's own.
#
# ONE ROW IS ONE OWNER, ITS CONSUMERS, AND A TYPED STATEMENT OF THE INFORMATION
# (OI-67 ruled (a), 2026-08-29). An interface says what the information plugs
# into, who it serves, and what the data is — and nothing else. A request and
# its answer are two rows. A module that reads one file and writes another is
# two rows. A crossing of the SYSTEM boundary is not a row here: those live in
# `docs/requirements/external.toml`, and a row here ties BACK to one only when
# it realizes a crossing. Everything else is an internal seam.
#
# THE FIELDS — what each one is, and how it is used.
#
#   owner            REQUIRED. The providing THING — the thing the information
#                    plugs into — in the ONE spelling `consumers` uses: a module
#                    path (`scripts/check`), a file or directory path
#                    (`docs/stack.ini`, `docs/work/`), or an `external:` party
#                    (`external:git`). NEVER a requirement or design id: the
#                    requirement this seam answers to is REACHED through the
#                    owner — the design rows whose `module` names it, or the
#                    `Implements:` line in its header — and is not stated on the
#                    row. `trace.py` fails a row whose owner is id-shaped or
#                    names several things, and WARNS (never gates) on a
#                    module-shaped owner that reaches no requirement either way.
#                    A file- or directory-owned seam legitimately has no design
#                    row; 31 rows are owned that way today.
#
#                    A GENERATED FILE IS OWNED BY THE MODULE THAT WRITES IT —
#                    the writer is the one home a check can hold to the code;
#                    a hand-edited file (a registry, `stack.ini`, `process.toml`)
#                    is owned as itself and declares in its own header.
#
#   requestors /     THE FAR SIDE NAMES THE DIRECTION. Exactly ONE of the two
#   consumers        is set, a LIST either way. `requestors` are the sides that
#                    put information INTO the surface the owner defines — they
#                    call the function, invoke the CLI, set the env var, write
#                    the file. `consumers` are the sides that take what the
#                    owner emits — they read the file, the exit code, the
#                    stdout. The owner DEFINES the surface in both cases; the
#                    key says which way the information runs, so one row is one
#                    direction by construction. A row naming both or neither is
#                    a `trace.py` finding. Name the sides you have MEASURED, and
#                    an open-ended class as `external:<class>`. Every endpoint
#                    cell is validated against the tree, warn-first. THE SEEDED
#                    CHOICE ON THIS TREE FOLLOWS THE CHANNEL (`cli`, `env` and
#                    `call` rows name requestors; the rest name consumers) and
#                    is confirmed row by row as the definitions move.
#
#   channel          REQUIRED, CLOSED (`kitlib.spine.IF_CHANNELS`): what
#                    crosses, typed —
#                      cli        an invocation surface: argv flags and arguments
#                      exit-code  a finite code alphabet a process returns
#                      stdout     text a process emits: findings, a report
#                      file       a file or directory medium with a schema
#                      call       an in-process API another module imports
#                      env        an environment variable or launcher slot
#                      git        repository state: refs, trailers, a staged diff
#                      bytes      opaque content: fetched sources, a vendored tree
#                    A dial read from a config file is `file` (the medium is the
#                    file; `data` names the key). A source tree walked by AST is
#                    `file`. THE SEEDED VALUES ON THIS TREE ARE A CLASSIFICATION,
#                    NOT A READING: every row's channel was seeded mechanically
#                    from a per-row read on 2026-08-29 and is confirmed row by
#                    row as the definitions move (below).
#
#   data             OPTIONAL — the finite alphabet when there is one
#                    (`0 pass · 1 fail · 2 usage`, `off | ask | deny`) or a
#                    one-clause schema pointer. Ceiling 160 characters; no
#                    work-item id, no decision citation, no rationale
#                    connective; a named symbol or path must resolve
#                    (warn-first, `trace.py`). It is the row's typed summary,
#                    not the definition.
#
#   THE DEFINITION LIVES BESIDE THE CODE. What the owner promises — the flags,
#   the schema, the guarantees — is the `Contract IF-###:` body under the
#   owner's `Contracts:` marker (a module docstring, or a `#` header at the top
#   of a registry, config or hook file), harvested into
#   `docs/interface-reference.md` under a freshness gate. It is stated ONCE,
#   there; a row points at it by declaring the seam and stops.
#
#   contract         LEGACY, on its way out: the prose definition the cell held
#                    before OI-67. Every row still carrying one is counted by
#                    `trace.py` (one summarizing warning), its content moves into
#                    the owner's `Contract IF-###:` body row by row, and the
#                    arming slice turns the cell into a schema finding. Do NOT
#                    author into it.
#
#   rationale        OPTIONAL — WHY the seam is drawn HERE: what breaks without
#                    it, which alternative lost. A reason cell like `notes` — it
#                    takes the ARGUMENT, never the CITATION: no work-item id,
#                    ruling, review-round or open-item reference, decision id,
#                    edit verb or date stamp; that history belongs in the log
#                    (process.md §3). `trace.py`'s IF citation-frame arm reads
#                    it, warn-first. An EMPTY string is a hard carrier refusal:
#                    a row either carries the key or omits it.
#
#   verified_by      OPTIONAL, and an EMPTY cell is the ordinary answer: this
#                    seam is verified in its own right. Filled, it names the
#                    parent whose tests cover a low-level seam — a `TC-###` or
#                    an `LLR-###`. Warn-first that the pointer resolves; nothing
#                    reads whether the named test really exercises the seam.
#
#   carried_by       OPTIONAL interface composition: a constituent naming the
#                    bundle that carries it (`carried_by = "IF-###"`). A
#                    constituent is still one owner and one channel; the bundle
#                    is the unit a consumer pins. The carriage graph must
#                    resolve and be acyclic; depth past 2 warns.
#
#   version          The contract's own version string, this row's to set.
#
#   status           The ONE maturity field, the spine's words: `Drafted` |
#                    `Approved`, shared with `external.toml`. `Founded` is NOT
#                    APPLICABLE here — it means settled AND demonstrated, while
#                    an approval says the seam is AGREED.
#
#                    FLIP AUTHORITY IS DERIVED, NOT DECLARED: a `status` cell
#                    here may be machine-flipped only when this registry's stage
#                    rung — DevStg-Arch — is not human-held under the
#                    `[attestation] human_approval_through` dial; the predicate
#                    is `agent_common.human_approves(docs, "interfaces")`. READ
#                    THE DIAL, DO NOT ASSUME IT: this repo runs `DevStg-Needs`-
#                    held only, so the predicate answers FALSE here. What keeps
#                    the cells the owner's today is that the kit ships NO
#                    automated writer for an off-spine `status` — they are
#                    hand-edited, in a reviewed Status-change commit. Every live
#                    row reads `Drafted`: a deliberate non-claim, not a backlog.
#
#   interface_from_external / interface_to_external
#                    OPTIONAL and directional — `"B-##"`, naming the boundary
#                    crossing in `external.toml` this row REALIZES: `_from_` for
#                    a crossing that comes in, `_to_` for one that goes out. A
#                    row with neither key is an internal seam, and that ABSENCE
#                    is the statement.
#
#                    ONE CROSSING IS DELIBERATELY REALIZED BY NOTHING: `B-02`
#                    (authority in — rulings, attestations and Status flips)
#                    has no port of its own. Authority enters as CONTENT on
#                    B-01's write path: a human edits a Status cell and commits,
#                    and the hook floor admits that write as it admits any
#                    other. The condition that changes the answer is concrete —
#                    when the recorder requiring an acceptance to be stamped on
#                    the accepted artifact's own row ships (`SR-140`), its
#                    contract IS an admission surface for authority. Until then
#                    `trace.py`'s advisory naming B-02 unrealized reports a
#                    deliberate state.
#
#   component        OPTIONAL — the `CMP-###` this seam belongs to.
#
#   notes            OPTIONAL free prose about the row. A reason cell: argument,
#                    never citation. Honesty valve — the word `source` (produces
#                    output, consumes nothing declared) or `sink` (consumes,
#                    produces nothing) silences the missing-seam coverage
#                    warning: `source` marks the row's OWNER, `sink` marks its
#                    far side.
#
#   ONE ROW, ONE KIND — the discipline the shape asks for and the tree does not
#   yet meet: 14 rows still describe a request and its answer, or a read and a
#   write, together, and 35 bundle several kinds (a CLI plus the file it writes;
#   ten registries read as one). They split, or declare once with constituents
#   on `carried_by`, as the definitions move.


component = "CMP-008"
notes = """The seam exists because two callers ask ONE question from two sides - the merge slot's may-this-merge and the loop's does-this-lane-still-owe-a-round - and answering it twice is what let a lane draw two identical rounds over a verdict nothing had invalidated. So this row is not bookkeeping over an import: it is the declaration that there is exactly one definition, and a second reader of round evidence anywhere else is a finding against this row rather than a new one. That definition includes the REV the identity is measured at, which is why the refresh peel is owned here and not by the merge slot: while it lived there, one reader peeled and the other measured at HEAD, and the row's whole claim was false across exactly one commit class. The peel has TWO shapes on purpose and they must not be merged: work_tip peels only a refresh sitting on the tip because it feeds a reset --hard where one commit too far destroys work, while governing_rev walks through any commit whose non-record identity equals its first parent's, to reach a refresh it would otherwise hide - a read-only question can afford an answer a destructive one cannot. That step condition is the row's own sentence rather than a proxy for it, so no commit SHAPE gets a case here: a walk that classified the paths a commit touched stopped at the zero-path ones it could not read, and the empty commit an attestation rides when its bookkeeping is unchanged is that shape, so the commit recording an approval buried the refresh. The singularity binds the BINDINGS too, not only the two named readers: the identity a round file's reviewed sha names and the identity an attestation's carrier names are asked through governing_identity at that commit, because a raw fold is this composition with the peel dropped and it disagrees across exactly the commit class the peel exists for - which is how a round drawn after a refresh became invisible to both readers at once, with nothing on the branch able to reconcile them. The rollup generator is a requestor for the NAME grammar only. Off git every function answers None and this module never says what that means; each requestor declares its own direction, and both declared directions are toward more review."""


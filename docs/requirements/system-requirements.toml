[requirement.SR-040]
title = "Per-phase routing and review dial"
sn_refs = ["SN-006", "SN-016"]
requirement = """The unattended coordinator shall select the agent command template per
in-process session phase (PLAN/BUILD/REVIEW-A/REVIEW-B/DESIGN-CHECK/CRITIQUE -
the coordinator's own activity; the retired docs/run-phase file, deleted by
SR-059, is not an input) via AGENT_CMD_MAP/--cmd-map, falling back to the single
AGENT_CMD.
It shall surface the declared reviewer dial (docs/process.toml [policies]
review_rounds, default 1; the legacy docs/review-policy is still read through
the migration window) at run start without enforcing it.
It shall warn (never block) when a lane resume surface exceeds the declared size
threshold."""
rationale = """Realizes SN-006 and SN-016 — two samples of one model share blind spots, so a review by the family that built the change agrees with it for the wrong reasons; cross-family routing is what makes the second opinion independent, and one model for every phase was rejected on that basis. Dispatch stays keyed off the in-process session phase because the alternative, a per-phase code branch, makes adding a phase a code change and so discourages adding one. The resume surface's growth tripwire warns rather than fails because a growing resume surface is a smell and not a defect, and failing on a smell trains an operator to bypass the check."""
acceptance_criteria = """A mapped session phase invokes its own command template and the default template does not fire; a broken map entry fails preflight before iteration 1; the banner surfaces the reviewer dial from docs/process.toml [policies] review_rounds; an oversized status.md warns on stderr while the run proceeds; AGENT_STATUS_WARN_BYTES=0 silences."""
priority = "M"
verification = "Test"
status = "Modified"
phase = 1
area = "Unattended loop"

[requirement.SR-041]
title = "Doc reference validation"
sn_refs = ["SN-008", "SN-010"]
requirement = """check_doc_refs.py shall flag a documentation reference to a repository path that does not exist and an asserted sym:<module>.<name> reference missing from the generated module-map inventory, warn-first (exit 0) with --strict gating; absent inventory skips the symbol tier cleanly."""
rationale = """Realizes SN-004 and SN-008 — link resolution sees a broken link but not prose naming a file that was renamed away, nor an asserted code symbol that no longer exists; both read as correct forever. Validating every backticked word was rejected as unaffordable in false positives, so only path-shaped tokens and an explicit sym: convention are checked, generated marker blocks are exempt, and a path-ok line is the escape hatch for prose that names a path deliberately absent from the tree."""
acceptance_criteria = """A backticked repo path that does not exist warns and gates only under --strict; URLs, globs, placeholders, generated blocks and path-ok lines are ignored; a dangling sym: reference is flagged against the module map; with no inventory the symbol tier skips and the path tier still runs."""
priority = "S"
verification = "Test"
status = "Verified"
phase = 1
area = "Doc currency"

[requirement.SR-042]
title = "OKF knowledge-bundle export"
sn_refs = ["SN-010", "SN-012"]
requirement = """gen_okf.py shall export the spine registries AND the key process docs as a
generated Open Knowledge Format bundle under docs/okf:
one typed markdown concept per real row (graph as resolvable markdown links,
per-tier indexes);
plus a Process Guide concept per present process doc (a summary derived from
that doc and a resource pointer to the unmodified source).
The bundle shall be deterministic (no clocks), with --check failing on any
stale, missing or extra bundle file; docs/okf-export off silences and
placeholder-only registries are vacuous."""
rationale = """Realizes SN-010 and SN-012 — traceability and process knowledge held only in this repo's own formats cannot be read by anything else, so the knowledge is trapped in the tool that produced it. The export is emit-only and stdlib-only, adding no runtime dependency and no parser: introducing a parser was rejected because reading the format back would make the bundle a second source of truth that can drift from the registries, whereas a derived bundle can only be STALE, which --check detects. Leaving the source docs untouched keeps the export non-intrusive, and the dashboard's Knowledge tab (SR-038) is its first consumer, so the bundle has a reader rather than being written for nobody."""
acceptance_criteria = """One frontmatter-typed file per real SN/SR/LLR/TC row whose graph links resolve; a Process Guide concept for each present process doc carrying a summary derived from the doc (not hand-authored) with the source left unmodified; regeneration is byte-identical; --check trips on a registry OR doc edit, a missing bundle and a hand-added file; the write mode prunes extras; off and placeholder-only registries pass silently, and process guides emit only alongside a real spine."""
priority = "M"
verification = "Test"
status = "Modified"
phase = 1
area = "Knowledge export"

[requirement.SR-043]
title = "Subagent spawn gate"
sn_refs = ["SN-006", "SN-012"]
requirement = """A PreToolUse subagent-spawn gate shall, during an unattended run, refuse or defer subagent spawns per docs/subagent-gate (off|ask|deny; absent=off), honor a launcher-set SUBAGENT_GATE=allow override the model cannot set, and fail open on any error so a broken gate never wedges the tools."""
rationale = """Realizes SN-006 (a walk-away run stays safe — bounded, supervised fan-out with the override held by the human, not the model) and SN-012 (opt-in: absent/off is a vacuous allow, so a non-adopter pays nothing). Supervision, not security — a model that can edit files can remove the hook (adapted from stop-subagent-fanout, MIT; spec docs/archive/INTEGRATION_PLAN.md Phase 4)."""
acceptance_criteria = """With docs/subagent-gate: deny a Task/Agent spawn is refused (permissionDecision=deny, exit 2); ask defers to approval; off/absent and SUBAGENT_GATE=allow allow it; a non-spawn tool is not gated; a malformed payload fails open (allow) and is logged."""
priority = "S"
verification = "Test"
status = "Verified"
phase = 1
area = "Unattended coordinator"


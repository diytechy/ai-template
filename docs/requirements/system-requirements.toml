[requirement.SR-052]
title = "Dashboard accessibility (rubric-adjudicated)"
sn_refs = ["SN-024", "SN-023"]
requirement = """PROJECT_STATE.html shall be operable and readable without a pointer or full color perception: every interactive element (tabs, expandable blocks, SVG nodes with detail panels) is keyboard-reachable and carries an accessible name (title/aria/visible text); no information is encoded by color alone (status/phase/type encodings carry a text or shape cue); text keeps readable contrast against its fill."""
rationale = """Realizes SN-024 and SN-023 — perceptual accessibility has no crisp measurable interface, so a row claiming a mechanized verification would assert a green that nothing actually checks. Acceptance is adjudicated by an independent critical eye against a written rubric instead. Leaving the bar unstated was rejected: an unstated accessibility bar silently reads as no bar at all."""
acceptance_criteria = """A fresh family-heterogeneous CRITIQUE session judging the generated dashboard against docs/rubrics/dashboard-accessibility.md (authored at [v3]-[g2] from this SR's intent) returns APPROVE citing numbered anchors; keyboard reachability, accessible names, color-independent encoding, and contrast are each a rubric anchor."""
priority = "C"
verification = "Test"
status = "Verified"
phase = 3
area = "Trajectory"

[requirement.SR-053]
title = "Dashboard UI uniformity (rubric-adjudicated)"
sn_refs = ["SN-024", "SN-023"]
requirement = """PROJECT_STATE.html shall read as one system across its tabs and views: one type scale and spacing rhythm; one status/phase/type color vocabulary applied consistently wherever the same concept renders; uniform node, edge, legend, and detail-panel styling across the SVG emitters; the same interaction idiom (expand, hover, detail) wherever the same structure appears."""
rationale = """Realizes SN-024 and SN-023 — how alike is alike enough is subjective at the margins, so cross-view coherence cannot be pinned to a threshold without pinning the wrong thing. It is adjudicated against a written rubric by an independent session rather than by the authoring build, because the build and its author share the assumptions that produced the output: a self-judged view is checked against the intent that made it, not against a reader meeting it cold."""
acceptance_criteria = """A fresh family-heterogeneous CRITIQUE session judging the generated dashboard against docs/rubrics/dashboard-uniformity.md (authored at [v3]-[g2]) returns APPROVE citing numbered anchors; type scale, color vocabulary, per-emitter node/edge/legend styling, and interaction-idiom consistency are each a rubric anchor."""
priority = "C"
verification = "Test"
status = "Verified"
phase = 3
area = "Trajectory"

[requirement.SR-054]
title = "Dashboard usability (rubric-adjudicated)"
sn_refs = ["SN-024", "SN-023"]
requirement = """PROJECT_STATE.html shall support its core reading tasks with low friction: a first-time reviewer finds the project state, the next work, and how the parts connect, each within one tab switch; views default to a legible density (start-collapsed per the greater-than-3 rule) and reveal detail without losing context; labels stay readable at default zoom with no clipped or overlapping text."""
rationale = """Realizes SN-024 and SN-023 — task-level usability is perceptual (is this findable, is this legible), so a test can confirm an element exists and not that a reader can use it. Acceptance is adjudicated against a written rubric derived from the stakeholder intent rather than from the test, because a test written by the builder encodes the builder's own idea of usable."""
acceptance_criteria = """A fresh family-heterogeneous CRITIQUE session judging the generated dashboard against docs/rubrics/dashboard-usability.md (authored at [v3]-[g2]) returns APPROVE citing numbered anchors. The RUBRIC is the acceptance instrument and the single home for which anchors are live: an anchor whose core has been bound to a test is retired there, and a verdict must not cite a retired anchor. This row therefore does not enumerate the live set - it would be a third copy of it, and the copy that goes stale. A clause of the requirement above that a test now holds is verified through the LLR/TC chain, which the registry already records, not by a verdict."""
priority = "C"
verification = "Test"
status = "Verified"
phase = 3
area = "Trajectory"

[requirement.SR-055]
title = "Ingest and human-decision process loops"
sn_refs = ["SN-010", "SN-021"]
requirement = """The Process tab shall additionally render the project's two circular working
loops as linked flow panels:
(A) the intake loop - owner/agent intake -> triage into work items with spec
detail -> the scheduler-derived ready frontier in the WI registry (docs/work/)
-> build/review -> merge; and
(B) the human-decision loop - open-items population (including the
gate-ratification table) -> human review and ruling -> the log's Decisions
record -> merge
- with the LLM_Agent entry point rendered once and shared by both loops;

[requirement.SR-166]
title = "The delivered package materializes where its manifest declares it will"
sn_refs = ["SN-001", "SN-007"]
boundary_refs = ["B-05"]
requirement = """The delivered package shall be consumable at its own declared shipped-file manifest — every file the manifest names materialized at its declared destination in a fresh scaffold, and this repository's own instance carrying the structure of the template it ships — with a declared destination a fresh scaffold does not carry, and a structural divergence between the shipped template and this repository's instance, each failing rather than degrading the delivered package silently."""
rationale = """Realizes SN-001 (an adopting team gets a working, gated, requirement-traced process without hand-building the tooling — which presupposes that what arrives is whole) and SN-007 (the kit is held to the standard it ships). §1R.6 names this as B-05's own artifact-shaped observable — the package "exists, is complete, and is consumable" — and records that its manifest is already pinned; the 2026-08 re-tier campaign minted fifteen rows and not this one, leaving the crossing the frame describes at greatest length with no requirement stating it, and MAPPING surviving only in SR-163's rationale. Verification evidence is named rather than owed: tests/test_bootstrap.py drives bootstrap.py's MAPPING against the file lists a fresh scaffold must carry, and tests/test_dogfood_sync.py pins this repository's own instance against the template it ships, so the manifest cannot declare one thing and the package deliver another. Deliberately distinct from its two neighbours: SR-163 asks why each shipped file EXISTS (SN-038, purpose coverage), SR-010 asks whether the generated scaffold runs GREEN, and this row asks whether what was promised ARRIVES WHERE IT WAS PROMISED. NARROWED 2026-08-15 (adversarial round 2, cross-family, finding F7, convergent with the second read's H1): as minted, this row ALSO required that a named source the package does not carry, and a shipped file the manifest does not name, each FAIL — and SR-163 already reports both classes under a configurable warn-versus-gate policy. Two rows prescribing different outcomes for one observable is a contradiction an implementer can only resolve by violating one of them, so the two manifest-PRESENCE clauses are shed here and referenced to SR-163; each was token-checked into SR-163's requirement ("missing files, stale inventory entries") and acceptance ("a shipped file absent from it", "a stale entry naming a file that no longer ships") before deletion, so no obligation vanished — only its second, conflicting statement. What is left is what SR-163 does not ask: not whether a file is accounted for, but whether it LANDS — at its declared destination in a fresh scaffold, and in this repository's own instance of the template it ships."""
acceptance_criteria = """A manifest entry whose destination a fresh scaffold does not contain fails naming the destination; and a structural divergence between the shipped template and this repository's own instance fails naming the surface. Evidence: tests/test_bootstrap.py (the manifest's destinations against the fresh-scaffold file lists) and tests/test_dogfood_sync.py (shipped template against this repository's instance). Manifest PRESENCE is deliberately NOT restated here — a named source the package does not carry, and a shipped file the manifest does not name, are both SR-163's, reported under its declared warn-versus-gate policy."""
priority = "M"
verification = "Test"
status = "Drafted"
phase = 5

[requirement.SR-167]
title = "Performance-budget breaches red their hard-gated rows"
sn_refs = ["SN-008", "SN-012"]
boundary_refs = ["B-05"]
requirement = """The delivered harness shall fail the bar it runs exactly when an in-tier hard-gated performance-budget row breaches — its measured metric worse than its absolute Budget, or regressed beyond its declared Tolerance band around the committed baseline — while warn-gated rows and out-of-tier rows only warn, and a metric with no measurement this run is a reported skip, never a silent pass."""
rationale = """Realizes SN-008 (a reader can believe a green — a breach on a row the project chose to hard-gate must red the run, not ride as a tracked number) and SN-012 (the perf layer is opt-in; a repo declaring no PB rows pays nothing, while one that does gets the same honest-gate discipline as every other check). Minted at the owner's 2026-08-15 L2 ruling at the sitting sweep: the second read's L2 and adversarial F6 both found the tolerance verdict fully built (check_perf.py evaluate, the exit contract stated in the module docstring), fully decomposed (LLR-014 "Budget comparator", whose detail states it verbatim) and fully proven virtualized (TC-014 -> tests/test_check_perf.py: test_regression_beyond_tolerance_fails_when_gate_fail end-to-end against a bootstrapped scaffold, test_regression_uses_direction_and_tolerance at unit level, test_within_tolerance_regression_passes the passing arm, test_absolute_breach_fails_when_gate_fail the absolute arm) — yet stated by no SR: LLR-014 rode SR-006 (the step plan and missing-tool refusal), IF-004/IF-031 rode SR-006 + SR-015 (PB back-link resolvability), and SR-033 states only the warn-tier, never-fails side, so the verdict the interfaces' contracts describe had no requirement home (F6: "their contract has no home to point at"). One row for BOTH breach arms deliberately — absolute and regression are one delivered exit contract, the SR-157 one-verdict shape, and the second read's regression framing was the symptom, not the boundary. REWORDED 2026-08-15 (same day, on the owner's grounding question): as minted this row named check_perf.py in the requirement cell, but check_perf.py is NOT on the §1R.2 declared B-05 artifact list — it is the harness's internal perf step (IF-004, check_perf -> check), so under ruling 2.7(a) the SR states the harness-verdict observable and the comparator is named only in acceptance as the current carrier, the SR-157/SR-158 pattern. Vacuous in THIS repository — no performance-budgets.csv exists here and §9's perf layer is declared absent — but the template ships the layer, and the owner's ruling is that a shipped layer owes a stated, tested obligation even where locally unused. IF-004/IF-031 req_refs gain this row in the same act (off-spine, approval drafted); LLR-014.sr_refs and TC-014.verifies are deliberately NOT re-pointed here — both rows are Approved, so amending their cells overrides attestation, which is the sitting's act: when taken, LLR-014 adds this row beside SR-006 and TC-014 verifies it beside LLR-014."""
acceptance_criteria = """Read off the current carrier — check_perf.py, the harness's built-in perf-budgets step (IF-004/IF-031): an in-tier Gate=fail PB row whose measured metric (docs/test/perf-metrics.json) breaches its absolute Budget, or falls outside its declared Tolerance band around the committed baseline (docs/test/perf-baseline.json), makes the step exit nonzero naming the row and the bar red with it; the same breach on a Gate=warn row, or on a row outside the run tier, exits zero and warns; a Gate=fail row with no measurement this run is a per-row reported skip, never silent; a row with no baseline or no tolerance cannot fail on the regression arm while its absolute arm still applies; --update-baseline is the reviewed acceptance path for an intended regression. Evidence, virtualized against a bootstrapped scaffold: tests/test_check_perf.py (both breach arms, the warn arms, tier scoping, malformed values, and the harness wiring at DevBar-Release via test_harness_runs_perf_at_g3)."""
priority = "S"
verification = "Test"
status = "Drafted"
phase = 1
aspect = "perf"

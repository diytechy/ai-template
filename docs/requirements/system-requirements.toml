[requirement.SR-136]
title = "Declared-figure provenance"
sn_refs = ["SN-008", "SN-010"]
requirement = """check_figures.py shall flag a declared driven figure - a line opting in under the fig: marker convention - that does not carry both the command that produced it and the revision it was driven at, or a derivation naming the declared figures it is computed from, warn-first (exit 0) with --strict gating; presence only, never truth, and an unmarked figure is out of scope by design."""
rationale = """Realizes SN-008 and SN-010 - a driven figure is evidence only at the revision it was driven on, and three false figures in one session (2026-08-01) each cost a review round because no record named the producing command or revision, so a stale figure read exactly like a live one. Digit detection was rejected (ids, dates, section numbers and byte budgets drown it, and one false figure had no digits at all), so the marker is opt-in - declare, don't infer - making the honest claim 'declared figures carry provenance', never 'all figures do'. Re-derivation is rung 2, deliberately not built: recorded commands are an execution surface, most figures are legitimately historical, and some commands are expensive or non-deterministic."""
acceptance_criteria = """A fig: marker missing cmd= or rev= (or carrying only empty or wordless values) warns naming the missing half and gates only under --strict, each marker on a line judged on its own attributes; cmd= plus rev= (bare or quoted), or a non-empty derived=, passes; unmarked figure prose, placeholder-grammar examples, fig-ok lines, GENERATED blocks and docs/reviews/ records are ignored; docs/stack.ini is scanned beside the root and docs markdown surfaces."""
priority = "S"
verification = "Test"
status = "Verified"
phase = 1
area = "Doc currency"

[requirement.SR-137]
title = "One policy home, with a checked shape"
sn_refs = ["SN-028"]
requirement = """The kit shall read every process policy dial from a single `docs/process.toml`,
and shall REFUSE — never resolve by precedence — a repo in which any dial is
declared both there and in its legacy one-word file.
The file's line shape shall be a checked contract: one `key = value` per line
under a bare `[section]` header, no dotted keys, no inline tables, no multi-line
strings."""
rationale = """Two grammars read this file — `tomllib` in Python and the three git hooks in pure sh, so a Python-less box still fails closed on a declared privacy gate (M-42). TOML is far more expressive than a `grep -E` can follow, so every shape only one reader understands is a silent flip of a security gate; the first cut shipped five such shapes, three of them fail-OPEN. Narrowing the shape and CHECKING the narrowing is what makes one file safe for two readers."""
acceptance_criteria = """A dial declared in both homes produces a refusal naming the key and both files, at every guarded entry point (the dispatcher's pre-claim preflight, intake's adjudication arm, the integrator's verdict gate); a dotted key, inline table, multi-line string or hook-read key under the wrong section is refused by the shape check AND still reads ON in both readers; the hooks' sh and `tomllib` return the same answer over the adversarial file table; a wrong-typed or out-of-range dial is refused rather than defaulted."""
priority = "S"
verification = "Test"
status = "Draft"
phase = 5
area = "Process"

[requirement.SR-138]
title = "Legacy config converts automatically and totally"
sn_refs = ["SN-028"]
requirement = """`bootstrap.py --migrate-config` shall fold every legacy one-word policy file into `docs/process.toml` and delete it, and shall NEVER delete a file whose value it did not manage to write. Both bootstrap and the documented re-sync shall run it."""
rationale = """The hard mixed-config refusal in SR-137 is only safe to ship if a downstream adopter never meets it un-aided. And the converter's own failure mode is the sharp one: an earlier cut deleted a legacy file on the strength of a write that never happened and reported success, destroying a declared `privacy_check = true` under a green `migrated:` line."""
acceptance_criteria = """A repo carrying legacy files converts in one pass and reports what moved; a second pass is a no-op; a legacy file whose value cannot be written is LEFT IN PLACE with its value intact and named in the report; the retired gate-authority word expands to all three dials it meant rather than to a single key."""
priority = "S"
verification = "Test"
status = "Draft"
phase = 5
area = "Process"

[requirement.SR-139]
title = "Ratification as an ordinal over a derived spine stage"
sn_refs = ["SN-029"]
requirement = """The kit shall express human ratification authority as a cumulative integer 0-4 naming the highest spine tier a human still ratifies, compared against a separately derived SPINE STAGE (0=SN..4=nothing in process) with a declared, auditable mapping to the harness gate. Every unreadable or out-of-range input shall resolve toward MORE human involvement."""
rationale = """The retired three-value enum could not express "TCs are human-held but LLRs are not", and four tables each re-interpreted the same word with its own fail-safe direction. The failure that matters is a machine ratifying something a human meant to hold, so every degrade has to point the same way — including the ones that look like kindness: clamping an out-of-range level toward 0 reads as "nothing is human-held" and disarms every hold in the repo."""
acceptance_criteria = """Level N holds exactly the tiers the shipped template documents (cumulative, strictly-less-than the stage); stage 4 is held by no level, the end-of-run hold being its own dial; an unreadable stage, an absent dial, and a wrong-typed dial all read as human-held; an out-of-range level falls back to the conservative end AND is refused loudly; a legacy gate-policy word reads as all three dials it meant."""
priority = "S"
verification = "Test"
status = "Draft"
phase = 5
area = "Process"

[requirement.SR-140]
title = "The attestation anchor lives on the artifact's own row"
sn_refs = ["SN-029"]
requirement = """The kit shall record each acceptance on the accepted artifact's own row - the
commit whose tree carries the text that was accepted, and a digest of that row's
NORMATIVE cells - never in a second registry keyed on the same artifact.
It shall report text that has moved away from its recorded anchor regardless of
any Status movement.
It shall treat an anchor written in the same commit as the text it anchors as an
error."""
rationale = """Attestation STATE is already the row's own Status - derive_gate computes the gate from those cells and reads no other source - so a separate ledger was a second home for a fact the row already carried, and three of its seven columns duplicated cells outright (Decision=ratified|meaning IS Status; superseded IS SupersededBy). What the ledger got right is the ANCHOR ITSELF: 'has this been ratified' was answered by walking git for the newest commit where a row read Verified, which is sound only while every amendment flips its row in the same commit - precisely the sanctioned path the staged-amendment guard deliberately ignores. Two cells are kept rather than one because they fail in DIFFERENT directions: the commit is what a human can review and what the before/after brief diffs against, while the digest is what survives a squash-merge, a rebase or a shallow clone, any of which makes a recorded sha unresolvable and would otherwise silence drift detection repo-wide at once. Owner ruling 2026-08-09, docs/repo-lock.md D-1."""
acceptance_criteria = """An artifact whose normative text has moved since its recorded anchor is reported whether or not its Status moved; an anchor that cannot be recomputed, or that names an artifact which is not a current row, is a finding rather than silence; a commit that writes an anchor cell while also changing that row's normative cells is refused, because a re-stamp in the same breath as an amendment hides the amendment; and the same rules hold for a stakeholder need, which has no Status cell for the amendment machinery to watch."""
priority = "S"
verification = "Test"
status = "Draft"
phase = 5
area = "Process"

[requirement.SR-141]
title = "The loop's priority order is stated and pinned"
sn_refs = ["SN-025"]
requirement = """Admission shall prefer `adjudication` rows over all other ready work, as a stable partition applied at admission rather than by renumbering the ruled rank table, and shall not thereby admit anything past a human-held stop."""
rationale = """A ratification is the one act this loop cannot cheaply take back — the ledger is append-only by design — so a spine batch that re-attests requirements must not run ahead of an unjudged claim that may overturn its premise. Renumbering the ruled rank table would migrate every downstream repo's ordering for a rung that belongs to admission, so the two orders are kept distinct and the disagreement is stated."""
acceptance_criteria = """An adjudication row admits ahead of a ready spine batch; the ruled rank table is unchanged, so `--explain` still reports it; the partition is stable (non-adjudication rows keep their relative order); a human-held attestation still drains and surfaces with the adjudication row waiting behind the stop."""
priority = "S"
verification = "Test"
status = "Draft"
phase = 5
area = "Process"

[requirement.SR-142]
title = "Red test cases under a closed implementation are named and judged"
sn_refs = ["SN-025"]
requirement = """The idle census shall name, as its own class, a test case that is not green while every requirement it verifies is cited by a work item recorded `done`, and shall route it to an ADJUDICATION row whose tier is estimated from measured breadth rather than defaulted."""
rationale = """The pair is a contradiction the registries state plainly and nothing was reading: the work is closed and the evidence for it is red. It is not one situation but three — a stale TC, an optimistic close, or a moved requirement — and choosing between them is a judgement, which is what the adjudication kind is for. The statuses that are NOT red are stated as exemptions because Status is an open vocabulary: failing toward naming a gap beats failing toward missing one."""
acceptance_criteria = """A not-green TC under a `done` citer is named; `Verified`, `Draft` and `Modified` are exempt (the last belongs to the amendment adjudication, and two judgement rows for one event is a double-count); an open, `partial` or `cancelled` citer makes nothing red; a TC verifying a mix of claimed and unclaimed targets is not red; the census line's grammar has exactly one reader."""
priority = "S"
verification = "Test"
status = "Draft"
phase = 5
area = "Process"

[requirement.SR-143]
title = "Queue overlap is made visible, never blocked"
sn_refs = ["SN-025"]
requirement = """The validator shall report, warn-only and never in the exit code, pairs of OPEN work items that overlap by near-identical title, shared requirement citation, or a shared spec of record."""
rationale = """A queue that silently grows two rows for one job is the failure; a checker that cannot tell a legitimate split from a duplicate must not block on the difference. Overlap is frequently correct — two rows may answer one requirement from different sides — so the whole contribution of the mechanical rung is visibility, and the judgement half belongs to an adjudicator with the scope in front of it."""
acceptance_criteria = """Each overlapping OPEN pair is named once per signal with both ids, in deterministic order; a closed row never conflicts; the title bar is high enough that ordinary unrelated work is silent and a shared stopword is not a signal; the findings never join the exit code, not even under --strict."""
priority = "S"
verification = "Test"
status = "Draft"
phase = 5
area = "Process"

[requirement.SR-144]
title = "Every lane close is a terminal state with an immutable record"
sn_refs = ["SN-027"]
requirement = """A lane that cannot finish shall close into a TERMINAL `partial/` state with one immutable per-close report naming the claimed outcome, the reason, the commit range and the keep/discard split, and shall merge like any other branch. A report declaring neither a split nor an explicit deferral shall be refused, and a second close of the same event shall be refused rather than overwriting the first."""
rationale = """Five successive dedup mechanisms leaked because each reconstructed the return event from a MUTABLE proxy; a document that never moves dissolves the class instead of mitigating it. The refusals are what make "immutable" a property rather than a claim. The split is a field because its absence merged rejected code onto trunk on 2026-08-03: silence about it is different from saying "I could not judge", and only silence is unactionable."""
acceptance_criteria = """A partial close is clean under the real validator (the terminal Deliverable rule is exempt, because an early close leaves the spec's definition byte-identical by design); a terminal spec with no report is LOUD rather than silently un-disposed; a second close is refused and leaves no residue in the lane; a multi-spec close that refuses restores every report it wrote."""
priority = "S"
verification = "Test"
status = "Draft"
phase = 5
area = "Process"

[requirement.SR-145]
title = "A lane's outcome is a claim; the adjudicator overrules by minting"
sn_refs = ["SN-027"]
requirement = """Every `partial` and `cancelled` close shall earn one disposition row, keyed on the close's own immutable report path; a `complete` close shall be spot-checked at a declared rate rather than gated. Continuing partial work shall mean DRAFTING A SUCCESSOR carrying explicit lineage, never re-opening a terminal row."""
rationale = """The lane is entitled to assert what happened; what it MEANS is the adjudicator's, and making that authoritative by minting keeps history honest — the original move is never reversed in place. Keying the disposition on the report PATH rather than on any field of it is what makes re-sweep idempotence correct: an earlier cut keyed on the report's mutable outcome field and re-minted on every edit. Adjudicating every green close would rebuild the verdict gate under a new name, over work two gates already judged."""
acceptance_criteria = """A partial or cancelled close mints exactly one disposition; a re-sweep mints none; a genuinely second close is a second report and so a second row; a disposition row never mints a disposition for itself (refused at both ends); a successor's lineage survives the id change."""
priority = "S"
verification = "Test"
status = "Draft"
phase = 5
area = "Process"

[requirement.SR-146]
title = "Prompts are reviewable files with a per-session audit trail"
sn_refs = ["SN-005"]
requirement = """Every prompt the loop launches shall be a shipped file with strictly filled slots, listed by digest in a freshness-gated generated catalogue, with each session recording which template it used and the fingerprint of what that rendered to."""
rationale = """Prose steers the sessions this loop launches and had been reviewable only by reading Python source, which makes the process trusted rather than inspectable. The audit trail is the part that makes the move useful rather than cosmetic: without a per-session digest, "which instruction did this session see" stays an inference. (The argv-vs-shell-string transport decision is design, and lives one tier down in LLR-163.)"""
acceptance_criteria = """An unknown or unfilled slot is a refusal; a missing shipped template is a named preflight refusal rather than a first-session crash; the catalogue lists every shipped prompt with its digest and `--check` fails when stale; a line-ending difference is not a digest change; an operator override is named in the session record rather than only in the launch flags."""
priority = "S"
verification = "Test"
status = "Draft"
phase = 5
area = "Process"

[requirement.SR-147]
title = "One machine-parseable carrier for the requirement spine"
sn_refs = ["SN-002", "SN-012"]
requirement = """The kit shall carry the SN->SR->LLR->TC spine in ONE machine-parseable carrier rather than two (stakeholder needs as markdown prose tables, the other three tiers as CSV), and shall provide a mechanical converter that proves the conversion cell-for-cell over the live registries BEFORE the authority flip - refusing, with a nonzero exit that names the row and the field, any conversion in which a cell does not survive the round-trip."""
rationale = """The two-carrier split has no recorded rationale and costs on both sides. Reading 32 need rows takes ~166 code lines across 14 functions in 8 modules - six bespoke scanners, two of them F5 twins pinned by nothing but a docstring, which have already drifted once and rendered a phantom root in the dashboard - while reading all 436 SR+LLR+TC rows takes csv.DictReader. CSV also cannot represent the cells that actually exist: five hold a literal pipe, 552 hold commas, the longest is 1,553 characters, and an embedded newline has no representation at all. A structured carrier turns three integrity rules into properties of the parse - a duplicate id becomes a decode error, a ref list becomes a typed array (retiring the split-on-whitespace rule that read `and` as an orphan), and an empty cell becomes an absent key, so `unset` and `set to empty` stop being the same value. The converter is the migration's evidence, not its convenience: SR-129's 140-cell lesson is that an unproven representation change is exactly where a registry silently loses cells."""
acceptance_criteria = """migrate_carrier.py --check over the live registries exits 0 reporting the round-trip clean for every row of every tier; a cell that is dropped, truncated, re-typed or re-ordered is REFUSED with exit 1 and a finding naming the registry, the row id and the field; and the emitted text re-parses with tomllib."""
priority = "C"
verification = "Test"
status = "Draft"
phase = 5
area = "Trajectory"

[requirement.SR-148]
title = "Autonomous loop phase order"
sn_refs = ["SN-025", "SN-029"]
requirement = """Subject to the adjudication-first admission rule, the unattended coordinator shall select work in this order: unresolved handback records, the earliest incomplete spine tier in SN-to-SR-to-LLR-to-TC order, then implementation work after test-case layout is complete; it shall apply human holds only from the declared ratification level."""
rationale = """Without one precedence rule, the same repository can resume into implementation while returned obligations or prerequisite requirement tiers remain unresolved. That produces work against stale intent and makes repeated resumes select different next actions. A recorded selection class, source record and hold decision provide replayable evidence of the choice."""
acceptance_criteria = """A ready adjudication row remains ahead of every class named here; otherwise an unresolved handback is selected before spine or implementation work and processing it either resolves the record or mints a provenance-linked successor exactly once. With no unresolved handback, only the earliest incomplete spine tier is eligible. At human_ratification_through = 0 no spine tier produces a human hold; levels 1 through 4 hold exactly their documented cumulative tiers. Implementation work is ineligible while any required test case remains unlaid. Every selection records the chosen class, source identifier and hold decision."""
priority = "S"
verification = "Test"
status = "Draft"
phase = 5
area = "Unattended loop"


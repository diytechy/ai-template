acceptance_criteria = "A partition round writes the derivation record into the tracked component registry, never into session prose or a plan document alone; a live component row with no record, or a record omitting the candidate partitions, the declared objective, the constraints, any candidate's score, the selected partition or the human ruling, is reported naming the missing element; a selected partition the recorded scores do not rank first is reported unless the record carries the human override that chose it; the recorded ranking recomputes from the record's own objective, constraints and scores alone."

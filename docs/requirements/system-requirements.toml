[requirement.SR-026]
title = "Coordinator resumes headless"
sn_refs = ["SN-006"]
boundary_refs = ["B-05"]
requirement = "agent_loop.py shall resume headless with stdin closed, never blocking on a prompt: a worker resumes from its explicit claimed assignment plus the committed trailer evidence on its branch, and the integrator derives claim and queue state from trunk history alone — the generated status surface never a session input."
rationale = """Realizes SN-006 and the dissolved edge expectation that an unattended run never blocks on a prompt, at launch or mid-run — an unattended run blocked on a prompt is indistinguishable from a hung one and holds its lane until a human notices. Keeping a separate serial resume path beside the dispatcher was rejected: two authorities over one decision drift, and the divergence surfaces as a run that resumes differently depending on how it was started."""
acceptance_criteria = "A worker reconciles from its assignment + committed evidence and the integrator from trunk history; every mode runs with stdin closed and a prompt cannot wedge it; a model rate limit backs off rather than failing the run, and a stall aborts to protect the budget."
priority = "S"
verification = "Test"

[requirement.SR-049]
title = "Derived gate from artifact states"
sn_refs = ["SN-004", "SN-008"]
requirement = """derive_gate.py shall compute the active gate from the spine artifact states (SN
section-state + SR/LLR/TC Status maturity) and cache it to docs/gate rather than
accept a hand-set value, so a gate advances only when the mechanical states do.
Three Status values are recognized case-insensitively:
(1) Draft (G0 + decomposition exemptions);
(2) Verified (G3); and
(3) Modified — a post-attestation amendment owing a re-attest, deriving G2
through the existing decomposed-unverified rung with no arithmetic of its own.
The cached basis line carries modified=N beside drafts=N so the pending state
never hides."""
rationale = """SSOT applied to the gate itself (docs/specs/derived-gate-model.md): a hand-set marker can be bumped without the work; deriving it makes gate advancement mechanical (SN-004) and un-gameable (SN-008). The hybrid cache keeps the value readable on checkout; --check guards rot."""
acceptance_criteria = """derive_gate.py --print on the meta computes the per-phase gates from the current states (a Modified SR's phase reads G2 until re-attested); --check exits nonzero when a state change is not reflected in the cached docs/gate basis; the compared line includes the modified=N count."""
priority = "M"
verification = "Test"
status = "Modified"
phase = 1

[requirement.SR-050]

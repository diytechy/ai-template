boundary_refs = ["B-05"]
requirement = """The delivered loop content shall write the shared records it derives - the compiled activity log and the generated project-state artifacts - only from the serial merge step and only against the merged tree, never from a parallel work branch."""
rationale = """SPLIT 2026-08-17 (Sol F18, applied): this row merged three obligations that fail independently, and the shared serial actor is a shared MECHANISM, not one decision. It keeps the EXCLUSIVE-WRITER contract; ordering-and-all-or-nothing left to SR-173 and identity allocation to SR-174, each with its own children. The clue Sol read correctly is that the non-reuse clause appeared only in this row's acceptance - an acceptance minting a requirement, the same defect as F12 - and it now has a shall of its own at SR-174. Terminology plained with the split: shared authority surface, mint, composed tree and serial integration seam are gone in favour of what they name. Realizes SN-027's serialization guarantee at the surfaces where a parallel writer would actually corrupt something, with SN-010 (the status surface a human reads regenerates at the seam, never on a lane), SN-008 (a first failure stops loudly rather than half-regenerating) and SN-025 (the surface a session reads is generated, never hand-copied). Minted 2026-08-16 by the re-tier v2 S4 split of SR-156 (ruling R1): the parent stated the serial LANDING and, separately, that the shared authority surfaces regenerate only there — two contracts that fail independently, since a perfectly serialized landing that still lets a lane commit a regenerated artifact satisfies the landing row and not this one. The three surfaces sit in ONE row rather than three because they share one decision, not three: the serial trunk actor is their sole writer. That decision is already owner-ruled for the identity mint (log.md Decisions 2026-08-01, R1/R3 — a work branch never mints a work-item id) and this row is its requirement-tier home, which it did not have. `phase` inherits the parent's 4, matching every child."""
acceptance_criteria = """The compiled activity log and the generated project-state artifacts are written only by the serial merge step and never committed from a work branch; a work branch that regenerates one is refused or its result is not what lands. Ordering and partial-result behaviour are SR-173's; identity allocation is SR-174's; the harness work-branch freshness skip is SR-006's clause and is not restated here. Read off the current carrier, as the current set: trunk_step.py (the log compile) and check.py's work-branch skip."""
priority = "M"
verification = "Test"
status = "Drafted"
phase = 4

[requirement.SR-171]
title = "Bounded retry on a declared transient model limit"
sn_refs = ["SN-006", "SN-025"]
boundary_refs = ["B-05"]
requirement = """The delivered loop content shall retry a declared transient provider limit under a bounded backoff rather than ending the run, and shall surface the wait so a reader can tell a throttled run from a wedged one."""
rationale = """MINTED 2026-08-17 (Sol F12, applied). This obligation was live but stated ONLY in SR-026's acceptance cell, where it minted a requirement the shall never made. Deleting it would have dropped real behaviour, so it is stated here instead. Realizes SN-006 (a walk-away run survives the conditions it will actually meet - a rate limit is the ordinary one) and SN-025. The bound is what separates this from a retry loop: unbounded retry against a limit that is not transient is indistinguishable from a hang, which is the failure SN-006 exists to prevent. Surfacing the wait is the other half - a silent backoff and a wedged run look identical from outside."""
acceptance_criteria = "A declared transient limit is retried under the declared backoff and the run continues; the wait is visible on the run surface rather than silent; a limit that is not declared transient ends the run with its own outcome code rather than retrying; the retry count and interval come from a declared value, never a literal."
priority = "S"
verification = "Test"
status = "Drafted"
phase = 4

[requirement.SR-172]
title = "A stalled session ends at its declared limit"
sn_refs = ["SN-006", "SN-025"]
boundary_refs = ["B-05"]
requirement = """The delivered loop content shall end a session that has made no declared progress within its declared stall limit, reporting the stall as its own outcome rather than as success or as an ordinary failure."""
rationale = """MINTED 2026-08-17 (Sol F12, applied), the sibling of SR-171 and from the same defect: the obligation lived only in SR-026's acceptance. Realizes SN-006 and SN-025. It is a SEPARATE row from SR-171 because the two fail independently and for opposite reasons - a backoff that never gives up is the failure this row catches, and a stall limit that fires on a legitimately slow provider is the failure SR-171's bound prevents. Stated as its own outcome because a stall reported as a plain failure sends a reader looking for a defect that is not there, and reported as success is a false green."""
acceptance_criteria = "A session with no declared progress inside the declared stall limit ends and reports the stall as its own distinct outcome; a session making declared progress is not ended by that limit; the limit is read from a declared value; the stall outcome is distinguishable from both success and an ordinary failure at the run surface."
priority = "S"
verification = "Test"
status = "Drafted"
phase = 4

[requirement.SR-173]
title = "Shared regeneration is ordered and leaves no partial result"
sn_refs = ["SN-008", "SN-010"]
boundary_refs = ["B-05"]
requirement = """The delivered loop content shall regenerate the shared derived artifacts in declared dependency order, stopping at the first failure and leaving no partially regenerated set behind."""
rationale = """MINTED 2026-08-17 (Sol F18, applied) out of SR-170, which merged three obligations that fail independently. This is the TRANSACTIONALITY half: ordering and all-or-nothing are one decision about a regeneration run, and they are not the same decision as who is allowed to write (SR-170) or how identity is allocated (SR-174). A regeneration that runs in the right order and still leaves half a set behind satisfies neither, which is what makes them separable. Realizes SN-008 - a first failure that stops loudly beats a half-regenerated set that reads as complete - and SN-010."""
acceptance_criteria = "Regeneration runs the declared artifact families in declared dependency order, with a producer before every consumer that reads it; a failure stops the run at that point and reports it rather than continuing; no partially regenerated set is left committed; an absent artifact family is skipped rather than treated as a failure. Read off the current carrier, as the current set: trunk_step.py --regen."
priority = "M"
verification = "Test"
status = "Drafted"
phase = 4

[requirement.SR-174]
title = "Work-item identity is allocated once and never re-issued"
sn_refs = ["SN-008", "SN-025"]
boundary_refs = ["B-05"]
requirement = """The delivered loop content shall allocate each work-item identity at most once, so that no two concurrent actors receive the same identity and an identity freed by a deletion is never re-issued."""
rationale = """MINTED 2026-08-17 (Sol F18, applied) out of SR-170. Identity allocation is its own decision, not a consequence of serialization: serializing the writer makes a COLLISION unlikely and does nothing about RE-USE, which is the half that silently re-points every commit message and archived document citing the freed id. The non-reuse clause previously appeared only in SR-170's acceptance, which is the same acceptance-mints-a-requirement defect Sol raised at F12 - stated here rather than left in a cell that cannot carry it. Realizes SN-008 and SN-025."""
acceptance_criteria = "Two actors finishing against the same tree cannot obtain the same work-item identity; an identity freed by deleting its record is not re-issued to new work; allocation counts from the recorded high-water mark rather than from the live maximum. Read off the current carrier, as the current set: intake.py and the post-merge arm of integrate.py."
priority = "M"
verification = "Test"
status = "Drafted"
phase = 4

[requirement.SR-175]
title = "Declared inclusion rule for content dispatched to a model provider"
sn_refs = ["SN-026"]
boundary_refs = ["B-05"]
requirement = """The delivered loop content shall compose what it dispatches to an external model runner under a DECLARED inclusion rule rather than an implicit one — the content eligible for each dispatched brief, and what is excluded, readable as a declared set — with the basis on which repository content crosses to a declared provider stated as the scope of the consent the enabling surface grants, never presented as a technical bound on what an invoked runner reads."""
rationale = """Hat-derived (hat.DATA-PROTECTION, with hat.SECURITY C-SEC-5 and hat.LEGAL C-LEG-3 converging on the same boundary control — three charters, three reasons, one crossing; clause texts in docs/plans/2026-08-16-blind-derivation-c-hats.md): repository content is briefed to external model providers, and for an adopter that content's history carries every contributor's name, email and timestamp — personal data crossing with no declared basis or exclusion in any need. SN-026's own text governs WHICH model runs, never WHAT IT IS SHOWN, so this obligation is content beyond the parent's demand — the derived-requirement class, labelled so the deriving lens is reviewable and the need owner sees it fed back (ruled at sitting-3 §0.4 item 8, 2026-08-17, adopting the intake proposal, docs/plans/2026-08-17-wi468-obligation-intake-options.md §1 option (b); the SN-026 amendment was the alternative, deliberately not taken alongside — one rule, one home). WHAT EXISTS TODAY IS A DISCIPLINE, NOT A DECLARATION: the push channel is measurably narrow — an allowlist-only planning surface, the project log excluded BY NAME in three composers, zero authorship fields formatted into any prompt — but the rule lives as a convention inside the composing functions, unfalsifiable because no requirement stated it; this row converts it into a stated one and the chain below pins the conventions as they exist. NOT YET MECHANIZED, stated rather than implied: the declared-set surface itself (a per-row inclusion/exclusion field on the provider registry, or a policy dial) and the planted-credential dispatch block in the acceptance are not built. THE PULL-CHANNEL LIMIT, the design-control honesty this row must carry: every enabled runner is launched with permission-bypass flags and can read the whole tree itself, so the declared rule can bound what the loop ASSEMBLES and state the scope of what the consent surface CONSENTS to — it cannot technically bound an invoked runner, the same no-design-control reading the frame applies to external actors at REL-003 and the B-06/B-07 cut. (Derived-requirement label, added 2026-08-17 — PROVISIONAL, unsigned.)"""
acceptance_criteria = """The inclusion rule for each brief class the loop dispatches is readable as a declared set naming what is eligible and what is excluded, so a composer can be checked against it rather than against convention; a planted credential inside brief-eligible content blocks dispatch (C-SEC-5's fit criterion, on the same scanner the transcript path already runs); the basis and exclusion for repository content crossing to a declared provider are stated where the provider is declared, and the consent surface's documentation names them as the scope of what enabling consents to; the pull channel is presented as consent-scoped, never as filtered. Read off the current carriers, as the current set: the planning surface's two-registry allowlist read and the disposition/worker composers' by-name exclusions and clipped oneline/name-status log reads — the conventions this row makes declared; the declared-set surface is the row's stated build gap."""
priority = "S"
verification = "Test"
status = "Drafted"
phase = 5

[requirement.SR-176]
title = "A privacy finding persists by class and location, never by value"
sn_refs = ["SN-009"]
boundary_refs = ["B-05"]
requirement = """Any durable record the delivered kit produces of a secrets or privacy finding shall identify the finding by its class and location, never by the matched value."""
rationale = """Hat-derived (hat.DATA-PROTECTION, C-DPR-2 — clause text in docs/plans/2026-08-16-blind-derivation-c-hats.md): the finding record is the one artifact guaranteed to contain the personal data it reports, created by the control itself — SN-009 defeating itself, since a scanner that catches a value and then echoes it into a committed artifact has published what it protected. Ruled at sitting-3 §0.4 item 8 (2026-08-17), adopting the intake proposal (docs/plans/2026-08-17-wi468-obligation-intake-options.md §2 option (b)), whose measurement grounds the row: the scanner mints no record of its own (check_privacy prints location, label and the MATCHED VALUE to stdout and writes nothing), but an unattended run's transcript is committed bookkeeping, so the durable copy of every finding is the session log — and the transcript path redacts credential shapes only. DELIBERATE NARROWING of the charter's ask, recorded here as the deriving decision: C-DPR-2 asks for a retention limit and an access rule, and a kit cannot honestly promise either over an adopter's git history (committed content is effectively forever; access is the host's) — what it CAN promise is that the matched value never reaches durable storage, which moots both. MECHANIZED TODAY for the always-on class: the transcript writer redacts the credential shapes and its summary line names class and count, never the value — pinned by the chain below. NOT YET MECHANIZED, stated rather than implied: the PII/identity classes the privacy gate adds are not in the redaction set, so for an adopter with the gate on a PII finding echoed into a session transcript would persist — closing that, on the same seam, is this row's build debt. (Derived-requirement label, added 2026-08-17 — PROVISIONAL, unsigned.)"""
acceptance_criteria = """A planted value matched by a scanning class appears 0 times in any tracked artifact after the run that caught it; the durable trace of the finding names the class and the location (a count line, a path), never the matched text; the unredacted raw stream stays in untracked scratch space only. Read off the current carrier, as the current set: the transcript writer's redaction seam — the one path by which a finding becomes durable — holding for the credential classes today, with the privacy-gate classes the row's stated gap."""
priority = "S"
verification = "Test"
status = "Drafted"
phase = 4

[requirement.SR-177]
title = "Fan-out utilisation reported from the run's own telemetry"
sn_refs = ["SN-027"]
boundary_refs = ["B-05"]
requirement = """The delivered loop content shall report, per run, the utilisation of the fan-out it commissions — the lanes configured, the lanes actually occupied, and the work integrated per unit of wall time — derived from the run's own recorded telemetry, reported and never gated, with no declared improvement target."""
rationale = """Hat-derived (hat.PERFORMANCE, C-PRF-1 — clause text in docs/plans/2026-08-16-blind-derivation-c-hats.md): the charter refuses a declared budget with no measurement behind it, and SN-027 is that finding inverted — the system's most complex machinery justified by a throughput claim no instrument measures, flagged unfalsifiable as written by three independent derivations. Ruled at sitting-3 §0.4 item 8 (2026-08-17), adopting the intake proposal (docs/plans/2026-08-17-wi468-obligation-intake-options.md §3 option (b)), and DELIBERATELY LESS than the charter asks — the narrowing is the decision: C-PRF-1 wants a declared improvement over the serial semantic on a declared workload, but the wall time of an LLM loop is dominated by provider latency and model choice, so a numeric target would pin machine, provider and model conditions the kit does not control (one machine is one data point) — this row makes the throughput claim OBSERVABLE rather than BUDGETED. The concrete argument the instrument earns its keep: the lanes dial is undeclared in this repository and defaults to 1, so the machinery SN-027 justifies by fan-out runs SERIAL here and nothing today would say so — this report's first run would have printed lanes=1. The need's own justification was re-worded to the structural claim at the same ruling (SN-027's why, same-day amendment), so the need and the instrument stop overclaiming together. NOT DECOMPOSED, stated rather than implied: nothing aggregates the existing per-session telemetry (wall seconds, api seconds, turns — the session-log headers and the iteration index) by lane or by run, so there is no seam to pin and no test to cite; the row lands Drafted-undecomposed with the aggregation surface as its whole build gap, and the telemetry columns alone do NOT satisfy it. (Derived-requirement label, added 2026-08-17 — PROVISIONAL, unsigned.)"""
acceptance_criteria = """A completed run's report states the lanes configured, the lanes actually occupied, and the work items integrated per wall-hour, derived from the run's recorded telemetry; the report is informational — no threshold, no exit-code change; a serial run reports its single lane rather than omitting the line, so the configured-versus-occupied gap is always visible. Read off the seams the report would aggregate, as the current set: the per-session telemetry header and the iteration index — the aggregation itself is the row's stated build gap."""
priority = "C"
verification = "Test"
status = "Drafted"
phase = 4

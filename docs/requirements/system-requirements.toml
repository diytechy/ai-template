here and §9's perf layer is declared absent — but the template ships the layer, and the owner's ruling is that a shipped layer owes a stated, tested obligation even where locally unused. IF-004/IF-031 req_refs gain this row in the same act (off-spine, approval drafted); LLR-014.sr_refs and TC-014.verifies are deliberately NOT re-pointed here — both rows are Approved, so amending their cells overrides attestation, which is the sitting's act: when taken, LLR-014 adds this row beside SR-006 and TC-014 verifies it beside LLR-014. Hat-derived (hat.PERFORMANCE): the charter's third clause — what happens when the budget is exceeded — is this row's entire subject, and no other lens in the roster asks it. That dependency is now CLOSED: the PERFORMANCE charter was ruled `always` by the owner on 2026-08-16, so the lens this row derives from applies unconditionally rather than waiting on a tag; the rationale above already concedes the row exists because a layer ships rather than because a need asks, and naming the lens is what turns that from accretion into a reviewable derived requirement. (Derived-requirement label, added 2026-08-16 — PROVISIONAL, unsigned.)"""

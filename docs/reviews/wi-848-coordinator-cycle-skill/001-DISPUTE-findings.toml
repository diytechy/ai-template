id = "LANDING"
held_by = "coordinator"
finding = '''
[MAJOR] project-trajectory/skills/coordinator-cycle/references/recipes.md:213 -> F1: the newly canonical procedure still lands coordinator lanes with `git merge --squash`, also prescribed at coordinator-cycle/SKILL.md:195, despite the spec's Done-when requiring reconciliation with every landed row. Its spec-of-record, docs/plans/2026-10-07-wi841-retro/PROPOSAL.md:382, explicitly says that once the approval-act rung admits in-lane acts, coordinator lanes land through `integrate.py integrate` so every slot rung runs. WI-849, which admits those acts, is already in the reviewed base as ceab00c1108d78d825247f5d78cd53aaa827a598. The hand route preserves the bypass of merge-slot checks that the proposal identifies; passing strict trajectory checking is not equivalent to running those rungs. This is a confirmed procedure/spec mismatch (rubric B1), not a compromised-host scenario -> replace the hand-squash landing instructions in the canonical skill and recipes with the current serialized integrator route and synchronize both agent copies, retaining the applicable act ordering and owner-reserved actions -> @Integration/Coordination
'''
position = '''
Contested on authority. Facts: the owner directed hand integration on 2026-09-28 (one squash commit per item, lane tips kept in archive/lanes; docs/status.md records it), and the owner's prompt for this overnight run (2026-10-09) says, for every row, 'Land by squash, after a rebase onto trunk'. Every coordinator landing since, including WI-870 and WI-853 this leg, went by hand squash after a rebase, with the views regenerated, the smoke bar and check_trajectory --strict run before the landing commit. The reviewer is right that PROPOSAL.md (section 7.1, 'The landing') says that once the approval-act rung admits in-lane acts, coordinator lanes land through `integrate.py integrate` so every slot rung runs, and that WI-849 (which changed that rung) is in the base. Nobody has yet run `integrate.py integrate` on a coordinator lane carrying in-lane acts; whether it works end to end on such a lane (the rebase onto acts, the regen, the re-mint sweep) is unproven. The builder kept the hand squash because it is the procedure the owner currently directs and every landing uses; it recorded 'a hand landing runs no merge-slot rungs' as one-session policy (wi-848.toml D-008). Routes: FIX (the skill states the integrator route as the landing, which would change the procedure this very run follows); DISMISS (the skill records today's owner-directed procedure, and the switch to the integrator is its own row, proven on a live lane first); or ESCALATE (the landing route is the owner's call). The coordinator takes no side between them.
'''

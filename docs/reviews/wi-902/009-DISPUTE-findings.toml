range = "ccd663919..4a8e7f64c"

[[finding]]
id = "DB"
held_by = "coordinator"
finding = "[MAJOR] project-trajectory/scripts/intake.py:1801 -> K1/B1: existence of the completed disposition at before is treated as proof its adoption was successfully consumed. On a real repository the landing sweep rejects an already-terminal successor, but a later bare sweep calls _landed_before with HEAD, skips the open-state rule, returns 0 and redirects the dependent to that rejected successor; reproduced for both complete and cancelled successors. This contradicts SR-148's already-open successor acceptance and LLR-335/TC-360's first-consumption guarantee, and makes recovery silently erase the refusal -> Replace file-existence replay eligibility with acceptance evidence bound to the exact adoption, produced only by successful consumption at the owning sweep boundary; retain SR-148 acceptance/approval and IF-244's refusal contract, carry the corrected replay semantics and rejected-then-replayed regression into LLR-335/TC-360 and re-attest the changed child content. This is the structural producer fix called for by .agents/skills/antidote/SKILL.md, rather than an additional compensating open-state guard -> @kit-builder"
position = "Coordinator: contest. The replay's lineage-only acceptance after a refused landing sweep is the residual gap the coordinator accepted on the owner's behalf in docs/decisions/wi-902.toml D-001, whose recorded text is, verbatim: \"Review 001 F1 (a bare sweep re-validated a consumed adoption against current open states, so the adopted successor's completion made every later sweep refuse) is fixed by splitting first consumption from replay: the sweep that lands the adoption (its spec not yet in complete/ at the sweep's before commit, `_landed_before`, comparing the commit pair the sweep already holds) applies the open-state rule; a replay of a landed adoption accepts on lineage only (the adopted row exists in any state, either root, and still supersedes the disposed row). This narrows the Trust section's 'read at each consumer's read' for the sweep's replay, and the spec's Trust now says so. Residual gap: if the landing sweep refused an adoption whose successor was already closed, a later bare sweep accepts it on lineage alone; a missing or non-superseding row still refuses on every replay.\" The remedy this finding asks for (acceptance evidence produced at successful consumption) is D-001's recorded rejected alternative, a durable consumed marker, which adds a new carrier with authority over the sweep's re-point."

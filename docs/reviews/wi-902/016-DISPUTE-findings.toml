finding = "[MAJOR] DevStg-Tests / B2 -> P5, “What it judges” and “A residual stated, not built against,” plus the matching final risk: the proposed record check accepts a close only when `mechanical_close_attestation` accepts it, although that attestor deliberately refuses any close touching a path outside `docs/work/`. The supported close calls `spec_move.move_spec`, whose inbound-link traversal rewrites and stages Markdown links throughout the repository. Thus an otherwise valid adopting disposition with an inbound link in, for example, a plan or a log fragment produces a genuine machinery close that this new rider rejects at integration. This is a reachable D1 gap, not merely a request for broader peel coverage: the attestor previously declining to peel only required review, whereas P5 turns the same case into a record-admission refusal. P5's proposed “a person re-closes it” supplies no valid route, since hand closes are expressly rejected by P5 and forbidden by P7. -> Give record admission a close-verification rule that admits the machinery's supported exact inbound relinks while retaining record/request and parent-tree validation; it need not broaden review peeling. Add a real-close regression with an inbound link outside `docs/work/`, and demonstrate that its record passes the lane rider and squash hook while a hand-written record still fails. -> @WI-902-implementer"
position = "Nothing is contested. The coordinator takes no side; the plan cap routes this MAJOR from the second critique to the sitting."

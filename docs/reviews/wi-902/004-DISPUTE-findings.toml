finding = "- [MAJOR] project-trajectory/scripts/intake.py:2562 -> K1/B1: _standing_successors treats an exact title match as proof of prior mint identity, then imports every Supersedes target from that row instead of resolving the current draft's intended lineage; a same-title WI-040 superseding WI-009 makes a successful WI-005 disposition sweep rewrite WI-009's waiter to WI-040 alone, omitting its other successor WI-042 and admitting the waiter when only WI-040 is done; before this range the unrelated waiter was unchanged -> resolve deduplicated successor identity and intended lineage together at the single owning mint boundary before constructing any successor set, refuse ambiguous or mismatched authored matches without dependency writes, and add the real-flow collision regression plus applicable child re-attestation while preserving parent acceptance and enduring tests; this is validation at the genuine authored-registry/draft trust boundary under PROCESS.md section 3, following antidote's \"smallest change that makes this fix unnecessary\" question rather than a downstream compensating guard -> @Software Engineer"
position = "Reproduction: confirmed. I ran a throwaway test at `C:/Projects/ai-template.wt/review-tmp/2026-10-11-leg02/r3-collision/test_collision.py` against lane HEAD 69c123798, with no lane files changed. In the fixture, WI-040 is titled \"Continue WI-005 by another route\" and supersedes WI-009. WI-042 also supersedes WI-009, and WI-041 needs WI-009. The disposition of WI-005 drafts that exact title and adopts WI-020. The real `intake_after_merge` printed `re-pointed queued/WI-041-waiter9.md's edge(s) WI-009 -> WI-040` and returned `([], None)`. WI-041 now needs `WI-040` alone, which drops WI-042, and WI-021 needs `WI-020` alone. Reading the code shows a second, older loss that the probe also exercises: the dedup existed before this range, and it silently swallows the disposition's own draft. So WI-005's drafted successor is never minted, and nothing refuses.\n\nPosition: FIX. An exact-title match proves identity only when the lineage matches too. `_standing_successors` should resolve both together at the mint, before any successor set is built:\n- Draft with `supersedes`: if exactly one registry row has its title and that row's recorded `supersedes` equals the draft's, the row is standing. It joins the lineage with the draft's intended `supersedes`, and its allocation is skipped.\n- Mismatch refuses: a title match whose `supersedes` differs, or more than one row with that title, refuses the whole mint before any write, and the refusal names the rows. The merge stands, exit 1, as for every other refusal.\n- Draft without `supersedes`: keeps today's allocation-only dedup and contributes no lineage. Census, amendment and re-judge rows are unchanged.\n\nThe refusal also closes the older silent swallow, because a coincidental title can no longer make a successor vanish. The review threat model covers this case: a same-title row is agent-written repository content, not a tampered host. Regressions to add: the collision probe above, which should refuse with no dependency writes; a duplicate-title refusal; the existing mixed and drafts-only replays, which should stay green. This costs about three lines in intake.py and one helper branch, with no caller-side guard."

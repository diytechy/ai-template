[[finding]]
id = "DC"
held_by = "coordinator"
finding = "[MAJOR] project-trajectory/scripts/intake.py:1851 -> F1, K1/B1: _landing_commit treats the oldest visible path-touch as a proven landing even when it is a shallow boundary. Git treats that boundary as a root and reports existing paths as introduced there. Reproduced on actual bare sweep: an accepted adoption followed by ordinary successor completion remains exit 0 on full history but becomes exit 1 in the native shallow repository; a previously refused adoption can instead become exit 0 and re-point WI-021 under a newer open-state snapshot. This violates ruling 009's stable accepted/refused verdict and the spec's unknown-landing refusal -> Make the owning landing-reader return only an established disposition landing or unknown, refusing when a shallow boundary prevents establishing that event; preserve SR-148 approval and IF-244's refusal contract, add a real shallow-boundary regression and carry/re-attest the child semantics. This validation is owed at the external Git-history trust boundary under PROCESS.md §3; the construction should follow .agents/skills/antidote/SKILL.md's \"the smallest change that makes this fix unnecessary\" question, with incomplete history represented as unknown rather than an eligible SHA -> @kit-builder"
position = "Coordinator: not contested on the merits; neither the builder nor the coordinator disputes the reproduction. Routed to this sitting because it is the third review round of one finding class, replay eligibility of an adoption (review 001 F1, review 008 F1 ruled FIX at sitting 009, now review 010 F1), and the cycle sends a third-round class to the adjudicator before another build round. The coordinator will build whichever ruling comes back."

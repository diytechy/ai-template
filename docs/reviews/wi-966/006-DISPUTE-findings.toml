- [MAJOR] project-trajectory/scripts/bootstrap.py:939 -> **Issue.** The lane makes inline tables and dotted keys valid in the policy file (IF-037 `data`, SR-031 AC, and RESYNC_PACK.md:9967 "may now hold any valid TOML", which even gives `policies = { privacy_check = true }` as its example). But bootstrap's in-place writer `set_process_key`/`_locate_process_key`, an IF-037 consumer, still finds `[section] key` by line shape, and its docstring at :944-946 still claims the convention "this file owes the git hooks". I drove the documented in-place route on an inline `policies` table: `bootstrap.py --privacy-check true` exits 0 and prints `privacy-check: true` while writing nothing, and the hook answer stays `privacy=off`. That is a silent fail-open of a requested privacy gate on a kit route. `--migrate-config`, which bootstrap runs on every scaffold pass, appends a second `[policies]` header, leaves the file unparseable, and deletes the legacy file under a green `migrated:` line. This is a Done-when gap in items 1 and 2: "no kit reader ... reads a policy file by its line shape" and "read as the TOML parser reads it, by every reader". **Concrete change.** Make the writer answer through the one parse. When the parse places the table but no `key =` line under a bare `[section]` header names it, `set_process_key` refuses with a message naming the form, rather than returning a "missing" that callers drop or appending a duplicate header. `apply_privacy_check`/`apply_push_policy` must surface that refusal instead of printing success. Also correct the stale docstring, and qualify the RESYNC entry's "any valid TOML" for the bootstrap flags. **Why the clause adds a check rather than making the state unrepresentable.** The unrepresentable fix is a TOML writer, which stdlib lacks (`tomllib` is read-only, and a writer dependency would need a ledger row). The other way, re-narrowing the file's shape, is the rule this WI retires. So the single owning boundary is the writer checking its target against the one parse (antidote: the smallest change that makes this fix unnecessary is not available inside this diff). Rubric K1. @owner convergence-class: yes
'''

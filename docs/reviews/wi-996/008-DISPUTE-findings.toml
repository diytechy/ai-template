[[finding]]
id = "LAND"
held_by = "coordinator"
finding = "- [MAJOR] project-trajectory/skills/coordinator-cycle/references/recipes.md:809 -> The landing arm lives only in `integrate.refresh`, but this repository's own attended landing route never runs a refresh. It squashes with `git merge --squash <lane>` and runs only the commit bar (`run.cmd smoke`: the strict lints, check_docs, check_resync and the smoke tier) on the staged squash. `grep` finds no red-mark reader in project-trajectory/hooks, .githooks or any bar step. Recipes §8 \"Close a lane partial\" then says \"land the lane\" by this same route. So a lane closed partial after its attested tests-first commit, with that commit kept, lands its strictly marked red tests on trunk. Those tests pass the smoke bar while red. That contradicts SR-156's new AC sentence (\"a composed tree holding one is refused\") and PROCESS.md §4's \"never landed\". Every later loop lane's refresh is then refused for a file it never touched (the spec's own S1 cost). The SKILL.md:221 sentence \"A refresh refused for a mark ends in the code commit or a quarantine\" can never fire on this route (rubric K1). -> Run the landing arm on the attended landing too: a recipes §3 Squash step, or a commit-bar step running `kitlib.red_mark.landing_refusal` on the staged squash, refusing before the commit. Or route attended landings through `integrate.py refresh`. Why not unrepresentable: making it so needs a single owning landing boundary (every trunk advance through refresh and the merge slot), and the hand-squash route is a repo-wide convention beyond this diff's scope -> @owner convergence-class: yes"
position = "Coordinator, taking no side: the finding is an open MAJOR at the gate (a convergence round), so the cycle routes it here. A read of the repository confirms the facts it starts from: the red-mark landing arm is read only inside the integrator's refresh; no hook under project-trajectory/hooks or .githooks and no declared bar step reads it (docs/stack.ini holds only the declaration); the coordinator's hand landing (recipes section 3) squashes with git merge --squash and runs the commit bar on the staged squash, never a refresh; and recipes section 8's partial close keeps or discards each lane commit by the coordinator's own keep_commits and discard_commits lists, then lands by that route. The sources in tension, for the sitting to weigh: the Done-when names the refresh ('The refresh refuses a tree whose tests root holds a mark ... on both landing and no-bar') and the coordinator-cycle text; the spec's Trust consumer table lists the merge slot, the quarantine and the procedure text, and does not list the hand squash; SR-156's sentence as blessed in sitting 005 says 'a composed tree holding one is refused'; PROCESS.md section 4 says a marked test is never landed. The reviewer tags it convergence-class and offers three remedies: a recipes section 3 squash step, a commit-bar step running the landing arm on the staged squash, or routing attended landings through the refresh. The one-landing row that would move the coordinator's landings onto the merge slot is filed and not built."

position = "Held by the coordinator, who takes no side on the merits and routes it because the cap sends every open BLOCKER or MAJOR of the convergence round to one dispute sitting, and the reviewer tagged it convergence-class, which is advice to this sitting. Facts for the sitting: (1) this is the class dispute sitting 004 ruled as RB1-F1 (docs/reviews/wi-976/004-ADJUDICATE-81e623b.md, accepted): SUCCESSOR, not convergence-class, the successor to make both routes widen by the authoring work item's declared tags; the convergence reviewer never sees earlier verdicts, so it found the class afresh. (2) The lane has not changed the merge-mint route or the widening rule since sitting 004; the fix round between changed the author prompt's HATS rule and a RESYNC sentence only. (3) The round's probe (its scratch probe2.py) composes an amendment of SN-036 from an invented authoring row (Workstream scripts, SafetyClass personal-data) against the minted shape (process, adjudication); for WI-976's own tags (Workstream process, SafetyClass ordinary) the coordinator composed both shapes and they give the same eleven hats, for an amendment of SN-036 and of SN-036 with SR-161, so this lane's own checkpoint sitting is not affected. (4) The reviewer's fallback remedy, inside the spec's surface, is to state in LLR-360 and the RESYNC entry that a trunk-minted sitting is widened by no work-item tags and to stop widening by the adjudication row's own tags; its primary remedy is the one sitting 004 gave the successor. (5) No code gates on the hat block: a missing outcome is a review finding, never a check (the 2026-09-06 ruling)."

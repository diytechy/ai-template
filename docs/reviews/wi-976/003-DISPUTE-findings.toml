# The dispute over REVIEW-B round 1's F1 (docs/reviews/wi-976/002-REVIEW-B-de132d7.md), routed before counted round 2 (wi-976 D-005).
range = "aa36a5b6e2bc47fe9960bbc4a0727c04c9571f36..49a47d3b563ee95a920687601e3b70fcfc434003"

[[finding]]
id = "RB1-F1"
held_by = "coordinator"
finding = "- [MAJOR] project-trajectory/scripts/plan_briefs.py:445 -> The hat set depends on which route composed the sitting. `sitting_hat_block` widens each parent need by the tags of the row being composed. In the coordinator's in-lane route (`compose_lane.py`) that row is the authoring work item. In the kit's own merge-mint route (intake.py:934 for first approval, :830 for amendment, then `agent_loop.py:406` `compose`) it is the minted adjudication row, whose `Workstream` is hard-coded to `process` and which carries no reference to the authoring work item. So the same Drafted SR gets a different hat set depending on the route. Measured over this repo's rows: for 109 work items with a non-`process` workstream, `sitting_hat_block(row=<authoring WI>, [its SR])` differs from the minted-row shape. For example, WI-006 (`scripts`) and SR-157 gain CROSS-PLATFORM only in-lane, and `unattended` lanes lose UNATTENDED-OPS in the minted route. Neither route nor any test says which work item's tags LLR-360 means. This is SN-036's own failure: an applicable perspective silently not put. (K1) -> Make the widening source one fact both routes share. Either the first-approval and amendment mints carry the merged lane's `Workstream` and `SafetyClass` onto the row they mint, or LLR-360's detail and the two templates' `{hats}` notes state that the composing row's own tags widen the needs and the in-lane route composes with the same. Add a test that composes the minted row shape. -> @owner"
position = "Held by the coordinator, who takes no side on the merits and routes the finding for a ruling (FIX in this lane, SUCCESSOR, DISMISS or ESCALATE). The lane's builder confirmed it on the real path and held its remedy, reporting verbatim: \"It reproduces. confirm/confirm_route_tags.py compares, for every work item with SR-Refs, the hat set its first SR gets under two row shapes: the authoring work item's row (the in-lane route, scripts/coordinator/compose_lane.py, which only overrides Brief, Adjudicates and SR-Refs); the minted row's shape (the merge-mint route: intake._first_approval_drafts / _amendment_drafts hard-code workstream: \\\"process\\\", and _draft_row sets SafetyClass to the kind adjudication; agent_loop.session_body:406 then composes from that row). Measured: the sets differ for 109 of 403 work items. Only in the in-lane route: CROSS-PLATFORM (53) and UNATTENDED-OPS (8). Only in the merge-mint route: FIRST-RUN-ADOPTER (50), because its process tag matches. Whose tags each route uses today: the in-lane route uses the authoring lane's own Workstream and SafetyClass. The merge-mint route uses the minted adjudication row's (process and adjudication), which carries no reference back to the authoring item. Three possible remedies: (a) The mints carry the merged lane's tags. Sites: intake._amendment_drafts, _first_approval_drafts and _draft_row; intake_after_merge passes branch through to resolve the merged item; tests in the intake suites. Cost: medium to high. SafetyClass on a minted row means adjudication and routes it, so the lane's class needs a new cell or field, not that one. Workstream process may drive concurrency rules. A sweep --before/--after run has no branch, so its rows would still differ unless the item is found from the commits. (b) State that the composing row's own tags widen the needs, and make the in-lane route compose with the minted shape. Sites: LLR-360's detail (row text, so the spine sitting), the two templates' {hats} notes, about 3 lines in compose_lane.py, and one test. Cost: low in code. But every sitting then gets FIRST-RUN-ADOPTER and loses lane-specific hats like CROSS-PLATFORM. (c) Drop the work item's tags from a sitting's widening altogether. Sites: about 1 line in plan_briefs.round_questions; LLR-360's detail; the spec's Done-when (widened by the work item's tags). Cost: the least code, but it changes ruled row text and the spec.\" Facts for the sitting: the spec's named surface (its Architectural delta) is the roster reader, the sitting-brief composer, the planner briefs' applicability function and the coordinator's prompt filler, not the merge-mint route; the Done-when reads 'Applicability is computed from the roster for each parent need ..., widened by the work item's tags and never merged across sibling needs, the rule the dual-plan planner already uses'; no code gates on the hat block (a missing outcome is a review finding, never a check, per the 2026-09-06 ruling); and this lane's own checkpoint sitting composes in-lane over WI-976, whose tags the measurement shows agree with the minted shape for its SRs."

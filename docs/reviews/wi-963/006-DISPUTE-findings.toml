finding = "[MAJOR] project-trajectory/scripts/acceptance_record.py:1169 -> A routed traced change made after a row's act is silently dropped when a later act in the same range copies that registry for a different row. `copy_live` refreshes a whole registry, and a traced-cell refresh needs no authority (IF-123). So \"the row equals its snapshot copy at `after`\" does not prove that the re-attesting act judged the row's routed traced cells. Reproduced through the real act producer: SR-001 amended, then act A re-attests SR-001, then SR-001's `SN-Refs` is re-pointed and SR-002 is amended, then act B re-attests only SR-002. intake_after_merge then mints nothing, where the pre-filter mint files SR-001 and SR-002. The SN-Refs re-point is never adjudicated by anyone. This is a supported multi-checkpoint lane: in-lane acts on one registry, including the closing Status-flip act, which copies its registry. It breaks the Done-when \"a row re-attested in the range and then amended again after its act still yields its amendment row\" -> Bind the comparison to the copy the re-attesting act itself wrote. Compare the row at `after` with its copy at the commit that added the latest range entry re-attesting it, and treat a later copy write of that registry by an act that does not re-attest the row as unsettled. Add a regression with two acts on one registry and a routed traced edit between them. This tightens the filter's own condition rather than adding a guard elsewhere. The state cannot be made unrepresentable inside this diff, because the snapshot by design absorbs traced drift without authority (IF-123's refresh contract), so a copy at `after` cannot carry per-row judgement for traced cells (antidote: the smallest change that makes this unnecessary would be the act ledger recording what it judged per row, outside this row's scope). Rubric K1: LLR-342's detail states an equality that does not prove settlement -> @owner convergence-class: yes"
position = "Nothing is contested: the coordinator takes no side on this finding, and the gate's open MAJOR routes it to this sitting."

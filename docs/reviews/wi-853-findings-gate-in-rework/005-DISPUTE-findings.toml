[[finding]]
id = "ROUNDS"
held_by = "coordinator"
finding = '''
project-trajectory/scripts/plan_coverage.py:485 — Separate dispute rounds contaminate each other when they reuse finding IDs. Confirmed: an accepted dismissal of the current review's F2, with its matching findings file beside the verdict, passes with exit 0. Retaining an earlier round's findings file and accepted verdict in that same lane directory, also requesting F2 but concerning another issue, changes the current plan's result to exit 1. `_ruled_texts` gathers both rounds' text; `_correspondence_problem` at line 510 rejects their disagreement. This blocks a valid dismissal during ordinary repeated review rounds, contrary to SR-236's acceptance and Done-when's resolved-dispute pass condition. The cited verdict needs correspondence to its particular findings input; shared IDs do not establish that relationship.
'''
position = '''
Real, and the second full-lane round on one class: tying a cited dispute ruling to the finding it excludes. Round 1 (sol-853-r1) found the opposite hole, fail-open: a `#<id>` fragment or another round's same-id ruling cleared an unrelated finding. The builder closed it in bbacb7de by matching finding TEXT across every findings file beside the verdict whose ids equal the binding's requested ids, and required all such files to agree, choosing to fail closed because nothing in the repo records which findings file a dispute verdict ruled (the `.requested` binding holds only the brief class, the requested ids and the outcome). The builder flagged exactly this trade-off; Sol now confirms it bites when two dispute rounds in one lane reuse ids such as F1/F2. Accepting ANY agreeing file instead would reopen the fail-open hole, so the only sound fix is to record the link: the dispute brief's request line (or the binding the entry point writes at reservation) records the findings file the sitting read, and the coverage gate reads exactly that file. That touches the dispute grammar (kitlib/dispute, IF-290), the binding (kitlib/sitting render/read, LLR-310), the brief composer and the entry point, plus their rows and tests: a cross-module change about the size of this lane's own code change, another sitting, and another full-lane review on a Codex budget that has run out twice this night. Two routes, coordinator neutral with a slight preference for (a) because it is the class fix and the lane is open: (a) FIX in this lane by binding the findings file into the sitting's binding, older bindings without it failing closed; or (b) DISMISS not-worth-cost for this row: the present behaviour fails closed, never open (a valid dismissal is refused, nothing unresolved passes), the skill states the workaround (finding ids unique within a lane's disputes), and a follow-up row is filed to bind the findings file. Either way the ruling settles the class for this lane.
'''

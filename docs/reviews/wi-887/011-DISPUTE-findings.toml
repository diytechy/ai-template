range = "b3ef42844..1e11dd4deba8b118a3783446e518b79504ace64d"

[[finding]]
id = "DC"
held_by = "coordinator"
finding = "- [MAJOR] project-trajectory/scripts/session_keep.py:429 -> [K1] the new single record reader accepts a malformed nested lease because _ENVELOPE checks only that lease is a dict: after a real REVIEW call, replacing its lease with {\"holder\": [], \"until\": a future epoch} still makes store_load return the active record; retire_stale_lease leaves the future lease intact, _lease_held turns its falsey list holder into no holder, and the next service call emits --resume for the original transcript. This violates SR-239/LLR-270/IF-247's malformed-record-means-no-session contract and treats uncertain leased state as safe to resume -> validate the lease's consumed holder/deadline shape at _read_record's owning JSON boundary, rejecting malformed leases as no record, and add a service-level regression asserting a fresh transcript for this case; re-attest any changed child contract content. This is validation at the spec-declared trust boundary: serialized JSON can express shapes an in-memory type cannot exclude, so that boundary must validate once and downstream lease code can trust it (antidote SKILL.md, \"What is the smallest change that makes this fix unnecessary?\") -> @implementer"
position = "Contested. Dispute 008's final ruling on DA (docs/reviews/wi-887/008-ADJUDICATE-*.md) directed the remedy for this same class, record-shape validation at the store's read boundary, and stated that 'nested lease values are already guarded at their consumers and need no change'. This finding re-raises the nested lease, now the fourth review round of the class. Its reproduction requires hand-writing a lease whose holder is a JSON list into the retention store under out/ (gitignored runtime state written only by session_keep under store_lock, through a temporary file and a replace), which no producer in the kit writes; under PROCESS.md section 6's review threat model a finding whose reproduction needs a tampered host file is dismissed. The coordinator asks the sitting to rule DISMISS (refuted by 008, or out-of-scope under the threat model) or FIX."

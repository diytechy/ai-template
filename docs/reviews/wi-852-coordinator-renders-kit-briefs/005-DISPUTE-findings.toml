range = "a0cb7226..e3be3eec"

[[finding]]
id = "A"
held_by = "coordinator"
finding = "project-trajectory/scripts/review_brief.py:385 \u2014 The attended filing boundary still accepts malformed verdicts. A bound review containing `VERDICT: APPROVE findings=0` followed by `verdict: CHANGES-REQUESTED findings=0` exits 0 and creates a record; the rollup reports CHANGES-REQUESTED because its reader recognizes the second declaration. Filing also accepts `VERDICT: APPROVE findings=0 CHANGES-REQUESTED` and `VERDICT: APPROVE findings=0 findings = 7`. The boundary checks selected tokens rather than the complete grammar, contradicting SR-235\u2019s malformed-verdict refusal. Make attended filing reject malformed or additional verdict declarations and unexpected tokens. This concerns the new filing boundary, not WI-870\u2019s deferred shared-reader changes."
position = "Real and in scope (agent-written model output), and the third full-lane round in a row to find this class at the filing boundary (round 1: prefix matching and an ignored second line; round 2: a duplicated field; round 3: a case-variant second line, extra tokens, a spaced field). Each round was patched by checking selected tokens. The coordinator's position: the defect is the approach, not the instance. The boundary should accept exactly one complete canonical machine line (VERDICT, one label from the enum, one integer findings= field, nothing else) and refuse any other line whose keyword matches VERDICT case-insensitively, which is a whole-grammar check, not a further token patch. The shared reader's laxity stays with WI-870. The alternative is to land WI-852 with this filing gap recorded for WI-870, since only the coordinator files by hand today; the coordinator does not prefer it, because SR-235's malformed-verdict refusal would then be untrue as approved."

[[finding]]
id = "B"
held_by = "coordinator"
finding = "project-trajectory/scripts/review_brief.py:439 \u2014 Filing on the valid branch `rollup` loses the accepted review. The command exits 0 and writes `docs/reviews/rollup/001-REVIEW-A-<sha7>.md`; the rollup generator excludes that directory from its inputs. Running normal regeneration then reports `pruned 1` and deletes the review. The round-reader check does not establish that verdict reporting will retain the record. Refuse scopes reserved for generated output before filing."
position = "Out of scope as contrived, in the coordinator's view. Lane branches are minted `wi-NNN` by the claim, and no supported workflow names a lane `rollup`, the generated rollup's own directory; reproducing it needs a hand-chosen branch name that collides with a generated output path. The check would be cheap (refuse scopes the rollup generator excludes), so if the adjudicator rules it in scope the coordinator would fix it in the same round as finding A."

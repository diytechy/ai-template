position = "Coordinator, taking no side: the finding is an open MAJOR at the gate, so the cycle routes it here. A read of the code confirms the fact it starts from: `dispatch.py`'s parked arm admits every claimed branch `_parked_branches` lists, and that reader consults no schedule, so a claimed row citing a pending item is resumed on the unattended route. The sources in tension, for the sitting to weigh: the claim copy's Trust says `a claimed one draws no worker assignment`, and also `Nothing reads an open item or a needs edge to keep, drop or release a claim, and this row adds no such reader (call 7)`; the owner's call 7 forbids a detector for a session that stopped and filed nothing; the reviewer tags it convergence-class. The reviewer's remedy adds a schedule read to the resume admission, a module the spec's consumer list keeps unchanged; its alternative states in section 5 and the Trust section that an unattended run closes such a lane. The Trust sentence names the claim side and the row's Done-when does not name dispatch. The coordinator's own lanes do not use this route."

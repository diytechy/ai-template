finding = "[MAJOR] DevStg-Tests/B2 -> `docs/plans/WI-925/plan.md`, P5 `_relink_remap(entries)` and its D8 coverage: the remap recognizes only `active/<branch>/` deletions paired with closed work-item additions. Deliverable 3 and D8 promise an exact inbound relink exemption for a spec move in the same staged delta. A supported close also archives a standalone spec via `spec_move.py --archive docs/specs/<name>.md` to `docs/archive/specs/<name>.<date>.md` (the module's documented close route and `docs/specs/README.md` lifecycle). If Y's Done-when links that standalone spec, the archive operation rewrites Y exactly, but P5 omits that move pair; even when X's active-to-closed move accompanies it, that different pair cannot reproduce the standalone link redirect. The supported squash landing or hand close therefore remains held despite satisfying the promised same-delta exemption: a Done-when gap under convergence stance. -> Extend the single owning move-map stage to represent the supported standalone-spec archival pairs as well as active-to-closed pairs, and add a same-delta archival-link fixture plus its real-edit variant; preserve the exact-byte and same-delta bounds. -> @implementer"
position = "Not contested on its facts. The coordinator holds no position for or against the finding: it routes it here because the plan cap requires one dispute sitting for each open BLOCKER or MAJOR of the second plan critique, and only an accepted DISMISS lets the pass record be written (the coordinator-cycle skill, plan step 4)."

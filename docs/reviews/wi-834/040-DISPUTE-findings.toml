[[finding]]
id = "R39F1"
held_by = "builder"
finding = '''
[MINOR] project-trajectory/scripts/coordinator_guard.py:1018 -> F1 (K1): During blackout, a PowerShell function definition is denied as a model launch even though it executes no model. Native PowerShell successfully defines `function Invoke-Review { codex exec --model m - }` without calling it, while the actual hook reads command words `['function', 'codex']` and denies Codex. This is ordinary helper-definition syntax, and the lane itself already requires a function definition to remain allowed in tests/test_blackout_window.py:552; the PowerShell braces split its deferred body into an apparent executable statement. -> Represent function-definition bodies as deferred syntax at the single shell-reading boundary, preserving inspection of independently executable statements, and extend TC-339's existing allowed-definition regression to PowerShell; re-attest affected child content while retaining SR-229/SR-237 and IF-275's non-launch allowance. This follows antidote's "smallest change that makes this fix unnecessary": repair the command representation at the genuine shell-input trust boundary, rather than adding a downstream denial exception. -> @builder
'''
position = '''
The builder's position (it called command_words with the powershell dialect on the current lane: `function Invoke-Review { codex exec --model m - }` segments as [function Invoke-Review], [codex exec --model m -] and reads function, codex (denied); `function Invoke-Review { echo ok }` reads function, echo (allowed); `function Invoke-Review { codex exec - }; Invoke-Review` reads function, codex, invoke-review (denied, and this line really runs codex); posix `function f { claude -p x; }` reads function (allowed). The brace reading came in round 1 (D-011, commit 73ad5743); braces as boundaries are what make executing script blocks such as `& { claude }` and `ForEach-Object { codex ... }` read correctly. A fix would track brace depth in shell_line and mark function/filter bodies as data, about 20 lines plus pins, and would make the define-and-call line `function X { codex ... }; X` read only X):

DISMISS, not-worth-cost (sitting 031's R4F1 line). The finding holds: PowerShell braces are read as boundaries (D-011, built in round 1, not by a recent round), so `function Invoke-Review { codex exec ... }` reads `codex` and is denied, though defining runs nothing. But the error fails closed: the session is told to wait until the window ends. A main session defining a model-wrapping PowerShell function during blackout is rare, and close to the wrapper case the coverage excludes. A fix (about 20 lines in the shell reader, tracking brace depth to mark function bodies as data) would turn the define-and-call line `function X { codex ... }; X`, which runs a model and is denied today, into a missed launch. Trading a fail-closed false denial for a fail-open miss is not worth it.
'''

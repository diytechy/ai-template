finding = '''
[MAJOR] project-trajectory/scripts/coordinator_guard.py:900 -> [K1, B1] The new coproc grammar shape treats NAME as metadata only before `{`, so the shipped hook newly denies the valid non-model command `coproc CLAUDE while true; do echo ok; break; done` during blackout (baseline allowed it), mistaking the coprocess variable name for a model executable; the same incomplete classification still allows `coproc WORK while claude -p x; do :; done` and `coproc WORK if codex exec -; then :; fi`, whose condition launches a model. These are Bash compound-command grammar, inside sitting 025's coverage line, not wrapper commands -> Interpret the optional coprocess name across Bash's compound-command openers at the single shell-reading boundary and add TC-339 regression cases for both actual condition launches and a model-named coprocess that runs no model, retaining LLR-300/IF-274/IF-275 and parent acceptance; citing antidote's "What is the smallest change that makes this fix unnecessary?", external shell text is PROCESS section 3's genuine trust boundary and cannot be constrained at construction here, so one owning grammar interpretation is required rather than another caller guard -> @builder
'''
position = '''
The builder's position (it called command_words on the committed round-9 code: `coproc CLAUDE while true; do echo ok; break; done` reads claude, echo, break, done and is denied, a false denial new in round 9; `coproc WORK while claude -p x; do :; done` reads work, :, done and is allowed; `coproc WORK if codex exec -; then :; fi` reads work, :, fi and is allowed, a gap present before round 9 too; `coproc WORK for i in 1; do claude -p x; done`, `coproc WORK case x in a) claude;; esac`, `coproc WORK ( claude -p x )`, `coproc WORK { claude -p x; }` and `coproc while claude -p x; do :; done` are denied. Without coproc, `while claude -p x; ...`, `if claude -p x; ...` and `until claude -p x; ...` all read claude. Narrowing to plain `coproc cmd` removes no false denial, since any coproc entry reads the next word; only removing coproc from the table restores the old behaviour, and that re-opens `coproc claude -p x`):

FIX. The finding holds: round 9 reads a coprocess NAME as metadata only before `{`, so `coproc WORK while claude -p x; ...` and `coproc WORK if codex exec -; ...` read `WORK` and run a model unseen, while `coproc CLAUDE while true; ...` is newly denied. Both are Bash grammar (`coproc [NAME] compound-command`), inside sitting 025's line, not wrappers. Named coprocesses are rare in agent commands, and a coprocess named after a model CLI is close to contrived; but the fix is one table cell: `coproc`'s NAME openers become every compound-command opener the reader keeps in a segment (`{`, `while`, `until`, `if`, `for`, `select`, `case`, `[[`, `((`), plus three TC-339 pins. Narrowing to plain `coproc cmd` would not remove the false denial, since any coproc entry reads the next word. Residual: the reader splits at `(`, so `coproc NAME ( ... )` reads NAME; its body is still read, and only a model-named coprocess is over-denied.
'''

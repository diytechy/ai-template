[[finding]]
id = "F1"
held_by = "coordinator"
finding = "- [MAJOR] project-trajectory/gitignore.template:43 -> In an adopter repo, a lane resumed after REVIEW-OWED (exit 9) has its owed round refused as a red round even when its bar is green. The shipped template ignores `out/run-logs/` and the locks but not `out/review-owed`. That marker is written in the lane worktree at exit 9 and cleared only when a round completes. `integrate.attest`'s clean-worktree preflight lists it as dirt, so the draw gate (project-trajectory/scripts/agent_loop.py:3397) and `attest_build` (:2482) record a red with the cause \"holds work the index does not (out/review-owed)\". Every later build stays red until a builder deletes or commits the marker, so the lane can reach the cap and close partial. Probe 1 drove this. This repo's own `.gitignore` ignores all of `out/`, so the suite cannot see it. `review_owed_marker` and integrate's residue comment both assume the file is gitignored. -> Add `out/review-owed` to `gitignore.template`, with a RESYNC line telling adopters to add it. This makes the dirt unrepresentable instead of exempting it at the attest preflight, so no new guard. Add a regression case running the review gate under the template's ignore set with a marker present. (K1) -> @owner convergence-class: yes"
position = "The coordinator contests nothing: this MAJOR is the one open BLOCKER or MAJOR after the gate, a convergence round over the checkpoint tip, and the cycle routes every such finding to one dispute sitting (the reviewer tags it convergence-class). The coordinator takes no side on its reach or its remedy."

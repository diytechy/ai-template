# Self-tests for the kit: every script is exercised against a real temp
# scaffold, so a green run means the documented quick-start actually works —
# on all three desktop OS families (Linux, Windows, macOS) and on the oldest
# Python the kit claims (3.11).
name: kit-tests
on:
  push:
    # EVERY branch, not just `main` (WI-278 / OI-8 ruled 2026-07-25). The
    # development branch had run ~845 commits with NO hosted CI, because a
    # branch push only triggered a run while someone kept a PR open — and the
    # 2026-07-25 DevStg-Impl sitting proved what that costs: an entire test layer
    # (`agent_loop_*`) could not execute on the owner's machine at all, so the
    # local gate was green over a blind spot only an independent environment
    # sees. A push trigger is repo state that travels with the branch and
    # cannot lapse; naming individual branches would just re-lapse at the next
    # one. (The shipped reference, project-trajectory/ci/check.yml, already
    # covers `llm/**` for the same reason.)
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# The root conftest.py hard-caps a local test run at 50% of the machine (a named
# Windows job object) so a developer's desktop stays usable while the suite runs.
# CI is the opposite case: an ephemeral runner nobody is sitting at, with far
# fewer cores, and a smoke-budget job below that reports the tier's seconds.
# Halving throughput here would buy nothing and would only slow every job, so
# the cap is off for every job in this workflow.
env:
  PYTEST_CPU_CAP: "off"

# One live run per ref: stacked pushes cancel the superseded run instead of
# queueing five redundant matrix cells behind it (M-27).
concurrency:
  group: "test-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ONE run per commit (WI-278). With `push: ["**"]` above, a same-repo branch
  # is already covered by its push event, so the `pull_request` event would
  # otherwise double every job — the two events carry different `github.ref`
  # values (`refs/heads/x` vs `refs/pull/N/merge`), so the concurrency group
  # cannot dedupe them. The guard keeps `pull_request` earning its keep for the
  # one case push cannot see: a FORK's PR, whose branch never lands here.
  # Repeated per job because GitHub Actions has no YAML anchors.
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.x"]
        exclude:
          # The 3.11 floor is a language/stdlib guarantee (platform-agnostic,
          # already covered on Linux + Windows); macOS's job is the OS-specific
          # behavior (fcntl.flock, paths, git worktrees), which doesn't vary by
          # Python version — so macOS runs on current Python only. (3.11 has
          # arm64 macOS builds, so this exclusion is now a coverage call, not a
          # runner-availability workaround.)
          - os: macos-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    # The suite spawns coordinator loops/pollers with real timeouts; a wedged
    # run must never burn GitHub's 360-minute default per matrix cell (M-27).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # full history: the old-kit re-sync test scaffolds from a pinned older kit commit

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      # The kit scripts themselves are stdlib-only; these tools are what the
      # harness tests drive — CONSTRAINED in requirements-dev.txt (WI-104), the same
      # file scripts/dev-setup installs, so every machine runs one machinery and
      # a tool major can't turn the suite red unannounced (canary.yml floats
      # latest on a schedule to catch that early). pytest-xdist runs the suite in
      # parallel (WI-075) — the same `-n auto` command developers and the gate job
      # run, so all three OSes also exercise the parallel path.
      - name: Install test tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Run kit self-tests
        run: python -m pytest -q -n auto

  # WI-281, WI-940: the smoke tier's seconds, reported. The DETERMINISTIC
  # membership ratchet (tests/test_smoke_budget.py) is the machine-independent
  # floor and already runs in the test job above; THIS job runs `-m smoke` once
  # under the budget step in warn mode and prints its CPU seconds and wall time
  # against docs/stack.ini [smoke-budget] cpu-seconds and wall-seconds, with a
  # WARN annotation for a limit over. No bar fails on the tier's seconds: the
  # run menu's audit (docs/stack.ini [run] audit) judges them, by hand and at
  # phase close. A red tier still fails this job with the tier's own code. The
  # CPU budget is stamped on one workstation and applies everywhere, so a WARN
  # here is a finding for the owner, not a re-stamp (the step's docstring owns
  # the meters and their bounds). One lane: this is a timing signal, not a
  # portability check.
  smoke-budget:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # full history: the old-kit re-sync test scaffolds from a pinned older kit commit
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"
      - name: Install test tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Report the smoke tier's seconds against its budget (warn)
        run: python scripts/check_smoke_budget.py --mode warn

  # The kit self-adopts its own gated process (IMPROVEMENT_PLAN.md Thread 47): this
  # job runs the kit's OWN check.py at the stage docs/stage declares — the same bar
  # a contributor runs locally.
  #   WHAT THAT ACTUALLY ENFORCES, corrected 2026-08-20 (WI-473, repo review C-01):
  # the plan is SELECTED BY THE DERIVED STAGE — every step whose declared
  # `from-stage` sits at or below it — so this job enforces what the spine has
  # earned and NOT a fixed list. At today's DevStg-Arch that is registry
  # integrity, derived-stage freshness, vocabulary, need-form, privacy,
  # doc-navigability, the generator freshness checks and staged divergence.
  # `format`, `lint` and `tests+coverage` declare `from-stage = DevStg-Impl` and DO
  # NOT RUN HERE until this repo's settled spine reaches that rung.
  # The previous wording claimed all nine unconditionally
  # and was false in both directions; it read as enforcement that the `test`
  # matrix job above (the full pytest suite, every OS/py) was actually providing.
  # A downstream adopter has no such matrix — which is what WI-473 is about.
  # One platform: the matrix above already proves cross-OS/py portability; the gate
  # is a code-quality bar (coverage, lint, trace), not an OS-dependent one.
  gate:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # full history: the old-kit re-sync test scaffolds from a pinned older kit commit
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"
      # Same CONSTRAINED toolchain as the test job (requirements-dev.txt, WI-104) so
      # the gate a contributor runs locally and the gate CI runs are the same
      # machinery. pytest-xdist is required here because the gate runs
      # docs/stack.ini's declared test command, which is `pytest -q -n auto`
      # (WI-075); check.py does not SKIP-guard the `-n` flag (only `-m <module>` /
      # `--cov` deps), so a missing xdist would fail the tests+coverage step
      # rather than skip.
      - name: Install harness tooling
        run: python -m pip install -r requirements-dev.txt
      # --jobs 0 runs the gate's independent steps concurrently (output is
      # captured per step and printed whole, so the log never interleaves);
      # the light process checks overlap the long tests+coverage step.
      - name: Run the kit's own gate (docs/stage)
        run: python project-trajectory/scripts/check.py --jobs 0

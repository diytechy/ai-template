# Self-tests for the kit: every script is exercised against a real temp
# scaffold, so a green run means the documented quick-start actually works —
# on all three desktop OS families (Linux, Windows, macOS) and on the oldest
# Python the kit claims (3.8).
name: kit-tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.x"]
        exclude:
          # macos-latest is arm64, which has no CPython 3.8 build. The 3.8 floor
          # is a language/stdlib guarantee (platform-agnostic, already covered on
          # Linux + Windows); macOS's job is the OS-specific behavior (fcntl.flock,
          # paths, git worktrees), which doesn't vary by Python version — so macOS
          # runs on current Python only.
          - os: macos-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The kit scripts themselves are stdlib-only; these tools are what the
      # harness tests drive (the same set scripts/setup installs downstream).
      - name: Install test tooling
        run: python -m pip install ruff pytest pytest-cov

      - name: Run kit self-tests
        run: python -m pytest -q

  # The kit self-adopts its own gated process (IMPROVEMENT_PLAN.md Thread 47): this
  # job runs the kit's OWN check.py at the gate docs/gate declares — the same bar a
  # contributor runs locally, so CI enforces format · lint · tests+coverage ·
  # traceability · privacy · doc-navigability · perf-budgets · flows · arch-map.
  # One platform: the matrix above already proves cross-OS/py portability; the gate
  # is a code-quality bar (coverage, lint, trace), not an OS-dependent one.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install harness tooling
        run: python -m pip install ruff pytest pytest-cov
      - name: Run the kit's own gate (docs/gate)
        run: python project-trajectory/scripts/check.py

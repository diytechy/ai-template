# Hash-pinned CI-lock staleness check (repo-review 2026-08-19 L-04). requirements-dev.txt
# deliberately stays a human-maintained COMPATIBLE-RELEASE range (WI-104): patch/minor
# fixes flow without a review round. The cost L-04 named is that the range is not a
# byte-reproducible lock, so a historical CI failure's exact resolved environment
# cannot be reconstructed. requirements-dev-lock-3.11.txt and
# requirements-dev-lock-3.x.txt are that reproducible record — hash-pinned,
# `--universal` (one file valid on every OS the test.yml matrix runs), generated by
# `uv pip compile` (docs/dependencies.md, Kind=python/Tier=coordinator) — one per
# supported Python (the same two labels test.yml's matrix already uses).
#
# This job does NOT auto-commit the refresh. docs/process.toml's `[policies] push =
# "human"` states the repo-wide rule this would otherwise cut against ("an agent
# never pushes, even if asked"), and the 2026-08-18 staged-divergence step
# (docs/log.d/2026-08-18-divergence-step.md) exists specifically because a
# mechanically-regenerated artifact committed without a human looking at the diff is
# how this repo's worst false-green incident happened. So instead: regenerate both
# locks fresh, diff against the committed copies, and FAIL LOUDLY if either moved —
# same posture as canary-latest, a heads-up on its own schedule rather than a
# surprise red on an unrelated PR. The freshly regenerated files are uploaded as a
# build artifact either way, so acting on the finding never requires re-deriving the
# command by hand.
#
# Triggered by EITHER weekly job finishing (canary-latest for compatibility,
# python-sca for advisories) — "refreshed after the canary/SCA pass" per the review.
# GitHub Actions' workflow_run has no AND-gate across two prerequisite workflows, so
# this is an at-least-one-of trigger, not a strict "both passed" gate; a canary/SCA
# failure that same week is independently visible in its own run, not swallowed here.
name: lock-check
on:
  workflow_run:
    workflows: ["canary-latest", "python-sca"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Mirrors test.yml's [python] arm labels exactly (docs/stack.ini
        # [ci-tiers] convention: one shared label vocabulary between what runs
        # and what is locked).
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }} # same label test.yml's own matrix installs
      - name: Install uv (docs/dependencies.md, Kind=python/Tier=coordinator)
        run: python -m pip install uv
      - name: Regenerate the lock for this Python label
        # --custom-compile-command pins the recorded header to the matrix LABEL
        # ("3.x") rather than whatever exact minor setup-python resolved today,
        # so the header stays byte-stable across refreshes and the body (the
        # part that matters) is the only thing a real dependency/Python bump
        # can move.
        run: |
          uv pip compile requirements-dev.txt --universal --generate-hashes \
            --python-version "$(python -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')" \
            --custom-compile-command "uv pip compile requirements-dev.txt --universal --generate-hashes --python-version ${{ matrix.python }} -o requirements-dev-lock-${{ matrix.python }}.txt" \
            -o "requirements-dev-lock-${{ matrix.python }}.fresh.txt"
      - name: Compare against the committed lock
        run: |
          diff -u "requirements-dev-lock-${{ matrix.python }}.txt" \
                  "requirements-dev-lock-${{ matrix.python }}.fresh.txt" || {
            echo "::error::requirements-dev-lock-${{ matrix.python }}.txt is stale."
            echo "Regenerate locally with the command recorded at the top of the file"
            echo "(or re-run: uv pip compile requirements-dev.txt --universal --generate-hashes --python-version <ver> -o requirements-dev-lock-${{ matrix.python }}.txt)"
            echo "and commit the refresh — this job deliberately does not commit for you."
            exit 1
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: requirements-dev-lock-${{ matrix.python }}-fresh
          path: requirements-dev-lock-${{ matrix.python }}.fresh.txt
          retention-days: 30

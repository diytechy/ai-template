# The HATS ROSTER — the declared expert perspectives every applicable
# decomposition must face (SN-036; ruled at OI-19, 2026-08-13).
#
# THIS FILE IS OWNER TEXT, NOT AGENT TEXT. THIS ROSTER CONTAINS SIXTEEN HATS,
# all approved in the kit. (History in one clause: six drafted 2026-08-13, the
# UX pair and the five aspect hats added by ruling 2026-08-13q/s, the three
# cross-cutting lenses drafted 2026-08-16 — CONSISTENCY ruled that day,
# INTEGRITY-RECOVERABILITY and PRODUCT-FITNESS on 2026-08-17.) YOU ARE EXPECTED TO EDIT
# IT — cut the hats that do not earn their place in your project, add the ones
# your domain needs, and rewrite every `applies_when` against YOUR vocabulary.
# That editing is not optional politeness: a roster inherited unread is
# ceremony, and `applies_when` is only honest when someone who knows the
# project wrote it.
#
# A HAT IS NOT A PERSON AND NOT A STAKEHOLDER ROW. It is a QUESTION that must
# be put to every decomposition it applies to. A domain expert may have no
# needs of their own, yet their perspective constrains someone else's need —
# that constraint is what a hat carries.
#
# ONE TABLE PER HAT, keyed by the hat's NAME (upper-case, `-` joined):
# `[hat.SECURITY]`. The name is the id; there is no numeric id space and
# therefore no inert `-000` example row — this file ships CONTENT, because an
# empty roster would be a form with nothing behind it. A duplicate name is a
# parse error, which is the carrier doing what a check would otherwise have to.
#
# THREE KEYS, ALL REQUIRED (`scripts/hats.py` refuses a row missing any):
#
#   applies_when   The condition a composer EVALUATES to decide whether this
#                  hat is put to a given decomposition. A closed, evaluable
#                  grammar — never prose:
#
#                      always
#                      scope == "template"        (also !=)
#                      tags contains "unattended"
#
#                  (`kind` is the other scalar field the grammar admits. It is
#                  declared by NO registry since the status unification, so a
#                  hat keyed on it matches nothing — do not copy it as a model.)
#
#                  Clauses join with `or` OR with `and`, not both in one
#                  expression (no precedence to guess at). A field the composer
#                  did not declare satisfies NO condition — an undeclared fact
#                  is not a true one — so a hat keyed on a fact your registries
#                  do not yet carry stays silent rather than firing blindly.
#   asks           The question put to the decomposition, in the second person.
#                  This is the text that lands in the brief.
#   listens_for    The FAILURE CLASS this hat catches. A hat that names no
#                  failure is refused as ceremony — if you cannot say what goes
#                  wrong when nobody wears it, delete the row.
#
# ONE OPTIONAL KEY, beyond the three required ones (`scripts/hats.py`
# OPTIONAL_KEYS): a row may ALSO carry `knowledge`, a list of repo-relative
# paths or pack names the hat's perspective draws on, e.g.
#
#     knowledge = ["docs/knowledge/security-review.md"]
#
# Omitting it is fine on every row — it does not become mandatory by being
# declared here, that is the point of the separate set. If present it must be
# a non-empty list of non-empty strings; `hats.py` refuses a bare string, an
# empty list, or a non-string entry, naming `knowledge` in the refusal. Any
# OTHER key stays refused as unknown — this does not loosen the strict
# posture, it names the one exception to it. Nothing in this shipped template
# declares `knowledge` on any row: filling it in is the same owner-editing act
# as everything else here, once you have knowledge packs worth citing.
#
# ABSENCE IS OPT-OUT, MALFORMED IS A REFUSAL. Delete this file and every
# composer proceeds without hats; leave it here broken and the composer
# refuses loudly rather than quietly decomposing with no perspective at all.
#
# WHAT IS NOT BUILT YET (stated so its absence is not mistaken for coverage):
# SN-036 also requires a per-decomposition RECORD of which hats were applied
# and what each produced. Injection is the half that changes what decompositions
# produce; the record only proves it happened, and it is a later artifact class.
# Nothing gates on a hat today.
#
# THREE KINDS OF SILENCE, DISTINGUISHED. A silent hat is one no row in your
# registries can wake. There are exactly three reasons for that, and you must
# be able to say which one applies to each silent hat you keep:
#
#   1. SILENT BY DESIGN — opt-in by tagging. The hats gated on `render`, `ui`,
#      `safety`, `legal` or `personal-data` ship OFF and switch on the moment
#      you tag work with that token — no `enabled` field, using the grammar's
#      own rule that an undeclared field satisfies no condition. This silence
#      ends by itself the first time the tag appears; it is a choice, not a
#      defect.
#   2. SILENT BY DEFECT — the predicate keys on a fact your registries will
#      never carry, so no clause can ever fire. Re-point it or cut it. The
#      kit's own FIRST-RUN-ADOPTER was here once, keyed on an undeclared
#      `scope` field; fixed at WI-453 by keying it on tags real work carries.
#   3. SILENT BY DOMAIN — the predicate is sound and the opt-in deliberate, but
#      the hat's FAILURE VOCABULARY has essentially no referent in what you
#      build, so switching it on buys one strained row and a great deal of
#      ceremony. SAFETY is in that position for a developer-tooling product —
#      its harm vocabulary (person, property, environment) reaches almost
#      nothing there — while for a vehicle, a medical device or a machine that
#      moves it is the first hat you should read. Keep such a hat only if its
#      domain is yours.
#
# `scripts/hats.py audit` prints each conditional hat's reach, which is how you
# tell a hat that is silent from a hat you assumed was firing.

[hat.SECURITY]
applies_when = "always"
asks = """What secret, credential, or irreversible action does this touch — and which requirement says who may reach it?"""
listens_for = """A decomposition that spends a secret, or takes an action nothing can undo, with no requirement naming the authority for it."""

# The stable name includes first use of an upgraded kit. The seed predicate is
# still tag-based: an untagged policy-only change will not select it. Adoption
# and resync reviews must check actual applicability through spine-authoring;
# widening this charter does not silently change a project's chosen predicates.
[hat.FIRST-RUN-ADOPTER]
applies_when = 'tags contains "scripts" or tags contains "templates" or tags contains "process"'
asks = """Can a new or upgrading adopter complete this using the shipped guidance while preserving project-owned content, policy meaning, accepted evidence and unfinished work?"""
listens_for = """A requirement satisfiable only with undocumented project knowledge, or an upgrade that breaks supported callers, changes preserved content's meaning, loses accepted evidence or strands unfinished work."""

[hat.UNATTENDED-OPS]
applies_when = 'tags contains "unattended" or tags contains "loop"'
asks = """What does this look like at 3am with no human — what happens when its input is missing, stale, or half-written?"""
listens_for = """A failure that pages nobody: a silent degrade, a partial write left behind, an unbounded retry, a green that is green because nothing looked."""

[hat.CROSS-PLATFORM]
applies_when = 'tags contains "scripts" or tags contains "launcher" or tags contains "shell"'
asks = """Which of Windows, macOS and Linux breaks this — path separators, line endings, console encoding, shell quoting, case sensitivity?"""
listens_for = """A rule that is true only on the author's platform and shipped as if it were universal."""

[hat.MAINTAINER]
applies_when = "always"
asks = """Can a reader two years from now tell why this exists, and what would break if they deleted it?"""
listens_for = """A requirement whose reason lives only in the session that wrote it, leaving the next reviser unable to tell load-bearing from accident."""

[hat.TEST-ENGINEER]
applies_when = "always"
asks = """Which test, analysis, critique or attestation detects a violation, how is its ability to detect it demonstrated, and what does that evidence leave unverified?"""
listens_for = """An obligation with no suitable verification, or evidence that passes without examining the claimed behavior or hides its limits."""

[hat.UX-DESIGNER]
applies_when = 'tags contains "render" or tags contains "ui"'
asks = """Who reads this surface, what decision are they making on it, and does the layout put that first?"""
listens_for = """A surface that renders every fact it has instead of the one the reader came for."""

[hat.UX-ENGINEER]
applies_when = 'tags contains "render" or tags contains "ui"'
asks = """Does this hold up at the real widths, themes and content volumes — and what does it do when the data is empty, huge, or malformed?"""
listens_for = """A view verified only by reading its generator, never by looking at it rendered."""

[hat.SAFETY]
applies_when = 'tags contains "safety"'
asks = """How can this harm a person, property or the environment if it behaves incorrectly, and what requirement bounds that harm?"""
listens_for = """A hazardous outcome with no requirement naming its bound, or a mitigation asserted with nothing verifying it."""

[hat.LEGAL]
applies_when = 'tags contains "legal"'
asks = """What licence, contract or regulation constrains this, and does the decomposition record which obligation each part discharges?"""
listens_for = """An obligation assumed to be someone else's, or a dependency whose licence terms nothing states."""

[hat.DATA-PROTECTION]
applies_when = 'tags contains "personal-data"'
asks = """What personal data does this touch, on what basis, for how long, and who can reach it?"""
listens_for = """Personal data crossing a boundary with no stated basis, retention limit or access rule."""

# SHIPS `always`, unlike the three tag-gated aspect hats above it: accessibility
# should always be considered, and a hat gated on an `a11y` tag is only as good
# as somebody remembering to type `a11y`. If your product has no human-facing
# surface at all, gate it (`tags contains "a11y"`) rather than deleting it — the
# question is cheap to answer "no surface here" and expensive to never ask.
[hat.ACCESSIBILITY]
applies_when = "always"
asks = """Can someone using a keyboard, a screen reader, or a low-vision setting complete this — and is that stated as a requirement rather than hoped for?"""
listens_for = """A surface whose acceptance names only how it looks to a sighted mouse user."""

# SHIPS `always`, same reason: a budget is declared before you learn you needed
# one, so "does this need a bound, and if so what is it" belongs on every
# decomposition rather than on the ones somebody tagged `perf`. The QUESTION is
# conditional even though the hat is not — "no bound needed here" is a one-line
# answer, which is what stops an always-on budget lens from presupposing a
# budget for every subject. Gate it if your project genuinely has no speed or
# size, provider-usage or operator-time obligation anywhere; review its relevance
# against your own vision before changing it.
# The resource question includes provider usage and operator time; a measured
# bound is still conditional, not a budget demanded of every small change.
[hat.PERFORMANCE]
applies_when = "always"
asks = """Does this need a measurable bound on speed, size, provider usage or operator time? If yes, what is the budget, under which conditions is it measured, and what happens when it is exceeded?"""
listens_for = """A material resource or operating-cost risk left unassessed, a budget with no measurement behind it, or incomparable or unavailable measurements reported as a reliable total."""

# Nothing else here asks whether two surfaces agree. The UX pair asks about ONE
# surface's priority and ONE surface's conditions; MAINTAINER reaches
# one-definition-per-term, which is about definitions, not presentation. Any
# product with more than one status-bearing surface has this gap. Ruled in
# 2026-08-16 in the kit's own roster, and `always` there for the reason the
# provisional block below gives: the finding WAS unreachability, so a tag would
# reproduce the defect the charter answers. Ruled for the kit, not for you —
# the editing instruction at the top of this file governs every charter here.
# Semantic agreement also spans requirements, interfaces and policy readers;
# the surface examples above describe the original finding, not its full scope.
[hat.CONSISTENCY]
applies_when = "always"
asks = """Where else does this fact, state or action appear, and do the related requirements, interfaces, policy readers and user surfaces agree in meaning, vocabulary and interaction?"""
listens_for = """Related contracts or readers disagreeing after a one-sided change, a rule stated differently by template and instance, or one meaning given conflicting words, visual treatments or interaction behavior."""

# --- two CROSS-CUTTING lenses, ruled into the kit 2026-08-17 ------------------
#
# Added after a blind re-derivation exercise found the roster above had no
# charter for either of them, and ruled in on that finding. They are `always`
# on purpose and that is the half to argue with first: in each case the finding
# was that the lens was UNREACHABLE, so gating one on a tag would reproduce the
# defect it was drafted to answer. RULED FOR THE KIT, NOT FOR YOU — the editing
# instruction at the top of this file governs every charter here, and this file
# is seeded into your repo once and preserved thereafter, so narrowing an
# `applies_when` or deleting a block survives a kit re-sync. If a charter is
# right for your project but fires too widely, the cheap fix is a predicate,
# not a deletion. Read both before you keep either: an unread hat is the
# ceremony this roster exists to prevent.

# Atomic writes, bounded claims and crash recovery normally arrive only through
# UNATTENDED-OPS, which is tag-gated — so an ATTENDED session that half-writes a
# durable record gets no lens at all, though the corruption is identical and the
# next reader is the same reader.
[hat.INTEGRITY-RECOVERABILITY]
applies_when = "always"
asks = """If this is interrupted mid-write — a kill, a crash, a process that dies holding it — what does the next reader find, and what gets the system back to a state it can name?"""
listens_for = """A durable artifact updated in place with no all-or-nothing guarantee; a claim or reservation nothing can reclaim once its holder is gone; a recovery path written only for the unattended run when the same corruption is reachable attended."""

# Every other charter here is engineering-side: they harden a decomposition and
# none of them asks whether the thing being hardened is still the right thing. A
# roster without this lens will be thorough about the wrong work, and the needs
# most about a stakeholder's own understanding are the ones it leaves unowned.
[hat.PRODUCT-FITNESS]
applies_when = "always"
asks = """Who asked for this, which stated need does it still serve, and would the person who asked recognise this as the outcome they wanted?"""
listens_for = """A decomposition faithfully hardening the wrong thing: an obligation no stakeholder can be named for, a need whose subject has moved while its text stayed, work justified by the machinery it continues rather than by an outcome anyone wants."""

# interfaces.template.toml — INTERFACE DEFINITIONS. Copy to
# docs/requirements/interfaces.toml and replace the `-000` example row.
#
# ONE ROW IS ONE OWNER, ITS FAR SIDE, AND A TYPED STATEMENT OF THE INFORMATION.
# An interface says what the information plugs into, who is on the other end
# and which way it runs, and what the data is — and nothing else. A call is
# one row (its requestors send the arguments and get the return); a CLI's
# arguments and its exit code are two rows (requestors in, consumers out). A
# module that reads one file and writes another is two rows. A seam that
# bundles several kinds is split, or declared once with its constituents on
# `carried_by`.
#
# THE DEFINITION LIVES BESIDE THE CODE, NOT IN A CELL. What the owner promises
# — the flags, the schema, the guarantees — is stated once, in the owner's own
# header: a module declares its seams on a line OPENING `Contracts: IF-###,
# ...` and states each as a `Contract IF-###:` block under it (that exact
# opener — a bare `IF-###:` is ordinary prose). A registry, config or hook file
# carries the same marker and bodies in a `#` header at its top.
# `gen_arch_map.py --contracts-doc` harvests them into a committed,
# freshness-gated interface reference. The row declares the seam and stops.
#
# BOUNDARY vs INTERNAL, and it is the distinction worth learning first. A
# crossing of your SYSTEM boundary is a row in registries/external.template.toml,
# not here — that is the tier your system requirements form around. A row here
# ties BACK to one, directionally, only when it REALIZES a crossing:
#
#     interface_from_external = "B-##"   the crossing comes IN
#     interface_to_external   = "B-##"   it goes OUT
#     (both, when the crossing is in/out)
#
# A row with neither key is an internal seam. That absence IS the statement —
# there is no column to set to "internal" and get wrong.
#
# THE FIELDS.
#
# owner — REQUIRED. The providing THING, in the one spelling `consumers` uses:
# a module path (`scripts/check`), a file or directory path (`docs/stack.ini`,
# `docs/work/`), or an `external:` party (`external:git`). NEVER a requirement
# or design id: the requirement the seam answers to is REACHED through the
# owner — the design rows whose `module` names it, or the `Implements:` line
# in its header — and is not stated on the row. An id-shaped owner is a
# finding; a module-shaped owner that reaches no requirement is a warning. A
# GENERATED FILE IS OWNED BY THE MODULE THAT WRITES IT; a hand-edited file is
# owned as itself and declares in its own header.
#
# requestors / consumers — THE FAR SIDE NAMES THE DIRECTION; exactly ONE of the
# two is set, a LIST either way. `requestors` put information INTO the surface
# the owner defines (they call the function, invoke the CLI, set the env var,
# write the file); `consumers` take what the owner emits (they read the file,
# the exit code, the stdout). The owner defines the surface in both cases; the
# key says which way the information runs, so one row is one direction by
# construction. Both or neither is a finding. Name the sides you have
# MEASURED, and an open-ended class as `external:<class>`. Every endpoint cell
# is validated against the tree, warn-first: an endpoint that resolves to
# nothing is named individually. The `external:` PREFIX says an endpoint is
# deliberately outside this tree; a path your `docs/declared-absences`
# declares counts as resolved.
#
# channel — REQUIRED, CLOSED: what crosses, typed.
#     cli        an invocation surface: argv flags and arguments
#     exit-code  a finite code alphabet a process returns
#     stdout     text a process emits: findings, a report, a verdict line
#     file       a file or directory medium with a schema
#     call       an in-process API another module imports
#     env        an environment variable or launcher slot
#     git        repository state: refs, trailers, a staged diff, hook argv
#     bytes      opaque content: fetched sources, a vendored tree
# A dial read from a config file is `file` (the medium is the file; `data`
# names the key). A source tree walked by AST is `file`.
#
# data — OPTIONAL: the finite alphabet when there is one (`0 pass · 1 fail · 2
# usage`, `off | ask | deny`) or a one-clause schema pointer. 160 characters at
# most; no work-item id, no decision citation, no rationale connective; a named
# symbol or path must resolve (warn-first). The row's typed summary — not the
# definition, which lives in the header.
#
# rationale — OPTIONAL: WHY the seam is drawn here. It takes the ARGUMENT,
# never the CITATION — no work-item id, ruling, review-round or open-item
# reference, decision id, edit verb or date stamp; that history belongs in the
# log. An EMPTY string is a hard carrier refusal: carry the key or omit it.
#
# verified_by — OPTIONAL, and LEAVING IT EMPTY IS A REAL ANSWER: "this seam is
# verified in its own right". Fill it only for a LOW-LEVEL seam whose honest
# answer is that the parent functionality's tests cover it — a `TC-###` or an
# `LLR-###`. Checked to RESOLVE, warn-first; nothing reads whether the named
# test really exercises the seam. DELETE the key unless this seam really rides
# its parent's coverage.
#
# carried_by — OPTIONAL interface composition: a constituent naming the bundle
# that carries it (`carried_by = "IF-###"`). A constituent is still one owner
# and one channel; the bundle is the unit a consumer pins. The carriage graph
# must resolve and be acyclic; depth past 2 warns. An empty cell IS "not a
# constituent".
#
# version — the contract version the other side codes against.
#
# status — the one maturity field, the SPINE'S words: `Drafted` | `Approved`,
# shared with external.toml. `Founded` is NOT APPLICABLE to this tier — it
# means settled AND DEMONSTRATED, and an approval says the seam is AGREED.
# Flipping a cell to `Approved` is a human act in a reviewed commit.
#
# component — OPTIONAL `CMP-###` membership tag.
#
# notes — OPTIONAL free prose; argument, never citation. Honesty valve: the
# FIRST word `source` (produces output, consumes nothing declared) marks the
# row's owner, `sink` (consumes, produces nothing) marks its far side,
# silencing the missing-seam coverage warn for that side.
#
# THE GATE IS ARMED: a row whose owner declares it but states no `Contract
# IF-###:` body is a `check_trajectory --strict` finding — an interface with
# no definition — and so is a source whose header the contract grammar refuses
# (its declared rows count as unstated). An owner that declares NOTHING only
# WARNS: the row is on the migration list, visible in the reference's summary
# line, and is not gated. An `external:`-owned
# row is stated by the kit module on its FAR SIDE (the consumer that reads the
# external surface, or the requestor that drives it), the one in-tree home of
# our reading of that surface. The retired cells — `contract`, `provider`,
# `req_refs`, `signal`, `signal_note` — are `trace.py --strict` findings
# wherever they still appear. A CSV registry may carry the same `#` header:
# every kit reader strips a leading comment block before the header row.

[interface.IF-000]
owner = "EXAMPLE - delete on first real entry"
requestors = ["a-side-that-puts-information-INTO-the-owner - set THIS or consumers, never both"]
consumers = ["a-side-that-takes-what-the-owner-emits - set THIS or requestors, never both"]
channel = "exit-code"
data = "0 pass | 1 fail | 2 usage - the alphabet when finite, else a schema pointer, 160 chars at most"
rationale = """WHY the seam is drawn here - the argument, never the citation: what breaks without the seam and which alternative lost, in prose that stands alone, with no work-item id, ruling, sitting, review-round or open-item reference, decision id, edit verb or date stamp - that history belongs in the log (process.md section 3). Empty is allowed; delete the key rather than leaving it blank."""
verified_by = "TC-000"
carried_by = "IF-000"
version = "v1"
status = "Drafted"
interface_from_external = "B-000"
interface_to_external = "B-000"
component = "CMP-000"
notes = """`carried_by` here names IF-000 only because a template declares every column the schema states and IF-000 is the only id in this file - a row may NOT carry itself, and the check says so. DELETE the key unless this seam really rides a larger one. Honesty valve: put the word source (produces output, consumes nothing declared) or sink (consumes, produces nothing) here to silence the missing-seam coverage warn - source marks this row's owner, sink marks its consumers. The example carries BOTH tie-back keys because a template declares every column the schema states - a real row carries only the crossing direction(s) it realizes, and MOST rows carry neither, so delete them unless this row really realizes a declared boundary crossing. A tie-back on an internal seam is the one error this schema cannot catch for you: a crossing id that resolves is indistinguishable from a crossing id that belongs."""

# interfaces.template.toml — INTERFACE DEFINITIONS. Copy to
# docs/requirements/interfaces.toml and replace the `-000` example row.
#
# An IF row states what one interface concretely IS — one testable line: CLI
# flags and exit codes, or the file schema.
#
# BOUNDARY vs INTERNAL, and it is the distinction worth learning first. A
# crossing of your SYSTEM boundary is a row in registries/external.template.toml,
# not here — that is the tier your system requirements form around. A row here
# ties BACK to one, directionally, only when it REALIZES a crossing:
#
#     interface_from_external = "B-##"   the crossing comes IN
#     interface_to_external   = "B-##"   it goes OUT
#     (both, when the crossing is in/out)
#
# A row with neither key is an internal seam. That absence IS the statement —
# there is no column to set to "internal" and get wrong.
#
# THE TWO SIDES ARE `provider` AND `consumers`, and the row is read
# provider -> consumers. `consumers` is a LIST and is required; `provider` is a
# single endpoint and is OMITTED wherever `owner` derives it (see DERIVABILITY
# below).
#
# ENDPOINTS ARE VALIDATED AGAINST THE TREE. Both cells are checked, warn-first,
# against the arch-map modules and then against the files and directories that
# actually exist; an endpoint that resolves to NOTHING is named individually,
# because a spine file that migrated (`.csv` -> `.toml`) and left its seam row
# behind is the failure this rule was written for.
#
#     consumers = ["external:downstream adopter"]
#
# The `external:` PREFIX is how a row says an endpoint is deliberately outside
# this tree — an adopter, `git`, an agent CLI, an upstream doc set. It is a value
# convention rather than a column so that it rides the carrier unchanged and
# cannot drift out of sync with the endpoint it qualifies. Mark the ones that are
# genuinely external; leave everything else resolvable, and fix it when it is not.
# A path your `docs/declared-absences` already declares (an opt-in layer you have
# switched off) counts as resolved — the reason is stated there, once.
#
# `consumers` names EVERY consuming side the contract really has — one seam
# read by three modules is one row with three consumers, not three rows copying
# one `contract`. Name the readers you have MEASURED, not everything that might
# read it. A published medium whose readers are open-ended names the class
# (`external:downstream adopter`) alongside the in-tree readers.
#
# OWNER is the ONE row that is answerable for this interface, id-typed, and it is
# POLYMORPHIC: an `SR-###` or a design-tier `LLR-###`, resolved against whichever
# registry the prefix names. Both resolve, but they are not equally right:
# point `owner` at the DESIGN tier wherever a design row exists for the
# owner-side endpoint — the design row is what concretely serves the seam —
# and fall back to the `SR-###` only while no design row exists yet. Exactly
# one — naming nobody and naming several are both findings.
#
# `owner` is NOT `req_refs`. `req_refs` lists every requirement the seam realizes
# or relies on, and several is normal; `owner` names the one that ANSWERS for it.
# Reading who serves a seam used to take three cells (a `direction` flag plus two
# endpoint cells whose meanings swapped on it). This is that answer in one cell.
#
# ON A ROW WHOSE MEDIUM IS CONSUMED, `owner` NAMES THE PROVIDER OF THAT MEDIUM —
# never the module that merely holds the consuming code. One row per medium, with
# its verified readers in `consumers`, beats one row per reader.
#
# DERIVABILITY — WHEN TO OMIT `provider`. Where `owner` is a design row naming
# exactly ONE module, that module IS the provider, so the cell is left OUT: a
# derivable cell is a second spelling of a fact that already has a home, and the
# two spellings can disagree. State `provider` only where the derivation cannot
# run — an `SR-###` owner (a requirement names no module) or an owner whose
# `module` names several (which derives a SET, not the fact) — or where the
# provider is a file medium or an `external:` party, which no design row is.
# A warn-only advisory names any row that states a provider its owner derives.
#
# THERE IS NO DIRECTION COLUMN, deliberately. Flow is the SHAPE of the row
# (provider -> consumers), not a flag beside it — and a "provide" implies
# orientation without meaning the interface is actually directional: a bolted
# joint, a mated connector and a thermal path each have an owner and no flow at
# all. What a `Consumes` row used to declare — this cross-component edge is
# INTENDED, and this row discharges it — is unchanged and is read off the
# endpoint pair. Ownership lives in `owner`, and only there.
#
# CARRIED_BY is OPTIONAL interface composition: a constituent naming the bundle
# that carries it (`carried_by = "IF-###"`). Six seams riding one larger seam
# name the same carrier id, so granularity stops being a forced choice — declare
# the bundle AND its parts and decompose only as far as is useful. The carriage
# graph must resolve and must be acyclic, and depth past 2 warns. Most rows carry
# nothing, and an empty cell IS "this is not a constituent".
#
# STATUS is the one maturity field, and it is the SPINE'S field and words: a
# CLOSED vocabulary, `Drafted` | `Approved`, shared with external.toml.
# `Founded` is NOT APPLICABLE to this tier and never will be — it means
# settled AND DEMONSTRATED, and an approval says the seam is AGREED, not that
# it was demonstrated. Flipping a cell to `Approved` is a human act in a
# reviewed commit. Do NOT carry a second maturity column beside it; the whole
# reason this tier has one field is that it once had two that meant different
# things on the same row (the retired `Stability`, and a `Status` column that
# shipped undeclared — this field carries that name honestly now).

[interface.IF-000]
provider = "EXAMPLE - delete on first real entry"
consumers = ["another-module-or-file-or-external-actor"]
contract = """One seam, one testable line: CLI flags + exit codes, or the file schema. Provider is the side the contract is served FROM - a module path, or the file medium itself (module->file->module dataflow, so a shared file like docs/stack.ini is a hub node many modules read); consumers are the sides that read it - modules, or an external actor (downstream adopter / git / agent CLI). Provider is OMITTED on a row whose owner derives it."""
signal = "discrete"
signal_note = """Signal is a CLOSED vocabulary: discrete (a finite enumerable alphabet - exit code, gate name, status enum, dial) or variable (unbounded content - prose, file bytes, a count, a duration). If BOTH cross, the row is variable, and this cell says why."""
rationale = """WHY the seam is drawn here - the argument that would otherwise squat in Contract. Empty is allowed; a Contract cell that argues (because / rather than / so that / since) is what this column exists to take. It takes the ARGUMENT, never the CITATION: state what breaks without the seam and which alternative lost, in prose that stands alone, with no work-item id, ruling, sitting, review-round or open-item reference, decision id, edit verb or date stamp - that history belongs in the log (process.md section 3)."""
req_refs = ["SR-000"]
owner = "SR-000"
carried_by = "IF-000"
version = "v1"
status = "Drafted"
interface_from_external = "B-000"
interface_to_external = "B-000"
component = "CMP-000"
notes = """`carried_by` here names IF-000 only because a template declares every column the schema states and IF-000 is the only id in this file - a row may NOT carry itself, and the check says so. DELETE the key unless this seam really rides a larger one. Honesty valve: put the word source (produces output, consumes nothing declared) or sink (consumes, produces nothing) here to silence the missing-seam coverage warn - source marks this row's provider, sink marks its consumers. The example carries BOTH tie-back keys because a template declares every column the schema states - a real row carries only the crossing direction(s) it realizes, and MOST rows carry neither, so delete them unless this row really realizes a declared boundary crossing. A tie-back on an internal seam is the one error this schema cannot catch for you: a crossing id that resolves is indistinguishable from a crossing id that belongs."""

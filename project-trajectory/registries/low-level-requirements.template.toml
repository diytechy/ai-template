# Design expectations (LLR-###) — the TOML registry CARRIER.
#
# ONE TABLE PER ROW, id-keyed with the prefix retained and the key BARE:
# `[design.LLR-000]`. Refs are typed arrays, `Phase` is an int, and an EMPTY
# CELL IS AN ABSENT KEY — omit a key rather than setting it to "".
# A duplicate id is a parse error, which is the carrier doing what a check
# used to (docs/process.md; the carrier's reader is scripts/spine_carrier.py).
#
# THE `-000` ROW BELOW IS THE SCHEMA. There is no header line to declare a
# column, so this example row is the only place the vocabulary is written
# down: it sets EVERY key the tier has, with the guidance for each as its
# value. Delete it on the first real entry. A key the tier does not declare is
# refused when the registry is read: a design row carries no `module`,
# `code_symbol` or `component` (scripts/migrate_carrier.py --llr-trace-cells
# removes them from an older registry).
#
# A design row decomposes an SR or another design row (process.md §4, the
# requirement tree): a TOP-LEVEL row names its SRs in `sr_refs` and no
# `parent`; a CHILD names its one parent design row in `parent` and carries no
# `sr_refs`. The example row below shows both keys only because it is the schema.
[design.LLR-000]
sr_refs = ["SR-000"]
parent = "LLR-000"  # OPTIONAL. A child row's ONE parent design row, in place of sr_refs: its SRs are read up its parent chain, and only a top-level row names them. Omit it on a top-level row. A parent is discharged by its own integration test case beside its children's, whose cases do not discharge it.
hat_refs = ["SECURITY"]  # OPTIONAL. The declared perspective(s) in docs/requirements/hats.toml raised AT THIS DESIGN DECOMPOSITION - by roster NAME, and a real shipped one so this row resolves when copied. NEVER a copy of the parent SR's cell: a row's EFFECTIVE set is DERIVED (this row's own refs, unioned with its SR parents'), so re-ruling one requirement propagates to every child on the next read and corrects no LLR cell at all. Copying down instead would turn one re-ruling into a sweep over every child - the hand-maintenance this design exists to escape, moved one tier down and multiplied. An ABSENT cell means NOT RECORDED, never "no perspective reached this row".
title = "EXAMPLE - delete on first real entry"
detail = """Decomposition/implementation detail — NOT a paraphrase of the SR (reference it by id). The observable obligation: inputs, outcome, refusal boundary. Name no file, symbol or component: the code points up to this row with an `Implements:` tag, and where the row sits is derived from the interfaces it constrains and those its verifying test cases name."""
rationale = """WHY this decomposition, not another — what breaks without it, and which alternative was ruled out. Optional: a short mechanical row's why is its parent SR's. Never provenance: no work-item id, ruling, sitting, review-round or open-item reference, decision id, edit verb or date stamp — the history belongs in the log (process.md §3)."""
test_refs = "(see TC)"
status = "Accepted"
phase = """Delivery phase = the parent SR's Phase (a bare integer; blank only on a pre-acceptance Drafted row). See process.md 'Phased delivery'."""
constrains = ["IF-000"]  # OPTIONAL. The interface(s) in docs/requirements/interfaces.toml whose BEHAVIOUR this row states: the interface row states the form, this row what must be true of what crosses it. Written like sr_refs; an id naming no live interface row fails `trace.py --strict`. A POINTER: changing it moves no accepted text and is routed to adjudication. Every interface reaches a test case the harness runs through a row constraining it or a test case naming it (process.md §8); a row need not constrain any.
dimensions = "input=set{current,stale,missing}; mode=set{report,check}"  # OPTIONAL, beside `constrains` only: the closed input set of the behaviour across the constrained interface, in the permutation grammar (scripts/gen_cases.py; process.md 'Dimensional coverage'): name=range[min..max]; name=set{a,b}; name=bool; @full|@pairwise|@boundaries. Name inputs, never a flag or a parameter. A cell the grammar refuses, or one on a row constraining nothing, fails `trace.py --strict`; a constraining row without it is reported, never failing. Accepted text: changing it re-opens the row.
out_of_domain = "An input outside the dimensions is refused at the interface and changes nothing."  # OPTIONAL, beside `constrains` only: ONE sentence saying what the interface does with an input outside the dimensions, refused at the boundary or a declared state its form names. The same findings and class as `dimensions`.

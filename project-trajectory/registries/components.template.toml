notes = """Domain-neutral component registry (process-options.md 'Component layer'): the durable set-grained home for knowledge + lifecycle. Structure is DERIVED, never restated here - membership is a Component tag (;-joined CMP ids) on the primitive rows (LLR/IF/ASSET/PART); an IF with both endpoints in a CMP is internal, one endpoint in is the CMP's boundary. Category = software|physical|... (open set); Knowledge = ;-joined skill names / docs/knowledge/ labels / URLs; Status = Drafted|Approved|Founded - the ONE spine vocabulary, and CMP is the one off-spine tier that reaches Founded, because a demonstrated partition is a claim something computes; Standing = active|has-gap|deprecated (OPTIONAL, omit = active) - the SECOND axis, a lifecycle fact rather than a maturity, split out so neither has to be read through the other; SupersededBy names the successor CMP (lifecycle identity across a rewrite); PartOf nests components (tag primitives at the FINEST CMP; coarser membership derives). What a component DOES is not authored here at all - gen_components.py derives it into docs/requirements/components.derived.toml from the rows that carry the obligation (the retired DetailDoc column promised a prose home that was never built and that no script ever read). trace.py integrity-checks the CMP- id and resolves PartOf/SupersededBy + primitive Component tags. The declared components also bound the PROJECT_STATE How-SW dashboard top view at 10 items (top-level components + uncontained modules; check_trajectory warns / --strict-errors past it, opt-out docs/components-check - process-options.md 'Component layer'). Optional, off-spine like procurement/assets - this -000 row is inert and never blocks a gate."""


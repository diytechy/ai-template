[pytest]
# Test discovery + the tier markers the check harness selects with --tier.
# Mark each test with its tier, e.g.  @pytest.mark.smoke
# Tiers are cumulative in the harness: full = smoke+full, release = all three.
testpaths = tests
markers =
    smoke: fast, critical-path checks safe to run every iteration / on every push
    full: the full pre-merge suite (run on pull requests)
    release: slow / hardware / long-running / manual-adjacent; run at G-Release

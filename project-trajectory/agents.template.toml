# Model registry (the pair-row model) — TOML carrier.
#
# ONE TABLE PER ROW, id-keyed with the prefix retained: `[agent.OPENAI-GPT-5.2]`.
# An id containing a `.` MUST be quoted — `[agent."ANTHROPIC-OPUS-4.8"]` —
# because TOML reads a bare dot as a table path and the row's real id would
# silently disappear. An EMPTY CELL IS AN ABSENT KEY; a duplicate id is a parse
# error. The reader is scripts/agent_route.py through scripts/spine_carrier.py.
#
# THE `AGENTS-EXAMPLE-000` ROW IS THE SCHEMA: there is no header line, so that
# row is the one place every key is written down. Rows are INERT until
# docs/agents-enabled exists (the consent surface).
# One row = one (model x route) PAIR (capability-expansion.md C3). IDENTITY: Family (who trained it — the heterogeneity + scorer corroboration key), Model (the line identity, INCLUDING -pro/-flash tokens), Version (the COMPARABLE token only: a dotted numeric / date stamp / maturity tag — vendor aliases never go here). ACCESS: CmdTemplate + Env (KEY=value;KEY2=value2, merged over the inherited env at launch; empty Env = the ambient environment = today's behavior). Tier vocabulary: strong|medium|quick (legacy `weak` reads as `quick`). The Id is a free-form unique join key, NEVER parsed. Legacy: a Provider column with no Family reads Provider as Family.
# Version-less resolution: an agents-enabled token that is not an exact Id resolves over rows whose Family-Model matches (intra-line only), newest Version winning — dotted-numeric first, then maturity rank, then date stamp; preview/exp are skipped unless named or the only candidate; equal-key route pairs fall to registry row order. Override the maturity rank below; the default equals the built-in.
# tag-rank: ga>preview>beta>exp
# JOB TYPE -> PHASE, the one table (SN-026). A phase is what a session IS FOR, and `docs/agents-enabled` weights a model per phase (`ID  BUILD=3 REVIEW=0`). Planner=PLAN (strong; drafts scope). Implementer=BUILD (medium; the row BuildTier pins it per WI). Reviewer=REVIEW-A/REVIEW-B, umbrella token REVIEW (medium; fresh context, family differing from the implementer). Critic=CRITIQUE (strong; perceptual judgement, where capability and multimodal support decide). Adjudicator=ADJUDICATE (strong; rules on a CLAIM another session made - a partial close, an amendment's meaning-vs-clarity, a red TC under a closed row - and takes the reviewers' cross-family rule, because a judge sharing the judged party's family corroborates rather than checks). Arbiter=DUALPLAN-ARBITER, inside the dual-plan round only. Design-check=DESIGN-CHECK (strong; grind-through vs redesign). An UNKNOWN phase routes UP, never to a weaker tier.
# CmdTemplate prompt delivery: {model}/{prompt} substitute per-token. PREFER omitting {prompt}: the kit then pipes the prompt to the CLI's STDIN (build_argv/run_session), immune to the OS command-line cap and shell re-parsing - a Windows npm `.CMD` shim caps at 8191 chars and may reparse metacharacters under cmd.exe even when Python uses shell=False. For that reason, build_argv/run_session REFUSE {prompt} with a Windows .cmd/.bat shim; use a native executable or stdin. `claude -p` and `codex exec` both read the prompt from stdin when the arg is omitted. codex sessions additionally get `-o/--output-last-message` read back as the result (codex echoes the prompt into stdout).

[agent."ANTHROPIC-OPUS-4.8"]
family = "ANTHROPIC"
model = "opus"
version = "4.8"
tier = "strong"
cmd_template = "claude -p --model {model} --output-format json"
notes = "frontier tier; add your permission-bypass flag to run unattended"

[agent."OPENAI-GPT-5.2"]
family = "OPENAI"
model = "gpt-5.2"
version = "5.2"
tier = "strong"
cmd_template = "codex exec --json"
notes = """PROMPT via STDIN (no {prompt}: build_argv pipes it) - codex reads stdin, dodging the Windows codex.CMD 8191-char cmd.exe cap; third-party providers via the codex model_providers config"""

[agent.GOOGLE-GEMINI-3-PRO]
family = "GOOGLE"
model = "gemini-3-pro"
version = "3"
tier = "medium"
cmd_template = "gemini -p {prompt} --output-format json"
notes = """the CLI with documented exit codes; on Windows this requires a native executable (a .cmd/.bat shim is refused) or a stdin-capable template"""

[agent.AGENTS-EXAMPLE-000]
family = "EXAMPLE"
model = "example"
version = "0"
tier = "quick"
cmd_template = "your-cli -p {prompt}"
env = """KEY=value;KEY2=value2 - merged over the inherited environment at launch (the router / API-key selector; a second account is an [account.<ID>] table below). Absent = the ambient environment, which is the default behaviour."""
notes = """placeholder row (ends in -000, ignored) - copy a real row above and edit; Windows batch shims must use stdin instead of {prompt}"""

# ACCOUNTS (WI-798): a second account of one CLI is an `[account.<ID>]` table
# plus a qualified enable-list entry `ROUTE@ACCOUNT`, never a duplicated row.
# <ID> names the account's home directory, so it is portable: [A-Z0-9][A-Z0-9-]*
# (no dot) and not a Windows device name (CON, PRN, AUX, NUL, COM0-9, LPT0-9).
#   cli                  claude | codex | opencode | gemini: the CLI it signs into
#   notes                free text
#   env                  optional KEY=value;KEY2=value2, composed AFTER the route's
#                        env; a name both declare is refused, and it never names
#                        the CLI's home variable
#   token_file_variable  optional (claude only): the environment VARIABLE naming
#                        the file that holds the account's long-lived token
#                        (`claude setup-token`); never a path
#   verified             "<YYYY-MM-DD> <cli version>" once the login-isolation
#                        check passed; absent or empty on a login-authenticated
#                        claude account = UNVERIFIED, printed (never refused)
# The account's home is <user config dir>/project-trajectory/accounts/<ID>/
# (%APPDATA% on Windows; $XDG_CONFIG_HOME, else ~/.config, on POSIX), outside
# every checkout and shared by every repository on the box. A login account's
# home is yours to provision (e.g. with CODEX_HOME set to "<home>", run
# `codex login`); the kit
# creates only a token account's home, empty, and never reads, moves, copies or
# deletes what a CLI writes there. An unqualified entry runs under your own
# ambient login, with the route's env, exactly as before.
# The example is the coordinator's adjudicator. coordinator_adjudicate.py's
# default entry is ANTHROPIC-OPUS-STRONG@ADJUDICATOR, and an entry's route side
# must be a row of this registry, which ships no ANTHROPIC-OPUS-STRONG row. So
# uncomment the table, name <your strong Anthropic route's id>@ADJUDICATOR on
# docs/agents-enabled and pass that entry to the coordinator with --route (or
# declare your route under the id ANTHROPIC-OPUS-STRONG, which the default
# names), and set the variable to your token file (dev-setup).
#[account.ADJUDICATOR]
#cli = "claude"
#notes = "the coordinator's adjudicator, on a long-lived token (claude setup-token)"
#token_file_variable = "AGENT_CLAUDE_TOKEN_FILE"
# Router = a PAIR row with an Env selector; SAME Family (a router is access, not identity) so it is NOT a diverse reviewer from its native sibling:
# ANTHROPIC-OPUS-4.8-ROUTER,ANTHROPIC,opus,4.8,strong,claude -p --model {model} --output-format json,ANTHROPIC_BASE_URL=https://your-router.example,pin LiteLLM off the known-malicious PyPI builds 1.82.7/1.82.8

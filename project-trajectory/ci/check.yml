# Reference CI workflow for the trajectory kit (GitHub Actions).
#
# Copies to .github/workflows/check.yml. It runs the SAME harness you run
# locally (`scripts/check.py`) so a green CI means exactly what a green local
# run means — no second, drifting definition of "passing". Swap the Python
# setup + install step for your stack; keep the single `check.py` invocation so
# the gate definition stays in one place.
name: check
on:
  push:
    # llm/** = the agent iteration branch (process-options.md "Agent iteration
    # branch & sync"), so the process floor also runs remotely on agent legs.
    branches: [main, "llm/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# One live run per ref: stacked pushes cancel the superseded run instead of
# queueing redundant ones behind it.
concurrency:
  group: "check-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    # Platforms: keep this list in sync with docs/status.md "Supported platforms".
    # The kit's own scripts are cross-platform, so the choice is driven by YOUR
    # project's deps/toolchain. A portable project should "hold its own" on every
    # OS it claims — uncomment the rows below; a project that can only build on one
    # platform trims to it. Don't claim CI for an OS your deps can't run on: a red
    # cell nobody can fix is worse than an honest single-platform matrix.
    strategy:
      fail-fast: false   # see every platform's result, not just the first failure
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest      # Apple Silicon (arm64)
          # - windows-latest
    runs-on: ${{ matrix.os }}
    # Cap a wedged run well under GitHub's 360-minute default; raise it if your
    # release tier legitimately runs longer.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      # Edit to your real dependencies. This only INSTALLS the tools; what the
      # harness RUNS (the format/lint/test commands, tiers, coverage) is
      # declared once in docs/stack.ini and executed by check.py below — so CI
      # never restates a check command. The reference harness uses ruff + pytest
      # (+ pytest-cov); trace.py and gen_arch_map.py are stdlib-only.
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          # Then install YOUR project's deps — pick the one that fits and let it
          # fail loudly (don't add `|| true`, which would hide an install error):
          #   pip install -e .                 # if you have a pyproject.toml
          #   pip install -r requirements.txt  # if you pin deps in a file

      # Tier by moment. WHICH tier runs at which moment is declared ONCE in
      # `docs/stack.ini` `[ci-tiers]`; the `if:` guards and `--tier` flags below
      # are that declaration's CI half, and the kit pins the two together. To
      # raise or lower CI scope, edit the declaration — not these lines.
      #   The STAGE is orthogonal and comes from the repo's committed `docs/stage`
      # file (check.py reads it and runs every step declared at or above that
      # rung), so CI enforces what the project has actually earned — a
      # freshly-scaffolded DevStg-Reqs repo is green, and more steps select when
      # artifacts are approved in a reviewed commit and docs/stage is regenerated
      # (it is DERIVED from the artifact states by derive_stage.py, not hand-set;
      # the derived-stage step guards its freshness). In CI we do NOT pass
      # --lenient: a missing required tool must fail, so checks can't be
      # silently skipped.
      - name: Smoke (push)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: python scripts/check.py --tier smoke

      - name: Full suite (pull request)
        if: github.event_name == 'pull_request'
        run: python scripts/check.py --tier full

      - name: Release suite (tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python scripts/check.py --stage all --tier release
          python scripts/gen_release_checklist.py --version "${GITHUB_REF_NAME}"

      # Publish the generated reports even on failure, for review.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.os }}
          path: |
            docs/test/report.md
            docs/test/report.html
            docs/test/perf-report.md
            docs/release-checklist.md
            docs/releases/
          if-no-files-found: ignore
